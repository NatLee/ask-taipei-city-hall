- - 聽說今年溫泉季主打科技感，能否解釋說明？
  - 特別開發「溫泉女巫GO！」App，透過BEACON藍芽感應技術與AR實境技術，消費者可以利用App連結到各溫泉旅館，直撥電話和導航，也能連結到各商家及景點，裡頭有詳細的介紹，甚至包括營業時間及交通資訊等等通通報給你知，帶大家以最輕鬆的方式玩北投、泡溫泉。過去民眾來到北投參加溫泉季，我們會發送活動手冊給大家，今年一樣會製作紙本手冊，但所有最棒最精彩的活動內容和優惠訊息在我們這支App就可以都看的到，即日起還能參加巫金幣、集點數換好康活動，不但有各項來店禮免費兌換，還有Lucky7抽獎活動，自9/27到11/27，七檔抽獎，每月逢七開獎，把北投知名的溫泉飯店包含水美溫泉會館、春天酒店、北投麗禧溫泉酒店、大地酒店、北投老爺酒店、日勝生加賀屋國際溫泉飯店、三二行館頂級溫泉客房住宿券免費抽回家 !    另外還有Pepper會到北投的溫泉飯店為大家服務，溫泉季五天到北投水美溫泉會館就可以和Pepper互動了，歡迎大家到現場體驗。
