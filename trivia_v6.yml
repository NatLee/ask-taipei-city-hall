  - 1.洽辦單位：社會局社會救助科。2.應備文件：檢具下列文件，於期限內提出申請(每學年度第一學期為十一月三十日前，每學年度第二學期為五月三十一日前提出申請)。(1)學生證申請表1份（可自本局網站下載，下載路徑為本局首頁/社會救助/教育輔助/低收入戶就學生活補助）(http：//www.dosw.tcg.gov.tw/)。(2)學生證正反面影本1份。（已蓋註冊章戳） (3)學生本人之郵局存摺封面影本1份。3.資格：本市列冊有案之低收入戶符合下列規定者：(1)年滿18歲以上，未滿25歲。(2)就讀臺灣地區經教育部承認之高中（職）、二專、五專、二技、四技或大學之法定修業年限以內之學生。但延長修業年限、就讀大學校院碩、博士班、空中大學、空中專科、學分班、遠距教學之學生，不予補助。(3)基於福利不得重複請領原則，已接受其他政府單位同性質補助，擇一領取。但接受政府全額收容安置者，不得再申請本補助。4.補助內容：每人每月6,115元(105年起)。每學年度第一學期發給期間為每年七月至十二月，第二學期發給期間為每年一月至六月。申請人各學年或學期間之銜接如有中斷（如休學、復學、退學、重考等），寒假或暑假期間之補助費不予發給。。
- - 公司沒有選擇舊制勞工，都已經改選新制為什麼還收到稽催欠繳公文？
