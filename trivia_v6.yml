  - 下載表格檔案(如後附件)
- - 雇主如何設置哺(集)乳室？設置標準為何?
  - 依據勞動部「哺集乳室與托兒設施措施設置標準及經費補助辦法」第3條規定，雇主設置哺(集)乳室標準如下：ㄧ、哺(集)乳室之設置位置，應便於受僱者使用，設有明顯標示，且鄰近洗手台或提供洗手設施。二、哺(集)乳室應具隱密、安全性及良好之採光、通風。三、哺(集)乳室應具下列基本設備：(ㄧ)靠背椅。(二)桌子。(三)電源插座。(四)母乳儲存專用冰箱。(五)有蓋垃圾桶。四、訂定哺(集)乳室使用規範。聯絡科室：勞資關係科 林育滋聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7010
- - 公務機關年度零用金額度不敷使用，如何辦理提高額度？
  - 請檢附最近六個月之零用金備查簿詳細資料影本，行文本府財政局申請提高額度。
- - 何類憑單須遞送紙本至財政局？
  - 支票註銷申請書及超過電子支付限額之付款憑單，須列印紙本憑單並加蓋印鑑章後遞送至財政局，以憑辦理。（請參閱臺北市市庫集中支付作業程序第7點）。
- - 已送件至財政局之各類憑單如要辦止付，應如何處理？
  - 機關因故要辦理止付，應於財政局未完成該憑單審核前即通知財政局並經確認後，再傳送「各類憑單（電子支付文件）止付、退件通知書」至財政局支付科（傳真號碼27206207）辦理止付。
- - 請問退休人員領支票需要帶什麼證件及資料？
  - 1.如果本人領取，請記得帶付款憑單關係通知單、本人身分證件正本及印章。2.如果委託他人代領，請帶已填妥授權資料之付款憑單關係通知單、本人及代領人身分證件正本及印章。
- - 主辦單位、活動時間及地點？
  - 主辦單位：臺北市溫泉發展協會時間：5月1日(五)至3日(日)每日10：30至20：30地點：捷運新北投站旁南側道路
- - 活動內容為何？
  - 活動以「那卡西」為主題，連續舉辦3天，內容有豐富的地方文化表演、溫泉業者與文創展攤、愛心義賣、那卡西歡唱與競賽、露天電影院、公益捐血、北投公園淨園等。其中，5月1日(五)開幕活動邀請到曾在中國好聲音大放光彩的歌手張玉霞到場再現那卡西風華，以及阿發師的創意花卉擺盤示範(一)開幕活動：5月1日(五)10：30－11：30。(二)那卡西之夜： 5月1日(五)18：00－20：30，現場除了知名那卡西歌手張玉霞到場演唱外，還開放民眾現場歡唱，廣邀民眾盡情歡唱。(三)公益捐血：5月2日(六)10：00－17：00。(四)那卡西之星：5月2日(六) 18：00－20：30，舉辦那卡西歌唱比賽，共分為長青、青壯及親子組3種組別。(五)北投公園淨園：5月3日(日)10：30－12：00。(六)露天電影院：5月3日(日) 18：00－20：30，播映「KANO」電影。
- - 請問「那卡西之夜」需事前報名？
  - 活動無需事前報名，民眾可至舞臺現場向服務人員告知即可。
- - 請問「那卡西之星」需事前報名？
  - 活動需事先報名，即日起至5月1日(五)向主辦單位報名（電話02-2895-5418）。報名組別共分長青組、青壯組、親子組，每1組限15個名額。
- - 請問「北投公園淨園活動」時間為何，需事前報名？
  - 活動需事先報名，即日起至5月2日(六)向主辦單位報名（電話02-2895-5418），將贈送精美禮品。當天集合地點：美代溫泉會館門口前淨園路線：第1條路線從中山路沿北投公園外側清掃。第2條路線從北投公園內，沿著北投公園內溪流向下清掃。第3條路線沿著光明路，從北投公園外側向下清掃，直到七星公園。
- - 何處可獲取相關活動訊息？
  - 可至台北市溫泉發展協會網站（www.taipeisprings.org.tw）查詢，或電洽台北市溫泉發展協會02-2895-5418。
- - 該如何前往活動地點？
  - 建議可搭乘捷運淡水線至北投站，再轉乘新北投支線至新北投站，出捷運站可抵達活動會場。
- - 交通管制措施為何？
  - 自4月30日（四）08：00至5月3日（日）24：00捷運新北投站旁南側道路進行路段管制，但無影響公車行駛路線，惟民眾出入七星公園地下停車，請由育仁路進出。
- - 請問活動手冊可到哪裡索取？
  - 即起於臺北市旅遊服務中心、捷運新北投站、北投溫泉博物館、北投圖書館、凱達格蘭文化館、以及台北市溫泉發展協會會員店家等，每點放置500份，數量有限，發完為止。
- - 檢舉交通違規時效如何認定？
  - (一)新修正「道路交通管理處罰條例」第7條之1，自103年8月15日施行。針對民眾檢舉交通違規案件，新增「交通違規行為終了日起逾7日之檢舉，不予舉發」規定。(二)該條文施行後，民眾檢舉發生超過7日之交通違規，依法不得舉發，有關各警察機關受理民眾檢舉交通違規案件日期之認定及處理原則如下： 1、採書面資料掛號郵寄方式提出者，以交郵當日之郵戳為準。 2、採電話方式提出，以受理電話檢舉之日為準。 3、親送檢舉資料，以受理機關(單位)收受之日為準。 4、他機關(單位)轉送，以他機關(單位)收受之日為準。 5、循網路系統：（1）向公路主管或警察機關檢舉交通違規專區提出，以系統完成受理之日為準。（2）向政府機關(首長)信箱提出，以該單位完成受理之日為準。
- - 「1999臺北市民當家熱線」派工回歸警察局110專線受理相關問題_行政
  - 一、人與動物噪音處理：一、警察機關受理噪音檢舉案件常見類型、法源依據及處理原則？ 常見有飼養犬隻吠叫、兒童樓板跑跳、吹（彈）奏樂器、汽機車防盜器及深夜喧嘩等行為產生之噪音。1、處理原則：（1）有公寓大廈管理委員會：員警受理民眾報案後，員警會先予以約制、勸導，若勸導不聽，有公寓大廈管理委員會，應優先請管委會或管理負責人予以制止或按規約處理，經制止而不遵從者，依「公寓大廈管理條例」第16條，報請本市建築管理處裁處。以下為無公寓大廈管理委員會，依據社會秩序維護法第72條處理（2）員警當場發現妨害安寧情事：員警獲報有妨害安寧情事前往處理，當場聽聞確有噪音傳於戶外（類似刑法上現行犯之概念），依據司法院刑事廳81年3月27日廳刑一字地329號函復臺灣高等法院釋以：「妨害安寧常為鄰居報警，處理警員身歷其境，噪音確實傳於戶外，又經鄰居證實難以忍受者，始可認其為妨害公眾安寧。」惟類此狀況必須有「報案之鄰居具名指證並製作筆錄」，加上處理員警之職務報告，始能依社維法移送法辦。（3）員警未當場發現妨害安寧情事：員警獲報有妨害安寧情事前往處理，而未當場發現者，除依規定對被檢舉人以書面作成勸導外，並應對被檢舉處所之鄰居實施訪查，如經相鄰住戶3戶以上具名指證確有妨害安寧情事，始得以社維法移送法辦。2、警察機關處理噪音案件之法律依據：（1）社會秩序維護法第72條：有左列各款行為之一者，處新台幣6,000以下罰鍰：A、於公共場所或公眾得出入之場所，酗酒滋事、謾罵喧鬧，不聽禁止者。B、無正當理由，擅吹警笛或擅發其他警號者。C、製造噪音或深夜喧嘩，妨害公眾安寧。（2）違反社會秩序維護法案件處理辦法A、第11條：本法第72條第3款所稱噪音，係指噪音管制法令規定之管制標準以外，不具持續性或不易量測而足以妨害他人生活安寧之聲音。B、第30條：違反本法行為之事實，應依證據認定之。前項行為經警察人員當場發現者，其書面報告得為證據。行為人或嫌疑人之自白，非出於不正方法，且經調查與事實相符者，得為證據。二、請問汽車防盜器製造的噪音，是否有法可管？汽車防盜器製造的噪音，屬不具持續性或不易量測而足以妨害他人生活安寧之聲音者，由警察局依社會秩序維護法第七十二條第三款辦理。請逕向當地警察機關反映，民眾若要陳情檢舉可撥110電話報案。三、鄰居製造噪音影響生活安寧？對於住家產生的噪音，如防盜器、兒童嬉笑聲、鄰居進出門走動聲、住家養狗叫聲及澆水滴落聲等不具持續性或不易量測的噪音，請向警察局反映，依社會秩序維護法第72條第3款或向大樓管理委員反映，依公寓大廈管理條例第16條規定處理。
- - 「1999臺北市民當家熱線」派工回歸警察局110專線受理相關問題_交通
  - 一、移動式道路障礙物檢舉：一、「1999臺北市民當家熱線」回歸110的派工項目有哪些？     (一)人與動物噪音處理。(二)違規停車處理。(三)移動式道路障礙物檢舉(路霸)案件。(四)攤販案件。(五)塞車擋道案件。二、警察局的5項派工案件，為何要回歸110報案系統派遣？本局現有110受理、通報及管制案件等機制完善，且執勤員警對於受理民眾檢舉案件，相較1999話務人員更能於第一時間提供民眾更專業之應答與處置，因此，基於簡化受理程序、提升專業度及強化勤務合理派遣等因素，回歸由本局110受理。三、移動式道路障礙物之定義及「1999臺北市民當家熱線」受理103年1月1日至103年12月31日移動式道路障礙物案件數。答：(一)有關「移動式道路障礙物」大致可分為一般性及營業性，一般性係指住戶或商家於道路上置放花盆、破桌椅、拒馬、圓錐及其他可移動式之物品(雜物)，妨礙大眾對於該道路之使用；另營業性係指洗車、修車業者利用道路作為違規修車及洗滌車輛之行為。(二)自103年1月1日至103年12月31日止，共計受理1萬2,972件。四、110報案系統和「1999臺北市民當家熱線」有何不同？110報案優點何在？       1999針對來電者資料予以保密，權責機關不會知道來電者個人資料，對於檢舉人的個人資料，採取嚴格控管措施，惟警察勤(業)務涉及公權力威信、執法強度及相關事證搜集等重要程序，交由110報案系統，優點如下：      (一)加速反映時間：110報案系統具「衛星定位」功能，能正確派遣事故(件)地點，加速員警到達現場處理時間。      (二)維護公權力威信：經由110專業員警受理報案，可詳實向檢舉人告知正確處理程序，提高民眾信任度，同時透過「衛星定位」，降低民眾謊報或濫訴情形。      (三)尊重警察專業：警察執法及取締勤(業)務，環環相扣，業管單位不同，經由110報案系統可確實控管時效，提高執法品質，避免發生各機關互推權責。五、民眾打110反映交通、治安等相關問題，需要留下個人資料嗎？   110話務人員受理案件時會請報案人提供姓名(或姓氏)及聯絡資訊，除避免產生謊報或濫訴情形外，影響被檢舉人權益及提高處理時效，以維護民眾報案品質。二、違規停車處理：一、「1999臺北市民當家熱線」回歸110的派工項目有哪些？    (一)人與動物噪音處理。(二)違規停車處理。(三)移動式道路障礙物檢舉(路霸)案件。(四)攤販案件。(五)塞車擋道案件。二、警察局的5項派工案件，為何要回歸110報案系統派遣？本局現有110受理、通報及管制案件等機制完善，且執勤員警對於受理民眾檢舉案件，相較1999話務人員更能於第一時間提供民眾更專業之應答與處置，因此，基於簡化受理程序、提升專業度及強化勤務合理派遣等因素，回歸由本局110受理。三、自1999市民熱線開辦至今，貴局由1999市民熱線轉接之「違規停車」受理件數？未發現件數？舉發情形？    本局交通大隊自1999市民熱線97年7月開辦至103年12月31日止，共受理94萬4?407件，經員警到場未發現件數18萬7?342件，約占全部檢舉案件19.84%，舉發件數47萬5?633件，占50.36%，餘由員警當面勸導或見警駛離。四、110報案系統和「1999臺北市民當家熱線」有何不同？110報案優點何在？          1999針對來電者資料予以保密，權責機關不會知道來電者個人資料，對於檢舉人的個人資料，採取嚴格控管措施，惟警察勤(業)務涉及公權力威信、執法強度及相關事證搜集等重要程序，交由110報案系統，優點如下：      (一)加速反映時間：110報案系統具「衛星定位」功能，能正確派遣事故(件)地點，加速員警到達現場處理時間。      (二)維護公權力威信：經由110專業員警受理報案，可詳實向檢舉人告知正確處理程序，提高民眾信任度，同時透過「衛星定位」，降低民眾謊報或濫訴情形。      (三)尊重警察專業：警察執法及取締勤(業)務，環環相扣，業管單位不同，經由110報案系統可確實控管時效，提高執法品質，避免發生各機關互推權責。五、民眾打110反映交通、治安等相關問題，需要留下個人資料嗎？         110話務人員受理案件時會請報案人提供姓名(或姓氏)及聯絡資訊，除避免產生謊報或濫訴情形外，影響被檢舉人權益及提高處理時效，以維護民眾報案品質。三、塞車擋道一、「1999臺北市民當家熱線」回歸110的派工項目有哪些？     (一)人與動物噪音處理。(二)違規停車處理。(三)移動式道路障礙物檢舉(路霸)案件。(四)攤販案件。(五)塞車擋道案件。二、警察局的5項派工案件，為何要回歸110報案系統派遣？本局現有110受理、通報及管制案件等機制完善，且執勤員警對於受理民眾檢舉案件，相較1999話務人員更能於第一時間提供民眾更專業之應答與處置，因此，基於簡化受理程序、提升專業度及強化勤務合理派遣等因素，回歸由本局110受理。三、自1999市民熱線開辦至今，貴局由1999市民熱線轉接之「塞車擋道」受理件數？執行情形？         A.本局交通大隊自1999市民熱線「塞車擋道」項目自103年5月開辦至103年12月31日止，共受理2?243件，經員警到場後針對現場壅塞成因，如：違規停車、交通事故、號誌故障等，妥適排除，以維交通順暢。四、110報案系統和「1999臺北市民當家熱線」有何不同？110報案優點何在？          1999針對來電者資料予以保密，權責機關不會知道來電者個人資料，對於檢舉人的個人資料，採取嚴格控管措施，惟警察勤(業)務涉及公權力威信、執法強度及相關事證搜集等重要程序，交由110報案系統，優點如下：       (一)加速反映時間：110報案系統具「衛星定位」功能，能正確派遣事故(件)地點，加速員警到達現場處理時間。       (二)維護公權力威信：經由110專業員警受理報案，可詳實向檢舉人告知正確處理程序，提高民眾信任度，同時透過「衛星定位」，降低民眾謊報或濫訴情形。       (三)尊重警察專業：警察執法及取締勤(業)務，環環相扣，業管單位不同，經由110報案系統可確實控管時效，提高執法品質，避免發生各機關互推權責。五、民眾打110反映交通、治安等相關問題，需要留下個人資料嗎？         110話務人員受理案件時會請報案人提供姓名(或姓氏)及聯絡資訊，除避免產生謊報或濫訴情形外，影響被檢舉人權益及提高處理時效，以維護民眾報案品質。
- - 「1999臺北市民當家熱線」派工回歸警察局110專線受理相關問題_勤指
  - 一、原1999受理警察局業管之派工項目有那些？（一）人與動物噪音處理。（二）違規停車處理。（三）移動式道路障礙物檢舉（路霸）案件。（四）攤販案件。（五）塞車擋道案件。 二、為何將1999派工案件回歸由警察局110專線受理？   警察局原設有110報案專線，為簡化受理流程及強化勤務派遣效   能，是故回歸警察局110專線受理。三、1999受理警察局業管之派工及110受理案件數每年各約幾件？統計103年1999轉介派工共計26萬3,485件；110受理報案數計有68萬3,681件。四、處理員警態度不佳或未到場處理該如何處理？    撥打110檢舉後將交由督察單位依規定查處。五、撥打110報案有關治安或交通問題，會不會知道檢舉人年籍等相關基本資料？110報案系統會強制顯示報案人電話及地址，以利後續的聯繫處理或服務，至於年籍資料，不會要求報案人一定要留。
- - 交通維持捷運萬大線工程路線範圍為何？
  - 捷運萬大－中和－樹林線工程（簡稱萬大線）採中運量捷運系統興建，路線總長度為22.1公里，萬大線自中正紀念堂站轉乘交會站起，往西行經南海路、西藏路、萬大路後，地下穿越新店溪進入新北市永和區保順路、保生路、中山路、中和區連城路、土城區金城路、中華路，跨越大漢溪至樹林中華路、八德街、大安路及中正路，沿中正路北行至迴龍萬壽路口附近接新莊線。捷運萬大線行經主要行政區為臺北市中正區及萬華區，新北市永和區、中和區、土城區、板橋區、樹林區、新莊區及桃園縣龜山鄉等。目前執行萬大線第一期工程，由臺北市中正區中正紀念堂站起，至新北市土城區金城路止，全長9.5公里，均為地下段，沿線設置9座地下車站(LG01站∼LG08A站)和1座平面機廠。
- - 交通維持捷運萬大線臺北市轄段第一區段標工程範圍及車站位置？
  - 臺北市政府捷運工程局南區工程處負責第一與第二區段標監造施工，臺北市轄段第一區段標工程，設計標號為DQ121標，路線自羅斯福路與南海路口之LG01站與中正紀念堂站銜接，向西沿南海路於林業試驗所與國語實小間設置LG02站，經和平西路接西藏路，於中華路與汀洲路間之忠義國小附近設置LG03站，再轉萬大路至LG04站（不含）止，共有3座車站及3段潛盾隧道。
- - 交通維持捷運萬大線臺北市轄段第二區段標工程範圍及車站位置？
  - 臺北市轄段第二區段標工程，設計標號為DQ122標，路線自臺北市萬大路東園國小旁開始，向西沿萬大路經果菜市場穿越新店溪進入新北市永和區保順路、保生路（永平國小前）、轉中山路、中和區連城路（景平路口）。LG04站在臺北市萬大路，於長泰街與東園街間之東園國小附近，LG05站在新北市永和區保生路永平國小前，共有2座車站及2段潛盾隧道。
- - 交通維持捷運萬大線LG01~ LG05車站工程發包施工現況及目前辦理進度？
  - 發包施工現況：   CQ840區段標(含LG01中正紀念堂站、LG03廈安站等)：已於105年11月23日決標、106年2月6日開工，全部工程預定114年 1月完工。   CQ842標(LG02植物園站)：工程初期須辦理遺址搶救作業，已  於103年10月25日決標、103年12月11日開工，全部工程預定111年12月完工。   CQ850A區段標(LG04加蚋站)：已於105年11月8日決標、105年12月31日開工，全部工程預定112年5月完工。   CQ850區段標 (LG05永和站)：已於104年11月11日決標、105年1月19日開工，全部工程預定112年5月完工。  目前辦理進度： 　　捷運萬大線LG01~ LG05車站工程辦理進度現況，請詳捷運局南區工程處官方網址：http：//www.sdpo.dorts.gov.taipei首頁之「施工管理E化平台」。
- - 交通維持捷運萬大線CQ842標的工程內容為何？
  - 捷運萬大線CQ842標LG02車站工程已於103年12月11日開工，施工廠商為大陸工程股份有限公司，本工程主要工程內容為LG02車站站體土建工程、LG02至LG03及LG02至LG01潛盾隧道、國語實小共構大樓基礎工程、林業試驗所育東、育西分構大樓、植物園遺址搶救、國語實小變電站工程及植栽移植工程等。LG02車站位於林業試驗所與國語實小間之南海路下方(道路寬度16.36公尺)，將以明挖覆蓋工法構築地下3層島式月臺車站，站體長度約126公尺、寬度約15.9公尺、開挖深度約25.5公尺，將於南海路南側(國語實小共構大樓)、北側(林試所育西樓)各設置一處出入口，本工程除捷運工程外，因車站位於「植物園遺址」範圍內，故車站站體、出入口、通風井及共構大樓等範圍，將於施工前先進行文化遺址搶救，遺址搶救的成果亦規劃於日後車站內常態展示。
- - 交通維持何謂「植物園遺址」？與捷運萬大線LG02植物園站工程有何關係？
  - 植物園遺址為1900年發現，當時稱為「大加蚋堡貝塚」，發現有陶器、石器及玉器等，植物園遺址自早期至近代包含：訊塘埔文化（年代距今約4600~3500年間）、圓山文化（年代距今約3200~2500 年間）、植物園文化（年代距今約2200~1800 年間）、十三行文化（年代距今約1400~350 年間）、近現代文化（年代約18~20 世紀）等，範圍約以植物園為中心，北側分布至南門國中附近，東側至南海學園、教育資料館附近，西、南界則約沿現今三元街一帶。由於捷運萬大線CQ842標LG02植物園站，全區均位於已知的植物園遺址範圍之內，基於遺址保護、研究及「文化資產保存法」、「遺址監管保護辦法」之規定，工程施工前將進行全面性的搶救發掘作業，搶救發掘深度約為地表下0至6公尺（發掘至文化層結束為止）之地層內各階段的文化遺留、自然遺物及遺跡等。未來車站內建築裝修設計概念，特別融入歷史博物館建物及植物園文化遺址等環境特質及意象，藉地下車站空間，導入認識歷史遺址與文化資產的情境，使捷運車站除運輸功能外，同時展現教育及歷史傳承的功能；遺址發掘過程中出土之部分文物、文化層之地層剖面及發掘過程攝錄影像，屆時亦將配合於捷運車站、出入口與國語實小共構大樓等空間常態展示，型塑「地下文物藝廊」的氛圍。
- - 臺北市在什麼地方接種公費疫苗可免收掛號費及診察費?
  - 至臺北市立聯合醫院附設12區院外門診部（如附件）接種公費疫苗可免收掛號費及診察費。
- - 交通維持捷運萬大線LG02站之位置，路面下方之植物園遺址，施工期間如何兼顧遺址搶救保護？
  - 萬大線LG02站施工前，將於遺址範圍內，先以人工淺挖，進行局部遺址挖掘搶救，至車站施工開挖階段，再以人工作業進行遺址全面搶救之淺挖，待全部遺址搶救挖掘作業完成，始繼續進行車站主體開挖，以兼顧遺址之搶救保護。
- - 交通維持捷運萬大線及信義線東延段動工後，如何減輕對周邊的交通及居民生活環境造成影響？
  - 捷運萬大線及信義線東延段均依審核通過各階段之交維計畫施工，並指派義交協助指揮，以減少對沿線交通造成影響。施工先期工程完成後，將進行道路淺挖架設覆工版，供施工後期於道路下方進行車站站體開挖施作，以減輕對鄰近居民之影響。
- - 代辦工程捷運局南區工程處代辦社會局「大安老人服務暨日間照顧中心新建工程」案之位置、工程內容及時程為何？
  - 位於臺北市大安區信義路4段99巷與四維路76巷交叉口東南角，基地面積620平方公尺，興建地下2層樓、地上6層樓之建築物。103年11月24日設計標決標予盧俊廷建築師事務所，並於104年12月1日取得建造執照後，於105年5月31日開工，預定107年3月完工後交由社會局辦理營運管理事宜。
- - 代辦工程大安老人服務暨日間照顧中心新建工程案完成後之效益為何？
  -   老人服務中心：可提供較寬敞新穎之文康休閒活動場地，預計一年可提供2萬人次老人活動服務。   老人日間照顧中心：預計同一時間收托35人，預計一年可提供9,240人次服務。 
- - 代辦工程捷運局南區工程處代辦教育局「臺北市和平國小暨籃球運動館新建工程案」之位置及工程內容?
  - 位於臺北市大安區辛亥路三段及敦南街76巷交叉口，大安運動中心旁，為地上六層、地下一層建築物。包括供2017世大運籃球賽之臺北和平籃球館、停車場(B1)及供學校教學與活動使用之教學暨行政大樓、活動中心(兼暖身館)等。總樓地板面積約4萬9,177平方公尺，本工程於103年4月8日開工，106年5月23日完工。
- - 本市如何提供公車間轉乘優惠？
  - 本市公車間轉乘優惠目前已提供幹線公車及市民小巴與公車間轉乘優惠，民眾於1小時內持電子票證搭乘本市幹線公車與幹線公車、幹線公車與市民小巴、幹線公車與其他雙北市區公車、市民小巴與市民小巴、市民小巴與其他雙北市區公車間路線雙向轉乘均可享公車1段票半價優惠，歡迎多加利用。
- - 本市違規停車之檢舉專線為何？
  - 自即日起請撥「110」(警察局專線)。至於路側交通設施牌面原標示「1999」市民當家熱線，本市交通管制工程處及停車管理工程處已持續更新修正中。
- - 目前臺北市是否有辦理「營造業經濟概況調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「營造業經濟概況調查」係由內政部營建署統籌規劃設計，各縣市政府為協辦機關，負責辦理各該轄區之調查業務。二、調查期間自104年6月1日起至30日止。凡從事營造業經主管機關核准登記有案者，且於103年底仍繼續營業之綜合營造業、土木包工業及專業營造業，均為調查對象。三、該調查主要目的係蒐集營造業最近一年廠商營運遭遇困難、需政府協助事項以及營業收支、完成工程總值、耗用材料總值、固定資產及存貨變動等資料，以了解營造業營運情形及變動趨勢，供為政府釐訂營造業政策及相關服務措施參考。調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請受訪廠商支持合作，提供正確詳實資料。四、該調查結果請逕至內政部營建署網站（http：//www.cpami.gov.tw/）「政府資訊公開 / 主動公開資訊 / 施政計畫業務統計及研究報告 / 營建統計資訊」項下之「營造業經濟概況」查詢。
- - 有關1999受理陳情案為何「需留真實姓名與聯絡電話」?
  - 有關1999話務中心受理陳情案，須請陳情人提供真實姓名與聯絡方式，係本府依據中央《行政程序法》第173條規定辦理，一方面為提供處理機關對陳情內容有疑問時可資聯絡詢問；另一方面也為避免謊報與不實檢舉案件，浪費行政資源。目前本市作法只是回歸法律規定。如您對陳情案件處理規定有疑義，話務中心亦可為您立案後轉交相關機關處理，但仍須請您提供真實姓名與聯絡方式。
- - 身心障礙者其子女就讀幼兒園是否有補助
  - 沒有，但如為身心障礙者本人就讀本市公私立幼兒園，則可提出申請身心障礙者日間照顧及住宿式照顧費用補助。
- - 發展遲緩兒就讀幼稚園是否有補助
  - 沒有，但如發展遲緩且領有本市身心障礙手冊或身心障礙證明者，就讀本市公私立幼兒園，則可提出申請身心障礙者日間照顧及住宿式照顧費用補助。
- - 身心障礙者日間照顧及住宿式照顧費用補助申請資格
  - 1、設籍並實際居住本市。2、有本市核（換）發或註記之身心障礙證明（或手冊）。3、最近1年居住國內超過183日。4、於各級政府主管機關最近一年評鑑（考核）合格之機構接受服務者。5、未領有政府其他相同性質之服務或補助。
- - 申請身心障礙者日間照顧及住宿式照顧費用補助應備文件
  - 1.申請表。2.本人國民身分證影本。3.領有身心障礙證明者另須附身心障礙需求評估結果證明文件。4.機構入住合約書或服務契約書。5.於公私立幼兒園接受服務者須檢附繳費收據。6.於護理之家（含屬老人福利機構之長期照顧機構、老人養護機構附設之長照床者）接受服務者請檢附醫師診斷證明書正本（註記插有氣切、鼻胃、導尿三管之ㄧ）。7.於臺北市精神復健機構接受服務者檢附醫師轉介單。8.於外縣市機構接受服務者，除新成立未滿一年者外，應檢附經該縣市主管機關最近一年評鑑（考核）合格之相關證明文件。
- - 身心障礙者日間照顧及住宿式照顧費用補助洽辦單位
  - 臺北市政府社會局身心障礙者福利科。聯絡人：托育小組，聯絡電話：1999(外縣市請撥打(02)2720-8889)轉分機6963；傳真電話：(02)2720-9229。
- - 身心障礙者日間照顧及住宿式照顧費用補助內容
  - (一)一般身分之身心障礙者：1、列冊低收入戶者全額補助。2、中低收入戶或家庭總收入平均未達當年度每人每月最低生活費2倍者補助75％。3、家庭總收入平均在當年度每人每月最低生活費2倍以上未達3倍者補助50％。4、家庭總收入平均在當年度每人每月最低生活費3倍以上未達4倍者補助25％。(二)身心障礙者年滿30歲或年滿20歲其父母之一方年齡在65歲以上(適用於身心障礙福利機構)：1、列冊低收入戶者全額補助。2、中低收入戶或家庭總收入平均未達當年度每人每月最低生活費2倍者補助85％。3、家庭總收入平均在當年度每人每月最低生活費2倍以上未達3倍者補助70％。4、家庭總收入平均在當年度每人每月最低生活費3倍以上未達4倍者補助60％。5、家庭總收入平均在當年度每人每月最低生活費4倍以上未達5倍者補助50％。6、家庭總收入平均在當年度每人每月最低生活費5倍以上未達6倍者補助40％。(三)家庭中有2名以上身心障礙者(適用於身心障礙福利機構)：1、列冊低收入戶者全額補助。2、中低收入戶或家庭總收入平均未達當年度每人每月最低生活費2倍者補助85％。3、家庭總收入平均在當年度每人每月最低生活費2倍以上未達3倍者補助70％。4、家庭總收入平均在當年度每人每月最低生活費3倍以上未達4倍者補助60％。5、家庭總收入平均在當年度每人每月最低生活費4倍以上未達5倍者補助50％。6、家庭總收入平均在當年度每人每月最低生活費5倍以上未達6倍者補助40％。(四)惟50歲以上未滿65歲實際進住老人長期照顧機構之養護型者，依臺北市政府社會局103年度身心障礙者日間照顧及住宿式照顧費用補助實施計畫第2點：「（二）50歲以上未滿65歲於老人長期照顧機構之養護型接受服務者，準用臺北市政府社會局辦理老人收容安置補助實施計畫。」，以本局老人收容安置補助等相關規定核予補助。
- - 身心障礙者日間照顧及住宿式照顧費用補助申請流程
  - 持應備文件至社會局提出申請→經受理並審核→完成核定並公文通知→按月由提供服務機構或服務單位掣據請款→撥款。
- - 設籍本市身心障礙者安置在外縣市相關養護機構，如果未具低收入戶資格，可以申請日間照顧及住宿式照顧費用補助嗎？
  - 日間照顧及住宿式照顧費用補助因申請人的經濟狀況與障礙類別等級核予補助金額，故未具低收入戶資格一樣可提出申請。
- - 長期抽痰進住護理之家者，可申請身心障礙者日間照顧及住宿式照顧費用補助嗎?
  - 不符申請條件，因長期抽痰不符合本補助實施計畫規定之插管（含氣切管、鼻胃管、導尿管）情形。
- - 申請身心障礙者日間照顧及住宿式照顧費用補助，代理人可否為機構相關人員?
  - 不可。
- - 以低收身分申請身心障礙者日間照顧及住宿式照顧費用補助，低收身分(福利身分改變)被註銷，其身心障礙者日間照顧及住宿式照顧費用補助如何處理?
  - 由本局依規定重新審核，依一般身分核予補助。
- - 申請身心障礙者日間照顧及住宿式照顧費用補助，合約書上看不出入住日期，如何處理?
  - 請民眾在申請表上填具進住日期，並簽名或蓋章(依民眾填具的日期認可)。
- - 民眾進住護理之家是否需檢附外縣市評鑑合格証明書辦理?
  - 如入住外縣市護理之家者，應檢附該機構最近一次經當地主管機關評鑑(考核)合格證明；如為新成立未滿一年者，則應檢附合格立案證明影本。
- - 「呼吸照護病房」是否就是「護理之家」?
  - 「呼吸照護病房」非等同於「護理之家」，亦非屬提供日間照顧及住宿式照顧服務機構或單位。
- - 身障手冊到期後已完成重新鑑定，原申領之日間照顧及住宿式照顧費用補助如何處理?
  - 影印手冊、註明機構名稱以傳真或逕送本局辦理延長補助期限，如領有鑑定新制之身心障礙證明者，除影印身心障礙證明外，另須檢附身心障礙需求評估結果相關證明文件。(本局地址：臺北市信義區市府路1號1樓東北區、傳真：02-27209229)。
- - 身心障礙者領有日間照顧及住宿式照顧費用補助期間，如需轉換進住機構，應如何辦理機構的銜接
  - 原機構或服務單位函報離院→新機構或服務單位函報進住(或家屬切結)檢附合約書影本(進住護理之家者需附診斷証明書，註明插三管之一)→注意日期須銜接，不可中斷(如中斷就須重新申請)。
- - 申請設立合作社流程
  - 因合作社法未有籌組相關規定，請發起人依下列程序辦理：（1）洽承辦人詢問應檢附之申請表件，並由承辦人審視表件後，請發起人續行辦理相關事項之準備。（2）召集創立大會。（3）會後一個月內辦理成立登記。
- - 休閒農場內的各項設施有沒有高度的限制？
  - 1.休閒農場內各項設施，均應符合休閒農業經營目的，無礙自然文化景觀為原則。 2.農特產品調理設施建築物高度不得大於四．五公尺；其他休閒農業設施涉及建築物高度者，依現行建築管理法規辦理或不得超過10.5 公尺。3.但眺望設施或因配合公共安全或環境保育目的設置，經提出安全無慮之證明，報請中央主管機關核准者，不在此限。
- - 網站客服信箱驗證碼一直出現驗證碼錯誤的訊息?
  - 有關客服信箱驗證碼錯誤的問題，由於驗證碼有時效限制，若在該網頁停留時間太長會出現驗證碼錯誤之訊息，請更換驗證碼後再重新按下送出即可。
- - 勞工可以用通訊軟體(如：Line)向公司請假嗎?
  - 依勞工請假規則第10 條規定：「勞工請假時，應於事前親自以口頭或書面敘明請假理由及日數。但遇有急病或緊急事故，得委託他人代辦請假手續。辦理請假手續時，雇主得要求勞工提出有關證明文件。」。復依勞動基準法第70條規定，雇主僱用勞工人數在30人以上者，應依其事業性質，就請假等事項訂立工作規則，報請主管機關核備後並公開揭示之。同法施行細則第7條規定，請假等有關事項應於勞動契約中約定。爰勞工如確有請假之事由，雇主應依法給假。勞工請假時，若以通訊軟體（如：Line）告知雇主請假理由及日數，事後仍應依工作規則之規定或勞動契約之約定辦理請假手續。另因傳統或固定於雇主之設施內或指定場所提供勞務之型態不同，常有「工作時間認定」、「出勤紀錄記載」等爭議情事，為提供事業單位就工作者在外工作之「工作時間」認定及「出勤紀錄」記載，仍應依勞動部一○四年五月六日勞動條三字第一○四○一三○七○六號函勞工在事業場所外工作時間指導原則辦理。聯絡科室：勞動基準科承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7018、3325、3327、3349
- - 在事業場所外從事工作之勞工，其工作時間認定及出勤紀錄記載應注意哪些事項?
  - 一、可參照勞動部104年5月6日勞動條三字第1040130706號函發布之「勞工在事業場所外工作時間指導原則」。二、有關外勤勞工正常工作開始及終止之時間、延長工作時間(加班)之認定方式、休息時間及輪班之換班等有關事項，勞資雙方以書面勞動契約約定，並訂入工作規則為宜，避免事後爭議。三、「勞工在事業場所外工作時間指導原則」主要內容如下：1、規範在外工作勞工工時認定及出勤紀錄記載之共通性原則，並分別就新聞媒體工作者、電傳勞動契約工作者、外勤業務員及汽車駕駛等各類型應注意之特別事項細緻規定。2、為明確勞雇雙方權益，明訂勞資雙方應將工時、休息時間、延長工時等有關事項，以書面勞動契約約定並訂入工作規則。3、實務上，由於在外工作勞工之休息時間及工作時間分際模糊，明定雇主仍應依法給予勞工休息時間。4、有關延長工時部分：(1)雇主使勞工延長工時者，應記載交付工作之起始時間。勞工可自行記錄工作起迄時間，輔以通訊紀錄等送交雇主補登。(2)勞工於正常工時將結束時，認應繼續工作始能完成交付工作者，於完成工作後透過雙方約定方式回報雇主記載之。另明訂勞雇雙方得事先約定一定延長工時時數內，免除勞工回報延長工時及徵得雇主同意之程序。5、明定記錄在外工作勞工工時方式，非以簽到簿或出勤卡為限，如行車紀錄器、GPS紀錄器、手機打卡、網路回報、客戶簽單、通訊軟體、發稿紀錄、駛車憑單（派車單）及其他可供稽核出勤紀錄之工具。雇主於接受勞動檢查時，應提出書面紀錄。(勞動部網站資料：http：//www.mol.gov.tw/cht/index.php?code=list&flag=detail&ids=24&article_id=8950)聯絡科室：勞動基準科承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7018、3325、3327
- - 標誌牌面違規停車檢舉電話1999修改為110時程為何?
  - 配合違規停車檢舉案件由1999市民熱線轉由警察局110勤務專線受理，本處設置之騎樓人行道禁停、貨車及身障等標誌牌面，將配合修改牌面資訊，現在辦理相關作業中，已於104年12月31日完成更新。另新設牌面內容則已更新為110，以維護牌面資訊正確及完整。
- - 請問符合免費的癌症篩檢項目的資格為何？
  - 1.子宮頸抹片檢查：30歲以上女性(每年1次)。2.口腔黏膜檢查：30歲（含）以上抽菸或嚼（戒）檳榔之民眾或18-29歲且有嚼（戒）檳榔之原住民(每2年1次)。3.乳房X光攝影檢查(預約)：45-70歲以上或40-44歲具乳癌家族史（指祖母、外婆、母親、女兒、姊妹曾有人罹患乳癌）之女性(每2年1次)。4.大腸癌糞便潛血檢查：50-74歲之民眾(每2年1次)。
- - 那些交通違規行為可以勸導？
  - 依據違反道路交通管理事件統一裁罰基準及處理細則第十二條規定：行為人有下列情形之一，而未嚴重危害交通安全、秩序，且情節輕微，以不舉發為適當者，交通勤務警察或依法令執行交通稽查任務人員得對其施以勸導，免予舉發：(一) 有本條例第十四條第二項第二款、第二十五條第二項、第三十一條第五項、第四十一條、第四十四條第一項第一款、第三款至第七款、第五十二條、第六十九條第二項、第七十一條、第七十二條、第七十三條第一項第一款至第三款、第五款、第七十四條、第七十六條、第八十一條、第八十二條第一項第一款或第八十四條之情形。(二)駕駛四輪以上汽車於號誌燈號變換之際，因未能依號誌指示及時停止，致前懸部分伸越在機車停等區內，惟前輪尚未進入該停等區內。(三)駕駛汽車於號誌燈號變換之際，因未能依號誌指示及時停止，致前懸部分伸越停止線，惟前輪尚未超越該停止線。(四) 駕駛大型車輛在多車道右轉彎，因車輛本身、道路或交通狀況等限制，如於外側車道顯無法安全完成，致未能先駛入外側車道。(五) 駕駛汽車因上、下客、貨，致有本條例第五十五條之情形，惟尚無妨礙其他人、車通行。(六) 深夜時段（零至六時）停車，有本條例第五十六條第一項之情形。但併排停車、於身心障礙專用停車位違規停車或停車顯有妨礙消防安全之虞，或妨礙其他人車通行經人檢舉者，不在此限。(七)駕駛汽車因交通管制設施設置不明確或受他物遮蔽，致違反該設施之指示。(八)駕駛汽車在交通管制設施變換之處所，致無法即時依變換後之設施指示行駛。(九)駕駛汽車隨行於大型車輛後方，因視線受阻，致無法即時依標誌、標線、號誌之指示行駛。(十)駕駛汽車因緊急救護傷患或接送身心障礙者上、下車，致違反本條例規定。(十一)駕駛汽車行車速度超過規定之最高時速未逾十公里。(十二)駕駛汽車或慢車經測試檢定，其吐氣所含酒精濃度超過規定之標準值未逾每公升0.0二毫克。(十三)駕駛汽車裝載貨物超過核定之總重量或總聯結重量，未逾百分之十。(十四)駕駛汽車因閃避突發之意外狀況，致違反本條例規定。(十五)因客觀具體事實，致違反本條例規定係出於不得已之行為。(十六)其他經交通部及內政部會商核定之情形。行為人發生交通事故有前項規定行為，除本條例第十四條第二項第二款、第二十五條第二項、第六十九條第二項或第七十一條之情形外，仍得舉發。
- - 民眾於臺北市撥打1999市民熱線陳述交通違規案件之罰單申訴，需提供那些資訊？
  - 1.倘民眾只收受白色之逕行舉發標示單（俗稱：白單），尚須由舉發機關(開單單位)確認違規事實及車輛無誤後，始填製違規　通知單(俗稱：紅單)，非屬臺北市交通事件裁決所權管，故由舉發機關(開單單位)受理申訴。   2.倘民眾已收受違規通知單（俗稱：紅單），請提供下列資訊：   　(1)應到案處所（→此為優先判斷是否為「臺北市交通事件裁決所」管轄案件，如非屬該所權管，建議民眾逕向管轄處所辦理申　　訴，以減省公文行政作業時間。）   　(2)舉發機關（開單單位）   　(3)舉發單號   　(4)車牌號碼   　(5)車籍地（→逕行舉發案件係以車籍地判斷應到案處所，如為員警當場攔停舉發，則可能視情況為車輛車籍地或駕駛人駕籍地　　列管案件，需於公路監理資訊系統查詢始能確認）   　(6)違規時間（→非入案時間，因舉發機關辦理入案作業會有時間落差，故如公路監理資訊系統尚未入案，則逕由舉發機關受理  　　申訴。）   　(7)違規地點（→肇事致人傷亡及酒駕案件係以此行為地判斷應到案處所）   　(8)違規事項   　(9)採證照片或其他佐證資料   3.另建議民眾如交通違規案件屬臺北市交通事件裁決所管轄者，也可至該所網站之「申請案件」連結至「臺北市民e點通」網路申  　辦罰單申訴或自行下載「交通違規案件陳述書」 以傳真或郵寄方式辦理申訴。
