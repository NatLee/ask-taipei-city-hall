- - 臺北內湖科技園區、南港軟體工業園區、大彎南段工業區、內湖五期重劃區及臺北市生技廠商，市府是否有派員辦理調查作業?
  - 臺北市政府為掌握產業園區最新發展動向，並使相關施政方針更能切合園區廠商的需要，自92年起，每年均針對內湖科技園區、南港軟體工業園區及大彎南段工業園區定期進行全面性廠商普查，並自97年起增加臺北市生技產業調查工作。調查作業自101年起，改為兩年辦理一次，即每單數年辦理一次調查（如105、107年），本(105)年臺北市政府產業發展局將再次辦理臺北市科技產業園區暨生技產業調查，調查範圍新增內湖五期重劃區，特別委託世新大學辦理調查作業。實地調查自8月1日起，實施期間調查員亦均掛帶蓋有臺北市政府產業發展局局章調查證赴各園區廠商作實地訪查工作。
- - 今(105)年臺北市政府產業發展局將辦理臺北市科技產業園區暨生技產業調查，有關本次調查內容與疑問，或廠商填寫調查問卷問題，可向誰洽詢?(內湖科技園區、南港軟體工業園區、大彎南段工業區、內湖五期重劃區及臺北市生技廠商等調查作業)
  - 調查作業自101年起，改為兩年辦理一次，即每單數年辦理一次調查（如105、107年），若對於本次調（普）查作業若有任何疑問，可向以下單位洽詢。    調查執行單位：世新大學    電話：(02)22360120 分機504 衛宛伶助理研究員。       主辦單位：臺北市政府產業發展局科技產業服務中心    地址：台北市信義區市府路1號    電話：1999分機6587 李承軒小姐
