  - 勞工退休準備金依法須按月提撥，依法並無分期提撥之規定，事業單位如有長時間欠繳，在尚未補繳完畢之前，均屬違法狀態。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 公司如無其他舊制年資員工，但僱有白領外勞，請問該如何處理?
  - 白領外勞的部分屬於舊制勞工，仍須依法須按月提撥勞工退休準備金。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 單位如無其他舊制年資員工，僱有藍領外勞，請問該如何處理?
  - 如屬就服法第46條8到10款之藍領外勞者，非屬提繳身分，告知單位如無其他舊制年資或白領外勞者，可依法辦理退還並檢附藍領外勞之聘僱許可證影本。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 單位如僱有外籍勞工(外籍配偶)，為103年1月17前到職，請問該如何處理?
  - 因外籍配偶103年1月17前到職具有舊制年資，(1)如單位結清外籍配偶的舊制年資(到職日到103年1月16日)，可辦理結清舊制年資，並退還勞工退休準備金。(2)如未結清，請單位按月提撥勞工退休準備金。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 何謂結清年資？
  - (1)結清年資是法定名詞，規定於勞工退休金條例第11條，內容為勞資雙方於勞動契約存續期間，雙方約定以不低於勞基法第55條及84條之2之給與標準，結清保留之舊制年資。(2)結清年資有幾個條件：勞工須於94年7月1日前到職且服務於同一事業單位且勞工須於99年6月30日前轉新制，結清需雙方協議都同意結清。(3)結清年資的計算標準：比照退休金之計算方式，依照勞基法第55條計算，舊制年資未滿半年以半年計，滿半年以1年計，前面15年內1年給付2個基數，超過15年部分1年給付1個基數，基數是指現在協議結清前半年之平均工資。(舉例：91年3月5日到職，94年7月1日改選新制，舊制年資3年3個月又25日，進位後變3.5年x 2個基數=7個基數，假設結清前半年平均工資如為4萬元，7個基數x 4萬元=結清費用需給付28萬元)。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 勞動基準法第56條第2項修法的目的是什麼？
  - 本次修法係為保障勞工於事業單位符合勞動基準法退休要件時可請領退休金權益之立法意旨，避免雇主因經營風險或突發狀況以致無法一次給付退休金，故修訂勞動基準法第56條第2項，增訂足額提撥勞工退休準備金之規定，要求事業單位每年底需檢視隔年符合退休條件之勞工所需之退休金數額，並於隔年3月底前足額提撥至專戶，此修法至少可確保勞工於符合退休條件時，專戶內金額已足夠支付其退休金，以保障勞工之舊制退休金權益。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 本公司雖有94年7月1日前到職的舊制勞工，但後來都改選新制了，還有需要足額提撥勞工退休準備金嗎?
  - 如公司僱有具舊制年資之勞工，即使後來改選新制，仍需開戶提撥勞工退休準備金，並依法遵守按月提撥及足額提撥之規定。(新制6%係提撥改選新制後年資之退休金，舊制係提撥改選新制前年資之勞工退休準備金，兩者並無重複提撥的問題)。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 足額提撥勞工退休準備金是只要104年底自行檢視一次，105年3月底以前補足差額就可以了嗎?以後就不用再每年3月存錢了?
  - 勞動基準法第56條第2項已明文規定，事業單位應於「每年底」檢視，隔年3月底前足額提撥至專戶，以後年度亦請單位及早規劃因應，並適時調整提撥率，提高每月提撥金額，以減輕屆時一次補足差額之壓力。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 因公司內年長勞工眾多，若依法足額提撥將產生龐大成本，公司可否先以內部徵詢方式，確認明年有哪些勞工要退休，再將退休金存到專戶？
  - 依法令規定，只要是次一年度已符合勞動基準法第53條或第54條第1項第1款退休條件者，即應於當年底估算所需退休金，並於次一年度3月底前將退休金足額存至臺銀信託部專戶內，不得以意願徵詢方式選擇性提撥退休金。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 因為還不知道未來退休時的平均工資是多少，該如何去估算所需退休金？
  - 依據修正後勞動基準法施行細則第29條之1規定，「平均工資為估算當年度終了之一個月平均工資」，以此平均工資數額來做為估算勞工退休金之基數。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 如果勞工是隔年8月剛好符合了勞基法第53條之退休條件，那計算退休金的年資是試算到隔年8月嗎?
  - 依據修正後勞動基準法施行細則第29條之1規定，「工作年資自適用本法之日起算至估算當年度之次一年度終了或選擇適用勞工退休金條例前一日止」，如勞工有改選新制，則其舊制年資計算至改選新制的前一日；如勞工為沿用舊制，則其年資須估算至次一年度終了，而非隔年8月符合退休條件之時。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 公司多年前已幫勞工買了商業保險，保費是由公司全額負擔，保障未來一定付得出退休金，那是否可以用保險取代足額提撥存到專戶？
  - 目前法令未授予以保險方式取代提撥勞工退休準備金，故事業單位仍需依法提撥至臺灣銀行信託部的專戶。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 公司另外有別間銀行的帳戶儲存員工的退休金，可否提供該銀行的存款明細取代足額提撥存到專戶？
  - 目前法令未授予以儲存到其他間銀行的方式取代提撥勞工退休準備金，故事業單位仍需依法提撥至臺灣銀行信託部的專戶。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 事業單位資金不足，足額提撥之費用是否可分期分年支付？
  - 勞動部104年11月27日勞動福3字第1040136991號書函回復，目前法令並無可於3月底後分期足額提撥之規定。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 事業單位要怎麼去試算足額提撥需要多少退休準備金？
  - 勞動部已建置「預估次一年度勞工退休準備金足額提撥退休金試算系統」(勞動部網址http：//www.mol.gov.tw，首頁/熱門推薦項下/退休準備金足額提撥試算)，事業單位可至該網站進行足額提撥試算。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 估算足額提撥後補存至專戶的差額是否可列為費用扣稅?
  - 依據勞動部104年11月11日勞動福3字第1040083235號書函略以，有關營利事業依勞動基準法第56條第2項規定，提撥之金額得全數於提撥年度以費用列支，業經財政部104年11月10日台財稅字第10400608350號令發布施行。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 若未依規定足額提撥，會有罰則嗎?
  - 如違法經查察屬實，依勞動基準法第78條第2項規定得處9萬元以上45萬元以下罰鍰。聯絡科室：勞資關係科 勞退承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、6048
- - 臺北市聯營公車所核備之電子票證及其優惠各為何?
  - 1.目前經查核備之電子票證分別為悠遊卡、一卡通、有錢卡及愛金卡。2.經核備之電子票證享有以下優惠：捷運公車雙向轉乘優惠：搭乘臺北捷運與臺北市聯營公車、新北市公車，在規定時限60分鐘內直接轉乘，即可享單次普通卡8元、學生卡6元之優惠。學生優惠票價：持記名學生卡，經記名且設定效期方能享有學生優惠票價每段公車12元。
- - 電子票證之主管機關為何？適用法條為何？
  - 電子票證之主管機關為行政院金融管理委員會，電話：(02)8968-0899適用法條與行政命令為：《電子票證發行管理條例》、《電子票證發行機構業務管理規則》《電子票證定型化契約應記載及不得記載事項》、《電子票證定型化契約範本》
- - 我店裡的特定寵物業許可證弄丟了怎麼辦？
  - 請檢附特定寵物業許可證遺失切結書向本處申請補發。
- - 悠遊聯名卡、一卡通聯名卡是否可於臺北市聯營公車自動加值？
  - 因目前公車驗票機設備無法與各電子票證有即時連線功能，爰無法提供自動儲值功能，尚請見諒。本市大多數便利商店亦有提供相關票證卡片加值服務，且各捷運站均有設置悠遊卡自動加值機，民眾皆可自行操作加值。
- - 搭乘臺北市聯營公車時身上悠遊卡或一卡通餘額不足，也沒有零錢，該如何處理？
  - 持悠遊卡或一卡通搭乘臺北市聯營公車時，若卡片可使用金額不足搭乘所需車資時，不足車資可由票卡代墊乙次；若公車為兩段票，但第一段票已由押金代墊過一次，第二段票則無法再扣款，旅客需以投現的方式繳費。另於下次使用前，持卡人須加值補足代墊之車資後才可使用。
- - 搭乘臺北市聯營公車時，悠遊卡或一卡通感應失敗時，應如何處理？
  - 若因乘客使用之悠遊卡或一卡通故障而無法刷卡付費或電子票證餘額不足，乘客得選擇投現或使用其他電子票證乘車；若因驗票機故障致使乘客無法刷卡付費，臺北市聯營公車業者不得強制乘客投現付費。
- - 悠遊卡與一卡通之於臺北市之服務中心設於何處？聯絡方式為何？
  - 悠遊卡股份有限公司諮詢服務或申訴地點為臺北市南港區園區街3-1號6號(南港軟體園區二期G棟)，悠遊卡公司客服電話02-412-8880一卡通票證股份有限公司諮詢服務或申訴地點為臺北市信義區忠孝東路五段6號(市府轉運站)，一卡通公司客服電話07-793-3000
- - 是否可於全市公車後門皆加裝驗票機，加速上下車之方便性？
  - 已請本市聯營公車業者裝設後門驗票機，預計於106年8月裝設完畢，將有助於減少上下車集中於單一車門刷卡情形，適度疏緩車內壅擠。
- - 我常常遇到驗票機故障無法感應，請問有任何改善措施嗎？司機似乎都不知道不得強迫乘客投現之規定，應如何處理？
  - 有關多卡通驗票機(以悠遊卡為例)，於行駛途中發生故障，倘尚有其他收費工具可使用時，應即明顯標示「驗票機故障」，於駕駛座擋風玻璃右側與驗票機附近，民眾向駕駛出示悠遊卡即可免費搭乘，駕駛不得要求投現；回站後應即修復或抽換備品，方得出車營運。
- - 如果通過獎勵補貼計畫，大約何時可以請領到補助經費?
  - 獎勵補貼計畫固定於每年9-10月憑單據請領當年度補助款，直至計畫結束為止。
- - 如何申請網路市民?
  - 步驟1：從臺北市政府網站右上角連結進入”網路市民”。   步驟2：點選頁面上方”註冊”選項。   步驟3：提供e-mail註冊或手機號碼註冊，填寫email或手機號碼資料後，請按下「獲取驗證碼」。   步驟4：e-mail註冊請至個人信箱收取驗證碼，手機號碼註冊則請至手機收取驗證碼，請在10分鐘內至網頁處輸入驗證碼。   步驟5：填寫姓名、密碼後，點選立即註冊。 
- - 網路市民如何修改個人資料?
  - 請連結至網路市民會員中心(http：//citizen.taipei/)1.使用原申請網路市民之帳號、email、身分證或手機，以及密碼進行登入，點選 【管理】進入個人資料修改畫面。2.點選要修改項目後方的編輯，即可修改或填寫相關資料，輸入完成後點選存檔，完成編輯動作。例如：編輯生日。
- - 生活輔具 (器具補助、輔具服務)申請資格
  - 身心障礙者輔具費用補助新制自101年7月11日起施行，申請資格如下： 1.設籍臺北市。 2.領有臺北市核（換、補）發或註記之身心障礙手冊或證明；最近一年居住國內達183日。 3.申請補助項目係未獲政府其它醫療補助、社會保險給付或相同性質（輔助器具）之補助者。 4.已超過輔助器具之補助年限。 5.補助內容：詳見內政部「身心障礙者輔具費用補助辦法」、「身心障礙者輔具費用補助基準表」及其他相關規定。（可向區公所社會課索取或至臺北市政府社會局網站www.dosw.taipei.gov.tw下載）
- - 如何查詢網路市民登入密碼?
  - 步驟1：於網路市民會員中心點選登入，進到網路市民驗證授權中心，點選下方”忘記密碼” 選項後輸入電子信箱或者手機後請點下&quot;獲取驗證碼&quot;。   步驟2：請至您的電子信箱或手機收取驗證碼輸入驗證碼。   步驟3：按下送出後即可重新設定密碼。 
- - 加入網路市民的好處?
  - 網路市民服務提供市民可以使用同一組帳號密碼登入本府便民服務網站，免除申請及記憶多組帳號的不便。目前已經整合網路市民登入的網站系統包括：臺北市民e點通、臺北e大數位學習網、單一陳情系統、臺北地政雲、臺北智慧城市、臺北卡、愛台北市政雲、都發局地形圖數值圖檔供應系統、智慧支付整合平台及臺北市政府機關學校求職徵才網等。網路市民服務提供市民可以使用同一組帳號登入本府便民服務網站，如：臺北市民e點通、臺北e大數位學習網、市政信箱、臺北卡、臺北便民服務雲、愛台北市政雲及都發局地形圖數值圖檔供應系統等均已整合應用。 線上申辦及查詢便利服務：可利用網路市民帳號使用市府提供之線上網路服務，於臺北市民e點通(http：//www.e-services.taipei.gov.tw/)進行線上申辦各機關服務及下載申請書表。     市政信箱，民意即時反應服務：透過市長信箱(https：//contact.taipei.gov.tw/)反應意見，可免除確認程序，快速受理，並可管理查詢信件處理情形，等個人化服務。 臺北e大線上學習服務：利用臺北e大(http：//elearning.taipei)可線上觀看學習數百種課程，包含語言課程、資訊課程、管理課程、人文課程等。     台北卡服務：利用網路市民身分結合台北卡，可進行線上查詢台北卡申辦進度，線上掛失以及隨時查詢「台北點」剩餘點數。 -->
- - 已申請網路市民帳號並可登入成功，為何進入臺北e大、市民e點通等系統，還要導回網路市民補填資料?
  - 由於網路市民帳號係提供會員可使用同一組帳號與密碼登入本府已整合之系統便民服務網站（如：臺北市民e點通、臺北e大、單一陳情系統、智慧支付整合平台等），由於各系統資料欄位需求不同，為便利市民註冊帳號，網路市民帳號申請時身分證為非必填，之後則依市民欲使用的系統要求，再補填所需的欄位資料。 步驟1：允許「臺北e大」或「臺北市民e點通」等系統可取得您於網路市民的授權資料。   步驟2：  (１)如會員資料已填寫過身分證，即可直接進入「臺北e大」或「臺北市民e點通」使用。 (２)如網路市民會員資料沒有填寫身分證， 「臺北e大」會出現如下訊息 「臺北市民e點通」會出現如下訊息 步驟3： 請連結至網路市民服務中心(http：//citizen.taipei/) 進行登入，個人資料點選【管理】，針對身分證欄位點選編輯並存檔。 步驟4：再重新進到臺北市民e點通、臺北e大網站，並重新登入 
- - 沒有e-mail可以申請網路市民嗎?
  - 可以，您可透過用手機號碼註冊網路市民帳號。
- - 網路市民帳號可以更改嗎?
  - 基於安全性考量，帳號、身分證字號、姓名無法任意修改。
- - 如何退出網路市民?
  - 基於安全性考量，網路市民帳號一經申請無法自行刪除。如因特殊考量必須刪除，請於上班時間（8：30~17：30）以市話、手機(臺北市區專用)直撥「1999」或外縣市撥打02-27208889分機1070由專人為您服務。
- - 如何查詢目前累積的網路市民悠遊點數?
  - 網路市民悠遊點數積點活動已經自103年4月15日起停止辦理，可直接於網路市民會員中心登入帳號、密碼進入個人化網頁，即可再個人資料修改專區查看目前悠遊點數累積之點數。
- - 網路市民悠遊點數積點如何兌換紀念品?
  - 網路市民悠遊點數積點活動已經自103年4月15日起停止辦理。現持有網路市民悠遊點數之會員，將不定期辦理兌點活動供大家兌換喜愛的禮品，並會以市府網站公告、Mail方式通知網路市民舉辦之點數兌換活動及活動期間，感謝大家長久以來對於市政服務之支持。
- - 加入網路市民需要費用嗎?
  - 網路市民為臺北市政府網站提供之免費線上服務，加入網路市民不需任何費用。
- - 只有臺北市民才可加入網路市民嗎?
  - 加入網路市民沒有資格限制，無論本國或外籍人士皆可申請。
- - 為何要拆除忠孝橋臺北市端高架引橋？
  - 1.忠孝橋高架引橋最初設置之目的，在穿越忠孝西路口的鐵路平交道，而隨著鐵路地下化後，該高架引橋僅提供新北市端穿越性車流之便利性，其主要功能已不存在。2.考量捷運淡水信義線、松山新店線、板南線等陸續完成後，已降低該高架引橋使用需求。為改善橋下平面車流遇橋墩無法直行、北門周邊八叉路口複雜動線及北門古蹟受高架橋壓迫的突兀都市景觀，故市府經評估後決定辦理拆除。
- - 申請低收入戶子女就學交通補助洽辦單位、應備文件、資格及補助內容？
  - 1.洽辦單位：戶籍所在地區公所社會課2.應備文件：檢具下列文件，於期限內提出申請(每學年度第一學期應於11月30日前提出申請，每學年度第二學期應於5月31日前提出申請)。(1)申請書1份。(2)學生證正反面影本1份。3.資格：低收入戶家庭就讀國中以上未滿25歲子女。4.補助內容：(1)就讀國中者，每人每學期補助500元。(2)就讀本市高中（職）以上者，每人每學期補助1,000元。(3)就讀外縣市高中、職以上者，每人每學期補助1,500元。
- - 忠孝橋高架引橋為何要集中在105年春節期間全面拆除？
  - 原拆橋方案係規劃採分區分段拆除，惟為減輕拆橋施工對區域交通運轉衝擊，市府將把握春節年假交通流量僅平常的三分之一的時候，以「全區同步拆除」的方式完成拆橋作業，將市民生活作息影響降至最低。
- - 忠孝橋引橋拆除工程之主要施工階段及期程如何安排？
  - 本工程分三大階段施作：第1階段(前置作業)：於春節前辦理測量放樣、橋下物拆除、臨時支撐架設、圍籬設置及假設工程施工。第2階段(全橋同步拆除)：利用春節拆除引橋。第3階段(路型調整及引道拓寬)：春節後施作拆橋後平面道路路基路面改善、暫時路型、人行道拓寬、引道橋梁拓寬及照明交通附屬設施等。
- - 忠孝橋引橋拆除期間為何？平常是否會受影響？
  - 平時僅於橋下空間施作，不改變原有交通動線，僅於春節期間封閉道路辦理拆橋。
- - 忠孝橋引橋拆橋會不會對周邊的文化資產有不良影響?
  - 1.拆橋工區為避免高架橋梁拆除施工影響既有古蹟或歷建安全，於緊鄰北門側架設保護鋼架隔屏，以阻隔碎塊飛濺損及古蹟。2.文化資產建物附近將佈設安全監測系統，包含建物傾斜計及沉陷觀測點，若有監測觀測值超出管控標準時，將採取必要行動處理。
- - 春節期間忠孝橋及忠孝西路往西交通？（台北車站往忠孝橋）
  - 1.春節封橋拆除期間，忠孝西路自重慶南路口至環河南路皆因施工封閉。2.忠孝橋出城往三重方向，平面道路部分建議民眾利用西寧北路南下轉忠孝橋西寧南路引道出城，或利用市民大道高架橋接忠孝橋。
- - 春節期間忠孝橋及忠孝西路往東交通？（忠孝橋往臺北車站）
  - 1.春節封橋拆除期間，忠孝橋及忠孝西路（自環河南路至重慶南路）僅有一汽機混和車道開放。2.建議民眾儘量使用中興橋及臺北大橋。
- - 忠孝橋引橋拆除工程春節期間南北向交通會受到影響嗎？
  - 1.環河南北路及西寧南北路（僅封閉2晚，餘日夜開放），忠孝西路與中華路、塔城街、延平北路、博愛路等4處路口南北向動線，全日封閉。2.建議以中山南北路、金山南北路、新生南北路為替代道路。
- - 如果發現臺北市發現有人販賣保育類野生動物，我要向那個單位反映？
  - 通報行政院農業委員會林務局、本處或警察局，因為買賣保育類野生動物應負刑事責任，最高可處6月以上5年以下有期徒刑，得併科新臺幣30萬元以上150萬元以下罰金。
- - 在臺北市發現入侵紅火蟻時可向哪些單位通報？
  - 1.1999市民熱線2.臺北市動物保護處（02-87897158）3.消防局4.本府市政信箱5.國家紅火蟻防治中心（02-33663360）
- - 忠孝橋引橋拆除期間三重至台北(台北至三重)要如何改道？
  - 施工區外車輛建議提早改道避免進入施工區，臺北市與新北市三重方向互往車輛，建議改道臺北橋、中興橋行駛。
- - 臺北市可以找哪些單位鑑識是否為入侵紅火蟻？
  - 1.臺北市動物保護處（02-87897158）2.國家紅火蟻防治中心（02-33663360）3.教育部入侵紅火蟻防治北區輔導團（臺北市教育大學）
- - 春節拆橋期間(2/7~2/14)已進入忠孝橋或封閉區旁要如何改道？
  - 1.汽車動線：(1)忠孝橋北側上匝道封閉，南側下匝道改雙向通行(1專用車道進城+1混合車道出城)。(2)市區東西向：主要利用鄭州路繞行，大客車則可利用忠孝西路南側車道。(3)南北向：利用西寧北路及暫時改為雙向通行之重慶南北路繞行。2.機車動線：(1)忠孝橋北側上匝道封閉，南側下匝道改雙向通行(1專用車道進城+1混合車道出城)。(2)市區東西向：主要利用鄭州路、忠孝西路南側車道繞行。(3)南北向：利用西寧北路及暫時改為雙向通行之重慶南北路繞行。
- - 臺北市入侵紅火蟻案例要進行餌站監測1年才可以解除列管？
  - 是的，依據本市入侵紅火蟻防治規定本市權管案例餌站監測須持續1年無紅火蟻紀錄時才可解除列管。
- - 忠孝橋引橋拆除工程春節期間大眾運輸之站位、路線會不會受影響？
  - 1.國道客運候車區調整：(1)台北轉運站、西站停靠之路線均不受影響。(2)塔城街封閉，僅留北向1車道。(3)日統客運、三重客運原塔城街南向北門站，移到塔城街東側北向設臨時站，另三重客運9102、1209兩線則移至中興醫院站位候車。 2.公車站牌調整：(1)中華路北站：遷移至漢口街以南人行道(原本在公車專用道)(2)捷運北門站：移到中興院區站(原本在塔城街)。(3)部分公車路線則配合工區改道措施於管制區外圍道路繞行。
- - 忠孝橋引橋拆除工程工區週邊道路停車是否受影響?
  - 春節拆橋施工週邊道路改道影響，於漢口街1段(重慶至中華)、開封街1段(重慶至中華)，西寧北路(忠孝至鄭州)取消路側停車格，建議改至洛陽停車場停放。
- - 忠孝橋引橋拆除工程春節期間影響行人通行嗎？自行車騎乘等會不會受影響？
  - 1.春節拆橋施工範圍，原中華路口北門(承恩門)及塔城街口行穿線於拆橋期間禁止通行，請改道北門前方地下道或西寧北路口通行。2.忠孝西路2段既有自行車人車共道會取消，請改道或牽引通過。
- - 忠孝橋引橋拆除工程如何查詢詳細之工程資訊及工區周邊道路交通改道、公車改道資訊。
  - 1.施工期間進入臺北市區建議多加利用捷運路網，工程及交通改道相關資訊可透過以下網站查閱：臺北好行 http：//its.taipei.gov.tw/1.html臺北市政府 http：//www.taipei.gov.tw/臺北市政府交通局 http：//www.dot.gov.taipei/臺北市政府工務局新建工程處 http：//nco.gov.taipei/2.詳細公車改道動線可上以下網站查閱：臺北市公共運輸處 http：//www.pto.gov.taipei/大臺北公車動態資訊系統 http：//ebus.gov.taipei/臺北市政府工務局新建工程處 http：//nco.gov.taipei/    
- - 身心障礙者人工電子耳應備文件
  - 1.申請書正本。2.最近3個月內由醫學中心或衛生福利部專案核可醫院之耳鼻喉科醫生開立之診斷證明書正本1份。(應詳述優、劣耳聽力損害程度：dBHL數)3.術前狀況評估及術後復健計畫書。(1) 術前狀況評估：由醫院耳鼻喉科醫師、聽力檢查師或語言治療師或職能 治療師或心智科醫師或社工師等專業人士開立，內容應載明病患術前狀況，含聽能復健效果及聽力障礙病史及病患耳蝸之完整性與否，及人工電子耳對其確有實際預期成效及裝置需要，或家庭動力與資源或個案心智狀況等；符合補助標準對象資格已施行植入手術者，請另載明手術施行日期。(2)術後復健計畫：尚未開刀之申請者，應請醫療院所或聽語復健單位先行規劃，且應於手術後回原開立聽語復健計畫單位進行口語復健；已開刀者，亦請檢附術後復健計畫書。4.切結書1份(回執聯由術後復健單位填具後寄回本局身心障礙者福利科) 。5.估價單或統一發票或植入手術醫院收據正本1份。(須註明申請人姓名、地址) 。6.申請人之郵局或台北富邦銀行存摺影本。(須有戶名及帳號)
- - 身心障礙者人工電子耳之應備文件
  - 1.申請書正本。2.最近3個月內由醫學中心或經衛生福利部或縣市行政主管機關認可之醫院之耳鼻喉科醫生開立之診斷證明書正本1份。(應詳述優、劣耳聽力損害程度：dBHL數)3.術前狀況評估及術後復健計畫書。(1) 術前狀況評估：由醫院耳鼻喉科醫師、聽力檢查師或語言治療師或職能 治療師或心智科醫師或社工師等專業人士開立，內容應載明病患術前狀況，含聽能復健效果及聽力障礙病史及病患耳蝸之完整性與否，及人工電子耳對其確有實際預期成效及裝置需要，或家庭動力與資源或個案心智狀況等；符合補助標準對象資格已施行植入手術者，請另載明手術施行日期。(2)術後復健計畫：尚未開刀之申請者，應請醫療院所或聽語復健單位先行規劃，且應於手術後回原開立聽語復健計畫單位進行口語復健；已開刀者，亦請檢附術後復健計畫書。4.切結書1份(回執聯由術後復健單位填具後寄回本局身心障礙者福利科) 。5.估價單或統一發票或植入手術醫院收據正本1份。(須註明申請人姓名、地址) 。6.申請人之郵局或台北富邦銀行存摺影本。(須有戶名及帳號)
- - 護理機構/護理之家/產後護理機構/產後護理之家設置問題
  - 請至「臺北市民e點通」搜尋「護理機構」，網頁上有敘明相關法規及應檢附之文件及佐證資料
- - 坐月子中心設置
  - 坐月子中心屬於商業登記，請詢問商業處
- - 目前臺北市是否有辦理「受僱員工動向調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「受僱員工動向調查」係由行政院主計總處統籌規劃設計，各縣市政府為協辦機關，負責辦理各該轄區之調查業務，為按年辦理之調查。二、「104年受僱員工動向調查」調查期間為105年3月7日至4月1日，調查對象包含礦業及土石採取業、製造業、電力及燃氣供應業、用水供應及污染整治業、營造業、批發及零售業、運輸及倉儲業、住宿及餐飲業、資訊及通訊傳播業、金融及保險業、不動產業、專業科學及技術服務業、支援服務業、教育服務業、醫療保健服務業、藝術娛樂及休閒服務業、其他服務業等17大行業之公民營事業單位(場所)及其進入(年底在職)與退出之受僱員工為調查對象。三、該調查主要目的為配合社會經濟發展需要，蒐集受僱員工行業別、規模別、僱用型態別進退情形、受僱員工概況、非薪資報酬結構、調薪狀況、計薪方式、缺工情形等統計資料，以供政府研訂經建計畫、規劃企業經營、釐訂產業、人力及輔導就業政策之參據，並供企業界調整員工薪資、改善經營管理、訂定人力計畫及提撥退休金之參考。調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作，據實回答。四、該調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw/）「政府統計」項下之「政府統計總覽」項下之「受僱員工動向調查」查詢。
- - 台北探索館「用一生關注台灣的美國人•葛超智特展」各區特色內容介紹?
  - 【早年生活 接觸東方】：本展區除介紹葛超智早年生活與接觸東方的過程外，還特別展示葛超智的家族照片。【台北執教 桃李摯友】：本區除了展出多張經典的學校老照片與葛超智學生王育霖、蘇瑞麟、張雲舫的親筆書信外，更特別展出台北高校學生帽及制服， 展覽現場設有一互動裝置，讓民眾體驗身穿台北高校制服的感覺。【民藝風土 珍藏台灣】：本區除了特別展出葛超智蒐藏的台灣民俗、歷史等文物，現場更首次可以聽到葛超智於1989年所錄製的聲音檔。【戰爭時期  台灣專家】：本區特別展出美國國家檔案館典藏由國立台灣歷史博物館提供的第二次世界大戰轟炸台灣的照片。除此之外，現場模擬二次大戰美國空襲的影片，讓民眾有身歷其境的感受。【見證二二八】：此區特別播映105年1月7日《川平朝清訪談影片》，讓民眾對葛超智有更進一步的深入認識。【返美教學研究 關心對台政策】：本區特別展出「沖繩公文書館」跨海來台的典藏影像，包括葛超智在日本、夏威夷居住時的生活照，讓民眾可以認識不一樣的葛超智。【查踏風土 文藝友朋】：本區展出台灣知名藝術家藍蔭鼎於1946年繪製的《美國國慶宴會圖》作品原件，畫中包含當時出席的副領事葛超智，除了展現傑出的速寫功力，也是藍蔭鼎極為少數時事水彩畫作。
- - 如何閱覽客家文化季刊？
  - 配合本府無紙化政策，本會出版之客家文化季刊改以電子化形式發行，預計於每年4月、6月、9月及12月出版。民眾可於本會網站「客家文化季刊」項目下，下載閱覽當期季刊。如有任何疑問，可洽詢第二組，聯絡電話：(02)2702-6141轉222。
- - 長期照顧相關諮詢
  - 一、設籍且實際居住臺北市者。二、失能類別：（一） 符合長照十年計畫 之個案：65歲以上老人、50歲以上之身心障礙者（需持有身心障礙證明或手冊），並經日常生活活動功能（ADL） 或工具性日常生活活動功能（IADL） 評估後，日常生活需他人協助之失能者。（二） 本市創新之各項居家醫事專業人員到宅服務及喘息服務，服務對象擴及全年齡經日常生活活動功能（ADL）評估之失能者。（三） 具失智症身心障礙證明（或手冊）或CDR（臨床失智評估量表）評估，日常生活需他人協助之失能者。
- - 家庭看護工申辦案件受理窗口
  - 1.臺北市照顧管理中心  地址：臺北市信義區市府路1號B1中央區       (臺北市政府市府大樓)  電話：2720-8889，轉5880  傳真：2758-65332.臺北市照顧管理中心東、南區服務站  地址：臺北市大安區仁愛路4段10號5樓       (臺北市立聯合醫院仁愛院區)  電話：2704-9114  傳真：2325-8175
- - 臺北市婚後孕前健康檢查及孕婦唐氏症篩檢，夫或妻僅其中一方未設籍本市，也有補助嗎？
  - 本方案僅提供設籍北市之市民可接受補助，未設籍本市者，無法補助。http：//www.health.gov.tw/Default.aspx?tabid=626
- - 家庭看護工申請案件辦理
  - 1.申請人親辦：申請人及受照顧者身分證正本、正反面影本1份。2.委託三等親辦理：申請人、受照顧者及受委託人身分證正本、可證明受委託人及申請人關係之證明文件、上述資料正反面影本1份、委託書1份。3.委託仲介辦理：申請人、受照顧者及受委託人身分證正本、上述資料正反面影本1份、委託書1份(需蓋仲介公司大小印)。
- - 托育(保母)人員訓練費用?
  - 1.訓練費用每人至多8,000元，實際費用請洽詢各訓練單位。2.失業者參加訓練可申請訓練費用補助，依據勞動部勞動力發展署北基宜花金馬分署頒訂「辦理照顧服務職類職業訓練補助要點」，參訓學員如為年滿二十歲以上失業者、初次就業待業者及具勞工保險、農民保險被保險人身分之在職勞工，可檢具相關證明文件，由訓練單位依身分別向勞動部勞動力發展署北基宜花金馬分署申請全額或部分補助(身分認定以開訓日當日為基準）。3.學員須於開課前先行繳納訓練費用，結訓後透過訓練單位代為申請，補助款核發後再辦理退費作業。
- - 參加托育（保母）人員專業訓練課程資格為何？
  - （一）訓練資格：　　年滿20歲，設籍並實際居住本市之本國國民（包含大陸地區配偶取得長期居留證、依親居留證者及合法取得外僑居留證之外籍人士），另控留15％名額予外縣市民眾參訓。（二）課程資訊：　　社會局於網站公告訓練消息，請至本局網站（http：//www.dosw.tcg.gov.tw/），路徑為：嬰幼兒照顧服務  托育專業人員相關訓練公告托育（保母）人員訓練，網頁下方「附件下載」區有公告課程表提供下載。
- - 申請低收入戶老人、孕婦及嬰兒營養品代金申請單位、應備文件、資格及補助內容？
  - 1.申請單位：社會局各社會福利服務中心及各平價住宅社會工作員辦公室，聯絡方式如附檔。2.應備文件：(1)申請書及領款收據各1份。(2)低收入戶卡影本1份。(3)公、私立醫療院所診斷證明書1份或社工師（員）評估報告。(4)郵局或台北富邦銀行存摺封面影本1份。3.資格：本市列冊低收入戶，且經醫師診斷及社會局社工員評估須補充營養品，另符合以下條件之一者：(1)年滿65歲老人。(2)有早產、流產或難產紀錄及生產2個月以內之產婦。(3)出生時體重低於2,500公克之嬰幼兒，或5歲以下營養不良者4.補助內容：每人每次補助1,000元，每2個月申請1次為限。
- - 民眾遺失申辦的「台北卡」（悠遊卡）遺失可否補辦？
  - 可以補辦；民眾重新持自有之「悠遊卡」，親自或委託他人至臺北市十二區健康服務中心或臺北市立聯合醫院各院區或臺北市各區公所，重新申請登錄「台北卡-健康服務」之功能，卡片更換無次數限制，但若民眾尋回遺失之舊卡，不得再使用之（若有特殊情形，請送臺北市政府衛生局專案處理）
- - 民眾一定要親自至兌點地點辦理兌換「台北卡」加值金服務嗎？不能委託親友辦理？
  - 市民請攜帶已申辦的「台北卡」（悠遊卡）（含親友的卡片）至衛生局指定之兌點地點，即可辦理點數兌換悠遊卡加值金。若民眾無法親自辦理，則可委託親友攜帶卡片至兌換地點辦理。惟如發現卡片資料錯誤需確認或重新辦理時，非親自辦理者仍需備妥委託書及身分證件請親友代為辦理。
- - 臺北市婚後孕前健康檢查及孕婦唐氏症篩檢補助對象？
  - 1. 婚後孕前健康檢查：設籍臺北市已結婚、未生育的市民。2. 孕婦唐氏症篩檢：設籍臺北市懷孕初期或中期婦女，擇一補助篩檢。
- - 臺北市生育補助（婚後孕前健康檢查及孕婦唐氏症篩檢）受檢地點及辦理方式？
  - 1.市民可享有1次婚後孕前健康檢查及孕婦每胎1次唐氏症篩檢補助。凡符合資格之市民持身分證明文件及健保卡至本局特約醫療機構受檢（名單可至衛生局網站http：//health.gov.taipei/「助妳好孕」專區查詢），即可享有檢查費用免費之補助，僅需自付掛號費及診察費。夫妻雙方亦可分別掛號接受婚後孕前健康檢查，並未規定夫妻雙方需一同前往，亦無名額之限制。                                                              2.若經查重複接受補助者，則需自付重複補助之費用。
- - 臺北市婚後孕前健康檢查補助金額與檢查項目？
  - 1.女性每案補助新臺幣1,595元（不含掛號費及診察費），檢查項目包括：尿液檢查、德國麻疹抗體、水痘抗體、血液常規、梅毒篩檢、愛滋病篩檢、甲狀腺刺激素、披衣菌抗體等8項。2.男性每案補助新臺幣655元（不含掛號費及診察費），檢查項目包括：尿液檢查、血液常規、梅毒篩檢、愛滋病篩檢、精液分析（男性請禁慾3天）檢查等5項。http：//www.health.gov.tw/Default.aspx?tabid=626
- - 臺北市孕婦唐氏症篩檢補助金額與檢查項目？
  - 孕婦唐氏症篩檢為懷孕初期或中期擇一補助：1.懷孕初期（9-13週）組合式唐氏症篩檢：胎兒後頸部透明區超音波檢測及孕婦血清檢驗（篩檢之血清檢驗得依據醫師專業判斷提前至懷孕第9週進行，惟胎兒後頸部透明區超音波檢測仍應於懷孕第11週至第13週（未滿14週）進行）。補助金額為2,200元。2.懷孕中期（15-20週）孕婦唐氏症篩檢：孕婦血清檢驗。補助金額為1,000元。※ 中期唐氏症篩檢，本局僅補助2項血清檢測（AFP（甲型胎兒蛋白）、β-hCG（貝它人類絨毛膜促性腺激素） ）費用1,000元，若市民要求檢測4指標需自行另付差額。http：//www.health.gov.tw/Default.aspx?tabid=626
- - 若已在其他縣市進行婚後孕前健康檢查或孕婦唐氏症篩檢，可以持收據或相關證明申請補助嗎？
  - 不可以。本補助方案是由特約醫療院所向本局申請補助經費；故無法受理民眾持非本局特約醫療院所之單據（收據）申請補助。
- - 申請榮譽卡後，憑卡可享有優惠方式？
  - 1.志工憑卡可免費或優惠進入全國部分文教休閒場所、風景區，本市有41個風景區。 2.志工需本人憑志願服務榮譽卡進入各場所始可享有免費或優惠措施。 ＊相關資料請至社會局網站-愛心互動園地-志願服務-獎勵表揚-志願服務榮譽卡查詢。 網址：http：//www.dosw.taipei.gov.tw/ct.asp?xItem=87715000&ctNode=74031&mp=107001＊聯絡人：1999（外縣市02-27208889）轉1633 宋小姐
- - 若要更換已過期的印鑑證明，但戶籍已不在原申請的戶籍地，應至新戶籍或原戶籍地辦理?
  - 戶籍遷出戶籍管轄區域者，原登記之印鑑視同廢止；但戶籍遷出國外或在已全面建置印鑑數位化系統之同一直轄市、縣(市)內之遷徙者，不在此限。戶籍在本市可至本市之任一戶政事務辦理（戶籍遷出國外者受委任人於當事人最後戶籍地戶所辦理）外，設籍於其他地區者，應至新戶籍所在地之戶政事務所重新辦理印鑑登記及申請印鑑證明核發。
- - 應如何辦理印鑑證明？
  - 設籍於臺北市者，如果您需要辦理印鑑證明，可由1、當事人本人（法定代理人）、受委任人至本市任一戶所辦理。2、短期出國戶籍尚未遷出國外者應出具授權書由受委任人至本市任一戶所辦理。3、戶籍遷出國外當事人本人(法定代理人)至本市任一戶所辦理；受委任人於最後戶籍地戶所辦理。• 當事人親自申請1、國民身分證正本2、印鑑章3、規費(1份新臺幣20元)• 委託他人申請(須已申辦過印鑑登記，如果未申辦過印鑑登記，則不能委託他人辦理)1、受委託人國民身分證正本、印章(亦可簽名)2、委託人印鑑章、委託書(當事人在國外委任辦理者，其委任書或授權書應經我駐外使領館之驗證始得辦理。提憑文件如係大陸地區製作，應在大陸當地之省、自治區、直轄市或縣、市、區等涉臺公證處申請公證，並經由財團法人海峽交流基金會驗證後始予採認)及國民身分證影本或有效之中華民國護照、居留證或其他身分證明文件影本。3、規費(1份新臺幣20元)
- - 要如何申請印鑑登記？
  - 戶籍設於臺北市如果您需要辦理印鑑登記，申請方式1、申請印鑑登記由當事人本人（法定代理人）至本市任一戶所辦理；或當事人出具經法院或民間公證人公證或認證之委任書委任他人代辦。2、短期出國戶籍尚未遷出國外者應出具授權書由受委任人至本市任一戶所辦理。3、戶籍遷出國外當事人本人(法定代理人)至本市任一戶所辦理；受委任人於最後戶籍地戶所辦理。• 當事人親自辦理1、應備當事人國民身分證正本2、印鑑章3、規費新臺幣20元(另：印鑑證明每份新臺幣20元)• 出具經法院或民間公證人公證或認證之委任書申請1、受委託人身分證正本、印章(亦可簽名)、當事人印鑑章、法院或民間公證人公證或認證之委任書正本及國民身分證影本或有效之中華民國護照、居留證或其他身分證明文件影本。2、規費新臺幣20元(另：印鑑證明每份新臺幣20元)。 當事人人在國外，授權國內親友申請• 當事人人在國外，授權國內親友申請1、受委託人身分證正本、印章(亦可簽名)及當事人印鑑章、授權書正本(授權書應經我駐外使領館驗證始得辦理；提憑文件如係大陸地區製作，應在大陸當地之省、自治區、直轄市或縣、市、區等涉臺公證處申請公證，並經由財團法人海峽交流基金會驗證後始予採認)及國民身分證影本或有效之中華民國護照、居留證或其他身分證明文件影本。2、規費新臺幣20元(另：印鑑證明每份新臺幣20元)。
- - 馬桶水箱裡放置藍色潔廁塊是否會影響供水系統?
  - 自來水用戶應依「自來水用戶用水設備標準」相關規定設置，馬桶水箱內係由浮球開關控制水位，並不會發生馬桶逆滲造成回流的問題，此與是否放置藍色潔廁塊並無關係，網路所傳播之訊息與事實不符。
- - 本府執行禁用一次性及美耐皿餐具之法源為何？
  - 臺北市政府禁用一次性及美耐皿餐具執行要點。
- - 配合新水價自105年3月1日起實施，大用水戶之抄表及發單日是否有變動？
  - 本處考量大用水戶用水量較大，抄表日期如未固定，將造成每月用水度數差異較大，不利大用水戶自我管控，故配合新水價自105年3月1日起實施，大用水戶改為固定每月底抄表，使每月抄表計量之用水度數更符實際，收費日亦由每月5日調至每月7日，遇假日則順延。
- - 汽機車噪音如何檢舉?
  - 行政院環境保護署設立有噪音車檢舉網站（網址： http：//noisecar.epa.gov.tw/），若民眾發現噪音車輛可依「使用中機動車輛噪音妨害安寧檢舉辦法」相關規定，並利用該檢舉網站檢舉，敘明車號、車種、發現時間、地點及妨害安寧事實或違規證據(例如相片或影片等)並留下相關資訊，經查證確有妨害安寧情形者本局環保稽查大隊將通知車主前往指定地點接受檢驗。
- - 何謂低頻噪音?陳情人應如何配合檢測?
  - 一、所謂低頻音量係指音源在20Hz-200Hz頻率範圍內之音量。二、依噪音管制標準第3條第6項規定，測量音源20Hz至200Hz頻率範圍時，應於陳情人所指定其居住生活之室內地點測量，故本局環保稽查大隊稽查人員辦理低頻噪音案件需會同陳情人方可處理。
- - 如何得知台北是否提供實驗室使用資訊?
  - 可以至本局官網(http：//www.doed.gov.taipei/np.asp?ctNode=80526&mp=105001)搜尋相關資訊內容。
- - 本府設施禁用一次性及美耐皿餐具的日期為何？
  - 市政大樓自105年4月1日實施，市政大樓以外市府機關學校自105年8月1日實施。
- - 請舉出3種一次性餐具。
  - 紙餐盒、塑膠餐盒、木片餐盒、紙杯、塑膠杯、紙碗、塑膠碗、塑膠湯匙、紙盤、塑膠盤、紙碟、塑膠碟、免洗筷、塑膠攪拌棒、竹製攪拌棒、塑膠湯匙、塑膠刀子、塑膠叉子、竹製叉子、或其他用完即丟之餐飲用品。
- - 美耐皿餐具表面刮痕裂縫遇熱食容易溶出哪種化學物質？
  - 三聚氰胺。
- - 禁用一次性及美耐皿餐具後，可以哪些材質之餐具替代？
  - 可改以陶、瓷、玻璃及不�鋼材質製成之環保餐具替代。
- - 禁用一次性及美耐皿餐具實施後，機關學校開會、舉辦活動可不可以提供塑膠杯水及塑膠瓶裝水？
  - 不可以。
- - 禁用一次性及美耐皿餐具實施後，機關學校開會、舉辦活動如需供餐可不可以提供一次性餐具？
  - 不可以。
- - 禁用一次性及美耐皿餐具實施後，機關學校內餐廳、賣場、販賣餐飲處所及臨時攤位不可以提供一次性及美耐皿餐具，消費者如需外帶且未自備環保餐具，業者應如何處理？
  - 應以販售方式提供環保餐具；或提供消費者以押金借用環保餐具，歸還時退還押金之服務。
- - 何謂「當年獲利」？如小於章程所訂分派員工、董監事酬勞之定額者，應如何分派？
  - 1.所謂獲利狀況係指稅前利益扣除分派員工酬勞前之利益。實務上應指不含員工酬勞金額之稅前利益；亦即當年度除員工、董監事酬勞(公司得於章程訂定依獲利狀況之定額或比率分派董監事酬勞)未估算入帳外之稅前利益結算金額，並以此金額直接依章程所定比率或定額計算員工、董監事酬勞。但公司尚有累積虧損時，應預先保留彌補數額。2.公司當年度獲利小於章程所訂分派員工、董監事酬勞之定額者，依當年度獲利分派員工、董監事酬勞。但公司尚有累積虧損時，應予彌補(預先保留彌補數額)。                                                                                                      例：未估算員工、董監事酬勞及所得稅費用之全年度稅前利益金額為1,000,000元，即依公司章程所訂之10%(舉例)員工酬勞計算員工酬勞金額，得出100,000元(1,000,000元X10%=100,000元)。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 臺北市提供快篩流感的醫療院所
  - (1)因為流感快篩試劑屬於自費醫療項目，由醫療院所自行決定是否提供此項服務。民眾可於就醫之前，向醫療院所查詢是否提供流感快篩服務。(2)流感快篩試劑其缺點為敏感度僅50~60%仍嫌不足，容易造成「偽陰性(結果是陰性，卻不能排除陽性可能)」。所以醫師還是以病人臨床症狀加以判斷，流感快篩結果只是醫師輔助參考，不是一定必要的檢驗。
- - 賽格威可否行駛於人行道及道路範圍？
  - 賽格威(Segway)係以電力驅動、具有自我平衡能力之運輸載具，依據道路交通安全規則第83條之3規定，非屬汽車及動力機械範圍之動力載具、動力運動休閒器材或其他相類之動力器具，不得於道路上行駛或使用。爰此，如員警發現行為人於道路範圍內行駛或使用賽格威，得依道路交通管理處罰條例第32條之1規定：「非屬汽車及動力機械範圍之動力載具、動力運動休閒器材或其他相類之動力器具，於道路上行駛或使用者，處行為人新臺幣1,200元以上3,600元以下罰鍰，並禁止其行駛或使用。」，予以舉發。
- - 如何參加臺北市政府LINE官方帳號「on air」活動？
  - 加入市府LINE帳號好友，於3/16 (三)中午12：30∼13：30就會收到訊息，只要於活動期間回答指定問題，就有可以獲得抽獎機會。
- - 如何取得「馬上關懷急難救助作業要點」之內容及申請表件？
  - 可就近向居住所在地區公所洽詢，或自行上網至臺北市政府社會局網站下載參閱。(網頁左方連結中>社會救助>急難及災害救助>馬上關懷急難救助)
- - 我去年才結婚，想要申請就業者托育補助及育兒津貼，今年報稅如選擇夫妻分開申報，如何看稅率是否符合規定？
  - 因為規定父母雙方綜合所得稅申報核定稅率均未達２０％，故不管合併或分開申報，只要有任一方超過規定之稅率即表示不符合補助標準。
- - 「馬上關懷急難救助」經申請（或通報）後，何時可獲得協助？
  - 自核定機關（本市12區公所）接獲受理窗口之申請書（通報表）起算，於24小時內進行實地訪視（遇到周末假日時，將視申請者實際需求評估是否仍須立即訪視，或延至下一個工作日再進行訪視）。經過訪視且核准補助者，區公所將於以核准當日核發救助金為原則。
- - 「馬上關懷急難救助」是否僅有低收入戶或非低收入戶才能提出申請？
  - 依「馬上關懷急難救助作業要點」規定，本專案之服務對象為：1.負擔家庭主要生計責任者死亡、失蹤或罹患重傷病、失業或因其他原因無法工作，致家庭生活陷於困境；2.其他因遭逢變故，致家庭生活陷於困境。故本案並無限制僅低收入戶或非低收入才能申請，若符合上述基本條件者，自得檢具與急難事由相關之證明文件提出申請。
- - 「馬上關懷」與本市急難救助有何異同？
  - 一、救助對象(一)馬上關懷：1.負擔家庭主要生計責任者死亡、失蹤或罹患重傷病、失業或因其他原因無法工作，致家庭生活陷於困境。2.其他因遭逢變故，致家庭生活陷於困境。(二)本市急難救助：1.本市市民因患病、死亡、遭遇意外、天然災害或其他原因，致生活陷於困難；2.行旅本市之他縣（市）民，缺乏旅費無法返鄉；3.本市市民或行旅本市之他縣(市)民，在本市遭遇天然災害或其他重大災害事件致受傷或死亡。二、受理窗口(一)馬上關懷：主要受理窗口為本市各區公所社會課及里辦公處。(二)本市急難救助：本市各區公所社會課及社會局所屬各區社會福利服務中心。三、核發時效(一)馬上關懷：受理、認定迄核發之時程約3天。(二)本市急難救助：以隨到隨辦為原則，如需訪視者則約7至15天。四、核發金額(一)馬上關懷：核予補助者每案核發1-3萬元救助金。(二)本市急難救助：核予補助者每案核發2萬元以下救助金。
- - 「馬上關懷」的申請（或通報）窗口為何？
  - 本市馬上關懷急難救助之申請或通報窗口為：居住所在地的里辦公處或區公所（優先通報窗口，可至現場填寫申請書/通報表或自行至臺北市政府社會局網站下載表格填寫。表格路徑為首頁左方連結社會救助社會救助通報。)社會局： 1.若民眾致電本局，可先依「馬上關懷急難救助認定基準表」所列情事進行初篩，並建議民眾以前往各區公所或里辦公處申請/通報為優先。2.因民眾提出申請後24小時內將由本市12區公所責成訪視小組進行訪視，為能就近提供協助，建議民眾以居住所在地的里辦公處及區公所為優先申請（或通報）窗口。且申請時需檢附與急難事由相關之證明文件，以利訪視小組人員進行評估。
- - 「馬上關懷急難救助」有無限制申請次數？
  - 依「馬上關懷急難救助認定基準表」規定：馬上關懷急難救助之急難事由以最近三個月內發生者，並同一事由以申請一次為限；但經救助後生活仍陷於困境，經訪視評估，認定確有再予救助之需要者，最多得再予一次之救助。
- - 「馬上關懷急難救助」向居住所在地或戶籍所在地申請？
  - 若申請人之居住地與戶籍地不同，為便於區公所、里幹事等相關人員就近訪視，以向居住所在地之里辦公處、區公所申請（或通報）為原則。因此，若申請民眾目前居住於外縣市（如：基隆市等），則應向當地鄉（鎮、市、區）公所或縣（市）政府社會局（處）洽詢並提出申請。
- - 臺北市提供載運寵物服務之車隊？
  - 臺北市提供載運寵物服務之車隊如下：彰勝、北松、優良、國華、聖雄、聖惠、聖欽、婦安、大都會（以上採聯合派遣系統，手機：55178 市話：02-4499178）、志英衛星車隊(02-27694493)及皇冠大車隊(02-27916000)。動保處也提醒民眾，在您預約叫車時，如有寵物載運服務需求，請事先主動向車行客服人員表明載運寵物之體型大小、是否有自備運輸籠具等情形，以利客服人員協助叫車。
- - 公訓處有無提供身障者專用停車位？
  - 有，身障學員可憑本人身心障礙手冊使用本處「身障者汽、機車專用停車位」。
- - 學員於研習期間如何申請手語翻譯或聽打服務 ?
  - 請逕至?臺北市勞動力重建運用處網站－業務服務區?下載申請表並填具基本資料，經重建處審核後，請通知本處班期承辦人協助相關事宜。
- - 目前臺北市是否有辦理「汽車貨運調查」？其調查期間、對象及目的為何？
  - 一、「汽車貨運調查」係由交通部主辦，各縣市政府為協辦機關，負責辦理轄區內之調查業務，為定期按半年辦理之實地訪問調查。二、資料調查期間為105年4月16日至4月22日，以登記於臺北市之自用與營業用貨車為訪查對象。三、該調查主要目的係為蒐集臺灣地區自用與營業貨車之貨運流向及流量等動態資料，以供編製全國性及地區間產業關聯表及交通部研擬汽車貨運管理相關措施之參據。四、本調查之資料經彙總統計後，將刊載於交通部編印之「汽車貨運調查報告」內，有關重要統計結果亦將登載於交通部網站（網址：http：//www.motc.gov.tw/ch/home.jsp?id=56&parentpath=0,6）以供各界參考。
- - 什麼是街貓友善照護(TCCP)行動方案？
  - TCCP為Taipei Cat Care Programme的縮寫，是現今唯一經過證實能有效控制街貓數量的方法，是街貓誘捕絕育回置方案(TNR)再加上後續領域護理的升級進化。詳細內容請參閱本處網站街貓友善照護(TCCP)行動方案專區(網址： http：//www.tcapo.gov.taipei/ct.asp?xItem=77562321&ctNode=69463&mp=105033 )
- - 「童樂世界」活動時間與內容?
  - 活動一：台北城故事兒童劇時間：4/2-5/15 每週六日 (詳細演出場次請上探索館官網查詢)地點：台北探索館3樓活動方式：由馬來西亞籍導演-林耀華(貝克)親自操刀創作專屬台北城的故事兒童劇，以台北探索館展出內容為故事發想，4/2、4/5、5/8下午2時由真人現場演出，其餘週末以定目劇方式播映，詳細播映時間依官網公告為主。活動二：柚子哥哥說台北故事時間：4/16 (六) 下午2時-3時 地點：市府1樓沈葆楨廳活動方式：momo家族的柚子哥哥擔任說故事哥哥的角色，延續台北城故事兒童劇的故事，以說故事配上道具及唱跳活動來講述台北城的故事，並於現場輔以故事道具並進行活動有獎徵答。活動三：網路人氣插畫家插畫教學見面會時間：4/10、4/17、4/24、5/1、5/15 週日 下午2時-3時地點：4/10與5/15於市府1樓沈葆楨廳、其餘場次於台北探索館3樓活動方式：人氣插畫家如三隻熊、耍花招、Shirley Chiang(江長芳）、XS(林虹亨）及Jhanpao(詹波）等現身現場教學如何簡單運用插畫畫出屬於自己的台北城故事，參與插畫家見面會的民眾還可獲得限量1000份的插畫著色繪本1本，每場次數量有限，發完為止。                                                                                                                                            活動四：「台北˙禮好」慈善義演活動時間：4/24（日）下午2：00-4：00地點：台北市政府1樓沈葆楨廳活動方式：「台北˙禮好」自2015年10月承接台北市政府出版品紀念品展售中心至今已5個多月，搭配台北探索館本次系列活動正式介紹給市民朋友們認識外，現場也規劃活動集章贈送限量贈品及momo家族歡樂唱跳秀活動。活動五：媽咪我愛您 親子同遊送好禮時間：5/7-5/8（六）(日）上午9：00-下午17：00地點：台北探索館3樓活動方式：搭配母親節當週活動，凡著親子裝民眾或與現場世大運舉重熊進行親子合照上傳FB就可以獲得限量康乃馨一朵。活動六：台北城市著色DM時間：4/2-5/15(探索館週一休館除外) 9：00-17：00地點：台北探索館1樓服務台、台北市東門永康商圈發展協會店家及台北探索館官網。活動方式：民眾可自由索取台北探索館童樂世界活動DM，背面即為台北城市著色紙，供小朋友進行著色彩繪。
- - 申請育兒津貼需要檢附什麼資料？
  - （一）申請表(申請人為父母雙方者，需父母雙方皆於申請表上簽名或蓋章)。（二）申請人（為父母雙方，如因家庭變故可為監護人或其他實際照顧兒童之人）及兒童身分證明文件（例如：戶口名簿影本）。（三）申請人郵局或市庫代理金融機構帳戶(台北富邦銀行)影本(如申請人帳戶因故被凍結或無法開戶、使用，申請人得向區公所社會課索取「育兒津貼匯款帳戶異動切結書」，載明原因後簽署切結方能指定申請人以外之他人帳戶為本津貼款項匯入帳戶)。
- - 育兒津貼的申請人稅率需未達20%，我如何知道自己最近1年經稅捐稽徵機關核定的稅率？
  - （一)您可親持本人身分證正本至戶籍所載地稅捐稽徵所臨櫃查詢,或以網路線上提出申請(財政部稅務入口網\線上申辦\稅務線上申辦\綜所稅系統)。（二）受理單位會協助市民向財政部整批查調最近1年之核定稅率，故申請時毋須檢附稅率相關資料，屆時請耐心等待審查結果之通知即可。
- - 我想申請育兒津貼,如果我家小孩不是被父母雙方申報扶養，而是讓他人（如：祖父母、叔伯舅姨…等）申報扶養，那該如何計算？
  - 本津貼之排富規定只審父母雙方綜合所得稅申報核定稅率，所以不管兒童被誰申報撫養都不影響。
- - 衛福部社家署父母未就業家庭育兒津貼與臺北市育兒津貼有何不同？
  - 1.補助年齡：（1）父母未就業家庭育兒津貼補助至兒童滿2足歲當月止。            （2）臺北市育兒津貼補助兒童滿5足歲當月止。2.設籍條件：（1）父母未就業家庭育兒津貼未有設籍及實居臺北市之限制。            （2）臺北市育兒津貼申請人及兒童(新生兒除外）需設籍並實居本市滿一年。3.父母就業條件：（1）父母未就業家庭育兒津貼父母至少一方未能就業，在家照顧兒童。                （2）臺北市育兒津貼未特別規定。4.補助金額：（1）父母未就業家庭育兒津貼：所得稅率未達20%，每名兒童每月補助2500                 元；低收入戶5000元；中低收入戶4000元。            （2）臺北市育兒津貼：所得稅率未達20%，每名兒童每月補助2500元。5.互斥福利項目：（1）父母未就業家庭育兒津貼與育嬰留職停薪津貼或保母托育費用補助不得併領。                （2）臺北市育兒津貼可併領育嬰留職停薪津貼或保母托育費用補助。
- - 我想要申請就業者托育補助及育兒津貼，但我自己有身障手冊，無謀生能力，也沒什麼工作所得，一直都讓別人申報撫養，那要如何看我的稅率？
  - 如果您自己不是納稅義務人，就看您配偶的核定稅率；如果您跟先生/太太都讓別人申報撫養，就看你們夫妻雙方被認列綜合所得稅扶養親屬免稅額之納稅義務人的稅率。
- - 如果家裡有2個5歲以下的小孩，雖然戶籍都在臺北市，可是不在同一地址，我要分別向兩個不同的區公所社會課提出育兒津貼的申請嗎？
  - 不需要！為了方便市民，您只要擇定其中一個小孩的戶籍所在地之區公所社會課一起提出申請就可以了。
- - 如果我的先生已經在台北市設籍滿1年，而我本人沒有滿1年，明年初小孩才出生，那我必需等我和小孩都設籍滿１年才可以申請育兒津貼嗎？
  - 您必需等您在台北市設籍滿1年才符合「兒童之父母雙方皆設籍並實際居住北市滿1年以上」的申請要件。但如果您和您先生設籍已皆滿１年，但孩子未滿１歲，只要孩子出生登記於本市，且戶籍未有遷出本市的紀錄還是可以向區公所社會課提出育兒津貼的申請。
- - 我家住台北市也設籍台北市滿１年了，但我的太太是外籍人士，在台灣還沒有戶籍，可以申請育兒津貼嗎？
  - 可以的！如果父母其中一方為在臺灣地區無戶籍國民、大陸地區人民或外籍人士，請檢附其居留證影本，只要有實際居住本市滿1年之事實，即可以申請育兒津貼。
- - 育兒津貼規定申請人最近一年經稅捐稽徵機關核定的稅率需未達20%，我如何自行取得資料？
  - （一）受理單位會協助市民向財政部整批查調最近1年之核定稅率，故申請時毋須檢附稅率相關資料，屆時請耐心等待審查結果之通知即可。（二）如您想先行確認自己的綜合所得稅核定稅率，可親持本人身分證正本至戶籍所載地稅捐稽徵所臨櫃查詢或以網路線上提出申請(財政部稅務入口網\線上申辦\稅務線上申辦\綜所稅系統)。
- - 育兒津貼在什麼情形下，父母可以由其中一方提出申請呢？需要檢附什麼文件？
  - （一）有下列情形之一者，可以由父或母一方舉證後提出申請：　 1、父或母一方失蹤，經向警察機關報案協尋未獲，達六個月以上。　 2、父或母一方受一年以上徒刑或拘束人身自由保安處分之宣告，且在執行中。　    3、父母離婚對兒童權利義務之行使或負擔未為協議或法院尚未酌定。　 4、非婚生子女與父或母一方同住。　 5、有家庭暴力或其他變故。（二）有上述情形者，可檢附以下文件：　 1、警察受(處)理查詢人口案件登記表之收執聯影本。　 2、在監執行或保安處分處所執行證明書。   3.戶籍謄本影本或訴訟程序進行相關文件。   4.實際照顧證明文件，如相關費用支出收據...等。   5、暫時╱通常保護令影本、家庭暴力事件驗傷診斷書影本、警察處理家暴事件調查表影本。   6、如果有社工服務者，則由受理單位逕向社工索取訪視記錄影本。   7、其他。
- - 育兒津貼為何限制父母其中一方未設籍北市就不符資格？
  - 育兒津貼是臺北市政府特別籌編預算，以落實照顧本市之市民之措施，故規劃有父母雙方及兒童均需設籍本市之規定，如您或您的先生/太太設籍外縣市，建議可洽當地縣市政府詢問該轄內之福利措施或考慮戶籍遷至本市並實際居住，以享本市相關福利。
- - 衛福部社家署父母未就業家庭育兒津貼，未就業如何認定？
  - 未就業審核基準，為申請人至少一方符合：1.未參加勞工就業保險，且 2.經稅捐稽徵機關核定之最近一年薪資所得及執行業務所得(稿費除外)兩項合計，未達本年度每月基本工資乘以12月之金額
- - 衛福部社家署父母未就業家庭育兒津貼資格為何？何時開辦？
  - 「父母未就業家庭育兒津貼」於101年1月1日開辦，應符合下列規定：1.育有2足歲以下兒童。2.兒童之父母（或監護人）至少一方因育兒需要，致未能就業者。3.經直轄市、縣(市)政府依社會救助法審核認定為低收入戶或中低收入戶，或兒童之父母(或監護人)經稅捐稽徵機關核定之最近一年綜合所得總額合計未達申報標準或綜合所得稅稅率未達百分之二十者(扣除低收入戶及中低收入戶者)。4.兒童未經政府公費安置收容。5.未領取因照顧該名兒童之育嬰留職停薪津貼或保母托育費用補助。
- - 衛福部社家署父母未就業家庭育兒津貼補助金額多少？
  - 1.低收入戶：每名兒童每月補助5,000元(含現行低收入戶兒童生活補助費)。2.中低收入戶：每名兒童每月補助4,000元。3.兒童之父母(或監護人)經稅捐稽徵機關核定之最近一年綜合所得總額合計未達申報標準或綜合所得稅稅率未達百分之二十者：每名兒童每月補助2,500元。4.已領有政府其他相同性質之生活補助或津貼者，不得重複領取本項補助，其額度低於本項補助者應補足差額。5.本項補助金額以月為核算單位，補助至兒童滿2足歲當月止。
- - 臺北市育兒津貼和衛福部社家署父母未就業家庭育兒津貼有什麼不同？
  - 1.臺北市育兒津貼自100年1月1日起開辦，為全國首創0-5歲的補助。2.衛福部社家署的父母未就業家庭育兒津貼自101年1月1日起開辦。3.兩項差異如下：◎「臺北市育兒津貼」：【申請年紀】0-5歲以下 【設籍條件】兒童及申請人（父母雙方、監護人或其他實際照顧兒童者）設籍並實際居住臺北市滿一年以上【父母就業條件】未規定【補助金額】所得稅率未達20%：每位兒童每月2,500元，最多可領到兒童滿5足歲當月。【其他限制】可與育嬰留職停薪津貼、保母托育費用併同請領。【申請制】向兒童戶籍所在地區公所提出申請,經審查符合資格者，追溯自申請當月；但兒童自出生後60日內於本市戶政事務所完成出生登記或初設戶籍登記，並申請本津貼通過者，可追溯自出生月份發給。◎「父母未就業家庭育兒津貼」：【申請年紀】0-2歲以下【設籍條件】無設籍限制【父母就業條件】父母至少一方因照顧兒童未就業【補助金額】1、所得稅率未達20%：2,500元。2、中低收入戶：4,000元。3、低收入戶：5,000元【其他限制】不得與育嬰留職停薪津貼、保母托育費用重複請領。【申請制】向兒童戶籍所在地管轄機關提出申請，經審查符合資格者，追溯自申請當月；但兒童自出生後60日內於本市戶政事務所完成出生登記或初設戶籍登記，並申請本津貼通過者，可追溯自出生月份發給。
- - 我有申請育兒津貼，如果我的戶籍有異動，要如何申報?會影響我的補助資格嗎?
  - 育兒津貼有兩種，請依您目前享領津貼及遷區類型，確認您的補助資格。(一)臺北市育兒津貼：1.戶籍異動後仍於同區內(○○區遷○○區)：請於1個月內主動向該區公所申報，津貼將續發，不影響補助資格。2.本市內戶籍異動(○○區遷□□區)：請於1個月內主動向原申請(或遷入地)之區公所申報，津貼將續發，不影響補助資格。3.遷出本市(本市遷 □□縣/市)：請於1個月內主動向原申請之區公所申報 ，津貼將自次月起停發。(二)父母未就業家庭育兒津貼：1.戶籍異動後仍於同區內(○○區遷○○區)：請於1個月內主動向該區公所申報，津貼將續發，不影響補助資格。2.本市內戶籍異動(○○區遷□□區)：請於1個月內主動向原申請(或遷入地)之區公所申報，津貼將續發，不影響補助資格。3.遷出本市(本市遷□□縣/市)：請於1個月內主動向原申請之區公所申報，並向遷入地重新提出該津貼申請，本市將自次月起停發該津貼，並由遷入地重新審查您的補助資格。
- - 新生兒可以一起辦出生登記和育兒津貼嗎？
  - 為了便利申請，自101年4月開始，父母也可以至本市各戶政事務所辦理新生兒出生登記時，一併檢送育兒津貼申請案件，屆時戶政事務所會再將申請件轉由區公所社會課審核。
- - 若我想要申請臺北市育兒津貼，兒童和父母雙方設籍在臺北市滿一年應如何計算？
  - 兒童和父母雙方（即申請人）需在申請當日往前推算已經連續設籍本市滿一年以上。
- - 新生兒申請臺北市育兒津貼，如何才能從出生當月開始領補助？
  - 1、本項津貼如果經兒童戶籍地區公所社會課審核符合資格者，原則追溯自受理申請月份開始核發。2、但如果依戶籍法規定在兒童出生後60日內至本市戶政事務所完成出生登記或初設戶籍登記並且提出本項津貼的申請者，經審核符合本項津貼資格就可追溯到兒童出生當月開始核發補助。
- - 目前臺北市是否有辦理「104年農林漁牧業普查」？其調查期間、目的及內容為何？
  - 臺北市政府配合行政院主計總處辦理「104年農林漁牧業普查」，於105年4月1日至5月31日期間展開普查實地訪查工作。　　本次普查的目的在於蒐集全國農林漁牧業資源分布與使用、生產結構、勞動力特性、資本設備、經營狀況等最新基本資料，以供作政府研訂相關產業施政方針、輔導政策及地方特色產業發展之重要參考依據。　　訪問內容包括經營情形、資源分布與使用、作物種植、家畜家禽飼養、服務作業、林木種植與水產生物養繁殖情形、勞動力特性、營業收支、實際運用資產及各業別其他專用明細項目等。為加強六級化農業母體資訊蒐集並周延農漁業勞動力資訊，新增「經營農漁業相關事業」、「自家初級農漁產品生產銷售分配情形」、「可從事農作物栽培面積之主要灌溉水源」、「各月份從事自家農漁業工作之男、女外僱人力」、「自家初級農漁產品投入農漁業相關事業之設算金額」及「自家初級農漁產品可銷售收入生產成本費用占比」等問項，以掌握產業脈絡。
- - 本次農林漁牧業普查調查方式為何，如何確認普查員身分？
  - 農林漁牧業普查係由行政院主計總處統籌規劃，各縣市政府負責執行各該轄區內實地訪查工作，家庭戶採「派員面訪調查法」，非家庭戶採「自行填報法」，訪問對象為本市經營農藝及園藝、畜牧、農事及畜牧服務、林業、漁撈及水產養殖等生產與休閒活動之業者均為本普查調查對象。　　普查員於辦理訪查時，均會攜帶行政院主計總處製作之普查員證，以供受訪者識別身分，如有任何疑問請逕向行政院主計總處或臺北市農林漁牧業普查處洽詢：行政院主計總處免付費電話：0800-007589 轉11，臺北市農林漁牧業普查處電話：02-27208889轉分機7651至7656，亦可上網查詢，104年農林漁牧業普查普查員查詢系統：https：//agrcas.dgbas.gov.tw/sc/行政院主計總處104年農林漁牧業普查專區網頁：http：//www.stat.gov.tw/ct.asp?xItem=39105&ctNode=553&mp=4臺北市農林漁牧業普查處專區網頁：http：//dbassurvey_agr.gov.taipei/
- - 連線市政信箱網站發生安全連線失敗，出現「憑證有無效的簽章」訊息。
  - 此問題是瀏覽器未安裝政府憑證管理中心發行之憑證造成。請依下列說明之步驟操作，匯入最新版的政府憑證，即可解決瀏覽器無法開啟市政信箱網站的問題：(一)使用Firefox瀏覽器【步驟1】請連線至GCA 政府憑證管理中心下載/儲存最新版憑證(下載網址  http：//gca.nat.gov.tw/repository/Certs/GCA2.cer )。【步驟2】請點選Firefox功能列表中的《工具》→《選項》，以便開啟設定畫面。【步驟3】於選項設定功能頁面，依序點選《進階》→《憑證》→《檢視憑證清單》→《憑證機構》→選擇憑證《匯入》開啟檔案選取功能頁面，並選取/開啟於步驟1所下載的《GCA2》檔案，勾選『信任此憑證機構以識別網站』→ 確定。【步驟4】完成匯入作業後，即可重新連結登入所有 gov.tw 的 https 網站。(二)使用IE瀏覽器【步驟1】請連線至GCA 政府憑證管理中心下載/儲存最新版憑證(下載網址  http：//gca.nat.gov.tw/repository/Certs/GCA2.cer )。【步驟2】請點選IE功能列表中的《工具》→《網際網路選項》→《內容》，以便開啟設定畫面。【步驟3】於內容設定功能頁面，依序點選《憑證》→《匯入》，進入憑證匯入精靈，點選下一步，並選取/開啟於步驟1所下載的《GCA2》檔案，點選下一步， 選擇「自動根據憑證類型來選取憑證存放區」，再點選下一步，點選「完成」，點選「確定」完成安裝。【步驟4】完成匯入作業後，即可重新連結登入所有 gov.tw 的 https 網站。(三)使用chrome瀏覽器【步驟1】請連線至GCA 政府憑證管理中心下載/儲存最新版憑證(下載網址  http：//gca.nat.gov.tw/repository/Certs/GCA2.cer )。【步驟2】請點選chrome功能列表中的《設定》，以開啟設定畫面。【步驟3】於設定功能頁面，依序點選《顯示進階設定》→《管理憑證》→《匯入》，進入憑證匯入精靈，點選下一步，並選取/開啟於步驟1所下載的《GCA2》檔案，點選下一步， 選擇「自動根據憑證類型來選取憑證存放區」，再點選下一步，點選「完成」，點選「確定」完成安裝。【步驟4】完成匯入作業後，即可重新連結登入所有 gov.tw 的 https 網站。
- - 臺北市政府環境保護局委託臺北市就業服務處辦理「105年儲備駕駛甄試」現場報名問答集
  - Q1：是否可以幫家人、朋友代為報名？A：可以。無份數限制，請委託人先行確認填寫內容、簽名及檢附文件均正確無誤且齊備，若於報名現場發現有誤或缺件，恕無法完成報名，請於報名截止日前重新報名。Q2：受朋友或家人委託代為報名，是否需要填寫委託書？A：不需要。Q3：受委託人持有委託人報名表件至報名現場報名時，發現報名表件內容有誤，如協助委託人塗改報名表內容並加蓋委託人私章以茲證明，是否可行？A：不可以。如報名表件內容有誤，恕無法完成報名，請受委託人將報名表件帶回，由委託    人自行修正，並請於報名截止日前重新報名，逾期恕不受理。請報考人仔細審閱報名表件內容是否無誤後，再轉交予受委託人。如受委託人執意塗改委託人資料，相關責任概由受委託人與委託人自行承擔。Q4：大貨車職業駕照被吊銷，但有大客車職業駕駛執照，可否報名？A：依簡章規定，凡有大貨車、大客車或聯結車等其中一種職業駕駛執照，即可報名。惟本次甄試針對駕駛違規情形作事後審查，如經查照確有吊扣、吊銷處分者，取消其後續甄試或錄取或進用資格。Q5：失業好一陣子，已未投保勞工保險並轉投保國民年金保險，欲以特定對象身分報名保障類組，是否可以不用附勞保明細？A：不可以。請攜帶4月1日後由勞保局核發之勞保明細（請至勞保局申請，地址：10013 臺北市中正區羅斯福路1段4號），始符合簡章內載明應繳報名文件之規定。Q6：4月11日至現場報名，發現證件未帶齊全，故未能完成報名，怎麼辦？A：請於4月13日報名截止前，備齊報名應繳文件資料，至臺北市就業服務處重新報名。本次報名不受理補件，故請確實攜帶應繳報名文件報名。Q7：101年5月9日時仍持有大貨車職業駕駛執照，之後因故轉換持有大客車職業駕駛執照，但大客車職業駕照不滿1年，請問可以報名嗎？A：原則上可以，但請報考人持身分證與駕照至監理站申請駕駛經歷證明，作為持有職業駕照年資之證明。Q8：曾持有職業大客車駕照，因任職公司倒閉而轉換成普通大客車駕照，導致持有職業駕照年資中斷。報考人近日將至監理站轉換回職業大客車駕照，則職業駕照年資是否可合併計算？A：可以，並須符合簡章規定年資合計1年以上。Q9：25元郵資收費，可以給郵票嗎？A：不可以。現場會向報考人收取郵資並開立收據做為報名需檢附文件之一，請自備零錢繳    納。Q10：報考人為公車司機，由於職業駕照需配戴在身上，是否可由家人代為報名時，攜帶影本駕照當作證明？A：可以，並須備齊簡章規定之相關報名資料。Q11：路考測驗開的車輛為何？A：路考測驗，由環保局提供統一規格車輛，黃色且類似載運貨物之大卡車。（如下圖）Q12：報考人曾經改名字，但畢業證書上為舊名字，可否報名？A：請報考人攜帶舊名字的畢業證書及戶籍謄本（需有詳細記事），戶籍謄本記事內容有載明更改名字事宜，以供查驗。Q13：報考人遺失畢業證明，舊的戶籍謄本載有學歷資訊，是否可以此作為學歷證明文件？A：學歷證明文件須為各級學校開立之畢業證書，如報考人遺失畢業證書，請向原畢業學校申請開立畢業證明。Q14：我的身分有多種類別，如中高齡、低收入戶，請問我可以都報名嗎？A：依簡章規定，報考人須擇一類組報名，一經選定不得更改，故建議報考人斟酌自己的情形，並擇一類組報名。若重複報名2類組以上，將改列為一般類組。Q15：結構性失業勞工含有契約期滿失業嗎？A：結構性失業勞工不包含契約期滿失業。依臺北市政府協助失業勞工再就業執行要點規定，所謂的結構性失業勞工，係指因勞動基準法第11條任一款情事離職者，才符合結構性失業勞工之身分，故報名結構性失業勞工者，須提供最後一家事業單位所開立之離職證明（離職原因須載明與勞動基準法第11條任一款情事有關者）作為證明文件。※勞動基準法第11條：非有左列情事之一者，雇主不得預告勞工終止勞動契約：一、歇業或轉讓時。二、虧損或業務緊縮時。三、不可抗力暫停工作在一個月以上時。四、業務性質變更，有減少勞工之必要，又無適當工作可供安置時。五、勞工對於所擔任之工作確不能勝任時。Q16：使用自然人憑證下載列印的勞保加退保明細是否可做為報名資料？A：若欲報考失業勞工組，需檢附勞保資料明細表以確認是否為失業狀態。報考人可使用自然人憑證下載列印或至勞保局申請該表。
- - 車輛於高架橋上故障拖吊相關事宜
  - 民眾所駕駛之車輛，若於本市各高架道路發生故障，需由6.5噸以上大型拖吊車進行拖吊移置時，請聯繫本大隊勤務指揮中心，將立即派遣大型拖吊車至故障地點協助移置。
- - 公司章程訂定員工酬勞及董監酬勞定額及比率訂定方式為何？
  - 公司法第235條之1所謂員工酬勞定額為固定數額(一定數額)○○元，比率訂定方式限固定數(例如：百分之二)、上下限(一定區間)(例如：百分之二至百分之十)、下限(例如：百分之二以上或不低於百分之二)三種方式。董監事酬勞定額為固定數額○○元，比率則限以上限為之(例如：不高於百分之二)。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 公司最慢應於何時依新法完成章程員工酬勞之修正？逾時是否有處罰規定？
  - 1.至遲於105年6月底(30日)前依新法完成章程之修正。2.104年5月22日修正生效，舊章程有關員工分紅之記載已失所附麗，自不允許再依舊章程辦理員工分紅。3.並無處罰之規定。4.倘公司不依新法修正章程訂定員工酬勞之分派，員工因此無法獲得酬勞之分派，員工之損失，係因公司違反法律規定不作為造成，屬私權範疇，可循司法途徑解決。又倘公司不依新法修正章程訂定員工酬勞之分派，即無章程做為分派員工酬勞之依據，員工因此無法獲得酬勞之分派，公司亦不得僅就股東為盈餘之分派。(經濟部104.06.11經商字第10402413890號函)5.105年度盈餘分派案，股東之盈餘分派事宜，則以編造時已生效章程(89.4.20經商字第89207491號函釋)為據，故公司須先行依新法修正公司章程後始得為之，易言之，公司於召開106年股東常會前，即應先行召開股東(臨時)會依新法完成修正章程，董事會始得依章程編製報表。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 104年度盈餘分派，倘公司於105年股東常會方進行修正章程議案，應如何進行討論？
  - 公司法增訂第235條之1於104年5月22日生效，基於此次修法情形特殊，104年度盈餘分派案員工酬勞、董監酬勞部分，應依新章程規定辦理，倘公司於105年股東常會方進行修正章程議案，先討論修正章程議案，再進行104年度員工酬勞分派(依新章程)之報告案。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 有限公司如何發放員工酬勞？
  - 公司法第235條之1第5項有限公司準用之，雖股份有限公司員工酬勞得以股票為之，惟有限公司在性質上無從準用，是以，有限公司發放員工酬勞時，僅得以現金為之。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 員工酬勞每年度分派幾次？如何分派？無員工編制時須否提列？
  - 1.公司法第235條之1之立法本旨在獎勵公司所有員工，合理分配公司利益，以激勵員工士氣。員工酬勞之分派，自應由公司本於公平原則訂定發放標準並據以辦理。2.員工酬勞在董事會特別決議後即可發放。惟倘員工酬勞以發行新股方式為之且涉及須修正章程提高資本額時，因須股東會決議，自應於股東會決議後依規定程序發放之。員工酬勞係一年分派一次，至於發放給員工時，一次全額發放或分次發放，均屬可行，由公司自行決定。3.倘公司無員工編制時，可不提列員工酬勞。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 公司法第235條之1但書規定之「累積虧損」是否包括營業年度中所發生之本期虧損？
  - 但書所規定彌補累積虧損，應以彌補經股東常會承認之累積虧損，尚不包括營業年度中間所發生之本期虧損。例如以104年之獲利狀況彌補累積虧損時，係以彌補經股東常會承認之103年之累積虧損為原則，並計入104年度中因會計處理而調整「累積虧損」之數額。至於104年度未計入者，至遲於105年度依前開處理原則辦理。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 如果我在青發處拾得或遺失物品時，該怎麼辦？
  - (一)您於青發處拾得物品時，請送至本處一樓服務臺或送至仁愛派出所(仁愛路1段19號)，填具相關資料或不具名登記。(二)您於青發處遺失物品時，可電洽02-2351-4078轉1101聯絡，或可親自到本處一樓服務臺登記，將遺失物的名稱、品牌、顏色等相關特徵詳細說明清楚並留下聯絡資料，本處若尋獲該遺失物將會以電話聯繫通知領取。(單位：綜合企劃課、聯絡人：吳宥嫻、連絡電話：2351-4078分機1711)
- - 公司章程董監酬勞比率訂定方式為何？可否以發放股票方式為之？
  - 公司章程董監事酬勞比率訂定方式，限以上限之方式為之，董監事酬勞之發放僅得以現金為之。當年度董監事酬勞發放比率之決定，應由董事會以董事三分之二以上之出席及出席董事過半數同意之決議行之。至於設有薪酬委員會之上市櫃及興櫃公司，則由薪酬委員會提出建議後送董事會決議。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 公辦都更實施辦法之立法意旨為何？
  - 自都市更新條例施行迄今已近二十年，期間都更案多由民間主導開發，面臨自劃更新單元面積小、缺乏計畫指導，反觀最急需辦理更新之弱勢整宅、海砂屋等災損建物缺乏協助，主管機關主導都市更新案件亦不多見，為使都市更新引導都市發展，政府角色應基於公共利益、公共安全及緊急危難由被動受理民辦更新事業審議，轉為主動投入更新規劃及開發，引導全市各區之更新發展，以達到大規模都市再生效果。
- - 公辦都更實施辦法訂定之法源依據？
  - 有鑒於現行都市更新條例未訂定明確之公辦都更操作機制，自柯市長上任以來，歷經多方研議與溝通訂定《臺北市公辦都市更新實施辦法》，明定市府選定公辦都更地區之標準及程序，包括擬定都市更新計畫指導更新地區發展、提供公共設施以及中繼住宅等，以彰顯公辦都更之公共利益。另該實施辦法係依據都市更新條例第5、6、8、9條訂定，針對條例所規定之行政程序予以補充。
- - 為何公辦都更實施辦法以自治規則之法律位階訂定？
  - 公辦都更實施辦法係遵循都更條例及本市都更自治條例規定所訂定，主要是為補充前開法令對於公辦都更案於執行及行政程序上有所不足之處予以規範。其更新辦理機制，如更新事業及權利變換計畫之擬訂與實施、容積獎勵之審議等，仍須依都更條例等相關規定辦理，不得逾越該條例之規範。
- - 公辦都更實施辦法實施後與目前更新辦理機制有何不同？
  - 過去都市更新案大多由民間主導開發，產生爭議不斷、自劃更新單元過小、弱勢整宅與海砂屋等災損建物協助及已取得拆除執照之更新案無法執行等困境。故為突破現行都更困境，公辦都更實施辦法提出多個創新機制。（1）為提升公辦都更案之公益性，於公辦都更案擬定之都市更新計畫中納入地區公益性或服務性設施，以提升都市整體環境品質並提供民眾優良居住環境。（2）為維護範圍內所有權人之權益，並使權利價值之計算更加公開、透明化，故明定公辦更新案應建立公開之估價條件且事前估價權值比例，每年定期檢討並公告之。（3）民辦都更案件如遭遇有無法推展之情勢，為協助本市更新之推動，可申請由市府受理，除須符合本辦法第4~7條之規定，並經市府評估且核定後確認轉軌為公辦都更案。（4）優先提供中繼住宅安置土地及建築物所有權人，以利都市更新案之進行。（5）輔導缺乏專業技術協助之海砂屋等災損建物進行都更重建。（6）都市更新事業計畫及權利變換計畫案經核定，並已取得拆除執照及建造執照，而有拆除困難之案件，明定臺北市都市更新及爭議處理審議會得成立專案小組評估調查之作業規範。
- - 公辦都更實施辦法的辦理類型有哪幾種？
  - 依公辦都更實施辦法之規定，辦理類型可歸結為以下四種類型。（1）【全程型】：由政府主導大規模地區都市更新的標準作業程序(SOP)，包含大區塊型-公辦都更8+2旗艦計畫及基地型-具潛力及民間提案計畫。（2）【半程型】：民辦都市更新案遇有窒礙難行之情形，經實施者同意撤回原申請案，由原範圍內相關所有權人檢具達都市更新條例（以下簡稱本條例）第22條規定同意比例之同意書者，得申請由市政府受理轉軌為公辦之機制。（3）【諮詢輔導型】：輔導海砂屋等災損建物都更重建。（4）【代拆型】：針對民辦都更已取得拆除執照而有拆除困難案件，由市府成立專案小組進行協調與評估，作為都市更新條例第36條規定執行參考依據。
- - 民辦轉軌公辦等於政府直接指定特定建商擔任實施者？
  - （1）考量部分事業計畫已報核之民辦都更案可能遭遇窒礙難行，倘改為公辦都更，可透過公開透明之估價，減少原來實施者與所有權人之爭議，並透過都市設計及增加公共性設施，提升更新案之公益性。故明定經實施者同意撤回原申請案，並由原範圍內私有土地及合法建築物所有權人選定代表，檢具達都市更新條例第二十二條同意比例之同意書，申請公辦都更，都發局將依公辦都更實施辦法第4~7條規定辦理適宜性評估，確認是否選定為公辦都更案，並報府核定。（2）另外，經評估改由公辦都更方式辦理者，尚須依公辦都更實施辦法第8條規定，由市府自行實施或經公開評選程序委託都市更新事業機構、同意其他機關 (構) 為實施者，實施都市更新事業，故如係委託都更事業機構，依法須「經公開評選程序」，無市府直接指定某特定建商為實施者主導更新開發之疑慮。
- - 私有土地或建物所有權人參與公辦都更案需要出錢嗎？
  - 公辦更新案依公辦都更實施辦法第8條規定找到實施者之後，就會依都更條例及本市都更自治條例等規定實施更新事業，故有關費用之提列標準與民辦都更案一致，即無論公辦或民辦都更案共同負擔之項目及審核標準都一樣，所有權人應分回之權值將於扣除共同負擔費用後確認。
- - 公辦更新案範圍中如果有弱勢租、住戶是否有提供安置計畫？
  - 為了協助公辦更新案中所有權人之搬遷安置，故於公辦更新案實施辦法的第16條即明定可優先提供中繼住宅予土地及建物所有權人。
- - 依公辦都更實施辦法政府可以直接強拆房子嗎？
  - 已核定之都市更新案依都市更新條例第36條向本府申請代為拆除者，並依公辦都更實施辦法第18條規定得由臺北市都市更新及爭議處理審議會成立專案小組就該案進行評估與協調，並製作評估報告後，作為市府執行都市更新條例第36條之參考。
- - 公辦都更有市民參與機制嗎？會不會強行將我家納入公辦都更範圍？
  - 依公辦都更實施辦法第5條規定公辦都更案需先進行適宜性評估，包含調查居民參與更新之意願等，並報府核定。即公辦更新案之範圍，須經前開適宜性評估後確定，其中已納入基地範圍周邊意願調查。且依該辦法第14條規定，公辦都更案應以社區工作室、網路媒體或社區說明會等公開透明作業方式，公開相關資訊，其中無論是社區工作室或社區說明會等，皆為提供民眾表達意見之溝通平台。故於前期適宜性評估，都市更新之推動過程均有對外溝通平台，強化開放透明機制。
- - 依公辦都更實施辦法之半程型（民轉公）案件，是否具有公益性？
  - （1）考量更新事業計畫尚未核定案件，面臨所有權人因都更權益分配爭議不斷，推動窒礙難行時，民辦轉軌公辦將給予實施者與範圍內私有土地及合法建築物所有權人新選擇，避免老舊窳陋建築物延宕多年無法更新。（2）民辦轉軌公辦之案件，仍須符合公辦都更實施辦法第4至8條之辦理程序。即須經適宜性評估、擬定都市更新計畫，再由本府自行實施、公開徵求或同意其它機關構擔任實施者、重新擬訂事業計畫等。（3）前項更新地區之劃定，本府應就都市之發展狀況、居民意願等事項進行全面調查及評估，並視實際需要分別擬定都市更新計畫，提送本市都市計畫委員會審議通過。期以計畫指導，改善過去民辦都更案缺乏整體規劃問題。
- - 能否到外縣市申請同性伴侶註記、製發公函、同性伴侶註記刪除？
  - 為讓同性伴侶就近申辦、保障同性伴侶權益，內政部自106年7月3日起開放跨區受理同性伴侶註記，所以現設籍於臺北市的市民可直接到全國任一戶政事務所（除該縣市政府有不受理情形外）申請同性伴侶註記。相關申請方式及應備證件，依受理機關所屬縣市政府之作業規定。
- - 請問青少年發展處開放時間？
  - 答：本處場館開放時間為週一至週日9：00~21：00，農曆除夕休館一天；每半年配合場館維護休館一天，106年歲修日為1月26日及9月4日。(單位：綜合企劃課、聯絡人：吳宥嫻、連絡電話：2351-4078分機1711)
- - 請問青發處有沒有提供免費無線網路？
  - 答：本處提供Wi-Fi（Taipei Free熱點）免費無線上網服務區域為：1、2樓大廳、3樓親子館及5樓青少年藝文沙龍。若您是第一次登入Taipei Free，須先申請，其步驟如下：(1)請輸入手機號碼；(2)輸入手機簡訊驗證；(3)可開始上網，詳細操作方式並請參閱Taipei Free網站：http：//www.tpe-free.taipei.gov.tw/tpe/TPE-Guide.html。(單位：秘書室、聯絡人：曾煜翔、連絡電話：2351-4078分機1768)
- - 青發處是否設有無障礙廁所?
  - 答：本處於B1至9樓均設置無障礙廁所，以便身心障礙者洽公、參與展覽、研習及觀賞節目。(單位：秘書室、聯絡人：陳淑琴、連絡電話：2351-4078分機1753)
- - 青發處場館內有沒有飲水機可以使用？有定期在檢驗水質嗎?
  - 本處B1直排輪區、1樓大廳區、3樓臺北演藝廳、4樓舞蹈教室、5樓流行廣場、6樓國際會議廳、8樓Live Band體驗中心及9樓創新學習基地內設有飲水機並依規定定期進行飲水設備維護及水質檢驗。(單位：秘書室、聯絡人：陳淑琴、連絡電話：2351-4078分機1753)
- - 請問青發處是否有哺集乳室？
  - 為提供有意願哺育母乳之婦女無障礙哺乳環境，本處於2樓勞動局青年職涯發展中心及3樓設有哺集乳室，另於1樓服務臺設有母乳專用冰箱，提供有需求的民眾使用。(單位：秘書室、聯絡人：陳淑琴、連絡電話：2351-4078分機1753)
- - 請問青發處是否提供吸菸區？
  - 依據菸害防制法，本處全面禁止吸菸，另於周圍人行廣場及綠色草坪區域亦已劃設無菸區域，違反者最高可處一萬元罰鍰。(單位：秘書室、聯絡人：陳淑琴、連絡電話：2351-4078分機1753)
- - 請問可以帶寵物進入青發處嗎?
  - 顧及其他民眾權益、環境衛生及確保安全，本處禁止攜帶寵物進入，請勿將寵物置於手提袋或背包裡帶入。(單位：綜合企劃課、聯絡人：吳宥嫻、連絡電話：2351-4078分機1711)
- - 請問導盲犬可以進入青發處嗎？
  - 依身心障礙者權益保障法第60條之規定，視覺、聽覺、肢體功能障礙者由合格導盲犬、導聾犬、肢體輔助犬陪同或導盲犬、導聾犬、肢體輔助犬專業訓練人員於執行訓練時帶同幼犬，得自由出入公共場所、公共建築物。(單位：綜合企劃課、聯絡人：吳宥嫻、連絡電話：2351-4078分機1711)
- - 請問要如何到達青發處？
  - 若您是運用大眾運輸工具如捷運、公車或YouBike，到達青發處有以下方式：(一)搭乘捷運：1、臺大醫院站(第2號出口)：搭乘捷運淡水信義線至本站下車，於出口沿公園路至凱達格蘭大道轉仁愛路，沿人行道、地下道至本處，步行約12分鐘。2、善導寺站(第3號出口)：搭乘捷運板南線至本站下車，沿林森南路往仁愛路至本處，步行約10分鐘。3、中正紀念堂站(第5號出口)：搭乘捷運淡水信義線或松山新店線至本站下車，穿越兩廳院於信義路右轉，再沿信義路直走至林森南路左轉，沿林森南路直走至仁愛路1段右轉至本處，步行約15分鐘。4、東門站(第2號出口)：搭乘捷運淡水信義線或中和新蘆線至本站下車，於出口沿信義路二段右轉金山南路二段往前走，再左轉沿仁愛路至本處，步行約18分鐘。(二)搭乘公車：1、林森南路站：671.208.22.15.295.204.670.20.38.0東.信義幹線.信義新幹線2、仁愛路一段：261.651.630.37.270.621(三)本處大門人行道上亦設有YouBike站點(林森南路/仁愛路一段路口)，可自捷運善導寺站、捷運東門站、捷運中正紀念堂站、捷運臺大醫院站騎YouBike至本處正門。(單位：綜合企劃課、聯絡人：吳宥嫻、連絡電話：2351-4078分機1711)
- - 請問青發處有沒有停車空間?開放時間為何？如何收費？
  - (一)本處B3、B4設有停車位。(二)本處停車場為24小時開放，人員服務時間自上午7時至晚上10時。(三)臨停費用：以每半小時15元計費，未達半小時者以半小時計。(單位：秘書室、聯絡人鄭宇鈞、連絡電話：2351-4078分機1756)
- - 請問青發處可以使用悠遊卡繳交停車費嗎？
  - 本處停車場使用etag系統，以自動感應方式(車牌辨識)入場停車，您無須按取任何入場票證即可入場。目前已開啟悠遊卡繳費機制，離場前請至B3、B4中央電梯處自動收費機，以現金(請自備零錢)或悠遊卡刷卡方式繳費。(單位：秘書室、聯絡人：鄭宇鈞、連絡電話：2351-4078分機1756)
- - 請問我想要在青發處租借車位，要如何辦理?
  - 本處停車場提供月租服務，月租客戶：全日4,100元、日間3,300元、夜間2,500元，如有需求請備妥汽車行照影本，於每月25日至當月月底（上午9時至下午9時）至1樓服務臺辦理 (單位：秘書室、聯絡人：鄭宇鈞、連絡電話：2351-4078分機1756)
- - 沒有攀岩經驗可不可以到青發處攀岩場體驗攀岩?是否有入場規定?
