  - 內政部營建署網站首頁（網址：http：//www.cpami.gov.tw）右側→「快捷服務」→「住宅補貼專區」106年度自購住宅貸款利息補貼問與答一、　　什麼是自購住宅貸款利息補貼？二、　　申請本貸款利息補貼者應具備哪些條件？三、　　哪些情形不得申請本貸款利息補貼？四、　　今（106）年度什麼時候開始受理申請？五、　　今（106）年度計畫辦理多少戶？符合條件的申請人都可以獲得補貼嗎？六、　　申請書要到哪裡索取或下載？七、　　如何申請？向哪裡申請？八、　　申請時應檢附哪些文件？九、　　申請人提出申請後，政府如何審查？多久可以知道審查結果？十、　　申請人申請時尚未購屋，可於審查期間先行購屋嗎？十一、　申請人經政府核定，取得政府核發的「自購住宅貸款利息補貼證明」後，就可以購買住宅、辦理貸款了嗎？「自購住宅貸款利息補貼證明」有沒有期限的限制？十二、　取得「自購住宅貸款利息補貼證明」且經直轄市、縣(市)政府確認符合基本居住水準後，至承辦貸款金融機構辦理貸款手續時，應檢附哪些文件呢？十三、　辦理本貸款的金融機構是哪幾家？十四、　辦理本貸款的住宅有沒有什麼特別的規定？十五、　辦理本貸款利息補貼者可以購買位於戶籍地以外之直轄市、縣（市）的住宅嗎？十六、　持有共有住宅，可否視為無自有住宅？十七、　本貸款的優惠貸款額度、償還年限及優惠利率？十八、　本自購住宅貸款利息補貼是否會定期查核接受補貼者之資格？多久查1次？什麼情況會停止利息補貼？十九、　申請人及其家庭成員的家庭年所得、動產及不動產持有狀況，由誰查核？如何查核？二十、　應列入查核的家庭成員有哪些人？二十一、家庭年所得及財產，應符合中央主管機關所定之基準為何？二十二、每人每月平均所得應低於一定金額，要如何計算？二十三、家庭年所得及財產，今（106）年度住宅補貼申請案將採計哪一年度之財稅資料？二十四、評點時，家庭成員具備哪些條件會獲得加分？二十五、評點時，家庭成員如果有哪些情況會減分？二十六、以「父母均已死亡，戶籍內有未滿20歲或已滿20歲仍在學之兄弟姐妹需要照顧者」條件申請，已滿20歲仍在學，就讀夜間部、空中大學、補校等是否可以？二十七、本補貼所稱的「特殊境遇家庭」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）二十八、本補貼所稱的「單親家庭」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）二十九、本補貼所稱的「生育有未成年子女」定義是什麼？三十、　什麼是基本居住水準？什麼是平均每人居住樓地板面積未達基本居住面積標準？什麼是未具備衛浴設備？三十一、本補貼所稱的「三代同堂」定義是什麼？三十二、本補貼所稱的「災民」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）三十三、本補貼所稱的「遊民」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）三十四、本補貼所稱的「列冊獨居老人」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）三十五、同一家庭可以申請租金補貼、自購住宅貸款利息補貼或修繕住宅貸款利息補貼等2種以上的補貼嗎？三十六、申請人或其家庭成員正辦理國宅貸款、勞工建購（修繕）住宅貸款、公教住宅貸款、輔助人民自購住宅貸款、青年購屋低利貸款、新臺幣1兆8千億元優惠房貸、其他政策性房屋貸款或住宅補貼，可以再申請本自購住宅貸款利息補貼嗎？三十七、如果申請人及其家庭成員除了申請自購貸款利息補貼的住宅外，如果持有其他的不動產（例如土地、辦公室、店舖等．．．），可以申請本項購置住宅貸款利息補貼嗎？三十八、自地自建的房屋，可以申請本貸款利息補貼嗎？三十九、除了自購住宅貸款利息補貼，政府還有辦理其他的住宅補貼嗎？四十、　家庭暴力或性侵害之受害者及相對人共同持有1戶住宅或僅相對人持有住宅，因離婚訴訟或其他原因，致受侵害者需與相對人分居，且另行購置住宅者，可否申請本貸款利息補貼？四十一、申請財政部之「公股銀行辦理青年安心成家購屋優惠貸款」，可以再搭配本項自購住宅貸款利息補貼嗎？四十二、關於本貸款利息補貼如果有其他問題，要向哪裡詢問？
