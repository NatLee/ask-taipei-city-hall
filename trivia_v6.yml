- - 社區內有民眾發現街友(遊民)要怎麼辦?
  - 1.依臺北市遊民安置輔導自治條例第2條「本自治條例所稱遊民，指經常性宿於公共場所或公眾得出入之場所者。」故請話務人員多詢問通報人，是否經常看到被通報人於通報處過夜，以確認是否為街友(遊民)身分；若非經常性棲宿者，請以弱勢者通報勿以街友(遊民)身分通報。若為未成年者夜間於街頭遊蕩，請依兒童及少年福利與權益保障法通報家防中心，勿以街友(遊民)通報。2.再請依被通報人之行為，派請相關業務單位處理：(1)如有「生命危急或有危急之虞」或有「自傷傷人的行為」，請立即通報110、119儘速送醫治療。(2)如有乞討行為，請通報當地警察機關依社會秩序維護法處理。(3)如造成環境髒亂，請通報環保局依廢棄物清理法處理。(4)經常聚集場所之環境維護及場地管理權責事項，由各該管理機關辦理，請通報該場所主管機關(例如學校、圖書館及公園等)。如其有社會福利需求(如住宿、安置或生活困難)者，由主管機關轉介社會局各區社會福利服務中心協助。3.若被通報人為單純社會福利需求(如住宿、安置或生活困難)，請洽居住所在地之各社會福利服務中心，各中心地址、電話及聯絡人請見本局網站 www.dosw.gov.taipei。
- - 臺北市立浩然敬老院-參訪
  - Q1：申請參訪臺北市立浩然敬老院有哪些規定？A.   一、申請對象：與本院業務相關之社會福利機構、公私立團體、學校，並有正式立案者為限。二、申請單位於申請時，需隨申請表併附提出活動計畫或參訪目的所需之證明文件。三、申請單位參訪本院時，不得擅自變更原申請參訪目的以外之參訪內容。 四、申請單位參訪本院時，若有損害公物或器材設備者，需負責修復或照價賠償。五、申請單位應遵從帶領參訪人員之指示，勿隨意走動影響本院院民之安全及安寧。Q2：如果想要到臺北市立浩然敬老院參訪，請問要如何申請？A.請於預計參訪日之1個月以前提出申請。申請方式可以親洽、郵寄、網路方式辦理，本院於收受申請表及相關文件後，將於6天內回復申請結果。
- - 臺北市立浩然敬老院-申請入住
  - Q1：「請問我們家的長輩可否申請入住浩然敬老院？」A.依據103年11月3日修正公布生效之臺北市立浩然敬老院入出院管理自治條例，申請入院資格為：要設籍本市年滿六十五歲之低收入戶市民，無直系血親卑親屬且無自有住宅者。 Q2： 「如何辦理才能進住浩然敬老院呢？」A.凡有意進住浩然敬老院者，請先辦理「入院登記」。本院將依登記順序建立名冊，再依序通知登記者提交體格檢查表及填寫申請書，正式進入審查作業。審查結果符合入住條件者將通知入院。Q3： 「如何申請登記入住浩然敬老院？」A.符合申請入院登記條件者得檢具申請表及應附文件，申請人可親自臨櫃申請或委託他人臨櫃辦理登記。申請方式如下（請擇一申請）：一、申請人親自至本院辦理（需備齊下列所有資料）。(一)入院登記申請表1份（可至市民e點通查詢，輸入「浩然敬老院入院登記」，進行檔案下載。網址為http：//www.e-services.taipei.gov.tw/）。 (二)身分證正反面影本1份。(三)當年度臺北市低收入戶卡正反面影本1份。二、委託申辦： (一)入院登記申請表1份（可至市民e點通查詢，輸入「浩然敬老院入院登記」，進行檔案下載。網址為http：//www.e-services.taipei.gov.tw/）。 (二)委託書1份。(三)申請人身分證正反面影本1份。(四)申請人當年度臺北市低收入戶卡正反面影本1份。(五)受委託人身分證正本（驗畢歸還）。Q4： 「申請人為榮民且領有榮民相關生活補助，是否符合申請進住條件？A.申請人如為設籍本市年滿六十五歲之低收入戶市民，無直系血親卑親屬且無自有住宅者，可先辦理入院登記，依序等候審查。尚未入住前，可持續領取榮民相關生活補助；惟於入住後，基於福利不得重複領取之原則，須放棄領取榮民就養金，但長者的榮民身分不會消失。Q5： 「請問我們家的長輩申請後就可以直接入住嗎？」A.凡是申請入院登記後，本院會依序進行審查。審查工作包括申請人體檢資料、查調戶籍、訪視、評估、住房安排等程序，因此，申請後仍需等候審查。Q6： 「申請入院登記後或是入住後，長輩還可以領低收入戶補助嗎？」A.申請入院登記後，因為尚須等候審查，所以仍可領取低收入戶生活扶助費。經審核符合入院長者，入住後由本院提供食宿，並每月發放零用金，因此自入院當日起不得重複領取政府相關補助（如：低收入戶補助、身心障礙補助、租金補助…等）。Q7：「請問長輩入住後需要繳費嗎？」A.本院為臺北市公立公費老人安養護機構，院民無需繳費，由本院免費供應食宿及必需之生活給與。 Q8：「一定要單身的長者才能申請入院登記嗎？」A.除了單身長者可申請外，夫妻亦可同時申請入院登記，但夫妻需各自符合入院條件。 Q9：「如果申請入院登記後，我又搬家了或電話換過，需要主動告知貴院嗎？」A.為保障申請人之權益，請申請人主動於聯絡方式變更時來電告知本院社工組。 Q10：「如果申請入院登記後，不想入住了，該如何辦理？」A.申請入院登記後本院將依序進行審查，在尚未入住本院前，申請人可填具「取消登記聲明書」掛號郵寄本院即可取消入住申請。取消後若想再登記，請再依入院登記流程重新辦理。 Q11： 「請問我們家的長輩如果生活無法自理（如：失智或需要長期照顧者），也可以申請入住嗎？」A.申請人需符合入住條件，再辦理入院登記，本院會依序審查。審查同意入住者，本院將依院民身心狀況提供適當的照顧服務類型。 Q12： 「請問長輩如果生病，也可以申請入住嗎？」A.請先辦理入院登記，本院會依序審查，到時通知申請人進行體檢。惟申請者經醫療機構診斷罹患法定傳染病，應於接受治療並確認無傳染之虞後，方得予以入院。 Q13： 「請問若審查通過後要不要簽約？有沒有要遵守哪些規定？」A.當入院資格審查通過後，本院會通知申請人辦理入院手續，並簽訂契約。根據本院入出院管理自治條例，院民應遵守本院團體生活規範及其他管理規定（簡稱院規）。 Q14： 「請問若入住之後，想搬離敬老院可以嗎？」A.院民得隨時終止契約，搬離本院。 Q15：「請問入住後，是不是就能一直住下來？」A.依本院入出院管理自治條例之規定，當您入住本院時，會與本院簽訂契約。您可以隨時終止契約出院；若有下列情事之一者，本院得終止契約並通知限期出院：一、提供不實資料或以其他不正當方法入院。二、入院要件不存在或經敬老院核定應轉出治療或安置。三、違反院規情節重大，經輔導無效。四、近一年內累計請假或未依規定請假日數合計逾一百八十三日。但依規定請假且有正當事由，檢具相關證明，並經敬老院專案核准者，得延長九十日。五、經判處有期徒刑以上之刑確定而入監執行。Q16：「請問若有任何關於申請入院的問題，我可以問誰？」A.若您對於申請入院事宜有相關的疑問，歡迎洽詢本院社工組，洽詢電話：02-28581081轉209-210、311-315、328。 Q17：「請問我進住後，若死亡了，身後事如何處理？」A.當院民亡故，本院會聯繫緊急聯絡人或其他親友共同召開治喪會議，處理後事。若院民具有榮民身分，則由榮民服務處辦理後事。 
- - 臺北市立浩然敬老院-其他(場地租借)
  - Q1： 如何申請使用浩然敬老院活動場地？A.  一、 申請表 二、 活動計畫(活動內容或活動企劃書)三、 申請單位立案證書正本或自然人國民身分證正反面影本(本人或委託人)四、 視活動所需之其他證明文件 
- - 臺北市立浩然敬老院-志工類(結盟團體、公共服務)
  - Q1：如何才能加入臺北市立浩然敬老院結盟團體？ A.歡迎各界善心公益慈善團體加入本院結盟團體行列，定期提供關懷訪視服務、辦理文康活動或宗教服務…等等，相關事宜請與本院社工組洽詢，洽詢電話：2858-1081分機313。  Q2：學生團體如何參與臺北市立浩然敬老院公共服務？ A.請欲到本院服務的學生團體，先電洽本院社工組安排公共服務時間，討論公共服務的內容(如：關懷長者、清潔服務、表演、文書服務……等)，洽詢電話：2858-1081分機313。 
- - 請問世大運競賽場館有提供接駁車服務嗎？(接駁車的收費/營運時間/幾分鐘一班)
  - 賽會期間針對距離最近大眾運輸站（捷運車站、火車站）超過合理步行距離（超過500公尺以上）之競賽場館，將配合競賽日期及時間提供觀賽民眾往返最近捷運站或火車站之接駁車（免費搭乘）。路線及班表資訊，需配合選手報名完成後做安排，選手預計7月19完成報名，因此將於106年8月公告於2017臺北世界大學運動會官方網站(https：//www.taipei2017.com.tw/home)。
- - 我開車前往競賽場館觀賽，觀賽結束後發現我的車輛無法發動或輪胎沒有氣，請問有提供救援服務嗎？或車輛維修的商家電話嗎？
  - 2017臺北世界大學運動會基於賽會維安，館內停車場原則均不開放臨停，欲前往觀賽民眾，仍建議多搭乘大眾運輸工具前往。另賽會並無提供車輛救援服務。
- - 請問世大運各競賽的單日賽程約多久的時間？
  - 2017臺北世大運官方網站(https：//www.taipei2017.com.tw/home)可以查詢各競賽種類之每日賽程時間與詳細資訊
- - 請問世大運各競賽場館有提供免費的充電服務嗎？
  - 場館內不提供免費充電服務。
- - 請問世大運各競賽場館有提供租借輪椅/娃娃車服務嗎？(租借方式/是否須要收費)
  - 綜合服務臺無提供輪椅、娃娃車租借服務。
- - 請問世大運各競賽場館是否有提供身障者觀賞區與身障廁所？
  - 依不同場館特性及觀眾席區域大小，部分場館不提供身障者觀賞區（如：南港展覽館），場館無障礙空間列表詳見附件。
- - 市民代賑工薪津撥付事宜？
  - 有關輔導市民以工代賑工作相關經費，預算雖編列於社會局，惟係委託區公所執行，本局已將經費撥付區公所，薪津撥付事宜仍請洽詢申請工作之區公所承辦人員。
- - 支出憑證遺失如何辦理經費核銷事宜?
  - 依「政府支出憑證處理要點」第7點規定，支出憑證如有遺失或供其他用途者，應檢附與原本相符之影本，或其他可資證明之文件，由經手人註明無法提出原本之原因，並簽名。如因特殊情形不能取得者，應由經手人開具支出證明單，書明不能取得原因，據以請款。
- - 請問世大運各競賽場館是否有設置哺乳室？
  - 各場館不同，並非所有場館皆設有哺乳室。
- - 請問世大運各競賽場館是否有販售餐飲項目供觀賽民眾選購？
  - 1.場館觀眾餐飲設置，以該場館周遭200公尺內無便利商店之場館為原則。2.經餐飲處公開遴選5家社福機構，分別於(1)臺北市：國立臺灣大學綜合體育館、天母棒球場、臺北市和平實小附屬籃球館、臺北市網球中心(2)新北市：新北市微風運河、迎風河濱公園溜冰場(3)桃園市：陸軍專科學校體育館(4)新竹縣：新竹縣立第二運動場、新竹縣立體育館、新竹縣立游泳館(5)開閉幕典禮場地（臺北田徑場開閉幕205及214攤位）設置餐飲販售攤位。3.世大運場館觀眾餐飲販售日期及販售商品一覽表詳如附件。
- - 廠商詢問財物、勞務及工程之付款進度。
  - 機關於廠商提出財物、勞務及工程之請款單據後，除契約或法令另有規定外，15日內付款。如尚未收到款項，可能是應（待）付款單據與原案及有關規定不合，須由受款人補正，請逕洽本局業務科或提供本局業務承辦人與受款人等資訊，俾利協助快速查詢。
- - 我在觀賽時掉隨身物品(含證件)要怎麼辦？
  - 各競賽場館皆有設置綜合服務臺，有失物招領服務，但無掛失服務。
- - 若競賽場館撿到民眾送交的遺失物時，是否會主動通知失主領回，要怎麼領回遺失物？若為外縣市的民眾又要怎麼領回遺失物？
  - 1.若遺失物有聯絡資訊，各競賽場館皆有設置綜合服務臺，可協助通知失主。2.領回遺失物，請至綜合服務臺辦理相關流程。3.遺失物若無人領回，賽會結束後將所有遺失物移至場館附近之派出所。
- - 我在競賽場館撿到別的民眾掉落隨身物品(含證件)要怎麼處理？
  - 可交予綜合服務臺登記失物招領。
- - 請問世大運網頁可以查的到我掉落的遺失物資訊嗎？
  - 網頁無提供遺失物資訊，由綜合服務臺提供失物招領的服務登記，必要亦可登入事件通報系統追蹤。
- - 請問世大運各競賽場館是否有設置服務中心，並提供服務聯絡電話於民眾，若觀賽時發生緊急事件供通報使用。
  - 各競賽場館皆設有綜合服務臺，並備有電話，以賽會公務使用為主，若民眾有緊急事件可提供撥打。
- - 請問世大運各競賽場館是否有提供現場平面位置圖手冊？(例如：服務站位置/飲水機位置/廁所位置/醫療服務站位置/逃生門位置/消防器材位置)
  - 競賽場館設有相對應指標及平面圖，將會設置於觀眾入口可見處
- - 請問世大運各競賽場館是否有設置服務中心、緊急醫療服務站，設置位置在哪邊？
  - 競賽場館設有綜合服務臺，會設置於觀眾出入口處可見處。
- - 請問世大運各競賽場館是否有設置飲水機，設置位置在哪邊？
  - 臺北市內26處場館設有生飲台(詳細場館請洽臺北市自來水事業處，水處技術科 林先生，電話：02-87335702)，非臺北市場館則依各場館現有配備，如場館本身無設置飲水機，將不另增設。
- - 請問世大運開閉幕式或觀賽時遇到下雨，各場館有提供免費的輕便雨衣嗎？
  - 開閉幕式都將提供觀眾及選手免費的輕便雨衣，但競賽場館如遇下雨時不提供免費輕便雨衣。
- - 請問世大運開閉幕式或觀賽時遇到下雨，全身已被淋溼，請問各場館有提供吹頭髮或更衣間的服務嗎？
  - 1、開閉幕式都將提供觀眾及選手免費的輕便雨衣，但不另提供吹風機及更衣間服務2、競賽、練習場館內不另提供吹風機及更衣間服務。
- - 我可以跟競賽選手合影照像嗎？
  - 本賽會並無選手合照相關規範，如想要與喜愛選手合影照相，需在選手同意且不影響賽事運行為原則，另請遵守場地相關規範，勿闖入管制區域。
- - 我可以帶錄影/錄音設備入場，紀錄下比賽的過程嗎？
  - 本次賽事依據競賽場館違禁物品清單第16項，禁止攜帶任何專業攝錄影機入場，故錄影/錄音設備除手機外不得攜入競賽場館場域紀錄比賽過程。
- - 我可以攜帶寵物一起入場觀賽嗎？
  - 本次賽事依據競賽場館違禁物品清單第18項，禁止所有動物入場，但服務性、工作犬除外，如導盲犬、緝毒犬、偵爆犬等。
- - 我有攜帶大型物件(例如：行李箱)競賽場館有地方可以寄放嗎？
  - 競賽場館並無寄物服務。
- - 請問世大運各競賽場館有設緊急求救鈴嗎？(緊急求救鈴的位置與標示)
  - 因場館建置年不同，非所有場館皆設有緊急求救鈴。
- - 要如何申請學費及材料費補助？
  - 1.申請要件：(1)設籍本市滿四個月之原住民。 (2)參加本市下列機構舉辦之職業訓練者：A、各級公私立學校、社區大學或推廣教育部。B、合法立案之民間訓練機構或補習教育機構。C、依章程得辦理職業訓練或技術教學之合法立案人民團體。2.應檢附證件：分兩階段申請(1)第一階段申請：A、申請書。B、一個月內戶籍謄本，但原民會已有相關資料足以證明身份者除外。C、繳費收據正本(須載有政府機關核准立案字號及印花稅繳納證明)或統一發票。D、課程表(須經承訓機構核章)。(2)第二階段申請：A、申請書。B、第一階段申請核定之影本。C、結業證書或足以顯示合格結業之證明(須經承訓機構核章)。D、金融機構存摺封面影印本(加蓋私章確認)。3.補助標準：(1)由原民會審酌申請費用之合理性，核定其補助額度。從未獲本補助者補助金額最高不得超過新臺幣三萬元整。(2)如未合格結業者，不予核撥補助款。4.受理機關：原民會或各區公所。5.作業程序：分兩階段申請：(1)第一階段：A、凡個別參加符合本須知所列訓練機構之職業訓練者，於開班後一個月內，檢附經承訓機構簽證之申請書，連同其他應檢附資料逕送（或轉）原民會。B、經原民會審核無誤後，核定其補助款。(2)第二階段：A、受訓學員於職業訓練結訓後二個月內備妥應檢覆之證件資料，逕向原民會或各區公所申請補助款。B、經核准之補助案，如遇上課時程異動時，應於異動後十日內將異動後之課程檢送原民會核備。C、經原民會審查後，核撥補助款，逕匯申請人帳戶。※ 小小叮嚀： 同一年度內如尚有補助額度，可再申請不同類別之職訓項目。聯絡電話：1999（外縣市02-27208889）分機2013單位：經濟建設組聯絡人：黃先生
- - 我是參賽選手，因競賽有用藥規定，手邊有一些藥物，請問有提供醫師用藥諮詢服務嗎？(諮詢方式、服務位置、服務時間)
  - 並無提供醫師用藥諮詢服務。WADA官網與2017臺北世大運藥檢指南均有詳列禁用物質，歡迎至官網(https：//www.wada-ama.org/)下載參考。
- - 請問世大運有販賣聖火火炬、母火燈、聖火隊員的服裝嗎？
  - 官方紀念商品會推出與聖火意象相關之商品，另聖火火炬、母火燈，聖火隊員的服裝為非賣品。
- - 外國人士欲使用各場館的iTaiwan之WiFi熱點，但沒有臺灣的手機號碼要怎麼註冊使用WiFi？
  - 若您是本次臺北世大運選手想使用iTaiwan服務，已預先為選手申請iTaiwan帳號使用；若您是境外旅客想使用iTaiwan服務，您可透過線上登記、線上開通兩步驟申請iTaiwan專屬帳號：(一)線上登記：請進入iTaiwan境外旅客線上登記系統（https：//itaiwan.taiwan.net.tw/FitTravelRegister.aspx）輸入國家及護照號碼（或入台證號碼）預先登記申請。有效使用時間為30天，必要時可延長為60天到90天。(二)線上開通：抵達臺灣並完成入境通關查驗後，即可透過機場免費Wi-Fi或全台各地iTaiwan上網熱點連線至iTaiwan境外旅客線上登記系統線上開通頁面。https：//itaiwan.taiwan.net.tw/checkRegister.aspx，輸入國家地區及護照號碼（或入台證號碼），驗證完成後即可?用iTaiwan帳號開通。(三)臨櫃申請開通：您也可在全臺各地主要機場、火車站及捷運站的旅遊服務中心，備妥本人護照或大陸居民往來臺灣通行證，即可由服務人員代為申請帳號之後，在臺灣的主要室內公共場所免費無線上網。各地旅遊服務中心資訊如下：觀光局旅遊服務中心位於臺灣桃園國際機場、高雄國際機場及交通部觀光局旅遊服務中心，詳細資訊各縣市旅遊服務中心：位於松山機場、臺北市各大捷運站、臺北火車站、各縣市主要機場、火車站及高鐵站等，詳細資訊此外，您也可使用臺灣手機電話號碼或本國預付卡門號註冊帳號後使用，或註冊TPE-Free帳號來使用iTaiwan服務，相關註冊方式請參考TPE-Free服務網站資訊。
- - 各場館的iTaiwan之WiFi熱點，若無訊號或無法連線時，可以找現場的服務人員處理嗎？
  - 本服務之服務名稱(SSID)為「Taipei 2017」，相關資訊可隨時至服務網站(https：//itaiwan.gov.tw/)查詢，遇到問題可撥打24小時免費客服專線0800-081-051，直接讓客服中心為您處理。
- - 外國人士觀賽時，護照遺失可否請服務台協尋或協助申請補發嗎？
  - 代表團若發生護照遺失狀況，將由隨團志工協助提供駐臺辦事處及外交部緊急聯絡電話(886-912581001)以供聯繫。若個人賽選手或是外國人士發生此狀況，可至各場館綜合服務臺，可提供電話供其撥打至各駐臺辦事處。另綜合服務臺有失物招領服務，但無掛失及協尋服務。
- - 請問世大運觀賽期間錢包遺失，身上沒有錢搭車，可以向服務台借錢搭車回家嗎？
  - 各場館之綜合服務臺並無零用金可供外借。
- - 發現有兒童及少年(含發展遲緩或身心障礙者)遭遺棄、虐待、未受適當養育照顧(如長期未進食、獨自生活、流浪)、或父母(或其他主要照顧者)生病、入獄等，需緊急安置者。
  - 由本市家防中心(23961996分機226至228)先行緊急協助，再由該中心視個案狀況轉介其他權管單位處理。
- - 我想要收養一個小孩，不知道要去哪裡申請？
  - 一、可逕向衛生福利部社會及家庭署許可辦理收出養媒合服務單位申請：（一）財團法人忠義社會福利事業基金會，聯絡地址：臺北市文山區景興路85巷12號，聯絡電話：2933-1700。（二）財團法人中華民國兒童福利聯盟文教基金會，聯絡地址：臺北市大同區長安西路43號7樓，聯絡電話：2550-5959、2558-5806。  (三)財團法人勵馨社會福利事業基金會，聯絡地址：臺北市大安區羅斯福路2段75號8樓，聯絡電話：2369-0885。二、另本市相關兒少收出養問題，均可逕洽本市兒童及少年收出養服務資源中心，聯絡地址：台北市大同區長安西路43號8樓，聯絡電話：25583690轉296或社會局兒童及少年福利科(1999分機6972至6974)。
- - 要如何申請危機家庭兒童及少年委託安置暨收容費用補助？
  - 一、申請委託安置：倘兒少有兒童及少年福利與權益保障法第62條情事，家長得向本市社會局各社福中心、公設民營福利服務中心、或方案受託單位提出委託安置申請。二、申請委託安置費用補助：前項委託安置所需費用應由家長支付，若無力支付，可透過社工員檢附相關文件，向社會局兒童及少年福利科提出費用補助申請。三、申請應備文件：（一）委託安置費用申請表(全額自願負擔者免付)。（二）委託安置契約書(已用印一式2份)。（三）財稅證明資料(全額自願負擔者免付)。（四）個案評估表。四、若有其他申請疑問，可逕洽社會局兒童及少年福利科(1999分機6972至6974)。
- - 發現有迷童、棄嬰或查無身分之兒少，需緊急安置者。
  - 就近至派出所報案，或聯繫本市家防中心(23961996分機226至228)緊急協助，再由該中心視個案狀況轉介其他權管單位處理。
- - 低收入戶如何分類?
  - 本市低收入戶共分5類,詳述如下：(106年)一.第0類，全戶均無收入。每人可領取15,544元生活扶助費；第三口（含）以上領13,800元。二.第1類，全戶平均每人每月總收入大於0元，小於等於1,938元。每人可領取14,000元生活扶助費。三.第2類，全戶平均每人每月總收入大於1,938元，小於等於7,750元。  1.全戶可領取7,100元家庭生活扶助費。  2.若家戶內有18歲以下兒童或青少年，每增加一口，該家戶增發7,500元家庭生活扶助費。  3.如單列一口(即戶內僅有1低收入戶輔導人口)18歲以下之兒童或少年，則僅核發兒童或少年生活扶助費，不得兼領家庭生活扶助費7,100元。四.第3類，全戶平均每人每月總收入大於7,750元，小於等於10,656元。若家戶內有18歲以下兒童或青少年，每增加一口，該家戶增發6,800元生活扶助費。五.第4類，全戶平均每人每月總收入大於10,656元，小於等於15,544元。若家戶內有18歲以下兒童或青少年，每增加一口，該家戶增發4,100元生活扶助費。附註：註1：家戶內如有身心障礙者或65歲以上老人另發給身心障礙者生活補助費或低收入戶老人生活補助。註2：戶內同一輔導對象，若兼具老人、身心障礙者、兒童、少年等雙重身分，則低收入戶老人生活補助、身心障礙者生活補助、兒童及少年所增發之生活扶助費，只能擇優領取，不得重覆。註3：依社會救助法或其他法令每人每月所領取政府核發之救助金額，106年度最高至21,009元為限。
- - 請問天文館是否提供導覽解說服務？應如何預約？
  - 本館提供導覽解說預約，請至展示場導覽解說預約辦法有詳細說明。另有提供假日定時導覽服務，民眾可至展示場服務台現場登記。
- - 若有街友(遊民)需要安置之處理方式
