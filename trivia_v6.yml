  - 無標題文件Q17：建物存記或容積獎勵許可事項會在土地登記謄本載明嗎?A17：建物存記或容積獎勵經本府審核許可，將登錄於土地參考資訊檔，民眾在申請土地登記謄本時，一併申請列印「參考資訊檔」，即有載明建物存記或容積獎勵相關事項。
- - 合法建物原容積證明文件若檢附困難，應如何處理?
  - 無標題文件Q18：合法建物原容積證明文件若檢附困難，應如何處理?A18：申請案若不檢附合法建物原容積證明，可依下列方式處理：(1)下列使用分區之建物於一定樓層下，得由申請人切結後，免檢附原容積證明文件。a.住宅區：住一1層樓以下、住二2層樓以下、其餘住宅區3層樓以下。b.商業區：4層樓以下。(2)由申請人切結後，改檢附使用執照圖或合法房屋證明核備書圖，後續更新如須申請合法建物原建築容積證明，仍須依規定請建築師依建築技術規則建築設計施工篇第162條之容積定義認定標準及計算方式重新核計依法簽證負責後，向建管處申請。申請案若無使用執照圖或合法房屋證明核備書圖可依下列程序辦理：a.僅有使用執照存根：由申請人委請建築師檢討簽證後，併同使用執照存根向建管處申請核備。b.舊有合法建築物無使用執照：依臺北市建築管理自治條例第32、33條規定，檢附相關文件向建管處申請核發使用執照。c.舊有合法建築物無合法房屋證明：都市計畫發布前舊有違章，依臺北市建築管理自治條例第35條規定，檢附相關文件向建管處申請合法房屋證明。
- - 申請系列二之建物涉及歷史建築或古蹟如何處理?
  - 無標題文件Q19：申請系列二之建物涉及歷史建築或古蹟如何處理?A19：建物若為歷史建築或古蹟不可申請系列二。本府瞭解文化資產對本市的重要性，故在受理申請案時，建物若疑似涉及歷史建築或古蹟，將請本府文化局協助確認，若經確認為歷史建築或古蹟，則駁回該申請案。故建議申請人在申請系列二前，先確認建物是否為歷史建築或古蹟，以避免投入資源浪費及影響重要文化資產。此外，本府在進行窳陋建物清查時，亦先行將疑似古蹟或歷史建築之案件優先排除於案件清單中，並將清查結果請文化局協助查明是否為歷史建築、古蹟，以確保在都市景觀改造的同時，保存城市歷史。
- - 申請系列二是否會阻礙或拖延更新案推動?
  - 無標題文件Q20：申請系列二是否會阻礙或拖延更新案推動?A20：參與臺北好好看系列二並已進入都市更新事業之案件，如符合都市更新條例規定，自得依該條例辦理更新事業，系列二計畫並未限制該等案件不得申請建照，惟其維護管理期程未達計畫規定期程，不得適用系列二之容積獎勵。另臺北好好看系列二係由所有權人主動申請，非強迫窳陋建物所有權人必須參與，故所有權人於申請前應自行妥善評估更新期程是否能配合管理維護期程，避免無法適用系列二容積獎勵。
- - 綠美化土地管理維護期間，土地權利變更應如何處理?
  - 無標題文件Q21：綠美化土地管理維護期間，土地權利變更應如何處理?A21：申請案於綠美化工程完工查核前，如土地權利狀態變更，因行政程序尚未終結，仍應向本府申請變更建物存記。若於完工查核後，維護管理期間，土地權利變更則無須向本府申請變更建物存記。惟仍依規定妥善管理維護，若未妥善管理維護，經累計二次通知限期改善，仍未改善者，將扣減容積獎勵。
- - 99年系列二計畫和98年系列二計畫有何不同?
  - 無標題文件Q22：99年系列二計畫和98年系列二計畫有何不同?A22：99年系列二計畫係期望在2010國際花卉博覽會綠美化完工，因此在完工期程、維管期程、申請流程及容積獎勵，和98年系列二計畫都有所不同(詳細作業內容及辦法將另行於網站公告)，說明如下：1.完工及維管期程(配合2010國際花卉博覽會期程)(1)公告受理時間至99年8月31日止(2)申請案須於99年10月30日前完成綠美化工程及向本府申請完工查核會勘。(3)維管期程規定至基地新建建物前，並至少至100年12月31日止。2.計畫程序：申請案建物存記審查通過後，即辦理綠美化工程，免審議綠美化規劃構想。3.容積獎勵：容積獎勵項沒有區分騰空和美化容積獎勵，另獎勵總額度由原基準容積10%調整至基準容積2%為上限，並配合綠覆率程度酌減。4.策略地區範圍：策略地區範圍僅包含交通要道及交通樞紐。
- - 申請99年臺北好好看系列二對申請者有什麼好處?
  - 無標題文件Q23：申請99年臺北好好看系列二對申請者有什麼好處?A23：配合系列二辦理建築物拆除及綠美化，將有容積獎勵及權利保障的建物存記證明。說明如下：1.容積獎勵：99年系列二計畫容積獎勵，在指定策略性地區最高可以得到法定基準容積2%的獎勵，非指定策略性地區則可以得到法定基準容積1%的獎勵。2.建物存記：保障申請基地未來開發的相關權利，99年5月3日公告修正之都市更新條例施行細則第15條，業增訂本府核發之建物存記證明可視為都市更新合法建物同意比例之證明文件。
- - 申請98年臺北好好看系列二對申請者有什麼好處?
  - 無標題文件Q24：申請98年臺北好好看系列二對申請者有什麼好處?A24：配合系列二辦理建築物拆除及綠美化，將有容積獎勵及權利保障的建物存記證明。說明如下：1.容積獎勵：98年系列二計畫容積獎勵分為「騰空期程獎勵」、「美化容積獎勵」，最高可以得到法定基準容積10%的獎勵。其中「騰空期程獎勵」係配合建築物拆除、綠美化完工後，核發最高法定基準容積5%的獎勵。「美化容積獎勵」則是依歷年的綠美化成本，並透過綠美化係數加權後核計，最高給予法定基準容積5%的獎勵。2.建物存記：保障申請基地未來開發的相關權利，99年5月3日公告修正之都市更新條例施行細則第15條，業增訂本府核發之建物存記證明可視為都市更新合法建物同意比例之證明文件。
- - 為了維護國內生態環境，到野外旅遊時與野生動物互動的基本原則為何？
  - 不接觸、不干擾、不餵食。
- - 為什麼98年系列二的綠美化構想要經審議會審議?
  - 無標題文件Q25：為什麼98年系列二的綠美化構想要經審議會審議?A25：98年系列二審議綠美化構想的目的是希望申請的基地，綠美化後有一定的品質。系列二係配合花博所推動之重大政策，因此綠美化完工的基地應具有相當的綠化品質，以真正達到提升本市都市景觀的目的，且因涉及容積獎勵的給予，在符合公共利益的前提下，規範綠化的品質是相當合理的。而99年系列二計畫主要是希望窳陋建物能在花博前拆除，並簡易綠美化，故簡化免經審議會審議綠美化構想，同時配合流程簡化，調整容積獎勵項目及額度，獎勵額度最高為法定基準容積2%。
- - 98年系列二計畫的騰空期程獎勵計算基準為何?係以建物座落範圍還是綠化範圍?
  - 無標題文件Q26：98年系列二計畫的騰空期程獎勵計算基準為何?係以建物座落範圍還是綠化範圍?A26：考量申請案業配合建物騰空拆除，故騰空期程獎勵以綠化面積為計算基準。
- - 98年申請系列二之私人土地，如以綠化方式綠美化(非設置臨時停車場)，可否申請地價稅減免?
  - 無標題文件Q27：98年申請系列二之私人土地，如以綠化方式綠美化(非設置臨時停車場)，可否申請地價稅減免?A27：申請系列二之私人土地綠美化申請地價稅減免部分，依財政部 98年11月19日台財稅字第09804750690號函，因私人辦理綠美化業給予容積獎勵，不符合土地稅減免規則第9條規定「無償」供公共使用之認定，故仍需依土地稅法規定課徵地價稅。
- - 98年系列二計畫中地區發展係數要如何計算?
  - 無標題文件Q28：98年系列二計畫中地區發展係數要如何計算?A28：有關地區發展係數的計算可以至更新處網站(http：//www.uro.taipei.gov.tw)的下載專區下載「地區發展系數」檔案，有提供地區發展係數的詳細計算說明。
- - 申請98年系列二計畫，何時可申請稅捐減免?
  - 無標題文件Q29：申請98年系列二計畫，何時可申請稅捐減免?A29：房屋稅減免在房屋拆除後，就可以申請，但請於拆除後30日內向各稅捐稽處提出申請。地價稅減免則請在綠美化完工考評後，向各稅捐稽處提出申請。但如為綠化，私有土地因給予容積獎勵，不符合土地稅減免規則第9條規定「無償」供公共使用，仍需依規定課徵地價稅。
- - 「合法建物及既存違建存記證明」是永久有效嗎?
  - 申請基地如果沒有於規定期限完工「合法建物及既存違建存記證明」將逕為註銷。另外基地申請建造執照時，存記證明即失效。
- - 綠美化完工期限有規定嗎?如果沒有依期限完工，會有什麼影響?
  - 無標題文件Q9：綠美化完工期限有規定嗎?如果沒有依期限完工，會有什麼影響?A9：基地如果沒有於規定期限完工，則「合法建物及既存違建存記」將逕予失效，且無法給予容積獎勵。
- - 如果是合法建築物亦需檢附專業測量技師出具之土地改良物測量成果報告嗎?
  - 無標題文件Q8：如果是合法建築物亦需檢附專業測量技師出具之土地改良物測量成果報告嗎?A8：土地改良物測量成果報告主要是涉及後續基地辦理更新相關拆遷補償費的計算；如果合法建築物無相關改良物，原則是不需要檢附測量成果報告，未來更新依建物謄本所載之面積即可。但是如果有相關改良物，則應檢附測量成果報告，以維後續更新之權利。
- - 綠美化完工的基地，可以設置圍牆或其他阻隔封閉性設施物，不開放供眾進出嗎?
  - 綠美化完工的基地，原則應提供公眾進出及不得阻礙視覺通視；但為維持社區安全及衛生，經審議會審議(或本府)通過，得設置部分的圍籬設施。但如果未經同意，私自設置圍牆或其他阻隔封閉性設施物，並經限期通知二次，仍不改善者，則將重新核定容積獎勵。
- - 系列二的綠美化有什麼相關規定嗎?
  - 無標題文件Q6：系列二的綠美化有什麼相關規定嗎?A6：為使申請人在進行綠美化規劃，有一定的依循，本系列業擬具綠美化原則，包含透水鋪面、植栽等相關規定；綠覆率則依「臺北市建築物及法定空地綠化實施要點」第12點計算方式。
- - 申請臺北好好看系列二權利關係人要全數同意嗎?
  - 無標題文件Q5：申請臺北好好看系列二權利關係人要全數同意嗎?A5：系列二因為涉及房屋的拆除，所以需權利關係人全數同意。因此在申請時，必須檢附相關權利關係人的同意書。如果涉及違建戶安置事宜，申請人應妥適處理。建物如有設定相關權利(如抵押權、地上權)部分，亦需取得該權利人同意。
- - 管理維護期間基地維管不善，會有甚麼影響?
  - 為確保管理維護品質，系列二計畫業規定考評及控管機制，說明如下：(1)定期考評：98年系列二計畫規定土地所有權人每年應定期依「臺北市建築空地管理維護辦法」第四條，向本府都市發展局(都市設計科)申請考評。(2)各區公所協助不定期就綠美化基地，如有維管不良情形通報及每年定期1月、7月通報各基地維管狀況。(3)本處定期就已完工基地例行檢查維管情形，經查核維管不良者，通知限期改善，並計點。(4)罰則：經本府考評或例行、不定期檢查不合規定者，將可重新核定獎勵容積額度。並經累計二次限期通知改善仍未改善者，將扣減其容積獎勵額度（或經1999專線投訴及本處檢查維管不良累計次數達2次亦同）。申請99年系列二計畫者，扣減建築用地法定基準容積百分之一，並得連續扣減之，但最高不連續扣減超過法定基準容積百分之五。申請99年系列二計畫者，扣減該建築用地法定基準容積百分之零點五，並得連續扣減之，但最高不得連續扣減超過法定基準容積百分之二。
- - 臺北市老舊中低層建築辦理都市更新擴大協助試辦計畫問答集
  - 
- - 今年申請過，明年是否還可以申請?
  - Q：今年申請過，明年是否還可以申請?A：依據臺北市都市更新整建維護實施辦法第九條規定：同一申請案已接受本府或本府以外相關機關（構）補助有案者，得不予補助。故申請案若於另一年度再提出申請，其是否補助仍需視建築物之區位、可視性、規模、施工方式及違章建築之處理情況排定補助順序，並經都市更新及爭議處理審議會評選通過後，始得補助。-->
- - 核准補助金額減少，是否可以變更申請書裡面的內容，減少總工程經費來彌補差額?
  - Q：核准補助金額減少，是否可以變更申請書裡面的內容，減少總工程經費來彌補差額?A：本府於公告核准補助額度時，同時公告核准比例(核准補助經費/總工程經費)，故實施者如調降總工程經費，本府將依照同樣之比例核算補助上限。例：申請書中之總工程經費為2500萬元本府核准之補助款上限為700萬元(700/2500=28%)倘實施者修正總工程經費為2000萬元，則本府補助款上限則為560萬元為上限(20000.28=560)-->
- - 基地綠美化完工後，管理維護期程未達計畫規定期程，會有甚麼影響?
  - 申請系列二綠美化完工基地如管理維護期程未達計畫規定時間，本計畫所給予之容積獎勵將失效。
- - 申請臺北好好看系列二配合拆除建築物，後續參與更新有什麼影響?
  - Q：申請臺北好好看系列二配合拆除建築物，後續參與更新有什麼影響?A：申請系列二建築物經更新處審查通過後，將發給存記證明，但因建物拆除，物權消滅，故合法建物相關更新權利（含建築物殘值，拆除費及拆遷補償費）皆無法認列。『惟容積獎勵部分，△F1及△F6（不包括合法建築物附屬之舊違章建築物）仍可認列。另舊違章建築物之拆遷安置成本亦得列入共同負擔或更新成本』。因涉及建築物所有權人權利，故建議『於』申請系列二前，『應』依都市更新條例第39條『規定，』土地和建築物所有權人應協議處理妥適，以維雙方權利。
- - 基地是空地能不能申請臺北好好看系列二的計畫?
  - 無標題文件Q1：基地是空地能不能申請臺北好好看系列二的計畫?A1：不能。臺北好好看系列計畫係為配合2010花博的舉辦，擬定的整體性計畫，共包含8項系列計畫、3項支援計畫，希望透過各層面的改造及公、私部門的共同努力，加速改善並提升臺北市的都市景觀。其中系列二係針對窳陋建築物，期望透過相關的獎勵、權利保障，鼓勵市民主動進行窳陋建物拆除及綠美化。因此基地至少需有1棟建築物才可以申請；如果全是空地建議可以申請系列六或是依臺北市空地維護管理辦法第3條規定向都市發展局(都市設計科)申請。
- - 整建維護補助計畫何種情形須依政府採購法辦理？更新處可提供何種協助事項?(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - Q：整建維護補助計畫何種情形須依政府採購法辦理?更新處可提供何種協助事項?A：一、前言政府採購法乃規範政府機關於辦理各種採購行為標準，但如團體、法人接受政府機關補助經費，考量係動支國庫行為，應適度規範。二、法令規定(1)政府採購法第4條規定，「法人或團體接受機關補助辦理採購，其補助金額占採購金額半數以上，且補助金額在100萬元以上者，適用政府採購法，並受該機關之監督」。(2)「補助金額」以個別採購金額認定之。三、案例分析(1)模式1：整建維護補助對象為「○○○公寓大廈管理委員會」，預計分別委託建築師事務所設計請照費用80萬元、營造廠商施工600萬元（使用補助經費50%）�委託建築師事務所費用因動支補助經費未達100萬元，不適用政府採購法；另委託營造廠商費用因動支補助經費達100萬元且達半數，應適用採購法。(2)模式2：整建維護補助對象為「○○○機構」，如該機構可自行設計請照，但要委託營造廠商施工600萬元（使用補助經費50%）�如補助對象為○○○建築師事務所，因自行設計請照，無適用採購法問題；另委託營造廠商費用因動支補助經費達100萬元且達半數，應適用採購法。(3)模式3：整建維護補助對象為「○○○營造廠商」，預計委託建築師事務所設計請照80萬元（使用補助經費50%），但自行施工�委託建築師事務所費用因動支補助經費未達100萬元，不適用政府採購法；另因營造廠商自行施工，無適用採購法。四、適用政府採購法者，本處協助事項(1)以受補助對象為招標主體，應依規定申請政府採購公告系統帳號及密碼。(2)本處可協助申請帳號，並提供必要法令諮詢及辦理注意事項。-->
- - 倘核准補助案之背後立面違章建築物未拆除，是否會影響變更使用執照的申請?
  - Q：倘核准補助案之背後立面違章建築物未拆除，是否會影響變更使用執照的申請?A：申請變更使用執照時，涉及違章建築部分需標記，此範圍非變更使用執照之核准範圍，未來申請竣工時，將不查驗標記部分，惟需送請建管處查報隊列管。-->
- - 如何申請仰德大道通行證？
  - 1.Q：何時開放申請105-106年度仰德大道通行證？A：自104年12月15日(日)起開始接受申請，發放時間請洽當地里辦公處2.Q：申請仰德大道通行證的途徑有哪些？A：(1)至當地里辦公處(2)親赴本局申辦(市府路1號6樓北區交通治理科，如資料無誤可現場核發)(3)郵寄(市府路1號交通局收，並註明收件人、聯絡電話及通訊地址)(4)傳真(FAX：2725-6863傳真後請致電2725-6865確認收件)3.Q：哪些地區可以申請仰德大道通行證？A：(1)士林區(限新安、陽明、永福、公館、平等、菁山、翠山、臨溪、岩山、芝山、溪山及福林里)(2)北投區(限湖山、湖田、泉源或中心里)(3)金山區 (限重和、兩湖或六股里)4.Q：哪些人可以申請仰德大道通行證？A：(1)在問題3.所述地區設籍之居民，且有自用小客(貨)車者(2)在問題3.所述地區擁有土地或建物者，且有自用小客(貨)車(3)在問題3.所述地區租屋居住者，且有自用小客(貨)車 (考量陽明山地區實施交通管制有效性，學生僅限行動不便者方得申請)(4)在問題3.所述地區設籍之公司或店家，且有公司或商業登記證明者(5)位處問題3.所述地區之機關或學校(6)位處問題3.所述地區之工地5.Q：哪些車種可以申請仰德大道通行證？A：僅限自用小客(貨)車可申請。計程車、小貨車、大貨車、大客車及懸掛「身心障礙號牌（車牌）」車輛不予管制，免通行證。6.Q：我有車子，但車主不是我本人怎麼辦？A：(1)如車主是申請人之直系血親，則檢附身分證或戶籍證明文件之正反面影本，可連結雙方之身分關係即可。(2)如是公司車輛，則檢附公司開立同意書(含該公司名稱、同意使用人姓名、車號、公司大小章)之正本以資證明。(3)如是租賃車輛，則檢附租賃契約影本(含雙方簽章、租賃期間、車號)以資證明。7.Q：我不是中華民國國籍的人，但住在陽明山上怎麼申請？A：在問題3.所述地區設籍之外國國籍民眾，且有自用小客(貨)車者，需準備以下資料申請：(1)居留證影本(2)行車執照影本(車主非本人請參照問題6.)(3)房屋租賃契約書影本(含雙方簽章、租賃期間、租賃地址)8.Q：申請仰德大道通行證需要準備什麼資料？A：隨申請者身份不同，需要準備的資料也不同，依申請者身分之不同分述如下Q.8-1至Q.8-3：8-1.Q：在問題3.所述地區設籍、擁有土地或建物或租屋居住之居民，且有自用小客(貨)車者須檢附什麼資料？A：(1)身分證或戶籍證明文件之正反面影本(2)行車執照影本(車主非本人請參照問題6.)(3)擁有土地、建物者檢附土地或建物之所有權狀，或申請時間1個月內核發之土地或建物謄本(4)租屋居住者檢附房屋租賃契約書影本(含封面、雙方簽章、租賃期間、租賃地址)8-2.Q：位在問題2.所述地區設籍之公司、店家或位處該地區工地，且有公司或商業登記證明者須檢附什麼資料？(僅供假日值班或施工需求使用，貨車非屬管制車輛，免予申請)A：(1)須以公司或店家名義來函或申請書(含公司大小章)，詳細敘明申請原因及申請數量(申請數量超過3件時，請檢附含序號、車號、申請者姓名之申請名冊)(2)申請者之行車執照影本(車主非本人請參照問題6.)(3)申請者之員工證或投保資料(須含欲申請者之姓名)(4)公司或商業登記證明文件(營利事業登記證已由行政院核定於98年4月13日起廢止，不得用於證明)(5)因工地施工需求申領者檢附工程合約影本(如頁數過多，至少檢附含封面、雙方簽章、施工期間、施工位址之資料)8-3.Q：位處問題3.所述地區之機關或學校者須檢附什麼資料？(僅供假日執行公務使用)A：(1)須以機關或學校名義來函，詳細敘明申請原因及申請數量(申請數量超過3件時，請檢附含序號、車號、申請者姓名之申請名冊)(2)申請者之行車執照影本(車主非本人請參照問題6.)
- - 請問核准補助案是否還是要申請建照?
  - Q：請問核准補助案是否還是要申請建照?A：都市更新之程序係因取得補助款，有關核准之補助案施工規模，倘符合建築法規定應辦理申請時，需向本市建築管理處申請相關執照。-->
- - 為何本次核准補助金額上限，分為70%或100%，審議會是否依據申請時之書件，決定核准補助上限高低?
  - Q：為何本次核准補助金額上限，分為70%或100%，審議會是否依據申請時之書件，決定核准補助上限高低?A：本次補助核准上限分為兩種，係依申請補助額度之100%以及申請補助額度之70%。惟實際補助金額俟後續各案依都市更新條例規定提送都市更新事業計畫時，再就工程項目是否符合「臺北市都市更新整建維護實施辦法」規定及提列額度之合理性，提經審議會確認。1.申請補助經費之70%：核准補助案件之申請人應依申請書及審議會補充說明之承諾，就立面部份之鐵窗、外掛式冷氣、管線、廣告招牌及2樓以上之違章建築物等，應全部進行拆除及整理，並符合建管法令規定。2.申請補助經費之100%：若實施者可針對建築物外部之違章建築物(含頂樓、防火巷、空地、天井等)全數拆除，並符合建管法令規定，則補助額度以申請單位提出之全額補助經費為上限。3.個案補助總經費除依前述比例外，並以新台幣一千萬元為限。-->
- - 如何辦理採購招商施作?
  - Q：如何辦理採購招商施作?A：由民眾自辦，採購金額達100萬元以上，且補助金額達百分之五十以上者，應依「政府採購法」辦理。
- - 核准補助款之上限是否可以因工程經費調漲而增加?
  - Q：核准補助款之上限是否可以因工程經費調漲而增加?A：本補助案之核准補助款上限，是依據實施者擬具申請書之總工程經費核算，補助案之實際補助金額將俟後續各案依都市更新條例規定提送都市更新事業計畫時，再就工程項目是否符合「臺北市都市更新整建維護實施辦法」規定及提列額度之合理性，提經審議會通過後始得確認，如實施者自行調降總工程費，則依核准比例調降。-->
