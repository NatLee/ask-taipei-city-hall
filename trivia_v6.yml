- - 交通維持＞有關萬大-中和-樹林線(第一期工程)中和區景平路連城路至土城區金城路交通維持簡要說明？
  - CQ861標萬大-中和-樹林線(第一期工程)LG06車站土建工程，位於新北市中和區連城路與景平路口西南側之連城路，目前正進行北側連續壁暨相關前置作業，交通維持圍籬範圍係自連城路與景平路口至連城路138號。CQ860區段標目前正進行連城路及金城路三段南側連續壁暨相關前置作業，交通維持範圍係自連城路263巷(不含)至中正路口、連城路與員山路口至連城路569巷及金城路三段272號至延壽路及延吉路口，分3區段圍設圍籬。另為配合連城路389巷至中正路口間施工圍籬設置，「連城中正路口」南側公車站牌(往臺北、永和方向)，遷移至中正路口西側之連城路457號前；另「連城中正路口」北側公車站牌(往土城、板橋方向)，遷移至中正路口西側之連城路292號前，由高速公路下匝道之公車路線908及921「連城中正路口」站配合取消「連城中正路口」站增加「中正路」站(位於連城中正路口北側之中正路726號前)。
- - 施工噪音萬大-中和-樹林線(第一期工程)中和區景平路連城路至土城區金城路夜間施工噪音
  - 捷運萬大線施工路段位連城路及金城路三段，因連城路路幅僅約24M，地下連續壁工程均需緊鄰住家施作。為考量連續壁施工階段的安全，係採連續施工方式完成，因此難免需於夜間施工而有噪音產生，為此本處已要求廠商於機具外部做好安全隔音措施，以儘量降低施工噪音，希望民眾給予支持與包涵。
