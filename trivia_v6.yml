- - 欲提起訴訟是否有救濟期間限制？
  - 如提起撤銷訴訟，應於裁決書送達後30日不變期間內向法院起訴。
- - 向地方法院行政訴訟庭提起行政訴訟，是否需要費用？
  - 提起行政訴訟前須先向法院「按件」繳納新臺幣300元裁判費。
- - 向法院提起行政訴訟應準備什麼資料？
  - 檢具行政訴訟起訴狀、裁決書、違規通知單及相關佐證資料。
- - 如何查詢違規陳述(申訴)案件目前辦理情形？
  - 請多利用本所「申訴案件進度查詢系統」查詢陳述(申訴)案件進度，若有其他相關問題，請提供車牌號碼、違規罰單單號或身分證統一編號，電洽本所服務專線（23658270轉9），我們將竭誠為您服務。
- - 陳述(申訴)回函答復，仍需繳款結案時，應如何繳納？
  - 未涉及駕照或牌照吊扣(吊銷)處分、車輛檢驗、肇事致人受傷等案件，可於接到公文答復依公文規定期限繳納，繳款方式亦隨文檢附。
- - 怎麼來裁決所？可搭乘何種大眾交通工具？
  - (1)《捷運路線》：  　　搭乘捷運松山新店線至公館站下車，於1號出口右轉直行至水源大樓7樓即可到達  (2)《公車路線》：  　　0南、1、109、1501、1505、207、208、208區、208直、236、236區、251、251區、252、253、254、254區  　　、278、278區、280、280直、284、284直、290、311、311區、505、52、530、606、642、643、644、648、660  　　、668、671、672、672區、673、675、676、74、849、895、907、棕11、棕12、棕22、綠11、綠13、藍28  　　敦化幹線、景美←→榮總(快)  (3)《客運路線》：  　　福和客運：臺北←→基隆(1550)   　　亞聯客運：臺北←→新竹(1728) 
- - 裁決所附近是否有停車場？
  - (1)公館停車場(汀州路3段230巷15號) (2)臺大第二學生活動中心停車場(羅斯福路4段85號旁)(3)臺北市自來水園區花園停車場(臺北市思源街1號)
- - 我被開紅單時被稽查人員代保管之證件（或車牌）送到裁決所了嗎？
  - 請提供您的車牌號碼或身分證字號，電洽本所（23658270轉總機9）我們將為您查詢。   提醒您！   1.若經查詢您的行照（駕照、車牌）已經送達本所，建議您至裁決所櫃檯結清所有交通違規罰鍰，可領取被代保管之駕（牌）照（惟無效之駕（牌）照將不發還）。   2.若您的行照（駕照、車牌）尚未送達本所，如果方便則請留下聯絡電話，我們將在您欲查詢的證件送達本所後，立即通知您來辦理結案手續。 
- - 我已經收到紅單，但是因為您們還沒有建檔，怎麼利用郵局或超商甚至上網繳納罰鍰？
  - 1.您的紅單上的應到案處所如非本所，我們建議您與該應到案處所聯絡辦理。   2.如紅單上的應到案處所為本所，建議您購買匯票附紅單郵寄本所（10091臺北市中正區羅斯福路4段92號7樓），按郵戳為準，4日內本所將為您辦理完成繳納罰鍰手續。另外，您也可以親臨本所、臺北市區監理所及臺北市區監理所士林監理站繳納，或將紅單傳真（23648555）至本所辦理建檔，次日即可於郵局、超商多媒體資訊機列印或上網繳納罰鍰。   
- - 臺北市有線電視關閉類比頻道，全面以數位頻道播出節目的時程？
  - 一、臺北市自105年1月起分4階段進行有線電視數位轉換，期程如下：105年12月已完成：士林、北投、大安、文山、內湖、南港。105年11月至106年4月：信義。106年1月至6月：大同、中正、中山、萬華、松山。二、由於業者服務區域較大，部分區域可能提前實施，請收視戶注意，並配合業者的作業時程。
- - 供無駕駛執照之身心障礙者使用且為該身心障礙者配偶所有之車輛，身心障礙者與其配偶是否須為同一戶籍，才可申請免徵使用牌照稅？
  - 供無駕駛執照之身心障礙者使用且為該身心障礙者配偶所有之車輛，身心障礙者與其配偶不須為同一戶籍，亦可申請免徵使用牌照稅。
- - 我的車輛已出售，可是新車主卻拒不辦理過戶，交通違規案件該怎麼辦？
  - 1.新車主拒不過戶，惟交車後產生之交通違規案件，原車主可提供雙方買賣契約書，新車主駕籍資料及違規通知單，申請辦理歸責新車主。   2.至監理機關完成拒不過戶程序後，如再出現新交通違規紀錄，請檢附刊登報紙公告及新車主姓名、身分證字號等相關資料併違規通知單辦理歸責新車主（即實際使用人）。
- - 車輛點交前之交通違規案件該怎麼辦？
  - 由法院點交函或車輛取回證明書內所點交的公司或銀行，提出以下資料申請歸責給點交前之原車主。   1.申請書。   2.法院點交函或車輛取回證明書。   3.貸款暨動產抵押契約書。   4.動產擔保交易變更登記申請書及移轉（讓與）契約書。   5.點交後公司營利事業登記證。   6.原車主戶籍謄本。   敘明被歸責對象姓名（身分證字號）或公司(統一編號）等資料逕寄至本所即可，裁決所將依據其申請將違規案件移轉予車輛當時買受人(即使用人)負擔。
- - 我要如何辦理將交通違規案件移轉給實際駕駛人（不是我違規駕駛，卻收到紅單，舉發的時間與地點，我根本不在那裡）？需要攜帶什麼文件？
  - 1.若您是車主務必在應到案日期以前填具申請書：(本所服務臺提供或自本所網站下載均可)。   　(1)車主為自然人應準備：    　　a.申請書1份(需加蓋車主印章，並填寫白天可聯絡電話)。   　　b.車主身分證明影本1份(正、反面)。   　　c.駕駛人身分證明(建議提供駕照)影本1份(正、反面)。   　　d.紅單及採證照片正本。   　　e.委託辦理另附委任書(紅單、照片遺失者，應另附切結書)。   　(2)車主為法人應準備：    　　a.申請書3份(需加蓋公司大、小章，並填寫白天可聯絡電話)。   　　b.該法人負責人身分證明影本3份(正、反面)。   　　c.駕駛人身分證明(建議提供駕照)影本3份(正、反面)。   　　d.紅單及採證照片正本。   　　e.合約書(租賃契約書)影本3份。   2.填妥申請書並備妥資料後，請於應到案日期前送交本所櫃檯收件或郵寄本所(地址：10091臺北市中正區羅斯福路4段92號7樓，  　電話：02-23658270)。   3.俟辦妥移轉歸責給實際駕駛人後，本所會通知您及車輛駕駛人。如非本市管轄者，本所會將案件移轉至正確管轄機關，辦理歸責  　事宜。
- - 移轉歸責實際駕駛人後會不會變動繳納罰鍰金額？
  - 1.不會。 2.因為給予實際駕駛人之新應到案日期，係以移轉駕駛人之日期再加45天，不會造成因逾原繳款期限而調高罰鍰金額之情形。
- - 我已向代收機構繳納交通違規罰鍰，為何在網路查詢時，仍有違規紀錄？
  - 請提供您的車牌號碼或身分證字號或違規單號，以及何時在何處繳納，電洽本所（2365-8270轉9）我們將為您查詢。可能情況為：   1.(如非同一案件)：您所繳納的案件之違規單號，並非網路上所列管的案件，您可以比對收據的單號即知。   2.(如係同一案件且非即時連線)：因您係採台新、花旗（臺灣）及聯邦銀行或超商批次銷案方式，致尚須1至10日工作天銷案。   （銀行7至10日、超商1至3日）   3.(如係同一案件且為即時連線)：我們將即時聯絡中華電信數據所查明原因，請您留下聯絡電話(手機亦可)，我們將告知查詢結果。
- - 如何至藝文推廣處藝文大樓及城市舞台？
