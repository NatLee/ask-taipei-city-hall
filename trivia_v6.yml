- - 我是臺北市政府婦女中途之家(原稱慧心家園)的住戶，遇到緊急狀況該怎麼辦?
  - (一)發生重大意外狀況，如用火不慎、肢體暴力、自殺、緊急安全事故等，均請先撥打110或119求救再通報辦公室後續處理。(二)電梯故障，請電三菱電梯（02）2733-4463派員修繕，無須付費。(三)公共水電無法正常運作，請電晟功水電（02）2702-4567檢查。(四)交誼廳大門感應無法開啟，請電中興保全至現場處理，門禁部門電話：0800-043777。(五)住家發生竊案或疑似入侵情事，請先保持現狀，撥打110或電臥龍派出所（02）2733-4439或2737-5413。(六)房門卡死無法開啟，造成住戶無法進出，請先自行找鎖匠處理，若因使用不當而無法開門需自費，若因鎖頭故障而無法開門，則請將收據(抬頭為臺北市政府社會局)交予家園辦公室，由本局負擔費用。提供以下鎖店供參考：富昶鎖匙印章行(02)2325-3327龍傑鎖店(02)2700-5883或德昇鎖店(02)2704-7912建安鎖店(02)2703-6932或大內高手0800343434（24小時)(七)其他狀況需聯繫工作人員，請洽住戶自治委員會主委代為聯繫家園督導，主委聯絡方式公告於家園一樓公布欄。若有其他疑問可洽詢婦女中途之家社工人員，洽詢電話：(02)2701-1828。
