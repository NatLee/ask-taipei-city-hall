- - 申請溫泉新設為何要收溫泉保證金？費用如何？可退還嗎？有那些情況會沒收？
  - 溫泉之開發與維護，須投入大量成本，但為破除以往申請溫泉接用須繳交高額受益費或接用費之門檻，減輕用戶使用溫泉之負擔，並避免用戶無限制或任意申請，佔用溫泉資源，乃規劃繳交保證金之機制，以導向各取所需之申請及保障本處溫泉收益。溫泉保證金依用戶申請接用之口徑、支數，照溫泉使用費核定價格表之2年總額，1次計收，金額如下表： 溫泉保證金口徑(mm) 12152024303642金額（元）151,200235,872420,336604,800945,0001,360,8001,852,200溫泉保證金於完成接用滿2年後，無息退還，如有欠費得予扣抵。 申請人自繳交保證金起至完成接用後2年內，如因廢止或違反本處溫泉營業章程第24條規定而終止供應者，沒入全部保證金，作為懲罰性違約金。
- - 106年為何要調整溫泉使用費？
  - （一）提升服務品質、精進取供設備管理維護加強人力管理、落實責任專區與用戶服務到家，增進用戶滿意，對於取供設備維護管理能投注更多資源，強化溫泉水質、水溫、水量三面向全面提升，滿足用戶使用需求。（二）反映營運成本，減少虧損本處於94年溫泉法實施後，因應溫泉取供事業成立，為提升溫泉服務品質及滿足用戶需求，逐年投入大量經費辦理溫泉取供設備更新及擴充，收支失衡日趨嚴重，近5年平均每年虧損達2千2百餘萬元。本處係自負盈虧之事業單位，盈餘依法繳庫，溫泉虧損由自來水基金盈餘填補，等同由全民買單，違反使用者付費原則，為利溫泉取供事業永續經營，亟須調整溫泉使用費，以改善財務結構。
