- - 經濟不景氣，希望政府調降地價稅。
  - 公告地價主管機關為本府地政局，依該局說明，本府辦理重新規定地價作業已衡平考量民眾地價稅負擔、社會經濟狀況、地方財政需要等各項因素，經濟繁榮程度及公共建設愈完備的地區，公告地價調整的幅度會較高。依本處104年開徵查定資料估算，因公告地價調漲，自用住宅用地平均每戶增加稅額約1,100餘元，增加的地價稅負擔有限，另按10?稅率課徵之非自用住宅用地平均每戶增加稅額約5,000餘元，由於該類土地多供出租、營業或產業使用而具有營收性質，尚符合量能課稅原則。
