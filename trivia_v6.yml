- - 小型復康巴士如何預約訂車?管理規定為何?
  - 一、依據：臺北市身心障礙者小型冷氣車乘客服務須知。 二、服務對象：領有臺北市身心障礙手冊或身心障礙證明，設籍並實際居住於臺北市者。 三、服務範圍：臺北市聯營公車營運區域。 四、收費方式：計程車日間費率三分之一。 五、營運單位：財團法人伊甸社會福利基金會及元三租車股份有限公司。 六、預約服務方式：特A級5天前可預約、A1級5天前下午可預約、A2級4天前可預約、B級3天前可預約。（例如：1/20用車，特A級可在1/15上午9時起預約訂車；A1級可在1/15下午1時30分起預約訂車； A2級可在1/16上午8時30分起預約訂車；B級可在1/17上午8時起預約訂車）。 七、臨時車趟可於搭車前3日下午5時起向客服中心洽訂。 八、訂車聯絡方式：       預約電話專線：(02)4055-6789      預約語音電話專線：(02)2176-5165      網路預約網址：https：//40556789.taipei.gov.tw/      傳真專線：(02)2999-3994九、預約訂車之優先順序，係依照「臺北市身心障礙者小型冷氣車乘客服務須知」規定：依障別等級區分為「特Ａ」等級(1.植物人。2.重度以上下肢體障礙，須撐雙拐或乘坐輪椅者)、「Ａ1」等級(重度以上視覺障礙者)、「Ａ2」等級(不屬特A、A1等級之類別障礙且所有類別障礙等級註記重度者)及「B」等級(中、輕度障礙者)，各依開放時間之電話、傳真(限聽障)或網路預約申請用車。
- - 臺北溫泉季現場有哪些美食展攤？
  - 含珍Q格格的手搖飲料珍奶類、瑪拉桑香腸雞肉串、忠誠號蚵仔煎、洪師父牛肉麵的紅燒牛肉麵、牛肉乾、常溫調理包、阿義師創義伴手禮的冷泡茶、茶糖、茶香冰棒、立體茶包罐、茶香蛋捲、茶?子、新九九牛肉麵的三星蔥燒煎餅、萬丹紅豆燒煎餅、一品山西刀削麵之家的深坑臭豆腐、寶師傅牛肉麵的椒麻花雕雞與松阪豬）、清燉牛肉湯，另有烤玉米、烤杏鮑菇、炸花枝甜不辣蝦卷、乾燒蛤、青蛙下蛋等。
