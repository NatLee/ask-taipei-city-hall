- - 如何申請臺北市市民協同防災水災受災戶鼓勵設置防水閘門（板）補助?
  - Q：本計畫為何不是全額補助?A：預防災害守護家園是臺北市政府與市民共同的責任，每位市民亦需協同防災，本府基於擴大防災效益立場，以部分金額補助為誘因，鼓勵易淹水地區市民踴躍裝設防水閘門，希望對於超過本市排水系統負荷量之大雨，家戶能自我保護身命財產安全，進而降低本市整體損失。Q：本計畫補助對象為何?A：本計畫補助對象為104年本市0607、0614水災淹水戶為範圍，為擴大防災效果於經費額度內，接受本市100年迄今淹水戶申請。Q：5年內淹水戶如何認定?A： 100年(含)以後曾領取本府淹水救助受災戶為認定基礎，擴大推斷周邊淹水區域範圍適用，從寬認定。Q：申請人資格、應備證件?A：申請人資格計有3類，分別為：1、建築物所有權人，檢附申請書、申請人身分證影本、房屋所有權狀影本。2、依公寓大廈管理條例報備有案之住戶管理委員會，由管理委員會主任委員檢附申    請書、主任委員身分證影本、管理委員會會議紀錄影本。3、未立案之住戶管理委員會，由代表人檢附申請書、1/2以上區分所有權人同意書及   其身分證影本、房屋所有權狀影本。Q：有意願的市民向誰申請?申請期限為何?A：有意申請補助者請向建築物所在地「區公所民政課」聯繫，洽詢申請事宜，最遲   需於104年9月30日前提出申請。Q：補助防水閘門（板）有無裝設高度及材質限制?種類及補助費標準為何 ? A：1、高度限制：防水閘門（板）高度為90公分以上，未滿90公分者依比例遞減補助金   額。2、材質：以「鋁合金」或「不鏽鋼」為限。3、種類及補助費標準：（1）地下室車道出入口為單車道者：每處補助新臺幣2萬5千5百元。（2）地下室車道出入口為雙車道以上者：每處補助新臺幣4萬2千5百元。（3）1樓出入口寬度1公尺以下者：每處補助新臺幣1萬2千5百元。（4）1樓出入口寬度逾1公尺者：每處補助新臺幣2萬元。     Q： 1戶(或大樓管委會)可申請補助裝設幾處防水閘門?。A： 1戶(或大樓管委會) 以補助2處為限。Q：申請作業流程?A：1、符合資格市民提出申請。   2、區公所會同申請人現場勘查是否符合補助資格。   3、申請核准後2個月內完工並檢附施工前後照片(各2張)、原核定申請表影本申       請查驗。   4、區公所於接獲申請戶完工通知2周內辦理現地查驗。   5、查驗合格後15日內撥付費用匯入申請人帳戶。
