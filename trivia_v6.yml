- - 《城市星發現─台北追星之旅》手冊暨追星打卡活動,請問紙本手冊要在哪裡索取？有電子檔嗎？
  - 可逕至台北市10座旅遊服務中心免費索取，數量有限，索完為止。旅服中心地址、營運時間等資訊請查詢台北旅遊網（www.travel.taipei）。如不便索取，也可至同一網址點選「影音刊物」→「出版品」→「文宣品」瀏覽電子版全文。
- - 《城市星發現─台北追星之旅》手冊暨追星打卡活動,我有朋友在國外，請問可以幫我寄至國外嗎？
  - 手冊並未提供寄送服務，可逕至台北市10座旅遊服務中心免費索取，數量有限，索完為止。旅服中心地址、營運時間等資訊請查詢台北旅遊網（www.travel.taipei）。如不便索取，也可至同一網址點選「影音刊物」→「出版品」→「文宣品」瀏覽電子版全文。
- - 追星打卡活動期間為何？
  - 即日起至105年11月30日（三）止
- - 追星打卡活動辦法為何？
  - 本次活動共包含10處台北熱門影視拍攝場景，民眾可前往與活動立牌合照並上傳至活動專頁，即可參加抽獎。詳細辦法請至臉書搜尋「城市星發現•追星活動」專頁。
- - 追星打卡活動有哪些獎品？
  - 獎品包括戲劇小說、電視原聲帶、海報、酷卡、明星護貝卡、L夾、拼圖、滑鼠墊等，數量有限，送完為止。
- - 追星打卡活動共有10處，請問是哪10處？
  - 追星打卡活動一共10處如下（皆為在台北的影視拍攝場景）1.雅博客二手書店台大店（1989一念間）2.八拾捌茶輪番所（愛上哥們）3.葛樂蒂咖啡館（我的極品男友）4.享你好酒不見（必娶女人）5.剝皮寮歷史街區（紫色大稻埕）6.新芳春茶行（紫色大稻埕）  7.寶藏巖國際藝術村（醉•生夢死）8.四四南村中央廣場（我的蛋男情人）9.台北市青少年發展處B1溜冰場（我的少女時代）10.U2電影館萬年館（我的少女時代）
- - 追星打卡活動詳細參加辦法如何查詢？
  - 詳細活動辦法請至台北旅遊網（http：//www.travel.taipei/）點選本活動Banner，或直接連結FB活動專頁（https：//www.facebook.com/events/1076408625789597/），或至臉書搜尋「城市星發現•追星活動」；或致電02-8792-8888。
- - 我家附近公園有臺灣藍鵲攻擊人的行為，可以找人把鳥巢拆除嗎？
  - 臺灣藍鵲是保育類野生動物，在繁殖季節會有護巢驅趕路人的行為，此時拆除鳥巢會有違反野生動物保育法之問題，因為雛鳥長大離巢約需20天左右的時間，這期間經過時可撐傘或戴帽子，即可防止藍鵲的攻擊。
- - 我到天母古道健走，發現有人放置食物企圖餵食臺灣獼猴，該如何處理？
  - 撥打1999市民熱線，會將案件分送本府相關機關加強巡查與教育宣導等處理方式，並請提供餵食地點大概位置，以便建立臺灣獼猴出現熱點資料。
- - 如果有人販賣蘇眉魚與隆頭鸚哥魚，我要如何通報？
  - 撥打1999市民熱線，本處受理後會依提供之案址地點派員前往查處。
- - 我從國外輸入的象牙雕刻品可以買賣嗎？
  - 只有刻印、雕刻、手工藝品等相關店家，向本處申請買賣同意後才能進行買賣行為；一般自然人輸入並持有合法登記文件的象牙產製品，依法只能辦理轉讓登記後妥善收藏。
- - 我到天母古道健走，遇到臺灣獼猴該如何處理？
  - 保持5公尺以上的距離，結伴同行不要落單，不要直視牠的眼睛，不要突然作出太大的動作或發出聲音，也不要揮舞手上的物品，特別是登山手杖去挑釁牠，等牠們移動到較遠處再慢慢通行。記得事後撥打1999市民熱線，本府相關機關會加強巡查。
- - 我要如何報名貴處補助保育團體辦理的生態活動？
  - 請直接撥打主辦協會的電話，或依本處發布新聞稿所示報名方式辦理。
- - 我要如何將象牙古物自國外輸入？
  - 請依野生動物保育法第24條規定辦理，並至「行政院農業委員會簽審通關共同作業平臺」之業者端申請帳號，將輸入物件照片、CITES文件及相關資料登錄於系統內，本處初審完畢後，將以公文層轉行政院農業委員會林務局審查通過後核發輸入同意文件。
- - 市民代賑工薪津撥付事宜？
  - 有關輔導市民以工代賑工作相關經費，預算雖編列於社會局，惟係委託區公所執行，本局已將經費撥付區公所，薪津撥付事宜仍請洽詢申請工作之區公所承辦人員。
- - 支出憑證遺失如何辦理經費核銷事宜?
  - 依「政府支出憑證處理要點」第7點規定，支出憑證如有遺失或供其他用途者，應檢附與原本相符之影本，或其他可資證明之文件，由經手人註明無法提出原本之原因，並簽名。如因特殊情形不能取得者，應由經手人開具支出證明單，書明不能取得原因，據以請款。
- - 本市各區戶政事務所於105年10月21日（星期五）暫停夜間服務
  - 中華電信公司將於105年10月21日（星期五）進行本市戶政機關GSN VPN網路設備維護作業，當日本市各區戶政事務所僅受理至17時30分，暫停夜間服務。
- - 我目前失業但已領有失業給付，是否還可申請特殊境遇家庭扶助？
  - 已領有失業給付者，依特殊境遇家庭扶助條例規定，已依其他法令規定取得給付者不予重複補助。
- - 「臺北最High新年城跨年晚會」停車管制措施
  - (一) 105年12月31日17時至106年1月1日03時取消停車格位，並且以下路段除公車外禁止臨時停車：  1、光復南路（基隆路－文昌街）東側 2、仁愛路（延吉街－敦化南路）北側及南側慢車道  3、基隆路2段（文昌街－光復南路）西側  4、松德路(信義路－虎林街)西側 (二) 12月31日17時~ 1月1日03時，以下路段取消路邊停車： 延吉街（市民大道-信義路）、松信路(松隆路-忠孝東路)、忠孝東路5段236巷（忠孝東路-松德路168巷）及松德路168巷（松德路-忠孝東路5段236巷）。 (三) 12月31日17時~ 1月1日03時，管制範圍內(光復南路、忠孝東路、信義路、松仁路及松智路範圍內)之路邊汽、機停車格皆於12月31日17時起禁止停車。  (四) 12月31日19時~ 1月1日03時，管制範圍內停車場只出不進、20時完全管制進出。周邊交通管制訊息，請上臺北旅遊網查詢。
- - 如何申請設立私立托嬰中心？
  - 一、欲於本市設立私立托嬰中心，請依「兒童及少年福利機構設置標準」、「私立兒童及    少年福利機構設立許可及管理辦法」、「兒童及少年福利機構專業人員資格及訓練辦    法」之規定辦理。托嬰中心申辦立案，如樓地板面積超過200平方公尺者，請先辦理建    築物使用用途變更為社會福利設施，如樓地板面積未超過200平方公尺，得免辦理建物    變更。請至臺北市政府社會局網站(網址：www.dosw.taipei.gov.tw表格下載區下    載立案相關表格。二、民眾如有私立托嬰中心申請設立問題，可電洽社會局婦幼科（連絡電話：1999轉1622    、1623），詢問各區承辦人。
- - 本市立案托嬰中心人員，取得幼保相關學歷或保母相關證明，如何辦理變更為托育人員？
  - （一）原核准之非專業人員（行政、幹事或廚工）取得幼保相關學歷之畢業證書或保母證 照或保母訓練結業證書等文件。（二）將證明文件影印一份，影本提供給任職之托嬰中心。（三）由機構出具公文附上證書影本及2年內有效體檢表寄送社會局申請變更為托育人員職稱，公文內容應載明欲變更之人員姓名、原職稱、轉任之職稱及轉任日期。（四）本局收到機構公函後進行審核無誤後，函復機構同意該人員轉任托育人員。＊有關本市托兒所人員管理，自101年1月1日起，移由本府教育局學前教育科管轄（聯絡電話1999轉6387、6388），及本市課後托育中心人員管理，自102年1月1日起，移由本府教育局終身教育科管轄（聯絡電話1999轉6428），請民眾逕洽該局詢問。
- - 托嬰中心評鑑績優名單為何？
  - 請參考本局網站http：//www.dosw.taipei.gov.tw 點選嬰幼兒照顧服務，再點選家長園地園地，選擇「托嬰中心評鑑結果」，即可看到最新的年度托嬰中心評鑑名單。 
- - 臺北市政府外部顧客滿意度調查Q&A
  - 臺北市長柯文哲為了讓各局處推動的政策更貼近民意，提高施政滿意度，因此啟動了這項外部顧客滿意度調查專案，希望透過問卷調查能夠廣為了解各局處施政直接相關的外部顧客滿意度及意見，藉以改善施政不足的地方。
- - 申請特殊境遇家庭扶助應具備什麼條件？
  - 1.申請人需設籍並實際居住臺北市，且最近1年實際居住國內超過183日，符合下列各款情形之一(新移民與設籍本市市民辦理結婚登記，且實際居住臺北市者，於尚未取得本國國籍前，得不受設籍之限制；另申請人符合家庭暴力受害，得不受實際居住臺北市之限制)（1）65歲以下，其配偶死亡，或失蹤經向警察機關報案協尋未獲達6個月以上。（2）因配偶惡意遺棄或受配偶不堪同居之虐待，經判決離婚確定或已完成協議離婚。（3）家庭暴力受害。（4）未婚婦女，懷胎3個月以上至分娩2個月內。（5）因離婚、喪偶、未婚生子獨自扶養18歲以下子女或獨自扶養18歲以下父母無力扶養之孫子女，其無工作能力，或雖有工作能力，因遭遇重大傷病或照顧6歲以下子女致不能工作。（6）配偶處1年以上之徒刑或受拘束人身自由之保安處分1年以上，且在執行中。（7）經本局評估，因3個月內生活發生重大變故導致生活、經濟困難，且其重大變故非因個人責任、債務、非因自願性失業等事由。2.申請人家庭總收入106年度每人每月未超過3萬321元，且家庭財產〈含存款本金、投資、獎金中獎所得及財產所得〉平均每人未超過46萬6,320元，不動產全戶不超過650萬元。3.符合申請資格者，本局將核發特殊境遇家庭身分認定公文。單位：社會局婦幼科聯絡人：陳慧玲聯絡電話：1999轉1951
- - 申請特殊境遇家庭扶助到收到社會局公文回覆審查結果需要多久時間？
  - 應備文件完整且自行檢附全戶財稅資料者，審核時間為10天，如需社工訪視或授權社會局查調全戶財稅資料，審核時間為30天。
- - 申請特殊境遇家庭扶助時應檢附哪些文件？
  - 申請表、領據、全戶財稅資料各類所得清單及財產歸屬清單、申請人本人之郵局或台北富邦銀行存摺帳號影本及依符合扶助對象款別檢附相關證明文件。
- - 什麼是特殊境遇家庭扶助？
  - 為協助遭逢特殊境遇情形之家庭，如喪偶、單親育有18歲以下子女，無工作能力或為照顧6歲以下子女致不能工作、未婚懷孕、家庭暴力受害或配偶入獄等情形，提供申請人及子女各項經濟補助，以協助其生活自立。
- - 特殊境遇家庭之全家人口計算範圍為何？
  - 全家人口原則僅計算二代，即申請人、子女及其配偶，如申請人或子女，由其他親屬申報為綜合所得稅之扶養人口，則其他親屬亦需列入計算。
- - 我已經是低收入戶，還可以申請特殊境遇家庭扶助嗎？
  - 為本市低收入戶，如符合特殊境遇家庭扶助所定之扶助對象之一，仍可提出申請。
- - 特殊境遇家庭扶助的扶助項目有哪些？
  - 緊急生活扶助、兒童優先進入公立幼兒園、兒童托育津貼、子女生活津貼、子女教育補助、傷病醫療補助、法律訴訟補助及創業貸款補助。
- - 特殊境遇傷病醫療補助補助對象及補助金額為何？
  - 補助對象為申請人及其未滿18歲之子女或符合第5款所定未滿18歲之孫子女，每人每年最高補助12萬元。
- - 特殊境遇家庭扶助緊急生活補助最多可以補助多少元？
  - 每人每次最多補助3個月，106年度最高補助金額為4萬6,632元（106年度每月補助1萬5,544元，以補助3個月計算），已為低收入戶或申辦低收入者，最多補助2個月，最高補助金額為3萬1,088元。單位：社會局婦幼科聯絡人：陳慧玲聯絡電話：1999轉1951
- - 我之前已申請過特殊境遇家庭緊急生活扶助，是否可再申請1次？
  - 緊急生活扶助同一事由僅能申請1次。單位：社會局婦幼科聯絡人：陳慧玲聯絡電話：1999轉1951
- - 特殊境遇家庭兒童就托臺北市市立幼兒園有無補助？
  - 特殊境遇家庭兒童就托市立幼兒園僅具有優先收托資格，並無補助費用。如負擔托育費用有困難者，得申請危機家庭托育費用補助，洽詢單位為社會局婦幼科托育股，電話1999(外縣市02-27208889)轉1623-1625。單位：社會局婦幼科聯絡人：陳慧玲聯絡電話：1999轉1951
- - 特殊境遇家庭兒童托育津貼如何申請？
  - 持特殊境遇家庭身分認定公文影本，洽子女就讀園所索取弱勢家庭托育補助申請表，由園所協助提出申請，補助款項將直接撥付園所。單位：社會局婦幼科聯絡人：陳慧玲聯絡電話：1999轉1951
- - 特殊境遇家庭法律訴訟補助對象為何？補助金額多少？
  - 以家庭暴力受害及性騷擾事件被害人為限，委任律師費每案每審最高補助5萬元。
- - 特殊境遇家庭扶助申請應備文件之全戶財稅資料要向哪裡申請？成年子女可代為申請嗎？可以由社會局查調嗎？
  - 可就近向各稅捐稽徵所或稽徵處申請。如子女已年滿20歲，需填具委任書及備妥雙方身分證即可由子女代為申請。如無法自行申請全戶財稅資料，得授權本局向國稅局代為查調。
- - 特殊境遇家庭扶助申請表格要去哪裡索取？或下載申請表格？
  - 可就近向本市東西單親家庭服務中心、各區各婦女暨家庭中心、各區社會福利中心、平宅社會工作員辦公室及本市家庭暴力暨性侵害防治中心索取，或電洽社會局婦幼科索取郵寄或傳真，洽詢電話1999（外縣市02-27208889)轉6969-6971。亦可上本局網頁網址http：//www.dosw.taipei.gov.tw/愛心互動園地/申請案件/婦女服務/特殊境遇家庭扶助單位：社會局婦幼科聯絡人：陳慧玲聯絡電話：1999轉1951
- - 特殊境遇家庭扶助要向哪個單位申請、申請方式？
  - 可以郵寄或親洽方式辦理，申請第3款家庭暴力受害相關補助，請向本市家庭暴力暨性侵害防治中心綜規組申請，洽公地址臺北市新生南路1段54巷5弄2號，洽詢電話23961996轉6809，餘其他款補助請向社會局婦女福利及兒童托育科申請，郵寄地址11008臺北市信義區市府路1號社會局婦女福利及兒童托育科收，洽公地址臺北市信義路5段15號5樓（即信義行政中心5樓），洽詢電話1999轉6969-6971。
- - 特殊境遇家庭子女教育補助如何申請？
  - 持社會局核定有效之特殊境遇家庭身分認定公文影本洽子女就讀學校辦理，申請期限依各學校規定辦理。
- - 特殊境遇家庭創業貸款補助為何？要向哪個單位提出申請？
  - 申貸補助金額以1百萬元為限，前3年免息，第4年起負擔年息1.5％，貸款年限最長7年。洽辦單位社團法人中華民國中小企業協會，聯絡電話：0800092957或23660812轉170單位：社會局婦幼科聯絡人：陳慧玲聯絡電話：1999轉1951
- - 我是離婚單親，與前配偶共同監護1名4歲小孩，可否申請特殊境遇家庭扶助？
  - 特殊境遇家庭扶助對於離婚單親家庭的申請資格以申請人獨自扶養18歲以下子女，因無工作能力或因遭遇重大傷病或為照顧子女致不能工作為限。所謂獨自扶養，以申請人單獨取得子女監護權為原則，且未與前配偶共同生活，由於您目前與前配偶共同監護子女，不符合獨自扶養子女之認定，故不符合申請資格。倘若實際確由您獨自扶養子女，另一方並未負起扶養之責，本局將派請社工員訪視協助認定。
- - 迪化污水處理廠廢氣燃燒煙囪為何會有火燄呢？
  - 迪化污水處理廠消化污泥過程會產生甲烷氣(沼氣)，可提供消化池本身作為攪拌加熱能源及提供污泥乾燥機加熱能源使用，倘還有剩餘會予以燃燒排放，故該煙囪偶爾會有燃燒排放有火燄情形。
- - 「自己的旅遊城市自己拍」影片及照片競賽徵選人氣王票選活動,請問網站連結為何？
  - 可上網搜尋「自己的旅遊城市自己拍」影片及照片徵選活動，都能夠連結到活動網址。                               活動網址：http：//tourcity.travel.taipei/
- - 「自己的旅遊城市自己拍」影片及照片競賽徵選人氣王票選活動,投票期間?
  - 投票期間：105年10月27日至105年11月16日止
- - 「自己的旅遊城市自己拍」影片及照片競賽徵選人氣王票選活動,要如何進行投票呢?
  - 請進入活動頁面(http：//tourcity.travel.taipei/)後，選擇「人氣王票選」，觀賞參賽作品並找到您所想投票之作品，並點選「投我一票」後進行資料登入，即可完成投票。
- - 「自己的旅遊城市自己拍」影片及照片競賽徵選人氣王票選活動,有限定投票資格嗎?
  - 只要有facebook能夠作為認證的媒介即可參加投票。
- - 只有臺北市民才可使用LINE空氣盒子及防汛訂閱服務嗎？
  - LINE空氣盒子及防汛訂閱服務不限臺北市民，只要加入臺北市政府官方LINE帳號為好友，並訂閱「空氣盒子資訊」及「防汛資訊」，即可享用相關服務。
- - 「自己的旅遊城市自己拍」影片及照片競賽徵選人氣王票選活動,請問抽獎獎項為何?
  - ※照片類獎項：頭獎-Canon EOS M10微單眼(單鏡組15mm-45mm) 1名貳獎-KODAK柯達PIXPRO SP360單機組  2名參獎-GOLiFE Care-X智慧悠遊手環   2名肆獎-鐵三角ATH-CKF77耳道式耳機   3名 ※影片類獎項：頭獎-Canon EOS M10微單眼(單鏡組15mm-45mm) 1名貳獎-KODAK柯達PIXPRO SP360單機組  2名參獎-GOLiFE Care-X智慧悠遊手環   2名肆獎-鐵三角ATH-CKF77耳道式耳機   3名
- - 「自己的旅遊城市自己拍」影片及照片競賽徵選人氣王票選活動,人氣王票選抽獎活動何時會公布中獎名單呢?
  - 得獎名單於11月18日在活動訊息頁面公布。
- - 「自己的旅遊城市自己拍」影片及照片競賽徵選人氣王票選活動,如果我想問活動相關事宜是否有活動專線？
  - 自己的旅遊城市自己拍專線：(02)2913-5533#603 (服務時間：上班日週一至週五 上午十時至下午六時來電)
- - 對於LINE空氣盒子及防汛訂閱服務如有相關問題，應如何諮詢？
  - 如有LINE空氣盒子及防汛訂閱服務相關問題，請於上班時間直接來電資訊局02-27208889轉8587或email至services@mail.taipei.gov.tw。
- - LINE空氣盒子及防汛訂閱服務只能訂閱台北市的資訊嗎？
  - LINE空氣盒子及防汛訂閱服務僅提供臺北市的資訊訂閱。
- - 適用勞動基準法之部分時間工作勞工於適用性別工作平等法相關假別及權益疑義？
  - 一、性別工作平等法「促進工作平等措施」之規範包括生理假、產假、安胎休養、產檢假、 陪產假、育嬰留職停薪、哺乳時間及家庭照顧假等，依該法第21條規定，受僱者為上開規定之請求時，雇主不得拒絕，並不得視為缺勤而影響其全勤獎金、考績或為其他不利之處分。二、有關《僱用部分時間工作勞工應行注意事項》陸、勞動條件基準，三、例假、休假、請假等相關權益（六）其他性別工作平等法所規定之各種假別及相關權益與全時勞工相同之意涵，以全時勞工每月正常工作時間8小時、每週正常工作時間40小時為例，有關部分工時勞工依性別工作平等法規定提出相關假別及權益之請求時，依下列原則辦理：(一)產假、安胎休養及育嬰留職停薪基於母性保護之精神，部分工時勞工請休產假者，其產假期間應依性別工作平等法第15條第1項規定，依曆連續計算；懷孕期間經醫師診斷需安胎休養者，雇主應按所需期間，依曆給假。至於有親自照顧養育幼兒需求而申請育嬰留職停薪者，其期間依曆計算，不因部分時間工作而依比例計給。(二)產檢假、陪產假及家庭照顧假部分工時勞工相較全時勞工，於工作與家庭生活之時間運用較富彈性，且部分工時勞工之每日工作時數型態多元，爰部分工時勞工於請求產檢假、陪產假及家庭照顧假時，依均等待遇原則，按勞工平均每週工作時數依比例計給（平均每週工作時數除以40小時，再乘以應給予請假日數並乘以8小時）。(三)生理假部分工時勞工依性別工作平等法第14條規定，每月得請生理假一日，該假別係基於女性生理特殊性而定，爰每次以一曆日計給為原則。生理假全年請假日數未逾3日者，不併入病假計算，薪資減半發給；逾3日部分，按規定應併入病假計算，其有薪病假之給假時數，按勞工平均每週工作時數除以40小時之比例計給，薪資減半發給。另部分工時勞工年度內所請應併入未住院普通傷病假之生理假，連同病假如已屆上開按比例計給時數上限，仍有請生理假需求者，雇主仍應給假，但得不給薪資。(四)哺（集）乳時間基於部分工時勞工每日工作時段及時數有不固定之情形，哺（集）乳時間若按其平均每週工作時數除以40小時之比例計給，於實務執行上恐有無法完整運用哺（集）乳時間之疑慮，爰部分工時勞工若有哺（集）乳之需求，雇主應依性別工作平等法第18條規定給予哺(集)乳時間。三、不適用勞動基準法之勞工，應參照上開原則辦理。聯絡科室：就業安全科承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7023
