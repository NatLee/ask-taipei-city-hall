- - 酒後違規駕車的處罰為何？
  - 1.自102年3月1日起施行道路交通管理處罰條例第35條規定，酒後違規駕車處罰鍰新臺幣，為1萬5,000元以上9萬元以下，並應吊扣（銷）駕照或記點另應接受道路交通安全講習。酒駕違規案件須結清罰鍰後，持繳納收據領回車輛，但初次酒駕且未發生交通事故者，於申請分期繳納第1期罰鍰金額後，得檢附繳納罰鍰收據領回車輛；違反公共危險罪者，可先持駕照正本及紅單至應到案處所辦理駕照吊扣(銷)，俟司法機關判決（或檢察機關處分緩起訴）後，再持相關判決書或處分書至應到案處所依規定補繳罰鍰或免繳納罰鍰結案。 2.依道路交通管理處罰條例第35條第1項規定，酒後違規駕車者吊扣駕照1年；因而肇事致人受傷者，吊扣駕照2年；因而肇事致人受重傷或死亡者，吊銷其駕照，並終身不得再考領。另依條例第68條第2項規定「領有汽車駕駛執照之汽車駕駛人，除駕駛聯結車、大客車、大貨車外之非其駕駛執照種類之車輛，違反本條例及道路交通安全規則之規定，應受吊扣駕駛執照情形時，無因而肇事致人受傷或重傷者，記違規點數5點。但1年內違規點數共達6點以上或再次應受吊扣駕駛執照情形者，併依原違反本條例應受吊扣駕駛執照處分規定，吊扣其駕駛執照」。3.汽車駕駛人駕駛汽車，於5年內酒精濃度超過規定標準2次以上，處新臺幣9萬元罰鍰，並吊銷駕駛執照，3年內不得考領駕駛執照。4.拒絕接受酒精檢測，處新臺幣9萬元罰鍰，並吊銷駕駛執照，3年內不得考領駕駛執照。 5.102年6月11日總統令公布「中華民國刑法」第185條之3修正條文，明定駕駛人吐氣所含酒精濃度達0.25mg/L(或血液中酒精濃度達0.05%)以上而駕車者，即觸該條規定構成犯罪，觸犯該條文者，處2年以下有期徒刑得併科20萬元以下罰金。經由警察機關移送地方法院檢察機關偵辦，依據刑法第185條之3，經司法判決確定「有期徒刑」者，交通違規罰鍰部分無須繳納，其記點或吊扣（銷）駕照處分仍應執行，另應接受道路交通安全講習。 6.依據100年11月23日行政罰法修正條文第26條第2項規定，一行為如經緩起訴處分確定，不待緩起訴期間屆滿而未撤銷，即得依違反行政法上義務規定裁處。至於行為人已依緩起訴處分命令支付公益捐款之數額得扣抵裁處罰鍰數額；如緩起訴處分或緩刑宣告勞務，按最初裁處時之每小時基本工資乘以義務勞務時數核算金額為扣抵金額。            酒後駕車要繳納交通違規罰鍰金額如下：               酒精濃度      車輛種類      期限內繳納      逾期30日內繳納      逾期30日以上      60日以內繳納      逾期60日以上      繳納          吐氣酒精濃度0.15mg/L以上未滿0.25mg/L     機車     15,000    16,500    19,500    22,500        小型車     19,500    21,000    24,000    27,000        大型車     22,500    24,000    27,000    30,000        吐氣酒精濃度0.25mg/L以上未滿0.4mg/L      機車     22,500    24,500    29,000    33,500        小型車     29,000    32,000    38,000    44,000        大型車     33,500    37,000    44,000    50,500        吐氣酒精濃度0.4mg/L以上未滿0.55mg/L     機車     45,000    49,500    58,500    67,500        小型車     51,500    56,500    66,700    77,000        大型車     56,000    61,500    72,500    84,000        吐氣酒精濃度達0.55mg/L以上     機車     67,500    74,000    87,500    90,000        小型車     74,000    81,500    90,000    90,000        大型車     78,500    86,000    90,000    90,000        5年內有第2次以上之酒駕累犯違規     所有車種     90,000        不依指示停車接受檢測稽查     所有車種     90,000        拒絕接受測試檢定     所有車種     90,000  
- - 民眾自行車失竊向警察機關報案，須備妥哪些資料？如何為「自行車辦理防竊登記」？辦理登記有何好處？未於「民眾財產自主登錄」系統內登錄自行車辨識碼時，如何知道自行車是否已為警方所破獲？
  - 一、民眾發現自行車遭竊時，應立即就近向警察機關報案，並主動提供報案人身分證明文件及遭竊自行車之廠牌、顏色、出廠序號、出廠證明文件或提供其他可足資證明之特徵，以利警方後續偵辦。二、針對無車身號碼之自行車，目前本市警察局有提供「自行車加設防竊辨識碼貼紙」服務，另針對有車身號碼之自行車，於本市警察局網頁進入後點選 「為民服務」→「便民查詢」 →「民眾財產自主登錄」選項，提供民眾自行登錄自行車車身號碼，民眾使用警方提供上述服務後，可使竊賊畏途、降低失竊風險、提高失竊破獲率及破獲發還作業效率，以保障民眾財產安全。三、本市警察局於首頁網站設有「無主自行車辨識認領專區」(http：//www.tcpd.gov.tw/→「無主自行車辨識認領專區」)，本專區係本市警察局各警察機關偵破自行車竊案，因部分自行車未有車身號碼或登錄資料缺漏，致無法聯繫失主，茲將查(尋)獲無主自行車相片等相關資訊公告招領，俾利民眾尋回失物及發還作業，認領車輛請檢具車輛相關證明文件至查獲車輛之警察機關辦理。
- - 請問新修正的消保法第19條所定之7日猶豫期間要如何適用？
  - 新修正消保法第19條對於通訊交易設有合理例外情事，一些具特殊性質的商品或服務將不再適用7日猶豫期間。依據行政院訂定之通訊交易解除權合理例外情事適用準則規定，通訊交易之商品或服務有下列情形之一，並經企業經營者告知消費者，將排除消保法第19條第1項解除權之適用：一、易於腐敗、保存期限較短或解約時即將逾期。二、依消費者要求所為之客製化給付。三、報紙、期刊或雜誌。四、經消費者拆封之影音商品或電腦軟體。五、非以有形媒介提供之數位內容或一經提供即為完成之線上服務，經消費者事先同意始提供。六、已拆封之個人衛生用品。七、國際航空客運服務。另外，例如藝文展覽票券、藝文表演票券、線上遊戲、公路汽車客運業旅客運送、國內線航空乘客運送、國內（外）旅遊、觀光旅館業與旅館業及民宿個別旅客直接訂房等契約，已經中央主管機關依消保法第17條第1項公告其定型化契約應記載及不得記載事項者，仍適用該事項關於解除契約之規定，亦排除7日猶豫期間之適用。
- - 企業經營者所提供之定型化契約內容不符消保法第17條第1項公告之定型化契約應記載或不得記載事項規定有無相關罰則？
  - 消保法第17條第1項公告定型化契約應記載或不得記載事項，目的在預防消費糾紛，保護消費者權益，促進定型化契約之公平化。而新修正的消保法對於企業經營者所提供之定型化契約違反定型化契約應記載或不得記載事項者增訂行政罰則，期能貫徹執行企業經營者務必遵守定型化契約應記載或不得記載事項之規定。依消保法第56條之1規定，企業經營者使用定型化契約，違反中央主管機關依第17條第1項公告之應記載或不得記載事項者，除法律另有處罰規定外，經主管機關令其限期改正而屆期不改正者，處新臺幣3萬元以上30萬元以下罰鍰；經再次令其限期改正而屆期不改正者，處新臺幣5萬元以上50萬元以下罰鍰，並得按次處罰。
- - 近日發生學承電腦、威爾斯美語及微爾科技倒閉事件，消費者該如何維護自己權益？
  - 有關學承電腦、威爾斯美語及微爾科技倒閉事件，本局已整理一系列的問答集，請參考以下網址：http：//www.legalaffairs.gov.taipei/ct.asp?xItem=164194889&ctNode=53747&mp=120034
- - 我酒後駕車已經被法院判決繳罰金或被裁定緩起訴，還需要繳交這筆紅單罰款嗎？
  - 依據道路交通管理處罰條例第35條第8項規定   1.法院如判決有期徒刑或判決有期徒刑併科罰金，則不須繳納這筆紅單罰款；如判決緩刑宣告確定且經命向公庫或指定之公益團體、地方自治團體、政府機關、行政法人、社區或其他符合公益目的之機構或團體，支付一定之金額，可抵扣罰鍰；如判決緩刑宣告勞務，按最初裁處時之每小時基本工資乘以義務勞務時數核算金額為扣抵金額。   2.檢察機關如處分不起訴，則需繳納這筆罰款，如處分緩起訴處分且經命向公庫或指定之公益團體、地方自治團體、政府機關、行政法人、社區或其他符合公益目的之機構或團體，支付一定之金額，可抵扣罰鍰；如緩起訴處分社會勞務，按最初裁處時之每小時基本工資乘以義務勞務時數核算金額為扣抵金額。
- - 請問市府對民眾檢舉公務員貪瀆不法行為有何獎勵、保護措施？
  - 一、依據行政院頒訂『獎勵保護檢舉貪污瀆職辦法』規定，凡舉發公務員貪瀆不法經法院判決有罪者，法務部將視法院判決情形發給檢舉獎金，金額最低新臺幣30萬元，最高可達新臺幣1,000萬元。二、另為加強端正政風並鼓勵民眾勇於檢舉本府公務員貪污瀆職不法案件，本府特訂定『臺北市政府獎勵檢舉貪污瀆職作業要點』，民眾檢舉本府公務員涉犯貪污瀆職或不法犯罪案件，經檢察官起訴時，可給獎金每案新臺幣5,000元，若經法院判決有罪者，可先給獎金二分之一，並視法院判決情形發給檢舉獎金，最高可達新臺幣200萬元。三、此外，受理檢舉之政風單位對於檢舉人之姓名、年齡、住所或居所、檢舉書、筆錄或其他相關資料，均嚴加保密，承辦人員如有洩密情事，將會依刑法及其他法規處罰或懲處。
- - 如何領回交通違規的代保管物件？
  - 1.向管轄之裁決機關查詢代保管物件是否已送達。   2.至管轄之裁決機關櫃檯憑身分證明文件方得領回，惟依違反道路交通管理事件統一裁罰基準及處理細則第39條規定，領回代保管物件前須結清積案。
- - 車輛因逾期檢驗被註銷遭舉發，應如何辦理？
  - 1.未代保管號牌：   　持號牌、行照及舉發單至本所繳清罰鍰後領取註銷執行單，再持註銷執行單至公路監理機關領取臨時牌，將臨時牌黏貼於車輛前後端之適當位置，再到公路監理機關驗車領取新號牌。   2.已代保管號牌：   　持行照、不足之號牌 (汽車須再繳回另一面)及舉發單至本所繳清罰鍰後領取註銷執行單，再持註銷執行單至公路監理機關領取臨時牌，將臨時牌黏貼於車輛前後端之適當位置，再到公路監理機關驗車領取新號牌。
- - 駕照記點吊扣應如何處理？
  - 1.在6個月內，駕照違規記點共達6點（含）以上者，吊扣駕駛執照1個月，並應接受道路交通安全講習。   2.經裁決後逾期仍不送繳者，加重吊扣期限至2個月，倘仍不繳送駕駛執照者，則註銷駕照。   3.依道路交通管理處罰條例第68條第2項規定，領有汽車駕駛執照之汽車駕駛人，除駕駛聯結車、大客車、大貨車外之非其駕駛執照種類之車輛，違反本條例及道路交通安全規則之規定，應受吊扣駕駛執照情形時，無因而肇事致人受傷或重傷者，記違規點數5點。但1年內違規點數共達6點以上或再次應受吊扣駕駛執照情形者，併依原違反本條例應受吊扣駕駛執照處分規定，吊扣其駕駛執照。      記點點數     違反道路交通管理處罰條例         1點     第33條第1項、第2項：高速公路違規      第38條第1項：違規攬客      第40條：超速      第45條：不依規定行駛      第47條第1~3款：違規超車      第48條：違規轉彎或變換車道不依規定      第49條：違規迴轉      第60條第1項：不聽警察制止或拒絕停車接受稽查而逃逸者      第60條第2項第1~2款：不服勤務警察指揮、稽查      第92條第7項：550cc以上大型重型機車行駛高速公路違規行為         2點     第29條第1項第1~4款：裝載物品不依規定(歸責汽車駕駛人)      第29條之2第1~2項：裝載貨物超重或超過行駛橋樑規定之載重限制者(歸責汽車駕駛人)      第29條之2第4項：行經地磅處未依標誌、標線、號誌指示或不服指揮過磅者      第30條第1項第1~2款：裝載物品超重、超長、超寬、超高而未隨車攜帶臨時通行證，或未依規定路線、時間行駛或滲漏、飛散或氣味惡臭者         3點     第43條：蛇行、飆車、逼車、任意驟然減速、煞車或暫停、拆除消音器      第53條、第53條之1：闖紅燈、紅燈右轉      第54條：闖平交道或在鐵路平交道超車、迴車、倒車、停車      第61條第3項：肇事致人受傷    
- - 被吊扣的駕照一定要親送到貴所嗎？
  - 如果違規須吊扣之案件屬本所管轄，您可親至、委託他人或將駕照以掛號郵寄本所辦理(地址：臺北市中正區羅斯福路4段92號7樓)，如非本所管轄請逕洽應到案處所、站。
- - 如果APP發生異常，如何初步排除故障及報修？
  - 第一、請先確認將手機或平板電腦的作業系統更新至最新版本。第二、移除愛台北APP後再重新至APP STORE或GOOGLE PLAY商場下載最新版愛台北安裝。完成前述的步驟後，如果仍然無法排除異常，請提供手機的廠牌、型號、手機的作業系統版本及聯絡方式，寄至services@mail.taipei.gov.tw，我們將會儘快處理。
- - 車輛牌照逾期檢驗逕行註銷日期認定之標準為何？
  - 如果您沒有按期去參加車輛檢驗，而監理機關開立之罰單亦沒有處理，直到超過檢驗日期7個月以上，本所就會依照規定（道路交通管理處罰條例第9條第1項）製發裁決書通知您，並依法（行政程序法第68-91條）完成送達。如果您仍未於裁決書指定期限到案，就會依照規定（道路交通管理處罰條例第17條）註銷您的牌照。而逾期6個月以上，須註銷牌照者，其牌照註銷生效日以本所填製違反道路交通管理事件裁決書日期（完成送達程序），為逾檢註銷基準日。
- - 為什麼要寄裁決書給我？
  - 因為您被開了交通違規罰單，一直沒有來處理，於是本所依照規定(道路交通管理處罰條例第9條第1項)，逕行開立裁決書，郵寄通知您依限期日辦理結案。
- - 我沒有收到罰單，卻收到裁決書，罰鍰已經變高?
  - 本所寄送給您的裁決書(高額裁罰)，都是因為在電腦系統中，您的違規通知單已經完成送達，而仍未繳款或未到本所處理；如果您想查詢違規通知單的送達，請您以書面向我們提出申請，我們會依據您的陳述，向舉發機關查證後，再回函向您說明。(申請書請註明車號、單號，或附裁決書影本，以利查詢。)
- - 未滿18歲駕駛小型車或機車，應如何辦理?
  - 1.依據道路交通管理處罰條例第21條第1項第1款規定，未領有駕駛執照駕駛小型車或機車之未滿18歲駕駛人，除應依「違反道路交通管理事件統一裁罰基準表」 裁處新臺幣6,000元至12,000元之罰鍰，亦應依同處罰條例第21條第3項規定，駕駛人及其法定代理人或監護人應同時施以道路交通安全講習。這類案件無法利用自動繳納管道(如超商或銀行等)繳納罰鍰，應於到案期限前，前往紅單上指定之「應到案處所」聽候裁決。  2.如收到「未領有駕駛執照駕駛小型車或機車」之紅單，且駕駛人於違規當時未滿18歲，需攜帶受處分人與法定代理人或監護人之雙方國民身分證，至紅單所列「應到案處所」聽候裁決，辦理罰鍰繳納與道路交通安全講習事宜。如法定代理人(監護人)與受處分人均無法親自到場，應由受任人攜帶法定代理人(監護人)、受處分人與委任人三者之國民身分證及填妥之委任書，至指定之應到案處所聽候裁決。
