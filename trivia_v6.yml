- - 「臺北市補助工商團體及廠商海外參展計畫」，受補助單位若發生實際參展執行成效不佳，該如何處理？
  - 受補助單位若發生實際參展執行情形低於原規劃內容60%（含）~80%，依落差比例扣減補助款金額，未達60%者，則不予補助，計算方式如下：A=實際參展總面積/原規劃參展總面積B=實際本市參展廠商家數/原規劃本市參展廠商家數1.工商團體：(A+B)/2 = 0.8，不扣款0.6 == 0.8，不扣款0.6 =< A < 0.8，依比例扣款扣款金額=補助金額[1- A]A< 0.6，不予撥款產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
