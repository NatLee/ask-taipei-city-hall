- - 交通維持＞萬大-中和-樹林線(第一期工程)中和區景平路連城路至土城區金城路施工期間對於交通疏導說明？
  - 由於萬大-中和-樹林線(第一期工程)中和區景平路連城路至土城區金城路位於交通流量大的路段上，施工期間對於鄰近交通難免有所影響，施工單位為考量降低交通衝擊，將施工圍籬分階段進行，施工時將確實依核定之交通維持計畫做好相關交維設施，並事先透過各項管道做好交通改道宣導及引導牌面之設置，同時會在重要路口增加義交協助指揮交通，施工期間請路過車輛能儘量避開施工路段，配合指引標誌，改走其他替代道路，施工單位也會虛心接受各方指正，盡全力做好交通疏導及人車安全維護工作。
- - 交通維持＞民眾如果想了解萬大線資訊該怎麼查詢
  - 萬大-中和-樹林線(第一期工程)施工期間，歡迎民眾透過新北市政府網站或臺北市政府捷運工程局東區工程處網站連結查詢最新施工資訊，如有任何疑問或權益受到損害時，可直接向臺北市政府捷運工程局東區工程處反映，亦可來電查詢（東工處總機：02-26539858），我們將竭誠為您解說及服務。
- - 交通維持＞萬大-中和-樹林線第一期路線及負責興建單位
  - 萬大-中和-樹林線(第一期工程)路線由捷運中正紀念堂站起，向西沿南海路下方過和平西路後接西藏路轉萬大路，於華中橋前左轉地下穿越新店溪，至新北市保順路、保生路轉中山路、連城路至金城路，並於金城路北側農業區設置機廠及設一支線車站臨莒光路，路線全長9.5公里（含機廠支線約700公尺），共設9座地下車站和1座機廠。其中LG06車站至機廠間路段及機廠之土建、水電環控工程由東區工程處負責興建，包含LG06、LG07、LG08及LG08A 4座車站與1座平面機廠。另LG01車站至LG06車站（不含）由本局南區工程處負責興建。
