- - 罰單要怎麼繳？
  - 1.持紅單至郵局、全國農業金庫暨農漁會信用部櫃檯繳款，手續費10元/筆。2.至郵局購買匯票，須支付匯費30元及郵寄掛號費用，須3-5天始得銷案。3.持繳費期限內之三段式條碼違規通知單(含行政執行署通知)至統一、全家、萊爾富及OK超商門市櫃檯繳款，手續費6元/筆，須1-3天始得銷案。或利用統一、全家、萊爾富及OK超商門市內之多媒體資訊機(IBON、FAMIPORT、LIFE-ET及OK go)查詢列印繳款單，再持單至超商櫃檯繳款，手續費13元/筆。4.到台北富邦銀行告知車號或身分證字號，即可繳款，手續費5元/筆。 5.可持繳費期限內且到案處所為本所之紅單至花旗(台灣)銀行、台新銀行、聯邦銀行(皆限臺北市各分行)繳款，免手續費，須7-10日始得銷案。6.可上監理服務網(https：//www.mvdis.gov.tw)或撥打語音電話(412-1111或412-6666接通後按168#)利用信用卡或金融卡轉帳繳款，金融卡手續費上限15元/筆，信用卡手續費上限20元/筆。 7.利用花旗網路銀行之網路ATM繳款，金融卡手續費上限15元/筆，信用卡手續費上限20元/筆。 8.利用中國信託ATM機具繳款，金融卡手續費上限15元/筆(跨行卡上限22元/筆)，信用卡手續費上限20元/筆。9.須至到案處所裁決案件：請至指定到案處所辦理。
