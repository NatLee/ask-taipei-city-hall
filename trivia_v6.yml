- - 違法濫葬的處理
  - 違法濫葬的形態：在公墓以外的地點埋葬遺體。目前本市僅富德公墓得經申請使用墓基埋葬遺體。陽明山第一公墓僅供民國72年以前曾申請預留使用墓基者下葬遺體。除此之外，均不屬殯葬管理條例所規範的公墓地，也就是說，如果不是在本市前述二公墓地埋葬遺體，即會違反殯葬管理條例第70條：「埋葬屍體應於公墓內為之；…」的規定。最高可處新臺幣15萬元的罰鍰。骨灰或起掘之骨骸除殯葬管理條例另有規定外(如規定可以樹葬、灑葬、海葬等環保葬)，未存放於骨灰(骸)存放設施或火化處理。常見的情形是將骨灰存放到墳墓內，或將起掘之骨骸再放回墳墓內，如此，違反殯葬管理條例第70條：「…骨灰或起掘之骨骸除殯葬管理條例另有規定外，應放於骨灰(骸)存放設施或火化處理；…」的規定，最高可處新臺幣15萬元的罰鍰。修繕墳墓時增加原墳墓的高度或擴大原墳墓的面積。這也是屬於廣義的違法濫葬的形態之一。將原平面式墳墓改建成家族塔而增加高度或擴大面積，這樣就可能因違反殯葬管理條例第71條第1項的規定，可依殯葬管理條例第99條經限期改善(即拆除擴大面積、增加高度部分回復原狀)屆期仍未改善者，處新臺幣六萬元以上三十萬元以下罰鍰；超過面積或高度達一倍以上者，還會按倍數處罰本市目前查獲較頻繁違法濫葬地區：本市信義區崇德街山坡地。本市內湖區碧山巖山坡地。本市陽明山第一公墓旁之私有土地。本市文山區福興路旁山坡地。上述地段道路兩旁多為民國72年以前設置之私人墳墓，常見案例多是墓主藉修繕墳墓之名將墓基增加高度改建成家族塔，將骨灰或起掘後之骨骸存放於墳墓內。殯葬主管機關將加強上述地區查察取締。
