- - 外籍勞工聘僱許可期間屆滿還需出國1日才能在入國工作嗎?
  - 自105年11月5日，就業服務法第52條已修正取消外國人聘僱期滿須出國1日之規定，於該日起2個月內聘僱期滿或聘僱期滿前2至4個月之外籍勞工，雇主如與外勞確認有續聘之意願，且具勞動部有效之招募許可者，可至勞動力發展署網站下載續聘申請書，向勞動部申請續聘許可後即可繼續聘僱外籍勞工留臺工作。若雇主無意願續聘外籍勞工，想讓外籍勞工期滿轉換雇主時，也可向勞動部申請期滿轉換。另有關修法後，外籍勞工欲返鄉休假，得由勞雇雙方協議，若雇主無故拒絕，經主管機關查明屬實，將依違反本法第57條第9款及第72條規定廢止雇主聘僱外籍勞工之招募許可及聘僱許可，並處新臺幣6萬元以上30萬元以下罰鍰。有關期滿續聘或期滿轉換之相關問題，可洽詢勞動力發展署，連絡電話：(02)8995-6000或客服電話：0800-085-151；又有關取消出國一日之相關規定及申請表格，可至勞動力發展署網站查詢下載，網址為 http：//www.wda.gov.tw/index.jsp。聯絡課室：臺北市勞動力重建運用處外勞諮詢課聯絡電話：(02)2338-1600菲律賓籍分機：4205、4207；印尼籍分機：4206、4208、4215、4217、4218；越南籍分機：4213、4214；泰國籍分機：4216
