- - 臺北市老人健保自付額補助若發現仍未補助怎麼辦？
  - 一、請先洽詢社會局老人福利科：1999(外縣市02-27208889)轉6967二、電話查詢確認符合補助資格未獲補助後，檢附未獲補助期間健保保費繳費證明(由原投保單位開立或向健保署申請)、匯款帳號影本傳真至社會局老人福利科辦理(傳真：02-27597731)
- - 敬老、愛心及愛心陪伴悠遊卡應該到哪裡辦裡加值?
  - 貼有悠遊卡標誌的便利超商，各捷運站自動加值機或詢問處，辦理卡片加值。
- - 請問二代健保上路後會影響我的老人健保自付額補助資格嗎？
  - 不受影響。本市老人健保自付額補助資格依補助辦法規定審查，二代健保上路後，不影響其補助資格，符合補助資格者，持續補助。
- - 月初持敬老、愛心悠遊卡至捷運站查詢機查詢每月公車免費點數，但點數顯示為O，為什麼？
  - 捷運站查詢機僅能查詢卡片相關紀錄及辦理展期，敬老、愛心悠遊卡每月公車免費點數120點為每月首次搭乘公車刷卡時自動匯入。
- - 請問臺北市老人健保補助要退費的需要準備何種文件?
  - 繳費證明或收據，以及退費存摺封面影本。您可向您的投保單位申請開立繳費證明，如：公司行號或公會…等等，若您於區公所加保者，請向中央健康保險署申請開立，或可提供繳費收據；又若於金融機構帳戶直接扣款者，影印存摺內頁亦可。
- - 「自己的旅遊城市自己拍」影片及照片徵選活動徵件主題是什麼呢？
  - 活動徵件主題以台北城市街景及都會風貌、景點特色、歷史古蹟、美食、文化元素，自由發揮創意進行主題創作，徵選項目分為「照片」及「影片」兩類。
- - 「自己的旅遊城市自己拍」影片及照片徵選活動報名資格有限定一定要台北人嗎？
  - 本國民眾及居住本國之外籍人士(須有相關證明)，可以個人或團體名義參加，參賽作品數量不限。
- - 「自己的旅遊城市自己拍」影片及照片徵選活動徵件期間從什麼時候開始？
