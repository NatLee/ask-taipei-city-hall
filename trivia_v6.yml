- - 申請敬老、愛心及愛心陪伴悠遊卡應備文件為何？
  - "申請人應備下列文件至任一區公所提出申請：1、敬老卡：國民身分證正本、2吋彩色照片1張。(如委任他人代辦，需再檢附委任書及代辦人身分證)2、愛心卡：國民身分證正本、身心障礙手冊正本或證明、2吋彩色照片1張。(如委任他人代辦，需再檢附委任書及代辦人身分證)3、愛心陪伴卡：身心障礙者申請愛心卡時，於同1張申請書上勾選。（每位身心障礙者只限申請1張愛心陪伴卡）"
- - 老人健保補助是否每年要重新申請?
  - 1.由本局主動篩選比對符合補助資格者後自動補助，毋需申請；若曾經因為稅率或是居住國內天數不符補助者，則須主動申請審查核定後方恢復資格。2.若經本局審查未實際居住於本市而被取消補助，則需提供實際居住本市滿1年之證明，主動向本局重新申請恢復補助。3.原為本局老人健保補助對象，因遷出本市不符補助者，俟遷入滿1年後由本局主動篩選比對符合補助資格者後自動補助。 
- - 搭乘臺北市敬老愛心車隊，是否享有乘車優惠？
  - 1.凡持有臺北市政府核發敬老（一）或愛心（一）悠遊卡之老人或身心障礙者，搭乘臺北市敬老愛心車隊，於現有臺北市政府補貼其搭乘公車額度內（每月公車免費搭乘60段次共480元額度）共同使用，單趟計程車車資100元(含)以下由補貼60段次中扣除2段次，超過100元則扣除4段次，其餘車資於悠遊卡內自行儲值金額中扣除。2.例如單趟計程車車資100元，政府補助16元（扣除每月公車免費搭乘2段次共16元），民眾自付84元（扣除悠遊卡內儲值金額84元）。單趟計程車車資150元，政府補助32元（扣除每月公車免費搭乘4段次共32元），民眾自付118元（扣除悠遊卡內儲值金額118元）。
- - 若臺北市政府補貼優惠額度用完，搭乘敬老愛心車隊時，敬老（一）或愛心（一）悠遊卡片會如何扣款？
  - 若臺北市政府補貼優惠額度用完時，無法再享有補貼優惠，將於卡片儲值金額內扣全額車資。若悠遊卡片儲值金額不足以支付車資時，將無法使用悠遊卡扣款，而該趟次車資須全部以現金支付。無法一部分以悠遊卡刷卡，一部分付現金。
