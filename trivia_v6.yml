- - 藝文推廣處大稻埕戲苑身心障礙朋友購票有優惠嗎？
  - ◎本處主合辦節目每場提供部分身心障礙席免費索取，其餘身障票五折優惠：1. 身心障礙人士及其必要之陪同人員(限一人)可於每月最後一個週三(9：00-12：00)，憑身心障礙證明正本(每場另需一份影本存檔)至本處大稻埕戲苑八樓服務台免費索取次月票券，各劇場每人每場限索2張，索完為止；未索完票券則於週二至週日9：00-17：00開放索取。2. 九樓劇場每場節目僅限提供輪椅席/陪同席共計6席、曲藝場每場節目提供2席，每人每月限領1場2張(含陪同者)；替人代領以1名為限，代領者請重新排隊。3. 其餘外租節目請洽各主辦單位。
- - 我要如何辦理藝文推廣處大稻埕戲苑會員卡?有什麼優惠?
  - ◎申請資格：藝文與戲曲愛好者皆可申請。◎申請費用：一年為一期，首次申辦及到期續辦酌收工本費200元。◎持卡會員可享優惠：1.大稻埕戲苑、文山劇場主/合辦節目訂票折扣：不限場次、張數85折優惠（不適用於100元（含）以下票券）。2.大稻埕戲苑主/合辦節目網路優先訂票權：部份節目於啟售前7天開放會員購票4張為限）。3.免費獲得本處演出訊息電子報。4.至指定門市購買本館出版品享9折優惠。5.特約商店優惠方案及其他未盡事宜請上大稻埕戲苑官方部落格查詢（痞客邦或Facebook粉絲團），或電洽02-25569101。（兩廳院售票系統及超商購票系統皆可認證大稻埕戲苑會員卡。）◎申請程序※現場辦理：您可逕至大稻埕戲苑填妥會員卡申請表並辦理繳費，即可成為會員。現場辦理時間為每週二至週五9：00~12：00、13：30~17：00至八樓辦理，以及九樓劇場辦理活動對外開放時段（即演出前1小時至演出結束）至九樓劇場服務台辦理。※網路申辦：1. 請逕上本處藝研班管理系統申請加入網路會員→加入「各劇場之友」→在第一項【分類】點選【大稻埕戲苑】→依系統指示完成填表步驟。2. 請列印繳費單至超商或富邦銀行繳費，完成繳費後請來電02-25569101或傳真02-25583620告知會員姓名及已完成繳費訊息，工作人員將於7至10個工作天內寄出卡片，並通知兩廳院售票系統開通購票優惠。◎到期續約1. 每期會籍到期前一個月，本處將寄發續卡通知，願意續卡者請親至大稻埕戲苑或至本處網站辦理續卡，並請於九樓劇場辦理活動對外開放時段至九樓劇場服務台加蓋新到期章，方能持續會員資格。2. 會員可憑到期日前一年藝文處各分館不同場次票根30張免費申辦續卡。3. 辦理新卡與續卡7至10個工作天內開通網路訂票優惠。
