- - 請問何時可以請款?
  - Q：請問何時可以請款?A：核准補助案的請款時間分為兩階段：第一階段：都市更新事業計畫經本府核定後六十日內，應出具領據，並檢附申請書、都市更新事業計畫核定函、核定事業計畫書圖、統一發票（收據）或合格之原始憑證，申請核撥補助經費百分之三十。第二階段：於工程竣工並查驗通過後六十日內，應出具領據，並檢附申請書、竣工書圖、更新成果報告、統一發票（收據）或合格之原始憑證，申請核撥剩餘補助經費。-->
- - 補助案已經都市更新審議會同意補助後，後續要做的事情?(1041029舊版複製,內容相同)
  - Q：補助案已經都市更新審議會同意補助後，後續要做的事情?A：1.依都市更新條例施行細則第六條規定，辦理都市更新事業計畫公聽會。2.整合居民意見，簽署都市更新整建維護同意書。3.撰寫都市更新整建維護事業計畫書。-->
- - 都市更新之建築容積獎勵為何?(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - 1.本市都市更新事業建築容積獎勵額度依下列公式核計：   　  Ｆ=F0＋ΔF1＋ΔF2＋ΔF3＋ΔF4＋ΔF5＋ΔF6 　Ｆ：獎勵後總容積   　F0：法定容積。   　△F1：原建築容積高於法定容積之獎勵。   　△F2：維持合理居住水準之獎勵。   　△F3：更新時限之獎勵。   　△F4：捐贈認養改善公益設施成本之獎勵。   　△F5：更新基地規劃設計之獎勵容積。   　△F6：安置違章建築戶之獎勵。   　更新後提供公益設施不予計算容積。  2.獎勵上限規定：獎勵後總容積以1.5倍法定容積或原建築容積加0.3倍法定容積（取高值）   　  申請1.5倍法定容積獎勵為上限者：△F1 ＋△F2＋△F3＋△F6 ≦0.5（△F1 至△F6總和） 　申請原建築容積加0.3倍法定容積為上限者：△F2＋△F3＋△F6 ≦（△F4＋△F5）  請參考本處網站下載專區╱申請辦理都市更新總說明╱1更新的好處及申請更新程序 
- - 辦理都市更新主要的好處有哪些？(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - 民眾參與都市更新於開發過程中，其所有權人權益除受都市更新條例保障，依據「都市更新建築容積獎勵辦法」規定，更新改建後可享有最高1.5倍法定容積（樓  地板面積）獎勵或原建築基地0.3倍之法定容積再加其原建築容積外，在實施過程間亦可享有地價稅、房屋稅、土地增值稅、契稅等稅捐減免優惠（可參考本處網站╱下載專區╱1更新的好處及申請更新程序）。 若非由都市更新途徑辦理屋舍重建，土地則需依照法定容積辦理重建外，亦不能享有上述各項優惠。
- - 辦理都市更新流程(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - 辦理都市更新分為下列二個階段：   第一階段—都市更新事業概要      申請資格：更新單元範圍內私有土地及私有合法建築物所有權人均超過1/10，並且其所有私有土地總面積及私有合法建築物總樓地板面積均超過1/10之同意            報核程序：                  舉辦公聽會擬具事業概要          檢具公聽會記錄及事業概要向本府申請核准          事業概要核准後得自組更新團體或委託更新事業機構實施                第二階段—都市更新事業計畫       申請資格：實施者擬定或變更都市更新事業計畫報核時，應達下列同意比例門檻。          依第10條規定申請獲准實施都市更新事業者，應經更新單元範圍內私有土地及私有合法建築物所有權人均超過3/5，並其所有土地總面積及合法建築物總樓地板面積均超過2/3之同意。      依第11條規定申請獲准實施都市更新事業者，應經更新單元範圍內私有土地及私有合法建築物所有權人均超過2/3，並其所有土地總面積及合法建築物總樓地板面積均超過3/4之同意。                報核程序          舉辦公聽會擬具事業計畫。      檢具公聽會記錄及事業計畫向本府申請報核。      公開展覽30日，並舉辦公聽會。      召開都市更新審議委員會幹事會議審查。      召開都市更新審議委員會審議。      本府核定實施。       請參考本處網站下載專區╱申請辦理都市更新總說明/ 1更新的好處及申請更新程序(ppt)/ 3申請辦理都市更新事業概要(ppt)/ 4申請都市更新事業暨權利變換計畫(ppt) 
- - 請問從我送件申請後要多久才可以施工?
  - Q：請問從我送件申請後要多久才可以施工?A：本(98)年度補助受理截止時間為98年6月15日，預計於截止日起2個月內確定是否具有補助資格，若您取得補助資格，應於公告補助資格之日起算3個月內檢送都市更新整建維護事業計畫至本處審查，並於事業計畫核定發布實施之日後才得施工。自您檢送事業計畫之日起算，通常需6個月以上之行政程序。
- - 施作建築物外牆清洗之藥劑為何?
  - Q：施作建築物外牆清洗之藥劑為何?A：外牆清洗劑不得破壞環境為原則，且對建築物外牆清潔有幫助，清理期間須具備良好機具、審慎使用清潔藥水及人員作業安全問題。至於藥水類中，中強度以下鹽酸類不會破壞磁磚的琺瑯質。
- - 辦理建築物外牆清理補助實施方案住戶應多少人同意?
  - Q：辦理建築物外牆清理補助實施方案住戶應多少人同意?A：已成立公寓大廈管理委員會者，請檢附區分所有權人會議決議紀錄辦理（應符合公寓大廈管理條例第31條規定）。未成立公寓大廈管理委員會者，該同意書應有建物3/5以上所有權人連署同意後辦理。
- - 申請外牆清理，對於外牆磁磚脫落修補是否含補助範圍內？
  - Q：申請外牆清理，對於外牆磁磚脫落修補是否含補助範圍內？A：針對外牆磁磚脫落部分修補事項，不屬清理補助範圍，申請人可考量是否申請以建物外牆整建方式申請補助，進行外牆維護整建或於外牆清理中協調施作廠商自行付費併同修補。
- - 都市更新計畫和都市更新事業計畫有何不同？
  - 都市更新計畫是擬定都市更新事業計畫之指導，由政府就都市發展狀況、居民意願、原有社會、經濟關係及人文特色，進行全面調查及評估，經市都委會審議通過後公告實施。都市更新事業計畫係由實施者依照都市更新條例第21條規定擬定。內容應詳細表明土地使用、公共設施興修、建築設計、財務計畫、拆遷安置、實施進度等，經更新委員會審議通過後據以實施。
- - 請問要如何申請老屋拉皮補助?
  - Q：請問要如何申請老屋拉皮補助?A：只需檢具申請書(函)以及申請書3份，申請書(函)中請敘明”檢送98年度本市都市更新整建維護規劃設計及實施經費補助申請書”，另申請書請依公告內容詳細敘明，可參考本處網站首頁/便捷服務/下載專區/2009.04.14申請範本，下載填寫。
- - 要如何知道我們社區是不是位在策略地區中?
  - Q：要如何知道我們社區是不是位在策略地區中?A：本年度的整建維護策略地區已公告在本處網站首頁/便捷服務/下載專區/2009.04.14策略地區範圍，包含花博熱區範圍、交通要道、交通樞紐、科技產業軸帶、全市重要觀光景點以及親水河域等六大範圍。
- - 如何申請劃定為更新單元(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - 申請自行劃定為更新單元方式：   申請人：土地及合法建築物所有權人（至少1人）。  申請基地規模應符合下列更新單元劃定基準四款規定之一：      為完整之計畫街廓者。    街廓內面積在二千平方公尺以上者。    街廓內臨接二條以上之計畫道路，面積大於該街廓四分之一且在一千平方公尺以上者。    街廓內部分土地業已建築完成，確無法合併更新且無礙建築設計及市容觀瞻，其未建築完成部分面積一千平方公尺以上，並為一次更新完成者。但其面積在五百平方公尺以上，經敘明理由，提經臺北市都市更新審議委員會審議通過者。    申請基地建築物應符合建築物及地區環境評估標準指標第一項至第十四項中任三項。詳細申辦流程請參考本處網站╱法令園地╱臺北市土地及合法建築物所有權人申請自行劃定更新單元（重建區段）作業須知
- - 權利變換和一般合建有何不同？(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - 權利變換係指更新事業計畫範圍內之土地所有權人、合法建築物所有權人、他項權利人或實施者，提供土地、建築物、他項權利或資金，參與或實施都市更新事業，於更新事業計畫實施完成後按其前原權利價值比例及提供資金比例，分配更新後建築物及其土地之應有部分或權利金。類似立體的市地重劃。權利變換計畫只要取得大多數權利人之同意即可實施，其更新前後價值之認定由實施者委由三家鑑價公司估價後評定，其擬訂時程應於都市更新事業計畫核定發佈實施後擬訂，必要時得與都市更新事業計畫一併辦理。一般合建則是由地主與建設公司合作，按其彼此認定之價值比例由地主提供土地、建商提供資金合建，並分回改建完成後之建築物及其土地比例，需取得全部權利人之同意才可實施，其程序依一般建管程序辦理，無須另外擬訂任何計畫送審。
- - 更新地區和更新單元有何不同？
  - 更新地區係政府經調查建築物、實質環境之公共安全、公共交通、公共衛生、都市機能、社會治安及保存維護需求等劃設，其範圍可能包括數個街廓。更新單元則是實施都市更新事業計畫之最小基地規模，由實施者依據市政府所訂更新基地規模及自行劃定更新單元評定基準等規定劃定。因此，一個更新地區範圍應至少包括一個以上更新單元。
- - 實施者是誰？(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - 實施者是依據都市更新條例規定實施都市更新事業之機關、機構或團體。其意義類似一般民間慣稱之「業主」、「甲方」，或是申請建築執照之「起造人」。公辦更新時，市政府可自行實施或委託都市更新事業機構實施；民間自辦更新時，除地主自辦、土地所有權人7人以上合組更新會擔任更新實施者外，並得委由更新事業機構實施。
- - 都市更新是什麼？(1041029舊版複製,內容與新版相同,故設定為不公開狀態)
  - 為維持都市持續的生命力，針對本市窳陋、老舊、衰敗的地區，透過政府與私人團體的努力，擬定綜合性再發展計畫，並經由專家學者審議核定，辦理拆除重建、整建或維護，以達復甦都市機能、改善居住環境、提升房地產價值。因此，都市更新不只是狹義的房屋改建，而是透過公私合作、專家審議、民眾參與等方式，在兼顧社會、經濟、環境等層面下，促成都市再發展。
- - 請問申請老屋拉皮有沒有限制?
  - Q：請問申請老屋拉皮有沒有限制?A：申請老屋拉皮僅有兩項限制1.申請資格需為管委會或其他依相關法規規定設立之團體或專業機構(詳見公告內容第一點)2.應以申請一幢大樓單元(詳見使用執照中)
- - 我家只是一般的四、五樓雙拼公寓沒有成立管委會，也可以申請老屋拉皮嗎？
  - 老屋拉皮的申請資格只要符合公告事項中的三項之ㄧ即可，若無管委會，可委託其他依公司法成立之股份有限公司或市府登記有案之學會、公會、團體等。
- - 都市更新有那些處理方式？
  - Q：都市更新有那些處理方式？A：依都市更新條例第四條規定，都市更新處理方式，分為三種：   1. 重建：係指拆除更新地區原有建築物，重新建築，住宅安置，改進區內公共建設，並得變更土地使用性質或使用密度。   2. 整建：係指改建、修建更新地區內建築物或充實其設備，並改進區內公共設施。   3. 維護：係指加強更新地區內土地使用及建築管理，改進區內公共設施、以保持其良好狀況。
- - 血中鉛的檢驗，抽血前需要禁食嗎？
  - 血中鉛檢驗不需要禁食。
- - 什麼情況會有鉛暴露？
  - "暴露途徑：                                                                (1)鉛汽油、污染工廠排放之廢氣(2)老舊自來水輸送鉛管(3)油漆顏料(4)非法中草藥(5)食入受鉛污染的食物或水、吸入受鉛污染的土壤粉塵(6)二手煙 "
- - 那些人應該驗血鉛？
  - 有長期鉛暴露史或從事鉛作業人員。
- - 鉛暴露的健康危害？
  - "(1)造血系統－如：貧血。(2)消化系統－如：腹痛、嘔吐、厭食與便祕。(3)神經系統－如：出現肌肉無力、顫抖、垂腕與麻痺等症狀。(4)腎臟危害。(5)生殖系統。"
- - 懷疑鉛中毒應怎麼辦？
  - "民眾若有臨床症狀，如：關節痛、肌肉無力、顫抖、手腳酸麻、力量減弱、感覺異常、手腕垂症，或有急躁不安、嘔吐、嗜睡、步態不穩、行為怪異、木僵、記憶力減退、抽搐甚至昏迷等症狀時，應至內科或家醫科門診就醫，不必過度恐慌，只要找出可能的污染源，避免持續暴露，症狀往往就改善，但當症狀無法緩解時則需考慮螯合劑（解毒劑）治療。"
- - 如何預防鉛中毒？
  - "(1)飲用前先排水：經鉛管輸送的自來水，恐提高鉛中毒機率，若要降低風險，取水前先打開水龍頭，盡量把鉛沖走後再使用。(2)不服用來路不明草藥：不明藥物因含鉛量可能偏高，吃多恐提高鉛中毒風險。(3)不要在密閉空間燃燒蠟燭：因少數劣質蠟燭可能含鉛。(4)挑選有安全玩具標示的產品：不購買劣質含鉛玩具，並避免孩童啃咬或用嘴唇接觸到含鉛玩具。(5)避用含鉛產品：避免含鉛油漆或顏料，避免含鉛化妝品或染髮劑。(6)居住於鉛暴露環境之注意事項：經常清洗雙手以及臉部，去除含鉛的灰塵或泥土，並定期清掃房屋的粉塵以及泥土足跡，避免持續鉛暴露。"
- - 有關臺北市鐵觀音包種茶研發推廣中心，十一月份與茶相約在貓空活動主題為？
  - 日期：11/07主題：環保個性提袋DIY報名方式：七星生態保育基金會電話：2895-4177
- - 請問如何得知田園城市基地認養及相關資訊？
  - 1.有關「田園城市」政策相關資訊，本府已另建置「田園銀行網路平台」，透過網路平台公開田園城市最新消息、田園基地查詢、申請認養、田園技術諮詢、開課資訊、成果分享以及相關法規等訊息。2.有興趣的民眾可透過網站搜尋「田園銀行網路平台」，或輸入網址 "http：//farmcity.taipei" 進入專屬網站。3. 業務單位聯絡電話：園藝科02-23815132轉224或225。1999臺北市民當家熱線（外縣市02-27208889）
- - 請問如何查詢住家是否鉛屬水管用戶？
  - 民眾可至臺北市自來水事業處網站查詢(http：//www.water.gov.taipei\臺北自來水鉛管查詢)或撥電話(02)87335678洽詢
- - 疑似患精神疾病、身心障礙或失智的老人於街上遊蕩而無人照顧。
  - 倘老人有醫療需求或急性精神症狀，建請優先送醫治療；另可通報警察局、消防局或社會局協助老人找尋家屬或取得相關服務。若老人已經查明身分，將協助其返家照顧，倘有老人遺棄問題，將依相關規定辦理老人保護與安置事宜；若老人身分不明，將視老人失能狀況先予協助安置適當處所或機構，並續辦老人身分建檔及協尋家屬工作。
- - 目前臺北市是否有辦理「青少年狀況調查」？其調查期間、對象及目的為何？
  - 一、「青少年狀況調查」係由行政院主計總處主辦，委由各縣市政府主計處執行訪查作業。二、「青少年狀況調查」調查期間為104年11月22日至12月3日，調查資料標準時間為104年11月15日起至11月21日止，調查對象為資料標準時間內居住於臺灣地區之普通住戶與共同事業戶，其戶內15歲至29歲自由從事經濟活動之本國籍民間人口為主。三、該調查主要目的係明瞭臺灣地區15歲至29歲青少年目前之在學狀況、升學意願、工讀經驗、畢業後初次尋職、學用配合、生活狀況與生涯規劃等情形，供為政府研訂青少年就業促進、縮短學用落差、生活輔導等政策參據。依統計法第45條規定，調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作，據實回答。
- - 螞蟻的腹柄節有2節就是入侵紅火蟻？
  - 不是，因為此為火蟻屬與家蟻屬的共同特徵。建議可參考國家紅火蟻防治中心網站（網址： http：//www.fireant.tw ）。
- - 「旅服運轉─助你轉運」轉盤遊戲活動時間？對象？特色？內容？
  - 臺北市觀光傳播局結合網路最夯議題「1111光棍節」，自11月11日起至11月22日止，每日下午3點在市府轉運站旅遊服務中心舉辦「旅服運轉─助你轉運」轉盤遊戲活動，希望所有旅客來市府轉運站旅服中心「轉運」，旅客只要參與轉盤遊戲，除了「轉好運」，還可獲得鄰近旅遊景點推薦及精美旅遊明信片，每日限量50張，歡迎國內外旅客來臺北「轉運」、旅遊。
- - 新增路邊停車格可否使用，有無收費？
  - 車輛停放於路邊，應遵循相關標線規範，若路邊已繪設停車格位即可依車輛種類停放，已實施路邊停車格收費之路段，皆會在車格進行編碼，並於鄰近處設置收費標誌牌面，民眾可得知收費時間及費率。如現場未見收費標誌，可透過1999市民熱線或本處網站查詢，亦可撥打02-2726-9600，本處同仁將協助查詢。
- - 如何使用第三方支付繳路邊停車費?
  - 民眾透過手機下載App (Pi行動錢包或歐付寶行動支付)，註冊會員後，掃描停車單第2段條碼並依指示操作，即可繳納停車費，並可於App中設定個人車號，App可自動通知會員繳費。
- - 身心障礙者專用停車位識別證之使用年限。
  - 一、身心障礙者專用停車位識別證之使用期限原定最長3年，自8月10日起回歸身心障礙者專用停車位設置管理辦法第10條規定，與身心障礙證明之有效期限相同。二、另外，針對原持永久效期身心障礙手冊者，本局將於104年8月1日至108年7月10日間陸續通知完成換發事宜，並依需求評估結果核發專用停車證，至於在換證期間尚未完成換發身心障礙證明者，則依身權法第106條規定，核發其專用停車證之使用期限至108年7月10日止。
- - 目前本市有幾處社區規劃師工作室？
  - A：本市目前6處社區規劃師工作室。6處社區規劃師工作室係因應本府自104年起推動再生計畫（大同再生、中正萬華復興、東區門戶、士林再生計畫），透過徵求「社區規劃師工作室」專業團隊駐點的方式重啟社區規劃師制度，長期在地進行市政溝通，協助公民參與，於地方建立雙向溝通平台，催化都市再生。包括：大同再生計畫─昌吉街工作室、迪化街工作室；中正萬華復興計畫─剝皮寮工作室、東園街工作室；東區門戶計畫─同德路工作室士林再生計畫-中興街工作室，工作任務為建立溝通平台並促成廣泛的民眾參與和蒐集民眾對話、與在地社區建立夥伴關係、協助市民了解本府計畫並辦理相關創意行動。 
- - 本市敬老悠遊卡相關業務權管單位為何？
  - 敬老卡相關業務為本市社會局所權管，連絡方式1999轉6967（吳小姐）。
- - 社區規劃師工作室開放時間與地點？
  - A：本市目前6處社區規劃師工作室：6處社區規劃師工作室採因地制宜經營模式，除了固定開放時間的駐點經營，提供民眾諮詢且協助說明市府各再生計畫；更進一步主動出擊拜訪地區意見領袖、社區組織、與地區共享社規師空間及與社群活動等，建立地區夥伴關係，串聯社群共同活化空間、舉辦創意活動事件，並開放民眾電話聯繫相關討論事宜，以不受空間與時間限制之網絡社群，加強臉書粉絲社團宣傳不定時更新資訊並立即接收民眾意見，以擴大觸及範圍及市民參與之協調機制。地點及開放時間說明如下：(1)昌吉街工作室位於臺北市大同區昌吉街61巷45號1樓，開放時間為二、五14：00-17：00，三、四1600-1900。(2)迪化街工作室位於臺北市大同區迪化街一段44號1樓，開放時間為一到五1100-1700。(3)剝皮寮工作室位於臺北市萬華區康定路163、181、183號，開放時間為二到五1200-1800。(4)東園街工作室位於臺北市萬華區東園街154巷1弄8號，開放時間為二、三、四14：30~17：30。(5)同德路工作室位於臺北市南港區同德路100號3樓，開放時間為二、三、四10：00~13：00。(6)中興街工作室位於臺北市士林區中興街22號1樓，開放時間為三、四、五15：00~18：00。
- - 請問關於「老台北新亮點-西區古文化巡禮活動 」與「臺灣製MIT微笑標章產品展售會」活動何時開始？內容為何?
  - 1.老台北 新亮點-西區古蹟文化巡禮健走活動時間為104/11/28(六) 08：00~12：002.臺灣製MIT微笑標章產品推廣活動時間為104/11/27(五) 11：00-104/11/28(六) 20：003.活動內容為健走；另臺灣製MIT微笑展售會是結合成衣、毛衣、內衣、泳裝、織襪、毛巾、寢具、鞋類、袋包箱、紡織帽子、紡織手套、紡織圍巾、紡織護具、傘類等MIT微笑產品、台北市政府政策推廣專區、地方特色商品，以聯合推廣台灣優質產品。
- - 請問關於「老台北新亮點-西區古文化巡禮活動 」與「臺灣製MIT微笑標章產品展售會」活動，主辦單位與執行單位為何?
  - 活動主辦單位為經濟部工業局；執行單位為財團法人中華民國紡織業拓展會。
- - 請問「臺灣製MIT微笑標章產品展售會」活動地點?
  - 活動地點假於艋舺服飾商圈(西園路一段，包含三角公園)。
- - 請問「老台北新亮點-西區古文化巡禮活動 」與「臺灣製MIT微笑標章產品展售會」封街路段?
  - 封街路段為西園路一段全段(和平西路至西園路一段282巷間、203巷)與大理街(西園路一段間)。
- - 8公尺以下道路鋪面更新評分標準為何?
  - 本處「8公尺以下道路鋪面損壞評分表」，係依營建署頒布之「柔性鋪面損壞調查手冊」，以PCI指標為評分標準，PCI值40以下則納入更新檢討或改善，其使用時機係目視判斷道路現況，如經修復尚堪使用，不予全面更新，仍有疑慮者，即依該評分表解釋道路鋪面情況，以化解市民疑慮。
- - 國內目前已將對那兩種大型珊瑚礁魚種列為保育類野生動物？
  - 蘇眉魚與隆頭鸚哥魚。
- - 申辦特定寵物業許可證，負責人和專任人員可否為同一人？
  - 可以，但專任人員需具備下列任一項資格：(1)職業學校或高及中學以上，畜牧、獸醫、水產、動物等相關科系畢業。(2)曾接受各級主管機關辦理或委辦之畜牧、獸醫、水產及動物福利等相關專業訓練１個月以上，領有結業證書。(3)繁殖、買賣或寄養場所現場工作３年以上經驗。
- - 如要查詢土地是否位於本市野生動物保護區或野生動物重要棲息環境，該檢附哪些資料？
  - 請正式來函檢附土地之地段、地號，最新土地登記謄本及地籍圖謄本（申請範圍應著色）各1份。
- - 如想瞭解臺北市的生物資源，可以在哪裡查詢？
  - 可至臺北市生物多樣性資料庫查詢。
- - 國內已將蘇眉魚與隆頭鸚哥魚這兩種大型珊瑚礁魚種列為何種等級的保育類野生動物？
  - 珍貴稀有（Ⅱ級）保育類野生動物。
- - 華江雁鴨自然公園何時開始禁止吸菸？
  - 依據菸害防制法公告「國家公園、國家自然公園、風景特定區及森林遊樂區之指定區域與公園綠地，除吸菸區外，不得吸菸；未設吸菸區，全面禁止吸菸之場所」，並自103年4月1日生效。
- - 動保處是否有執行臺北市的生態調查工作？
  - 本處自96年起執行生物多樣性指標調查計畫，以3年為一期，針對鳥類、淡水魚、蝦蟹螺貝、昆蟲、兩棲、爬蟲、植物、綠地等指標執行野外調查、影像判釋及後續分析。
- - 火蟻的蟻丘是蜂窩結構嗎？
  - 是的，看到蟻丘內部為蜂窩構造的結構就是火蟻的蟻丘。
- - 花紋與青衣魚相似的是哪一種大型保育類珊瑚礁魚種？
  - 蘇眉魚。
- - 特定寵物業辦理店面面積或專任人員變更，需要再次現勘嗎？
  - 若是營業面積有變更，需要再次去現勘，但若僅變更專任人員則不需要。
- - 臺灣藍鵲為何會有驅趕路人之行為？
  - 每年大約在3-9月期間，是藍鵲的繁殖期，當雛鳥孵化出來，親鳥為了護雛，會驅趕將行經其巢窩附近路線上之行人。
- - 公司章程未明訂董監酬勞發放金額或比率，可否發放董監酬勞？
  - 公司是否發放董監酬勞係屬章程規範範疇，並僅得以現金為之。公司如擬發放董監事酬勞，自應於章程中明文規定董監事酬勞發放金額之定額或比率。倘章程未明定董監事酬勞發放金額之定額或比率，即認定為公司不發放董監事酬勞，尚不得以股東會決議之方式代替章程。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 如果違反菸害防制法在公園內會有罰則？
  - 在公園禁菸區域吸菸，依菸害防制法第31條之規定，處以新台幣2千至1萬元罰鍰之處分。
- - 動保處在哪些地點執行生態監測？
  - 本處執行的生物多樣性指標調查計畫共有35個陸域樣區及12個水域樣區，其中陸域樣區包含300公尺以上及以下山區、都市綠地、溼地及農地；水域樣區包含鹿角坑溪、雙溪、基隆河、新店溪及景美溪。
- - 被入侵紅火蟻叮咬不會怎樣嗎？
  - 被入侵紅火蟻叮咬可能會產生下列情形，最好能儘速向醫院求診：(1)紅腫並出現白色膿皰，但為無菌請勿抓破。(2)患部很癢，要避免因抓破膿泡而受細菌感染。(3)有過敏體質者容易引起強烈過敏反應，嚴重時可能導致休克。
- - 如何避免電子帳單被定為垃圾信件?
  - 1)檢查垃圾信件匣：定期檢查您的垃圾信件匣，以確保您不會錯過信件。您可將信件從垃圾信件匣移至收件匣，方法如下：勾選信件旁邊的核取方塊，並選取這不是垃圾信按鈕。(2)加入聯絡人名單：將某人加入您的聯絡人名單，可確保其不會被送進垃圾信件匣。點選「新連絡人」並於信箱址址欄位填入「ebill@water.gov.taipei」，於名稱填入「臺北自來水處電子帳單」。
- - 請問要如何在臺北市申請舉辦路跑活動？
  - 為提升路跑活動品質，相關路跑活動申請請依「臺北市路跑活動執行審核計畫」相關申請規定及期程辦理申請作業，上開計畫內容請至本局網站業務資訊-法規資訊或臺北市法規查詢系統下載。
- - 「性侵害被害人一站式服務」的服務據點有哪些?
  - 一、臺北市現有六處據點提供服務：臺北市立聯合醫院（忠孝院區、陽明院區、婦幼院區、仁愛院區、中興院區）以及臺北市立萬芳醫院。二、民眾如遭性侵害，有驗傷需求者，可直接至服務據點，由本市服務團隊提供驗傷及製作筆錄等相關協助，如有相關問題可逕洽各據點或家防中心胡小姐(2396-1996轉6705)。
- - 「運動大導演」募集影片活動，於何時開始? 需為什麼身份才能參加?
  - 影片募集時間為12月2日至12月11日23點59分止，凡對音樂歌曲舞蹈表演或任何形式之演出有興趣之個人或2人以上團體，具有台灣之合法居留權之國、內外大專院校學生均可報名參加。
- - 何時舉行「運動大導演」募集影片的投票? 該怎麼投?
  - 投票期間為104年12月12日12點起至12月18日15點截止，民眾可在活動官網上登入「臉書帳號」後方能進行投票，每日每帳號可投3票(當日選項不得重覆)，評選結果將於104年12月18日18點整，公告於活動網頁上。獲獎影片更將於12月19日於在西門紅樓北廣場的「活力運動城市運動表演會」活動現場進行播出。
- - 「運動大導演」有哪些獎項?
  - 第一名獎金為5萬元、第二名獎金為3萬元、第三名獎金為2萬元，本活動獎金與獎品部份按財政部規定，依「各類所得扣繳率標準」辦理扣繳，由主辦單位代扣15%稅金，如有疑慮請參考財政部網站或來信big543543@hotmail.com或請撥服務專線02-2311-2958楊先生，將由專人為您服務。
- - 配合禁用一次性及美耐皿餐具，機關學校應宣導同仁注意什麼？
  - 自備環保杯取用飲水，減少購買瓶裝水。自備環保餐具，減少使用一次性及美耐皿餐具。
- - 「活力運動城市」運動表演會活動何時開始? 在哪? 有什麼表演內容?
  - (1)活動於12月19日下午16時至18時，假西門紅樓北廣場舉行(2)我們特別邀請符合時下潮流運動之跑酷團體、花式籃球、無雙樂團及超人氣的Lamigirls參與本次活動外，也將介紹世大運幾位知名運動員至現場與民眾進行互動，更提供有獎徵答活動，希望民眾能踴躍參加！(3) 詳細資料可上2017臺北世大運FB或官網查詢。
- - 都市更新條例因司法院釋字第709號解釋部分條文失效，臺北市之因應措施為何？
  - 一、都市更新事業概要103 年4 月26日前已申請尚未核准案暫緩審議，103 年4 月26日後暫緩受理申請案。二、都市更新事業計畫及權利變換計部分103 年4 月26 日前已報核尚未經市府核定之事業計畫、權利變換計畫，均應依大法官釋憲意旨及行政程序法規定舉行聽證。另聽證之舉行將參照內政部103年4月29日頒布之「內政部辦理都市更新聽證程序作業要點」辦理。 
- - 都市更新條例完成修法前，已報核或尚未報核之事業概要如何處理？
  - 一、都市更新條例第10條第2項失效後，市府受理中之事業概要暫緩審議，尚待立法院完成修法程序後通知申請人於一定期限內完成同意比例之補正後再續行辦理。市府於都更條例明定事業概要同意比例施行前，暫緩受理事業概要之申請。二、市府核准之自行劃定更新單元，倘因都更條例修法未及而無法依臺北市都市更新自治條例第15條第2項所定6個月期限內擬具事業概要報核者，致更新單元須重新辦理申請者，後續得參照行政程序法第50條規定，於都更條例明定事業概要同意比例施行日起10日內向市府申請回復原狀併同擬具事業概要報核。惟參照行政程序法第50條第3項規定，遲誤法定期間已逾一年者，不得申請回復原狀。
- - 自組都市更新團體相關法令及程序？
  - 一、依都市更新條例及都市更新團體設立管理及解散辦法相關法令，應取得都市更新條例第10條第2項前段規定比例，由過半數或7人以上土地及合法建築物所有權人發起籌組，再向當地直轄市、縣(市)主管機關申請核准籌組，自核准之日起6個月內召開成立大會，都市更新團體應於成立大會後30日內檢具相關資料，報請當地直轄市、縣(市)主管機關核准立案。二、自103年4月26日起都市更新條例第10條第2項前段規定比例因涉及司法院釋字第709號宣告違憲，都市更新團體申請核准籌組應達事業概要同意比例同意比例，仍依都市更新條例第10條第2項前段規定辦理。 更新團體組成流程圖
- - 推動都市更新重建時，臺北市政府有何補助？
  - 104年度受理臺北市協助民間推動都市更新事業經費補助申請暨審查原則：一、期限：每年發布補助申請期間二、條件：依都市更新條例第10條、第11條劃定之更新地區或更新單元，且以實施重建者為限。三、對象：(一)經核准都市更新事業概要者，其申請人。(二)經核准立案之都市更新團體。(三)符合更新條例規定之實施者。四、總上限： 480萬+綠建築50萬元。五、申請時點：各階段核定後六、撥款時點：各階段核定後：(一)依都更條例第10條擬具都市更新事業概要經本府核准者：上限40萬元；依都更條例第11條擬具都市更新事業概要經本府核准者：上限40萬元。(二)設立都市更新團體並經本府核准者：上限80萬元。(三)事業計畫核准：補助1/2，上限200萬+綠建築50萬元。(四)權變計畫核准：補助1/2，上限200萬元。(五)完整街廓或面積3000M2以上，以不逾核准補助項目總經費1/2，各補助款上限個得提高20%。七、其他：已接受臺北市政府以外相關機關（構）補助者，其補助金額應予扣除。
- - 申請老舊公寓專案計畫受理時間規定?
  - 民國99年8月2日至104年8月1日止合計5年，向都市更新處提出申請，並以事業概要或事業計畫(含都市計畫變更草案)正式申請報核掛件日期為準。
- - 配合「臺北最High新年城2015跨年晚會」公車延長收班時間資訊
