- - 怎樣算是性騷擾？
  - 依據性騷擾防治法第2條規定，係指性侵害犯罪以外，對他人實施違反其意願而與性或性別有關之行為，且有下列情形之一者都算：1、以該他人順服或拒絕該行為，作為其獲得、喪失或減損與工作、教育、訓練、服務、計畫、活動有關權益之條件。2、以展示或播送文字、圖畫、聲音、影像或其他物品之方式，或以歧視、侮辱之言行，或以他法，而有損害他人人格尊嚴，或造成使人心生畏怖、感受敵意或冒犯之情境，或不當影響其工作、教育、訓練、服務、計畫、活動或正常生活之進行。
- - 性騷擾究竟是性別歧視，還是犯罪行為？
  - 性騷擾除了是性別歧視，亦可能構成犯罪行為。受害者不拘性別，且依性騷擾防治法規定，加害人會因不同情形，被課以不同罰鍰或處以徒刑，且需負民事損害賠償責任，如：1、處以新臺幣1萬元以上10萬元以下罰鍰。如對於因教育、訓練、醫療、公務、業務、求職或其他相類關係受自己監督、照護之人，利用權勢或機會為性騷擾者，得加重科處罰鍰至1/2。2、若是乘人不及抗拒而為親吻、擁抱或觸摸其臀部、胸部或其他身體隱私處之行為者，處2年以下有期徒刑、拘役或併科新臺幣10萬元以下罰金。
- - 依性騷擾防治法規定機關、部隊、學校、機構或雇主需要做什麼？
  - 1、知道有性騷擾情形時，應採取立即有效之糾正及補救措施。2、應定期舉辦或鼓勵所屬人員參與防治性騷擾之相關教育訓練。3、應建立性騷擾事件申訴窗口；如組織成員、受僱人或受服務人員人數達10人以上者，應設立申訴管道協調處理；其人數達30人以上者，應訂定性騷擾防治措施，並公開揭示之。4、在性騷擾事件申訴、調查、偵查或審理程序中，為申訴、告訴、告發、提起訴訟、作證、提供協助或其他參與行為者，不得有不當之差別待遇，不然需負損害賠償責任。5、受僱人、機構負責人利用執行職務之便，對他人為性騷擾，依性騷擾防治法第9條第2項對被害人為回復名譽之適當處分時，雇主、機構應提供適當之協助。6.學生、接受教育或訓練之人員於學校、教育或訓練機構接受教育或訓練時，對他人為性騷擾，依第9條第2項對被害人回復名譽之適當處分時，學校、教育或訓練機構應提供適當之協助。
- - 性騷擾案件受害人身分會受到保密嗎？
  - 會，如果廣告物、出版品、廣播、電視、電子訊號、電腦網路或其他媒體，報導或記載被害人之姓名或其他足資識別被害人身分之資訊，各該目的事業主管機關依法裁處新臺幣6萬元以上30萬元以下之罰鍰，並得沒收上述物品或採行其他必要之處置，且通知限期改正，若屆期不改正，得按次連續處罰。但經有行為能力之被害人同意或犯罪偵查機關依法認為有必要者，不在此限。
- - 如果負責人或僱用人沒盡到性騷擾防治的責任，會有什麼後果？
  - 若未依規定採取立即有效之糾正及補救措施、設立申訴管道、訂定並公告性騷擾防治措施，或在性騷擾案件處理過程對當事人或關係人採取不當的差別待遇，會被處新臺幣1萬元以上10萬元以下罰鍰。經通知限期改正仍不改正的話，直轄市、縣(市) 主管機關得按次連續處罰。
- - 性騷擾加害人的所屬單位如果接到申訴時該如何進行調查處理？
  - 應於申訴或移送到達之日起7日內開始調查，並應於2個月內調查完成；必要時，得延長1個月，並應通知當事人。前項調查結果應以書面通知當事人及直轄市、縣 (市) 主管機關。
- - 性騷擾事件如何蒐集證據？
  - 除了人證、錄影、錄音、照片等直接證據外，被害人日記、事後立即告訴他人等間接證據亦可作為參考。
- - 性騷擾事件受害人可以找誰申訴？
  - 依據性騷擾防治法第13條及性騷擾防治準則第5條、第7條之規定，性騷擾事件之受害人得向加害人所屬機關、部隊、學校、機構、僱用人或直轄市、 縣(市)主管機關提出申訴；且亦可就近向事件發生地之警察機關報案提出申訴。性騷擾防治委員會洽詢電話：1999轉分機3365、4553。
- - 性騷擾申訴有沒有時間的限制？
  - 性騷擾事件被害人得於事件發生後1年內提出申訴。
- - 性騷擾事件申訴後，受理機關會有什麼動作？
  - 首先受理單位會先確認加害人的身分，如果加害人有所屬單位（機關、部隊、學校、機構或僱主），案件會移到加害人所屬單位調查；如果加害人不明或不知有無所屬單位，則由事件發生地警察機關調查。
- - 性騷擾事件之調解程序，應如何進行？
  - 性騷擾事件雙方當事人得以書面或言詞向直轄市、縣 (市) 主管機關申請調解，表明調解事由及爭議情形。調解除勘驗費由當事人核實支付外，不收取任何費用或報酬。調解成立，則作成調解書，由當事人及出席調解委員簽名、蓋章或按指印，並於10日內，將調解書及卷證送請移付或管轄之法院審核，法院核定後會將調解書及調解事件卷證送還當事人。調解不成立者，當事人得向該管地方政府性騷擾防治委員會申請將調解事件移送該管司法機關；其第一審裁判費暫免徵收。調解經法院核定後，當事人就該事件不得再行起訴、告訴或自訴。
