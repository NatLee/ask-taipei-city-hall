- - 公辦民營托嬰中心收托人數及資格？
  - 一、收托人數：40或45位嬰幼兒。 二、收托資格如下： （一）滿2足月至未滿2足歲之嬰幼兒。但已收托之嬰幼兒得延長收托至已達2歲，尚未依幼兒教育及照顧法規定進入幼兒園者。（二）嬰幼兒設籍臺北市，且其父母雙方、監護人或實際照顧者於報名登記日向前推算連續設籍臺北市滿6個月以上者。所稱實際照顧者，指父母雙方或監護人未實際照顧嬰幼兒，而由不具負擔或行使對嬰幼兒權利或義務之他人照顧，並與嬰幼兒共同居住者。嬰幼兒之家長其中一方為大陸籍或外籍人士，而無法符合設籍之規定，僅需由另一方家長於報名登記日向前推算連續設籍臺北市滿6個月以上。另如家長雙方皆為大陸籍或外籍人士，則不得報名登記入托。提供辦理托嬰中心場地之學校教職員工子女，得不受設籍之限制。（三）收托時間為週一至週五8：30∼17：30，另有提前及延後收托服務。
- - 萬華托嬰中心地點及電話為何？
  - 地址：臺北市萬華區成都路98號(臺北市西門國民小學和平樓1樓)電話：(02)2389-9063
- - 目前臺北市是否有辦理「105年工業及服務業普查」？其調查期間、目的及內容為何？
  - 臺北市政府配合行政院主計總處辦理「105年工業及服務業普查」，於106年4月15日至6月30日期間派員至各廠商進行訪問。本次普查的目的在於蒐集廠商營運情形及重要特徵等資訊，以獲得整體產業發展現況、資源分布、資本運用、生產結構與產銷變動等相關統計資訊，除供為經濟統計編修校正依據及經濟調查母體外，更充分支援各階段經建計畫、產業發展與輔導策略之釐訂，係國家經濟發展的重要紀錄來源，亦為學術研究與產業界釐訂經營方針、評估投資風險之重要參據。訪問內容包括組織型態、開業年月、經營項目、從業員工及薪資、營業收支、使用派遣勞工或經營勞動派遣業務、實際運用資產、經營特徵、營運數位化狀況、跨國服務交易、投資布局及人員往來情形、商品外銷及三角貿易情形、商品銷售管道、原材物料耗用量值及來源分配及其他各業專用明細項目等問項，以掌握產業發展脈絡。本次普查對象及調查方式為何?如何確認普查員身分？工業及服務業普查係由行政院主計總處統籌規劃，各縣市政府負責執行各該轄區內實地訪查工作，凡屬普查行業範圍內之企業及場所單位，不論為公營或民營，公司組織或非公司組織，已登記或未登記，其設有固定處所者，均為本普查對象。其調查方式採「派員面訪調查法」，以地毯式進行訪查為主，網路填報為輔。普查員於辦理訪查時，均會攜帶行政院主計總處製作之普查員證，以供廠商識別身分，如有任何疑問請逕向臺北市工業及服務業普查處(主計處經濟統計科)或各區普查所（各區公所）洽詢(詳電話一覽表)，亦可上臺北市工業及服務業普查專區網頁查詢，網址：http：//dbassurvey_iasc.gov.taipei/臺北市工業及服務業普查處及各區普查所電話一覽表單位  電話 臺北市普查處 02-27208889轉2054~2056或7647~7649 松山區普查所 02-87878787 信義區普查所 02-27239777 大安區普查所 02-23511711 中山區普查所 02-25031369 中正區普查所 02-23416721 大同區普查所 02-25975323 萬華區普查所 02-23064468 文山區普查所 02-29365522 南港區普查所 02-27831343 內湖區普查所 02-27925828 士林區普查所 02-28826200 北投區普查所 02-28912105
- - 萬華托嬰中心收托資訊？
  - 一、收托對象：(一)弱勢家庭嬰幼兒(含低收入戶、中低收入戶或經社會局核定之危機家庭或特殊境遇家庭)：收托名額為托嬰中心總收托人數10%。(二)西門國小教職員工子女：收托名額為托嬰中心總收托人數5%。(三)一般家庭嬰幼兒。二、登記資格：(一)滿2足月至未滿2足歲之嬰幼兒。但已收托之嬰幼兒得延長收托至已達2歲，尚未依幼兒教育及照顧法規定進入幼兒園者。收托人數上限為40名。(二)嬰幼兒設籍臺北市，且其父母雙方、監護人或實際照顧者於報名登記日向前推算連續設籍臺北市滿6個月以上者。所稱實際照顧者，指父母雙方或監護人未實際照顧嬰幼兒，而由不具負擔或行使對嬰幼兒權利或義務之他人照顧，並與嬰幼兒共同居住者。嬰幼兒之家長其中一方為大陸籍或外籍人士，而無法符合設籍之規定，僅需由另一方家長於報名登記日向前推算連續設籍臺北市滿6個月以上。另如家長雙方皆為大陸籍或外籍人士，則不得報名登記入托。西門國小教職員工子女，得不受前述設籍之限制。三、收托時間及費用收托時間為週一至週五8：30∼17：30，收托費用每月1萬1,000元，延托費用及團體保險費另計。另有提前及延後收托服務。
- - 股份有限公司可以獨資嗎？
  - 根據2001年11月12日修訂的“公司法”第128條第1款，股份有限公司必須由至少兩個人成立。然而，根據公司法第128-1條，上述規定不適用政府或法人股東一人所組織之股份有限公司。因此，目前政府機構或法人股東可能會有股份有限公司的情形。
- - 目前臺北市是否有辦理「受僱員工動向調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「受僱員工動向調查」係由行政院主計總處統籌規劃設計，各縣市政府為協辦機關，負責辦理各該轄區之調查業務，為按年辦理之調查。二、「105年受僱員工動向調查」調查期間為106年3月6日至3月31日，調查對象包含礦業及土石採取業、製造業、電力及燃氣供應業、用水供應及污染整治業、營造業、批發及零售業、運輸及倉儲業、住宿及餐飲業、資訊及通訊傳播業、金融及保險業、不動產業、專業科學及技術服務業、支援服務業、教育服務業、醫療保健服務業、藝術娛樂及休閒服務業、其他服務業等17大行業之公民營事業單位(場所)及其進入(年底在職)與退出之受僱員工為調查對象。三、該調查主要目的為配合社會經濟發展需要，蒐集受僱員工行業別、規模別、僱用型態別進退情形、受僱員工概況、非薪資報酬結構、調薪狀況、計薪方式、缺工情形及因應一例一休廠商採取措施等統計資料，並結合運用公、勞保及勞退新制檔、人口及住宅普查檔、戶籍檔之員工受僱及異動情形、教育程度別等資料，以供政府研訂經建計畫、規劃企業經營、釐訂產業、人力及輔導就業政策之參據，並供企業界調整員工薪資、改善經營管理、訂定人力計畫及提撥退休金之參考。調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作，據實回答。四、該調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw/）「政府統計」項下之「主計總處統計專區」項下之「其他專案調查」項下之「受僱員工動向調查」查詢。
- - 有關市民生活經濟危機之協助對象?
  - 協助本市低收入戶或家中突遭變故的民眾，請洽居住所在地之各社會福利服務中心，各中心地址、電話及聯絡人請見本局網站  http：//www.dosw.taipei.gov.tw
- - 夜間或假日有因失業、生病、意外或其他因素導致生活困難需協助者
  - 請話務中心登錄需協助者姓名、電話、地址後，於上班日轉本局。
- - 貧困家庭家人往生，沒有錢可以安葬
  - 1.上班時間請聯繫求助者居住地社福中心，由社工人員評估後提供協助，各中心地址、電話及聯絡人請見本局網站  http：//www.dosw.taipei.gov.tw。2.夜間或假日請由1999市民熱線留下民眾姓名、電話、地址等資料，於上班日再轉本局後續協助。
- - 輪狀病毒疫苗補助接種計畫對象為何?
  - 補助接種分為定額補助及全額補助二類：1.定額補助對象：領有第一、三類臺北市兒童醫療補助證之6-32週嬰兒，每位補助疫苗費用總計新臺幣2,100元。2.全額補助對象：領有第二類臺北市兒童醫療補助證之6-32週嬰兒，每位全額補助疫苗費用總計新臺幣5,700元。
- - 輪狀病毒疫苗補助接種金額為何?
  - 1.定額補助對象：(1)Rotarix，2劑型，每劑補助1,050元，總計補助2,100元。(2)RotaTeq，3劑型，每劑補助700元，總計補助2,100元。2.全額補助對象：(1)Rotarix，2劑型，每劑補助2,850元，總計補助5,700元。(2)RotaTeq，3劑型，每劑補助1,900元，總計補助5,700元。
- - 輪狀病毒疫苗補助接種計畫年齡為何?
  - 1.荷商葛蘭素史克藥廠：羅特律(Rotarix)輪狀病毒疫苗--提供滿6週至24週嬰兒使用。共需口服接種2劑，每劑間隔不得少於4週。2.美商默沙東藥廠：輪達停(RotaTeq)口服活性五價輪狀病毒疫苗---提供滿6 週至32週嬰兒使用。共需口服接種3劑，每劑間隔不得少於4週。
- - 輪狀病毒疫苗接種年齡如何計算?
  - 嬰兒接種年齡以週數計算，例如106年1月1日出生之嬰兒，於同年2月12日滿6週大。[從出生當日起算滿42天(6週 X 7天)後，隔日起符合疫苗補助對象資格]
- - 嬰兒接種的時間不完全包含在計畫補助期間內時，可以得到補助嗎?
  - 本計畫補助期間內符合補助資格對象，接種的輪狀病毒疫苗皆可得到補助。1.計畫實施前已接種完成2劑(Rotarix)或3劑(RotaTeq)輪狀病毒疫苗，不予補助。2.計畫實施前已接種1劑(Rotarix)或1至2劑(RotaTeq)輪狀病毒疫苗，該部分不予補助。惟於計畫實施期間內，接種對象若符合資格，可依施種劑數與廠牌不同得到補助。3.嬰兒之前未接種輪狀病毒疫苗，現在開始接種，如最後一劑超過24週齡(2劑)或32週齡(3劑)，則補助前述週齡之前可接種的劑次。4.依施種劑數與廠牌不同，定額補助對象Rotarix 每劑補助1,050元，RotaTeq每劑補助700元；全額補助對象Rotarix 每劑補助2,850元，RotaTeq每劑補助1,900元。
- - 臺北自來水事業處附設溫泉營業章程(中華民國105年12月5日臺北市政府府授水企字第10532531600號函核定，106年1月1日起實施)
  -                            臺北自來水事業處附設溫泉營業章程第  1  條     凡由臺北自來水事業處（以下簡稱本處）供應溫泉者，供需雙 方之權利義務關係，依本章程之規定。第  2  條     本章程用詞定義如下：一 泉源：溫泉露頭或由地面水取水口至溫泉孔混合之處。二 配水池：從泉源出水口引取溫泉後，所建置用以儲蓄、調配供應量之設備。三 配水管：自泉源、配水池至各流量調節裝置之輸送管線。四 流量調節裝置：在配水管途中設置調節水量之湯櫃或閥栓，並供用戶就近接管引取溫泉。五 口徑孔：裝設於湯櫃內，依口徑大小置於用戶進水管前，以控制及計算流量。六 進水管：用戶自流量調節裝置以下接用溫泉之管線。七 儲水槽：用戶進水管後之儲水設備。八 溫泉設備：分為溫泉供水設備及溫泉用水設備二部分。九 溫泉供水設備：自泉源、配水池、配水管至各流量調節裝置等設備。十 溫泉用水設備：自流量調節裝置以下之用戶進水管至儲水槽、浴池等設備。十一 管徑：管線內徑大小規格。十二 用戶：與本處有溫泉供應關係者。十三 完成接用：用戶申請溫泉新設時，依本處相關規定，完成用水設備之設計圖送審、裝竣及報驗等作業程序，並開通接用者。十四 視同接用：用戶繳交申請溫泉新設保證金後，未於本處規定期限或申請展延期限內完成接用者。十五 分時供應開關組：為調節用戶用水時段，需於用戶用水設備上增設之裝置。第  3  條     溫泉使用費及其他應收之費用，均報經臺北市政府核定後公告實施。第  4  條     本處供應溫泉種類，依可取用之泉源決定。第  5  條     溫泉用戶種別依使用性質分為：一 普通用戶：指單一住家或供公眾使用之公有溫泉。二 營業用戶：具營業性質者。三 集合用戶：指二戶以上共用同一流量調節裝置之用戶。第  6  條     本處溫泉以二十四小時供應為原則，但普通用戶得申請分時供應。前項分時供應之時段由本處決定。用戶申請分時供應需繳交相關費用，並不得再申請中止措施。如申請恢復二十四小時供應，恢復後二年內不得再申請分時供應。分時供應開關組由本處提供，用戶應妥善保管。第  7  條     本處溫泉有下列情形之一，無法維持正常供應時，用戶不得要求損害賠償或損失補償：一 泉源發生故障。二 裝修、維護溫泉供水設備或配合其他工程施工。三 因施工損壞溫泉供水設備。四 遇天災或其他重大事故。第  8  條     本處溫泉各項申請事項如下：一 新設：於本處公告期間，申請新接溫泉。但經主管機關指示配合公共政策接用者，不在此限。二 改裝：既有用戶欲變更較小之溫泉供應口徑或接水點位置。三 中止：用戶於一定期間內暫停使用。四 廢止：用戶無需使用溫泉。五 過戶：變更用戶名稱。六 種別變更：用戶溫泉使用性質之變更。七 恢復：用戶辦理中止，或經本處依第二十四條停止供應溫泉者，在規定期限內申請復用。八 分時供應：普通用戶申請依本處規劃之時段供應溫泉。第  9  條     本處溫泉供應有下列情形之一者，得暫緩接受用戶溫泉新設、改裝及分時供應之申請：一 供應已達飽和。二 供應有特殊困難。三 供應有不穩定之虞。第  10  條     用戶申請溫泉新設時，如本處開放申請之溫泉總量或該接水點不足供應其全部者，核供順序如下：一 以公益為目的提供使用之公有溫泉。二 以營利為目的，經營溫泉相關行業之業者。三 以自用為目的而接用溫泉之公寓、社區、高層大樓等集合住宅。四 其他：非本項第一款至第三款，且專供自用之使用者。前項同一順序申請量超過開放量時，以抽籤方式決定。第  11  條     用戶申請溫泉新設、改裝、中止、廢止、分時供應或其他有關溫泉使用事項時，應檢具申請書及必備文件，經本處審查同意後，繳付各項費用，如有積欠溫泉使用費及相關費用須先繳清。前項新設申請，用戶應於同意申請後六個月內完成接用，未能如期完成接用而有正當理由者，得於期間未滿前申請展延，展延以一次為限，每次不得超過六個月。違反前項規定者，視同接用，須按期繳交溫泉使用費。完成接用前不得辦理改裝、中止、種別變更、分時供應或廢止，完成接用後二年內不得辦理廢止。第一項之申請書件，如有虛偽不實者，本處得駁回其申請或撤銷其溫泉接用資格。第  12  條     用戶申請溫泉過戶時，受讓溫泉使用場所之建物所有權人應檢具權屬證明文件向本處辦理，如有欠費並應付清。第  13  條     用戶於建物改建或其他使用性質異動時，應檢具必備文件向本處申請溫泉種別變更。未辦理者，本處得逕予變更適用種別，並依第二十五條處理。前項因建物改建致增加所有權人時，得共同使用原溫泉。第  14  條     溫泉供水設備由本處裝設及維護，裝設之型式、材質及位置由本處決定。溫泉用水設備，由用戶自行委託承商裝設並負責維護，其設計圖應先送本處審查同意後，始得施工。工程完竣後，經查驗合格，始供應溫泉。前項設計圖之審查及工程查驗，用戶於建物改建仍沿用原溫泉時，準用之。溫泉用水設備之審查及查驗，本處得依核定之標準收取費用。第  15  條    本處因溫泉供水設備之遷移或改善而須移置用戶溫泉用水設備之進水管時，得不經同意逕行辦理，費用由本處負擔。第  16  條     用戶溫泉用水設備通過他人土地或建築物時，應取得所有權人或管理人之同意；如有糾紛，由用戶自行負責，否則本處得取消申請或暫停供應。前項通過之土地，為既成道路者，如用戶書面承諾該土地之使用發生爭執時，願自行負責處理者，得免經同意。第  17  條     用戶溫泉進水管不得私自遷移，亦不得以分管或其他方式供他處使用，違者依第二十四條及第二十五條規定辦理。第  18  條     本處得派員檢查用戶之溫泉用水設備及溫泉使用情形，用戶不得無故拒絕。第  19  條     溫泉使用費依用戶申接之泉別、口徑、支數、種別及其供應方式，照核定價格表計費。用戶溫泉計費未滿一個月時，其溫泉使用費按比例計收。本處溫泉如因第七條各款停止供應連續達三日以上者，溫泉使用費得按比例扣減。第  20  條     用戶應繳之溫泉使用費，經本處通知後，應按時繳付。前項溫泉使用費，自通知繳交之日起，用戶可自行至本處指定地點或其他代收水費單位繳費。逾繳費期限者，每逾四日按應繳之溫泉使用費加收百分之一違約金，最高加收至百分之五。前項違約金得併入下次溫泉使用費中收取。第  21  條     本處依第二十四條停止供應溫泉者，停止期間之溫泉使用費照計，用戶應於申請恢復時繳清。第  22  條     用戶申請中止期間，免計溫泉使用費，中止期間每年不得超過四個月，逾期未辦理恢復者，本處得終止供應溫泉。第  23  條     用戶申請溫泉新設時，經於本處同意後，應繳交保證金，金額依申接之泉別、口徑、支數及種別，照溫泉使用費核定價格表之二年總額，一次計收。用戶自繳交保證金起至完成接用後二年內，如因廢止或違反第二十四條規定而終止供應者，沒入全部保證金，作為懲罰性違約金。第一項之保證金於完成接用滿二年後，無息退還，如有欠費得予扣抵。第  24  條     用戶有下列情形之一者，本處得停止供應溫泉：一 違反第十七條規定之行為。二 溫泉用水設備損漏，經限期改善逾期仍未改善。三 無正當理由拒絕檢查溫泉用水設備、分時供應開關組或使用情形者。四 欠繳溫泉使用費或違約金逾一個月，經限期催繳仍不繳付者。五 妨害他用戶之溫泉使用者。六 私自改裝進水管或破壞溫泉供水設備。七 用戶於建物改建時，未辦理用水設備設計圖送審或報驗者。前項停止供應原因消滅，用戶申請恢復時，應先繳清各項費用，始得恢復供應。用戶因第一項各款而停止供應溫泉逾六個月未恢復者，本處得終止供應溫泉，終止後如需使用，應按新設方式辦理。第  25  條     用戶有下列行為之一者，應照接用口徑計收相當於十個月至二十個月溫泉使用費之違約金：一 擅自調節、變更或毀損本處溫泉供水設備、分時供應開關組者。二 違反第十七條規定之行為。三 由普通用戶變更為營業用戶或集合用戶，未依第十三條申請溫泉種別變更者。前項情形，用戶有共同實施、教唆或幫助者，仍應負第一項之責任。第  26  條     本處得因應新北投溫泉區以外不同溫泉區之特性，針對既有使用者，另訂相關特別管理規範。第  27  條     本章程報經臺北市政府核准後公告實施。
- - 輪狀病毒疫苗補助接種要到哪裡接種？要帶什麼證件？
  - 接種時攜帶1. 臺北市兒童醫療補助證2. 兒童健康手冊3. 全民健康保險IC卡前往臺北市輪狀病毒疫苗補助特約醫療院所接種。
- - 本計畫補助之輪狀病毒疫苗有哪些廠牌？適用年齡為何? 可否指定廠牌?
  - 本計畫補助之輪狀病毒疫苗，依醫師專業評估及各疫苗廠牌仿單建議用法接種，其接種廠牌則依接種單位建議或由市民自行決定。各廠牌適用年齡如下：1.荷商葛蘭素史克藥廠：羅特律(Rotarix)輪狀病毒疫苗--提供滿6 週至24週嬰兒使用。2.美商默沙東藥廠：輪達停(RotaTeq)口服活性五價輪狀病毒疫苗---提供滿6 週至32週嬰兒使用。
- - 如果是看病順便接種疫苗，需負擔哪些費用？
  - 如果是門診看病順便接種輪狀病毒疫苗，依兒童醫療補助證不同有不同程度之補助，須自行負擔各項費用之差額，包含疫苗費用、掛號費、診察費等醫療費用。
- - 未滿18歲兒少可否從事酒家、特種咖啡茶室、限制級電子遊戲場、賭場、成人情趣用品店等或有涉及暴力、色情危害兒少身心場所的從業人員？
  - 1依兒童及少年福利與權益保障辦法第47及48條規定，未滿18歲之兒少禁止進入前揭場所，亦不得於該場所充當侍應或從事該工作。2違反上開規定之僱用兒少業者，處6萬元以上30萬元以下罰鍰，公布其姓名，並命限期改善。【兒少權法第96條規定】單位：社會局兒少科聯絡人：徐小姐連絡電話：27256972
- - 育兒津貼申請條件中所指稅率未達20%大約是年收入多少錢？
  - 104年度綜合所得稅申報核定稅率未達20％（含12％、5％及未達申報額度等），也就是家庭綜合所得淨額在117萬元以下者。※名詞補充說明：綜合所得淨額＝綜合所得總額-免稅額及扣除額。
- - 「台北卡-健康服務」之申請資格為何？
  - 不限設籍臺北市之民眾，持自有悠遊卡，至臺北市十二區健康服務中心、區公所或臺北市立聯合醫院各院區，均可申請辦理「台北卡-健康服務」。集點活動僅限設籍臺北市市民或配偶設籍臺北市之新移民參加。
- - 106年「台北卡-健康服務」集點兌點服務時間為何？
  - 集點活動時間：自即日起至106年5月31日止；點數兌換時間：自即日起至106年8月31日止。
- - 106年「台北卡-健康服務」集點4項方案是哪些？
  - 106年「台北卡-健康服務」共4項集點方案：子宮頸癌、乳癌、大腸癌及口腔癌等四癌篩檢等。
- - 「台北卡-健康服務」兌點方式為何？
  - 市民請攜帶已申辦的「台北卡」（悠遊卡）至大台北地區各捷運站悠遊卡加值機、臺北市十二區健康服務中心、區公所、運動中心或臺北市立聯合醫院各院區，辦健康點數兌換悠遊卡加值金。
- - 「台北卡-健康服務」兌點地點有哪些？
  - 衛生局今（106）年兌點地點：大台北地區各捷運站悠遊卡加值機、臺北市十二區健康服務中心、臺北市十二區公所、臺北市立聯合醫院各院區、臺北市十二區運動中心
- - 「台北卡-健康服務」集點兌換悠遊卡加值金服務期限為何？
  - 自106年3月15日起至106年8月31日止，其服務時間依各兌點地點之服務時間為主。
- - 「台北卡-健康服務」之集點紀錄及可兌換總金額要如何查詢？
  - 市民可至「台北卡」官方網站（http：//card.taipei.gov.tw/index.do）或本局網站「台北卡-健康服務」專區/「點數查詢」或至本市十二區健康服務中心或聯合醫院各院區服務窗口查詢集點項目、集點數及可兌換總金額。若民眾對可兌換總金額有疑慮，可洽詢1999轉分機1815查詢。
- - 民眾如辦理「台北卡」卡片更換、資料修改、點數增修、掛失等相關異動資料，兌點服務可以立刻兌換嗎？
  - 不能立刻兌換。但可以當日兌換，惟兌點服務需完成系統資料傳輸（1小時）後始能兌換。
- - 民眾可以自行查詢台北卡健康點數兌換情形嗎？
  - 可以。民眾當日兌點金額及兌換情形，可於24小時後至「台北卡」官方網站（http：//card.taipei.gov.tw/index.do）或本局網站（http：//health.gov.taipei/）「台北卡-健康」專區/「點數查詢」進行確認。
- - 兌換台北卡健康點數只限1次嗎？
  - 點數兌換不限1次。但每次進行兌換服務時會將已核發的點數1次全部兌換成悠遊卡加值金。如已進行兌換，兌換後於106年5月31日前參加衛生局指定之集點活動，仍可持續累積點數，並於106年8月31日前皆能至本局指定兌換地點兌換悠遊卡加值金。
- - 民眾兌換的悠遊卡加值金總額需列入年度所得扣繳稅金嗎？
  - 兌換加值金年度累計新臺幣1,000元以上方須列入所得稅扣繳。
- - 民眾已申辦「台北卡」（悠遊卡）如果發現遺失或毀損，還可以兌換已累積的健康點數嗎？
  - 可以。「台北卡」（悠遊卡）遺失，市民可持自有之悠遊卡親自或委託至臺北市十二區健康服務中心或臺北市立聯合醫院各院區或臺北市各區公所辦理「換卡」；而惟原累積且尚未兌換之健康點數將不受影響，仍可於系統完成資料異動後（約1小時）提供點數兌換悠遊卡加值金。
- - 民眾已申辦「台北卡」（悠遊卡）如果發現遺失或毀損，卡片餘額可以向悠遊卡公司申請返還嗎？
  - 1.民眾悠遊卡如未向悠遊卡公司登記為記名服務，則無法向悠遊卡公司掛失及返還餘額；2.如持「記名式悠遊卡」（含衛生局免費發放的台北卡），若有卡片遺失或毀損情形，可連絡悠遊卡公司（客服專線：412-8880，手機請加區域碼02）辦理掛失及餘額返還服務，惟民眾於完成掛失手續後3小時內如被冒用所發生之損失，仍由持卡人自行負擔。
- - 去年或今年未兌換的「台北卡-健康服務」點數，可否隔年再進行兌換？
  - 不行。民眾需於規定期限自106年3月15日起至106年8月31日內進行今年度健康點數兌換，逾期則不得再兌換。
- - 請問那�可以做癌症篩檢?
  - 符合篩檢資格之民眾，可持健保卡至本市健保特約醫療院所免費做四癌篩檢。
- - 請問政府提供的免費癌症篩檢需要攜帶什麼證件，才能受檢?有哪些注意事項?
  - 1.請務必攜帶健保卡。2.欲做子宮頸抹片檢查者請穿著裙裝以方便檢查，女性於懷孕或生理期請勿接受子宮頸抹片檢查。
- - 請問符合「台北卡」集點兌換悠遊卡加值金之資格為何?
  - 1.子宮頸抹片檢查：  (1)設籍臺北市、年滿30-69歲女性市民且3年未做子宮頸抹片篩檢，並於106年1月至5月31日完成檢查者，可集點數100點。  (2)子宮頸抹片篩檢疑似陽性個案於106年1月至5月31日完成複檢，可集點數100點。2.口腔黏膜檢查：  (1)設籍臺北市且年滿30歲以上(或18歲以上原住民)有吸菸或嚼檳榔習慣之市民，於106年1月至5月31日完成口腔黏膜檢查，可集點數100點。  (2)口腔癌篩檢疑似陽性個案於106年1月至5月31日完成複檢，可集點數100點。3.乳房X光攝影檢查：  (1)設籍臺北市且年滿45-70歲女性市民，於106年1月至5月31日完成乳房X光攝影檢查，可集點數100點。  (2)乳癌篩檢疑似陽性個案於106年1月至5月31日完成複檢，可集點數100點。4.大腸癌糞便潛血檢查：  (1)設籍臺北市且年滿50-70歲市民，於106年1月至5月31日完成大腸癌篩檢，可集點數100點。  (2)大腸癌篩檢疑似陽性個案於106年1月至5月31日完成複檢「大腸鏡」或「乙狀結腸鏡加大腸鋇劑攝影」檢查，可集點數200點。
- - 《在街角，遇到飛行》為何想再次發行一本臺北市的賞鳥書？
  - 近年來，臺灣賞鳥風氣漸盛，從國際矚目的黑面琵鷺、官田水雉、老鷹紅豆到金山小白鶴，都逐漸喚起了民眾對野鳥的關注，因此希望在此時發行一本臺北市的賞鳥書，帶著大家認識城市在快速發展的同時，仍然保有的生態，也藉此呼籲大眾要心存保育的意識，好好珍惜大自然的資產。
- - 《在街角，遇到飛行》這本書有何特色？
  - 本書特別邀請自然生態作家劉克襄主筆，他以清新的文字娓娓道來許多關於鳥的傳說故事與經典篇章，打破以往鳥書的專業和艱澀，取而代之以人文結合科學的有趣小故事，帶領大家培養對野鳥的興趣與關懷。此外，本書也與讀者分享臺北市區與近郊53種常見的鳥種，更公開12條賞鳥路線，讓讀者只要帶著書走，就能輕鬆走訪城市飛羽之旅；本書更結合數位科技，附上鳥鳴QR code，讓讀者即使不出門，也能在家中透過手機輕輕一掃，聽見在野外的美麗樂音。
- - 《在街角，遇到飛行》為何會選在禽流感時期發行此書呢？
  - 在向臺北市動保處與台北市野鳥學會詢問此次禽流感的狀況後，我們得知，若是保持一定距離地賞鳥、不去直接碰觸或餵食野鳥、造成野鳥群聚，基本上是不會遭受感染的。另外，冬天才是禽流感的好發期，目前正值春季，天氣將漸漸轉暖，禽流感理將緩和下來。我們不只是希望藉由此書來宣揚保育的精神，也希望在這個時間點上，向大眾宣導對於禽流感的正確認知，也再次提醒，到野外賞鳥時，不要碰觸野鳥，也不要餵食，就能降低感染的風險。
- - 《在街角，遇到飛行》請問這本書可以在哪裡購買得到？
  - 《在街角，遇到飛行》每本售價新臺幣280元，請至臺北市政府出版品紀念品展售中心、國家書店、五南文化廣場、誠品書店、金石堂等全台各大書店及博客來網路書店購買，或電洽臺北市民當家熱線1999（外縣市02-27208889）轉7564詢問。
- - 臺北市政府婦女中途之家(原稱慧心家園)房屋使用費大約多少？可以居住多少人?
  - 婦女中途之家房舍共有七層樓，1樓有5戶獨立套房D室(11.5坪，至多可住3人，隨同進住子女若為男性，限國小4年級以下)使用費每月新臺幣6,200元；2至7樓每層4戶，每戶三房分別為A室(4.8坪，至多可住3人)使用費每月新臺幣4,300元、B室(3.3坪，至多可住2人)使用費每月新臺幣3,000元、C室(2.5坪，至多可住2人，限帶1歲以下之嬰兒)使用費每月新臺幣2,300元，保證金依使用費2倍計算。若有其他疑問可洽詢婦女中途之家社工人員，洽詢電話：02-2701-1828。
- - 臺北市政府婦女中途之家(原稱慧心家園)申請流程如何？
  - 申請人需檢附應備文件郵寄至臺北市政府社會局婦女福利及兒童托育科(郵寄地址：11008臺北市信義區市府路1號)，收到申請文件後，如文件齊全將派社工員面訪評估，若應備文件未齊，則需請申請人補件。自受理完整申請文件起十日內，會函覆申請人審核結果，若審核通過且所申請的房型有空，則申請人應於文到後1個月內辦理簽約入住事宜，逾期視為棄權。若有其他疑問可洽詢婦女中途之家社工人員，洽詢電話：02-2701-1828。
- - 勞資會議除了勞資代表必須報備外，會議紀錄也需要送勞動局報備嗎？
  - 勞資會議之決議應由事業單位分送工會及有關部門辦理外，會議紀錄也要發給出席與列席之人員後，事業單位留存備查即可，並不需要向勞動局報備。聯絡科室：勞資關係科 勞資會議承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7013、7031、7033
- - 目前臺北市是否有辦理「汽車貨運調查」？其調查期間、對象及目的為何？
  - 一、「汽車貨運調查」係由交通部主辦，各縣市政府為協辦機關，負責辦理轄區內之調查業務，為定期按半年辦理之實地訪問調查。二、資料調查期間為106年4月16日至4月22日，以登記於臺北市之自用與營業用貨車為訪查對象。三、該調查主要目的係為蒐集臺灣地區自用與營業貨車之貨運流向及流量等動態資料，以供編製全國性及地區間產業關聯表及交通部研擬汽車貨運管理相關措施之參據。四、本調查之資料經彙總統計後，將刊載於交通部編印之「汽車貨運調查報告」內，有關重要統計結果亦將登載於交通部網站（網址：http：//www.motc.gov.tw/ch/home.jsp?id=56&parentpath=0,6）以供各界參考。
- - 敬老、愛心悠遊卡有使用期限嗎?
  - 1.使用期限為半年(6個月)。2.每半年(6個月)必須展期一次(攜帶身分證件、身心障礙手冊及悠遊卡)可至區公所、臺北捷運  全線各站查詢機或可儲值之便利商店皆可展期。3.若逾半年未展期，即鎖卡，可至臺北捷運全線各站查詢機、貼有「悠遊卡」標誌之特約便利商  店(7-11、全家)辦理自動逾期展期作業。
- - 檢查瓦斯漏氣簡便方法？
  - 不使用瓦斯時，檢視瓦斯表最右位置之數字，如有轉動，表示漏氣。以肥皂水塗於檢查處，如有漏氣，會形成氣泡。絕不可用火測漏。
- - 市民辦理公益或宣導市政政策之藝文活動,需申請調整本市垃圾車播放音樂時間及音量者,如何處理.
  - 考量市民丟垃圾之權益，故垃圾車收運時播放音樂，以不隨意變動為原則。若有因辦理集會(音樂會、追思會、晚會)、活動，而需本局垃圾車降低音量或配合改道改時間者，請撥打本局環境清潔管理科勤務股邱股長電話聯繫協處(本府市民熱線1999轉7271)。
- - 家庭看護、外籍看護申請須知及流程可洽詢臺北市各區長期照顧管理中心諮詢
  - 對於申請家庭看護、外籍看護需求者 ，先向指定醫院辦理專業評估 ( 已持特訂重度身心障礙手冊者，則免評估 )。由醫院醫療團隊 ( 2位以上醫事人員進行綜合評估 )，認定是否屬全日照護需求或年齡滿八十歲以上，有嚴重依賴照護需求者，並經巴氏量表或臨床失智評估後，醫院將「病症暨失能診斷證明書等相關申請文件，寄給雇主及被照顧者現居地長期照顧管理中心。http：//health.gov.taipei/Default.aspx?tabid=880
- - 文山托嬰中心收托資訊？
  - 一、收托資格如下：    滿2足月至未滿2足歲之嬰幼兒。但已收托之嬰幼兒得延長收托至已達2歲，尚未依幼兒教育及照顧法規定進入幼兒園者。    嬰幼兒設籍臺北市，且其父母雙方、監護人或實際照顧者(以下簡稱家長)於報名登記日向前推算連續設籍臺北市滿6個月以上者。    前項第二款所稱實際照顧者，指父母雙方或監護人未實際照顧嬰幼兒，而由不具負擔或行使對嬰幼兒權利或義務之他人照顧，並與嬰幼兒共同居住者。    嬰幼兒之家長其中一方為大陸籍或外籍人士，而無法符合設籍之規定，僅需由另一方家長於報名登記日向前推算連續設籍臺北市滿6個月以上，惟另一方大陸籍或外籍人士仍需居留臺北市滿6個月以上(須出示護照或居留證正本)。另如家長雙方皆為大陸籍或外籍人士，則不得報名登記入托。    提供辦理托嬰中心場地之學校教職員工子女及本托嬰中心現職員工子女，得不受第一項第二款設籍之限制。二、招生年齡：滿2足月至未滿2歲。三、實施方式：　　依下列身分別報名登記：1. 優先收托：優先收托名額為托嬰中心總收托人數20%，如未達收托比例，得以一般家庭嬰幼兒遞補： 　(1)弱勢家庭 (含低收入戶、中低收入戶或經本局核定之危機家庭、特殊境遇家庭)　(2)父母戶內育有3名以上子女家庭之嬰幼兒　(3)具原住民身分之嬰幼兒　(4)發展遲緩或持有輕度身心障礙手冊之嬰幼兒　(5)嬰幼兒其「手足」或「父母或監護人」之一為中度以上身心障礙者2. 提供辦理托嬰中心場地之學校教職員工子女(設置於學校場地始辦理本梯次招生)、 本托嬰中心現職員工子女，收托名額為托嬰中心總收托人數5%，如未達收托比例，得以一般家庭嬰幼兒遞補。3. 一般家庭嬰幼兒。各身分別申請收托嬰幼兒超過收托名額時，採抽籤方式辦理。托嬰中心公告招生期間，每名嬰幼兒不限申請一家。◎自104年度重新候補登記期程起（即報名登記日104年7月4日），每位嬰幼兒以登記1家托嬰中心為限，非經切結放棄不得於第2家登記，違反規定者，取消其所有錄取及就托資格。四、收托時間及費用　　收托時間為週一至週五8：30∼17：30，收托費用每月1萬1,000元，延托費用及團體保險費另計。另有提前及延後收托服務。
