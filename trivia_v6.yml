- - 同一家庭可以申請租金補貼、自購住宅貸款利息補貼或修繕住宅貸款利息補貼等2種以上的補貼嗎？
  - （一）不可以。（二）同一家庭同一年度只能由1人就「自購住宅貸款利息補貼」、「修繕住宅貸款利息補貼」或「租金補貼」3種方式擇一申請；同時申請二種以上者，直轄市、縣（市）主管機關將限期申請人擇一申請，屆期未擇一者，得全部駁回。有2人以上申請者，直轄市、縣（市）主管機關將限期請申請人協調由1人提出申請，屆期協調不成者，得全部駁回。
- - 家庭暴力或性侵害之受害者及相對人共同持有1戶住宅或僅相對人持有住宅，因離婚訴訟或其他原因，致受侵害者需與相對人分居，且另行購置住宅者，可否申請本貸款利息補貼？
  - (一)可以。但申請人除依規定檢附應附之文件外，並應出具切結書及離婚訴訟等相關文件。(二)前項家庭暴力或性侵害之受害者申請本貸款利息補貼時，視為無自有住宅；直轄市、縣（市）主管機關得定期查核，申請人經查核已完全持有該戶住宅者，應自事實發生之日起停止補貼。
- - 交通維持臺64線快速道路中和一下橋匝道封閉拆除改道有何宣導
  - 本工程辦理捷運環狀線CF650區段標工程施工作業，需辦理臺64線快速道路中和一下橋匝道封閉交維改道作業，民眾可透過新北市政府網站或臺北市政府捷運工程局東區工程處網站連結查詢相關新聞稿作業，另外本處預先辦理各項宣導作業分述如下：1.提前於臺64線高架及平面道路施工牌面掛設作業以為宣導。2.函請交通部臺灣區國道高速公路局、交通部公路總局協助發佈臺64線東西向全線CMS資訊可變標誌事宜。3.透過臺北市政府捷運工程局公關室向警廣等相關媒體發布交維改道新聞稿作業。
- - 有老花眼鏡補助嗎?
  - 本局尚未開辦老花眼鏡補助，惟若長者為視障者或具視障之多重障礙者，可於戶籍所在地區公所依「身心障礙者輔具費用補助辦法」申請購買特製眼鏡補助，低收入戶最高補助金額新臺幣6,000元，中低收入戶最高補助金額新臺幣4,500元，一般戶最高補助金額新臺幣3,000元。
- - 臺北市政府各機關受理人民陳情案件之原則為何？處理人民陳情案件之方式為何？「人民陳情案件處理情形滿意度調查表」如何填寫？
  - 一、臺北市政府各機關受理陳情案件之原則如下：(一)人民陳情以書面為之者，包括電子郵件及傳真等在內，應載明具體陳情內容、真實姓名及聯絡方式。(二)人民陳情以言詞為之者，受理機關應作成紀錄，載明陳情內容、真實姓名及聯絡方式，並向陳情人朗讀，或使閱覽請其簽名或蓋章確認後，方據以辦理。二、有關陳情案件實質內容之處理，依行政程序法第168條規定及尊重機關專業素養與判斷，由臺北市政府各機關本於權責審慎查證後衡酌辦理，並依「臺北市政府及所屬各機關處理人民陳情案件注意事項」第17點之規定，加強機關內部控制與稽核，責由各機關研考人員落實以案管制作業。三、請以立案時之「案件編號」及「案件密碼」至本府單一陳情系統「HELLO TAIPEI」（網址：https：//hello.gov.taipei），填寫網路問卷。
- - 人民陳情案件的處理時效為何？
  - 人民陳情案件辦理期限，依「臺北市政府及所屬各機關受理人民陳情案件注意事項」第15點規定：「各機關受理人民陳情案件處理時限為6個工作日，如法規另訂有處理期限，或因內容複雜、數量眾多，需一定處理時限及程序，經報本府核定通案處理者，依所定期限辦理。但不得超過30日（以日曆天計算）；其因故未能在30日（以日曆天計算）以內辦結者，應將辦理情形及延期理由先行告知陳情人。」本府及所屬各機關應依上開規定辦理。
- - 對於各機關回復的人民陳情案件內容有疑義，可以向哪個單位反映？
  - 如針對機關回復內容有所疑義，請直接向該案件處理機關之承辦人員或研考人員反映。
- - 一、人民陳情案件是否一定要留下真實姓名及聯絡方式？二、若提供個人資料，是否有洩密之可能？
  - 一、依據「臺北市政府及所屬各機關處理人民陳情案件注意事項」規定：人民陳情以書面為之者，包括電子郵件及傳真等在內，應載明具體陳情內容、真實姓名及聯絡方式。如未提供上述資料將不予處理，本資料將提供承辦機關參考。二、另臺北市政府各機關受理人民陳情案件時，對於案內相關文書作業，如有必要之保密事項，其制作、傳遞、保管，均應採密件文書處理，並依「臺北市政府文書處理實施要點」之文書處理保密規定辦理，以維護陳情人身分及陳情事項之保密。
- - 向臺北市單一陳情系統「HELLO TAIPEI」反映市政問題，但未收到確認信，應如何處理？
  - 向臺北市單一陳情系統「HELLO TAIPEI」反映市政問題後，系統將會自動寄發確認信函，如未接獲確認信函，請向本府資訊局洽詢，聯絡電話：(02)27208889轉2872或8561。
- - 臺北市單一陳情系統「HELLO TAIPEI」案件為何無法查詢處理情形？
  - 可利用臺北市單一陳情系統「HELLO TAIPEI」案件查詢服務，輸入案件編號、案件密碼及驗證碼，即可查詢案件處理情形（註：如當初以「網路市民」會員身分立案者，亦可直接登入會員查詢），若仍無法查詢，請向本府資訊局洽詢，聯絡電話：(02)27208889轉2872或8561。
- - 本府各機關受理臺北市單一陳情系統「HELLO TAIPEI」案件後，應如何辦理改分或代為立案作業？
  - 市府各機關請依「臺北市政府單一陳情系統作業程序」之規定辦理。如認為非屬管轄權案件，應簽註意見並與相關管轄權機關人員協調溝通確認，經由機關主任秘書以上人員核定後，於收件或會勘完成後次一工作日內完成改分或代為立案作業。
- - 臺北市政府每年度辦理之人民申請案件年度審查標準作業流程為何？
  - 臺北市政府各機關應依「臺北市政府申請案件處理作業要點」內容，檢討修正或簡化申請案件，提報資料送本會進行初審，針對疑義與機關進行確認，並依實際需要召開個案審查會議，審查完成後專案簽核及函知各機關，各機關應依核定結果公告人民申請案件處理時限表，並完成相關網站系統功能設定、服務資訊更新等事宜。
- - 「臺北市民e點通」網站提供什麼服務？
  - 一、「臺北市民e點通」網站是臺北市政府整合各機關申請案件，提供民眾可於網路上進行申辦作業的單一窗口網站，本網站功能與服務包括：申請案件基本資訊說明、申請書表下載、網路申辦與繳費、案件申請流程說明、案件辦理情形查詢，另提供手機瀏覽及部分案件可手機申辦等功能。二、對申請案件相關資料設定與更新如有任何疑問，請洽本網站之各項申請案件承辨單位；如對本網站之維護管理有疑問，則請洽臺北市政府資訊局，聯絡電話：(02)27208889轉2835。
- - 「為民服務工作不定期現場考核」是什麼？
  - 為落實推動為民服務工作品質，樹立優質服務典範，鼓勵創新服務，各機關除進行日常例行性（定期）維護管理工作以外，另應針對所屬機關及委外經營且對外服務之場館自行督考，實施不定期考核作業；本會亦不定期派員至各機關服務場所進行重點考核，協助機關發現問題與管理盲點，進行缺失改善。
- - 一、臺北市政府創意提案競賽提案人及獎勵對象為何？二、評獎作業如何進行？
  - 一、臺北市政府創意提案競賽提案人及獎勵對象為市府各機關全體同仁，屬於內部創新的一環，由同仁組成2人團隊共同提出創意提案，並明列主要提案人(限1名)及參與提案人(人數不限)。二、評獎作業如下： （一）初審作業：(1)由本會先就提報名資格、提案資料等進行形式審查。 (2)形式審查通過之提案，送請評審委員依評分指標進行書面審查。(3)由副召集人召開初審委員會議，評定入圍第二階段複審之提案及其他事宜。（二）複審作業：由召集人召開複審委員會議，聽取入圍提案單位10分鐘簡報及進行詢答。
- - 一、臺北市政府如何推動電話服務禮貌？二、督考方式為何？
  - 一、為提升電話服務品質，臺北市政府訂有「臺北市政府電話服務禮貌實施計畫」。市府各機關同仁以電話聯繫市民時，應前開原則辦理。二、市府各機關應依前揭實施計畫，落實內部電話服務禮貌平時考核制度，不定期辦理教育訓練精進電話服務禮貌。若有市民陳情電話服務禮貌不佳之個案，應先確認服務不佳同仁之機關(單位)，由該機關(單位)先行檢討並回復民眾改善情形。三、本會係以府級督考角度執行「不定期抽查」作業，督促各機關檢討改善。
- - 身心障礙者輔具費用補助內容
  - 身心障礙者生活輔具費用補助新制自101年7月11日起施行：本補助共計補助172項輔助器具，並就輔助器具項目、補助最高額度、最低使用年限及補助對象核實補助。詳細內容請參閱詳見衛福部頒訂之「身心障礙者輔具費用補助辦法」及「身心障礙者輔具費用補助基準表」之相關規定。每人每2年以申請4項輔具補助為限（合併醫療輔具補助項次計算）。另請民眾務必與戶籍所在地區公所或社會局輔具相關承辦人員，或至本局網站確認，其欲申請的輔具項目相關規定及補助對象等規定，以免業者或醫院人員所提供之資訊不符輔具補助規定的情形。
- - 哪裡可以索取到衛福部訂定之「身心障礙者輔具費用補助基準表」？
  - 1. 可至社會局身障科或戶籍所在地區公所索取，2. 本局網站www.dosw.gov.taipei之身心障礙者服務---輔具補助及服務---身心障礙者輔具費用補助亦可下載基準表及申請所須相關表格。
- - 「2016印尼開齋節歡慶活動」活動在哪裡舉行？何時？是否需收費？
  - 時間：105年7月10日9：30至16：30地點：花博公園爭艷館舉行(玉門街1號，捷運圓山站1號出口)參加對象：有興趣的民眾皆可參加，毋須事先報名費用：免費入場
- - 「2016印尼開齋節歡慶活動」此活動目的？
  - 開齋節是伊斯蘭教重要的節日，是穆斯林慶祝齋戒月結束的日子，為營造臺北市為穆斯林友善城市，讓市民朋友認識穆斯林文化，且感謝印尼移工對本市家庭、經濟的貢獻，配合移工放假，訂於開齋節後的第一個星期日105年7月10日於花博公園爭艷館舉行歡慶活動。
- - 「2016印尼開齋節歡慶活動」活動規劃重點
  - 活動當天上午以宗教心靈分享講座為主，邀請印尼穆斯林學者演講；下午則以歡樂氣氛為主，邀請印尼知名藝人團體表演，並安排抽獎及各式互動活動，參加活動有機會獲得免費午膳及攜帶式禮拜毯(數量有限送完為止)，另設攤推廣穆斯林認證食品等：一、上午9：30(入場)至12：00，邀請印尼知名伊斯蘭教學者演講，中午提供限量免費印尼餐點。二、下午1：30至4：30 邀請在台印尼樂團表演，及印尼知名歌手siti Badriah現場演唱，並舉辦抽獎活動，有豐富的3C產品及多項好禮。三、另為推廣穆斯林清真食品，配合活動於7月9日及7月10日上10：00至18：00設有清真認證及穆斯林美食攤位。
- - 「2016印尼開齋節歡慶活動」如何獲得免費午膳及兌換
  - 免費午膳券於9：30分於活動現場開始發送，並於中午規定之時間內至領取區憑券兌換1份餐點。
- - 「2016印尼開齋節歡慶活動」如何獲得贈品及摸彩券
  - 於現場用手機與本活動特製拍照背板合照，並由工作人員確認後即可獲得限量攜帶式禮拜毯及摸彩券，摸彩活動將於下午活動節目中進行。
- - 領有身心障礙證明(手冊)後，如有戶籍異動、證明(手冊)遺失或破損不堪使用、姓名或身分證統一編號變更等情形，如何辦理？
  - 1、戶籍遷徙、姓名或身分證統一編號變更者：請攜帶身心障礙證明(手冊)、戶口名簿或身分證（需先至戶政單位辦理登記）、一吋半身照片1張、至新戶籍所在地區公所社會課辦理異動註記。2、證明(手冊)遺失或破損不堪使用申請補(換)發身心障礙證明(手冊)者：請攜帶身心障礙者之印章、身分證(未滿14歲者得檢附戶口名簿)、1吋半身照片2張至戶籍所在地區公所社會課辦理(委託申請者須另檢附受託人之個人身分證明文件及印章)。
- - 如何前往活動地點(花博公園爭艷館)
  - 一、捷運淡水線直達：搭乘淡水線至捷運圓山站，下車後從1號出口出站，出口旁即是花博公園。二、公車：● 21、28、208、247、42、542、677、紅2、紅33、紅34(假日行駛)、紅50 至【捷運圓山站(玉門街)】● 246、208、542、紅33、紅34(假日行駛)、218至【中山足球場站】(停靠民族東路)三、自行開車停車資訊：花博公園地下停車場(民族西路玉門街口)
- - 臺北市住宅價格指數編製發布之指數項目為何？
  - 臺北市住宅價格指數每月編製發布之指數項目如下：一、臺北市全市住宅價格月指數。二、臺北市全市公寓(5樓含以下無電梯)及大樓(6樓含以上有電梯)住宅價格月指數。三、臺北市4個次分區住宅價格月指數：大安信義中正區、中山松山南港區、士林內湖大同區、萬華文山北投區。
- - 可以拒絕收托因腸病毒停課的兒童嗎？
  - 一、為避免腸病毒疫情擴散，托嬰中心原則上不接受其他機構因腸病毒停課而送進來就托之兒童，請家長配合。二、為協助未能自行照顧因腸病毒停課、停托之學校及機構兒童之家長，本市各行政區居家托育服務中心提供目前未收托兒童之保母名單，協助照顧因腸病毒停課、停托之學校及機構兒童，惟考量保母與其家人及兒童的健康情形，每名保母協助照顧因腸病毒停課、停托之學校及機構兒童以1人為原則，社會局同時提醒已經托育幼兒的保母，除了個人及協助幼兒養成勤洗手習慣外，務必每日進行家中消毒工作。三、有需要臨時照顧服務的家長可以直接與各行政區居家托育服務中心聯繫，或至本市保母媒合平台查詢(網址：https：//findchildcare.taipei/)。四、民眾可洽社會局婦幼科（連絡電話：1999轉1622~1623）詢問。
- - 哪裡有腸病毒相關問答？
  - 腸病毒相關問答可至社會局網站/ 嬰幼兒照顧服務/傳染病防治專區/請托育機構加強腸病毒衛教宣導及防治工作，並轉知家長配合辦理 項下查詢。
- - 2016台北河岸音樂季系列活動各項詳細資訊，何處可獲取?
  - 臺北旅遊網(http：//www.travel.taipei/)提供詳細活動內容、現場及周邊交通、捷運及接駁公車等各項資訊。
- - 如何進行預防腸病毒的環境消毒？
  - 腸病毒消毒程序及注意事項一、漂白水溶液之配製(一)室內之消毒：打掃乾淨後以含氯500ppm溶液洗刷。巿售漂白水(5%濃度計算)以喝湯用湯匙(約15~20CC)5湯匙加入10公升清水(寶特瓶1250cc 8瓶或2000cc 5瓶)即可。(二)庭院、水溝及其他潮濕處所：應於清除垃圾及打掃清潔後，可直接撒佈漂白水或以含氯1000ppm之溶液進行環境消毒。巿售漂白水(5%濃度計算)以喝湯用湯匙(約15~20CC)10湯匙加入10公升清水(寶特瓶1250cc 8瓶或2000cc 5瓶)。二、環境消毒重點(一)須對於常接觸物體表面(門把、課桌椅、餐桌、樓梯扶把)、玩具、遊樂設設施、寢具及書本、遊樂設施及娃娃車等進行消毒。(二)清洗完畢的物體可移至戶外，接受陽光照射，陽光中的紫外線，可降低病毒活性。三、消毒時應注意事項(一)消毒時打開窗戶並保持消毒空間通風良好。(二)漂白水應儲存密閉容器，在開放容器中，有效氯會迅速降低，於需使用時再行稀釋。(三)漂白水溶液對部分金屬製容器具，如銅鋁製品或非不�鋼的鐵製品會產生氧化作用而變色或腐蝕。(四)衣服、鞋子等接觸到漂白水溶液時可能導致褪色破洞。(五)漂白水溶液直接接觸到皮膚時會有刺痛之感覺，使用時需特別注意。(六)如碰到眼睛應立即以清水沖洗，並且馬上送醫院做適當之處理。(七)操作時應戴橡皮手套。(八)含氯漂白水會影響化糞池功能，請勿倒入馬桶。
- - 托嬰中心腸病毒停課標準？
  - 一、警訊期狀態為「流行警訊期間」，托嬰中心停托隔離措施：(一)七日內同一班級有二名以上（含二名）兒童經診斷為手足口症時，該班應即停托。(二)衛生福利部疾病管制署公布當年度發生腸病毒七十一型流行疫情：當機構內同一班在一週內有二名以上(含二名)兒童經醫師診斷為腸病毒感染時，該班應即停托。(三)須停托症狀包含下列情形之一： 1、「腸病毒重症確診」或「腸病毒七十一型」一名。2、「手足口症」或「?疹性咽峽炎」等腸病毒病症狀合計達二名以上。    若為混齡教學，其他參與之班級視為同一班級，須同時停托。二、「本市出現本土性腸病毒重症確定病例」，托嬰中心停托隔離措施：（一）班上出現一名經確定診斷為腸病毒七十一型個案，該班即需停托。（二）須停托症狀包含下列情形之一：1.「腸病毒重症確診」或「腸病毒七十一型」一名。2.「手足口症」或「?疹性咽峽炎」等腸病毒病症狀合計達二名以上。    若為混齡教學，其他參與之班級視為同一班級，須同時停托。三、「本市腸病毒重症流行」，托嬰中心停托隔離措施：（一）一班只要出現一名手足口症時，立即停托。（二）須停托情況包含下列情形之一：1.「腸病毒重症確診」或「腸病毒七十一型」一名。2.「手足口症」一名。3.「?疹性咽峽炎」二名。    若為混齡教學，其他參與之班級視為同一班級,須同時停托。四、非流行警訊期間，托嬰中心停托隔離措施：(一)有一名以上（含一名）兒童疑似感染腸病毒手足口症時，得召集該班級托育人員及家長成立危機處理小組,並應依本作業規定第三點進行處理措施。(二)當年度無腸病毒七十一型流行疫情：機構所在之行政區，若當年度曾由衛生福利部疾病管制署公布有「腸病毒七十一型檢驗陽性個案」或「年齡在三個月以上的腸病毒感染併發重症個案」，當機構內同一班在一週內有二名以上(含二名)兒童經醫師診斷為腸病毒感染時，該班應停托。(三) 所謂腸病毒係包含手足口症或?疹性咽峽炎等腸病毒病症。五、如發現疑似傳染病個案，請機構務必於發現時48小時內至「臺北市學校暨機關傳染病通報系統」通報，以免因未即時通報遭本府衛生局裁罰。六、另請各機構於兒童入中心時，量測體溫及檢查手足、口腔是否白點及破洞，如發現疑似有腸病毒病症狀，請依「臺北市托嬰中心腸病毒通報及停托作業規定」第3條規定請家長帶就托兒童就醫，並停托7至14天，同時應告知其他兒童家長提高警覺，及進行班級或全機構消毒工作，以防群聚感染。七、若需瞭解腸病毒防疫相關知識可至本府衛生局(http：//www.health.gov.tw/)/╱主題專區╱疾病防治╱腸病毒疫情資訊；或可撥打衛生福利部疾病管制署免付費疫情通報及諮詢專線1922或本府衛生局防疫專線02-23753782。
- - 目前臺北市是否有辦理「服務業營運及投資概況調查」？其調查期間、對象及目的為何？
  - 一、「服務業營運及投資概況調查」係由行政院主計總處主辦，各縣市政府為協辦機關，負責辦理轄區內之調查業務，並採實地訪問調查。二、調查期間自105年7月4日起至8月5日止。凡從事「資訊及通訊傳播業」、「不動產業」、「專業、科學及技術服務業」、「支援服務業」、「教育服務業」、「醫療保健及社會工作服務業」、「藝術、娛樂及休閒服務業」及「其他服務業」之企業單位為對象。三、該調查主要目的係鑒於服務業發展多元且快速，重要性不斷提升，各界對於相關統計應用日廣，需求益殷，為整合及補強現行服務業統計，提升其完整性及運用效益。
