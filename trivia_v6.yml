- - 2017臺北世大運開幕式戶外轉播何時舉辦？
  - 2017臺北世大運開幕式戶外轉播暨賽會期間光雕投影秀於2017年8月19日(星期六)，在臺北市政府前市民廣場舉行。活動詳情可上活動官網(http：// lightshow.2017.taipei )查詢。另外，活動時間，倘遇雨或其他不可抗力因素，主辦單位保有隨時修改、暫停或終止本活動之權利，如有未盡事宜，也請民眾隨時上「2017臺北世大運臉書」，開幕式戶外轉播活動頁(https：//goo.gl/W3tx2U)查詢最新消息。
- - 2017臺北世大運開幕式戶外轉播活動特色及如何參與?
  - (一)戶外轉播活動： 106年8月19日(六)下午3時至晚上10時。1.下午3時起「運動同樂會活動」，有時下最夯的「足撞球」與「上頭排球」讓民眾和好友一起組隊，與主持群和運動甜心加油團進行對抗賽。2.拍照打卡闖關區，有韻律操杯緣子挑戰賽，模仿扭蛋機遊戲，闖關成功就可獲得限量熊讚加油扇。3.晚上6時起，現場所設置大型螢幕同步轉播2017臺北世大運開幕式現場畫面。活動周邊更設有胖卡美食餐車，讓大家可以邊看邊享用美食。4.超強主持團隊無尊、小豬黃沐妍及楊昇達要帶領現場民眾一起HIGH。5.藝人輪番現場接力演場，有偶像歌手陳彥允、實力派唱將林芯儀、曾沛慈及李千娜，並開放現場民眾上台與藝人們進行世大運運動項目趣味競賽，跟藝人近距離互動，還有機會得到特別準備的小禮物喔！(二)光雕投影秀暨互動手遊：106年8月20日(日)至30日(三)，每天晚上6時30分至10時。1.活動期間每半點光雕秀結束時，牆上將出現該場遊戲專屬QR CODE，只要掃描QR Coad就可參加挑戰賽。(每日每種QR CODE不同，須至現場掃QR CODE方能參加遊戲)2.遊戲結束後將個人成績分享至個人Facebook並設定貼文公開，才可進入英雄榜，挑戰最終冠軍！3.每種遊戲將有5分鐘時間挑戰，時間內可重複挑戰挑選個人最佳成績分享至個人FB後進入英雄榜！4.英雄榜將於每日每種遊戲結束後，立刻公告每日累積排名5.活動最終日8/30(三)當日晚上10點最終場光雕秀結束後，將公佈三種遊戲最終冠軍(該種遊戲分數最高的玩家)，就可以得到遨遊義大利來回機票乙張！活動詳情可上活動官網(http：// lightshow.2017.taipei)查詢。
- - 2017臺北世大運開幕式戶外轉播活動詳細資訊，何處可獲取?
