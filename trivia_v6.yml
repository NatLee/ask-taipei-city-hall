- - 文山親子館開放時間、服務內容、服務對象、預約方式?
  - 一、開放時間：週二至週五9：30~12：00、14：00~17：00，週六及週日9：30~11：00、13：00~14：30、15：30~17：00。每週一及經政府公告之放假日為休館日。二、設施及活動規劃：感覺統合區、手創區、建構區、舞台扮演區、大型體能活動區、繪本區、展示區及多功能教室。三、服務對象：6歲以下兒童及其照顧者。四、使用文山親子館是不需要付費的喔！但為了控管使用品質，每場次限制60對親子使用(35對網路預約，25對現場排隊)。
- - 信義親子館地點及電話為何？
  - 地址：臺北市信義區松勤街50號(信義公民會館A館)電話：(02) 2720-2555。
- - 友善托育補助之申請資格及條件為何？
  - 2歲以下兒童就托於本市且收費在公告金額以下之合作登記托育人員（保母）及合作私立托嬰中心。(一)補助對象：1.兒童之父母雙方或單親一方或行使負擔兒童權利義務一方或監護人（以下簡稱申請人）皆就業，或父母一方就業、另一方因中、重度身心障礙、或服義務役、或處一年以上之徒刑或受拘束人身自由之保安處分一年以上且執行中，致無法自行照顧家中未滿二歲兒童，而需送請托育人員照顧者，且申請人經稅捐稽徵機關核定之最近一年綜合所得總額合計未達申報標準或綜合所得稅稅率未達20%者。2.戶籍登記為同一母親或父親，有三位以上子女之家庭，其未滿二歲兒童需送請托育人員照顧者。(二)申請資格：1.申請時兒童未滿二歲。2.兒童及申請人設籍並實際居住本市。3.兒童未經政府公費安置收容。
- - 只要2歲以下兒童符合申請資格，就有加碼的友善托育補助嗎？
  - 除了申請人及兒童須符合父母雙方或單親之一方皆就業、稅率未達20%且以上3方皆須符設籍並實住本市條件外，送托至加入本市合作托育人員（保母）或合作托嬰中心才得享有本補助。
- - 105年度起開辦的友善托育補助金額標準為多少？
  - 比照衛生福利部「就業者家庭部分托育費用補助」，給予相對一倍之加額補助。依各類家庭條件、送托方式及托育人員資格，補助標準如下（本項補助超過半個月、不滿1個月者以1個月計，未達半個月者以半個月計）：1.合作托育人員資格為「幼保相關科系」或「結訓保母」者：(1)一般家庭：每名兒童每月最高2,000元。(2)弱勢家庭：中低收入戶每名兒童每月最高3,000元；低收入戶、家有未滿2歲之發展遲緩或身心障礙幼兒之家庭、特殊境遇家庭、高風險家庭每名幼兒每月最高4,000元。2.合作托育人員資格為「證照保母」或就托於合作托嬰中心者：(1)一般家庭：每名兒童每月最高3,000元。(2)弱勢家庭：中低收入戶每名兒童每月最高4,000元；低收入戶、家有未滿2歲之發展遲緩或身心障礙幼兒之家庭、特殊境遇家庭、高風險家庭每名兒童每月最高5,000元。
- - 友善托育補助之合作托育人員公告收費標準是多少？
  - 本市公告收費金額之應收項目含托育費，得收項目含副食品費、延長托育費及節慶獎金，詳列如下：(一)應收項目：1.托育費：依行政區及時數（日托10小時、11小時、12小時及全日托24小時），定價金額如附表。(二)得收項目：1.副食品：全區每月1,000元。2.延長托育費用：以每小時100元為限。3.節慶獎金或禮品：如收取獎金，年終獎金最多以1個月為限，中秋及端午收取金額不超過2,000元。
- - 友善托育補助之合作托嬰中心公告收費標準是多少？
  - 詳附表(臺北市合作托嬰中心及合作托育人員收費項目金額公告標準表)
- - 申請友善托育補助及加入合作托育人員（保母）或托嬰中心何時可以提出，是否開辦之初有作業緩衝期？
  - 本項新開辦之補助，特訂定作業緩衝期，自105年起托育人員得透過所屬居家托育服務中心(原社區保母系統)向社會局提出申請，托嬰中心直接向社會局提出申請（申請補助亦同），以上經審核通過者，合作及補助資格生效日如下：(一)於105年12月31日前提出申請並經審核通過者，合作及補助資格至長溯自105年1月1日起生效。(二)於106年1月1日後提出申請並經審核通過者，合作及補助資格自申請日（郵戳日期或收件日）起生效。
- - 友善托育補助之合作托育人員收費金額是如何訂出來？
  - 合作托育人員收費金額之訂定，係透過各居家托育服務中心(原社區保母系統)回收托育契約書將保母收費調查資料逐一建檔，經統計有效樣本數4,092，計算收費第一分位數、第二分位數（中位數）、第三分位數、平均數及眾數等數據，提送本市保母托育制度管理委員會審議，決議以收費中位數（Q2：該樣本中所有數值由小到大排列後第50%的數字）為審查基準，避免受極端值影響，經統計中位數涵蓋率達約75%，反映大部分收費水平價格。至於除托育費外應收項目之副食品金額以每月1,000元為限，得收項目為延長托育費用及節慶獎金獎品，延長托育費用建議收費金額以每小時100元為限，節慶獎金或禮品，如收取禮金，建議中秋及端午獎金收取金額不得超過2,000元，年終獎金最多以1個月為限。係以其他縣市經驗為例，經本市保母托育制度管理委員會提議，蒐集應收及得收項目之收費型態及金額，經統計後，以中位數為審查基準，故訂定上開收費金額。本項合作機制非強迫性，托育人員得衡量自身意願決定是否加入。
- - 友善托育補助之保母收費調查表分日托10時、11時、12時及全日托24小時，托育時數如何認定？
  - 1.半日托：6小時以內，不符友善托育補助之托育型態。2.日/夜托：超過6小時至10小時以內，以10小時計。3.日/夜托：超過10小時至11小時以內，以11小時計。4.日/夜托：超過11小時至16小時以內，以12小時計。5.全日托：超過16小時至24小時以內，以24小時計。
- - 友善托育補助之合作托嬰中心收費金額是如何訂出來的？
  - 透過本市各私立托嬰中心收費概況調查全量統計，並召開托嬰中心聯繫會議討論，決議以收費中位數（Q2：該樣本中所有數值由小到大排列後第50%的數字）為審查基準，避免受極端值影響，經統計中位數涵蓋率達約70.4%，反映大部分收費水平價格。故訂出各行政區之收費審查標準。
- - 友善托育補助申請人不得指定托育人員（保母）一對一收托，但小孩有特殊狀況需要保母專心照顧是否可通融？又如家長願配合不指定一對一收托，是保母自身因素無法收托第二位兒童有關係嗎？
  - (一)原則上申請人不得指定托育人員一對一收托，但發展遲緩、身心障礙、罕見疾病或有其他特殊狀況需一對一照顧之兒童不在此限。(二)此項規範只針對家長，如保母自身因素或媒合第二位以上兒童托育不適應等非可歸責於家長之情形，不受影響。
- - 友善托育補助之申請表如何下載或索取？
  - 可至本府社會局網站查詢(網址：http：//dosw.gov.taipei，路徑：首頁/嬰幼兒照顧服務/友善托育補助)，或向本市各行政區居家托育服務中心(原社區保母系統)、私立托嬰中心索取或洽詢臺北市政府社會局婦幼科(電話：1999轉1622~1625)。
- - 友善托育補助之合作意向書如何下載或索取？
  - 合作托育人員或合作托嬰中心之合作意向書皆可至本府社會局網站下載(網址：http：//dosw.gov.taipei，路徑：首頁/嬰幼兒照顧服務/友善托育補助)，托育人員可向本市各行政區居家托育服務中心(原社區保母系統)，私立托嬰中心可洽詢臺北市政府社會局婦幼科(電話：1999轉1622~1625)。
- - 信義親子館開放時間、服務內容、服務對象、預約方式?
  - 一、開放時間：週二至週五9：30~12：00、14：00~17：00，週六及週日9：30~11：00、13：00~14：30、15：30~17：00。每週一及經政府公告之放假日為休館日。二、設施及活動規劃：以「家」為設計理念，在充滿眷村文化風情的四四南村，為孩子打造一家親、傳承創新、自然環保及充滿溫度的親子館。館內規劃「0-2歲嬰幼兒專區」與「0-6歲混齡主題區」，鼓勵親子回歸「自然」，發揮想像力，玩出創造力，塑造難忘童年回憶。三、服務對象：6歲以下兒童及其照顧者。四、使用親子館是不需要付費的喔！但為了控管使用品質，每場次限制30對親子使用(20對網路預約，10對現場排隊)。
- - 台北探索館導覽小志工研習營活動的主辦單位是哪裡?怎麼報名呢？
  - 本活動由臺北市政府觀光傳播局台北探索館主辦，採『個人網路報名』，報名網址：https：//goo.gl/rQWV8S
- - 台北探索館導覽小志工研習營報名時間是什麼時候呢？
  - 106年7月24日早上10點∼106年7月28日下午5點，各梯次額滿截止。每人限報一梯次。
