- - 空班日出勤，是否計入每月46小時加班上限？
  - 依勞動部105年06月21日勞動條 3字第1050131243 號令，「雇主延長勞工工作之時間」，指勞工每日工作時間超過8小時或每週工作總時數超過40小時之部分。但依本法第30條第2項、第3項或第30條之1第1項第1款變更工作時間者，為超過變更後工作時間之部分。故勞工於空班日出勤，若出勤時數具上述性質，應計入每月46小時加班上限。
- - 因應一例一休會增加加班費，擬減少本薪，是否可重談薪資？
  - 薪資是屬於勞動契約的一環，若有任何一方想變更薪資條件，必須經由雙方同意後始生效。另應注意與勞工約定薪資是否低於基本工資規定。
- - 勞工都不排特休或於連假前後，再請特休變成連續休假15天要怎麼辦？
  - 依勞動基準法第38條規定，特別休假期日，由勞工排定之。但雇主基於企業經營上之急迫需求或勞工因個人因素，得與他方協商調整。另外，勞工之特別休假，因年度終結或契約終止而未休之日數，雇主應發給工資。
- - 勞工週日出勤12小時，能否把幾小時之出勤移到週一，減少週一需出勤時間，以節省加班費？
  - 若勞工每日正常工時原為8小時，餐飲業之事業單位得依勞動基準法第30條之1規定，經工會同意，如事業單位無工會者，經勞資會議同意後，可事先調整勞工週日之正常工作時間最長為10小時，週一為6小時，調整後週日最多只可再增加2小時延長工時(仍須符合單日工時上限12小時限制)，另調整後若使勞工於週一出勤，逾6小時以上即需視為加班。
- - 勞資會議採用變形工時後，需一次排好12個月的班表嗎？
  - 若事業單位依勞動基準法第30條之1規定採四週變形工時，需依勞動基準法施行細則第 20 條規定於變更勞工正常工作時間、例假或延長工作時間時，雇主應即公告周知。
- - 因一、二月是旺季，七、八月是淡季，能否把一、二月的國定假日調移到七、八月休？
  - 勞動基準法第37條規定修正後，國定假日多定於一、二月，為配合餐飲業經營型態，事業單位可徵得勞工同意後，協議調移國定假日休假。
- - 班表排好後，勞工臨時要以特休請假，不以事假請，應怎麼辦？
  - 新法修正後，特別休假日期固然由勞工排定，但公司仍得制訂請假規範。建議可於勞資會議或與工會協商後，將相關請假規範明訂在工作規則中，以避免爭議。
- - 若勞工不適任，能否薪水不動但調降職務？
  - 雇主調動勞工工作，雖未變動薪資待遇，仍應符合勞動基準法第10之1條所定之規範，仍須參酌不得有不當動機，調動內容尚須勞工體能技術所能負荷，地點是否過遠及有無考量勞工及其家庭之生活利益。
- - 原本排定週三、週四不出勤，員工臨時有事欲週四、週五不出勤，薪資應如何計算？需調整後續例假日、休息日的安排嗎？
  - 若班表排定後欲變更，勞資雙方要求變更之一方應徵求對方同意，故在未經勞資協商之下，雇主得要求勞工依原定班表出勤，勞工若不願出勤，亦應依公司請假規範以事、特別休假方式處理。
- - 加班費可否以整年度結算？
  - 加班費屬工資之一部分，應依照勞動基準法第23條規定，每月至少定期發給二次，或按勞資雙方約定給付。此外，並應提供工資各項目計算方式明細。
- - 因公司要求勞工早退, 勞工於回家途中受傷, 是否為職災?
  - 勞工上下班必經途中之意外事故，應包括交通事故及其他偶發意外事故，此類事故非出於勞工私人行為而違反法令者（如：無照駕駛、闖紅燈、酒駕等），應屬職業災害，但仍應就個案發生之事實情況予以認定。
- - 派勞工去當日來回之出差, 其工時如何計算?
  - 若員工出差當日需進公司上班後再前往出差，返回後仍需再進公司上班，則往返兩地之交通時間須計為工作時間。
- - 颱風天出勤,工時超過8小時的部分應如何計算加班費？
  - 與平日工作日相同，雇主延長勞工工作時間在2小時以內者，按平日每小時工資額加給三分之一。再延長工作時間在2小時以內者，按平日每小時工資額加給三分之二以上。
- - 勞工因故需要早退1小時, 可否將這1小時移至隔天, 隔天工時變為8+1小時？
  - 因勞務不可儲存，所以不可移至隔天變為8+1小時，這部份建議以請假方式解決。
- - 勞工於國定假日出勤2小時, 其加班費如何計算？
  - 若為月薪制人員，雇主經徵得勞工同意於國定出勤者，出勤時間在8小時以內(含8小時)，皆給付1日工資之加班費。若為時薪制人員，出勤時間在8小時以內(含8小時)，依出勤時數加倍給予薪資。如：時薪150元，出勤2小時則薪資為 2小時時薪150元2=600元。
- - 時薪人員之特休假該如何計算？
  - 時薪制勞工工作滿半年依勞動基準法即享有3日特別休假，惟1日特別休假應以幾小時計算，可由勞資雙方協商，按其平均出勤時數計算。
- - 資深時薪人員, 當公司不再雇用, 是否需給資遣費？
  - 即使是時薪人員，公司不再僱用時，仍應發給資遣費。
- - 如勞工遲到該如何計算須扣工資？
  - 勞工上班遲到之時間，因未提供勞務，雇主得就遲到時間比例不給付遲到時間工資。如：時薪150元之人員，遲到20分鐘，可不給付15020/60=50元。
- - 每日固定加班2小時, 如勞工遲到2小時, 但當日仍上足8小時, 可否因其遲到而扣薪？
  - 勞工遲到的時段，可採遲到時間比例不給付遲到時間工資，但於計算該日延長工時時數時，遲到或請事假的時段仍應與該日提供勞務時數合併計算，超出8小時部分則需給予加班費。
- - 員工不配合打卡, 雇主可做何措施？
  - 依照勞動基準法第30條第5項與第6項規定，雇主應置備勞工出勤紀錄且逐日記載勞工出勤情形至分鐘為止。建議可訂定工作規則，寫明員工上下班時間需依規定記錄出勤，或由雇主或委由其他員工代為記錄。
- - 臺北市新移民有哪些福利服務？
  - 新移民照顧輔導工作由各局處共同提供，本局提供社會支持，與提供符合特殊境遇之新移民婦女經濟補助等；跨文化生活適應由民政局協助；語言學習問題由教育局協助；就業輔導及職訓由勞動局提協助；優生保健由衛生局協助。社會局新移民服務內容包括：1、未取得國籍前，符合特殊境遇家庭服務款項之新移民婦女經濟補助。2、臺北市新移民婦女暨家庭服務中心提供新移民婦女個案輔導、法律諮詢、心理輔導、支持成長性方案活動等。電話：2558-0133。3、臺北市新移民社區關懷據點：提供主動關懷訪視服務，提供新移民家庭福利資源訊息、情緒支持等服務，共設置4區，相關資訊如下：(1)臺北市西區新移民社區關懷據點(中正、萬華、大同)，電話：2361-6577。(2)臺北市北區新移民社區關懷據點(北投、士林、中山)，電話：2504-0399。(3)臺北市南區新移民社區關懷據點(文山、大安、信義)，電話：2931-2166。(4)臺北市東區新移民社區關懷據點(南港、松山、內湖)，電話：2631-7059。洽詢單位：社會局婦幼科聯絡人：熊小姐聯絡電話：1999轉1981
- - 新移民有哪些經濟補助？
  - 本市提供弱勢新移民的經濟補助有兩種：特殊境遇家庭扶助及設籍前新住民社會救助補助。洽辦單位：臺北市政府社會局婦女福利及兒童托育科，電話1999轉6969-6971洽詢單位：社會局婦幼科聯絡人：熊小姐聯絡電話：1999轉1981
- - 設籍前新住民社會救助的補助對象為何？
  - 本市列冊輔導之低收入戶、中低收入戶，其配偶為設籍前新住民者，其所得未超過最低生活費，且最近一年居住國內超過一百八十三日者。所稱設籍前新住民係指：(1)婚姻關係存續中之設籍前新住民；(2)喪偶之設籍前新住民；(3)離婚且單獨取得子女監護權之設籍前新住民。洽詢單位：社會局婦幼科聯絡人：熊小姐聯絡電話：1999轉1981
- - 外籍配偶社會救助的補助項目有哪些？
  - 一、生活扶助：1.低收入戶0類家戶：每月1萬5,544元(全戶3口人以上，申請人按月補助1萬3,800元)。2.低收入戶1類家戶：每月1萬4,000元。二、醫療補助：1.低收入戶：於全民健康保險特約醫療院所，以健保身分就醫者，其參加全民健康保險自行負擔之醫療費用扣除不補助項目後，全額補助。2.中低收入戶：於全民健康保險特約醫療院所，以健保身分就醫者，扣除2萬元應自付費用及不補助項目後，補助餘額80％。每人每年補助以30萬元為限。3.不補助項目：義肢、義眼、義齒、配鏡、鑲牙、整容、病人運輸、指定醫師、特別護士、指定藥品材料費、掛號費、疾病預防、及非因疾病而施行預防之手術、節育結紮、住院期間之看護費、指定病房費及其他與醫療無直接相關之項目。4.病房費補助標準：如住院期間確因醫療院所健保病房額滿，而須入住差額病房接受治療，每次住院病房費用補助：住院15日內覈實補助，但補助金額上限為每日1,600元；第16日起至第45日，每日補助上限為800元；第46日以後則不予補助。每人每年病房費補助以15萬元為限。5.未竟事宜，依社會救助法、社會救助法施行細則及臺北市低收入戶生活扶助及低收入戶、中低收入戶調查及審核作業規定辦理。三、急難救助：   1.符合下列條件之一者：(1) 戶內人口遭受意外傷害或罹患重病，致生活陷於困境。(2) 負家庭主要生計責任者，失業、失蹤、應徵集召集入營服兵役或替代役現役、入獄服刑、因案羈押、依法拘禁或其他原因，無法工作致生活陷於困境。(3) 財產或存款帳戶因遭強制執行、凍結或其他原因未能及時運用，致生活陷於困境。(4) 已申請福利項目或保險給付，尚未核准期間生活陷於困境。(5) 其他因遭遇重大變故，致生活陷於困境，經本局或本局委託單位訪視評估，認定確有救助需要。2.得依社會救助法第21條第2款至6款申請急難救助者，優先以家戶名義提出本市急難救助金申請，同一戶已獲補助者，不予重複補助。且以每兩個月申請一次為限。3.所列事由，每次申請依其事由擇一項核發為限。洽詢單位：社會局婦幼科聯絡人：熊小姐聯絡電話：1999轉1981
- - 設籍前外籍配偶社會救助向哪裡申請？
  - 填寫申請表單後，逕寄送本局婦女福利及兒童托育科，地址：臺北市信義區信義路5段15號5樓如有相關疑問，可就近向各區公所、婦女中心、社福中心洽詢。洽詢單位：社會局婦幼科聯絡人：熊小姐聯絡電話：1999轉1981
- - 申請設籍前新住民社會救助是否會影響原本全戶的(中)低收入戶資格？
  - 設籍前新住民社會救助係依「新住民發展基金補助經費申請補助項目及基準」第三點「設籍前新住民社會救助計畫」辦理，是為協助臺北市低收入戶及中低收入戶內設籍前新住民之相關社會救助福利補助，提供設籍前新住民家庭經濟扶助措施，以保障設籍前新住民之經濟安全。故申請本補助不會影響該戶(中)低收入戶資格。洽詢單位：社會局婦幼科聯絡人：熊小姐聯絡電話：1999轉1981
- - 我是大陸（或外籍）配偶，目前還沒有取得身分證，可以申請特殊境遇家庭扶助嗎？
  - 與本市市民辦理結婚登記之新移民〈大陸或外籍配偶〉，於尚未取得本國籍前，如遭逢特殊境遇情形，得不受設籍臺北市之限制。單位：社會局婦幼科聯絡人：熊小姐聯絡電話：1999轉1981
- - 申請警察刑事紀錄證明(良民證)需要具備哪些文件？到哪裡申請？
  - 申請人應備證件 (一)臨櫃申辦：1.填妥之申請書1份。2.應備證明文件：(1)本國人：新式國民身分證正本或戶口名簿正本(持戶口名簿辦理者需另出示有相片之證件)。(2)大陸港澳地區居民：中華民國臺灣地區居留證或內政部入出國及移民署核發之其他相關證件正本。(3)外國人：護照或外僑居留證正本各1份。(4)正本驗畢歸還，需加註英文姓名者，請另檢附護照基本資料頁正本或影本。3.證書費：每份新臺幣100元，可用悠遊卡或悠遊聯名卡付費。4.非本人申請者，請另檢附申請人印章或經申請人簽名或蓋章之委託書1份(申請書上備有委託書欄位)，及受委託人身分證明文件正本。(二)郵寄申辦： 1.填妥之申請書1份。2.應備證明文件：(1)國內申請：A.本國人：新式國民身分證正本或戶口名簿正本(持戶口名簿辦理者需另出示有相片之證件) (身份證正本或戶口名簿正本隨證明書寄還)。B.大陸港澳地區居民或外國人：與臨櫃申辦同。（正本隨證明書寄還）(2)國外申請：經我國駐外館處或財團法人海峽交流基金會或相關公證單位驗證、公證或認證之護照或外僑居留證影本。3.證書費：(1)國內申請：每份新臺幣100元，可報值郵寄至本局，或至郵局購買匯票，戶名為臺北市政府警察局。(2)國外申請：每份工本費美金7元（現金），已包含普通郵件郵資（港澳地區每份美金6元）或新臺幣200元（均限紙鈔，已含國際航空掛號郵資）。4.已填妥收件人姓名、地址及電話之回郵掛號信封1只（國外申請者免附回郵郵資）。5.將上列文件以掛號信件郵寄至本局：(1)國內申請：A.收件者：臺北市政府警察局外事科(申請警察刑事紀錄證明)B.地址：10042 臺北市中正區延平南路96號。(2)國外申請：A.收件者：Foreign Affairs Division, Taipei City Police Department。B.地址：No.96, YanPing S. Rd., Zhongzheng Dist., Taipei City 10042, Taiwan (R.O.C.)。(三)傳真申辦：1.填妥之申請書1份。2.應備證明文件同臨櫃申辦。3.將上列文件傳真至本局，傳真：(02)2381-7487，並來電(02)2381-7494或(02)2375-2105確認；須來電確認無誤後，始視正式收件。4.於辦理完成後，須至本局領件，應備資料與臨櫃申辦相同。(四)網路申辦：1.警政署申辦系統：網址：http：//eli.npa.gov.tw/E7WebO/index01.jsp2.臺北市民e點通申辦系統：網址：http：//eservice.mytaipei.tw/hypage.cgi?HYPAGE=form.htm&s_uid=0190103.於辦理完成後，須至本局領件，應備資料與臨櫃申辦相同。(五)手機APP申辦：1.使用手機下載「北市警政」APP申辦。2.於辦理完成後，須至本局領件，應備資料與臨櫃申辦相同。(六)7-11超商申辦：民眾至7-11超商申辦警察刑事紀錄證明，依照i-bon機指示輸入手機及身分證字號後列印申請書，於填寫完畢後掃描回傳。要請店員留意是否有掃描回傳成功。繳費方式(一)網路繳款：警政署自然人憑證網路繳費(二)非網路繳款：臨櫃繳費、支票或匯票處理時限：(1)臨櫃申辦(通案性)：2小時(因臨櫃申辦處理時限為2小時，欲當日領件者，應於最後受理時間15時前臨櫃申辦(週三17時至20時僅提供領件及申辦收件服務，欲當日領件者，請於17時前臨櫃申辦)，15時後臨櫃申辦者，本局提供郵寄到府服務。如有相關問題，請於上班時間來電洽詢本局外事科(02-23817494、02-23752105)，將由專人為您服務。)(2)其他國內申辦方式：4日□全程式□非全程式█網路預約(3)須會外機關審查(個案性)(各級法院)(各級軍法機關)：無(4)須層轉核釋：無(https：//www.e-services.taipei.gov.tw/hypage.exe?HYPAGE=form.htm&s_uid=019010)承辦單位：1.臺北市政府警察局外事科(電話：02-23817494、02-23752105，傳真：02-23817487)。2.受理地址：臺北市中正區延平南路96號(位中華路及武昌街口，捷運西門站5號出口步行約5分鐘)。3.受理時間：週一至週五8時30分至17時(中午不休息)，週三延長至20時(國定、例假日除外)。備註：1.於臺北市民e點通申辦「警察刑事記錄證明」，領件地點在臺北市政府警察局服務中心。2.網路(臺北市民e點通)或超商申辦者，請於申辦後翌日起以帳號或電詢本局查詢取件期限，並於期限內攜帶應備文件至本局服務中心櫃檯驗證及繳費領件，逾期作廢。3.申請人如經法院或軍法機關為刑事判決確定、無罪判決、曾獲減刑宣告者，請檢附該等司法、軍法判決書，以縮短查詢核發時間。4.需英文姓名者，英文姓名欄請填與護照相同之英文姓名。5.7-11超商申請須至超商依照i-bon機指示輸入手機及身分證字號後列印申請書，於填寫完畢後掃描回傳。
- - 民眾在計程車上遺失物品該如何協尋？
  - 一、臺北市政府警察局交通警察大隊服務內容及流程：1.申請方式：電話申請或親自到場(可委託他人辦理)。2.承辦單位：交通警察大隊綜合組。3.連絡電話：02-23116409(24小時)，該專線下班時間亦可撥打，並會自動轉接勤務指揮中心協助。4.辦理流程：(1)受理乘客乘坐計程車遺失財物之電話或親自報案。(2)填寫受理報案紀錄表。(3)以乘客提供之線索查詢駕駛人姓名、車號或車行名稱。(4)連絡駕駛人或車行協尋失物。(5)如有尋獲則代連絡歸還手續並具領結案，未尋獲將查處情形回復當事人。　　如仍有疑問，上班時間請撥電話  (02)23116409，由專人為您服務。二、警政署警廣交通網廣播協尋：1.上網登錄協尋，網址：http：//rtr.pbs.gov.tw/pbsmgt/Pickup.jsp(路徑為『中華民國內政部警政署警察廣播電臺』上方（橘底黑字列）左邊數來第五個『協尋遺失物』)2.廣播協尋：答：北部地區民眾可撥打02-23880066失物協尋專線，向本臺服務中心查尋及登錄遺失物品，經本臺查核登錄系統後於節目中廣播協尋。
- - 托嬰中心腸病毒停課標準？
  - 一、警訊期狀態為「流行警訊期間」，托嬰中心停托隔離措施：(一)七日內同一班級有二名以上（含二名）兒童經診斷為手足口症時，該班應即停托。(二)衛生福利部疾病管制署公布當年度發生腸病毒七十一型流行疫情：當機構內同一班在一週內有二名以上(含二名)兒童經醫師診斷為腸病毒感染時，該班應即停托。(三)須停托症狀包含下列情形之一： 1、「腸病毒重症確診」或「腸病毒七十一型」一名。2、「手足口症」或「?疹性咽峽炎」等腸病毒病症狀合計達二名以上。    若為混齡教學，其他參與之班級視為同一班級，須同時停托。二、「本市出現本土性腸病毒重症確定病例」，托嬰中心停托隔離措施：（一）班上出現一名經確定診斷為腸病毒七十一型個案，該班即需停托。（二）須停托症狀包含下列情形之一：1.「腸病毒重症確診」或「腸病毒七十一型」一名。2.「手足口症」或「?疹性咽峽炎」等腸病毒病症狀合計達二名以上。    若為混齡教學，其他參與之班級視為同一班級，須同時停托。三、「本市腸病毒重症流行」，托嬰中心停托隔離措施：（一）一班只要出現一名手足口症時，立即停托。（二）須停托情況包含下列情形之一：1.「腸病毒重症確診」或「腸病毒七十一型」一名。2.「手足口症」一名。3.「?疹性咽峽炎」二名。    若為混齡教學，其他參與之班級視為同一班級,須同時停托。四、非流行警訊期間，托嬰中心停托隔離措施：(一)有一名以上（含一名）兒童疑似感染腸病毒手足口症時，得召集該班級托育人員及家長成立危機處理小組,並應依本作業規定第三點進行處理措施。(二)當年度無腸病毒七十一型流行疫情：機構所在之行政區，若當年度曾由衛生福利部疾病管制署公布有「腸病毒七十一型檢驗陽性個案」或「年齡在三個月以上的腸病毒感染併發重症個案」，當機構內同一班在一週內有二名以上(含二名)兒童經醫師診斷為腸病毒感染時，該班應停托。(三) 所謂腸病毒係包含手足口症或?疹性咽峽炎等腸病毒病症。五、如發現疑似傳染病個案，請機構務必於發現時48小時內至「臺北市學校暨機關傳染病通報系統」通報，以免因未即時通報遭本府衛生局裁罰。六、另請各機構於兒童入中心時，量測體溫及檢查手足、口腔是否白點及破洞，如發現疑似有腸病毒病症狀，請依「臺北市托嬰中心腸病毒通報及停托作業規定」第3條規定請家長帶就托兒童就醫，並停托7至14天，同時應告知其他兒童家長提高警覺，及進行班級或全機構消毒工作，以防群聚感染。七、若需瞭解腸病毒防疫相關知識可至本府衛生局(http：//www.health.gov.tw/)/╱主題專區╱疾病防治╱腸病毒疫情資訊；或可撥打衛生福利部疾病管制署免付費疫情通報及諮詢專線1922或本府衛生局防疫專線02-23753782。
- - 哪裡有腸病毒相關問答？
  - 腸病毒相關問答可至社會局網站/ 嬰幼兒照顧服務/傳染病防治專區/請托育機構加強腸病毒衛教宣導及防治工作，並轉知家長配合辦理 項下查詢。
- - 台北捷運商品館位置/營業時間/聯絡電話?
  - 台北捷運商品館位置/營業時間/聯絡電話：台北捷運商品館，位於捷運臺北車站地下1樓近M3出口處，營業時間：每日10：00-22：00，聯絡電話：02-23811331。
- - 2017臺北世大運隨團志工有分哪幾種語言?
  - 隨團志工語言類別有：英文、西文、法文、德文、俄文、日文、韓文、土文、阿文及義文。
- - 如何申請舊衣回收？
  - 1、舊衣回收業務的申請、審核及執行查核的主管機關為本府環境保護局，社會局則協助身心障礙福利團體的立案資格認定。依「臺北市社會福利團體從事舊衣收集再利用管理要點」所稱之社會福利團體為經本局核准設立之財團法人社會福利機構或身心障礙團體。2、有關申請資格問題，申請單位屬身心障礙機構洽社會局身心障礙者福利科-市話或手機直撥1999轉分機1615，屬身心障礙福利團體者則請洽社會局人民團體科-市話或手機直撥1999轉分機6957；另有關舊衣回收箱之設置、管理、會勘等問題，則請撥環保局-市話或手機直撥1999轉分機7270。
- - （一般民眾）要詢問或求助家庭暴力或性侵害事件
  - 若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供諮詢服務。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。
- - （機關、團體、學校）要通報或諮詢家庭暴力或性侵害案件
  - 通報或諮詢家暴或性侵害事件，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供諮詢服務。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。遇有緊急人生安全情況，請先撥打110報案，由警方立即前往救援。
- - 如未成年之兒童、少年、身心障礙少年或無父母、父母失聯之兒少兒童未受適當養育照顧(如長期未進食)，請問如何處理？
  - 若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。
- - 世大運選手村主訊息中心是否有提供語言協助?
  - 有，FISU官方語言：法文、英文及西文。
- - 「性侵害被害人一站式服務」的服務據點有哪些?
  - 一、臺北市現有六處據點提供服務：臺北市立聯合醫院（忠孝院區、陽明院區、婦幼院區、仁愛院區、中興院區）以及臺北市立萬芳醫院。二、民眾如遭性侵害，有驗傷需求者，可直接至服務據點，由本市服務團隊提供驗傷及製作筆錄等相關協助，如有相關問題可逕洽各一站式服務據點或直接撥打家防中心電話詢問業務所屬承辦人陳小姐(02-2361-5295轉6706)。
- - 何謂以工代賑?
  - 以工代賑係本府為協助經濟弱勢市民自立，依社會救助法、社會救助法施行細則、臺北市市民以工代賑輔導自治條例等相關規定辦理以工代賑工作。
- - 申請以工代賑臨時工的資格、應備文件及向誰提出申請？
  - 1、本市列冊低收入戶或中低收入戶。2、申請表2份、申請人身分證正反面影本1份、照片2張、台北富邦商業銀行存摺封面影本1份、低收入戶或中低收入戶卡影本1份。3、戶籍所在地區公所社會課。
- - 以工代賑臨時工的工作內容？
  - 市區內環境清潔維護、市立福利機構院民患者照顧等。
- - 臺北市低收入戶及受保護安置市民喪葬補助費申請資格？
  - 1.協助低收入戶死亡者完成殮葬程序之親屬。2.協助無親屬予以殮葬之低收入戶死亡者完成殮葬程序之人。3.協助非核列低收入戶且無親屬予以殮葬之受保護安置市民死亡者完成殮葬程序之安置機構。
- - 2017臺北世界大學運動會之場館及選手村是否禁菸？違規吸菸者有何罰則？請問世大運場館外有設吸菸區嗎？
  - 一、依據菸害防制法第15條、第16條及第17條規定，2017臺北世界大學運動會之室內、外場館，及選手村之室內、外場所全面禁止吸菸。二、依據菸害防制法第31條第1項規定，違規吸菸者，將處新臺幣2,000元以上1萬元以下罰鍰。三、已規劃於14座臺北世界大學運動會場館外之周邊區域，設置15個戶外定點吸菸區。吸菸區數量請參考「場館外設置戶外定點吸菸區一覽表」。
- - 臺北市低收入戶及受保護安置市民喪葬補助費申請單位？
  - 1.協助低收入戶死亡者完成殮葬程序之親屬，向死亡者之戶籍所在地區公所申請，經審查符合資 格，核撥新臺幣二萬三千元。2.協助無親屬予以殮葬之低收入戶死亡者完成殮葬程序之人，向本市殯葬管理處申請，經審查符合資格，核撥新臺幣一萬五千元。3.協助非核列低收入戶且無親屬予以殮葬之受保護安置市民死亡者完成殮葬程序之安置機構，向本府社會局申請，經審查符合資格，核撥新臺幣二萬三千元。
- - 申請借住平價住宅資格為何?有哪些平價住宅可供申請?如何申請？
  - 一、本市列冊低收入戶且申請人、配偶及共同生活之直系二親等血親無自有住宅或未配住公有住宅或宿舍者。輔導人口需3口以上，因目前已無2口以下平宅可供配住。二、本市目前計有2處平宅接受申請，申請對象為具有本市低收入戶輔導人口3口以上—大安區延吉平宅，候缺時間約5年；文山區安康平宅，候缺時間約2年。萬華區福民平宅，102年10月1日起停止受理申請。三、申請方法：您可填妥申請表後，附低收入戶卡正反面影本，郵寄或親送(11008臺北市市府路1號1樓東北區社會救助科)。申請表可至本局網站下載（www.dosw.taipei.gov.tw）。 下載路徑//首頁 > 低收、中低收入戶服務 > 居住服務 > 平價住宅申請及基本資料 >
- - 本市平價住宅分布於何處？
  - 1.安康平宅：臺北市文山區興隆路4段103號3樓，電話：2939-0404、2939-5350，傳真：2936-2395。2.福民平宅：臺北市萬華區西園路2段320巷57號，電話：2303-6783，傳真：2332-4771。3.延吉平宅：臺北市大安區延吉街236巷17號，電話：2704-7665，傳真：2705-4358。4.大同之家：臺北市北投區東昇路12巷，電話：2303-6783，傳真：2332-4771。
- - 何謂平價住宅甲種、乙種及丙種之分？
  - 甲種4口人、乙種3口人、丙種2口人及1口人（目前已停止接受丙種新申請案，建請改租國宅）。
- - 臺北市低收入戶及受保護安置市民喪葬補助費申請應備文件？
  - 1.申請書。2.低收入戶或受保護安置之證明文件。3.埋葬或火化許可證明。4.公墓、骨灰 (骸) 存放設施、樹（灑）葬設施或海葬等相關證明文件。但情形特殊者，得檢附其他證明文件。5.法院檢察官或醫療院所填發之死亡證明文件。6.由親屬申請者，並應檢附親屬關係之證明文件。
- - 2017臺北世大運工作人員之各顏色服裝所代表的人員身分為何？這些服裝有對外販售嗎？
  - 各顏色服裝分為下列類別：(1)藍色：工作人員(2)彩色：貴賓(3)紅色：裁判、技術委員、競賽助理等競賽人員(4)全綠色：志工(5)綠白色：貴賓接待人員(6)黃色：維安人員(7)橘色：醫護人員(8)灰色背心：媒體此類服裝為賽會期間提供給各類工作人員之工作服裝，並無對外販售。
- - 世大運是否有提供民眾律師諮詢管道？
  - 有的，世大運就個案皆會聘請專案律師為世大運協助服務，民眾若對世大運有所疑問，或想詢問世大運律師相關問題，亦可聯繫世大運律師聯繫窗口，將另由專人為您聯繫。至於個案派出幾位律師則不固定，視事務所就個案的調派。
- - 世大運是否有經濟效益的數據或研究？可以知道整個賽會的產值？
  - 2017臺北世大運經濟效益依據103年度進行「2017臺北世界大學運動會對臺灣整體經濟效益之影響研究」，包含直接效益估計約199.74億元、間接效益約3.68億元，產業關聯之產出效果為839億元、所得效果為511.8億元。因本研究委託時間為103年，當時尚無法得知較細項之軟硬體設施經費，故臺北世大運執委會將於賽會結束後，以最終投入之軟硬體經費進行臺北世大運經濟效益分析。
- - 臺灣在何時成功申辦世大運？
  - 2011年11月29日晚間7時（臺北時間30日凌晨2時）。
- - 2017台北河岸音樂季系列活動各項詳細資訊，何處可獲取?
  - 臺北旅遊網(http：//www.travel.taipei/)或活動官網(http：//2017.riversounds.travel.taipei/zh-hant )提供詳細活動內容、現場及周邊交通、捷運及接駁公車等各項資訊。
- - 若於世大運賽會期間各競賽場館有問題，可向誰詢問？
  - 綜合服務台主要功能是提供觀眾諮詢與引導服務，前述項目之工作人員將於世大運賽會期間，提供下列賽事相關資訊與服務：1.競賽日程2.交通資訊3.城市地圖4.場館地圖5.文化活動宣傳6.開閉幕節目資訊7.觀光旅遊諮詢服務8.為觀眾提供引導服務9.失物招領服務
- - 請問為什麼世大運選手手上都有一樣的手錶？
  - 世大運約有12,000多名選手、隊職員、裁判來臺參加比賽,為提供選手來臺期間便利生活，並展現臺灣科技實力，臺北市政府與宏�、聯發科、悠遊卡公司合作，贊助世大運智慧手錶。且該手錶，具備悠遊卡付費功能，感應就能完成消費付款
- - 世大運智慧手錶有什麼樣的功能？
  - 除了一般手錶功能外，能偵測使用者的運動、即時心律、熱量消耗等個人健康資訊且會結合悠遊卡儲值及消費功能。
- - 請問民眾可以購買世大運智慧手錶嗎？
  - 是的，民眾是可以購買的。
- - 請問民眾買的智慧手錶會跟世大運選手的功能一樣嗎(如是否有悠遊卡功能、外觀)？
  - 民眾於市面通路所購買的會附有兩種錶帶，一是原廠錶帶，另一個是有銀色世大運的LOGO，與選手所拿到的藍色LOGO不同，但其功能皆與選手拿到的一致。
- - 世大運APP要怎麼下載?
  - 提供google play與APP store下載，搜尋臺北世大運即可，並另外提供QRcode快速連結。
- - 世大運一個代表團有幾個隨團志工?
  - 隨團志工人數將依照帶表團大小分配：代表團─隨團志工1至50─1人51至100─2人101至175─3人176至250─4人251至300─5人300以上─6人另外一代表團每報名一個團賽，將額外配給一位志工。國際志工原則上依照其國家分配，若其他國家需要協助則另行分配。
- - 世大運隨團志工工作內容為何?
  - 1.隨團志工為代表團與組委會間主要的溝通橋樑，須盡可能協助處理大多數的問題。2.隨團志工須注意所屬代表團之班機抵境資訊以協助接機等工作事宜。3.協助代表團團長辦理首次入村及認證程序。4.陪同代表團參與開閉幕典禮並協助相關活動事宜。5.瞭解選手村內設施及其相對位置、各練習與競賽場館、各通行區域之乘車點等。6.掌握代表團的行程，隨車陪同並擔任隨行翻譯的角色(團體競賽項目尤其重要)，並與司機保持良好的聯繫管道。若搭車時間有所異動，需即時協助代表團人員更改派車時間。7.如有需要，須協助代表團預訂餐盒。8.協助代表團處理與賽會相關之行政事務。9.其他代表團團長臨時交辦事項。
- - 世大運隨團志工支援期間為何?
  - 原則上服勤時間為106年8月12日至9月2日，但實際情況依照該代表團底離境時間為準。每日服勤時間原則以4小時為單位，最多每日可達12小時。
- - 世大運隨團志工如何排班?
  - 原則上透過代表團內所有志工與代表團做排班上的協調。每日服勤時間原則以4小時為單位，最多每日可達12小時。
- - 世大運選手村主訊息中心營業時間為何?
  - 營業日期為8月12日-9月2日，每日07：00-22：00。
- - 世大運選手村主訊息中心包含哪些櫃檯?
  - 代表團服務櫃台代表團信箱櫃台會議室預約服務櫃台抵離境櫃台交通櫃台物流服務櫃台餐飲櫃台文化活動櫃台票務服務櫃台保險櫃台租借服務櫃台行動旅服站&城市觀光導覽櫃台
- - 世大運貴賓接待志工、場館貴賓室接待志工及隨團志工招募情形?
  - 2017臺北世大運執委會國際關係處語言接待志工於105年11月至106年3月進行共10種語言19場面試，錄取共941位志工（英文：749人，土耳其文11人，法文30人，俄文31人，日文18人，德文8人，韓文18人，西班牙文50人，義大利文7人，阿拉伯文19人）。語言接待志工已完成招募
- - 世大運貴賓接待志工、場館貴賓室接待志工工作內容?
  - 貴賓接待志工：陪同 FISU 家族等國外貴賓賽會期間之接待服務。場館貴賓室接待志工：1.貴賓室服務接待。2.關閉幕 VIP 動線指引、機動性服務等事宜。3.確認場館旗幟懸掛。
- - 國內外貴賓參與世大運開閉幕典禮所需攜帶物品為何?
  - 由於2017臺北世大運是臺灣有史以來最大型國際運動賽會，世大運規格亦僅次於奧運，維安把關相對嚴格，請獲邀出席開閉幕典禮之貴賓務必隨身攜帶世大運發放之「貴賓本人認證卡」及「開閉幕典禮入場票券」，以順利進場。
- - 2017台北河岸音樂季何時舉辦?
  - 2017台北河岸音樂季系列活動自即日起至8月12日，每週六1700-1900在河岸周邊廣場舉行，內容有音樂演出與市集活動，詳情可上活動官網(http：//2017.riversounds.travel.taipei/ )、臺北旅遊網(http：//www.travel.taipei/)、或洽1999查詢。另外，暑期也正值颱風季節，倘遇不可抗拒之因素，主辦單位觀光傳播局保有隨時修改、暫停或終止本活動之權利，如有未盡事宜，也請民眾隨時上臺北旅遊網或活動官網查詢活動最新消息。
- - 2017台北河岸音樂季系列活動特色與周邊活動？
  - 即日至8月12日每週六於台北河岸周邊皆有音樂表演、市集，地點包括大稻埕碼頭、馬場町紀念公園、大佳河濱公園、關渡中港河碼頭、古亭河濱公園等，週週接力演出，演出者包括2016年金曲獎最佳演唱組合「張三李四」、入圍今年金曲獎最佳台語專輯的電音搖滾樂團「台客電力公司」、曾入圍兩屆金曲獎圖騰樂團主唱「查瑪克」，及經典的葉佳修、施孝榮、李炳輝等。其中於8月26日(六)舉行「大稻埕情人日」活動，從下午3點開始在大稻程碼頭延平河濱公園3-5號水門間，除了文創、輕食攤位、愛情塗鴉牆等有趣的活動外，今年更邀請了「中孝介」、「MATZKA」、「四葉草」以及金智娟，帶來跨越國界與世代的美好音樂。系列活動資訊，如下：各場次的位置及交通方式詳官網或臺北旅遊網。
- - 2017台北河岸音樂季-「8/26大稻埕情人日」煙火在何處施放?
  - 2017台北河岸音樂季，8月26日為大稻埕情人日，活動自下午3時起至10時結束，並於晚間8時進行煙火施放(總長約10分鐘)，詳細活動內容將陸續公布於活動官網。
- - 2017台北河岸音樂季-「8/26大稻埕情人日」民眾進出活動場所動線
  - 活動主舞台位於延平河濱公園，人潮進出以淡3及淡5號水門為主(因4號水門為緊急應變通道，8月26日16時關閉，管制至當日23時)，當天活動現場有交通管制，請搭乘大眾交通工具前往，可自捷運紅線雙連站，沿民生西路往西步行15-20分鐘；或搭乘捷運綠線北門站，沿市民大道往西步行3-5分鐘可到3號水門。
- - 2017台北河岸音樂季-活動因天候狀況取消
  - 因近期天候較不穩定，且夏季恐有颱風或驟雨，為顧及參與民眾安全，各場次活動若因天候狀況取消，本局將提前公布於活動官網、台北旅遊網及台北旅遊網FB、市府Line帳號等管道，亦可打1999洽詢。
- - 2017台北河岸音樂季-集章抽獎活動
  - 凡參加任3場系列活動並於現場蓋章，即具抽獎資格，現場皆提供集章卡。將於8/26公開抽獎，頭獎有麗星郵輪日本行1+1遊程(航線後續將公布於官網)，其驚喜獎項還有藝人簽名經典烏克麗麗及黑膠唱片機，請密切注意活動官網。
- - 配合2017台北河岸音樂季-「8/26大稻埕情人日」交通管制情形
  - 本年度交通管制將配合交通維持計畫進行，將於確定管制路線後盡速公佈。
- - 「2017台北河岸音樂季」今年的活動特色?
  - 今年的台北河岸音樂季以「青春舞曲」為主題，各場次活動均以不同時代為主題，並精選經典歌曲，年度主題曲是「河堤上的傻瓜」，希望大家一起在台北河岸享受跨世代的好歌，大家更可以上KKBOX搜尋台北河岸音樂季歌單，歡迎到現場和我們一起歡唱。
- - 「2017台北河岸音樂季」各場特色活動?
  - 為了讓大家有更多機會感受台北河岸的美，除了好音樂之外，我們還準備了豐富的周邊活動。比如7/1以西洋金曲為主題的「閃亮的節奏」，更邀請到關島及休士頓旅遊局，在現場將給大家濃濃的美國味! 除此之外，還有免費觀星活動，請大家上台北旅遊網FB報名參加!另外7/15還有愛的瓶中信活動，邀請大家親筆寫下訊息，留給未來；8月份在古亭婚紗公園的場次，更準備了浪漫驚喜邀請大家一起來聽「有故事的歌」。最新活動資訊請留意活動官網或台北旅遊網。
- - 106年臺北市學童高度近視防治下半年免費專業視力檢查服務的服務期間、服務對象及檢查項目?
  - 106年臺北市學童高度近視防治下半年免費專業視力檢查1.補助檢查時間：106年7月1日至10月31日止。2.補助對象：106學年度上學期就讀臺北市國小2、3及4年級學童。3.補助內容：免費專業視力檢查(內含：散瞳前驗光、裸視視力測量、裂隙燈檢查、散瞳後驗光、最佳矯正視力)。4.補助條件：檢查服務期間持「護眼護照」至本計畫合約眼科醫療院所接受專業視力檢查。(查詢本計畫合約醫療院所可至臺北市學童高度近視防治網http：//vision.health.gov.tw/s_prog/ehoslist.asp?cid=90)。
- - 臺北市106年7月1日起新增公告禁菸場所為何?違規吸菸者罰鍰?
  - 為維護民眾健康權益，建構戶外無菸環境，本局依據菸害防制法15條第1項第13款規定，新增公告「淡江大學台北校園周邊人行道」，自106年7月1日起，為除吸菸區外全面禁止吸菸場所。違規吸菸民眾，依該法第31條第1項規定，處新臺幣2,000元至1萬元罰鍰。禁菸公告詳細資訊可至臺北市政府衛生局外網(http：//health.gov.taipei/)或「無菸健康網」(http：//210.69.108.231/Nosmoking/index.asp/)查詢。
- - 獨居老人如需緊急送醫，請問如何處理？(業務主責：社會局老人福利科)
  - 若遇到需緊急送醫者，可直接撥打緊急救難專線119送往附近醫院急救。
- - 如未成年之兒童、少年、身心障礙少年或無父母、父母失聯之兒童少年需緊急送醫者，請問如何處理？
  - 若遇到需緊急送醫者，可直接撥打119送往附近醫院急救。
- - 2017搖滾世大運何時舉辦?
  - 2017搖滾世大運活動於2017年7月2日(星期日)上午10點50分至12點在臺北市政府前市民廣場舉行，8點開始報到，10點開始綵排。活動詳情可上活動官網(http：//rock.2017.taipei/)查詢。另外，活動時間倘遇雨或其他不可抗力因素，主辦單位保有隨時修改、暫停或終止本活動之權利，如有未盡事宜，也請民眾隨時上「2017搖滾世大運」臉書活動頁(https：//goo.gl/iLxBB5)查詢最新消息。
- - 2017搖滾世大運系列活動各項詳細資訊，何處可獲取?
  - 活動官網(http：//rock.2017.taipei/)或FB活動專頁(https：//goo.gl/iLxBB5)提供詳細活動內容。
- - 2017搖滾世大運現場有什麼活動與節目?
  - 現場人員將共同演奏三首曲目，分別為原創曲目〈I am here〉、改編曲-張雨生知名搖滾作品〈和天一樣高〉及英國OASIS綠洲的百萬金曲〈Don’t look back in anger 〉。另外活動當天現場更邀請到臺北世大運主題曲創作團體I-WANT星勢力和世大運宣傳大使熊讚、悠遊卡BeBe、UUPON的ＵＵ醬演出2017臺北世大運主題曲〈擁抱世界擁抱你〉，歡迎有興趣的民眾來到現場，一起搖滾世大運，詳細訊息請至活動官網查詢(http：//rock.2017.taipei//)。
- - 如何抵達2017搖滾世大運活動現場?
  - 2017搖滾世大運活動於2017年7月2日(星期日)上午10點50分至12點在臺北市政府前市民廣場舉行，報名參與演出人員8點開始報到，10點開始綵排。★鼓勵綠色運輸，建議搭乘大眾運輸：1.捷運：搭乘捷運板南線至捷運市政府站下車，由2號出口行經市府連通道約10分鐘即抵達；或搭乘捷運淡水信義線至台北101/世貿站下車，由5號出口步行約8分鐘即抵達。2.公車：搭乘 28、266（含區）、281、612（含區）、678、912950、935、棕7、棕21、647、915、棕6、棕18、綠1。於市政府(松壽)或臺北101/世貿站(市府)下車，步行即可到達臺北市政府前市民廣場。
- - 現場如何參加2017搖滾世大運?
  - 歡迎有意願參與的演奏的民眾屆時帶著樂器前來現場自由參加，現場報名參加民眾於活動報到時段內，現場填寫資料，還有機會得到「搖滾世大運」悠遊卡，數量有限，發完為止。報到完即帶著樂器到〈自由參加區〉，一起參加搖滾世大運共演活動，或到場觀賞共演。
- - 世大運國際志工要如何才能取得eVISA許可代碼？
  - 我們將會在七月提供您eVISA代碼，有關於eVISA的相關問題請參考下列網址
- - 《艋舺走讀相簿》特展時間？對象？內容？
  - 臺北市觀光傳播局、社會局及文化局等市府單位和艋舺在地協會、店家等民間團體聯手策劃，即日起至7月16日於艋舺龍山文創B2艋舺傳奇書坊(B2203)推出《艋舺走讀相簿》特展，以「艋舺故事」、「艋舺在地大小事」、和「艋舺趴趴走」三大主題蒐羅在地文宣出版品、旅遊導覽手冊及地圖，並透過攝影、拍立得等影像展示、引領旅客挖掘屬於自己的艋舺印象。    參觀靜態展覽，民眾只要於展區「戳章紀念小站」領取小卡並蓋上紀念戳章，即可至文創展售中心 (B2001)兌換限量熊讚鑰匙圈收納盒1個，數量有限，送完為止。另7月15日(六)於上午11點至下午5點舉辦特別限定活動，當日觀展旅客，除憑紀念戳章卡片領取限量熊讚鑰匙圈收納盒外，現場另舉辦拍立得拍照活動，至「艋舺人物誌」展區，拍照打卡上傳，拍立得相片免費帶回家！詳情可洽捷運龍山寺站旅遊服務中心、市民熱線1999（02-27208889）或上台北旅遊網查詢http：//www.travel.taipei/。「捷運龍山寺站旅遊服務中心」相關資訊地點：西園路1段153號地下1樓（捷運龍山寺站1號出口）服務時間：每日09：00∼17：00服務電話：(02)2302-5903。
- - 請問世大運比賽場館在哪邊?
  - 分佈五縣市，分別為臺北、新北、桃園、新竹市及新竹縣，歡迎到世大運官方網站https：//www.2017.taipei/home查詢。
- - 請問世大運比賽場館每天幾點可以開始進場?
  - 各場館依每日賽程不同開放進場時間則不同，可上2017世大運官網https：//www.2017.taipei/home查詢，比賽開始前1小時即開始開放觀眾入場。
- - 公路賽有規定觀眾只能在哪個區域看嗎?
  - 以不影響選手為主，並沒有特別規定。
- - 我想帶我親戚觀賽，但他行動不便，請問世大運比賽場館有方便身障的出入口及協助至觀眾席的服務嗎？
  - 場館都設有方便身障人士進入的出入口，且會有場館內志工協助。
- - 世大運期間國旗可以帶進場嗎?
  - 世大運期間除政治性旗幟外，民眾可持國旗或中華民國大專院校體育總會會旗，為我國選手加油觀眾席，但攜帶入場之旗幟仍需符合長2公尺、寬1公尺之規定。
- - 如何得知世大運各運動種類賽程？
  - 請至2017世大運官網或APP「賽程與成績」分頁查詢，賽程部分，目前籃球、排球、棒球、足球及水球已完成抽籤，相關賽程詳見官網https：//www.2017.taipei/home；其他賽事亦已完成賽程安排，惟對戰組合尚待抽籤決定，抽籤日程預計為各種類開賽前1-2日，請持續關注官網或APP消息。
- - 如何得知世大運各項比賽成績？
  - 請至2017世大運官網https：//www.2017.taipei/home或APP「賽程與成績」分頁查詢。
- - 如何得知世大運參賽各國獎牌數？
  - 請至2017世大運官網https：//www.2017.taipei/home或APP「獎牌榜」分頁查詢。
- - 如何了解世大運各運動種類賽制？
  - 請至2017世大運官網https：//www.2017.taipei/home各競賽種類之分頁下載技術手冊。
- - 2017臺北世大運總共比賽幾天？
  - 競賽日期為106年8月19日至8月30日。
- - 2017臺北世大運辦理多少運動種類？
  - 共計有22項運動種類。包含田徑、籃球、跳水、擊劍、足球、競技體操、韻律體操、柔道、游泳、桌球、跆拳道、網球、排球、水球、射箭、羽球、棒球、高爾夫、滑輪溜冰、舉重、武術及撞球。
- - 如何得知中華隊在2017臺北世大運期間的賽程？
  - 請至2017世大運官網或APP「賽程」分頁查詢。目前籃球、排球、棒球、足球及水球已完成抽籤，相關賽程詳見官網；其他賽事亦已完成賽程安排，惟對戰組合尚待抽籤決定，抽籤日程預計為各種類開賽前1-2日，請持續關注官網https：//www.2017.taipei/home或APP消息。
- - 如何得知中華隊在2017臺北世大運的比賽成績？
  - 請至2017世大運官網https：//www.2017.taipei/home或APP「賽程與成績」分頁查詢。
- - 如何得知中華隊在2017臺北世大運比賽期間的獎牌數？
  - 請至2017世大運官網https：//www.2017.taipei/home或APP「獎牌榜」分頁查詢。
- - 我是社會人士想擔任世大運社會志工，現在還有機會能夠參與嗎?
  - 已完成原定目標6,000名之社會志工招募及培訓作業，故已停止招募社會志工。
- - 請問我是否還能申請參加2017臺北世大運國際志工嗎？
  - 目前國際志工的招募已經結束，錄取名單已公告在網站上https：//volunteer.2017.taipei/Announcement/index.aspx?NID=642，仍然歡迎你前往臺北觀賞2017世界大學運動會相關賽事。
- - 世大運國際志工應該申請什麼簽證？
  - 有關於外國人來台簽證問題，請參考外交部領事事務局網站http：//www.boca.gov.tw/mp?mp=1。
- - 我是世大運國際志工，我的配偶可以與我一同前往臺北嗎？能否請你們協助一同申請eVisa?
  - 很抱歉，我們無法協助非臺北2017世大運的國際志工申請eVISA，請您聯繫外交部領事事務局(http：//www.boca.gov.tw/mp?mp=1)了解更多簽證細節。
- - 臺北市政府志工管理平台的連結網址是什麼？
  - 臺北市政府志工管理平台 https：//volunteer.2017.taipei/index.aspx
- - 臺北市政府志工管理平台登入的帳號跟密碼是什麼？
  - 所有錄取的國際志工都會收到一封email，內容包含您的帳號與默認密碼，在第一次登入系統之後，系統會請您修改您的密碼。
- - 我是世大運國際志工，應該在什麼時候抵達以及離開臺北？
  - 關於抵達時間，將根據您被分配到的培訓梯次而有所不同：1、分配到第一培訓梯次的志工，報到時間為2017/8/7 臺北時間。2、分配到第二培訓梯次的志工，報到時間為2017/8/13臺北時間。3、關於離臺時間，您必須在2017/9/1搬離國際志工宿舍，我們將會在2017/9/2開始清理宿舍並將宿舍歸還與學校。
- - 我是世大運國際志工，收到email通知要求我做志工線上培訓，我應該怎麼做？
  - 很抱歉因為志工系統的自動信件造成您的困惑，請忽略有關於志工線上培訓的訊息，我們將會在八月您抵達臺北之後提供培訓課程。
- - 如何取消世大運國際志工的錄取資格?
  - 請將您取消2017臺北世大運國際志工的申請email至 tms_ballet@mail.taipei.gov.tw
- - 我是世大運國際志工，如何申請國際志工宿舍？國際志工宿舍的地點在哪裡？
  - 我們將從培訓梯次開始到2017/9/1這段期間，提供免費的住宿予全體國際志工。國際志工宿舍的地址在臺北市立大學博愛校區(100台北市中正區愛國西路1號)。
- - 在整個世大運活動期間會提供國際志工免費的餐點嗎？
  - 在訓練期間，我們將會提供您一天有三份餐點；在賽事期間，有鑑於國際志工皆被分配至不同的地方服勤，我們會在校園內提供早餐及晚餐(我方保有權利修改所有的餐食預定規劃)。此外，我們將會提供您每四小時台幣110元的代金(誤餐補助80元，交通補助30元)。
- - 獲選為2017臺北世界大學運動會的國際志工，我們需要支付任何的費用嗎？
  - 2017臺北世界大學運動會不會向國際志工收取任何的費用，但是您需要自行負擔至臺灣的機票、簽證費，以及您相關的交通費用。
- - 世大運國際志工服勤期間將從什麼時候開始？
  - 分配至第一培訓梯次的志工，必須在2017/8/7報到，經過四天的訓練課程後，您的服勤時間為2017/8/12至2017/8/31。分配至第一培訓梯次的志工，必須在2017/8/13報到，經過四天的訓練課程後，您的服勤時間為2017/8/18至2017/8/31。
- - 我是世大運國際志工，可以只參與部分的培訓課程嗎？
  - 在2017/8/11(第一梯次)、2017/8/17(第二梯次)的訓練課程對所有國際志工來說是非常重要的，因為這兩天的課程將會安排國際志工與未來的服勤單位相見，並由服勤單位說明您未來的工作內容。在世大運賽事開始之前，我們只有四天的時間為所有國際志工提供培訓，我們準備了一些重要的課程，讓您可以了解之後服勤的相關內容，若您不能全程參與培訓，我們將很難安排您接下來的服勤工作。
- - 什麼時候才可以知道世大運國際志工的服勤班表？
  - 您的服勤班表將會由您未來的服勤單位安排，您可以在參與培訓課程是與您的服勤單位討論班表。
- - 2017臺北世大運籌備期間的籌備人力為何？
  - 世大運籌備期間一共有600名工作人員，包括市府兼職人力及專職人力各300名投入賽會籌備相關業務。
- - 2017臺北世大運各場文化活動、世大運公園、世大運博物館、開閉幕、聖火傳遞等資訊如何查詢？
  - 原世大運博物館已併入世大運公園規劃中，開閉幕、文化活動及聖火傳遞相關資訊，請見世大運官網(https：//www.2017.taipei/home)及官方FB(https：//www.facebook.com/taipei2017)查詢。
- - 世大運是否有提供相關的合作店家或飯店？
  - 世大運特約旅館一共選出110家旅館、分別提供中、英、日、韓、法、西、德、粵、泰、馬來等多種語言，每晚每房價格自630元至1萬2,300元應有盡有，青年旅館、平價旅館、連鎖飯店品牌、商務旅館及國際觀光旅館，詳情請上https：//hotels.2017.taipei。
- - 世大運賽會期間是否有推薦城市觀光行程供旅客參加?
  - 世大運城市觀光導覽共推出涵蓋全臺灣、中、英文共計25條之付費行程，詳情請上https：//www.travels.2017.taipei/。
- - 何謂「低污染排放示範區」?主要管制對象為何？
  - 1.環保局於106年2月15日公告劃定1線2站6處為低污染排放示範區，並於106年7月1日正式實施，示範區為：(1)新生南路(羅斯福路口)—松江路(民權東路口)路段(2)臺北(交九)及市府2處轉運站(3)陽明山前山公園、故宮博物院、中正紀念堂、國父紀念館、忠烈祠、101大樓等6大觀光景點。2.低污染排放示範區主要管制對象為未定檢機車、93年以前出廠的二行程機車、101年以前出廠的柴油大客貨車及小貨車等，相關細節請洽環保局空污噪音防制科，電話：1999(外縣市02-27208889)轉7248。
- - 世大運賽會期間媒體如何得知往返於各場館交通接駁資訊？
  - 有關媒體交通接駁時段資訊將公告於世大運官網 (https：//www.2017.taipei/home) 媒體專區、主新聞中心、各場館、媒體旅館、機場等地。
- - 世大運主新聞中心及各競賽場館媒體區營運時間為何?
  - 1、營運時間106年8月16日早上8點至106年9月1日晚間10點；106年8月17日至8月31日期間為24小時營運。2、各場館媒體區營運時間為賽程開始前2小時開放媒體進場，賽後2小時閉館。
- - 目前世大運期間媒體特約旅館有幾間?
  - 臺北西華飯店：臺北市松山區民生東路三段111號臺北有園飯店：臺北市中山區南京東路三段16號首都飯店南京館：臺北市松山區南京東路四段156號
- - 請問世大運期間於主新聞中心及各場館媒體區提供哪些服務？
  - 1、主新聞中心媒體服務：提供認證核准之媒體工作空間(皆配有電源及網路)、舉辦賽會期間每日例行記者會、 簡易餐飲服務、媒體租借項目服務及攝影器材維修及往返各競賽場館、媒體旅館、交通接駁。2、各競賽場館媒體區：提供認證之媒體工作空間(皆配有電源及網路)、舉辦賽後記者會、提供媒體攝影、觀賽，與賽後即時採訪空間(混合區)，及簡易餐飲服務。
- - 世大運期間是否會提供國際轉播訊號？
  - 會的，2017臺北世大運執委會將提供國際轉播訊號予FISU及獲得授權的持權轉播商。
- - 世大運期間會轉播哪些賽事？
  - 依據夏季世界大學運動會最低需求，所有的團體項目準決賽及決賽、個人項目的決賽與開閉幕典禮都會進行轉播。國際轉播權隸屬FISU持有。
- - 2017臺北世大運將如何進行轉播？
  - 2017臺北世大運賽會期間，在臺灣的觀眾可透過華視以及緯來電視台收看；國外的觀眾則可以透過FISU TV的網站收看。
- - 2017臺北世大運賽事網路轉播的項目為何？
  - 2017臺北世大運所有賽事都會在FISU TV的網站進行網路轉播，同時FISU也持有國際的網路轉播權利。
- - 2017臺北世界大學運動會贊助商開發之聯名商品要在哪購買？
  - 請至2017臺北世界大學運動會官方網站-聯名商品專區(https：//www.2017.taipei/home/detail/content/3d3d322c-f205-4fa2-85cc-d3a07b9b7e9c)查詢。
- - 2017臺北世界大學運動會贊助商有哪些?
  - 長榮航空股份有限公司、汎德股份有限公司、中華航空股份有限公司、統一企業集團、富順纖維工業股份有限公司、中華電信、揚昇高爾夫鄉村俱樂部、聯發科技股份有限公司、宏�、悠遊卡股份有限公司、富邦金融控股股份有限公司、中興保全、臺灣中油股份有限公司、昇恆昌股份有限公司、泰山體育產業集團、臺灣恩智浦半導體股份有限公司、勝利體育事業股份有限公司、東友科技股份有限公司等42家企業，另宮廟認捐計有6家。
- - 世大運選手村何時開始啟用？何時閉村？
  - 世大運選手村開村暨開村典禮日期為106年8月12日(六)，閉村於106年9月2日(六)，共使用22日。
- - 陽明教養院志工服務的申請方式?
  - 一、填寫「臺北市陽明教養院志願服務申請表」後透過下列方式申辦：（一）臨櫃親辦（請洽社工課）（二）郵寄（11193 臺北市士林區凱旋路61巷4弄9號）（三）電話（社工課02-28611380轉109） 備助：臺北市陽明教養院志願服務申請表可至本院網站下載或至本院櫃檯領取二、申請時間：週一至週五8：30~17：30，電洽本院社工課02-2861333或網站http：//www.ym.gov.taipei/ 提出申請;團體服務申請，請於欲來院服務前兩星期提出計畫書至本院。三、申請資格：（一）個人志工：具愛心、耐心、毅力，願意對智能障礙者付出關心之個人。 （二）團體志工：各國民中小學、高中職及大專院校班級或社團、一般服務性社會團體或企業團體。備註：需先接受本院志願服務教育訓練課程後，方得進入本院提供志願服務。
- - 若不是2017臺北世界大學運動會贊助商，是否還有其他機會在大會宣傳製作物上露出企業LOGO?
  - 因LOGO露出是為世大運贊助商及世大運合作宣傳店家的權益，所以要在2017臺北世界大學運動會宣傳製作物上露出LOGO，必須成為本賽會之官方贊助商或世大運合作宣傳店家，方可露出企業LOGO。
- - 成為2017臺北世界大學運動會贊助商的回饋有哪些?
  - 詳情請洽2017臺北世界大學運動會企業贊助專區：http：//sponsorship.2017.taipei/
- - 是否還能夠成為2017臺北世界大學運動會贊助商?
  - 企業贊助是根據賽會需求而來，然賽會在即，所有賽會需求都必需提前準備到位，所以目前已無贊助需求，感謝大家的熱情響應。
- - 如何入場觀賞世大運比賽？
  - 持當日門票進入票面上顯示之場館，購買優惠票或身心障礙優待票須攜帶有效證件正本供驗票人員查驗。
- - 2017臺北世界大學運動會退票方式？
  - 競賽場館現場不受理退票，須將票券連同退票申請表寄回拓元公司辦理。詳細退票方式及退票申請表詳世大運售票網站 (https：//tickets.2017.taipei/) 或世大運票務客服02-87729805
- - 2017臺北世大運開、閉幕門票是否有優惠？
  - ※身心障礙優待票(免費)：1、開/閉幕：身心障礙保留席位須於106年7月12日前完成申請，由主辦單位安排座位。保留席位數量有限，申請完畢後或106年7月13日後，不再受理申請。請於購票網站下載身心障礙優待票訂購表，以傳真或電子郵件方式訂票(郵寄或現場取票皆需收取50元服務費)。※優惠票(65歲以上)(5折)：1、網站、超商、現場皆可直接購買，惟需於入場時出示身分證件以供查驗。2、考量本活動人潮眾多、節目時間長，且場地看臺座位高度可能造成危險，不建議未滿6歲兒童進場，家長若攜兒童入場，請遵守一般購票規則及觀賞禮儀，一人一票，憑票入場。
- - 2017臺北世大運競賽門票優惠
  - ※預購優惠8折：106年6月13日至106年7月31日。可與優惠票、團體票、單一競賽套票合併使用。※身心障礙優待票(持身心障礙手冊及必要陪伴者1人)(免費)：1、各項競賽：請於購票網站下載身心障礙優待票訂購表，106年7月31日前，以傳真或電子郵件方式訂票(郵寄或現場取票皆需收取50元服務費)，或是於競賽期間，至各場館現場售票亭換取身障優待票入場（如果現場仍有票券未售完）。※優惠票(65歲以上12歲以下、學生、低收入戶、世大運志工)(5折)：1、網站、超商、現場皆可直接購買，惟需於入場時出示身分證件以供查驗。2、106年7月31日前可再享預購優惠(如於106年7月10日選購田徑競賽門票學生票一張，即為2005折(學生優惠)8折(預購優惠)=80元)。※團體票(7折)：1、須購買同日同場地之單一競賽門票單筆至少20張以上，單筆訂單不得跨場館購票。2、團體票受理至該場次前一天12：00截止。(如106年8月18日比賽，網站販售至8月17日12：00止，於繳費截止時間前，需於訂購後2小時內需繳費完成，訂單才成立）。3、106年7月31日前可再享預購優惠(如於106年7月10日選購田徑競賽門票團體票20張，即為200元20張7折(團體票優惠)8折(預購優惠)=2240元;平均112元/張)。※大宗團購優惠（4~5折）：1、於購票網站下載大宗團購訂購表，106年7月31日前，以傳真或電子郵件方式訂票。2、單張訂購單最少需達100張(含)以上，且同日同場地之單場競賽門票至少須購買20張以上(如：至少購買20張以上106年8月20日臺北小巨蛋之籃球競賽門票)※單一競賽套票優惠(55~65折)(撞球項目無套票優惠)：1、限量發行，預售至106年7月31日為止。2、滑輪溜冰及游泳項目，最後一日為不售票場次。
- - 2017臺北世大運購票、付款與取票之方式分別為何？
  - （一）購票通路規劃：1、購票網站（http：//tickets.2017.taipei）2、三大便利超商機臺（7-ELEVEN ibon、萊爾富Life-ET、OK超商OK•GO）3、競賽場館現場售票亭（販售當日該場館比賽之門票，現場數量有限）（二）付款方式：1、信用卡（僅於購票網站與現場售票亭受理）2、ATM轉帳（僅於購票網站受理）3、現金（三）取票方式：1、三大便利超商（7-ELEVEN ibon、萊爾富Life-ET、OK超商OK•GO）（每「張」服務費10元）2、競賽場館現場售票處(線上訂購需付款完成，且每「筆」訂單20張(含)以下服務費50元、20張以上100元)3、郵寄(網站訂購需於7/9付款完成，且每「筆」訂單20張以下服務費50元、20張以上100元)4、現場購票+現場取票不需服務費。
- - 世大運開閉幕如遇雨如何因應？如遇不可抗力因素導致需退票，作業流程為何？
  - （一）開、閉幕退票SOP：2017臺北世大運執委會一旦於開演前確認取消文化節目，現場即不開放觀眾入場，或因故中斷節目演出，即可退費，退票處理原則如下：1、全額退費，不收取手續費。2、現場不受理退票處理。3、民眾於取消公告後7日內將開閉幕票券寄回售票承辦廠商（拓元）辦理退票。（二）競賽門票退票SOP：1、延後比賽及比賽暫停部分，因主辦單位有賽程變更之權利，且民眾已觀賞部分賽程，故不受理退票，單日票照常使用。若是突發狀況發生，大會臨時宣布該日比賽延期，可受理退票時，民眾可於出場時蓋「比賽中斷章」辦理後續退票申請。2、當日賽事取消，退票處理原則：(1)全額退費，不收取手續費。(2)各場館現場不受理退票處理。(3)民眾於賽程取消公告後7日內將競賽票券寄回售票承辦廠商（拓元）辦理退票。
- - 2017臺北世大運退票流程
  - 1、現場不受理退票。2、民眾自身因素要求退票(1)需酌收10%退票手續費。(2)退票截止收件日為每日比賽(不含比賽日)前10日起即不受理退票，且僅接受以郵件方式送達本公司，並以送達日期為準，非以郵戳或寄件日期為準（如106年8月19日的比賽，退票截止收件日期為106年8月9(含)日）。3、因賽事變更/取消或天候因素（如下雨、颱風）造成退票(1)不收取退票手續費。(2)於退票公告日(D)後7日，即D+7日內寄回，D+7日後不接受退票，且僅接受以郵件方式送達本公司，並以送達日期為準，非以郵戳或寄件日期為準（如106年8月19日的比賽，退票截止收件日期為106年8月26(含)日）。
- - 排球競賽為何還不能開放購票?
  - 世大運所有競賽賽程都需要經國際大學運動總會（FISU）核定始能公布，排球賽程部分，由於FISU尚在進行賽程確認，一旦FISU核定，就會開放售票，請民眾隨時注意官網(https：//www.2017.taipei/home)及新聞公布。
- - 哪些選手報名本次2017臺北世大運賽會？幾時公布選手比賽場次或對戰組合，因為看不到特定選手幾點比賽故無法購票。
  - 非常歡迎大家進場為自己喜愛的選手加油，目前規劃106年7月19日完成所有選手之報名，8月10日召開技術會議並由國際技術委員抽籤後才能決定細部賽程與出賽項目，部分賽項將因區分量級故需看總報名人數決定比賽時間排定賽程。
- - 購買2017臺北世大運票券是否可享有其他附加價值？
  - （一）憑世大運門票於售票後至106年7月31日止，享有世大運紀念商品9折優惠，另於106年8月1日至8月31日則為購買紀念商品滿千折百優惠。（二）憑世大運門票享有星巴克買1第2杯半價優惠。（三）憑門票享有世大運合作宣傳店家之優惠，具體方案刻正洽談中。（四）於賽會期間進行競賽門票抽獎活動，將提供約1,000多項獎項，詳細活動辦法及獎項將於7月公布，敬請期待。
- - 為何本次世大運賽會採取「單日票」方式販售?
  - 為建立國內民眾付費觀賽之習慣，考量部分賽項非國人喜愛，且民眾普遍選擇觀賞中華隊出賽之比賽，如發售場次票，非中華隊比賽恐乏人問津。另正式比賽期間將保留約1至2成以內的門票於各競賽場館現場販售，由於場館座位數差異大，如撞球在花博爭艷館比賽，因座位數僅有約180席，故每日保留約40席；田徑在臺北田徑場比賽，因座位數達1萬4,000席以上，故每日保留約1,200席。由於數量有限，建議大家把握預購優惠提早購買。
- - 世大運大宗團購之規畫是否壓縮到一般民眾之購票權益?
  - 為了保障一般民眾購票之權益，2017臺北世大運執委會有設定各賽項大宗團購門票之數量上限，並於不同賽項保留可售票數約1-2成供現場民眾購票。
- - 此次2017臺北世大運購票系統沒有事先提供開、閉幕座位表，是否影響民眾搶票權益？
  - 開、閉幕票價只有三種，近八成的票價為低價位票價（開幕800元/閉幕500元），且購票為電腦配位，民眾購票只要選擇想要購買的票價即可進入搶票，所以不會影響大家搶票權益喔！
- - 世大運觀眾入場流程與注意事項?
  - 為安全考量，觀眾除須驗票外，尚須經安檢後方可入場，如長柄雨傘、自拍棒、銳利刀器等均不得帶進場。觀賞競賽如有攜帶瓶裝飲料須試飲；觀賞開閉幕表演，為避免民眾安檢排隊時間過長，不得攜帶瓶裝飲料入場，場內有提供生水直飲設備，請民眾自備環保杯。詳細違禁品清單預計於106年7月公布，請民眾多加注意，入場其他注意事項詳購票網站(https：//tickets.2017.taipei/)。
- - 觀賽民眾如何到達世大運各競賽場館呢？
  - 可透過賽會官方網站(https：//www.2017.taipei/home)查詢各場館交通方式。
- - 請問可以在哪些地方買到世大運紀念商品?
  - 1、實體通路目前共8處：市政府紀念品專賣店、中正紀念堂店、趣活大稻埕店、台中文創園區、台南藍晒圖店、高雄駁二店、高雄紅毛港店、松菸誠品店，花博majI市集。2、網路通路(有電子型錄) ：Main page： http：//summeruniver.qdm.com.tw/Message board： http：//summeruniver.qdm.com.tw/contact以上將販售到106年11月30日止。3、競賽期間，各決賽場館也會有紀念品攤位，歡迎前往選購。4、商品購買相關資訊請洽臺灣吉而好股份有限公司Phone： +886-2-2785-6699/陳經理E-mail： design288@cheerful.com.tw5、如果有其他相關問題請洽2017臺北世界大學運動會執行委員會商品服務組：E-mail： tms_lemei@mail.taipei.gov.tw
- - 世大運選手村在哪裡?
  - 世大運選手村位於新北市林口區文化一路及仁愛路交叉口周邊。
- - 世大運林口選手村共有幾戶？有幾種房型？
  - 選手村共34棟建物(12~21樓層)，其中劃分為住宿區及國際區，住宿區A、B、C 基地共23棟，國際區D基地11棟；總戶數為3,408戶，世大運期間約2,138戶做為住宿區使用。另房型共分1房型、2房型、3房型及4房型。
- - 世大運選手村提供選手哪些服務?
  - 2017臺北世大運選手村內提供之服務，除選手日常生活之食衣住行(住宿、選手餐飲、醫療、洗衣、交通等)服務外，亦提供其他賽事、商業、宗教、娛樂等服務。選手村在提供選手良好的住宿及用膳環境以及維護選手人身安全之大原則下，更 建置完善醫療服務，佈設便捷交通網絡，且能體驗臺灣文化之美，享受休閒娛樂設施放鬆身心。
- - 世大運選手村內有哪些設施？世大運結束了還會提供這些設施嗎？
  - 臺北世大運選手村除第一階段之國宅工程，亦包含第二階段選手村之附屬設施(預計於106年6月底完工)，如等候大廳、升旗廣場、選手村餐廳、安檢(認證)點、圍籬等等。世大運相關賽事結束後，將由本府新建工程處進行選手村附屬設施之拆除工作，除去為 臺北世大運新增之相關附屬設施，交還內政部營建署回歸原國宅使用。
- - 一般市民可以進出世大運選手村嗎?
  - 為保障2017臺北世大運各國參賽選手之人身安全，選手村內之維安工作需甚為嚴密，故選手村於營運期間以圍籬及安檢(認證)點阻隔外界，欲進出選手村均須持可通行選手村之認證卡，否則不得進出選手村內。
- - 世大運辦竣之後選手村會拍賣或是出租嗎?
  - 2017臺北世大運相關賽會結束後，選手村亦將於106年9月2日閉村，世大運選手村相關附屬設施拆除後，未來之林口國宅運用，目前規劃交由內政部營建署主導處分，配合都市整體建設，建構優質居住環境，並提供無自有住宅之家庭承租，進而有效改善大臺北都會區之居住問題。
- - 世大運交通資訊
  - 一、賽會期間各場館地下及周邊停車場均有管制措施，不對外開放臨停；原月租車需先行申請車證，且進入停車場前必須經過安全檢查通過。二、賽會期間請搭乘大眾運輸交通工具至場館觀賞賽事，如有場館距離捷運場站在500公尺外者，將增開接駁專車，自最近捷運站（如非雙北市，則自火車站）接駁至場館，大眾運輸交通資訊請至世大運官網查詢(https：//tickets.2017.taipei/)。
- - 2017臺北世大運場館外圍環境清潔噪音等問題如何處理？
  - 通報場館督導人員或環保志工，依通報流程指派相關權責單位清理。臺北市場館由所在轄區的清潔隊處理，外縣市由主營運中心聯繫所在縣市環保局處理。
- - 2017臺北世大運場館公廁設置貼心公廁之原因?
  - 規劃於世大運場館公廁設置馬桶坐墊消毒液供如廁者使用，營造貼心、安心之如廁環境。
- - 世大運場館廁所衛生紙可直接丟入馬桶嗎?
  - 場館廁所衛生紙請直接丟棄馬桶內，因衛生紙全面溶於水，不會造成管路堵塞；但面紙不溶於水，請丟入垃圾桶。
- - 世大運場館內髒污或垃圾滿溢要向何人反映?
  - 請向場館後勤組、志工、清潔人員或環保處駐場館人員反映均可。
- - 2017臺北世大運相關安檢規範
  - 有關本次賽事相關安檢規範(含違禁品清單)均建置於官網https：//www.taipei2017.com.tw/，請於前往觀賞賽事前先行上網查閱。
- - 2017臺北世大運安全維護規劃
  - 本次賽事相關場所(含競賽場館、練習場館、選手村及其他非競賽場館)，均已規劃相關安檢及認證流程，並加強選手專車自選手村出發至各場館之相關交通及安全維護作為
- - 世大運期間觀看比賽時遇到火災如何應變?
  - 當您進到場館時務必查看逃生動線圖並確認最近之出口及備用出口，觀看比賽過程如遇消防安全設備警報動作、目擊火災發生(如濃煙、火焰等)或經現場工作人員告知火災發生後，請聽從現場工作人員指示往出口移動，過程中切勿推擠，當逃生過程遭遇濃煙時，可將身體壓低，避免抬高頭部，以跪姿雙手爬行前進，成功抵達戶外安全地點後建議向家人報平安。臺北市政府消防局網站：http：//www.119.gov.taipei/
- - 當身體不慎著火時如何處置?
  - 切記「停、躺、滾」，不要亂跑立即停止躺下，身體左右滾動，這樣可使身上火焰熄滅。若手部沒有著火，可使用雙手保護臉部進行「停、躺、滾」，但若手部著火，必須將手垂放手掌緊貼褲縫再進行「停、躺、滾」。臺北市政府消防局網站：http：//www.119.gov.taipei/
- - 世大運場館的滅火器及室內消防栓要如何使用?
  - 應確認自身是安全無虞的情況下才可考慮滅火。滅火器使用方式為：提起滅火器-拉開安全插銷-拉出並握住皮管-瞄準火源根部並壓下手壓板-左右掃射。室內消防栓使用方式為：發現火災立即按下手動報警鈕-打開消防栓箱-取出瞄子-取下水帶-轉動制水閥射水。臺北市政府消防局網站：http：//www.119.gov.taipei/
- - 世大運期間觀看比賽時遇到地震如何應變?
  - 場館發生地震除了會劇烈搖晃，也可能造成天花板、電燈等物品掉落，對場館內人員造成生命危害，所以地震發生當下應立即進行自我保護，使用隨身背包、手提包等保護頭部，當停止搖晃後，聽從工作人員指示往戶外安全地點移動，過程中切勿推擠，成功抵達戶外安全地點後建議向家人報平安。臺北市政府消防局網站：http：//www.119.gov.taipei/
- - 2017臺北世大運防範恐怖攻擊措施
  - 一、加強賽事期間相關反恐情蒐作為，將危險阻絕於境外。二、配合中央相關維安單位執行各類維安暨反恐演習(練)及講習，提升維安人員執勤應變能力。三、賽會期間倘遇各類恐怖攻擊事件(含資訊安全、生物輻射攻擊、大量傷病患等)，將立即啟動相關應變機制，與中央各業務機關共同防處。四、透過正式報名、登錄、審核程序，核發識別證件，針對各類人員進出利用機器辨證，並以X光機、金屬探測門及手持式金屬探測器安檢後，方能進入特定場域；另針對進出場館或選手村車輛，以車底檢查器實施車輛安檢，以確實達到安全管制效果。
- - 2017臺北世大運各國參賽報名狀況
  - 目前有意願參與本屆賽事計153個國家，因應賽事採分階段報名，將於代表團個人報名表(I表)截止後取得各國最終報名狀況。
- - 2017臺北世大運報名選手、隊職員人數
  - 依代表團人數報名表(Q表)統計，截至106年6月3日，計128國完成Q表填寫，初步統計各國預估參與人數為1萬3,537人，其中包含選手預計9,355人、代表團官員4,182人，並將於代表團個人報名表(I表)截止後取得最終報名人數。
- - 如果民眾在世大運場館觀賽時身體不舒服或受傷，可獲得什麼協助？
  - 本次賽會於所有競賽場館皆設有觀眾救護站，配有護理師1名，救護技術員(EMT)2名，如遇民眾在觀賽時遇到傷病等情形，可就近洽救護站協助，或詢問服務台/服務人員協助引導。如有重大傷情經醫護人員判斷需後送時，將協助後送傷病患至指定醫院。
- - 世大運賽會相關人員反映有疑似傳染病症狀(如：發燒、肌肉痠痛、咳嗽持續3週、流鼻水、喉嚨痛、呼吸急促或困難、1天內嘔吐1-2次、1天內腹瀉3次(含)以上、皮疹、紅疹或水?等) 時，如何處理？
  - 選手請至選手醫護站或選手村醫療中心、觀眾請至觀眾救護站或鄰近之醫院就醫，為落實手部衛生及呼吸道禮節，場館及選手村防疫站備有乾洗手液、外科口罩及額耳溫槍等防疫物資供需要者使用。
- - 世大運賽會期間眾多國外人潮湧入，面對可能之境外移入病例，有何因應對策？
  - 已與中央疾病管制署及場館/選手村五縣巿衛生局建立跨縣巿防疫合作網絡，討論並訂定共同防治措施，疫情監視及通報平臺，訂定檢疫/通報/後送就醫標準作業流程，加強衛教宣導及防疫整備作業，規劃完成「三檢三防」之防疫架構，藉由團員自主健康管理、醫療院所加強TOCC(旅遊史、職業史、接觸史及群聚史)問診等防治作業，適時依疫情狀況採取不同強度之防治整備措施，確保各國代表團人員及國內民眾之健康安全。
- - 世大運期間有代表團成員於用餐後出現疑似食品中毒症狀(如：嘔吐、腹瀉等)該如何處理?
  - 代表團成員用餐後，如出現疑似食品中毒症狀(如：嘔吐、腹瀉等)，請立即通知隊醫、選手醫護站、醫療中心的醫護人員診治，醫療人員等相關工作人員會立即通報食品安全工作人員進行採檢、停餐處理，後續也請協助配合食品安全工作人員進行攝食情形、發病時間及症狀等相關調查。
- - 2017臺北世界大學運動會選手會有運動禁藥檢測嗎?
  - 2017臺北世界大學運動會遵守世界運動禁藥管制組織(WADA)規範及國際大學運動總會(FISU)禁藥管制規則，對參賽之受測選手進行運動禁藥檢測。
- - 世大運選手餐廳將設置多少個座位？供餐時段為何？供應那幾種飲食？
  - 一、世大運選手餐廳可提供3,500個座位。二、餐廳每日營運時間為上午05：00至次日上午01：00，長達20小時。三、選手餐廳供應歐洲/地中海、Halal、亞洲、素食、臺灣特色料理等飲食。四、世大運官網-選手餐廳網址：https：//www.taipei2017.com.tw/mode/fontList/9F3B621C-91AD-408E-B704-BF7C93F99281
- - 哪些世大運場館有設置觀眾餐飲販售區？觀眾餐飲販售品項有何特色？
  - 一、設置觀眾餐飲販售之場館如下：新竹縣立第二運動場、新竹縣立體育館、新竹縣立游泳館、陸軍專科學校體育館、國立臺灣大學綜合體育館、天母棒球場、臺北市和平實小附屬籃球館、臺北市網球中心、臺北田徑場(開閉幕攤位205)、新北市微風運河、迎風河濱公園溜冰場、臺北田徑場(開閉幕攤位214)。二、屆時將由喜憨兒基金會、國軍桃園總醫院附設沁心小站庇護餐坊、馬偕紀念醫院附設喜樂&沐陽工作坊及唐氏基金會等社福機構，推出學員親手製作之手工餅乾、天然水果手作冰棒及糕餅類等，並提供精緻伴手禮盒提供大家選購。
- - 世大運官方網站的網址是?
  - 使用瀏覽器填入2017.taipei/，或直接搜尋「臺北世大運」。世大運官網 https：//www.2017.taipei/home世大運FB粉絲專頁 https：//www.facebook.com/taipei2017
- - 世大運官方網站有英文版嗎?
  - 官網將會依照系統設定之語系調整中英文版本，網頁右上角也有提供相關按鈕供切換語系。
- - 世大運各競賽場館是否有提供無線網路?
  - 在各競賽場館戶外公共空間皆設置與iTaiwan系統相容之WiFi熱點，並有明顯標示，一般民眾皆可在熱點附近免費使用。
- - 世大運場館無線網路如何使用?
  - 世大運場館無線網路使用iTaiwan系統，按照一般使用情形，連結Wi-Fi後會自動連結網頁顯示申請介面，使用電話號碼申請帳號，即能正常使用網路。
- - 中度、重度失能長者交通接送服務收費標準為何？
  - 本局補助服務對象交通費每人每月最高8趟，單趟補助上限為105元。錶計實際金額未達105元依福利身分別乘以自付比率支付，錶計實際金額超過105元者，105元以內依福利身分別乘以自付比率支付，超出105元部分亦由服務對象自行負擔。（自付比率：1.領取低收入戶、中低老津7,463元補助者－0％；2.領取中低老津3,731元、非列冊低收入身心障礙者生活補助者－10％；3.一般戶－30％。）
- - 中度、重度失能長者交通接送服務受託單位為何？
  - 一、世豪小客車租賃有限公司，訂車專線：0800-010908、02-87927758。二、福倫交通股份有限公司，訂車專線：412-8789。
- - 2017第十屆臺北藝穗節FAQ
  - 2017「第十屆臺北藝穗節」一、活動時間：8/20∼9/10二、活動網址：www.taipeifringe.org 三、活動專線電話：(02)2528-9580#191-199（台北市文化基金會）
- - 低收入戶申復多久可收到公文？
  - 原則上備齊應附資料後20個工作天。
- - 因配合衛生紙丟馬桶政策而造成馬桶阻塞時環保局有協助疏通嗎?
  - 列管公廁因配合衛生紙丟馬桶政策而造成馬桶阻塞時，至106年12月底前，環保局可協助進行疏通，協助疏通資訊平時請播1999轉分機4540，例假日時請轉本局勤務中心，並留下通報單位聯絡方式，將由負責人安排馬桶阻塞疏通作業。
- - 大安親子館開放時間、服務內容、服務對象、預約方式?
  - 一、地址：臺北市大安區延吉街246巷10號1至3樓(鄰近信義安和站5號出口)二、電話：(02)2325-4399 三、開放時間：週二至週五9：30~12：00、14：00~17：00，週六及週日9：30~11：00、13：00~14：30、15：30~17：00。每週一及經政府公告之放假日為休館日。四、設施及活動規劃：本館以藝術和自然科學為主軸，為孩子們提供多元化的選擇。一樓規劃有：香草植物花園區、生態觀察區、just play就醬玩區、視覺追追追區；二樓規劃有0∼3歲baby house、親子藝術創作區、啃書區、海洋世界區、大型玩物區、可愛動物區、小舞台的大世界區；三樓規劃有聲音遊戲區、戲穀區、可愛動物區。五、服務對象：6歲以下兒童及其照顧者，共60對。(網路預約40對，現場排隊20對)。六、網路預約者,請於該場次開始後15分鐘內報到，請遵守時間規定，否則將視為無預約，需現場排隊。
- - 申請身心障礙者輔具費用補助是否有設籍時間限制？
  - 一、申請身心障礙者輔具費用補助沒有設籍時間限制。二、身心障礙者輔具費用補助新制自101年7月11日起施行，申請資格如下：  1.設籍臺北市。  2.領有臺北市核（換、補）發或註記之身心障礙手冊或證明；最近一年居住國內達183日。  3.申請補助項目係未獲政府其它醫療補助、社會保險給付或相同性質（輔助器具）之補助者。  4.已超過輔助器具之補助年限。  5.補助內容：詳見衛福部「身心障礙者輔具費用補助辦法」、「身心障礙者輔具費用補助基準表」及其他相關規定。（可向區公所社會課索取或至臺北市政府社會局網站www.dosw.taipei.gov.tw下載）
- - 2017臺北夜市打牙祭活動
  - 一、計畫名稱：夜市時尚秀  粉絲們動吃動二、主辦單位：臺北市市場處三、參與夜市：寧夏夜市、雙城街夜市、遼寧夜市、延三夜市、華西街夜市、梧州街夜市、臨江夜市、廣州街夜市四、活動期間：7月21日起至8月5日五、活動內容（詳情可至臺北夜市好康特搜團臉書粉絲團查詢）（一）記者會1.日期：7/21（五）1700-19002.地點：寧夏夜市3.現場除開幕表演外，並有夜市十大美食票選啟動儀式及美食巡禮。（二）網路活動1.日期：7/9(日)-7/20(四) 2.包含十大臺北夜市美食票選、捕獲夜市食尚家、表特夜市男女神人等活動。（三）夜市音樂會1.日期：8/5(六)2.地點：廣州街夜市。
- - 建國假日玉市30週年慶
  - 一、計畫名稱：玉見，一個城市的美好價值二、主辦單位：社團法人中華玉器藝術文化交流協會（聯絡人：王煜斌，電話：2708-5931）三、補助單位：臺北市市場處四、實施地點：臺北市建國假日玉市五、活動期間：7月19日起至8月13日（每週六、日）六、活動內容（詳情可至建國假日玉市臉書粉絲頁查詢）（一）開幕活動1.日期：7/22(六)13：30-14：002.現場除開幕儀式外，並舉辦走秀活動。（二）展覽活動1.日期：7/22(六)-8/13(日) 每周六日2.現場將規劃珠寶展示、花藝展示、時尚穿搭展示。（三）促銷活動1.日期：7/22(六)-8/13(日) 每周六日2.連續四週促銷活動，包含捐血送贈品、福袋購買、加價購及滿額抽獎等。
- - 若我的孩子目睹家人間的暴力，該如何處理？
  - 若有18歲以下之兒童及少年目睹家庭暴力，可撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。本中心亦有結合民間社福團體資源，透過個案及團體輔導方案介入，協助目睹家庭暴力兒童及少年心理創傷之重建與復原，並建立其對暴力之正確認知及因應策略，進而促進其人格健全發展。承辦單位：財團法人天主教善牧社會福利基金會，負責區域：內湖、南港、信義、大安、文山、大同，連絡電話：(02)02-23811123。財團法人台北市婦女救援社會福利事業基金會，負責區域：士林、北投、中正、萬華、松山、中正，連絡電話：(02)2555-5595 。
- - 請問低污染排放示範區稽查執行作法為何？
  - 依據空氣污染防制法第40、41及42條規定，機動安排人力於低污染排放示範區加強取締高污染車輛；稽查執行作法為未定檢稽查、排氣檢驗稽查及目測判煙稽查等，相關細節請洽環保局空污噪音防制科，電話：1999(外縣市02-27208889)轉7248。
- - 開設網路商店或在網路上販售物品，要如何辦理商業登記
  - 所謂網路商店是指透過網路虛擬通路販賣商品，而網路行銷、直銷或店鋪貨架銷售方式為行銷通路手段。如原已以店面方式經營零售類業務，並透過網路行銷方式販賣商品，申請商業登記則與一般商店無異，其營業項目則須視販賣何種商品而定。
- - 北投親子館地址、電話、一般開放時間、服務內容、服務對象、預約方式?
  - 一、地址：臺北市北投區光明路22號(捷運北投站光明路出口，正隆麗池大樓內)。二：電話：02-28983217三、開放時間：週二至週五9：30~12：00、14：00~17：00，週六及週日9：30~11：00、13：00~14：30、15：30~17：00。每週一及經政府公告之放假日為休館日。四、設施及活動規劃：1樓為體能遊戲區，設有巨型樹屋及舞台，提供0至3歲體能遊戲及3至6歲體能扮演；2樓為自由探索區，設有親子廚房、益智科學、文化探遊、積木建構、語文閱讀、藝術創作、0-2歲感官動作探索區。五、服務對象：6歲以下兒童及其照顧者。六、使用北投親子館是不需要付費的喔！但為了控管使用品質，每場次限制80對親子使用(50對網路預約，30對現場排隊)。
- - 內湖親子館地址、電話、一般開放時間、服務內容、服務對象、預約方式?
  - 一、 地址：臺北市內湖區內湖路1段659號2樓(捷運文湖線港墘站共構大樓)二、 電話：02-7709-7990三、 開放時間：週二至週五9：30~12：00、14：00~17：00；週六、日9：30~11：00、13：00~14：30、15：30~17：00。每週一及經政府公告之放假日為休館日。四、 服務對象：未滿6足歲兒童及其照顧者五、 設施及活動規劃：寶貝探索區、阿公阿嬤的家、活力健身房、我的城堡、動手玩創意、溫暖小空間、幸福繪本角落等。六、 使用方式：為控管使用品質，每場次限制50對親子使用(35對網路預約，15對現場排隊)。如預約相關空間及活動請點選以下網址↓臺北市親子館介紹及預約網站https：//taipei.parent-child.org.tw
- - 南港親子館地址、電話、一般開放時間、服務內容、服務對象、預約方式?
  - 一、地址：臺北市南港區八德路4段768之1號1、2樓(松山國小斜對面、松山火車站東邊出口步行約3~5分鐘)二、電話：02-26533310三、開放時間：週二至週五9：30~12：00、14：00~17：00，週六及週日09：30~11：00、13：00~14：30、15：30~17：00。每週一及經政府公告之放假日為休館日。四、設施及活動規劃：結合感覺統合、城堡探險、繪本共讀、益智操作、樹屋及角色扮演的童話世界，讓親子共玩、共享及共樂。五、服務對象：6歲以下兒童及其照顧者。六、使用方式：每場次開放30對親子，採網路或現場預約（15對網路預約、15對現場排隊）。如預約相關空間及活動請點選以下網址↓臺北市親子館及育兒友善園網站https：//parent-child.taipei/
- - 低收入戶申請條件中，規定士地及房屋價值不得超過740萬元，若房子有貸款中，是否會扣除貸款額度？
  - 依據社會救助法第4條規定，低收入戶指經申請戶籍所在地直轄市、縣 （市） 主管機關審核認定，符合家庭總收入平均分配全家人口，每人每月在最低生活費以下（106年度為15,544元），且家庭財產未超過中央、直轄市主管機關公告之當年度一定金額者（包括動產、不動產，動產限制平均每人存款及投資不得超過15萬元，不動產限制全家人口之土地及房屋價值合計不得超過740萬元）。有關土地價值之計算，以公告土地現值為準據；房屋價值之計算，以評定標準價格為準據。如名下房屋為銀行貸款所購得，依上揭規定及內政部91年2月5日函釋略以：「申請者不動產總值尚不能與貸款相互扣抵」，故不得扣除貸款額度.
- - 如果?有收到當年度定期開徵之使用牌照稅、房屋稅或地價稅稅單，可否直接至便利商店補單繳納稅款？
  - 您可持自然人憑證/工商憑證（於定期開徵起日前5個日曆天至開徵迄日屆滿後2日23時）至4家便利商店(統一、全家、萊爾富及來來OK）之多媒體機kiosk進行查詢當年度定期開徵之稅目資訊，勾選列印繳納單並至店家櫃台掃描條碼完成繳稅，每筆金額限新台幣2萬元以下，開徵期結束後，由稅捐稽徵處統一寄發繳納證明。
- - 如何以健保卡進行線上查繳稅服務?
  - 各項定期開徵之地方稅，您可於定期開徵起日前5個日曆天至開徵迄日屆滿後2日24時止，至地方稅網路申報作業網站(網址： https：//net.tax.nat.gov.tw/)點選「線上查繳稅」連結，以健保卡或自然人憑證登入驗證，進行全國地方稅線上查繳稅服務。提醒第一次使用健保卡登入，須先到衛生福利部中央健康保險署「健保卡網路服務註冊」網站完成註冊，取得會員密碼，再以健保卡插入電腦讀卡機，才能進行線上查繳稅服務。
- - 什麼是石頭湯（社區整合照顧服務）？
  - 本局從社區端出發，擇定高齡人口集中的國宅開辦石頭湯計畫，於內湖區東湖社區、松山區壽園國宅、中正區新隆社區及大同區蘭州國宅設立整合式服務站，由具有社工或護理背景者擔任個案管理專員，針對長者需要，提供走動式居家服務、在宅醫療服務、居家護理服務、居家藥師服務、營養餐飲服務、輔具及居家環境改善服務、居家復健服務、志願服務。服務對象為設籍並實際居住於本市內湖區康寧里、明湖里、金湖里；松山區民福里、精忠里、中華里；中正區新營里、龍福里、南福里；大同區斯文里、揚雅里、蓬萊里，日常生活需他人協助之失能者，包括：（一）65歲以上老年人；（二）50歲以上之身心障礙者；（三）僅工具性日常生活活動功能（IADLs）失能且獨居之老年人，另自106年4月29日起於文山區萬芳社區及萬芳里、木柵里、木新里亦開始提供整合式服務。
- - 未成年之兒童、少年、身心障礙少年,遭遺棄虐待、未受適當養育照顧(如長期未進食)或父母生病、入獄等,需緊急安置者
  - 由家防中心(02-23961996轉226至228)先行緊急協助,於上班時間再轉介權管單位
- - 申請進住臺北市政府婦女中途之家(原稱慧心家園)的應備文件為何？
  - 1、臺北市政府婦女中途之家進住申請書。2、最近三個月內全戶戶籍謄本(記事欄勿省略)3、國稅局稽徵所開立之最新年度各類所得資料清單及財產歸屬資料清單。(申請人及申請進住之子女)4、3個月內區域級以上醫院一般體格健康檢查證明，含胸部X光檢查，免血液、尿液檢查。(申請人及申請進住之子女)5、其他證明文件，如低收入戶卡影本、學生證影本、身心障礙證明(手冊)影本、離婚判決書及確定書影本等。若有其他疑問可洽詢婦女中途之家社工人員，洽詢電話：02-2701-1828。
- - 三位子女以上家庭社會局有什麼補助?
  - 衛生福利部社會及家庭署（原內政部兒童局）辦理三位子女以上家庭家庭部分托育費用補助（本項補助不得與育嬰留職停薪津貼重複請領），戶籍登記為同一母親或父親，有三位以上子女之家庭，其未滿2歲幼兒需送請加入社區保母系統之保母或合法立案托嬰機構照顧者，每月補助2,000~3,000元；中低收入戶每名幼兒每月最高3,000~4,000元；低收入戶家庭、家有未滿2歲之發展遲緩或身心障礙幼兒之家庭、特殊境遇家庭或高風險家庭者，每月補助4,000~5,000元。
- - 如何申請舊衣回收？
  - 1、舊衣回收業務的申請、審核及執行查核的主管機關為本府環境保護局，社會局則協助身心障礙福利團體的立案資格認定。2、有關申請資格問題，申請單位屬身心障礙機構洽社會局身心障礙者福利科-市話或手機直撥1999轉分機1615，屬身心障礙福利團體者則請洽社會局人民團體科-市話或手機直撥1999轉分機6957；另有關舊衣回收箱之設置、管理、會勘等問題，則請撥環保局-市話或手機直撥1999轉分機7270。
- - 三位子女以上家庭部分托育費用補助何時撥款?
  - 本項補助之新申請案因配合衛生福利部社會及家庭署統一查調申請人稅率.就業.以及領取其他補助比對資料，採按月審核，並配合撥款所需行政作業期程，第一次申請需2至3個月作業時間，爾後每月補助款將於次月（原則上每月24日；遇假日提前至上班日）撥入申請表所填之郵局帳戶。
- - 大同親子館地址、電話、一般開放時間、服務內容、服務對象、預約方式?
  - 一、地址：臺北市大同區涼州街2-16號(捷運大橋頭站2號出口，首善大樓內)。二、電話：02-25571403三、開放時間：週二至週五9：30~12：00、14：00~17：00，週六及週日9：30~11：00、13：00~14：30、15：30~17：00。每週一及經政府公告之放假日為休館日。四、設施及活動規劃：規劃有大空間積木區、體能活動區、操作體驗區、繪本區、幼兒探索區等。其中1樓空間為混齡區，提供6歲以下親子使用；2樓空間為2歲以下親子專屬空間。五、服務對象：6歲以下兒童及其照顧者。六、使用大同親子館是不需要付費的喔！但為了控管使用品質，每個場次限制60對親子使用(35對網路預約，25對現場排隊)。
