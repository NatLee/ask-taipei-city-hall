- - 如果性騷擾受害人不服調查結果，如何進行再申訴？
  - 在調查結果通知到達之次日起30日內(含假日，並以再申訴書送達日為準)，向直轄市、縣(市)主管機關提出再申訴，臺北市性騷擾再申訴電話為1999轉分機3365或4553。
- - 對他人性騷擾會有什麼樣的處罰？
  - 依性騷擾防治法第20條規定，對他人性騷擾者，可由主管機關處1萬至10萬元罰鍰。如果性騷擾行為構成性騷擾防治法第25條之規定，還會觸犯刑事責任，可處2年以下有期徒刑、拘役或科或併科新台幣10萬元以下罰金，此項刑罰責任屬告訴乃論。另依性騷擾防治法第9條規定，被害人可要求加害人負損害賠償責任。
- - 民眾於非上班時間詢問性騷擾申訴或再申訴如何處理的問題？
  - 因為性騷擾申訴或再申訴問題的處理，涉及保密及專業處理程序，請您留下姓名與電話，將於上班時間由性騷擾防治承辦人員和您聯絡。（請1999話務中心於上班時間將詢問民眾的姓名、電話通知承辦人員3365或4553。）
- - 民眾如遭受性騷擾案件，加害人不明或不知有無所屬時，應如何處理為最快速的申訴管道？
  - 民眾遭受性騷擾事件，如加害人不明或不知有無所屬時，向臺北市性騷擾防治委員會提起申訴時，尚需移請事件發生地警察機關調查。另，如民眾遭遇性騷擾事件涉及刑事告訴，因刑事告訴期間為事件發生後六個月內，性騷擾申訴期間為事件發生後1年內，為使民眾免於警察機關及性騷擾防治法主管機關間奔波且為爭取時效，仍建議民眾親自至警察機關除提出性騷擾事件申訴外，亦可洽詢警察人員是否可提出刑事告訴，此為最快速的申訴管道。
