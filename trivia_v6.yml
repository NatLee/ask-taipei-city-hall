- - 2016台北河岸音樂季-「8/6大稻埕情人日」當日周邊交通管制情形為何?
  - (一)活動周邊道路交通管制1.第一階段：8月6日18時30分至23時，管制範圍北至涼州街（不含涼州街）、東至延平北路-塔城街 (不含延平北路、塔城街)、 西到環河南、北路（含道路）以東、南起忠孝西路(不含忠孝西路)，禁止車輛通行。2.第二階段：8月6日20時20分至21時30分，承德路民生西路口設置管制點（以利人潮疏散），禁止車輛往西行駛。(二)水門管制措施1.車輛管制：8月6日6時起淡3-5號水門管制，車輛只出不進；淡1、淡3、淡5號水門17時30分起至23時，車輛皆不能進出。4號水門為緊急應變通道，17時至23時封閉。2.自行車管制：8月6日14時至23時1-6號水門、臺北橋由新北市引入之自行車道斜坡入口及社子島入口自行車道處管制進入通行。(三)行人管制：8月6日18時30分至23時，迪化污水處理場大地重現人行天橋淨空，另敦煌景觀平台容留量管制上限3,000人，且自行車禁止進入。(四)YouBike暫停服務：8月6日16時30分至24時暫停營運，捷運北門站3號出口、大稻埕公園站、聯合醫院中興院區等不提供借還服務。1.停車管制措施： 3號至5號水門間堤外停車場8月6日6時至23時淨空，且堤外道路停車格取消。2.民生西路（延平北路至重慶北路段）路邊停車格8月6日12時至23時取消及禁止臨時停車。3.民生西路（環河北路至重慶北路）、延平北路（民權西路至忠孝西路）8月6日12時至23時取消假日黃線停車，禁停黃線路段及法定禁止臨時停車處延長違規停車拖吊時間至當日23時止。4.活動期間忠孝橋、臺北橋、環河快速道路及周邊道路加強違規停車取締，對緩行逗留車輛會管制驅離。5.勞動部(延平北路2段83號)及民生西路(3巷至45巷)，8月6日12時至23時取消機車停車格(人行道上及騎樓機慢車停放區)。(五)船班管制：8月6日當日15時藍色水路船班駛離大稻埕碼頭，至21時始得停泊。
- - 從哪裡可以得到老人福利服務資訊？
  - 臺北市老人福利服務項目繁多，詳細資料可上臺北市社會局網站http：//www.dosw.gov.taipei/查詢相關銀髮族服務或參閱本市市民手冊。
- - 「七夕相約去台北」時間？對象？特色？內容？
  - (1)站體展示：   於7月27日起至8月12日止，於台北市旅遊服務中心各站體布置七夕節慶意象，可以看到可愛的喜鵲，以及Q版的牛郎織女於站體迎賓，感受七夕節慶浪漫的氛圍，歡迎國內外旅客來台北過七夕，度過浪漫的情人節。值得一提的是，台北101/世貿站旅遊服務中心特別設置大型粉紅色的愛心裝置藝術，並整理出台北最適合約會的浪漫景點提供旅客參考。(2)「七夕相約去台北 喜鵲去哪兒？」遊戲體驗活動：   於8月3日起至8月9日每日於上午11點、下午2點及下午4點於台北市各旅遊服務中心舉辦「七夕相約在台北 喜鵲去哪兒？」的七夕情人節活動，旅客至各旅服中心和旅服員一起玩九宮格小遊戲，只要翻出喜鵲，就可獲得限量七夕專屬明信片1張，如果於遊戲九宮格內連線成功，另加碼贈送限量行李吊牌！明信片及行李吊牌每場次數量有限，送完為止；另活動各場次期間在西門站、台北101/世貿站、大稻埕站3處旅服中心有專設「喜鵲快遞」郵筒，將免費提供代寄明信片傳遞幸福。
- - 目前臺北市是否有辦理「105年工業及服務業普查廠商基本資料判定作業」?其調查期間、內容及目的為何?
  - 臺北市政府主計處為配合行政院主計總處辦理「105年工業及服務業普查廠商基本資料判定作業」，於105年8月22日至10月7日期間派員至廠商進行訪問，訪問內容包括實際經營型態、單位名稱、營利事業暨扣繳單位統一編號、實際營業地址、負責人姓名及電話、主要產品或經營業務等；其主要目的係先期掌握廠商營運情形，以提升工商及服務業普查名冊之正確性，俾利普查作業之推展。訪查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作。
- - 如何申請弱勢家庭兒童及少年生活扶助及應準備那些文件？向那些單位申請？
  - 1、（1）申請表。（2）全家人口最近1年度所得及財產證明文件。 （全家人口係指「兒童或少年」、「與兒童或少年實際共同生活之直系血親（父母、祖父母）」、「兒童或少年之兄弟姐妹」，不分年齡、所得、財產狀況皆須檢附）（3）、學生證正反面影本。（無則免） （4）存摺封面影本。 （5）足資證明有本作業規定第2點各款情形之相關文件。 （請參照申請表「檢附文件」欄有關「其他相關證明文件影本」部分）2、（1）可郵寄申請文件至臺北市政府社會局兒童及少年福利科 （寄件地址：11008臺北市信義區市府路1號2樓），或親持辦理（洽公地址：11049臺北市信義區信義路5段15號5樓）。（2）申請人已接受本局或本局委託之相關單位（含社會局各區社福中心、公設民營婦女服務中心、兒少服務中心等）服務者，則可逕交由該單位向本局提出申請。單位：社會局兒少科聯絡人：江先生聯絡電話：27256972-4
- - 我沒有老人健保補助，是因為居住國內天數未滿183天而不符資格，請問我要到哪裡申請入出國日期證明書?
  - 入出國日期證明書請向內政部移民署各地服務站(臺北市服務站地址：臺北市中正區廣州街15號，電話：02-23889393）申請，申請規費100元整。
- - 有關老人健保補助有規定最近1年在國內要居住183天，請問這最近1年是怎麼計算的?
  - 所謂最近1年係採補助當月（或申請日）往前推算1年為最近1年，以100年6月保費補助為例，核算期間應為「99年6月1日至100年5月31日」，或者提出申請日期為100年6月15日，則核算時間為「99年6月15日至100年6月14日」，而非以年度計算。
- - 如何加入銀髮友善好站？
  - 1.銀髮友善好站場地需符合「經常性開放、位於1樓或設有電梯之樓層、出入通道便利長者進出」之單位及商家，以提倡敬老之美德，並於長者有需要時提供「提供休息座椅、提供洗手間、電話協助及福利資訊交流」4項服務。2.銀髮友善好站申請表格至社會局網站下載（http：//www.dosw.gov.taipei/）(點選銀髮族服務/敬老優待/銀髮友善好站)
- - 重陽節禮金洽詢單位為何？
  - 請洽社會局老人福利科；電話1999(外縣市02-27208889)轉6967。
- - 我的老人年金(敬老福利生活津貼)沒撥到帳戶，怎麼辦?
  - 老人年金(不論敬老福利生活津貼或國民年金之老年基本保證年金)由勞保局審核撥款，請洽02-2396-1266轉6066。
- - 什麼是以房養老？該如何申請？
  - 為提供本市銀髮長者多元經濟安全保障，臺北市政府社會局委託財團法人國土規劃及不動產資訊中心(服務平台) 辦理本實驗方案，以協助長者將其自有之不動產轉化為按月領取之養老給付，安定長者生活，落實「在地老化」目標(實驗方案於104年7月10日已受理截止)。網站：http：//rmsc.ippi.org.tw/　如有相關以房養老需求，可洽現階段市場上辦理以房養老辦理銀行： 1、合作金庫商業銀行，連絡電話：(02)2331-7531分機8122、臺灣土地銀行，連絡電話：(02)2348-3360；2348-3357；2348-37873、臺灣中小企業銀行，連絡電話：(02)2559-7171分機3441、34214、第一商業銀行，連絡電話：(02)2348-1111或0800-0101085、華南商業銀行，連絡電話：(02)2371-3111分機2021或(02)2181-0101 6、臺灣銀行，連絡電話：(02)2349-3456；2182-1901或0800-0251687、中國信託商業銀行，連絡電話：0809-066666分機28、台新國際商業銀行，連絡電話：0800-000456分機2   臺北市公益型以房養老實驗方案已受理截止。商業型方案請洽各銀行辦理。
- - 105年8月27日(星期六)中午12時起至8月28日(星期日)全日，本市各區戶政事務所暫停受理假日預約結婚登記業務
  - 一、為因應雲林縣斗六市、莿桐鄉及林內鄉戶政事務所自105年8月29日整併為雲林縣斗六戶政事務所，內政部執行戶役政系統各項資料調整，105年8月27日（星期六）中午12時起至8月28日（星期日）全日，本市各區戶政事務所暫停受理假日預約結婚登記業務。二、結婚的新人如欲指定105年8月27日或8月28日為結婚登記日者，可在結婚登記前3個辦公日內，即105年8月24、25日及26日向戶政事務所辦理「指定」結婚登記日為105年8月27日或8月28日。
- - 溫泉用戶可以申請分時供應嗎？
  - 1.依本處附設溫泉營業章程第9條，本處溫泉供應如有供應已達飽和、供應有特殊困難、供應有不穩定之虞時，得暫緩接受用戶溫泉新設、改裝及分時供應之申請。2.目前為維持溫泉取供穩定供水，暫停分時供應申請。
- - 如何報名成為志工？
  - 可上CV101志工媒合平台(http：//volunteermatch.cv101.org.tw/volunteer-match)尋找合適的志工運用單位，或逕洽02-23023993臺北市志願服務推廣中心。
- - 成為志工資格為何？
  - 各運用單位之甄選標準不同，需由各運用單位先進行面談。若有疑問請電洽臺北市志願服務推廣中心02-23023993。
- - 志工要接受哪些訓練？
  - 依志願服務法要接受基礎訓練和特殊訓練後，發給志願服務證和志願服務紀錄冊始成為志工。若有疑問請電洽臺北市志願服務推廣中心02-23023993。
- - 國民年金保險被保險人所得未達一定標準者補助標準為何？
  - 1、家庭總收入平均分配全家人口，每人每月未達當年度最低生活費1.5倍，且未超過台灣地區平均每人每月消費支出之1倍者（本市106年度標準為20,421元），自付30%，政府補助70%。2、家庭總收入平均分配全家人口，每人每月未達當年度最低生活費2倍，且未超過台灣地區平均每人每月消費支出之1.5倍者（本市106年度標準為30,631元），自付45%，政府補助55%。
- - 申請國民年金所得未達一定標準資格認定，應檢附哪些證明文件？
  - 1、必備文件：申請書及最近3個月內全家人口新式戶口名簿(含詳細記事)影本或身分證明文件各1份2、其他證明文件，說明如下： (1)現有實際工作者檢附服務單位開具之最近3個月內薪資證明影本（如未附薪資證明者，工作收入依社會救助法第5之1條規定計算。）。(2)外籍或大陸地區人士應檢附身分證明文件（須附中譯本並須經相關公證、驗證程序）或有效期限居留證影本。(3)身心障礙者應檢附身心障礙手冊或證明影本。(4)服兵役或替代役現役者應檢附服兵役或替代役現役之證明影本。(5)年滿16歲以上、25歲以下在學者應檢附學生證正、反面影本。(6)在學並領有公費者應檢附在學及領有公費之證明影本。(7)服刑、羈押、拘禁證明影本。(8)失蹤協尋報案單影本。(9)公立醫療機構或評鑑合格醫院開立之最近1個月內診斷證明書影本。(10)受監護宣告之證明文件影本。(11)其他：失業認定及失業給付證明、勞工保險年金給付/國民年金保險年金給付/退休金（俸）/遺屬撫恤金等定期給付相關證明影本、低收入戶證明影本、離職證明、參加職訓及請領職訓津貼證明、求職證明及就業媒合介紹卡等影本。(12)代理人身分證明文件影本1份。
- - 國民年金老年基本保證年金每月可以領多少錢？
  - 長者如符合國民年金法第31條規定，經勞保局審查符合資格，可每月領取3628元之老年基本保證年金。詳細申領標準及條件，請逕洽勞保局（洽詢電話02-23961266）
- - 國民年金身心障礙基本保證年金每月可以領多少錢？
  - 被保險人如符合國民年金法第35條規定，經勞保局審查符合資格，可每月領取4872元之身心障礙基本保證年金，依規定請領身心障礙基本保證年金者，不得再請領身心障礙年金給付，但其於年滿65歲時，得改領老年年金給付。詳細申領標準及條件，請逕洽勞保局（洽詢電話02-23961266）
- - 具有低收入戶資格，要怎麼辦理第五類健保加保？
  - 請持低收入戶卡至戶籍所在地區公所辦理。
- - 目前為低收入戶，但取得低收入戶資格之前，已欠下健保追繳款，是否會因繳不出追繳款而被停止使用健保就醫？
  - 在有低收身分時不會停健保，因目前健保費由衛生福利部社會及家庭署支付。(但之前的欠款仍需自行處理)
- - 對國民年金被保險人所得未達一定標準資格核定公文有疑義，該怎麼辦?
  - 可於上班時間電話洽詢「戶籍所在地區公所」承辦人，對該核定公文如仍不服，請檢具申請書及相關證明文件重新提出申請，或自公文送達之次日起30日內，採行政救濟途徑。
- - 申請衛生福利部補助社區發展工作之申請辦法？
  - 1.各社區發展協會按梯次於當年度1月25日前及3月15日、6月15日及9月15日送轄內區公所初審。
- - 請問若申請通過所得未達一定標準資格,市政府會直接將錢撥到民眾的帳戶嗎?
  - 不會,民眾若申請通過所得未達一定標準資格,社會局會將符合資料彙送至勞保局並繳付保險費,民眾收到的繳費單上將會註記保險費減免資格並沖減保險費,市政府並不會直接將錢撥到民眾的帳戶.
- - 申請國民年金所得未達一定標準資格認定(保險費補助)，應向哪一單位提出申請？無法親自辦理時，可否委託他人代為申請？
  - 1、受理機關為戶籍所在地區公所(社會課)。2、被保險人無法親自向辦理機關提出申請時，得填具委任書委任代理人代為申請。
- - 申請國民年金所得未達一定標準資格認定，計算所得未達一定標準之「全家人口」包含哪些人？
  - 除被保險人外，包括下列人員：1、配偶。2、一親等之直系血親。3、同一戶籍之其他直系血親。4、認列綜合所得稅扶養親屬免稅額之納稅義務人。但有下列情形之一者，不計入全家人口：1、尚未設有戶籍之非本國籍配偶或大陸地區配偶。2、未共同生活，且無扶養能力之已結婚直系血親卑親屬。3、應徵集召集入營服兵役或替代役現役。4、在學領有公費。5、入獄服刑、因案羈押或依法拘禁。6、失蹤，經向警察機關報案協尋未獲，達6個月以上。
- - 經審查符合國民年金所得未達一定標準者，如有戶籍遷徙，是否應重新申請？
  - 申請符合所得未達一定標準者，如戶籍遷出本市時，應向新戶籍所在地之直轄市、縣（市）主管機關重新提出申請，惟如於市內遷徙時，應於1個月內向戶籍所在地區公所通報。
- - 經核定符合國民年金所得未達一定標準者，是否須每年重新申請一次？
  - 如補助資格未變更且戶籍未遷出本市時，得免重新申請，惟本市至少每2年為期定期辦理所得未達一定標準者之資格認定清查。如發現資格不符者停止補助保費。
- - 經審查符合國民年金所得未達一定標準者，戶籍遷出本市後再遷回，是否須重新申請？
  - 為簡化申請程序，經審查符合所得未達一定標準者，於核定之日起2年內，如因戶籍遷徙致資格變更者，戶籍遷回本市時，應書面向戶籍所在地區公所通報，得無庸重新檢附申請文件。
- - 申請成立社區發展協會的資格
  - 居住且戶籍設於本市同一組織區域，年滿20歲，並有30人以上共同發起。
- - 申請成立社區發展協會之流程？
  - 備齊相關文件後至戶籍地所轄區公所社會課申請。
- - 申請成立社區發展協會準備文件有哪些？
  - 1、申請書。2、發起人名冊。3、章程草案。4、發起人身分證影本。
- - 申請衛生福利部補助社區發展工作之資格？
  - 本市核准立案之社區發展協會或人民團體。
- - 申請成立社區發展協會之資料要送到哪裡？（申請單位為何？）
  - 戶籍所在地區公所。
- - 申請成立社區發展協會資料可至哪個單位索取？
  - 1、有關申請表件請逕向各區公所索取或上市民E點通網頁下載。2、組織區域一覽表請逕向各區公所索取或上本局網頁下載。(www.dosw.gov.taipei)
- - 申請衛生福利部補助社區發展工作之相關資料可至哪個單位索取？
  - 1、有關申請表件請逕向各區公所索取或上本局網頁下載。2、有關社區發展協會欲申請其他部會局處相關補助，請逕上本局網頁下載「以社區發展協會為計畫補助申請對象之經費補助項目一覽表」。(www.dosw.gov.taipei)
- - 經審查符合國民年金所得未達一定標準者，退保後再加保時，是否須重新申請？
  - 無須重新申請。為簡化申請程序，經審查符合所得未達一定標準者，於核定之日起2年內，如因加、退保致資格變更者，再加保時，得無庸重新申請。
- - 民眾是否須申請加入國民年金保險？
  - 不需申請，勞工保險局會針對符合加保資格的民眾主動寄發保險費繳款單。 （勞保局洽詢電話：02-23961266）
- - 不繳納國民年金保險費會有何影響？
  - 1、 逾期繳納保險費的期間應加計利息。2、 國保的保險年資是按實際繳納保險費的月數計算，不繳納保險費就沒有保險年資。3、 在未繳清保險費及利息前，如發生保險事故，勞工保險局會暫時不予支付保險給付。
- - 一般民眾僅須負擔60%的國民年金保費，若一時找不到工作或家裡貧窮者，國民年金的保費如何繳納？
  - 1、低收入戶，其保費由政府全額補助。2、所得未達一定標準者，只要負擔30%或45%的保費。3、身心障礙者依障礙程度，可免繳保費或只要負擔30%或45%的保費。4、失業或確實繳不出保費者，可向勞工保險局申請分期或延期繳納。（勞保局洽詢電話02-23961266）
- - 國民年金給付有幾種？需向哪個單位申請呢？
  - 1.國民年金給付計有老年年金給付、身心障礙年金給付、喪葬給付、生育給付及遺屬年金給付2.勞保局(洽詢電話02-23961266分機6066）
- - 同一種國民年金保險給付，可否因同一保險事故，重複請領？
  - 不可以，因同一保險事故，不得重複請領國民年金保險給付。
- - 僅加入職業災害保險者，是否應加入國民年金保險？
  - 是的，應參加國民年金保險。
- - 105學年度4歲就讀本市公私立幼兒園之幼兒可申請之教育補助？
  - 臺北市（以下簡稱本市）為降低公、私立幼兒園學費差距，自105學年度起辦理4歲幼兒就學費用補助。凡設籍本市（第一學期於8月1日前、第二學期於2月1日前即設籍本市）、106學年度滿4足歲之幼生（學齡前2年、101年9月2日至102年9月1日出生、就讀中班之幼兒）並就讀本市立案之私立幼兒園，每學期可申領補助新臺幣2,543元，將透過園所協助家長申請。
- - 2017臺北世界大學運動會《一起世大運 365倒數》抽獎活動Q &A
  - 《一起世大運 365倒數》抽到獎，但尚未領獎，可去哪裡領取？答：即日起至8月31日止，請民眾於週一至週五10點至17點，攜帶兌獎聯及身分證至台北市大安區仁愛路四段25號12樓C (台北藝術推廣協會辦公室)領取獎品。聯絡人：陳怡嵐小姐02-2772-8528#37
- - 身心障礙者如無法於效期屆滿前申請或完成重新鑑定及需求評估應如何辦理？
  - 若身心障礙者於身心障礙手冊或證明效期前無法完成申請重新鑑定及需求評估，可於效期前附具正當理由至戶籍所在地區公所社會課申請展延，以延長效期60日為原則；如已申請或辦理重新鑑定及需求評估，因不可歸責於身心障礙者之情事，無法於效期前完成重新鑑定及需求評估，可至戶籍所在地區公所社會課辦理註記，亦以延長60日為原則。展延或註記期間可依原手冊(證明)享有原福利服務，其中領有身心障礙證明且申請展延者，經重新鑑定結果，若障礙程度有變更者，依新證明之補助標準，自原證明效期屆滿次日起予以追回或補發。
- - 台北河岸童樂會需要費用嗎？有何注意事項？
  - 台北河岸童樂會水上、陸上活動均免費參加，現場報到後戴上彩色手環並著泳衣泳帽入場，如家長不下水則無須報名取得手環。
- - 台北河岸童樂會有和安全措施?
  - 台北河岸童樂會每日均檢測水中餘氯量、PH值、水中總固體溶量，以確保水質符合規定。另所有下水人員均需穿戴泳衣泳帽，以確保水質不易受到汙染。現場並有10名領有合格登記證之救生員隨時確保安全。
- - 台北河岸童樂會系列活動特色與周邊活動？
  - 以大型充氣氣墊水池等遊樂設施為主，包含金剛大戰恐龍水滑梯、椰林越野水滑梯、充氣跳床、四人座親子腳踏船、雙人獨木舟、手划船等12項遊樂項目，現場還有巨書說故事、 小丑摺汽球、momo姐姐唱跳活動等精彩表演，周邊另有設置文創及胖卡攤位區！
- - 台北河岸童樂會系列活動各項詳細資訊，何處可獲取?
  - 台北河岸童樂會官網(http：//www.seasky.com.tw/event/)提供詳細活動內容、現場及周邊交通、捷運及接駁公車等各項資訊，並經由鄰近區域之里辦公室協助發送活動宣傳單張。
- - 台北河岸童樂會水上鋼鐵人表演活動?
  - 水上鋼鐵人表演於8月20日上午11：00、11：45、13：00及8月21日13：00、14：45及15：00舉行，每次表演時間約15分鐘
- - 銀髮友善好站服務據點有哪些？
  - 銀髮友善好站服務據點請至社會局網站查詢（http：//www.dosw.gov.taipei/）(點選銀髮族服務/福利據點/銀髮友善好站)
- - 台北河岸童樂會民眾進出活動場所動線?
  - 一、自行開車 由高速公路濱江交流道出口右轉，或經濱江街後左轉往大佳國小方向，進入濱江街基9號疏散門左轉後300公尺處，看見白色棚架即可抵達。二、搭乘大眾交通工具(一)公車 搭72、222、市民小巴9或紅34(六、日)，至「大佳河濱公園站或大佳國小站」下車後，依現場指示牌前進。(二)捷運轉乘 捷運大直站或行天宮站轉搭72或222號公車，至「大佳國小站」下車後，依現場指示牌前進。
- - 「TLC台北野餐日」活動時間、地點、主辦單位、活動內容、活動官網?
  - 1.時間：105年9月24日（六）10：00至20：00(攤位區域至18：00)TLC的頻道主持人們會於10：30一同出現在舞臺與大家見面，另各別明星的舞臺活動時間：13：30-雙廚星任務的Joel和Soac；13：50-衝浪男孩好滋味的Dan和Hayden；14：10-Janet；14：25-伊恩萊特。註：野餐活動受天氣因素影響甚巨，若因颱風或雨後草地泥濘，野餐日活動將順延舉辦，並公布在官方網頁和臉書粉絲團之上。若天氣超級晴朗，也請自備遮陽物和防曬用品喔！2.地點：臺北市美堤河濱公園（近基十六號疏散門），與往年相同，但今年活動場地有稍微往內移喔！3.主辦單位：新加坡商全球紀實有限公司台灣分公司4.活動內容：邀請民眾綠地野餐，並安排精彩的舞台活動、音樂表演及互動攤位等。另外TLC主持人《瘋台灣》Janet、《雙廚星任務》的Soac & Joel、《衝浪男孩好滋味》Dan & Hayden、《勇闖天涯》的伊恩萊特也會到場，與粉絲同樂。其中，Janet還會把自家搬上草地，和TLC粉絲有近距離互動遊戲喔！5.活動官網： http：//www.tlc-tw.com/TLC官方臉書粉絲團，請上臉書搜尋「TLC旅遊生活頻道」就能看到喔！
- - 「TLC台北野餐日」交通方式及周邊管制?
  - 1.交通方式：(1)步行：自捷運劍南路站沿敬業三路往河堤走，約10分鐘可抵達美堤河濱公園入口(基十六號疏散門)。(2)接駁車：自捷運劍南路站轉乘主辦單位接駁車，到「基河二期國宅三」公車站，再步行5分鐘就可以抵達美堤河濱公園入口(基十六號疏散門)。接駁車車次及時間如下：9：30-12：00、13：00-17：00、18：00-20：30間，每15-20分鐘一班車。另回程一樣只要前往樂群二路上的「基河二期國宅三」公車站，可再搭乘接駁車回到劍南路站，8點散場時人潮眾多，建議直接步行。詳細接駁車路線及時間請上活動官網http：//www.tlc-tw.com/查詢。2.周邊管制：活動當日，美堤河濱公園周遭及水門內，彈性交通管制，只出不進，請務必搭乘大眾交通工具前來，以免因人潮眾多找不到停車位。
- - 台北野餐日的攤位及樂團有哪些？餐飲券可以換哪些食物呢？食物安全嗎？
  - 1.攤位：有旅行、樂活、美食等主題攤位和講座，如台灣觀光局夏至23.5主題旅遊及美食；來自紐西蘭的驚艷美食如奇異果、冰淇淋、牛奶等；披薩、法式可麗餅、愛玉、茶飲等；以及人體彩繪、手做花藝、自製香水等，詳情請上TLC官網：http：//www.tlc-tw.com/。2.樂團：有金曲獎最佳演唱組合的「慢慢說」、Skaraoke 司卡拉OK大樂隊、原子邦妮、黃奕儒等。3.餐飲券：本次將全免採用無紙化環保餐飲兌換方式，只要在活動前下載Klook客路APP，一秒取得野餐日當日餐飲券，9/24當天可兌換食物及飲料各一份。現場可兌換的美食有：現打奇異果冰沙、水果愛玉、單球冰淇淋、仙人掌冰、披薩、法式可麗餅、冷泡茶、黃金泡菜、穀物、花生醬隨身包等，現場都有攤位說明牌！詳情請上TLC官網http：//www.tlc-tw.com/4.食物安全部分是由提供美食飲品之品牌或廠商負責，TLC也有另外投保食品安全險，提供雙重保障。
- - 「TLC台北野餐日」活動現場有廁所嗎？
  - 活動現場有設置流動廁所，都會標示位置。
- - 「TLC台北野餐日」活動現場可以抽菸或生火烤肉嗎？
  - 1.為了讓大家有個野餐的好環境，請盡量避免菸味產生。若需要吸菸，請避免在帳棚底下或人潮聚集處吸菸。2.本活動位於台北市政府公園內，非經申請核可者，禁止生火烤肉及使用明火烹飪。
- - 「TLC台北野餐日」要怎麼樣才能抽獎及領獎，獎品是什麼？
  - 1.活動當天可至服務處填寫問券即可兌換抽獎券，抽獎箱位於服務處，抽獎券投入之截止時間為2016年9月24日下午5點整。傍晚會於舞台抽獎。2.獎品請洽TLC官網的即時資訊http：//www.tlc-tw.com/。
- - 「TLC台北野餐日」什麼是超級粉絲？要如何加入超級粉絲？
  - 1.「超級粉絲」是指在TLC官網贊助今年野餐日活動的人。「超級粉絲」可以得到TLC嚴選的野餐懶人沙發，TLC未來若有相關好康活動，也會優先通知超級粉絲！2.「超級粉絲」須於活動前加入，現場無法直接付費參與，詳情請上TLC官網http：//www.tlc-tw.com/。
- - 固定式起重機（天車、橋型）增設副捲揚設備，應否申請變更檢查疑義。
  - 天車或橋型起重機所增設之副捲揚設備，如未設計與主捲揚設備共同進行吊掛作業，或未涉及該起重機整體構造部分之變更時，得以「危險性機械及設備安全檢查規則」規定，檢附（新增）變更部分之圖件，送勞動檢查機構或代行檢查機構備查。
- - 可以在土壤液化潛勢範圍內新建建築嗎？
  - 可以的。目前行政院內政部要求新建築物須依據建築相關規範進行液化潛勢評估，並將改善對策納入耐震設計中。而開發業者應辦理第3級高級精度土壤液化潛勢調查，進行建築基地地下探勘、地盤土壤液化潛能評估及結構設計，並由專業技師簽證負責，以確保建築物安全。
- - 有關申請查詢是否價購回文，有些回文一星期就回文，有些為何拖很久才回文。
  - （因106.06.30「臺北市容積移轉審查許可自治條例」第4條條文修正公布，本項建議刪除）本府自民國98年2月起建立查詢機制以來，已累積一定數量之查詢成果，目前本府地政局及新工處已建立部分地號之查詢歷史資料，故可以較快速度回覆申請者；但尚未建立歷史資料者，則須由本局依次函轉新工處及地政局協助查詢，依過去經驗辦理則約需1個月左右。
- - 補償狀況查詢申請書是否需簽名暨蓋章，回函地址是否一定為戶籍地址。
  - （因106.06.30「臺北市容積移轉審查許可自治條例」第4條條文修正公布，本項建議刪除）    依民法第3條規定，簽名與蓋章生同等效力，故申請書簽名或蓋章即可。    相關法令並無「法定地址」之規定，故回函地址可由申請人自行擇定。
- - 都市發展局是否有英文版電子地圖?
  - 答：1.可至本局歷史圖資展示系統網頁(網址http：//www.historygis.udd.taipei.gov.tw)後點選網頁右上角English頁籤。2. 直接輸入http：//www.historygis.udd.taipei.gov.tw/Urban_e/map/網址即可進入本局電子地圖英文網頁。
- - 申請本市社區補助資格為何？
  - 本市核准立案之社區發展協會。
- - 山區是否也具土壤液化潛勢?
  - 山坡地一般指土壤厚度不大的邊坡地方，所以沒有土壤液化可能。如果在山坡上有一個平台，平台上又有很厚的砂土層或軟弱粉土或黏土層，那就有可能要考慮土壤液化的問題。
- - 什麼是土壤液化？
  - 土壤液化是指土壤在激烈搖動下，土壤顆粒間的水壓(孔隙水壓)增高，讓顆粒間的接觸力(有效應力)降低，當接觸力消失時，土壤顆粒懸浮在水中，失去承載能力，使得整個固體土壤變成為液體砂漿的現象。當孔隙水壓過高時，水與部分砂土會經由地層中的裂隙，往上衝出地面，造成噴砂現象。因此構成土壤液化主要的環境條件為：(1)疏鬆的砂質土壤與低塑性粉土或粘土(2)高的地下水位(含水量高)(3)夠大的震動力(強烈搖晃)。
- - 土壤液化容易在哪裡發生？
  - 土壤液化容易發生在高地下水位且土壤以疏鬆砂質土壤與低塑性粉土或粘土為主的地區，例如濱海地區、港灣、近代河口三角洲、溼地、沿海平原、砂丘、河床、舊河道、自然堤周圍、沖積扇的扇緣、人工填土區及抽砂回填的海埔新生地等地區。
- - 土壤液化可能造成的災害？
  - 土壤液化容易造成大範圍的建築物下陷與傾斜、地坪隆起龜裂、非結構梁柱龜裂破損、維生管線系統損壞。921 集集地震當時建築物受損情況，大部分為房屋下陷或傾斜。其他液化災害包括橋墩傾斜下陷，堤防護岸崩塌傾覆，地下管線或人孔蓋上浮、斷裂等。
- - 土壤液化為什麼通常不易造成人命危害？
  - 土壤液化發生後房屋因建築物自重沉陷的過程較緩慢，居民大多有充裕的時間逃出，所以人命危害也較少。另外，依據民國88年12月29日後法規規定設計的建物，已考慮土壤條件做抗液化設計（如：地基改良），此類房屋也會比較不易受土壤液化損壞。
- - 地震時土壤液化潛勢區域就一定會發生液化嗎？
  - 不一定會發生液化。土壤液化潛勢圖是根據建築規範之設計地震力大小，來計算發生土壤液化的可能性。也就是說只有在實際發生的地震規模超過分析所使用的設計地震力時(約地震規模6級)，才有發生的可能性。
- - 民生常使用道路橋梁、國道部分區域也在土壤液化的範圍是否有風險?
  - 民國84年以後，個別的道路橋梁風險在公路橋梁耐震設計規範中已納入土壤液化考量因素，宜由各主管機關回覆。臺北市政府負責之道路橋梁，除了依據規範設計外，平常也訂定一般定期安全維護查核機制，發生液化災害可能性較低。
- - 臺北市政府土壤液化諮詢服務專線
  - A：1.土壤液化工作站服務電話：若您就住家建築物坐落土壤液化潛勢區內有相關疑義，則可洽詢本專線，會由專業大地技師來為您解答：連絡電話：（02）2725-8221、（02）2725-80622.建管處服務電話：若您有老屋健檢或建築管理相關問題，則可洽詢建管處使用科 (1999轉8399、8363) 及建照科(1999轉8370)。3.都更整維服務電話：若您有都更整維相關問題，則可洽詢都市更新處更新工程科 (2781-5696轉3159)及更新企劃科(2781-5696轉3041)。4.工務局服務電話：若您有土壤液化或圖資使用等相關問題，則可洽詢工務局土木建築科 (1999轉6727或6791)。
- - 土壤液化潛勢圖是如何做出來的？
  - 土壤液化潛勢圖是由地震、地質、土木專家分工合作完成。地震專家評估地震發生的大小和機率做成建築規範之設計地震力；地質專家進行地質探勘以及地下水位調查以判別同類型土層之範圍；土木專家分析工程地質性質，並計算設計地震力下土壤液化發生的可能性。然後把三個團隊的成果套疊在地圖上，繪製成土壤液化潛勢圖。土壤液化潛勢圖是如何做出來的
- - 土壤液化潛勢圖要怎麼看？
  - 臺北市政府公開的土壤液化潛勢圖分為4級，圖資顯示在5~ 6級震度下，土壤發生液化的機率及嚴重程度分級，並以4種顏色作為判別：紅色區具有相對較高的土壤液化風險，強烈地震發生時，地基可能嚴重影響。黃色區具有相對次高的土壤液化風險，強烈地震發生時，地基可能中度影響。綠色區具有相對較低的土壤液化風險，強烈地震發生時，地基可能輕微影響。灰色區相對較沒有土壤液化風險，強烈地震發生時，地基可能無液化影響。
- - 土壤液化潛勢圖精度所代表意義？
  - 土壤液化潛勢圖精密度依據鑽探孔密度決定，主要分為三個等級：第1級初級精度圖資：由中央製作屬於全國性圖資，比例尺約為1/25,000，適用於國土規劃及防災使用。第2級中級精度圖資：由地方政府製作比例尺約為1/2,500至1/5,000潛勢圖，應用在都市計畫和都市防災。第3級高級精度圖資：由各個工程開發單位，針對所轄工程範圍內進行地質鑽探調查，其比例尺精度為三者最高，可達1/1,000至1/200，應用在工程規劃設計。
- - 公開土壤液化潛勢圖的目的？
  - 臺北市因特殊地理環境因素，造成的土層條件產生土壤液化風險也較高，因此，臺北市政府基於保障民眾「知」的權利，以及都市規劃和都市防災的參考，故將土壤液化潛勢圖公開，提供大眾查詢使用。
- - 其他的國家也有公開類似的土壤液化潛勢圖嗎？
  - 日本共有40個地方政府公開土壤液化潛勢資料，並由中央的國土交通省彙整，原圖比例尺不一，約為1/25,000或更小，可於網路上查詢圖資資訊。美國的土壤液化潛勢圖，係由美國地質調查所與加州地質調查所合作。原圖比例尺不一，約為1/25,000，但是有些資料較多區域可以放大至1/5,000。土壤液化潛勢的分級，則是依據可能液化的機率或面積做分級，大致區分為5級。土壤液化潛勢圖資均已公開在網頁上，可供下載或線上查詢。紐西蘭的土壤液化潛勢圖，係由IMCC(International Marine Conservation Congress)製作，約為1/300,000，將液化的機率大致區分為4級，並提供民眾網路下載。
- - 潛勢圖中「非本圖所示資料精度區域」所代表的意義為何？
  - 非本圖所示資料精度區域，也主要是指在該範圍內的鑽孔資料較少，所以特別註明出來表示該範圍內分析資料未達本圖資精度比例尺標準。但後續臺北市政府將配合內政部提供經費補助，辦理相關鑽探工作，以提升本圖資精度並補強「非本圖所示資料精度區域」。
- - 若恰巧我家位於兩種不同液化潛勢邊界，應該如何判別?
  - 臺北市政府公布的液化潛勢圖，不宜用於直接判定任一建築基地之液化情形，僅提供全市防災規劃參考使用。若是民眾的家是位於液化潛勢圖邊界，建議洽詢專業的大地工程技師、應用地質技師與土木技師評估建築物本身的基礎形式及地質鑽探結果來進行專業判斷。
- - 為何我家液化潛勢的查詢，地調所跟臺北市政府結果不一致？
  - 一、中央地調所採用1,189孔分析臺北盆地範圍，其中 565孔為臺北市境內的鑽孔資料，繪製出比例尺為1/25,000的潛勢圖。臺北市政府則採用本市境內3,060孔鑽孔資料做分析，圖資精度也達比例尺1/5,000，在鑽孔數量與圖資精度的增加後，勢必造成部分區域查詢結果的不同二、另外，中央地質調查所將液化潛勢評估分成高中低3種不同液化潛勢，而臺北市政府則多了無液化之區域，將液化潛勢風險分成4級，也因此在查詢結果上會有些許不同。三、最後，不管是中央或市政府公布的土壤液化潛勢圖資，都不宜直接用在判定任一建築基地之土壤液化情形，單一建築物之風險判定應回歸到建築開發時所做地質調查結果，也就是所謂的第3級高級精度圖資，來輔以判別建築物可能發生之土壤液化潛勢。
- - 我認為地價稅負擔太高，要如何申訴？
  - 如您對於地價稅稅額核定不服，可於繳納期限屆滿之翌日起30日內，敘明理由，向本處申請復查。但如經復查決定維持原核定時，會對未繳納之稅款加計利息。
- - 若我家坐落在高度土壤液化潛勢區範圍，我該怎麼辦？
  - 若您發現自家位於高度土壤液化潛勢區，請您無需恐慌，建議您可先透過簡易自主檢查，若不符合任何一項條件無法排除疑慮且位於高度液化潛勢區內，則可填具「土壤液化潛勢區液化諮詢服務申請書」送(寄)至本市建管處所設立之液化工作站，建管處將由專業技師審視後函復您。若我家坐落在高度土壤液化潛勢區範圍，我該怎麼辦 簡易自主檢查
- - 若我家坐落在中度土壤液化潛勢區範圍，我該怎麼辦？
  - 請您無須擔心，您可先透過簡易自主檢查表作初步自我檢視，只要建築物符合表列任一種狀況，通常不需要太擔心土壤液化的問題。若不符合表列任一種狀況時，則可向臺北市建管處(使用科櫃臺)所設立之液化工作站申請專業技師免費專業諮詢【（02）2725-8221、（02）2725-8062】。
- - 若我家坐落在低度土壤液化潛勢區範圍，我該怎麼辦？
  - 如果住在低度土壤液化潛勢區範圍的居民，當遭遇地震時土壤產生液化可能性很小、甚至沒有，所以請您不用太過擔心房屋會受土壤液化影響！若不放心時，則建議委請專業技師協助診斷。
- - 我家因土壤液化下沉或傾斜時該怎麼辦？
  - 可委託專業技師評估辦理。臺灣常見的「頂升工法」是921集集地震後，廣為採用的工法，可將地震後主結構無受損之建物扶正。其二，「灌漿工法」施工，是先以型鋼將建築物扶正，之後再利用低壓灌漿，將水泥漿灌入基礎下方土壤，將液化土層進行固結改良，降低再液化風險。
- - 近百年來，臺北市是否曾有發生土壤液化之案例?
  - 前述現象需於大地震之下才可能引發，但依據學者研究台灣歷年(1904年-1964年)地震發生液化震災現象地區統計資料(吳偉特,1979)，臺北盆地並無發生土壤液化之實際案例；此外，近年發生較大規模之921、331地震，臺北市均無發生土壤液化災害案例。
- - 未滿18歲兒少可否觀看、使用暴力、色情、猥褻之電腦、遊戲軟體？
  - 1.依兒童及少年福利與權益保障法第43及49條第12款或14款規定，未滿18歲之兒少禁止觀看、使用暴力、色情、猥褻之電腦及遊戲軟體，且任何人亦不得供應上述物品予未滿18歲兒少。2.違反上開規定者處6千元以上50萬元以下罰鍰，並得勒令停業1個月以上1年以下。【兒少權福法第97規定】
- - 若發現店家、網站或任何人販售、供應、提供下載暴力、色情、猥褻之限制級電腦、遊戲軟體予未滿18歲之兒童或少年，該怎麼檢舉通報？
