  - 若有需諮詢服務，可撥打本中心電話(02)2361-5295，請您聽到總機語音後，直撥分機或轉(按)9由總機為您服務。
- - 臺北市家庭暴力被害人補助要點相關內容Q&A
  - 一、臺北市家庭暴力被害人補助資格如下：(一)設籍臺北市之市民。(二)合法居留且與設籍本市市民辦理結婚登記或同居關係之無戶籍人士、外國人、大陸地區人民、香港或澳門居民。二、申請流程為何？(一)如有社工員提供服務中者，請備妥相關申請文件且經社工員認定有需求，向本市家防中心提出申請。(二)如無社工員提供服務中者，請備妥相關申請文件向本市家防中心提出申請，並需由本市家防中心認定。(三)除驗傷醫療費用外，其餘補助皆需經家防中心認定。三、補助項目及標準為何？(一)補助項目：驗傷醫療費用、心理復健費用、安置住宿費用、房屋租金及必要生活費用。(二)各項補助申請期限不同，說明如下：1.驗傷醫療費用：每次家庭暴力事件三個月內提出。2.心理復健費用：於就診後三個月內提出申請。3.安置住宿費用：經家防中心認定需立即安置住宿。4.房屋租金及必要生活費用：應於家庭暴力事實發生後二年內提出，另房租租金應自租屋事實發生之日起三個月內提出。(三)各項補助申請表件如下：1.申請表。2.領據。3.戶籍證明文件。4.家庭暴力事件相關證明文件（家庭暴力事件通報表影本及驗傷單影本或民事保護令影本）。5.申請人或其法定代理人之郵局或銀行存摺封面影本。6.驗傷醫療費用應另檢附診斷證明書正本及醫療費用收據正本。7.心理復健費用應另檢附心理復健紀錄摘要表及簽到表正本(此為核銷時必要文件) 。8.安置住宿費用應另檢附社工員轉介表及旅宿業開立之收據正本。9.房屋租金補助應另檢附租賃契約或其他租屋證明文件影本。(四)各項補助標準如下：1.驗傷醫療費用：全民健康保險不給付項目之掛號費、診斷證明書及驗傷單費、藥材或特材費、毒藥物檢驗費、部分負擔費。2.心理復健費用：個別心理復健，每次最高補助新臺幣1,200元；夫妻或家族心理復健，每次最高補助新臺幣2,400元；團體心理復健，每人每次最高補助新臺幣800元。3.安置住宿費用：每人每日最高補助新臺幣1,500元；親屬偕同住宿者，每日最高補助新臺幣2,000元4.房屋租金及必要生活費用：每月最高補助新臺幣1萬2,000元，至多補助3個月；必要時得延長補助3個月。四、可以同時申請臺北市家庭暴力被害人補助和特殊境遇(第4條第1項第3款家庭暴力受害者)家庭扶助嗎?如果不行，應該如何選擇?(一)為更周延的協助被害人，以扶持生活其自主能力，申請人可先依特殊境遇家庭扶助條例相關規定檢具申請文件申請認定特殊境遇家庭身分，若經審核通過會依申請人家庭狀況獲得緊急生活扶助、子女生活津貼、兒童托育津貼、子女教育補助、傷病醫療補助、法律訴訟補助及創業貸款補助。(二)若未能通過特殊境遇家庭扶助條例的緊急生活扶助補助項目，可提出申請本補助之房屋租金及必要生活費用補助項目。五、本補助是否可以與其他法規規定之補助項目重覆申請？本補助之各項補助項目，在同一期間已依其他法令規定領有相同性質補助者，不得重複補助，例如：1.申請人已於同一月份領有如老人收容安置補助、身心障礙者托育養護補助、婦女收容安置補助…等（屬收容安置性質者），就不得在該月份同時請領本補助之安置住宿費用。2.申請人已於同一月份領有低收入戶生活補助、馬上關懷急難救助、急難救助、特殊境遇家庭緊急生活扶助…等（屬生活性質者），就不得在該月份同時請領本補助之房屋租金及必要生活費用。六、向家防中心提出臺北市家庭暴力被害人補助申請後，多久才能知道申請結果？本項補助提出申請後，需經7至14天內（含例假日，但不含特定國定假日）完成審核並函復申請結果。若有需諮詢服務，可撥打本中心電話(02)2361-5295，請您聽到總機語音後，直撥分機6813，將由羅先生為您服務。
- - 若有驗傷或醫療需求，如何處理？
  - 若遭受家庭暴力有驗傷或醫療需求，可前往公立或大型之私立醫院就診，請醫院社工員提供協助，驗傷等醫療費用可由醫院向家庭暴力暨性侵害防治中心申請補助費用。另針對親密關係暴力個案於協助驗傷診療服務後，將由醫院社工員進行親密關係暴力危險評估量表，評估被害人當下危險情境以提供及時協助。醫院社工員亦會依家庭暴力防治法規定，通報家庭暴力暨性侵害防治中心提供後續協助。若遇到需緊急送醫者，可直接撥打緊急救難專線119送往附近醫院急救。
- - 如何聲請民事保護令？
  - 若遇家暴事件而有需聲請民事保護令可就近至所在地派出所報案或可直接撥打113、110或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。亦可於上班時間直接到地方法院家暴及家事聯合服務中心聲請保護令。
- - 交通維持捷運信義線東延段的主要工程內容及特色為何？
  - R03廣慈/奉天宮站：車站設置3座出入口、2座無障礙電梯及3座通風井，為一座地下三層島式月台車站。出入口A設於規劃中的新設信義區行政中心內，出入口C設置於廣慈博愛園區之複合型大樓內。 橫渡線：位於福德街51巷至89巷間。潛盾隧道：象山站尾軌至R03站間長約489公尺及R03站至玉成公園間長約519公尺，其上下行長分別約為 1,006 公尺、1,012公尺，合計總長為2,018公尺。R03車站以結合城市山水意象，塑造捷運重視生態環保做整體建築的形象設計，並與在地自然景觀相互融合，呈現區域特色以「水流」以及「時尚信義」的概念來作運用。再加入在地歷史?公圳水流之意象，轉化為水平形意與曲線，賦於站體內的設施並使與當地景觀相互融合。
- - 交通維持捷運信義線東延段工程發包施工現況及目前辦理進度？
  -   發包施工現況：    已於105年7月19日決標、106年10月17日開工，全部工程預定111年10月完工。      目前辦理進度：    本工程辦理進度現況，請詳捷運工程局南區工程處官方網址：http：//www.sdpo.dorts.gov.taipei 首頁之「施工管理E化平台」。
- - 交通維持請說明捷運萬大線有四個車站施工位置鄰近小學校區，施工期間交通維持與維護學童上、下課安全措施為何。
  - 為維護學童上、下課安全，均特別加強交通維持措施，例如，於交通維持轉換時於圍籬設置前、後須邀集各相關單位（包含當地里長及鄰近機關、學校等）辦理現場會勘，經充分討論後依結論執行；並與校長、導護人員及導護志工充分溝通，依校方需求於每日上、下學時段及周邊重要路口均派員協勤疏導。
- - 交通維持請說明萬大線及信義線東延段施工期間如何管理及防治施工噪音與振動。
  - 除於工程契約中已明訂營建噪音須符合環保署之噪音管制法規外，並嚴格要求施工廠商須採用低噪音、低污染之施工機具，及於施工過程中採低噪音之工法施工，另噪音較大之施工項目，將儘量於例假日上午延後開工及平常日之白天時間進行施工，以降低對民眾休息及睡眠時間之噪音干擾。
- - 我要跨縣市到世大運的競賽場館觀賽，請問是否有提供如何前往的國道客運資訊？
