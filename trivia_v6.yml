- - 至現場需注意之事項
  - 1.進場前先尋找現場配置圖，留意散場動線，了解晚會現場各項設施相對位置。-散場公車路線有3條：往「捷運臺北車站」、往「捷運公館站」及往「木柵、景美地區」。-捷運24小時不收班。2.先與朋友會合後再前往現場，進場前先講好散場或萬一走散時的集合時間與地點。3.搭乘大眾交通工具前往與離開。4.捷運市政府站、台北101/世貿站與國父紀念館站在散場時人潮擁擠，走到較遠距離的捷運站或公車轉運站能較快搭上車。5.活動當天管制範圍內停車場晚間7點只出不進，8點管制進出。6.穿著輕便保暖的衣物。7.吃飽再到現場。8.因人潮眾多，晚上10點以後手機很難撥通。9.注意隨身物品。10.活動由市府主辦，民眾可免費前往參加。11.在活動現場若遇有緊急狀況，可以到就近的服務台、醫護站、或是請跨年活動的現場工作人員協助與幫忙。醫護站上方有大型空飄氣球，有十字圖樣，緊急時請抬頭尋找，並可利用廣場中央佈設的安全通道抵達最近的醫務站。                                                                12.不一定要到現場人擠人，可在市府東側廣場、國父紀念館噴水池西側廣場、新仁愛路中段左有兩邊、市府東南街舞廣場、信義威秀徒步區等觀賞大螢幕，與現場一樣High。13.活動其他相關資訊大家可以上臺北旅遊網(http：//www.travel.taipei/)及臉書(https：//www.facebook.com/taipeitravel/notes)洽詢!
