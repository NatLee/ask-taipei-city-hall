- - 如何選擇一家好的安養護機構？
  - 建議您優先考慮經評鑑為優、甲等之機構。當您與安養護機構詢價後，並有意願進住，建議您在不知會機構的情況下參觀機構，以下幾點供您於參觀時作為參考：1、 是否懸掛合法設立許可證書？2、 是否公佈菜單、是否有營養師參與評估、餐具是否能讓長者方便使用等。3、 環境是否有異味、有隔簾遮蔽維護隱私等。4、 是否有無障礙環境設計。5、 浴室、寢室及走道是否設有緊急呼叫鈴、防滑墊及扶手等設備。6、 隨時皆有護理人員及本國籍照顧服務員在機構值勤。
- - 老人收容安置補助之申請資格、流程、應備文件、補助內容等相關規定為何？
  - 一、申請資格：1.設籍並實際居住本市滿1年以上，且年滿65歲之市民。2.具本市低收入戶、符合本市中低收入戶、領取中低收入老人生活津貼且具中、重度失能者。一般戶(如註)且具重度失能者。3.經安置或入住於本市、新北市、基隆市、宜蘭縣評鑑合格之機構住宿式服務類長期照顧服務機構或本市經評鑑(督考)為乙等以上(以低收入戶身分申請者需甲等以上)，或經評鑑(督考)為甲等以上之老人長期照顧機構或護理之家（倘未先完成失能評估即入住新北市、基隆市、宜蘭縣安置機構者需達3個月以上)。註：一般戶：係指家庭總收入平均分配全家人口,每人每月當年最低生活標準3倍(106年為46,632元),且全家人口之存款(含股票投資)合計不超過單一人口家庭為新臺幣250萬元(每增加一口得增加新臺幣25萬元)。二、申請流程：申請人先向本市長期照顧管理中心各區服務站申請失能評估，評估後再由申請人自行選擇入住上開規定之安置機構，(或入住後向本局提出申請書後，由本局轉介本市長期照顧管理中心各區服務站進行失能評估)並確認符合上開條件，再檢附申請資料向本局申請補助。 三、應備文件：（一）申請表正本。（二）一般戶需附經稅捐稽徵機關核定之最新全戶各類 所得清單暨全國財產歸戶清單正本1份。(亦可填妥申請表第四頁的委託書，由本局代為查詢財稅資料)（三）機構入住合約書。（四）入住滿3個月之繳款收據（入住臺北市之機構者，免附）。四、補助內容：（一）低收入戶0-2類重度失能及中度失能補助分別為27,250元及15,750元（外縣市為21,000元及10,800元）；低收入戶3-4類重度失能及中度失能補助分別為22,000元及10,500元（外縣市為21,000及7,200元）。（二）中低收入重度失能及中度失能補助分別為21,000元及6,300元（外縣市為21,000元及4,320元）。（三）一般戶補助重度失能長者5,000元及10,000元（外縣市為3,600元及7,200元）。
