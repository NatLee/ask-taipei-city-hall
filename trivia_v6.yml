- - 家鼠防治FAQ
  - 一、家裡好像出現老鼠該怎麼辦?鼠類防治工作首重在環境整頓，並先將食物及廚餘收拾好，若食物沒收拾好，將提供老鼠豐富的食物來源，極難吸引老鼠吃滅鼠餌劑。防治鼠類「三不政策」包括：(一)「封閉鼠道，不讓鼠來」：封住居家周圍可能的老鼠洞及相關空隙，防止老鼠進入屋內。建議門窗裝上孔徑不超過一公分的金屬紗網；(二)「斷絕糧食，不讓鼠吃」：斷絕鼠類食物來源，將食物與飲水收藏於適當的封閉容器內，以免引來老鼠覓食，務必做好廚餘回收，將廚餘從垃圾中分離出來，如果無法馬上丟棄，應立即予以加蓋，碗盤廚具使用完畢後儘快清洗，保持廚房整潔；(三)「整理環境，不讓鼠住」：住家盡量減少堆積雜物，屋內陳設力求簡單，天花板、夾壁等建築物盡量避免，如有庭園應定期清除雜草，以免供給老鼠躲藏與築巢的處所。二、老鼠藥應該要怎麼使用?(一)將每包滅鼠餌劑（50公克）分成10小塊，置於老鼠出入處或有鼠尿（糞）處。每處置放1至2小塊，可利用鞋盒兩側挖洞或將紙板或木板斜放牆壁做成毒餌站，將餌劑置放毒餌站內，佈置成老鼠喜歡取食的環境，並可避免兒童或貓狗誤食。(二)老鼠喜食新鮮食物，所以置放滅鼠餌劑時請將食物收好，廚餘垃圾密封，斷絕鼠糧，增加老鼠食用餌劑之機會，隔天檢查餌劑，如已吃完，則視情況補充；連續3天如未取食，應更換放置場所。三、不小心吃了老鼠藥該怎麼辦？目前本局所發放的滅鼠餌劑是臘米餌塊，通常人們形容是食之無味，味同嚼臘，另基於安全考量，滅鼠餌劑皆添加苦味劑，所以很難吃下足夠致死的劑量；由於毒性與劑量是成正比的，老鼠因為個體小，只要吃下一點點就足以致命，相對於人，可能要多上百、十倍的量才有同樣的反應。但是，因為人與老鼠對目前市售的老鼠藥均會產生中毒，因此，不幸誤食後請立即催吐和送醫院，並且向醫生說明誤食的藥劑名稱，請他們處理。四、為什麼放了很多老鼠藥，卻不見老鼠死掉，是不是老鼠藥沒有效?本局發送之滅鼠餌劑皆為行政院環境保護署許可之環境衛生用藥，有效成分及含量均送環保署認可之環境檢驗測定機構檢驗，符合規定後始完成驗收。目前滅鼠餌劑的有效成分皆為抗凝血劑，老鼠吃了就會因內出血逐漸死亡，死亡時間依食用藥劑多寡，通常約3至7天，該款餌劑藥效反應較為和緩，乃是避免其他老鼠產生忌食或警戒現象，並不是老鼠藥沒有效。 五、聽說吃了老鼠藥的老鼠會死在光亮處或水邊？本局發放的滅鼠餌劑成分是抗凝血劑，老鼠只要吃了一些，就會因內出血而逐漸死亡，此期間其行動、體力、判斷力等可能受影響，部份中毒的老鼠會因體弱而至水邊飲水，而使你比平常容易發現牠，這乃是藥效發揮的現象之一，並非藥劑的特殊設計。 六、使用過的捕鼠籠或黏鼠板是否可直接使用，而不影響捕鼠效果？有關此問題經求證滅鼠專家，均表示在他們的研究工作中，一直重覆使用已補捉過老鼠的籠子，且未曾加以處理，並沒有像民間所傳說的「別的老鼠就不會來了」，甚至今天捉到了老鼠，明天同一個籠子還是捉到了。教科書上也指出，同一種類老鼠的糞尿、氣味，尤其是異性的，易誘引其友伴，但是考量有的老鼠極凶猛，被捕後可能受傷流血或分泌警戒費洛蒙，例如抓到錢鼠後，其氣味十分的特殊濃厚。若實在缺乏信心，你可將使用過的器具曝曬於陽光下一日或用水清洗、用火烘烤處理均可，如果是黏鼠板則只好更新了。七、經常使用同一種方法滅鼠，是否會使老鼠產生防衛心？通常老鼠是有其領域範圍的，如果捕鼠方法得宜，應該可以迅速撲滅該區之老鼠，如經一段時間後未再捕捉到鼠隻，可能是鼠患已暫時解除。若是有新的老鼠侵入，先前所採用的滅鼠方法，對新對象而言還是新方法，當然可繼續使用。如一直受鼠害之苦，卻抓不到牠，就得改善防治技巧。八、以捕鼠籠或黏鼠板捕到老鼠後，應如何處理才比較合乎人道？抓到老鼠後，建議您可以箱(桶)盛水並加入清潔劑至起泡程度，將鼠籠或黏鼠板浸入可使鼠隻迅速窒息死亡，減少鼠隻痛苦。另可以雙層塑膠袋密封使其窒息，再將鼠屍交由清潔隊處理。或許您覺得於心不忍，但是相較鼠類的為害與傳播疾病的隱憂，還是請您支持滅鼠運動。
- - 溫泉使用費為何不分營業與非營業費率？溫泉為何不裝表計費?
  -   溫泉並非民生必需品，基於公平性及使用者付費原則，相同的水量不宜有差別計價，所有供應費用成本應由使用者公平分攤。   北投溫泉因泉質具酸性及易結垢特性，加上非密閉性供水管網，在強酸、維持泉溫及磺泥淤塞等情形尚無法克服下，經評估難以裝表計量，目前以口徑計量係依水利公式換算每日供應量。 
- - 我可以申請溫泉分時供應嗎？如何申請？費用怎麼算？可自行變更安裝分時設備位置嗎？
  - 申請條件：如果您是本處新北投溫泉區的普通用戶，可申請分時供應6小時或12小時分時供應，您可視需求選擇申請。申請後，本處會派員至貴戶溫泉使用設備現場勘查，如符合裝置分時供應開關設備者，即可受理申請。應備文件：申請時須持身分證、印章（或簽名）及近期溫泉使用費收據辦理，如果您不是溫泉登記之使用人，代理人也須攜帶身分證並填寫委託書。申辦手續及繳費：請攜帶上述應備文件至本處陽明營業分處辦理，並結清溫泉使用費及繳交申請費100元/支，申請後每月溫泉使用費按供應時數比例加計分時供應設備維護管理費1,200元/月/戶，詳細收費金額可參考本處溫泉使用費價格表。安裝完妥後不得自行更換位置，若須更換位置，須向本處申請，並繳交分時供應改裝工程費5,800元/處。 備註： （1）分時供應是依用戶使用特性為原則，針對使用人及量較少的單一住家規劃提供適時適量的供應方案，溫泉集合及營業用戶因使用人及量較多，一律24小時供應。 （2）為維溫泉供應穩定，申請分時供應後，可依使用狀況申請恢復24小時供應，惟恢復24小 時供應後，2年內不得再申請分時供應。 （3）申請分時供應的用戶，不得再申請溫泉中止。 （4）普通用戶如接用之溫泉口徑、支數為1支以上，須選擇同一供應種類。 
- - 請問溫泉分時供應的時間為何？可自由選擇嗎？如何控制供應時間？
  - 為維溫泉供應穩定，本處規劃分時供應時段6小時為每日17：00-23：00、12小時為每日11：00-23：00。分時供應時段將於實施半年後，視供應情形再檢討是否可彈性調整。申請分時供應後，用戶須同意本處至其用水設備場所安裝分時供應開關組（含控制開關套件與連接管線），用以控制供應時間，該設備由本處提供，用戶應妥善保管，且用戶須同意無償接用家中電源與負擔電費。  備註： （1）分時設備連接管線若有故障或損漏事宜，請用戶儘速通知本處修復，若未即時通知，造成財產損失，自行負責。 （2）因用戶因素，致分時供應開關組無法安裝或無法正常運作，產生無水情形，用戶應自負無水之責，並依規定繳費。 （3）為利溫泉管線暢通，用戶申請分時供應後應定期自行僱工清理通管，如無法正常通水，須自負維修之責。 （4）分時供應開關組，本處每年不定期派員檢測及維護1次，用戶若拒不配合除依附設溫泉營業章程第24條停止供應外，若因此造成用戶損害或損失時，與本處無涉。 （5）用戶不得擅自調節、變更或毀損本處分時供應開關組，違者依附設溫泉營業章程第25條照接用口徑追償10至20個月之溫泉使用費。
- - 我可以申請溫泉中止嗎？如何申請？中止費用如何？
  - 申請條件：除已申請分時供應的用戶外，溫泉用戶如暫不使用溫泉均可申請溫泉中止。應備文件：申請時須持身分證、印章（或簽名）及近期溫泉使用費收據辦理，如果您不是溫泉登記之使用人，代理人也須攜帶身分證並填寫委託書。 申辦手續及繳費：請攜帶上述應備文件至本處陽明營業分處辦理，並結清中止前之溫泉欠費，中止期限每年最長4個月，中止期間溫泉使用費免計，僅辦理恢復時須繳溫泉復用費2,562元/支。備註 ： （1）申請溫泉中止期間每年不得超過4個月，逾期未辦理恢復者，本處得終止供應溫泉。 （2）溫泉中止用戶，於恢復後如用水設備無法正常開通使用者，須自負維修之責。 （3）申請溫泉中止期間，用戶如私自開啟流量調節裝置封口使用者，依溫泉營業章程第25條之規定，照接用口徑計收相當於10至20個月溫泉使用費之違約金。
- - 檢舉違反水污染防治法案件獎勵辦法之檢舉獎金的規定為何？
  - 一、為有效維護河川水質，藉由巿民合作機制，共同防治水污染，本局訂有「臺北市檢舉違反水污染防治法案件獎勵辦法」，凡是於本市發現違反水污染防治法之行為，即可於14日內向本局檢舉，如果檢舉時有隨案檢附充分證據資料因而告發違規者，則可依檢舉事項的不同獲得實收罰鍰金額5%到10%的獎金。二、另如檢舉人現職或曾為被檢舉人之員工，則提高獎勵額度，以實收罰鍰金額20%發給獎金。
- - 中低老人假牙補助的補助對象及申請資格。
  - 一、對象(一)年滿55歲以上列冊本市之低收入戶者。(二)年滿65歲以上經本市公費收容安置者。(三)年滿55歲以上列冊本市中低收入戶者。(四)年滿65歲以上領有本市中低收入老人生活津貼者。(五)年滿65歲以上中低收入領有本市收容安置補助者。(六)年滿65歲以上領有本市身心障礙者生活補助費者。(七)年滿65歲以上領有本市補助身心障礙者日間照顧及住宿式照顧費用達百分之五十以上    者。二、備註(一)活動及固定假牙裝置補助，同一牙位5年內(以裝置完成日起算)不得重複申請。(二)牙位5-5(前牙區)開放施作固定瓷牙，其餘牙位仍維持補助金屬冠。(三)固定假牙補助金屬冠及瓷牙最多六顆。(四)後牙區連續缺牙超過3顆(含)僅核予活動假牙。(四)活動假牙裝置滿1年後，始可申請維修費用。(五)每人每年最高補助10萬元(含：活動及固定假牙裝置補助，及維修費用)。
