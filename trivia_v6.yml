- - 臺北市政府環境保護局委託臺北市就業服務處辦理「104年儲備清潔隊員甄試」現場報名問答集
  - Q1：是否可幫家人、朋友代為報名？有無份數限制？A：可以。無份數限制，請委託人先行確認填寫內容、簽名及檢附文件均正確無誤且齊備，若於報名現場發現有誤或缺件，恕無法完成報名，請於報名截止日前重新報名。Q2：受朋友或家人委託代為報名，是否需要填寫委託書？A：不需要。Q3：我的小孩目前18歲，想報名本次甄選，請問需要家長填寫報名同意書才能報名嗎？A：本次甄試未有報名的年齡限制，也未有限定未滿20 歲者需要家長同意始得報名，故報考人未滿20 歲者毋須得到家長同意即可報名。惟甄試錄取進用時未滿20 歲者，簽訂勞動契約時需法定代理人同意。Q4：受委託人持有委託人報名表件至報名現場報名時，發現報名表件內容有誤，如協助委託人塗改報名表內容並加蓋委託人私章以茲證明，是否可行？A：不可以。如報名表件內容有誤，恕無法完成報名，請受委託人將報名表件帶回，由委託人自行修正，並請於報名截止日前重新報名，逾期恕不受理。請報考人仔細審閱報名表件內容是否無誤後，再轉交予受委託人。如受委託人執意塗改委託人資料，相關責任概由受委託人與委託人自行承擔。Q5：10月6日至現場報名，發現證件未帶齊全，未能完成報名，怎麼辦？A：請於10 月8 日報名截止前，備齊報名應繳文件資料，至臺北市就業服務處重新報名。本次報名不受理補件，請確實攜帶應繳報名文件報名。Q6：25元郵資收費，可以給郵票嗎？A：不可以。現場會向報考人收取郵資並開立收據做為報名需檢附文件之一，請自備零錢繳納。Q7：報考人曾經改名字，但畢業證書上為舊名字，可否報名？A：請報考人攜帶舊名字的畢業證書及戶籍謄本（新式戶口名簿亦可，需有詳細記事），戶籍謄本記事欄內載明更改名字之資訊，以供查驗。Q8：報考人遺失畢業證明，舊的戶籍謄本載有學歷資訊，是否可以此作為學歷證明文件？A：學歷證明文件須為各級學校開立之畢業證書，如報考人遺失畢業證書，請向原畢業學校申請開立畢業證明。Q9：失業好一陣子，已未投保勞工保險並轉投保國民年金保險，欲以特定對象身分報名保障類組，是否可以不用附勞保明細？A：不可以。請攜帶9 月29 日後由勞保局核發之勞保明細（請至勞保局申請，地址：10013 臺北市中正區羅斯福路1 段4 號），始符合簡章內載明應繳報名文件之規定。Q10：筆試測驗的環保常識科目要如何準備？A：環保常識題庫請參閱臺北市就業服務處網站（http：//eso.gov.taipei）「線上服務」「下載專區」、台北人力銀行（https：//www.okwork.taipei）「市府約聘僱人員招考專區」或臺北市政府環境保護局（http：//www.dep.gov.taipei）。Q11：我的身分有多種類別，如中高齡、低收入戶以及市民臨時工，請問我可以都報名嗎？A：依簡章規定，報考人須擇一類組報名，一經選定不得更改，請報考人自行斟酌，擇一類組報名。若重複報名2 類組以上，將改列為一般類組。Q12：我是市民臨時工身分，請問我報名時需要提供什麼證明文件？A：請提供臺北市核發之有效期限內之低收入戶卡及派工單位開立之在職證明文件。Q13：結構性失業勞工含有契約期滿失業嗎？A：結構性失業勞工不包含契約期滿失業。依臺北市政府協助失業勞工再就業執行要點規定，所謂的結構性失業勞工，係指因勞動基準法第11 條任一款情事離職者，才符合結構性失業勞工之身分，故報名結構性失業勞工者，須提供最後一家事業單位所開立之離職證明（離職原因須載明與勞動基準法第11 條任一款情事有關者）作為證明文件。※勞動基準法第11 條：非有左列情事之一者，雇主不得預告勞工終止勞動契約：一、歇業或轉讓時。二、虧損或業務緊縮時。三、不可抗力暫停工作在一個月以上時。四、業務性質變更，有減少勞工之必要，又無適當工作可供安置時。五、勞工對於所擔任之工作確不能勝任時。Q14：使用自然人憑證下載列印的勞保加退保明細是否可做為報名資料？A：若欲報考失業勞工組，需檢附勞保資料明細表以確認是否為失業狀態。報考人可使用自然人憑證下載列印或至勞保局申請該表。
- - 為何實施全市路邊停車格收費?
  - 因路邊汽車格未收費造成久占汽車格之抱怨屢見不鮮，有臨停需要反而停不到車位之使用不公等問題，為落實停車公平性並合理反映車輛使用成本，讓民眾公平使用公共停車資源並落實使用者付費精神，同時鼓勵市民使用綠運輸(捷運、公車及YouBike)，故辦理全市路邊停車格收費。
- - 為何有些路邊汽車停車格有收費、有些無收費?
  - 停車格位納入收費管理有一定程序，本處依流程循序辦理，因此目前路邊無收費之汽車停車格，應為其格位所在路段之土地權屬非全為公有，或是該路段尚在辦理公告收費程序中，本處已於104年12月1日針對本市位於公有地路段之路邊汽車停車格全面納入收費。
- - 為什麼私地格位未收費?
  - 目前停車收費規畫及準備工作主要以公有地路段為主，停車格位如設置於私有地，因屬未徵收之道路用地，暫無規劃收費。
- - 私地格位暫不收費，那為什麼可以劃停車格?
  - 依據大法官會議釋字第 440號解釋理由書：「......關於都市計畫保留地得予徵收或購買已有相關法律可資適用，主管機關基於增進公共利益之必要，依法使用計畫道路用地時，應否予以徵購，須考量其侵害之嚴重性，是否妨礙其原來之使用及安全等因素而為決定。對既成道路或都市計畫用地，主管機關在依據法律辦理徵購前，固得依法加以使用......」，若土地屬計畫道路，雖尚未完成徵收補償程序，依前揭解釋理由書意旨，主管機關仍得依法加以使用。為維持良好停車秩序，避免影響道路供人車通行之功能，故於道路上屬私地路段依公用地役權劃設路邊停車格，以整頓道路停車秩序並提供公眾使用。
- - 道路既然要對路邊停車收費，但為何還有不劃路邊停車格的地方?
  - (1)巷弄停車格劃設原則，在單行巷弄應保留淨寬至少3.5公尺以上空間供消防車輛通行使用，雙向通行道路，則保留淨寬至少5公尺以上之通道，故巷弄寬度未逾6公尺之雙向通行道路不予劃設停車位，逾6公尺至8公尺且單側禁停之雙向通行巷弄，則於滿足救災活動空間需求時得規劃單側順向平行停車位，逾8公尺單行巷弄得規劃雙側停車位。(2)未劃設格位的地方後續會搭配鄰里交通改善計畫進度，逐步於社區內劃設禁停紅黃線及停車格位等標線以整頓交通及停車秩序，一但新設公有道路汽車停車格位後，即一併納入收費。另若有民意提出劃設需求者，亦會一併於會勘後劃設。
- - 路邊警車專用格位為何不收費?
  - 警車依道路交通安全規則第113條規定，警備車於執行任務時，其臨時停車及停車地點得不受限地標誌標線之限制。但公路主管機關、市區道路主管機關或警察機關另有特別規定者，應依其規定。另本市已訂定「臺北市政府警車專用停車位設置管理標準」，明定本市為因應警察機關執行維護社會秩序任務所需之停車需求，並兼顧公共資源使用分配之公平性，故依道路交通標誌標線號誌設置規則第190條第7項規定設置警用格位，因警用格位具公務緊急性質及基於市府預算一體原則，故為行政程序簡化不對警察局另外收費。
- - 車主?收到收費公告，可否要求撤銷停車繳費單?
  - 為利民眾了解本市路邊停車相關資訊，本處收費公告均會函請區公所協助公告，並刊登於本處網站及政府公報，亦針對公告路段停放之車輛進行車窗夾單宣導，同時於街廓適當處設置收費告示牌，格位地面也會繪設編號供車主參考，明確告知民眾路邊停車場收費資訊。
- - 如何知道停車之路段是否已實施收費?
  - ：實施路邊停車格收費之路段，皆會於車格鄰近處設置收費標誌牌面，民眾可得知收費時間及費率，且收費之格位並會加以編號。如現場未見收費標誌，可透過1999市民熱線或本處網站查詢，或撥打02-2726-9600本處同仁將協助查詢。
- - 住家週邊常有免費停車格遭長期占用，如何建議納入收費?
  - 「單一陳情系統」可提供民眾陳情。另亦可電洽02-2726-9600向本處反映。
- - 全市收費費率如何訂定?能不能收便宜一點?
  - (1)本市議會通過之臺北市公有停車場收費費率自治條例第5條：「管理機關對停車場應依區域、流量、時段之不同，訂定差別費率並公告之。」，故本市各行政區之路邊停車場收費時間及費率係依停車場所在地區停車需求及社經活動特性來訂定。(2)目前「路、街」路段已依上述規定，並參考周邊既有收費路段費率完成公告及進行收費管理。另「巷、弄」部分，考量影響民眾生活作息較大，104年12月1日起實施收費之「巷弄」除商業機能較強之區域外，皆以最低費率為標準。
- - 全市收費費率未來還會調漲或調降嗎?
  - 本市路邊停車格皆依臺北市公有停車場收費費率自治條例之規範，依當地停車特性及參考周邊收費路段費率而訂定，後續將同條例第5條及第6條規定，依實際使用情形每6個月檢討1次。
- - 全市汽車收費了，機車為什麼不收費? (建議機車收費)
  - 本市路邊機車收費規劃係採區域性逐步推動，目前已於部分商圈、市立動物園及臺北車站周邊實施，暫無全面納入收費之規劃。後續將優先檢討商業活動及觀光活動頻繁，及大眾運輸場站或有替代路外停車場空間等區域，評估實施之可行性，暫無全面實施之規劃。
- - 路邊停車費如何繳納?
  - 本市路邊停車費可採下列管道繳交路邊停車費： (1)線上即時繳費 為提供民眾即時繳費方式，民眾可至「全國繳費網」（https：//ebill.ba.org.tw）即查、即繳本市路邊停車費，該操作方式係以晶片金融卡或活期帳戶作為支付工具，民眾可免於臨櫃繳費奔波之麻煩及單據遺失之困擾。(2)手機APP即時繳費 本處推出手機繳路邊停車費服務，全國各地車主只要下載免費「北市好停車」手機App軟體，就可即時查詢停車費並從車主帳戶扣款繳費，Android、iOS系統手機皆適用。(3)捷運車站代收停車費 臺北大眾捷運股份有限公司現有116個捷運車站，民眾只要持本市之路邊停車繳費單，進出捷運站時即可至服務窗口以現金或悠遊卡繳費。(4)銀行及電信業者代扣繳停車費 目前已有13家銀行及中華電信辦理代扣繳路邊停車費服務，可避免因忘記繳交停車費而受罰，另臺灣票據交換所合作之金融機構亦可辦理。詳：www.twnch.org.tw/ach/weblink/parking.asp。(5)定點代收停車費 民眾只要持停車繳費單，至四大超商(統一、全家、OK、萊爾富)、中油直營加油站(僅臺北市及新北市)、美廉社各門市、本市所轄各公有立體、地下停車場（全年無休）或停管處服務臺（服務時間：週一至週五上午8：30-下午17：00，午間照常服務，國定例假日除外）即可繳費。
- - 請問7日內火化之優免措施為何？
  - 設籍本市死亡者，自死亡次日起7日內完成火化，使用本市火化爐規費新臺幣2,000元全免；設籍外縣市死亡者，火化爐規費由原新臺幣6,000元減半為新臺幣3,000元。
- - 親友死亡後，家屬如何辦理身後事？
  - 家屬可先與委託之殯儀業者連繫。若未委託業者辦理後事，則可先至第一或第二殯儀館填寫「臺北市殯葬管理處殯葬設施使用申請書」申請接運遺體，接運遺體之相關規定如下：(1)上班時段需取得死亡證明或檢察署相驗屍體證明書之正本文件，始得申請派車接運遺體至本處冰存（大體接運專線02-87329762）。(2)如在下班後及例假日無法立即取得死亡證明或檢察署相驗遺體證明書文件，可依下列方式辦理：a.於醫院死亡者，由醫院開具死亡通知單，並於開始上班後補交死亡證明書。b.於家中死亡者，由家屬通知「臺北市立聯合醫院客服中心1999轉888、25553000轉9」(附表一--臺北市政府衛生局行政相驗作業處理流程說明書)，由當地衛生所或診所協助開立死亡證明書或行政相驗證明書，始可受理接運。c.意外死亡者，由警察單位聯繫檢察官，如無法立即相驗，開具單位主管以上核章之遺體進館通知單，即可受理接運。d.因法定傳染病死亡之遺體，應先由醫療機構處理後由家屬持死亡證明書到館辦理火化許可證及火化爐登記手續，逕送火化場火化，本處不派車接運。e.重大意外災害另案辦理。（3）遺體進館後，家屬再辦理治喪事宜，如：做七、念經、決定土葬或火葬、選擇墓地或靈骨樓塔、決定出殯日期、訂租禮堂、火化爐、申請埋葬（火化）許可證、印訃聞．．等。
- - 人往生後，家屬如何處理遺體？
  - Q：人往生後，家屬如何處理遺體？A：家屬可先與委託之殯儀業者連繫。若未委託業者辦理後事，則可至第一或第二殯儀館填寫「臺北市殯葬管理處殯葬設施使用申請書」申請接運遺體，接運遺體之相關規定如下：（一）上班時段需取得死亡證明或檢察署相驗屍體証明書之正本文件始得申請派車接運遺體至本處冰存（接屍專線87329762）。 （二）如在下班後及例假日無法立即取得死亡證明或檢察署相驗遺體證明書文件，可依下列方式辦理：病死醫院者由醫院開具死亡通知單，並於開始上班後補交死亡證明書；病死家中者由家屬通知當地衛生所或診所協助開立死亡證明書或行政相驗證明書，始可受理接運。意外死亡者，由警察單位聯繫檢察官，如無法立即相驗，開具單位主管以上核章之遺體進館通知單，始可受理接運。因法定傳染病死亡之遺體，應先由醫療機構處理後由家屬持死亡證明書到館辦理火化許可證及火化爐登記手續，逕送火化場火化，本處不派車接運。重大意外災害另案辦理。（三）遺體進館後，家屬再辦理治喪事宜，如做七、唸經、決定土葬或火葬、選擇墓地或靈骨樓塔、決定出殯日期、訂禮堂、訂火化爐、申請埋（火）葬許可證、印訃聞．．等。
- - 本市低收入戶辦理喪葬事宜，需要多少費用？
  - 往生者設籍本市且有低收入戶者，依臺北市市立殯葬設施及服務收費基準表中各項設施及服務，除公墓按表收費外，其餘各項得申請減免：申請遺體寄存費減免期限以三十日為限。
- - 臺北市殯葬管理處所提供之治喪服務項目為何？
  - 臺北市殯葬管理處提供之治喪服務項目如下： ★遺體接運：派車接運遺體至本處第一或第二殯儀館，服務時間08：00~20：00（設籍臺北市亡者，接運地點含臺北市、新北市、基隆市、桃園市等區域；設籍外縣市亡者，接運地點僅限臺北市）。★禮廳租用：出殯、誦經、守靈等禮堂之訂租使用。★遺體處理：如遺體防腐、冷藏、寄存、洗身、穿衣、化妝及大殮等。★火化服務：遺體火化、骨灰罐寄存（陽明山靈骨塔、臻愛樓及富德靈骨樓）。★土葬服務：富德公墓〈限臺北市民〉。 ★臺北市殯葬管理處各項設施使用費，依程序報經臺北市議會審查通過後，經臺北市政府公布施行，並可由第一、二殯儀館服務中心及本處網頁「各項服務收費標準表」中查詢。
- - 如果對相關治喪服務項目有疑問或建議，可向何處洽詢？
  - 如對本處或第一、第二殯儀館服務有任何疑問或建言，可利用以下地址、電話與我們聯繫： (1)第一殯儀館：臺北市民權東路二段145號，電話：25131056~58。(2)第二殯儀館：臺北市辛亥路3段223號2樓 電話：87329756~61。
- - 第一、二殯儀館各級禮堂可容納多少人？
  - 第一殯儀館：甲級廳可容納192人，乙級廳可容納48人，丙級廳可容納32人，丁級廳可容納30人。第二殯儀館：景仰樓乙級廳可容納96人，丙級廳可容納60人。
- - 何謂禮堂善後處理費？
  - 一般禮堂使用後會留下奠祭的輓聯、紙杯等垃圾，該費用即做為清理垃圾的清運費。
- - 遺體冷藏費用如何計算？
  - 1.設籍本市者：(1)遺體冷藏日數在3日以下者，不收費。(2)日數在7日以下者，每日按本處各項服務收費標準表之金額減半收費﹔8日至14日者，按表收費。(3)日數逾14日者，除前14日按表收費每日400元外，自第15日起每日為800元。2.設籍其他縣、市者：(1)日數在7日以下者，每日按本處各項服務收費標準表之金額減半收費﹔8日至14日者，按表收費。(2)日數逾14日者，除前14日按表收費每日800元外，自第15日起每日為1,600元。3.以上日數應併計寄存於第一殯儀館及第二殯儀館之日數。 4.遺體寄存包含冰櫃、停柩室。
- - 請問如何申請海葬？
  - (1)申請資格：海葬報名資格不限國籍及戶籍。(2)檢附文件：　a.檢附申請人身分證明影本（正反面）並攜帶正本以供核對。　　（如委託代辦者，需另附委託書）　b.檢附受葬者之火化許可證明或骨灰(骸)遷出證明或起掘證明文件，並　　攜帶正本以供核對。　c.當日欲陪同申請人登船海上拋灑骨灰者（限兩位家屬登船），亦需檢　　附身份證明文件影本。(3)申請人可至第一、二殯儀館服務中心申請或電　　洽(02)25131055。
- - 有關臺北市鐵觀音包種茶研發推廣中心，十月份與茶相約在貓空活動主題為？
  - 日期主題10/03茶香湯圓DIY與創意咖哩料理教學10/17種子盆栽DIY--蘭嶼羅漢松10/24健康下午茶─水果塔佐水果茶10/31貓空茶鄉巡禮（含：茶製程解說）報名方式：七星生態保育基金會
- - 「台北探索館小志工導覽體驗營」活動時間與內容?
  - 對象：國小四年級以上，國中三年級(九年級)以下之學生。人數：共計10梯次，每梯次限30名。報名時間：即日起開始至額滿為止。培訓日期：10月17日(六)╱10月18日(日)╱10月24日(六)           10月25日(日)╱10月31日(六)╱11月1日(日)        培訓時間：上午梯次╱10：00-12：00         下午梯次╱13：30-15：30報名方式：      1.活動網站報名      2.臺北市政府觀傳局或台北探索館網站下載報名表      3.傳真報名      4.可由學校班級統一團體報名。如班級學生人數超過30名，得以班級為單位報名，並請註明人數。報名網站：http：//discovery.gov.taipei/報名專線：(02)2556-0986報名傳真：(02)2556-0985活動信箱：2015teenagerguide@gmail.com
- - 身心障礙者社會保險保險費補助之申請資格及補助標準為何?如何申請?
  - 一. 補助資格：1.設籍本市。2.領有本市核(換)發或註記之身心障礙證明(或手冊)。3.已參加健保、公保、勞保、軍保、農保等社會保險及國民年金保險者。二. 補助內容：1.補助身心障礙者自付部分保險費。2.健保保險費補助以全民健康保險法第27條所定各項被保險人自付保險費為限，不含二代健保補充保險費。三. 補助標準：1、重、極重度者：全額補助。2、中度者：補助二分之一。3、輕度者：補助四分之一。四.補助方式：每月社會局（或衛生福利部）將補助費直接撥付勞保局、健保署、臺灣銀行等單位，依前項補助標準於自付保費中逕行扣抵，民眾不需提出申請(公保、軍保由投保單位向臺灣銀行提出申請)。
- - 發展遲緩兒童療育補助之應備文件及申請方式
  - 網址：http：//www.dosw.tcg.gov.tw，首頁  身心障礙者服務  早期療育應備文件：1、申請書。2、申請「交通補助費」須檢附下列文件之一：  （1）臺北市政府衛生局就醫護照療育紀錄單。  （2）就醫治療紀錄(療育單位提供之治療紀錄單、紀錄卡等)，若為影本須加蓋療育單位戳章或治療師職名章，並註明療育項目、療育日期。  （3）臺北市政府社會局（以下簡稱本局）發展遲緩兒童療育補助「交通補助費」治療紀錄單。 3、申請「療育訓練費」須檢附下列文件之一：   （1）早期療育訓練費用收據正本，並須註明單月金額、療育項目、療育日期。   （2）本局發展遲緩兒童療育補助「療育訓練費」治療紀錄單，並須黏貼收據正本。4、第一次申請者應檢附綜合評估報告書影本或診斷證明書影本(領有身心障礙證明或手冊，或前已檢附綜合評估報告書影本或發展遲緩診斷證明書影本且效期尚未屆滿者免附)。5、郵局或台北富邦銀行存摺影本（首次申請或變更時須檢附，如戶名非申請人本人或補助對象，須註明關係）。6、其他證明文件。申請方式：備妥前述文件,郵寄至臺北市政府社會局身心障礙者福利科（11008臺北市市府路1號1樓東北區）
- - 紅線禁止停車時間為何？
  - 紅線禁止臨時停車時間為全日24小時，如有縮短，會以標誌及附牌標示禁停的時間。
- - 黃線禁止停車時間為何？
  - 黃線禁止停車時間為每日上午7時至夜間8時，如有延長或縮短，會以標誌及附牌標示禁停時間。
- - 紅黃線外側是否能夠停放車輛？
  - 禁止（臨時）停車紅、黃線的兩側都不得停車。
- - 道路標線下雨天容易導致機車騎士打滑？
  - 1.本市所劃設之交通標線（熱處理聚酯標線）其抗滑係數均達45BPN以上，均符合交通部103年12月頒布「交通工程規範」相關規定。2.又臺北市交通管制工程處已於104年1月30日於重陽橋機車引道試辦劃設抗滑係數達65BPN之標線，後續將漸進式針對本市特殊地點檢討劃設抗滑係數達65BPN之標線，以提升道路標線的防滑能力，維護機車騎士的行車安全。
- - 自行車騎乘於人行道之「人車共道」規定為何？
  - 「人車共道」規劃係依道路交通管理處罰條例第90條之3規定，在人行道適度寬度等條件允許下，設置人車共道標誌，開放自行車與行人共用人行道，但自行車騎乘時仍應禮讓行人優先通行，並禁止騎乘騎樓。
- - 臺北市自行車道規劃方式為何?
  - 1.自行車在現行法規中是屬「慢車」，依道路交通安全規則第124條規定，應靠右側路邊行駛，至「人車共道」係自行車尚未有安全行駛空間前之權宜措施。2.本市自行車道的規劃，將針對主次要幹道(如信義路等)在交通條件許可下，採「人車分道」方式建置自行車道，以提供行人與自行車更佳之通行環境。
- - 台北風格交易所活動期間是什麼時候？
  - 104/10/3-104/11/30
- - 台北探索館「何日君再來─鄧麗君文物紀念展」各區特色內容介紹?
  - 【認識不一樣的鄧麗君】：本區結合「翩翩飛舞•難忘的鄧麗君」影片播放，讓觀展者能細細品味鄧麗君的精彩演出。【經典紀錄區(歷年發行唱片)】：本區完整紀錄著鄧麗君歷年發行過的每一張唱片，讓觀展者一起走入鄧麗君的經典輝煌時刻，尋覓專屬於自己的主題曲。【經典紀錄區(鄧麗君黃金黑膠唱片)】：為了紀念這位對華語樂壇具有深刻影響力的一代歌后，鄧麗君文教基金會與環球音樂合作推出《Just Beginning鄧麗君黃金黑膠唱片》，全球限量發行3,000張，此次特地在本區展出，請一同來見證這經典的輝煌時刻。 【經典紀錄 原版報導】：報導專區展出過去未曾展示過的早期報紙；完整紀錄自她開始嶄露頭角，逐漸成為家喻戶曉大明星的歷程，當中更有她熱心公益，多次參與義演、慷慨捐贈演出酬勞的相關報導，呈現她鮮少為人所知，用實際行動關懷回饋社會的一面。 【紀念郵票】：為紀念鄧小姐的事蹟，鄧麗君文教基金會和各地郵政單位合作，以鄧麗君為主題，出版紀念郵票，其後共出版11套。 【親愛的家 成長紀錄】：此次特地展出她兒少時期的成長點滴、生長環境、幼時模樣、台北故居等照片，這是在紀念鄧麗君系列活動當中，特別公開的珍貴照片，邀請大家共同進入鄧麗君時代的美好時光。 【走入經典 體感互動】：本展特別運用了互動裝置技術，首次規劃與鄧麗君合影的體感互動專區；您可在本區擺出適合姿勢留下倩影，再透過互動裝置，合成到鄧麗君經典照片當中，還能上傳到個人臉書，與好友分享的同時，也永久留存合影紀念。 【經典重現】：鄧麗君酷愛旗袍是眾所皆知的，每在重要的場合及演出中，她總會穿上旗袍，展現中華文化特色；勞軍足跡更是遍佈金門、馬祖外島及全台各地，其中不乏規模盛大的大型晚會。寶石項鍊與耳環，是鄧麗君最愛的首飾之一。【1樓浮空投影區】：一樓特闢專區為展覽特別量身打造的虛擬鄧麗君，特別藉助好萊塢重量級視覺團隊Digital Domain（數字王國），結合最新科技，再現鄧麗君小姐，每半小時引領大家重溫經典歌曲《甜蜜蜜》。
- - 今年票選出的風格百店是哪100家？
  - 本年度選出文青、閨蜜、老台北及夜貓4種主題共100家店家，店家名單可上2015台北風格交易所官方網站>風格店家查詢，或上臺北市商業處網站>新聞稿>2015代表台北城市風格特色店家出爐！查詢。
- - 100家店家是否有優惠？或有相關資料可以索取？
  - 因風格百店係由民眾及名人評審共同選出代表台北風格的店家，故並無提供相關優惠，但民眾可於風格百店免費索取活動文宣品「台北風格任務手札」，若消費達店家低消則可另外獲得集點貼紙。
- - 手札及集點貼紙有何用處？
  - 1.手札內容含名人推薦遊程、風格百店資訊及創意旅遊任務等，只要完成任一任務後拍照上傳活動官網(http：//www.exchange.taipei/upload.php)，即可抽限量100份之悠遊卡手環。2.集滿2種不同風格店家集點貼紙後，貼在店家集點明信片上，即可至9處指定地點免費兌換「12種感受台北的方式」明信片卡本，還可幫您免費寄送明信片！
- - 店家集點明信片要去哪裡索取？/裝置藝術的地點及展出時間？
  - 10/3-11/30於信義誠品前廣場（松高路側中國信託前）展出文青主題-不二良之「釣魚小兔」及西門紅樓前廣場夜貓主題-李明道Akibo之「機器人的夢想銀河探險」，11月將推出第二波之老台北及閨蜜主題裝置藝術。
- - 去哪9處指定地點兌換明信片卡本？
  - 1.Libero Coffee&Bar-咖啡小自由：大安區金華街243巷1號。2.印花樂大稻埕店：大同區民樂街28號。3.疊疊樂(松菸店)：信義區忠孝東路四段553巷22弄49號。4.UC TABLE：萬華區昆明街146號。5.寶島燒創意食堂：大同區民權西路133巷2-1號。6.ABV Bar & Kitchen：大安區光復南路260巷39號。7.HOK House of Kuo：士林區文林路526號。8.青田七六：大安區青田街7巷6號。9.旅樂序精品旅館(3館)：中正區懷寧街34號。（詳細名單可上臺北市商業處網站>新聞稿>2015代表台北城市風格特色店家出爐！查詢。）
- - 網路上可否查到台北風格交易所相關資訊？
  - 可上2015台北風格交易所網站(www.exchange.taipei)、台北風格交易所FB粉絲專頁或上臺北市商業處網站查詢。
- - 目前臺北市是否有辦理「汽車貨運調查」？其調查期間、對象及目的為何？
  - 一、「汽車貨運調查」係由交通部主辦，各縣市政府為協辦機關，負責辦理轄區內之調查業務，為定期按半年辦理之實地訪問調查。二、資料調查期間為104年10月16日至10月22日，以登記於臺北市之自用與營業用貨車為訪查對象。三、該調查主要目的係為蒐集臺灣地區自用與營業貨車之貨運流向及流量等動態資料，以供編製全國性及地區間產業關聯表及交通部研擬汽車貨運管理相關措施之參據。四、本調查之資料經彙總統計後，將刊載於交通部編印之「汽車貨運調查報告」內，有關重要統計結果亦將登載於交通部網站（網址：http：//www.motc.gov.tw/ch/home.jsp?id=56&parentpath=0,6）以供各界參考。
- - 我的寵物過世了，該怎麼處理？
  - 首先，很遺憾您失去了家中心愛的一份子，這邊提供您幾項可處理的方式。一、若您希望為寵物集體火化，可準備下列文件，至本處動物之家辦理。1、申請人須為設籍臺北市之市民或寵物登記於臺北市。2、委託焚化申請書（可於網頁下載或現場填寫）。3、飼主身分證明文件。4、寵物登記證證明文件。5、寵物除戶申請表（現場櫃檯提供）。6、委託焚化規費：5公斤以內新台幣200元、超過5公斤每1公斤加收50元（不足1公斤以1公斤計算）。7、檢具寵物登記證及有效期狂犬病預防注射證明書者，收費可減半。受理地點：臺北市動物之家電話：02-8791-3254地址：臺北市內湖區潭美路852號服務時間：週一至週日每日上午10時至下午4時，國定假日暫停服務。二、若您希望為寵物個別火化，可選擇民間寵物往生服務業者代為處理。經本處蒐集大臺北地區之寵物往生服務業者名單如下（僅列出土地分區為建地或工業區之業者）：1、台北康寧寵物安樂園 http：//www.kanning.com.tw/園區地址：新北市深坑鄉北深路3段93巷51號聯絡電話：02-2664-18262、淺水灣寵物天堂 http：//www.petstw.tw/園區地址：新北市三芝鄉錫板村南勢崗2之7號 聯絡電話：02-2636-92933、玖隆寵物生命禮儀 http：//9pet.com.tw/園區地址：新北市淡水區破瓦厝子1 之10號 聯絡電話：02-2625-67554、萬里福田寵物生命紀念館 http：//www.fucare.com.tw/園區地址：新北市萬里鄉大坪1之1號聯絡電話：02-2492-9388三、另若您有寵物遺灰處理需求，本府殯葬處於木柵富德靈骨樓設有全國首處寵物骨灰灑葬區－「秘密花園」，需要的民眾可在完成寵物火化後，可在完成寵物火化後，攜帶身分證，到臺北市殯葬處富德靈骨樓辦公室填具申請書，免費辦理灑葬。受理地點：富德靈骨樓電話：02-22390898、02-22391590傳真：02-22390956地址：11656臺北市文山區木柵路5段43巷190號臺北市殯葬管理處網站：http：//mso.gov.taipei/ct.asp?xItem=14120&ctNode=2822&mp=107011
