  - 一、收托資格如下：    滿2足月至未滿2足歲之嬰幼兒。但已收托之嬰幼兒得延長收托至已達2歲，尚未依幼兒教育及照顧法規定進入幼兒園者。    嬰幼兒設籍臺北市，且其父母雙方、監護人或實際照顧者(以下簡稱家長)於報名登記日向前推算連續設籍臺北市滿6個月以上者。    前項第二款所稱實際照顧者，指父母雙方或監護人未實際照顧嬰幼兒，而由不具負擔或行使對嬰幼兒權利或義務之他人照顧，並與嬰幼兒共同居住者。    嬰幼兒之家長其中一方為大陸籍或外籍人士，而無法符合設籍之規定，僅需由另一方家長於報名登記日向前推算連續設籍臺北市滿6個月以上，惟另一方大陸籍或外籍人士仍需居留臺北市滿6個月以上(須出示護照或居留證正本)。另如家長雙方皆為大陸籍或外籍人士，則不得報名登記入托。    提供辦理托嬰中心場地之學校教職員工子女及本托嬰中心現職員工子女，得不受第一項第二款設籍之限制。二、招生年齡：滿2足月至未滿2歲。三、實施方式：依下列身分別報名登記：1. 優先收托：優先收托名額為托嬰中心總收托人數20%，如未達收托比例，得以一般家庭嬰幼兒遞補： 　(1)弱勢家庭 (含低收入戶、中低收入戶或經本局核定之危機家庭、特殊境遇家庭)　(2)父母戶內育有3名以上子女家庭之嬰幼兒　(3)具原住民身分之嬰幼兒　(4)發展遲緩或持有輕度身心障礙手冊之嬰幼兒　(5)嬰幼兒其「手足」或「父母或監護人」之一為中度以上身心障礙者2. 提供辦理托嬰中心場地之學校教職員工子女(設置於學校場地始辦理本梯次招生)、 本托嬰中心現職員工子女，收托名額為托嬰中心總收托人數5%，如未達收托比例，得以一般家庭嬰幼兒遞補。3. 一般家庭嬰幼兒。各身分別申請收托嬰幼兒超過收托名額時，採抽籤方式辦理。托嬰中心公告招生期間，每名嬰幼兒不限申請一家。◎每位嬰幼兒以登記1家托嬰中心為限，非經切結放棄不得於第2家登記，違反規定者，取消其所有錄取及就托資格。四、收托時間及費用收托時間為週一至週五8：30∼17：30，收托費用每月1萬1,000元，延托費用及團體保險費另計。另有提前及延後收托服務。
- - 內湖托嬰中心收托資訊?
  - 一、地址：臺北市內湖區內湖路1段659號2樓(捷運港墘站共構大樓)二、電話：02-77097991 、傳真：02-26594664三、收托對象：收托人數上限為45名。(一)優先收托：弱勢家庭嬰幼兒(含低收入戶、中低收入戶或經社會局核定之危機家庭或特殊境遇家庭）、父母戶內育有3名以上子女家庭之嬰幼兒及具原住民身分之嬰幼兒，收托名額為托嬰中心總收托人數10%(5人)，如未達收托比例，得以一般家庭嬰幼兒遞補。(二)一般家庭嬰幼兒。四、登記資格：(一)滿2足月至未滿2足歲之嬰幼兒。但已收托之嬰幼兒得延長收托至已達2歲，尚未依幼兒教育及照顧法規定進入幼兒園者。(二)嬰幼兒設籍臺北市，且其父母雙方、監護人或實際照顧者於報名登記日向前推算連續設籍臺北市滿6個月以上者。所稱實際照顧者，指父母雙方或監護人未實際照顧嬰幼兒，而由不具負擔或行使對嬰幼兒權利或義務之他人照顧，並與嬰幼兒共同居住者。嬰幼兒之家長其中一方為大陸籍或外籍人士，而無法符合設籍之規定，僅需由另一方家長於報名登記日向前推算連續設籍臺北市滿6個月以上。另如家長雙方皆為大陸籍或外籍人士，則不得報名登記入托。五、收托時間及費用收托時間為週一至週五8：30∼17：30，收托費用每月1萬1,000元，延托費用及團體保險費另計。
- - 大湖托嬰中心地址、承辦單位、連絡電話及登記報名事宜
  - 地址：臺北市內湖區大湖山莊街170號1樓（大湖國小溫馨樓）承辦單位：社團法人台北市幼兒園協會電話：02-27943017、傳真：02-27948377服務對象 一、收托資格：(一)滿2足月至未滿2足歲之嬰幼兒。但已收托之嬰幼兒得延長收托至已達2歲，尚未依幼兒教育及照顧法規定進入幼兒園者。收托人數上限為40名。(二)嬰幼兒設籍臺北市，且其父母雙方、監護人或實際照顧者於報名登記日向前推算連續設籍臺北市滿6個月以上者。所稱實際照顧者，指父母雙方或監護人未實際照顧嬰幼兒，而由不具負擔或行使對嬰幼兒權利或義務之他人照顧，並與嬰幼兒共同居住者。嬰幼兒之家長其中一方為大陸籍或外籍人士，而無法符合設籍之規定，僅需由另一方家長於報名登記日向前推算連續設籍臺北市滿6個月以上，惟另一方大陸籍或外籍人士仍需居留臺北市滿6個月以上(須出示護照或居留證正本)。另如家長雙方皆為大陸籍或外籍人士，則不得報名登記入托。提供辦理托嬰中心場地之學校教職員工子女及本托嬰中心員工子女，得不受第一項第二款設籍之限制。二、收托人數：40位嬰幼兒。身分別包含：(一)優先收托：優先收托名額為托嬰中心總收托人數10%(自本（104）年度重新候補登記期程（即報名登記日104年7月4日起修訂為20%)，如未達收托比例，得以一般家庭嬰幼兒遞補；第(4)及(5)款對象，自104年7月4日起適用： 　(1)弱勢家庭 (含低收入戶、中低收入戶或經本局核定之危機家庭、特殊境遇家庭) 　(2)父母戶內育有3名以上子女家庭之嬰幼兒　(3)具原住民身分之嬰幼兒　(4)發展遲緩或持有輕度身心障礙手冊之嬰幼兒　(5)嬰幼兒其「手足」或「父母或監護人」之一為中度以上身心障礙者。(二)提供辦理托嬰中心場地之學校教職員工子女(設置於學校場地始辦理本梯次招生)、 本托嬰中心現職員工子女(本款對象，自104年度重新候補登記期程起適用)，收托名額為托嬰中心總收托人數5%，如未達收托比例，得以一般家庭嬰幼兒遞補。(三)一般家庭嬰幼兒。三、收費：1萬1,000元/月。◎詳細內容請詳參「首頁  嬰幼兒照顧服務  公辦民營托嬰中心  臺北市公辦民營托嬰中心」「招生計畫」。
- - 長青學苑上課地點在哪裡？
  - 上課地點包含各區老人服務中心及本局老人自費安養中心，另有社區大學及公私立學校等處(以最新招生簡章為主)
- - 長青學苑報名上課資格為何？
  - 只要年滿60歲以上，本人、配偶或其直系血親設籍本市者皆可參加。
- - 長青學苑什麼時間招生？
  - 長青學苑每年分為春季班及秋季班招生，報名期間約為每年1月和6月。
- - 長青學苑上課需要收費嗎？
  - 1、 本市公立老人服務中心免收報名費，惟上課所需之教材、雜支等費用需自行負擔2、 本局補助或委託之民營老人服務中心、民間單位等開設之課程，其費用請逕洽該單位。
- - 我是居留在臺北市的外籍人士，並且已經馬偕計畫審核通過，取得經註記「國內大眾運輸工具及公立育樂場所優待字樣」之外僑永久居留證，請問該如何申請臺北市敬老悠遊卡？
  - 為方便符合馬偕計畫優待對象，並居留本市之外籍有貢獻長者搭乘大臺北地區公車、捷運等享有優待，免去每次均需臨櫃以現金購票之不便，本府特開放前揭對象可申請本市敬老悠遊卡(一)，符合資格之優待對象，可檢具本市敬老悠遊卡申請書及下列文件，向各區公所社會課或本局(社會局)提出申請：1.經註記「國內大眾運輸工具及公立育樂場所優待字樣」之外僑永久居留證影本。2.外國護照影本。3.2吋彩色照片1張。
- - 銀髮友善好站洽詢單位為何？
  - 請洽老人福利科詢問，電話：1999(外縣市請撥27208889)轉6967
- - 我的投保單位(特別是公司)如果已經倒閉以致無法取得老人健保自付額之繳費證明應該怎麼辦?(或是其他種種特殊原因以致無法向原投保單位取得繳費證明亦是，如被資遣或解僱.....)
  - 如果向原投保單位取得繳費證明確有困難，您可向中央健保署反映並請健保署協助開立繳費證明即可，健保署臺北業務署電話：02-21912006，免付費服務專線：0800-030598。
- - 公告教育部「高級中等學校訂定學生服裝儀容規定之原則」1份，請各校依說明事項辦理並透過重大集會時機向全校師生宣導及公布周知
  - 一、依據教育部國民及學前教育署105年8月18日臺教國署學字第1050095442號函副本辦理。二、教育部於105年8月於「學校訂定教師輔導與管教學生辦法注意事項」第21點第4項增訂「不得將服裝儀容作為處罰依據」之規定，係為避免過去學校對學生不慎違反服儀規定者，動輒予以記警告、記過等懲處。三、學校對於違反服裝儀容規定之學生，不得加以處罰，為得視其情節，採取適當之輔導或管教措施（指正向管教措施、口頭糾正、列入日常生活表現紀錄、通知監護人協請處理、要求課餘從事可達成管教目的之公共服務、書面自省及靜坐反省）。四、市府申訴專線請撥1999或透過單一陳情系統反映。
- - 本府公務車輛購置租賃與調派管理相關規定？
  - 各機關擬汰換或新購公務車輛（含專用車、特種車、各型貨車、機車，及其他供公務使用之小客車、大客車、客貨兩用車等），及現有公務車輛之調派管理事宜，應優先適用本府公務車輛購置租賃及調派管理暫行措施，但各機關之特種車基於業務需要，得參照前述措施另訂調派管理規定。
- - 各機關配置專用車之正副首長，其公務行程之交通方式？
  - 依本府公務車輛購置租賃及調派管理暫行措施，專用車優先供所配置之正副首長公務行程使用，其餘則應併機關內公務車輛集中調派，又該正副首長上下班之接送或非上班時段排有公務行程，除使用專用車外，亦得比照短程洽公相關規定彈性租用計程車替代駕駛加班接送。又為響應本府綠色運輸政策，每週五之上班（或下班）應儘量採用大眾運輸。
- - 各機關員工因公外出運用相關交通方式之優先順序？
  - 1.處理一般公務以自行往返為原則。2.上班時段有處理急要公務、載送財貨器械、前往地點大眾運輸無法到達，或2人以上同時外出等情形，得申請派車共乘前往。3.前述情形遇現有駕駛不敷調派，或奉派於非上班時段處理急要公務，得由具合格駕照之外出員工自駕公務車輛共乘往返。4.無公務車可派或供自駕，但確有必要短程公出處理急要公務者，得經機關核准於一定額度範圍內報支計程車資。5.特定時段之大量或長途用車需求，經評估現有車輛或駕駛人力將不敷調派，且租用計程車較不經濟者，得本撙節原則辦理短期租賃車輛或駕駛業務短期外包。6.各機關不得提供公務車輛供員工上下班，但員工奉指派臨時處理急要公務，遇大眾運輸停駛致必須租用計程車由服務單位或出勤地點往返居所，其車資得否適度報支事宜，由機關依規定並審酌個案情況，本於權責自行核處。
- - 各機關因公租用計程車之應注意事項？
  - 1.為避免既有公務車輛及駕駛人力閒置，上班時段租用計程車前應先確認無公務車可派或供自駕，非上班時段在減少駕駛加班前提下，則應優先考慮自駕公務車前往。2.計程車係供短程運輸，僅限處理短程急要公務時適度運用，無急要之公務均不宜使用，又雖具急要但屬中長程之公務行程，應優先運用捷運、高鐵、機捷等便捷之大眾運輸到達當地交通樞紐後再短程搭配計程車。3.員工因公外出處理急要公務報支計程車資，如無特殊情形，每筆報支金額上限以300元為限。4.路程相近之公務計程車用車需求，應採併車共乘前往，避免重複浪費。5.請勿在計程車內討論敏感公務內容或涉及違反行政中立事項，並應主動要求司機據實告知不同行駛路線之可能里程與到達時間差異，避免司機不當繞路導致虛增車資或過路費。
