- - 今年的兒童神轎踩街、吉祥物公仔遊行是什麼活動？
  - 兒童神轎踩街，與最具本土文化代表性的鬥土地公遊行，各展臺日文化精髓。還有首次亮相的北投溫泉區吉祥物「巫娃娃」，將與全臺各地及亞太溫泉區的吉祥物如觀光局「喔熊」、2017臺北世大運「熊讚」、日本愛媛縣松山市「蜜柑犬」、山口縣湯田溫泉、日本濱松「家康君」等地的吉祥物公仔到場共襄盛舉。再加上遠自日本愛媛縣松山市而來的和太鼓雷人演出，創造熱鬧的嘉年華遊行大隊。時間 ： 10/22 (六) 10：30：11：30 ; 10/23 (日) 13：30-14：30  地點 ： 光明路至南側道路
