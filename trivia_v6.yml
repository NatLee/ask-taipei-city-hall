- - 收到裁決書應如何繳款?
  - 民眾接獲裁決書，若屬可郵繳(未涉及駕(牌)照吊扣(銷)或記點、記次或車輛檢驗..等)案件，可透過以下方式繳款：  1.持有裁決書(印有三段式條碼且未逾期案件)：  　(1)至郵局櫃檯繳款，即時連線銷案，手續費10元/筆。   　(2)至超商櫃檯(統一、全家、萊爾富及OK超商)繳款，須1-3天銷案，手續費6元/筆。   　(3)至花旗(台灣)、聯邦、台新銀行，須7-10天始得銷案，免手續費。   　(4)亦可選擇下方第2點所列繳款管道繳納。   2.未持有裁決書(逾期亦可繳)：   　(1)可利用超商內多媒體資訊機(統一I-BON、全家FAMIPORT、萊爾富LIFE-ET及OK超商OK go)列印繳款單後至同一超商櫃檯繳  　　款即時連線銷案，手續費13元/筆。   　(2)至台北富邦銀行臨櫃繳款，手續費5元/筆。   　(3)利用中國信託之ATM轉帳繳款，手續費：該行金融卡15元/筆，跨行卡22元/筆，信用卡20元/筆。   　(4)登入監理服務網(手機APP)(https：//www.mvdis.gov.tw) 或撥打語音電話 (412-1111、412-6666接通後按168#)轉帳繳款，手續　　費：金融卡15元/筆，信用卡20元/筆。   　(5)利用花旗網路銀行繳款，手續費：20元/筆。   　(6)親至本所或臺北市區監理所或士林監理站繳款。
