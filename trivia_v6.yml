- - 可以在網路上販賣酒品嗎？有沒有相關罰則？
  - 依菸酒管理法第30條第1項規定：「酒之販賣，不得以自動販賣機、郵購、電子購物或其他無法辨識購買者年齡等方式為之。」所以，在網路販賣酒是不可以的，違反上述規定，會被罰1萬元以上，5萬元以下罰鍰。如有疑義，請洽臺北市政府財政局菸酒暨稅務管理科查詢，電話1999(外縣市02-27208889)轉6294
- - 西門紅樓八角樓預計開放時間
  - 西門紅樓八角樓自2016年8月8日起進行古蹟修復工程，預計2018年春季重新開放。
- - 如果想查詢敬老、愛心悠遊卡每月免費點數或票卡內自行加值之金額該如何查詢(含欲查詢是否有扣款錯誤之情形)？
  - 1.可持卡至臺北捷運各站詢問處旁的自動查詢機、或置於本市各區公所之悠遊卡展期機可查詢該票卡最後6筆刷卡(含加值)紀錄。2.可逕至悠遊卡公司官方網站查詢3日前至3個月內刷卡(及交易)紀錄，網址：https：//ezweb.easycard.com.tw/search/CardSearch.php(路徑：悠遊卡記名設定相關連結記名卡查詢交易紀錄)項下查詢3.如欲查詢較早(最後6筆)以前的刷卡(及交易)紀錄，需致電悠遊卡股份有限公司客服專線查詢；電話(市話直撥)412-8880(手機及金馬地區請加02)。
- - 長青學苑怎麼樣會知道招生訊息？
  - 每期招生前將會在各老服中心、上課地點、捷運站以及區公所等放置招生簡章，或可上本局網站查詢(http：//www.dosw.taipei.gov.tw/)
- - 長青學苑要怎麼報名？
  - 攜帶國民身分證、敬老悠遊卡由本人或出具委託書委託他人直接至欲上課地點報名。
- - 敬老、愛心及愛心陪伴悠遊卡是否也適用悠遊卡小額消費服務？
  - 悠遊卡小額消費服務99年4月1日上線，敬老、愛心及愛心陪伴悠遊卡儲值方式與一般悠遊卡一樣，可適用於各悠遊卡特約商家消費。
- - 臺北市老人健保有補助，為什麼我或者我的子女還在繳費?
  - 一、社會局自99年4月起每月補助額度最高749元，低於749元者核實補助，已獲其他政府機關補助自付之保費部分，不重複補助。二、請先向投保單位查詢本市補助部份是否已扣除，如健保署已註記減免但投保單位仍收費，應由投保單位退費予民眾。三、民眾原應繳納之保費超過補助額度，超過部分仍需自行繳納。四、如健保署未減免但民眾表示符合補助資格，請洽社會局老人福利科查詢。
- - 我已遷出臺北市，想要退卡片裡面餘額，要怎麼辦呢？
  - 依「悠遊卡約定條款」第十二條第一款退款辦法辦理，詳情請洽悠遊卡公司，電話：412-8880(手機或金馬地區請撥：02-412-8880)目前捷運各車站無法受理記名式悠遊卡立即退卡退費業務，如敬老或愛心悠遊卡持卡人欲退回票卡餘額，可透過下列方式：(一)持卡至各區公所或捷運站受理後送退卡，由悠遊卡總公司收件後處理。(二)至全省統一超商(7-11)索取附掛號郵資退卡專用信封，自行掛號郵寄至悠遊卡總公司辦理退卡退費。(三)攜帶身分證明文件正本(代辦人請攜帶雙方身分證明文件正本)至悠遊卡市府轉運站客服中心(市府轉運站一樓，請由市府捷運站2號出口進入)辦理立即退卡或後送退卡。
- - 有關關渡花海活動時間？地點為何？
