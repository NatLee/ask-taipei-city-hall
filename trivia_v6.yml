- - 【資優生】資優生從國外回國就學，請問就學可否採跳級方式? 相關鑑定如何?
  - 由國外回國之高中職或國中小資優學生，如欲申請全部學科(學習領域)跳級，需依本市高級中等以下學校資賦優異學生縮短修業年限實施要點規定辦理，相關申請及鑑定程序如下：(一)依學校公布之資賦優異學生縮短修業年限實施計畫相關規定及申請期限，向學校提出申請(原則上第1學期於9月15日前或第2學期於3月1日前)。(二)學校組成評量小組召開評量會議，審議資賦優異學生申請縮短修業年限案，並辦理評量作業。(三)申請全部學科跳級者，應檢附鑑定資料及學習輔導計畫，由學校於每年10月31日、1月31日、4月15日或7月15日之前函報教育局，提臺北市特殊教育學生鑑定及就學輔導會審議通過及本局核定後實施。(四)如仍有縮短修業年限相關問題，請洽1999（外縣市02-27208889）轉1089
- - 是否單親婦女就可申請進住臺北市政府婦女中途之家(原稱慧心家園)？
  - 1、單親婦女須為設籍本市之市民，或與本市市民辦理結婚登記之新移民，因離婚、喪偶、夫服刑或失蹤、未婚懷孕或其他家庭變故等因素，獨立照顧共同生活之18歲以下未婚子女，並符合下列條件：（1）申請人及其子女總收入，平均每人每月不超過新臺幣2萬1,733元。（106年標準）（2）申請人及其子女動產平均每人不超過新臺幣46萬6,320元。（106年標準）（3）不動產全戶不超過新臺幣650萬元。（4）申請人及其子女均無自有住宅。（5）申請人能自理其家庭生活。（6）20歲以下未婚之申請人，須經法定代理人同意後才可申請。2、有意申請進住者，請檢附申請表內所需文件，並經訪視評估符合進住標準，於領收進住同意函後，即可於文到日30日內安排進住，若有疑問請逕洽臺北市政府婦女中途之家，電話：02-2701-1828。3、申請表及相關辦法下載： https：//goo.gl/i3LWQk
