- - 有關106年7月29日「讀愛溫羅町周末市集」活動，因應尼莎颱風來襲取消辦理。
  - 因應尼莎颱風來襲，「解嚴三十跨界閱讀市集」活動取消，「臺灣的自由主義燈塔」走讀活動延期辦理，日期另行公告。
- - 目前臺北市是否有辦理106年「職類別薪資調查」、「受僱員工薪資調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「職類別薪資調查」、「受僱員工薪資調查」係分別由勞動部統計處及行政院主計總處主辦，各縣市政府為協辦機關，負責辦理各該轄區之調查業務。二、職類別薪資調查之調查期間自106年8月1日起至8月31日止，受僱員工薪資調查之調查期間自106年8月至107年7月按月填報。凡從事礦業及土石採取業、製造業、電力及燃氣供應業、用水供應及汙染整治業、營造業、批發及零售業、運輸及倉儲業、住宿及餐飲業、資訊及通訊傳播業、金融及保險業、不動產業、專業科學及技術服務業、支援服務業、補習教育業、醫療保健服務業、藝術娛樂及休閒服務業、其他服務業等之公、民營事業場所單位均為調查對象。三、職類別薪資調查之目的為蒐集各行業及職類別受僱員工人數、薪資水準、廠商規定工作時間、初任人員經常性薪資給付等資料，供為政府修訂法規、釐訂施政計畫及業者訂定員工薪資、增進員工福祉等參據。受僱員工薪資調查之目的為了解臺灣地區受僱員工人數、薪資、工時、員工進退情形，供為研訂經建計畫及產業政策之參據。旨揭調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請受訪廠商支持合作，提供正確詳實資料。四、職類別薪資調查結果請逕至勞動部網站（http：//www.mol.gov.tw）「勞動統計專網/統計資料庫查詢」項下查詢。受僱員工薪資調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw） 「政府統計 / 主計總處統計專區 / 薪資及生產力統計 / 統計表 / 受僱員工薪資調查統計」項下查詢。
- - 申請愛心餐券對象為何？
  - 經本市各社福中心社工師(員)評估有經濟困難且居住本市之家庭，以戶內有未成年子女者為優先。
