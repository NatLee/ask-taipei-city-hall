- - 申請(含遺失補發)敬老、愛心及愛心陪伴悠遊卡需多久時間才能領到卡片？若已申請辦好了，在領取時，可否委託人代領？
  - 1.申現場製卡依區公所人員通知時間取卡，如需後送悠遊卡公司製卡則自申請次日起算約2~2.5週。  2.可以委託他人代為領卡；代領人需攜帶本人身分證及持卡人身分證正本（申辦愛心卡者需多攜帶持卡人身心障礙手冊或證明）。3.如無法現場領到卡片，候卡期間得向受理申辦之區公所申請核發替代卡提供乘車補助，該替代卡應於領取新製或補發之票卡時繳回。
