  - 內政部營建署網站首頁（網址：http：//www.cpami.gov.tw）右側→「快捷服務」→「住宅補貼專區」106年度修繕住宅貸款利息補貼問與答一、　　什麼是修繕住宅貸款利息補貼？二、　　申請本貸款利息補貼者應具備哪些條件？三、　　哪些情形不得申請本貸款利息補貼？四、　　今（106）年度什麼時候開始受理申請？五、　　今（106）年度計畫辦理多少戶？符合條件的申請人都可以獲得補貼嗎？六、　　申請書要到哪裡索取或下載？七、　　如何申請？向哪裡申請？八、　　申請時應檢附哪些文件？九、　　申請人提出申請後，政府如何審查？多久可以知道審查結果？十、　　申請人經政府核定，取得政府核發的「修繕住宅貸款利息補貼證明」後，就可以辦理貸款修繕住宅了嗎？「修繕住宅貸款利息補貼證明」有沒有期限的限制？十一、　申請「修繕住宅貸款利息補貼」可修繕之項目為何？十二、　民眾因急迫性需修繕住宅，但因住宅補貼尚未公告受理申請，致無法申請修繕住宅貸款利息補貼，應如何辦理？十三、　若尚未取得修繕住宅貸款利息補貼資格，且未經直轄市、縣（市）政府認定具有修繕急迫性並向金融機構辦理一般修繕住宅貸款，可否自行開始修繕住宅呢？十四、　辦理本貸款的金融機構是哪幾家？十五、　辦理本貸款的住宅有沒有什麼特別的規定？十六、　本貸款的優惠貸款額度、償還年限及優惠利率？十七、　持有共有住宅，何種情形視為有1戶自有住宅？十八、　持有共有住宅，可否視為無自有住宅？十九、　本修繕住宅貸款利息補貼是否會定期查核接受補貼者之資格？多久查1次？什麼情況會停止利息補貼？二十、　申請人及其家庭成員的家庭年所得、動產及不動產持有狀況，由誰查核？如何查核？二十一、應列入查核的家庭成員有哪些人？二十二、家庭年所得及財產，應符合中央主管機關所定之基準為何？二十三、每人每月平均所得應低於一定金額，要如何計算？二十四、家庭年所得及財產，今（106）年度住宅補貼申請案將採計哪一年度之財稅資料？二十五、評點時，家庭成員具備哪些條件會獲得加分？二十六、評點時，家庭成員如果有哪些情況會減分？二十七、以「父母均已死亡，戶籍內有未滿20歲或已滿20歲仍在學之兄弟姐妹需要照顧者」條件申請，已滿20歲仍在學，就讀夜間部、空中大學、補校等是否可以？二十八、本補貼所稱的「特殊境遇家庭」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）二十九、本補貼所稱的「單親家庭」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）三十、　本補貼所稱的「生育有未成年子女」定義是什麼？三十一、什麼是基本居住水準？什麼是平均每人居住樓地板面積未達基本居住面積標準？什麼是未具備衛浴設備？三十二、什麼是「有結構安全疑慮之住宅」？三十三、本補貼所稱的「三代同堂」定義是什麼？三十四、本補貼所稱的「災民」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）三十五、本補貼所稱的「遊民」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）三十六、本補貼所稱的「列冊獨居老人」定義是什麼？（檢附之文件請看第八題；不具備者，免附。）三十七、同一家庭的成員，可以分別向不同的直轄市、縣（市）主管機關申請自購住宅貸款利息補貼、修繕住宅貸款利息補貼或租金補貼嗎？三十八、申請人或其家庭成員正辦理國宅、勞工建購（修繕）住宅貸款、公教住宅貸款、輔助人民自購住宅貸款、青年購屋低利貸款、新臺幣1兆8千億元優惠房貸或其他政策性房屋貸款，可以再申請本貸款利息補貼嗎？三十九、申請人要修繕的住宅目前正辦理一般住宅貸款或政府的優惠購屋貸款，可以再申請本項修繕住宅貸款利息補貼嗎？四十、　已申請財政部之「公股銀行辦理青年安心成家購屋優惠貸款」，可以再申請本項修繕住宅貸款利息補貼嗎？四十ㄧ、如果申請人及其家庭成員除了要修繕的住宅外，還持有其他的不動產（例如土地、辦公室、店舖等…）可以申請本項修繕住宅貸款利息補貼嗎？四十二、除了修繕住宅貸款利息補貼外，政府還有辦理其他的住宅補貼嗎？四十三、關於本貸款利息補貼如果有其他問題，要向哪裡詢問？
- - 發現未滿18歲之兒童或少年，遭受性剝削（如坐檯陪酒、伴唱伴遊、色情侍應），該怎麼檢舉通報？
  - 請報警100或113。
- - 成人健檢資格為何？
  - 必須為參加全民健康保險而無欠繳保險費者，年齡資格如下：1.40歲至64歲，每3年補助1次。2.65歲以上者，每1年補助1次。3.罹患小兒麻痺且年在35歲以上者，每1年補助1次。4.55歲以上原住民，每1年補助1次。
- - 接受成人健康檢查要花錢嗎？
  - 特約醫療院所可以收行政規費（掛號費），但成人健檢之檢查項目費用為免費。
- - 成人健檢有哪些檢查項目？
  - 1.身體檢查：  包含：身高、體重、脈搏、血壓、腰圍、身體質量指數(BMI)、眼睛視力、耳鼻喉及口腔、頸部檢查、胸部檢查、心臟聽診、呼吸聽診、四肢檢查。2.尿液檢查：尿液蛋白質檢查。3.生化檢查：  包含：血糖、總膽固醇、三酸甘油酯、高密度脂蛋白膽固醇、低密度脂蛋白膽固醇、AST(GOT)、 ALT(GPT)、肌酸酐、腎絲球過濾率（eGFR）。4.健康諮詢：  包含：戒菸、節酒、戒檳榔、規律運動、維持正常體重、健康飲食、事故傷害預防、口腔保健。
- - 哪裡可以接受成人健康檢查？可以由哪個管道查詢?
  - 至衛生福利部中央健康保險署之特約醫療院所接受檢查，特約醫療院所名單可至以下單位查詢：1.衛生福利部中央健康保險署：一般民眾/網路申辦及查詢/就醫資訊/看診科別及就醫地圖網路查詢服務，服務項目選擇「成人預防保健」即可查詢。網址：http：//www.nhi.gov.tw/Query/query3.aspx?menu=20&menu_id=712&webdata_id=3695&WD_ID=7122.臺北市政府衛生局網站http：//health.gov.taipei/主題專區/ 成人及中老年保健/成人預防保健查詢即可。網址：http：//health.gov.taipei/Default.aspx?tabid=812
- - 到醫院登記成人健康檢查應帶什麼證件？
  - 請攜帶相關證件至成人健檢特約醫院登記，所需證件：身分證、健保IC卡。
- - 接到電話提醒要做子宮抹片檢查及乳癌篩檢，可以獲得刮刮卡參加抽獎，是詐騙電話嗎?
  - 不是詐騙電話，凡符合資格並完成篩檢即可獲得刮刮卡一張，完成1項篩檢可獲得1張刮刮卡，完成2項篩檢則獲得2張刮刮卡，獎項有1萬元、1,000元、500元及100超商禮?等，6月份加碼早鳥禮，數量有限送完為止。
- - 106年度「健康刮刮樂婦癌篩檢獎勵」參加資格是什麼?當天要攜帶什麼?活動時間及地點為何?
  - 一、參加資格：1.乳癌篩檢： (1)年滿45歲至70歲（36-61年次）105年迄今未接受乳房X光攝影檢查之設籍臺北市女性市民。 (2)40歲至44歲（62-66年次）二等親（外祖母、祖母、媽媽、姊妹、女兒）內曾罹患乳癌，且105年迄今未接受乳房X光攝影檢查之設籍臺北市女性市民。2.子宮頸癌篩檢：年滿30歲至69歲（37-76年次），且104年迄今未接受子宮頸抹片檢查之設籍臺北市女性市民。二、106年6月1日（星期四）起至106年10月31日（星期二）止，攜帶健保卡至健保特約醫療院所或社區完成篩檢即可獲得刮刮卡1張。三、詳細資料可上【臺北市政府衛生局】官網/主題專區/癌症防治/最新消息查詢【http：//health.gov.taipei/Default.aspx?tabid=655&mid=1975&itemid=40382】。
- - 請問符合乳癌篩檢的篩檢對象為何?
  - 篩檢對象：(1)年滿45歲至70歲（36-61年次）105年迄今未接受乳房X光攝影檢查之女性市民。                                   　　　　        (2)40歲至44歲（62-66年次）二等親（外祖母、祖母、媽媽、姊妹、女兒）內曾罹患乳癌，且105年迄今未接受乳房X光攝影檢查之女性市民。每2年1次免費乳房X光攝影檢查，請至健保特約乳房X光攝影醫療院所檢查。
- - 請問子宮抹片檢查的篩檢對象為何?
  - 篩檢對象：30歲（76年次）以上女性市民每年1次免費子宮頸抹片檢查，至少每3年1次檢查，請至健保特約醫療院所檢查。
- - 請問哪裡可作乳癌篩檢或子宮抹片檢查?
  - 本市健保特約醫療院所，詳細資料可上【臺北市政府衛生局】官網/癌症防治便利網特區查詢【http：//health.gov.taipei/Default.aspx?tabid=657】。
- - 請問政府提供的免費癌症篩檢需要攜帶什麼證件，才能受檢?哪些注意事項?
  - 1.請務必攜帶健保卡。2.欲做子宮頸抹片檢查者請穿著裙裝以方便檢查。3.女性於懷孕或生理期請勿接受子宮頸抹片檢查。
- - oBike無樁式共享單車說明
  - oBike無樁式共享單車係由台灣奧致網絡科技有限公司自行經營，非由市府提供及營運，為保護消費者權益及管理自行車停放秩序，本府已要求oBike業者依交通部訂定之「自行車租賃定型化契約應記載及不得記載事項」，擬訂完善之營運計畫並確保消費者權益與安全保障。oBike業者及使用者應遵守道路交通安全規則，如有違規停車等情事，亦將依道路交通管理處罰條例勸導、取締或移置，民眾使用oBike如有相關問題，可撥打客服電話：(02)2351-7100。
- - 松山親子館地址、電話、開放時間、服務內容、預約方式?
  - 一、地址：臺北市松山區民生東路5段163之1號3樓(民生社區中心)二、電話：02-27661266三、開放時間：每週二至週五第一場9：30∼12：00；第二場14：00∼17：00。週六、週日第一場9：30∼11：00；第二場13：00∼14：30；第三場15：30∼17：00。每週一及經政府公告之放假日為休館日。四、設施及活動規劃：學步前區、親子共讀區、探索區、手創區、烹飪區、益智區及多功能教室等。五、使用松山親子館是不需要付費的喔！但為了控管使用品質，每場次限制37對親子使用。
- - 在申請創業補助階段時，若公司欲申請100萬補助款，請問公司是否必須提供100萬的自籌款證明?
  - 公司在申請階段不需要提供100萬的自籌款證明，但在計畫結束時，要提供計畫經費所有單據來做核銷。
- - 「臺北市市民以工代賑輔導自治條例」修法後，臨時工可以做幾年?
  - 因為有兩年的緩衝，現任臨時工暫時不會受年限的規定的影響，兩年後才開始有年限規定，規定如下：(1)未滿35歲者可做1年；(2)35歲~未滿55歲者可做3年；(3)不受年限限制者如下：A.55歲以上代賑工B.身心障礙者C.因離婚、喪偶、未婚生子獨自扶養子女或獨自扶養十二歲以下父母無力扶養之孫子女。D.因照顧特定身心障礙、罹患特定病症且不能自理生活之共同生活親屬者。
- - 有哪些福利措施可以紓解單親家庭撫育子女之經濟壓力及托育問題？
  - 本府社會局提供以下福利措施，紓解單親家庭照顧子女的經濟及托育壓力：一、弱勢家庭兒童及少年緊急生活扶助：設籍本市且未滿18歲之兒童及少年，符合弱勢家庭兒童及少年緊急生活扶助計畫之扶助對象，每人每月補助3,000元，洽辦單位為社會局兒少科，市民熱線1999轉6972~74。二、育兒津貼：補助5足歲以下兒童，每童每月2,500元，洽辦單位皆為兒童戶籍所在地區公所社會課。三、父母未就業家庭育兒津貼：補助2足歲以下兒童，每童每月2,500元至5,000元，洽辦單位皆為兒童戶籍所在地區公所社會課。四、危機家庭兒童送托保母、托嬰中心、幼兒園或課後照顧服務中心之托育補助：每人每月3,500~8,000元不等，洽辦單位為社會局婦女福利及兒童托育科，市民熱線1999轉1622~25。五、低收入戶健保費補助：針對本市列冊低收入戶，全額補助健保費用，洽辦單位為戶籍所在地區公所社會課。 六、6歲以下兒童醫療補助：洽辦單位為本市各區健康服務中心或衛生局醫護管理處兒童醫療補助小組，市民熱線1999轉7084。七、中低收入家庭兒童及少年全民健康保險保險費自付額補助：洽辦單位為本市各區公所社會課或社會局兒少科，市民熱線1999轉6972~74。八、危機家庭兒童及少年委託安置費用補助：針對18歲以下設籍本市之兒童及少年，家庭突遭變故而無法於家庭生活者，經社工員評估後提供團體式機構或親屬家庭、寄養家庭之教養照顧，洽辦單位為本市各區社會福利服務中心或社會局兒少科，市民熱線1999轉6972~74。
- - 單親家庭在臺北市可以運用的福利服務有哪些？
  - 單親家庭在生活上有多方面的需求，本府特別針對單親家庭提供經濟協助、福利諮詢、心理輔導、就業轉介、托育與照顧、法律諮詢、居住及家庭福利等各項服務，如有需要了解更詳細的服務內容，歡迎留下郵寄地址索取「臺北市單親家庭服務簡介」、「臺北市婦女福利簡介」及「特殊境遇家庭扶助簡介」，或洽詢各區社會福利服務中心及婦女暨家庭服務中心。
- - 臺北市有哪些單位提供單親家庭輔導服務？
  - 有關單親家庭福利服務您可洽詢各區社福中心或婦女暨家庭服務中心，聯繫方式如下：一、各區社會福利服務中心：中山社福中心，電話25156222大同社福中心，電話25974280中正社福中心，電話23962332萬華社福中心，電話23365700大安社福中心，電話27030523文山社福中心，電話29323587信義社福中心，電話27616515松山社福中心，電話27565018內湖社福中心，電話27928701南港社福中心，電話27831407士林社福中心，電話28350247北投社福中心，電話28945933二、各區婦女暨家庭服務中心：臺北市西區單親家庭服務中心，電話2558-0170臺北市松德婦女暨家庭服務中心，電話2759-9176臺北市北投婦女暨家庭服務中心，電話2896-1918臺北市內湖婦女暨家庭服務中心，電話2634-9952臺北市大安婦女暨家庭服務中心，電話2700-7885臺北市東區單親家庭服務中心， 電話2768-5256臺北市文山婦女暨家庭服務中心，電話2935-9595臺北市大直婦女暨家庭服務中心，電話2532-1213臺北市萬華婦女暨家庭服務中心，電話2303-0105臺北市新移民婦女暨家庭服務中心，電話2558-0133
- - 本市單親家庭可以運用哪些資源處理就業需求？
  - 一、以工代賑，提供16歲以上至65歲以下具有工作能力之低收入戶、中低收入戶、清寒戶之工作機會，洽辦單位為戶籍所在地區公所社會課。二、就業服務及職能培育，協助求職民眾進行就業諮詢、就業輔導及職能培育訓練，洽辦單位為本市就業服務處，電話：2308-5231，及本市職能發展學院，電話：2872-1940。三、弱勢婦女就（創）業育成整合性服務方案，本府社會局補助民間團體辦理相關教育訓練及就業媒合方案、就（創）業過程之情緒調適、專業諮詢、在職訓練等支持性方案，提升特殊境遇婦女、單親、低收入戶、身心障礙者、中高齡或原住民婦女等就（創）業能力。洽詢單位為社會局婦幼科，市民熱線1999轉分機6969~71。四、特殊境遇家庭創業貸款補助：符合特殊境遇家庭扶助條例之扶助對象，經本府社會局核定身分，憑身分認定公函洽社團法人中華民國全國中小企業總會辦理創業貸款補助，身分認定單位為社會局婦幼科，市民熱線1999轉分機6969~71；洽辦單位為社團法人中華民國全國中小企業總會，電話：0800092957或23660812轉170。五、促進特殊境遇家庭創業貸款補助：為協助特殊境遇家庭民眾創業，凡經認定年滿20歲以上至65歲以下具特殊境遇家庭身分民眾，申貸「微型創業鳳凰」可由承貸銀行向該會申請利息補貼，申貸者可享前3年免息第4年起負擔年息1.5%之優惠，洽辦單位為社團法人中華民國全國中小企業總會，電話：0800092957或23660812轉170。
- - 有經濟困難的單親家庭可以申請哪些經濟補助？
  - 有經濟困難的單親家庭可以申請的社會福利補助如下，但各項福利資格及審核程序，仍以申請文件和審核結果為準：1.馬上關懷急難救助：提供遭逢急迫性變故致家庭生活陷於困境之民眾，及時性之經濟紓困，洽辦單位為居住所在地區公所社會課。2.低收入戶生活補助：設籍並實際居住本市、最近一年居住國內超過183日，符合社會救助法之扶助對象，提供家庭生活扶助、健保費、醫療費、學雜費減免、就學交通費等補助，洽辦單位為戶籍所在地區公所社會課及子女就讀學校。3.中低收入戶生活補助：設籍並實際居住本市、最近一年居住國內超過183日，符合社會救助法之扶助對象，提供全民健康保險應自付額保險費之二分之一、醫療、學雜費減免等補助，洽辦單位為戶籍所在地區公所社會課及子女就讀學校。4.弱勢家庭兒童及少年緊急生活扶助：設籍本市且未滿18歲之兒童及少年，符合弱勢家庭兒童及少年緊急生活扶助計畫之扶助對象，每人每月補助3,000元，洽辦單位為社會局兒少科，市民熱線1999轉6972~74。5.中低收入家庭兒童及少年全民健康保險保險費自付額補助：經審符合本市「中低收入戶」內18歲以下之兒童及少年即獲本補助，毋需另備文件提出申請，洽辦單位為戶籍所在地區公所社會課或社會局兒少科，市民熱線：1999轉6972~74。6.特殊境遇家庭扶助：符合特殊境遇家庭扶助條例之扶助對象，提供緊急生活扶助、傷病醫療補助、兒童優先進入公立幼兒園、兒童托育津貼、子女生活津貼、子女教育補助及創業貸款補助等扶助項目，洽辦單位為社會局婦幼科，市民熱線1999轉6969~71。7.內政部住宅補貼：內容包含租金補貼、自購住宅貸款利息補貼及修繕住宅貸款利息補貼，申請資格、方式及書表請逕至內政部營建署網站：http：//pip.moi.gov.tw/查詢，洽辦單位為本府都市發展局住宅服務科，電話：2777-2186按0再轉1。8.提供短期經濟困難民眾健保費協助措施，如分期繳納健保費等措施，洽辦單位為衛生福利部中央健康保險署，電話：0800030598。
