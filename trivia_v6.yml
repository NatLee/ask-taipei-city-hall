- - 106年度淘汰二行程機車補助作業 Q&A
  - Q1：為什麼要淘汰二行程機車？A1：依據機車排氣定檢濃度顯示，二行程機車的空氣污染物排放濃度較同期四行程機車排放濃度高2至5倍，且二行程機車因機油參與燃燒易冒白煙，向來為民眾所詬病，且易遭受檢舉為烏賊車，因此車主淘汰老舊二行程機車，不但可以為改善空氣品質盡一份心力，也可以避免遭受檢舉困擾。Q2：如何辨別是否為二行程機車？A2：可透過機油的更換方式來判斷所屬機車是否為二行程，因二行程機車的儀表板上有個機油燈，機油快用完時會亮紅燈，車主必須購買機油來添加。而四行程機車的機油則是行駛一定里程，如1,000公里即需更換，且更換時須先將舊機油漏光後再加入新機油。Q3：補助金額多少？A3：每輛1,500元。Q4：審核作業及撥款時間多久？A4：補助款核撥時間，從申請人將相關文件送至環保局，經審核通過至撥款約於60天內完成。Q5：撥款方式為何？A5：環保局均以電匯方式核撥，審核通過後將依申請人指定檢附之金融機構帳戶辦理匯款撥付作業。Q6：補助資格為何？A6：補助對象以車輛設籍於本市之二行程機車之車主，且符合下列各款條件者：一、92年12月31日(含)以前出廠。二、於回收或報廢當(106)年度或前一(105、104)年度曾實施機車排氣定期或不定期檢驗。三、於106年1月1日至106年12月15日（含）前由行政院環境保護署認可之機動車輛回收商回收車體及向公路監理機關完成報廢者。四、公務機關、公立學校及公營事業等公務單位所報廢之車輛則不列入獎勵對象。五、 另如有105年已完成回收或報廢且符合補助但尚未提出申請者，仍可於106年提出申請。Q7：公務單位報廢車輛可否申請補助？A7：公務機關、公立學校及公營事業等公務單位所報廢之車輛不列入獎勵對象，故不可申請補助。Q8：申請期限到何時截止呢？A8：申請補助者應於107年1月10日(含)以前提出申請(以郵戳日期憑)，逾期不予受理；或若補助已達7,500輛滿額，便同樣不予受理。Q9：如何申請呢？A9：申請補助者應將二行程機車交予行政院環境保護署登記核可之廢機動車輛回收商進行回收及完成報廢，並將申請表填寫後郵寄至「(11008)臺北市信義區市府路1號7樓東北區；收件人：環保局空污噪音防制科」。或於完成回收及報廢後逕至臺北市環保局空污噪音防制科辦理。Q10：申請本補助需要哪些文件？A10：（一）臺北市環境保護局補助淘汰二行程機車申請表（以下簡稱申請表，如附件1）。 （二）車主身分證明文件影本：車主為個人者請檢附身分證影本，如為公司行號者請檢附商業登記證明文件或政府機關核准登記證明文件影本。若車主死亡請檢附死亡證明書或除戶之戶籍謄本影本。 （三）報廢及回收證明文件影本：應檢附監理單位核發之「汽(機)車各項異動登記書」影本及行政院環境保護署廢機動車輛回收管制聯單（第三聯車主存查聯）影本。 （四）前述（二）、（三）項證明文件影本，請依「檢附申請文件表」（如附件2）所載次序依序黏貼，以供審核。 （五）其他經本局指定之證明文件。 各證明文件之內容、簽名及核章應清晰可供辨認。各證明文件之內容、簽名及核章應清晰可供辨認。Q11：如果還有相關問題怎麼辦呢？A11：請於上班期間撥打專線：(02)27208889轉7246
