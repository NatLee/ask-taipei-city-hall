- - 本市公立靈骨樓（塔）為何自102年起全面禁止焚燒金銀紙？
  - 因地球暖化，造成全球各地氣候異常，政府現提倡節能減碳政策，為落實此項政策，必須由政府機關率先做起，故本處將自102年1月1日起，全面禁止焚燒金、銀紙等，並由本處提供免費之集中焚燒紙袋及代集中焚燒服務，此項政策倘若造成不便之處，敬請見諒。民眾追思先人可有多種方式表達，亦可以鮮花、清茶、水果等祭拜，只要是用誠心敬意的心，亦能表達孝心於萬分。
- - 「違規停車逕行舉發標示單」(俗稱白單)及「違反道路交通管理事件通知單」(俗稱紅單)有什麼差別?
  - 答：本局目前舉發交通違規會開立「違規停車逕行舉發標示單」及「違反道路交通管理事件通知單」，區分如下：一、逕行舉發違規停車標示單(如圖示一)：駕駛人違規停車而不在現場時，員警因無法當場開立違規通知單，所以會拍攝違規照片並開立「違規停車逕行舉發標示單」黏貼於車輛擋風玻璃或機車車身明顯處，避免其他員警於2小時內重複舉發，亦得提醒駕駛人該處為禁止停放地點，避免再次違規。標示單只是通知性質，不得作為繳費使用，真正的「違反道路交通管理事件通知單」將於1個月內掛號郵寄予汽車所有人，車主得於45天內持收受的紅單繳費。(圖示一正面)(圖示一背面)二、違反道路交通管理事件通知單：(一)可以分成「紙本通知單」及因拍照舉發(如超速、闖紅燈或違規停車等)或民眾檢舉事後寄送的「郵簡式通知單」。兩者格式均相同，大小為19.5公分13.5公分的紅色紙張(如圖示二)。(二)員警以行動載具當場舉發列印的感熱紙通知單。大小為7.6公分17.8公分的白色感熱紙張(如圖示三)。(三)兩者都是正式的通知單，正面印有相關舉發及違規資料，背面印有注意事項及繳費須知，員警現場交付駕駛人後將不再另寄通知單。當場舉發案件，民眾可於5天後、30天內持手寫紙本通知單或感熱紙通知單繳納罰鍰；其餘事後郵寄收到的通知單(如民眾檢舉、肇事舉發等)可於收到通知單45天內繳納罰鍰。(圖示二正面)(圖示二背面)(圖示三正面、背面)
