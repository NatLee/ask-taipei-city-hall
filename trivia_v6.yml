- - 什麼是i-Voting
  - 指經行政機關或非行政機關提案，透過多元方式討論，進行意見表達後之投票結果，由議案主責機關參採運用之網路參與機制。
- - i-Voting新制流程是什麼？
  - i-Voting新制包含「提案階段」、「提案初審階段」、「提案討論階段」、「形成選項階段」、「上架宣傳階段」及「投票、結果公布及執行階段」共6個階段。
- - i-Voting新制和舊制不同之處
  - 新制將i-Voting定義與流程更加明確化，除了詳列6階段各階段執行工作、非行政機關提案方式與管道，及提案範圍外，並新增提案/討論平臺、成立審查會議及納入外聘委員，使審查更為客觀中立。同時，亦強化議案主責機關應將投票結果後續執行進度與內容持續公布，讓民眾了解辦理情形。
- - i-Voting制度的沿革
  - i-Voting係於104年8月5日頒布「臺北市政府i-Voting網路投票作業注意事項」，系統於105年1月上線，迄今共執行10項議題，由於面臨許多挑戰，如投票率低、1人多票易導致灌票，及i-Voting定位不清等問題，因此自105年5月開始，透過多次精進會議，與不同領域專家學者（包含網路工作者、公參會委員、政治/公行等專長之學者專家）討論請益，將i-Voting之定位重新設定，並新增討論/提案平臺、增邀外聘委員成立審查會議等機制。
- - 2017臺北兒童藝術節FAQ
  - 一、活動時間：6/30∼8/6二、活動網址：www.taipeicaf.org 三、活動專線電話：(02)2528-9580#180、184、191-194（台北市文化基金會）四、童心護照那裡拿？1.臺北市立學校：臺北市公私立國小、幼兒園：5/15-5/26會陸續配送至臺北市公私立國小及其附設幼兒園、公私立幼兒園(教育局資料中大班人數達25人以上才主動配送)。2.5/15起可索取：市政府1樓大廳。3.6/5起可索取：童心優惠合作館舍、表演場館、臺北市立圖書館各分館、旅遊服務中心、兩廳院售票端點(台北市及新北市)，建議索取前先打電話詢問場館。五、售票時間：(每人每次限購6張)1、6/10(六)中午12：00開賣於兩廳院售票系統開賣。2、國際節目與自製節目(拇指小英雄)：只開放售票處售票，新竹以北（含雙北、宜蘭、基隆、桃園、新竹）「兩廳院售票系統」售票處，含超商-全家Fami port、萊爾富、7-11 ibon票點。3、國內節目：網路及兩廳院全台端點售票。
- - i-Voting過去曾執行過哪些投票？成效如何？有無民眾提案？民眾參與度？
  - 從柯市長上任迄今，i-Voting共執行10項議題，包含「公館商圈假日徒步區」、「2017臺北世界大學運動會『標語、標誌與吉祥物』設計徵選活動」、「臺北市內湖公民會館幸福寶寶命名票選活動」、「『臺北市立圖書館公用電腦是否禁止玩遊戲』網路投票活動」、「臺北市社區大學創意書架票選活動」、「一年市政成果」、「12燈區誰最靚 全民票選來決定」、「社子島開發方向i-Voting」、「大安區住民大會提案ｉ-Voting」與「交六廣場命名票選活動」，上開議題皆是由機關提出，每項活動投票參與情形不一，如「大安區住民大會提案ｉ-Voting」、「交六廣場命名票選活動」約有2,500多人。各項ｉ-Voting投票結果亦由機關納入政策參考及落實，如「『臺北市立圖書館公用電腦是否禁止玩遊戲』網路投票活動」在投票後，即依結果公布臺北市立圖書館禁止玩電腦遊戲。
- - i-Voting過去有遇到什麼挑戰，如何解決？
  - i-Voting自推動迄今，外界對i-Voting多有期待，包含投票結果效力、灌票、流程透明化、投票率低、議題屬性差異過大、無民眾提案等，經過檢討，新制從制度至系統平臺皆有所調整精進，簡述如下：1.投票結果效力明確化：議案主責機關應在投票前即公布結果參採情形與比重讓民眾知悉，投票後即應依投票前所公布方式執行。2.灌票防堵設定：透過i-Voting系統中「防止灌票機制」和「驗證方式」搭配，且避免宣傳性質議題，以防止灌票情形。3.流程階段完整性：分為6大階段，並增訂提案討論應視複雜度設定60日以上，增進議案主責機關、提案人與投票人彼此溝通討論，提高投票人在投票前對議題之認知。4.流程與資訊公開透明：新增審查會議機制及納入外部專家學者參與審查，且議案主責機關需在不同階段公布資料(如提案計畫書、提案上架說明書等)及進度，使民眾可隨時知道提案最新情形。5.議題範圍明確化：明訂提案範圍為各項市政建設發展及行政措施規劃等公共事務。6.增訂民眾提案與討論管道：新增非行政機關可透過i-Voting系統點選連接進行提案，以提高提案率。7.增強行銷宣傳管道：透過增加提案討論時間，及在提案計畫書中新增「行銷宣傳」，提供議案主責機關規劃時納入宣傳考量，以提高議題曝光度，增加民眾對議題之知曉度與參與度。
- - 為何要推動i-Voting？
  - i-Voting之推動係為秉持資料開放、全民參與之施政理念，透過提案人、議案主責機關與投票人等多方、多元且充分之討論溝通，共同形成選項、凝聚共識，再落實於投票選擇、機關依循執行，使市政決策更為公開透明。我們希望可以從與民眾生活息息相關的大小事務出發，促民眾了解及參與公共事務，並擁有參與決策的機
- - i-Voting新制流程從提案成立到投票約需多久？
  - 以非行政機關提案人為例，在達到附議門檻資格後（提案附議時間以60日內累計附議達3,000則以上為限），需經過提案初審（約20日）、提案討論（約60日）、形成選項（約40日）、上架宣傳（約30日）後進行投票階段。如流程順利約需5個月時間。新制流程作業時間較長，主要希望透過前端議案主責機關可運用多元討論方式及管道，充分與目標對象溝通、廣納各方意見修訂選項方案或進行回應取得共識後，再進行投票，真正提出符合民眾需求之政策，亦可降低不同意見之衝突對立。
- - i-Voting提案初審是由誰來審查？審查原則為何？
  - 提案人之提案係由審查會議進行審查，其成員包含本府代表(6人)、公參會委員(2人)、府外學者專家(3人)，審查原則包含：提案內容合宜性（如提案內容是否涉及不適合進行i-Voting之提案，或內容與目的明顯屬政策行銷宣傳者）、資料充分度、討論及宣傳方式與管道多樣性、投票規劃完整性、投票結果擬訂運用方式等項目。
- - 哪些人具i-Voting投票資格?投票人是否有年齡限制？
  - i-Voting各議案投票資格之設定，係由議案主責機關依據議題內容與屬性決定。投票人並無年齡限制。
- - 只要屬於可提案範疇，一旦通過覆議門檻，是否就可以進行i-Voting？
  - 提案仍需要經過「提案初審階段」通過審查。審查主要就提案內容合宜性、資料充分度、討論及宣傳方式與管道多樣性、投票規劃完整性、投票結果擬訂運用方式等面向進行審查及討論，確保最後市民能夠獲得充分資訊作出有品質之決定，若發現提案不宜進行i-Voting，也將公開提案未通過之理由。
- - i-Voting可幫助解決什麼問題？
  - i-Voting希望能夠促進民眾對於公共事務的參與及決策權利，從關心及主導生活中的大小事出發，透過逐步討論，凝聚對於政策之共識，做出決定，由機關依投票結果參採落實，解決市政問題。
- - i-Voting提案範圍包括哪些？哪些議題不能成為i-Voting提案
  - i-Voting提案範圍包括各項市政建設發展及行政措施規劃等公共事務。但若提案內容為非本府職權事務（如涉及中央各級機關、其他縣市政府及各級民意機關），或違反下列情形，不得作為提案：1.恐嚇、猥褻、誹謗、詐欺或公然侮辱等情事。2.侵害他人權利或法律上利益。3.種族、宗教及性別歧視、人身攻擊。4.違反刑法或引起民事責任之虞。5.法院審理中之司法案件。6.其他違反公共秩序、善良風俗或法律規定之情形。另為避免耗費行政成本，提案未通過審查者，不得於一年內就同一提案重行提出。此外，租稅、投資、人事、薪俸、特定契約個案等議題，因涉及到契約或其他制度（如人事遴選機制），並不適合成為提案。
- - i-Voting民眾如何提案？需提供什麼資料？成案標準為何
  - 非行政機關（如市民朋友）提案，可以從i-Voting網站（網址：https：//ivoting.taipei/）進入，按下「提案與附議」即可進行提案，而為讓主責機關和其他民眾更了解您的提案內容，請於提案時儘可能於本府參與平臺「i-Voting提案」專區完整填寫「提案名稱」、「提案緣起與背景說明」、「選項方案設定與緣由」、「建議投票人資格」，並提供各項相關參考資訊或連結，俾利大家更了解提案資訊。您的i-Voting提案會在經過檢核後進入附議，在60日內累計附議達3,000則以上，即會進入i-Voting提案初審階段等流程。
- - 為何i-Voting非行政機關提案設定60天3,000則附議的門檻？
  - i-Voting機制推廣希望引導民眾關心及參與公共事務，透過討論、決策之結果，能夠提高民眾生活品質，惟因規劃、討論與決策施行需要行政成本，因此設立附議機制，顯示民眾對於該議題之關注度與影響性。另為提高民眾與行政機關對於i-Voting提案之重視與參與度，本府參考國內外相關經驗，並在初期採取較為嚴格之附議門檻，後續可視實際推動經驗與回饋再做檢討。
- - 如果想了解更多i-Voting資訊，我可以去哪裡查詢？
  - 您可至本府i-Voting網路平臺（網址：https：//ivoting.taipei/）查詢完整作業階段與程序。
- - i-Voting提案資料是否均會被保留與公開？
  - 基於資訊公開，及讓提案人、議案主責機關可透過網路了解民意，所有行政機關提案資料均會被保留並公開在i-Voting系統，如為非行政機關提案，除保留於本府參與平臺「i-Voting提案」專區外，完成附議之案件亦會保留在i-Voting系統。
- - 可以到哪裡申請查閱、影印公司登記資料？
  - 經濟部商業司：外國公司、實收資本額新臺幣五億元以上及公司所在地在金門、馬祖地區之本國公司、八十三年以前實收資本未達五億元已解散或撤銷之公司。經濟部中部辦公室：實收資本額未達新臺幣5億元所在地本國公司。經濟部加工出口區管理處：加工出口區內之公司。科技部科學工業園區管理局：科學工業園區內之公司。臺北市政府：實收資本額未達新臺幣五億元所在地在臺北市轄區內本國公司。新北市政府：實收資本額未達新臺幣五億元所在地在新北市轄區內本國公司。高雄市政府：實收資本額未達新臺幣五億元所在地在高雄市轄區內本國公司。臺南市政府：實收資本額未達新臺幣五億元所在地在臺南市轄區內本國公司。臺中市政府：實收資本額未達新臺幣五億元所在地在臺中市轄區內本國公司。桃園市政府：實收資本額未達新臺幣五億元所在地在桃園市轄區內本國公司。
- - 我不太會寫i-Voting提案，會有人協助我嗎？
  - 您可採用本府參與平臺「i-Voting提案」專區所提供「協作討論」功能，邀集網友共同討論提案內容，提供參考意見，使提案內容更臻完備。
- - 哪些人可以提案i-Voting？提案人是否有年齡限制？
  - 臺北市政府歡迎居住、就學、就業在臺北市，以及對臺北市關心的朋友（包含團體），都可至i-Voting網站（網址：https：//ivoting.taipei/）提案，提出各項市政建設發展及行政措施規劃等公共事務之提案。提案人並無年齡限制。
- - 哪些人可以i-Voting附議？附議人是否有年齡限制？
  - 臺北市政府歡迎對臺北市關心的朋友進行提案附議，並無年齡限制。
- - i-Voting投票結果約束力與效力
  - 在新制中，i-Voting投票結果由議案主責機關依投票前公布之參採方式運用，也就是說，議案主責機關需在投票前告訴投票人投票結果參採情形與比重，包含完全參採、部分參採，或是將意見彙整後納為專業審查會議參考資料，如完
- - i-Voting如何改善投票率低的問題？
  - i-Voting除了投票結果，討論過程亦是重點，i-Voting新制透過增加多元管道與討論期程之規範，促使機關於投票前期即積極運用各種方式與民眾溝通討論，同時，在投票日30日前提案上架時，亦要採用各項行銷宣傳如新聞稿、記者會、海報傳單、跑馬燈等，以達到資訊公開周知，邀集民眾參與投票。
- - i-Voting與其他民意反映管道有什麼不同？
  - 在代議制度中，民眾可透過議員、里長反映生活權益事務，而i-Voting機制則是隨著資通訊技術發達，做為公民參與的管道之一，可讓民眾透過網路直接參與公共事務提案、討論及決策。
- - i-Voting和參與式預算有何不同？
  - i-Voting和參與式預算都是希望透過資訊公開、全民參與方式，使市政政策更加貼近民意需求的機制，惟參與式預算著重在公民提案參與預算規劃及監督；而i-Voting則是強調市民參與市政政策建議、討論與決策，促使政策方案更臻完備。
- - 身心障礙者房屋租金補貼申請資格
  - 補貼對象之資格及條件：設籍並實際居住臺北市，並領有本市核(換)發或註記之身心障礙手冊或證明，且符合下列規定者：(一)家庭總收入平均未達當年度每人每月最低生活費標準3.5倍，且未超過臺灣地區平均每人每月消費支出1.5倍者（106年度為3萬631元）。(二)未接受政府相關租金或貸款利息補貼者。(三)未獲政府補助住宿式照顧費用者。(四)未使用公有房舍或平價住宅者。(五)租賃房屋座落於本市轄區內。(六)身心障礙者、配偶及其戶籍內之直系親屬，於各縣市均無自有住宅。
- - i-Voting和公投有何不同？
  - i-Voting和公投主要不同處除了公投法為實體投票，i-Voting以網路投票方式為主之外，另在發起者與法律位階上亦有不同。i-Voting提案人可包含行政機關及非行政機關，公民投票則是由民眾發起；在法律位階上，《公民投票法》為法律，《臺北市政府網路投票作業要點》為行政規則。
- - i-Voting之前曾有新聞報導i-Voting有灌票問題，如何預防問題發生？
  - 過去政策宣導類型的投票活動為鼓勵民眾踴躍參加，選擇以寬鬆的驗證機制，並未限制一人ㄧ票，才會有灌票問題發生，未來新制的i-Voting定位將更明確，避免宣傳性質投票。
- - 「i-Voting」的驗證方式?
  - 系統提供圖形驗證碼、社群帳號登入、電子郵件驗證碼、手機簡訊驗證碼、台北卡會員登入、可投票人名單驗證、戶役政系統驗證及自然人憑證驗證等，並可進行混合式驗證，可依投票需求自訂驗證方式及強度。
- - i-Voting系統網路安全性如何？會不會有資安問題？
  - 現行系統每年均會進行資安檢測、弱點掃描、滲透測試等資安防護作業，敏感資料均會進行加密，投票過程亦會以SSL機制確保網路傳送安全，以提供安全、可靠的網路投票服務。
- - 如何提高民眾對「i-Voting」網路投票的信賴度
  - 每次投票活動，會於投票前、投票中、投票後進行登入情形查核，以確保資料無不當竄改之情事，有必要時會透過第三方見證電子投票過程，並可提供個人選票紀錄留存、投票結束後公開不含個資的投票日誌等方式以利系統檢核，確保投票結果可受公評。
- - 網路投票易有數位落差問題，i-Voting如何克服？
  - 為服務無法上網的民眾也能透過i-Voting系統進行投票，議案主責機關可視需要提供現場投票服務，只要通過身分驗證，即可利用觸控電腦投票，流程簡單方便，遇到問題亦有現場工作人員協助處理，連不熟悉數位產品或上網功能的民眾都能順利操作系統完成投票活動。
- - 如何使用i-Voting系統投票？
  - i-Voting系統（網址：https：//ivoting.taipei/）採響應式網頁設計，讓民眾使用不同上網載具如手機、平板、電腦等，皆不須另行安裝App應用程式，只要連上網頁即可直接進行投票，享有便利的用戶體驗。
- - 我可以即時觀看每天i-Voting的投票結果嗎？
  - 投票結果公布係由議案主責機關依議題性質自訂投票結果公布方式與時間，可設定每天公布。
- - 我要如何知道i-Voting投票成功？
  - 投票完成後，系統會顯示「您的投票已完成」，並可選擇將您的投票記錄直接顯示於畫面上或寄送至您的個人電子郵件信箱中留存以確認投票成功。
- - i-Voting系統使用是否有限制？
  - i-Voting系統最佳瀏覽解析度為1280x1024以上，並請採用Internet explorer 9以上、Chrome最新版或firefox最新版觀看。
- - 已領取身心障礙者房屋租金補貼，死亡時如何處理?
  - 請向本局身心障礙者福利科通報註銷本補貼。
- - 身心障礙者房屋租金補貼應備文件
  - (一)臺北市核(換)發或註記之身心障礙手冊或證明正、反面影本。(二)載明租賃房屋面積之租賃契約書影本。(三)身心障礙者之臺北富邦銀行或郵局存摺封面影本。(四)其他相關證明文件(如第二類建物謄本、學生證、大陸籍人士居留證影本等)。
- - 身心障礙者房屋租金補貼洽辦單位
  - 臺北市政府社會局身心障礙者福利科。聯絡電話：1999(外縣市請撥打(02)2720-8889)轉分機6963、6964；傳真電話：(02)2720-9229。
- - 身心障礙者房屋租金補貼申請流程
  - 持應備文件向社會局提出申請→經受理並審核→符合資格並公文通知→每月25日撥款。臺北市政府社會局身心障礙者福利科，地址：臺北市市府路1號1樓東北區、電話：1999(外縣市02-27208889)轉分機6964
- - 身心障礙者房屋租金補貼常見問題2. 補貼互斥規定？
  - 1、身心障礙者房屋租金補貼不得重複申領的補助：接受政府相關租金或貸款利息補貼者，獲政府補助住宿式照顧費用者，使用公有房舍或平價住宅者，領有身心障礙者津貼給付金額等。2、各項補助金額每人每月合計不得超過當年度公告之基本工資，105年度為20,008元。
- - 身心障礙者房屋租金補貼之補助期限未到期,但租賃契約書或身心障礙證明(手冊)到期,該如何辦理?
  - 身心障礙者房屋租金補貼之補助期限為1年，若有下列情形請檢附新租賃契約書或新身心障礙證明(手冊)辦理延長：1.如租賃契約書到期，檢附新租賃契約書影本,註明坪數及租屋現址。2.身心障礙證明(手冊)到期者，檢附新身心障礙證明正反面影本。
- - 申請身心障礙者購屋貸款利息補貼的受理時間？
  - 受理時間每年6月1日至6月30日。
- - 申請身心障礙者購屋貸款利息補貼需檢附哪些資料?
  - (一)申請表。(二)本市核(換)發或註記之身心障礙手冊或證明正、反面影本。(三)購屋之貸款餘額證明書及繳款證明書各1份。(四)身心障礙者之臺北富邦銀行或郵局存摺封面影本。(五)其他相關證明文件(如低收入戶卡、中低收入戶卡、全戶財產歸戶證明等)。
- - 身心障礙者購屋貸款利息補貼的申請資格有哪些?
  - (一) 設籍並實際居住臺北市。(二) 領有本市核(換)發或註記之身心障礙手冊或證明。(三) 家庭總收入平均未達當年度每人每月最低生活費標準4倍者(106年度每人每月最低生活費為15,162元，4倍為62,176元)。          (四) 現未接受政府購屋貸款利息補貼或興建住宅費用補貼者。(五) 身心障礙者、配偶及其戶籍內之直系血親，於各縣市均無自有住宅或僅有一戶向社會局提出本貸款申請日前五年內購買且辦有貸款之住宅，尚未全部 清償者。(六) 貸款利息補貼應以身心障礙者持有之住宅或與配偶、同戶籍之直系親屬共同持有之住宅作為貸款之抵押物。(七) 購置之住宅座落於本市轄區內。   (八) 未領有本市身心障礙者津貼給付金額。
- - 已享有本市相關的福利補助，可否再領取身心障礙者購屋貸款利息補貼？
  - 除了符合身心障礙者購屋貸款利息補貼之申請資格外，只要現在沒有接受其他政府購屋貸款利息補貼、興建住宅費用補貼者、房屋租金補貼或領有本市身心障礙者津貼給付金額等，就可以提出申請。
- - 我已經領有身障者津貼，還要去申請國民年金的身障基本保證年金（或老年基本保證年金）嗎？
  - 一定要去申請。如您符合領取身障基本保證年金（或老年基本保證年金）資格者，您不去申領身障基本保證年金或老年基本保證年金，自98年1月起，我們只會就您原領身障津貼金額扣除身障基本保證年金（或老年基本保證年金）額度補差額給您，請您及早去申請，以保障您的權利。
- - 我想申請身心障礙者津貼，可是從97年10月起已經沒有這項補助了，我該怎麼辦呢？
  - 身心障礙者津貼是國民年金開辦前，臺北市政府照顧身障朋友的措施，國民年金開辦後身心障礙者津貼階段性的任務完成，所以自97年10月 1日起，停止新申請案受理。但臺北市政府仍有多項之福利補助是提供給身心障礙朋友的。首先，中央開辦有國民年金保險制度，符合加保資格之極重度、重度身障者，可以申請身心障礙基本保證年金（每月4,700元）。如果為65歲以上長者可以申請老年基本保證年金（每月3,500元）。再者，臺北市政府還有其他有關保障市民經濟安全的補助可提供經濟弱勢之身心障礙市民申請，包括：低收入戶生活扶助、中低收入老人生活津貼、身心障礙者生活補助、身心障礙者房屋租金補助及身心障礙托育養護費用補助等。如您對於申請補助有任何問題，可以就近至各行政區之社福中心尋求社會工作員諮詢及協助，或可電洽市民熱線1999查詢。
- - 房租補貼補貼內容
  - 1、身心障礙者本人最多補助22平方公尺，每增加1名同住直系親屬則增加14平方公尺，但以增加2名為限（最多補助50平方公尺）。2.、每平方公尺最高補助100元（租金總額除以租賃房屋面積）。3、補助金額：身障者1人獨居最高每月補助2,200元；2人同住最高每月補助3,600元；3人以上同住最高每月5,000元。4、補助金額均不得超過房租總金額50%
- - 房租補貼補助期限未到期但搬遷新址如何辦理?
  - 檢附載明租屋現址及坪數之新租賃契約書影本、身障手冊影本(身心障礙證明)、聯絡電話於搬遷後1個月內送局辦理。臺北市政府社會局身心障礙者福利科，地址：臺北市市府路1號1樓東北區、電話：1999(外縣市02-27208889)轉分機6963
- - 領有老農津貼可否再申請身障房租補貼?
  - 可。
- - 房租補貼補助期限未到期但搬遷新址如何辦理?
  - 檢附載明租屋現址及坪數之新租賃契約書影本、身障手冊(或身心障礙證明)影本、聯絡電話於搬遷後1個月內送局辦理。臺北市政府社會局身心障礙者福利科，地址：臺北市市府路1號1樓東北區、電話：1999(外縣市02-27208889)轉分機6963
- - 申請身心障礙者購屋貸款利息補貼的聯絡窗口？
  - 可聯絡臺北市政府社會局身心障礙者福利科。聯絡電話：1999(外縣市請撥打02-2720-8889)轉分機1615、6964；傳真電話：02-2720-9229。
- - 身心障礙者購屋貸款利息補貼金額如何計算?
  - 依「身心障礙者房屋租金及購屋貸款利息補貼辦法」第七條規定：(一)貸款額度：由承貸金融機構或郵局勘驗後覈實決定，最高不超過新臺幣220萬元。(二)年限：最長不超過30年；付息不還本之寬限期最長5年。    (三)計算基準：比照國民住宅基金提供部分利率，補助身心障礙者原購屋承貸金融機構或郵局貸款利率與國民住宅基金提供部分利率之差額。
- - 申請身心障礙者購屋貸款利息補貼的流程？
  - 依公告的受理申請時間提出申請，持應備文件向社會局提出申請，以公文通知符合資格者，於每季(4月、7月、10月、12月)10日前檢具相關資料送本局請款，補貼款項將由本局逕撥入申請人台北富邦銀行或郵局帳戶內。 
- - 臺北市中正區戶政事務所訂於106年5月27日至5月30日辦理辦公廳舍搬遷事宜。
  - 臺北市中正區戶政事務所訂於106年5月27日至5月30日進行辦公廳舍搬遷作業，為配合搬遷作業時程，該所於106年5月26日暫停夜間延長上班服務1次，106年5月27日至5月30日暫停假日預約結婚登記，並自106年5月31日起於新址（臺北市中正區忠孝東路1段108號7樓）辦公，原聯絡電話及傳真號碼不變。
- - 低收入戶房租補助申請單位？
  - 配合100年7月1日後社會救助法新制規定，住宅補貼措施由住宅主管機關提供，故社會局自100年7月1日起停止受理新通過低收入戶資格者申請低收入戶房租補助，故如有申請需求請洽本府都市發展局(電話2321-2186轉分機2731、2727)辦理。
- - 收到中獎通知卻找不到繳費憑證，該如何領獎？
  - 為維護實際繳費人的兌獎權益，用戶遺失中獎當期載有載具識別資訊之繳費憑證，得在帳單期別之統一發票領獎期限內，攜帶中獎通知單、身分證明文件及相關佐證資料，向本處各營業據點申請補發載具資訊證明，據以領獎(如不克臨櫃申辦，可採郵寄方式辦理)。
- - 租金補貼106年度租金補貼問與答
  - 內政部營建署網站首頁（網址：http：//www.cpami.gov.tw）右側→「快捷服務」→「住宅補貼專區」106年度租金補貼問與答一、　　什麼是租金補貼？ 二、　　申請租金補貼者應具備哪些條件？三、　　哪些情形不得申請租金補貼？四、　　若經查核民眾原辦有政策性房貸之房屋，因遭法院拍賣，拍賣金額不足清償原貸款金額，仍可申請租金補貼嗎？五、　　今（106）年度什麼時候開始受理申請？六、　　今（106）年度計畫辦理多少戶？符合條件的申請人都可以獲得補貼嗎？七、　　已獲得105年度租金補貼者可否再提出申請？八、　　目前仍接受政府其他租金補貼者，可否再提出申請？九、　　申請書要到哪裡索取或下載？十、　　如何申請？向哪裡申請？ 十一、　申請時應檢附哪些文件？ 十二、　是否須提供租賃住宅之建物登記謄本資料呢？十三、　承租非合法住宅是否可申請租金補貼？需檢附什麼文件？十四、　申請人提出申請後，政府如何審查？多久可以知道審查結果？十五、　政府核發「租金補貼核定函」後，核撥租金補貼程序為何？十六、　補貼期間因故租約中斷，如何處理？十七、　租賃之住宅有沒有什麼特別的規定？承租工業住宅是否可申請租金補貼？十八、　租金補貼核定戶若於受補貼期間遷居至原戶籍所在地以外之直轄市、縣（市）另行租賃住宅，可以繼續獲得補貼嗎？十九、　因為工作或子女就學等其他因素將戶籍遷移至外縣市，但租賃處不變，可以再繼續受領租金補貼嗎？二十、　持有無法居住之共有住宅，可否視為無自有住宅？二十ㄧ、在什麼情況下會停止租金補貼？二十二、申請人及其家庭成員的家庭年所得、動產及不動產持有狀況，由誰查核？如何查核？二十三、應列入查核的家庭成員有哪些人？二十四、家庭年所得及財產，應符合中央主管機關所定之基準為何？二十五、每人每月平均所得應低於一定金額，要如何計算？二十六、家庭年所得及財產，今（106）年度住宅補貼申請案將採計哪一年度之財稅資料？二十七、評點時，家庭成員具備哪些條件會獲得加分？二十八、評點時，家庭成員如果有哪些情況會減分？二十九、以「父母均已死亡，戶籍內有未滿20歲或已滿20歲仍在學之兄弟姐妹需要照顧者」申請，已滿20歲仍在學，就讀夜間部、空中大學、補校等是否可以？三十、　本補貼所稱的「特殊境遇家庭」定義是什麼？（檢附之文件請看第十一題；不具備者，免附。）三十ㄧ、本補貼所稱的「單親家庭」定義是什麼？（檢附之文件請看十一題；不具備者，免附。）三十二、本補貼所稱的「生育有未成年子女」定義是什麼？三十三、什麼是基本居住水準？什麼是平均每人居住樓地板面積未達基本居住面積標準？什麼是未具備衛浴設備？三十四、本補貼所稱的「三代同堂」定義是什麼？三十五、本補貼所稱的「災民」定義是什麼？（檢附之文件請看第十一題；不具備者，免附。）三十六、本補貼所稱的「遊民」定義是什麼？（檢附之文件請看第十一題；不具備者，免附。）三十七、本補貼所稱的「列冊獨居老人」定義是什麼？（檢附之文件請看第十一題；不具備者，免附。）三十八、同一家庭可以申請租金補貼、自購住宅貸款利息補貼或修繕住宅貸款利息補貼等2種以上的補貼嗎？三十九、申請人或其家庭成員正辦理國宅貸款、勞工建購（修繕）住宅貸款、公教住宅貸款、輔助人民自購住宅貸款、青年購屋低利貸款、新臺幣1兆8千億元優惠房貸或其他政策性房屋貸款，可以再申請本項補貼嗎？四十、　除了租金補貼，政府還有辦理其他的住宅補貼嗎？四十ㄧ、如果持有不動產（例如土地、辦公室、店舖等），可以申請本項租金補貼嗎？四十二、如何認定租賃的房屋是否符合規定？四十三、受家庭暴力或性侵害之受害者及相對人共同持有1戶住宅或僅相對人持有住宅，因離婚訴訟或其他原因，致受侵害者需與相對人分居，且另行租賃住宅者，可否申請租金補貼？四十四、稅捐稽徵機關或財政部賦稅署為調查課稅需要，若向租金補貼之機關要求提供租金補貼租賃契約資料，租金補貼之機關會提供嗎？四十五、若申請租金補貼者之郵局帳戶遭強制執行無法使用，該如何撥付租金？四十六、關於本租金補貼如果有其他問題，要向哪裡詢問？
