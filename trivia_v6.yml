- - 蓮香齋更換經營者事件及餐券權益問答集
  - Q1：請問現在經營的「御蓮齋」，跟之前的「蓮香齋」到底是什麼關係？A1：「蓮香齋」(蓮香蔬食股份有限公司)於105年10月間辦理增資及董監事改選，並於106年3月20日變更名稱為「御蓮齋」(御蓮蔬食股份有限公司)繼續經營。但是除了經營者不同外，實際上仍是同一間公司。Q2：為什麼我持有的蓮香齋貴賓禮券不是前述兩間公司所發行？A2：現行「餐飲業等商品(服務)禮券定型化契約應記載及不得記載事項」允許發行人以第三方為實際商品(服務)之提供者。然禮券發行人仍應負發行人責任。原蓮香齋的貴賓禮券分別由蓮香蔬食股份有限公司、人道國際事業股份有限公司、歡喜齋有限公司、蓮香齋事業有限公司、蓮香國際股份有限公司、德茂昌有限公司及蓮香齋國際事業股份有限公司7間業者發行。Q3：目前我所持有的蓮香齋貴賓禮券到底能不能使用？A3： 因為「蓮香蔬食股份有限公司」已改名為「御蓮蔬食股份有限公司」，且與其他業者也已停止合作關係，御蓮齋表示僅限持有「蓮香蔬食股份有限公司」發行餐券的消費者得繼續使用，且無須加價、也沒有使用期限。但為維護已購買非上述公司發行的餐券消費者權益，於本局要求下，御蓮蔬食股份有限公司目前同意持有其他業者發行餐券的消費者仍可繼續使用至106年6月30日，並已要求該其他業者於5月底前儘速與御蓮蔬食股份有限公司談妥協議，以保障持有其他業者餐券消費者之權益。Q4：如果餐廳難以預約或者我不想使用餐券了，是否有其他方式保障權益？A4：如您實在無法於106年6月30日前將餐券使用完畢，或是您已不想使用餐券，可將剩餘的餐券向原發行公司請求退費。若原公司拒絕您的請求，可至臺北市政府消費者服務中心提出申訴或直接在行政院消費者保護會網站（http：//www.cpc.ey.gov.tw）線上申訴。Q5：如果我持有的餐券並非「蓮香蔬食股份有限公司」所發行，但我也沒有信心能在106年6月30日前使用完畢，請問是否還有其他方案？A5 ： 御蓮蔬食股份有限公司於106年5月4日公告，請持有其他公司所發行餐券的民眾，盡速填寫無法在六月底前使用的餐券明細，再以當面遞送、傳真(傳真電話：02-27631333)或郵寄(郵寄地址：臺北市松山區南京東路五段188號地下1樓客服部)之方式通知該公司，該公司將於統計研商後回報本局其方案，並將方案內容以手機簡訊個別通知填寫明細之民眾。相關表格以及填寫範例如下。
- - 被列為化糞池應清理對象，應如何處理?如未清理是否受罰?
  - 一. 依本局104年8月11日北市環二字第10435521700號公告規定，本市未納入公共衛生下水道之公私立學校、機關、國宅、設有公寓管理委員會之6層樓以上之大樓，為列管單位，化糞池污物應每年不定期清除1次（含）以上。二. 列管單位委託本局核准立案之清除（理）機構清除後，向委託清除（理）機構索取「廢棄物清除許可機構清運建築物污水處理設施（化糞池）清除紀錄表」，再將影本以傳真或郵寄方式向本局水質病媒管制科申報備查（本局地址：臺北市信義區市府路1號7樓，傳真：02-27206235）三. 如未依本局公告規定每年不定期清理化糞池者，可依「廢棄物清理法」第50條第1款，處新臺幣1,200元以上6,000元以下罰鍰。四. 本局已公布「社區大廈環境衛生管理手冊」於本局網站上，民眾可至網站瀏覽參考 (首頁>線上查詢>宣導，網址：http：//www.dep.gov.taipei/ct.asp?xItem=258068908&ctNode=63190&mp=110001。)
- - 目前臺北市是否有辦理「人力運用調查」？其調查期間、對象及目的為何？ 如何取得調查結果？
  - 一、「人力運用調查」係由行政院主計總處主辦，委由各縣市政府主計處執行訪查作業。二、「人力運用調查」調查期間為106年5月21日至5月31日，調查資料標準時間為106年5月14日起至5月20日止，調查對象為資料標準時間內居住於臺灣地區之普通住戶與共同事業戶，其戶內年滿15歲，自由從事經濟活動之本國籍民間人口為主。三、該調查主要目的係為配合臺灣地區社會經濟發展需要，蒐集勞動力運用、移轉及就業、失業狀況等短期變動資料，供為訂定人力政策、推動職業訓練、性別平權與改善企業經營等決策之參據。依統計法第45條規定，調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作，據實回答。四、該調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw/）「政府統計」項下之「主計總處統計專區」項下之「其他專案調查」項下之「人力運用調查」項下之「統計分析」查詢。
- - 敬老、愛心及愛心陪伴悠遊卡，遺失該怎麼辦？應備何文件重新辦理？
  - 請先打電話至 412-8880(手機或金馬地區請撥：02-412-8880)辦理掛失。申請補發票卡，得由持卡本人或委任代理人，備妥申請人國民身分證、2吋彩色照片1張，愛心卡者需另備身心障礙手冊（證明），55 歲以上原住民者需另備原住民身分證明文件。申請遺失補發需自費製卡費用100元。委任代理人申請補發票卡者，除前項規定之文件外，應提出委任書及代理人之身分證明文件，就近至本市任一區公所提出申請。
- - 申請台北卡-敬老、愛心乘車證服務(原敬老、愛心及愛心陪伴悠遊卡)資格為何？敬老悠遊卡年滿 65 歲當月可以提早申請嗎?受理申請單位為何？
  - 1、台北卡-敬老、愛心乘車證服務(原臺北市敬老、愛心及愛心陪伴悠遊卡)，申請資格如下：(1)敬老悠遊卡：設籍且實際居住臺北市之當月年滿 65 歲之老人、年滿55歲之原住民。(2)愛心悠遊卡及愛心陪伴悠遊卡：設籍且實際居住臺北市之領有身心障礙手冊（證明）之身心障礙者及其必要陪伴者。2、本市長者可於年滿 65 歲(原住民長者於年滿55歲)當月任一工作天提出申請。如當月第一個工作天適逢當月月初連假或假日，則可於假日前提早申辦並於假日前一天上班日至區公所領取，惟仍須於年滿65歲(原住民55歲)當月始得使用。3、本市敬老、愛心及愛心陪伴悠遊卡受理申請單位為臺北市任一區公所社會課。4、非設籍本市年滿65歲之長者及領有身心障礙手冊（證明）之身心障礙者，依據老人福利法第25條及身心障礙者權益保障法第58條規定，於國內搭乘大眾運輸工具，出示身分證均可享票價半價優惠。
