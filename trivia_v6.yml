- - 台北探索館導覽小志工研習營怎麼知道我錄取了呢？
  - 錄取名單將於7月31日前在台北探索館官網進行公告，並且將發送EMAIL與簡訊進行錄取通知。若各梯次正取名單於通知錄取回覆時間內未回覆，則通知備取。
- - 台北探索館導覽小志工研習營一定要出席成果發表會嗎？
  - 凡報名參與之學員皆需完整參與兩天課程及8/22成果發表會。活動三日確實出席，且完成指定作業者，於成果發表會當日頒發結業證書，若無故缺席者將不予以頒發結業證書。
- - 台北探索館導覽小志工研習營要怎麼拿到結業證書呢?
  - 參與的學員應達到下列項目，方可獲得結訓資格：1.參與三天共計18小時課程，且每天需完成簽到與簽退。2.必須於第二天活動結束後（最遲於工作坊報到時）繳回300字心得報告及滿意度問卷3.需以報名學生之個人帳號或透過家長於臉書標註＃台北探索館小志工研習營或打卡台北探索館，並且分享一張以上之參與活動之照片。4.完成前述內容者，將於8/22成果發表後頒發結業證書。※其他問題歡迎於週一至週五上午10點至下午5點洽詢活動專線：02-27588218/0965-171818 邱小姐(如忙線中請稍後再撥)※本活動內容與期程，依活動官網公告與活動現場主辦單位說明為準。如有未盡之事宜主辦單位保有最終解釋與修正之權利。
- - 交通維持捷運萬大線完工通車後與其他路線之交會轉乘站各為何?
  - 於LG01中正紀念堂站轉乘紅線（淡水-信義）及綠線（松山-新店），於LG06中和站轉乘環狀線，及於LG21迴龍站轉乘新莊線。
- - 交通維持捷運萬大線第一期工程，南區工程處所負責監造之工程範圍及車站位置？
  - 捷運局南工處負責監造施工之工程路線，自羅斯福路與南海路口之LG01中正紀念堂站起始，向西沿南海路於林業試驗所與國語實小間設置LG02植物園站，穿越和平西路，至中華路與汀洲路間之忠義國小附近設置LG03廈安站，接著再轉萬大路至長泰街與東園街間之東園國小附近設置LG04加蚋站，續向西沿萬大路經果菜市場穿越新店溪進入新北市永和區經保順路至保生路，於永平國小前設置LG05永和站，再轉中山路至中和區連城路（景平路口），接LG06中和站(不含)。
- - 交通維持捷運萬大線各車站的主要工程內容及特色為何？
  -   LG01中正紀念堂站：         位於羅斯福路一段與南海路交叉路口地下，為端點站並與新店線中正紀念堂站銜接轉乘。車站設置2座出入口、2座無障礙電梯及2座通風井，並有1座臨時通風井，為一座地下2層島式之月台車站。     南昌路口上有一自來水∮1650mm幹管與LG01站站體交會，該自來水幹管供應新莊、蘆洲、萬華等50萬戶用水，因無替代迴路供水，須採不斷水工法遷移，由自來水處水工總隊委託捷運局辦理。     LG02植物園站：         位於林業試驗所與國語實小間之南海路下方。車站設置2座出入口、2部無障礙電梯及2座通風井，為地下3層島式月臺車站。     本站位於植物園遺址範圍，工程進行時須先由專業單位主導遺址挖掘搶救作業，並配合交通維持計畫，分階段施工，於站體開挖範圍全面進行地面下6公尺範圍之遺址搶救，遺址搶救的成果亦規劃於日後車站內常態展示。     LG03廈安站：         位於忠義國小前方之西藏路下方。車站設置2座出入口、2座無障礙電梯及2座通風井，為一座地下2層島式月台車站。     站體下方為古河道且佈設5m×3.1m之排水箱涵2座，車站配合箱涵移設，須分階段施工。     LG04加蚋站：         位於萬大路東園街至長泰街間。車站設置3座出入口、2部無障礙電梯及2座通風井，為一座地下3層島式月台車站。     本站穿越魚類批發市場及第一果菜批發市場下方，於華中橋東側地下穿越新店溪。     LG05永和站：         位於永平國小正前方的保生路下方。車站設置2座出入口，1座無障礙電梯及2座通風井，為地下3層島式月台車站。     本站將風、光、綠引入車站，塑造節能綠意之車站。車站用地原址為垃圾掩埋場，施工前須做廢棄物調查，並於開挖施工時妥善移除。      LG01至LG05站隧道上下行長分別約為4,744 公尺、4,735公尺，合計總長為9,479公尺，及11處聯絡通道。 
- - 106年暑假臺北市立聯合醫院7-12歲學齡兒童塗氟何時開始?
  - 106年暑假7-12歲學齡兒童免費塗氟，於7月24日至8月4日假臺北市立聯合醫院各院區（中興、陽明、忠孝、仁愛、和平、婦幼）口腔醫學部提供服務，請攜帶私章、戶口名簿及兒童牙刷，於上述時間週一至週五上午09：00-12：00、下午13：30-16：30辦理。
- - 106年第二屆「護眼密碼『853240』等你來解答」活動內容為何?
  - 臺北市政府衛生局及教育局自106年8月1日起至8月31日止，於高度近視防治計畫合約醫療院所及適合親子戶外遊憩等約300個地點，張貼「護眼密碼數字海報」，讓市民朋友拍照上傳參加抽獎，活動詳情請搜尋臉書「Eye爸eye媽」粉絲專頁。
