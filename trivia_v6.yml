- - 社會局受理捐贈物資的流程為何？
  - 民眾或團體如有物資欲捐贈社會局，依捐贈者指定用途及物資之性質，由本局相關科室（社會救助科、身心障礙福利科、老人福利科、婦女福利及兒童托育科、兒童少年福利科、社會工作科）辦理捐物點收，秘書室協助開立收據交捐贈者收執。詢問電話可逕轉接至各業務科。※依財政部104年3月26日台財稅字第10400012010號函示：受贈機關應依公益勸募條例及其施行細則規定開立收據，並應載明「種類、數量及時價」事項。惟為避免稅捐稽徵實務上，納稅義務人逕依受贈機關開立之收據或其他證明文件上所載受贈物價值，申報綜合所得稅捐贈列舉扣除時，其可申報扣除金額，仍應以稅捐稽徵機關依所得稅法相關規定查核認定之金額為準」。聯絡單位：臺北市政府社會局聯絡電話及聯絡人：02-27256994/科員陳百玲
