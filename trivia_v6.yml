- - 交通維持＞有關萬大-中和-樹林線(第一期工程)中和區景平路連城路至土城區金城路車站簡要說明？
  - CQ861標萬大-中和-樹林線(第一期工程)LG06車站土建工程位於新北市中和區連城路與景平路口西南側之連城路下方，為一座地下4層之疊式月台車站，連城路兩側各設有一出入口，車站長度約140.4公尺，寬度約20.45公尺，月台長度80公尺，開挖深度達地下33∼35公尺，採連續壁擋土深度達地下55~56公尺。LG06車站(中和站)，為萬大線與環狀線中和站(Y11站)交會車站，由於萬大線為地下型式，環狀線為高架車站，兩者以地下連通道銜接站內轉乘，其中在景平路區域已由環狀線工程先行施作，後續再由萬大線CQ861施工標負責施作銜接至LG06車站。CQ860區段標自LG06車站西側起，以潛盾隧道方式沿連城路，西經錦和路附近設置LG07車站(雙和醫院站)及一座中央避車線，再向西穿越中正路至員山路附近設置LG08車站(中和高中站)，並至土城區金城路3段之明挖覆蓋隧道止，路線長約2.75公里，施工範圍包括LG07及LG08兩座地下車站、3段潛盾隧道及2段明挖覆蓋隧道。
