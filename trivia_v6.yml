- - 住家多久要清理一次化糞池?
  - 一.為提升居家環境品質，今(106)年度本府環境保護局與臺北自來水事業處合作，在5月起搭配水費單加註宣導標語，目的提醒民眾，倘水費單收費項目欄未列出「污水下水道使用費」，即代表住家仍未接衛生下水道，而這些住戶，就應該每年應定期清理化糞池至少1次，以確保居家環境衛生及減少病媒孳生，並維護自己健康。二.目前臺北市核可的水肥清運許可機構共94家，業者名單已公布於本府環境保護局網站上(首頁>線上查詢>環保服務機構查詢>水肥清運許可機構)，針對水肥清運業者服務內容，可洽詢環保局資源循環管理科（1999轉7300）。三.請市民朋友記得，每年將化糞池的水肥清一清，居家環境好衛生!
- - 如何申請中山堂影視拍攝？
  - 一、電影及電視劇(不含MV及廣告)製作，符合城市行銷、無違反公序良俗者，請至臺北市電影委員會網站申請協拍專案，在中山堂進行拍攝作業享場地優惠。二、可從臺北市民e點通網站下載申請表格，再以郵寄或親送辦理。
- - 「臺北市市民以工代賑輔導自治條例」修法後，臨時工可以請假嗎?請假有發工作金嗎?
  - 修法後，請假有給工作金的有婚假、喪假、病假三種。給付標準及金額如下：一、婚假：臨時工結婚得自登記當日起30日內請婚假2日，並得分次請假，每日給付4小時工作金。但臨時工離婚後再與原配偶結婚則不適用。二、喪假：臨時工得於親屬死亡事實發生後百日內依親等請喪假3~8日，並得分次請假，每日給付4小時工作金。三、病假：臨時工因傷害或疾病必須治療或休養者，得請病假，每月2日以內期間，每日給付2小時工作金。
- - 遭遇性騷擾時，應適用性別平等教育法、性別工作平等法或性騷擾防治法？
  - 1、如性騷擾當事人，一方為學校之校長、教師、職員、工友或學生，他方為學生(除軍、警院校等不隸屬於教育部管轄之學校外)，應適用性別平等教育法。2、如為受僱者(含實習生、派遣勞工及建教生)或求職者在『執行職務或求職時』被任何人性騷擾，應適用性別工作平等法。3、其他不屬於性別平等教育法或性別工作平等法的性騷擾事件，則適用性騷擾防治法。
- - 復興航空無預警停航案問答集
  - Q1.消費者透過旅行社參加旅遊團或透過旅行社購票, 因復興航空（以下簡稱興航）無預警停航致取消行程，如何請求退費？A1：消費者應盡速與旅行社聯繫辦理退費，消費者與旅行社如遇有退費之消費爭議無法解決，得檢附相關收據及契約以書面向交通部觀光局（臺北市忠孝東路4段290號9樓）或品保協會（臺北市長安東路2段78號11樓）申訴；相關諮詢可利用交通部觀光局免付費電話 0800-211734或品保協會申訴專線02-25068185。Q2.消費者直接向興航購票,因興航無預警停航致取消行程，如何請求退費？A2：1、請消費者依興航官方網站公佈之票務處理方式（http：//www.tna.com.tw/images/ec/RF-TW.pdf）辦理，消費者辦理退費有任何疑義可電洽興航之客服中心電話：(手機加撥02)412-81332。2、消費者如向興航申請退費致生之消費爭議，可撥打1950消費者服務專線，向各地方政府消費者服務中心申訴，或至行政院消費者保護會網站（http：//www.cpc.ey.gov.tw）進行線上申訴。Q3.消費者因興航無預警停航致衍生票款以外之損失，如何求償？A3：消費者可撥打1950消費者服務專線，向各地方政府消費者服務中心申訴，或至行政院消費者保護會網站（http：//www.cpc.ey.gov.tw）進行線上申訴，申訴時請檢附相關單據(例如另購機票、訂房紀錄、住宿費用等)。
- - 申請設立社會福利慈善基金會要向何單位申請？需準備文件、流程為何?
  - 一、可向臺北市政府社會局人民團體科提出申請。地址：臺北市信義區市府路1號東南區6樓，諮詢電話：1999（02-27208889)轉分機6956-6958二、申請辦理社會福利慈善基金會需準備文件及流程說明如下：申請本市社福慈善基金會，以主事務所設立於臺北市，業務以辦理社會福利及慈善事業為主要目的，且捐助財產之現金金額不得少於新臺幣1,000萬元整。需具備之申請文件如后： (一)申請書1式。(二)捐助章程或遺囑影本1式5份。(三)捐助財產清冊及其證明文件1式5份。(四)董事（監察人）名冊及其身分證明文件影本1式5份。(五)願任董事（監察人）同意書1式5份。(六)法人及董事（監察人）印鑑清冊（社會局許可後再送）1式5份。(七)第一屆第一次董事會會議紀錄1式5份。(八)董事相互間有配偶及三親等以內血親、姻親關係者，未超過總名額三分之一切結書；設有監察人者，其相互間、監察人與董事間不得有配偶及三親等以內血親、姻親關係之切結書1式5份。(九)年度經費預算書、年度業務計畫及其說明書1式5份。(十)捐助人同意於法人完成登記時，將捐助財產移轉為法人所有之承諾書1式5份。(十一)事務所使用證明文件(房地產借《租》用同意書及產權證明 文件)。(十二)其他主管機關規定之文件(籌備會議紀錄、基金會組織概況表、辦事細則、職員名冊等)。(十三)申請人委託代理者應具委任書。另上開文件及申請流程亦可至社會局網頁(http：//www.dosw.gov.taipei/)人民團體服務之「基金會輔導」項下參閱、下載。
- - 105年12月25日是否還是勞工國定假日？國定假日全國一致規定何時開始實施？
  - 依新修正之勞動基準法第37條規定，自106年1月1日起，勞工之國定假日回歸內政部所定應放假之紀念日及節日(含5月1日勞動節總共12日)。在新法實施前，勞工之國定假日仍依現行勞動基準法施行細則第23條規定辦理 (包含12月25日行憲紀念日)，故105年12月25日仍應放假。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 環南市場改建期程？
  - 環南市場改建工程分為兩期進行，第一期工程於原公車保養場及舊家禽批發市場，已於11月6日動工，預定於108年8月完工，環南市場維持於原地營業，營業不中斷。第二期工程於108年8月動工，環南市場於第一期建物營業，拆除環南市場甲乙丙丁棟建築物，預定於111年2月完工，將部分攤位遷回第二期建物，111年3月開幕使用。
- - 勞動基準法第23條新規定，雇主應提供工資各項目計算方式明細給勞工，「各項目」應該要包含哪些項目？
  - 依新修正之勞動基準法第23條新規定的用意，旨在要求雇主應提供工資「各項目」計算方式明細（也就是詳細的「薪資單」）給勞工，其中，當然應包含工資總額、平日每小時工資額、延長工作時間時數之金額、休假、特別休假及其他假別（出勤）之金額及其計算，及其他法律規定之項目(包含：勞工保險費、全民健康保險費、職工福利金等)，詳細內容將於修正勞動基準法施行細則予以規範。「工資各項目計算方式明細」之參考範例，詳如附件。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 雇主是否要給勞工「工資明細」（薪資單）？
  - 依新修正之勞動基準法第23條新規定，雇主給付工資的同時，應提供工資各項目計算方式明細（即薪資單）。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 休息日加班費如何計算？
  - 1.依勞動基準法第24條規定，勞工於法定休息日出勤工作時，工作時間在2小時以內者，其工資按平日每小時工資額另再加給1又1/3以上，工作2小時再繼續工作者，按平日每小時工資額另再加給1又2/3以上。2.休息日的工資計算，4小時以內者，以4小時計；逾4小時至8小時以內者，以8小時計；逾8小時至12小時以內者，以12小時計。3.以勞工月薪36,000元，推算每日工資1,200元，平日每小時工資額為150元為例：（1）休息日工作1小時，以半日4小時計，應另再加給900元（計算方式：150x1又1/3x2+150x1又2/3x2=900），當月工資合計36,900元。（2）休息日工作6小時，以8小時計，應另再加給1,900元（計算方式：150x1又1/3x2+150x1又2/3x6=1,900）當月工資合計37,900元。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 休息日當天，雇主是否應該要照給薪水？
  - 依新修正勞動基準法第39條規定，雇主必須照給休息日當天工資。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 勞工教室的地址、電話及建議交通方式為何?
  - 勞工教室為辦理民眾勞動教育課程之場所，並以本局自辦課程為主使用，自105年12月19日進駐於本市萬華區艋舺大道101號6樓，電話：02-2302-5988，傳真：02-2302-6816，建議交通方式為搭乘大眾交通工具：1.火車：搭乘至萬華火車站，至東棟出口後右轉即到達。2.捷運：搭乘至龍山寺站，往2號出口，步行約5-7分鐘。3.公車：搭乘62、205、601、49、205或藍29至萬華火車站下車，步行約2-3分鐘。亦可開車自行前往，尋附近停車場停車前往。聯絡科室：勞動教育文化科 蘇麗玲聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3318
- - 按時計酬（或按日計酬）之部分工時勞工，如例假及休息日未出勤，雇主是否應另外加給休息日工資？
  - 1.勞基法並未排除按時計酬者適用休息日工資照給之規定。然而，基本工資審議委員會在審議每小時基本工資時，已考量部分工時工作之特性，將例假日及因法定正常工時縮減所產生之休息日（本次修法納為法定之休息日）應獲得之工資，納入計算；易言之，按時計酬者享有例假及休息日照給工資之權利，該工資已分別折算到「每小時基本工資」中。2.因此，按時計酬者，勞資雙方如以不低於126元(自106年1月1日調整至133元)約定每小時工資額，其實就已經給付了勞動基準法第39條所定例假日及休息日照給之工資，遇到例假或休息日未出勤，毋須再行加給。3.至於按日計酬約定之日薪，於法定正常工作時間內，如不低於每小時基本工資數額乘以工作時數之金額，比照按時計酬者辦理。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 按時計酬（或按日計酬）之部分工時勞工，是否有休息日規定的適用？
  - 1.凡適用勞動基準法之事業單位，其僱用之勞工（包括工讀生、部分時間工作者等）均受該法保障。部分工時勞工如於法定休息日出勤工作，即使當週正常工作時間未達40小時，仍應依休息日出勤工資加給標準計給工資。2.舉例而言：早餐店打工族，時薪150元，每週固定出勤6天，每天工作3小時，雖然一週只出勤18小時，未達法定正常工作時數40小時的上限，但依法令規定，第6天出來工作，當日仍必須依照休息日之加班費標準計給當日工資。3.計算方式：休息日工作3小時，以4小時計，當日應給付之工資為900元（計算方式：150x1又1/3x2+150x1又2/3x2=900）聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 勞工之特別休假，因年度終結或契約終止而未休之日數，雇主應發給工資，此工資應該要怎麼計算？
  - 1.依新規定，凡是勞工未休完特別休假之所有日數，雇主均應折發工資。至於工資之金額，係以勞工平日一日正常工作時間之工資為準（不包括延時工資及假日出勤加給之工資）。2.舉例而言：勞工每月工資為30,000元，每日為1,000元，假如勞工剩餘7日特別休假未休，雇主應發給7日未休特別休假工資7,000元。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 勞動基準法原有的二週、四週及八週彈性的規定，是否有刪除或修正？
  - 本次修法主要在落實週休二日，原有各種彈性工時規定，其彈性並未再放寬，也未另予緊縮。在此原則下，僅將第30條之1四週彈性工時中有關每二週應有二日例假之規定，移列至第36條，並搭配新增之休息日，集中規範。其他工時彈性，並未變動。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 勞動基準法第34條有關輪班制勞工換班之休息時間修正內容？
  - 勞工工作採輪班制者，在換班的時候至少應有連續11小時以上之休息時間，係考量到事業單位必須從增僱人力或調整出勤模式等方式回應，無法即時施行，該新規定之施行日期，將另由行政院定之。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 臺北市除草劑管理自治條例FAQ
  - 一、除草劑管理自治條例規定為何？除草劑雖可協助農業生產，但相較於其他農藥僅在農地使用，除草劑則普遍用於住宅區、路邊水溝、公園或河川旁清除雜草等，為減少除草劑流布於本市非屬農業用地上，直接或間接影響空氣、水體及土壤品質，爰制定「臺北市除草劑管理自治條例」，藉由加強農藥販賣業者責任，導入環境管理精神，嚴格管制除草劑之購買及使用，防止除草劑不當使用，避免水資源污染及危害生態環境，俾維護本市市民健康及生活品質。相關條文內容詳見本局網站除草劑專區（除草劑專區網址：http：//www.dep.gov.taipei/ct.asp?xItem=218977445&CtNode=39374&mp=110001 ）二、民眾如何檢舉除草劑不當使用行為，檢舉資料應寄送到何處?（一）若您於本市發現除草劑不當使用之行為，請以書面或市政信箱檢舉。市政信箱：http：//contact.taipei.gv.tw/CCLM/CLM/ASPX/CLM00100E.ASPX），檢舉時請檢附違規證物（載有日期時間之影片、照片）及詳載人（如可供查詢之居所、電話等）、事（如違反事實及當時情形描述）、時（年、月、日、時、分）、地（如門牌號碼、地標）、物（如草木枯黃情形等違規項目），並提供個人基本資料（含真實姓名、身分證號、住址、聯絡電話等），本局即會依法進行後續查證作業。 （二）檢舉時請將相關資料郵寄或直接送至本局（臺北市信義區市府路1號7樓）或環保稽查大隊（臺北市萬華區西寧南路4號3樓）即可。 三、檢舉除草劑不當使用案件，環保局的查處程序為何?目前本局辦理民眾依「臺北市除草劑管理自治條例」所檢舉不當使用除草劑之案件，將派員前往稽查，進行土壤、水樣及植物檢體採樣送驗，倘發現非農用土地有違規使用除草劑情形，可依自治條例第8條規定處新臺幣5千元至5萬元罰鍰，行政機關若有違規情形將加倍處罰。  四、承辦檢舉除草劑不當使用案件的單位聯絡窗口為何？ 環保稽查大隊02-23754573臺北市萬華區西寧南路4號3樓。五、若檢舉除草劑不當使用行為，需要留下檢舉人的資料嗎？ 如果檢舉人希望了解案件後續查處情形，需要留下您的相關資料及聯絡方式（含真實姓名、住址、聯絡電話等），本局將於案件辦結後函復辦理情形。 六、所提供的照片或影片中的內容需包含以下人、事、時、地、物：（一）照片或影片中的違規行為需明確清晰，易於辨認並提供可供查詢之居所等資料。 （二）相片或影片中有顯示日期（可事前於拍照器材中設定年、月、日、時、分）。 （三）照片中違規的地點應有背景，如特定建築物、招牌、明確地址或橋樑，以為佐證。 （四）拍攝除草劑不當使用之行為樣態（最好能連續拍攝）。使用攝影機則全程攝影為佳，行為人如有施用除草劑行為，應拍下除草劑藥罐，且最好拍到行為人面貌，以便於查證。（五）除了需提供以上照片內容外，請另外說明（書寫）清楚相關違規事實（人、事、時、地、物）。七、檢舉除草劑不當使用行為是否有檢舉獎勵金？臺北市除草劑管理自治條例目前無檢舉獎勵制度，感謝檢舉人熱心反映及對環保的貢獻，我們將繼續努力改善您所反映的問題，讓我們的環境更加美好。
- - 勞動基準法第36條所定之例假、休息日，如何與一般正常工時或彈性工時配套執行？
  - 本次修法明定每週應有二日之休息，一日為原來的「例假」，一日為新增之「休息日」。搭配勞動基準法現行各種工時規定，細分為以下4種規範：1.一般單週規定(第30條第1項)：每7日中至少應有1日之例假、1日之休息日。2.二週彈性工時(第30條第2項)：每7日中至少應有1日之例假，每2週內之例假及休息日至少應有4日。3.八週彈性工時(第30條第3項)：每7日中至少應有1日之例假，每8週內之例假及休息日至少應有16日。4.四週彈性工時(第30條之1)：每2週內至少應有2日之例假，每4週內之例假及休息日至少應有8日。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 休息日加班工時總量控管所指為何？休息日之工作時間要不要計入每月46小時的加班上限？
  - 1.休息日工作之時間，必須全數計入第32條第2項所定延長工作時間總數(一個月延長工時總數不得超過46小時) 。但若休息日工作係因天災、事變或突發事件所致，其出勤時數不計入第32條第2項所定延長工作時間總數。 例1：休息日出勤6小時，因為必須以8小時計算，當月可用之加班時數（含平日加班）只剩38小時。(46小時-8小時) 例2：當月平日加班已有36小時，休息日出勤最多只能為8小時。（因為如果超過8小時，必須以12小時計，連同原已加班之36小時，合計為48小時，超過一個月46小時上限之規定。）2.例假與休息日並未限定只能排在週六及週日，其日期應在不違反勞動基準法第36條第1項及第2項規定之前提下由勞雇雙方協議之。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 例假與休息日之差別為何？
  - 1.「例假」屬強制性規定，俾以適當地中斷勞工連續多日之工作，保護其身心健康，雇主不得任意剝奪勞工此項基本權益。例假之合法出勤要件，僅限於勞動基準法第40條所列「天災、事變或突發事件」之極特殊狀況，若無該等法定原因，縱然勞工同意，亦不得使勞工於例假日工作。2.「休息日」之出勤較為彈性，其出勤性質屬延長工作時間，雇主如有使勞工於休息日工作之必要，在遵守勞動基準法第24條第2項、第3項、第32條及第36條規定之前提下，可徵求勞工之同意出勤。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 本次修法之例假及休息日如何約定？
  - 勞動契約為私法上之契約，因當事人間之意思表示一致而成立，有關勞工應從事之工作、工作開始及終止之時間、休息時間、例假、休息日等有關事項，應於勞動契約中約定，勞動基準法施行細則第7條亦有明文，惟其約定之內容仍不得違反勞動基準法相關規範。因此，依前開規定，勞工之例假及休息日，仍應由勞資雙方於契約訂定時或契約履行中，進一步詳細約定，以杜爭議。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 休息日出勤是否需符合勞動基準法第32條第1項所定程序(工會或勞資會議同意)？
  - 依勞動基準法第36條第3項規定，「雇主使勞工於休息日工作之時間，計入第三十二條第二項所定延長工作時間總數。…」休息日出勤之時數性質上屬延長工作時間，既為延長工作時間，雇主仍應遵守同法第32條第1項所定程序規定(…經工會同意，如事業單位無工會者，經勞資會議同意…)。至於雇主希望（個別）勞工於休息日出勤，當然也要徵得該名勞工之同意。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 106年1月1日起國定假日遇例假或休息日是否仍須補假？
  - 依勞動部103年5月21日勞動條3字第1030130894號令釋，自104年1月1日起，勞動基準法第37條所定應放假之日（俗稱國定假日，但不包括選舉罷免投票日），如適逢勞工例假及因法定正常工時縮減致無須出勤之休息日，應於其他工作日補休，補休日期係由勞資雙方自行協商議定。所以，106年1月1日起，國定假日凡遇到勞動基準法第36條所定例假及休息日者，仍應依前開令釋給予勞工補休。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 新修正之勞工特別休假日數有多少？
  - 勞工在同一雇主或事業單位，繼續工作滿一定期間者，應依下列規定給予特別休假：一、六個月以上一年未滿者，三日。二、一年以上二年未滿者，七日。三、二年以上三年未滿者，十日。四、三年以上五年未滿者，每年十四日。五、五年以上十年未滿者，每年十五日。六、十年以上者，每一年加給一日，加至三十日為止。                                                      例一：勞工甲105年2月1日到職，於105年12月8日雖工作年資已達10個月又8天，但因未滿1年，依現行勞基法規定，尚無權請求特別休假。勞工甲如106年1月1日仍在職，因工作年資已滿6個月以上，即可依新修正之勞基法規定取得3天特別休假，但應於106年1月1日至106年1月31日間請休；到期後(106年1月31日)未休之日數，雇主應折發工資。勞工甲如106年2月1日仍在職，因年資已滿1年，爰自106年2月1日至107年1月31日，可另排定特別休假7天。例二：勞工乙103年10月1日到職，依現行勞基法規定，自105年10月1日，因年資已滿2年，取得7天特別休假(亦即自105年10月1日至106年9月30日，可排定特別休假7天)。勞工乙如106年1月1日仍在職，因工作年資2年餘，可依新修正之勞基法規定有10天的特休，所以，雇主應自106年1月1日起至106年9月30日，增給勞工乙第2年之特別休假3天。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 新修正之勞工特別休假，用什麼方法來落實讓勞工「看得到、吃得到」？
  - 新修正之特別休假規定重點如下，以下規定自106年1月1日實施：1.特別休假期日，由勞工排定，但雇主因為企業經營上之急迫需求或勞工因個人因素，得與另一方協商調整。(第38條第2項)2.勞工在符合特別休假請休要件時，雇主應告知勞工依規定排定特別休假。(第38條第3項)3.4.年度終結或契約終止時，勞工特別休假未休完之日數，不論原因為何，一律折發工資。前開「年度終結」，依勞工到職日而定(例如：A勞工於某年10月1日到職，其年度終結日為每年之9月30日)。(第38條第4項)5.雇主應於工資清冊記載勞工每年特別休假之期日及未休之日數所發給之工資數額，並定期以書面通知勞工。(第38條第5項)6.當勞工主張本條特別休假權利，但雇主有所異議時，雇主應負舉證責任。(第38條第6項)聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 除原條文規定雇主不得因勞工申訴，而予以不利之處分外，本次修正新增加哪些有關吹哨者保護規範？
  - 1.雇主因勞工申訴所為之解僱、降調、減薪等不利處分之法律效果為無效，以強化勞工權益保障。2.主管機關或檢查機構接獲申訴後，應於60日內將處理情形以書面通知勞工，且不得洩漏申訴人身分資料，違反者，除應依法追究公務員之刑事及行政責任外，對受有損害之勞工，並應負損害賠償責任。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 本次罰鍰修正，作了哪些變動？
  - 1.本次罰鍰只修正勞動基準法第79條，按違法情節輕重不同分訂罰鍰金額上限：（1）違反實體性重要規定：如違反工資、工時等相關條文，提高罰鍰金額上限至100萬元。（2）違反程序性規定：如未依規定置備勞工名卡、拒絕提供服務證明書等，維持現行裁罰上限30萬元。2.增訂主管機關得依事業規模、違反人數或違反情節，加重罰鍰上限至原最高額二分之一之規定(150萬元)。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 廠商詢問財物、勞務及工程之付款進度。
  - 機關於廠商提出財物、勞務及工程之請款單據後，除契約或法令另有規定外，15日內付款。如尚未收到款項，可能是應（待）付款單據與原案及有關規定不合，須由受款人補正，請逕洽本局業務科或提供本局業務承辦人與受款人等資訊，俾利協助快速查詢。
- - 交通警察大隊澄清社交軟體瘋傳「白天不開大燈將開罰」之不實訊息
  - 邇來LINE等社群網站及社交軟體上瘋傳一則「白天不開大燈將開罰」，指出106年1月1日起白天行駛沒開大燈將開罰部分等訊息，臺北市政府警察局交通警察大隊表示，「白天不開大燈將開罰」係不實網路謠言。目前對於白天行駛未開大燈尚無處罰規定。　　依據交通部「車輛安全檢測基準」第3之4項車輛燈光與標誌檢驗安裝規定，新型式機車新車自106年1月1日起應配備晝行燈或啟動即開啟頭燈功能之頭燈；其他新型式小型車新車自107年1月1日起，新型式大型車新車自108年1月1日起應安裝晝行燈，經檢測審驗合格後，始得至公路監理機關辦理登檢領照。本項規定並沒有要求使用中已領有牌照之汽機車車輛需強制加裝晝行燈或啟動即開啟頭燈功能。　　有鑑於白天開頭燈可提高車輛日間可辨識性，所以針對使用中的汽機車，除於隧道等路段行駛時，依道路交通安全規則第109條規定應開亮頭燈外，於其他道路路段行駛時，採「宣導鼓勵」汽機車駕駛人於白天開啟頭燈行駛，提醒來車注意、增加反應時間、以提升道路交通安全、減少事故發生。　　交通大隊表示，目前道路交通安全規則並未修正汽機車白天都要開亮頭燈的規定，所以白天行車除了依規定於隧道、調撥車道、設有標誌指示之山區或特殊路段、涵洞或車行地下道等路段應該開亮頭燈外，於其他道路不開亮頭燈並不會有處罰，併予澄明。　　交通大隊表示，社交軟體內所傳之訊息諸多與事實不符之處，民眾於收到相關訊息時，可向該大隊(電話：02-23752100)洽詢再轉傳，如果無法查證，就不要轉傳，避免誤信錯誤訊息，致自身權益受損。
- - 請問106年領取低收入戶及中低收入戶專用垃圾袋抵價券資格為何？
  - 本府社會局106年核列之低收入戶及中低收入戶均可領取專用垃圾袋抵價券。
- - 臺北自來水事業處營業章程(中華民國105年12月20日臺北市政府府授水企字第10532554400號函核定，105年12月28日起實施)
  - 臺北自來水事業處營業章程第一章 總則第一條本章程依自來水法第五十八條規定訂定之。第二條凡在臺北自來水事業處 (以下簡稱本處)供水區域內，由本處供水者，供需雙方之權利、義務及本處附屬事業之經營管理，依本章程之規定。前項供水區域以主管機關核定之範圍為準。第三條用戶應收之水費（包括基本費及依用水量計算之用水費）及其他各項費用，均依報經主管機關核定之標準計收。第二章 供水第四條本處供水種類如下： 一、普通用水：供一般使用者。 二、市政用水：供市政公共使用者。 三、臨時用水：供臨時使用者。 第五條本處如因災害、緊急措施或工程施工而停止全部或一部供水時，應將停水區域及時間事先通告周知，並呈報所在地主管機關核備；但停止供水事故係臨時發生者，得於事後補報。其有特殊情形必須連續停水達十二小時以上或定時供水者，應先申請所在地主管機關核准，並公告周知。 本處為因應乾旱，應依照中央水利主管機關訂定之停止、限制供水執行標準與相關措施辦理。用戶對於第一、二項停止及限制供水，不得要求任何損失賠償。第六條用戶申請供水之處所，若非本處水壓可正常供水者，用戶於申請新設供水時，應自行付費安裝及管理維護間接加壓用水設備。 用戶依自來水法第二十三條第二項設置之用戶加壓受水設備，委託本處代管者，依本處代管之相關規定辦理。第三章 申請第七條用戶申請新設、改裝、中止、復水、廢止或其他用水異動事項，應填具申請書及檢附必備文件，向所在地本處所屬營業處所申辦，經審查符合規定並繳付應繳各項費用後，由本處依申請事項辦理。 前項新設、改裝工程費用，本處得按用戶用水設備狀況，依主管機關核定之標準，向用戶收取。用戶如中途撤回申請，所繳各項費用，除接水費及用水設備工程尚未施工部分之工料費可退還外，已施作之工料費用及路權單位不予退還之路面修復費概不退還。第八條申請變更用水人名義（過戶）時，應先經前用戶簽章同意，並繳清用水期間應繳各項費用。 用戶如無法取得前用戶簽章時，得單獨申請變更用水人名義（過戶），並應繳清前用戶之欠費。但前用戶於六個月內提異議時，本處得取消後用戶之變更，變更後取消前已發生之欠費，後用戶應予清繳。 用戶不願依前二項方式辦理者，得核計費用並另訂用水服務契約。第九條用戶申請新設用水設備如須使用或通過他人土地、建築物或接用他人所有水管，應事先取得所有權人或管理人之同意書。如在施工期間或日後發生糾紛，由申請人自行負責。 前項通過之土地，為既成道路者，如申請人書面承諾該土地之使用發生爭執時願自行負責處理者，得免提同意書。 第十條有下列情形之一者，本處得拒絕接受新設用水之申請： 一、配水管尚未敷設到達者。 二、當地出水或配水系統供水能力已達飽和尚未完成擴充者。 三、供水有特殊困難者。第四章 用水設備第十一條用戶用水設備分外線及內線二部分。外線指配水管至水表（或稱量水器、水量計；若設有總水表者，以總水表為內外線分界）間之設備，由用戶向所在地本處所屬營業處所申請並繳付應繳各項費用後，由本處裝設；內線指水表後至水栓間之設備，由用戶委託合格自來水管承裝商裝設。 前項之外線如以加大口徑辦理，並由本處負擔加大部分之差額者，用戶不得反對本處駁接他人使用。第十二條用戶用水設備內線工程，其設計圖應先送本處審定始得施工。工程完竣後，經本處或由本處委託相關專業團體代為檢驗合格，始得供水。 前項審查及檢驗，本處得依主管機關核定之收費標準向用戶收取。 用戶私自變更用水設備及表位，造成本處損害者，應負賠償責任；其因而致本處應對第三人負損害賠償責任者，亦同。 第十三條因配水管之遷移或其他事由而有移改用戶用水設備外線之必要時，用戶不得拒絕本處辦理，本處不得向用戶收取費用。第十四條用戶用水設備發生漏水時，其外線部分由本處負擔費用代為修理，惟於施工必要範圍內，必須挖掘用戶地面或拆損其構造物時，除漏水係可歸責於本處之事由外，僅由本處回復至原有使用功能。 前項情形，其內線部分由用戶自行雇用合格自來水管承裝商辦理。 本處因處理違反第33條用水案件而須拆除管線，或停水所必需之措施，比照第一項辦理。第十五條建築物拆除或重建時，用戶應申請廢止用水，繳清應繳水費及裝置拆除費，由本處代為拆除其原有外線用水設備。 前項情形，用戶如未申請廢止，本處得逕行拆除，並得向用戶請求應繳水費及拆除費用。拆除前，應以書面通知用戶，但經本處多方查詢而無法通知者，不在此限。 拆除後，其原有外線用水設備，視為廢棄物。 第十六條本處員工或委外承攬人員檢查用戶用水設備，或執行抄表、裝表、拆表、換表、封印等事項，應穿著制服並配戴識別證，用戶非有正當理由不得拒絕。 第五章 水表 第十七條設置間接加壓用水設備之共同用戶，應裝置總水表，並分戶裝置水表。 水表由本處提供，用戶應妥善保管。除天災、事變或其他不可歸責於用戶之事由外，水表如有毀損或遺失，用戶應按本處所訂帳面價值給付本處。 第十八條水表裝置位置及適用口徑由用戶依本處之表位設置原則及用戶用水設備標準設計，並經本處審定。 前項情形如因環境或用水情況改變，本處認有必要時，得遷移或變更之，其費用由本處負擔。但需遷移或變更事由係用戶造成時，本處應先以書面通知限期改善，如用戶逾期仍未改善或無法改善者，本處得代為改善，其費用由用戶負擔。 如因用戶之事由致本處代為改善有困難且用戶仍不自行改善者，本處得停止供水。因用戶不改善而致本處受損害者，本處並得就其損害要求損害賠償。如因而致本處需對第三人負損害賠償責任者，亦同。 第十九條本處應確保水表之正確計量。如用戶對正確計量提出疑義，本處應派員至現場複查。 複查後，用戶如仍認為所裝水表失效或不準確時，得依「糾紛度量衡器鑑定辦法」，向度量衡專責機關申請水表鑑定；其鑑定結果若合於標準，由用戶負擔鑑定費及勘拆費用；若不合標準，該費用由本處負擔；如屬快轉，並應按比例核減水費，核減應自水費突增之月份起算。第六章 抄表收費第二十條用戶用水量以度數計算，每一立方公尺水量為一度。第二十一條本處每月或隔月抄表收費一次，必要時得調整之，但應事前以書面通知用戶。 第二十二條因用戶之事由，致不能抄表時，該期用水量暫照上期用水度數計算，於下期抄表時結算之。如連續二次無法抄表，本處得以書面或電話通知約期候抄，仍無法抄表時，得按水表口徑流量推計，並於抄見時結算。 第二十三條水表發生故障或其他原因，致不能正確表示實用度數時，本處得按用戶前二期正常用水平均度數或新表實用度數推計水費。但用戶用水有季節性變化者，本處得按其前一年度同期用水度數推計。 前項水費之推計，應採合理且有利於用戶之方式為之。 第二十四條用戶用水係通過總水表者，總水表示度超過各用戶水表示度之和時，差額水量由各戶平均分擔，但各用戶間另有書面約定，並告知本處者，依其約定。 第二十五條因情形特殊未裝水表之用戶，每月按用水設備之口徑計收基本費，並按每人每月七度加計水費。第二十六條用戶如不需用水時，得申辦中止，中止期間免計基本費，申請復水時，按用水設備口徑，繳納復水費及申請中止時當期未結算繳納之費用。 用戶因第三十三條第一項第四款規定欠費，受本處依約停水二年以下，申請復水時，除應繳納復水費及前積欠費用外，並應按用水設備口徑，繳納停水期間二分之一基本費。 中止或欠費停水逾二年未復用、用戶新設外線工程竣工逾二年未啟用者，用戶如再申請用水時，應核計費用並另訂用水服務契約。 第二十七條用戶用水日數不足一個月或水表口徑如有變動，當月份基本費按使用日數比例計收。第二十八條本處因不可抗力之事由致停止供水連續超過二十四小時者，當月基本費按停水日數比例扣減。 第二十九條用戶應繳水費，經本處通知後，應於通知之收費日起二十一日內之繳費期限繳付。 前項水費，用戶可自行至本處所屬營業處所或其他代收水費單位繳付。逾繳費期限七日內繳費者，免計遲延違約金；自逾繳費期限第八日起至第十四日繳費者，按應繳水費百分之一加收違約金；逾繳費期限第十五日起繳費者，按應繳水費百分之二加收違約金。但違約金未滿新臺幣五元者，以新臺幣五元計。 前項違約金得併入下期水費中收取。 第三十條本處向用戶收取之水費，如有短計或溢收，得於以後月份補正，多退少補。 用戶接到本處收費通知後，如有疑問，得向本處所屬營業處所申請複查，複查結果，須更正水費時，未繳者換單，已繳者差額退還或併入下期水費內計算。 第三十一條用戶私自變更用水用途，如其費率高於原來者，本處除通知其補辦手續外，並得視情節追收水費差額，但最高以六個月為限。 第三十二條用戶申請臨時用水，應繳付水費保證金。 前項保證金，用戶於廢止用水後，憑收據向本處申請退費。 如收據遺失者，以其他證明文件代之。 第七章 違規取締第三十三條用戶有下列情形之一，本處得予停止供水： 一、有竊水行為，證據確實者。 二、用水設備維護不當，或其裝置方式經檢驗不合規定，經限期通知改善，逾期仍不改善者。 三、無正當理由拒絕本處檢查其用水設備或用水情形者。 四、欠繳應付各項費用逾期二個月，經限期催繳仍不繳付者。 五、拒絕裝設或換裝水表者。 六、擅自將其他管線與自來水管線相連接，經通知改正，在指定期間未改正者。 七、擅自拆遷、移動或更換本處水表者。 八、違建、設置障礙物或無正當理由妨礙本處執行正常抄錄或換裝水表工作者。 前項停止供水原因招致本處損失時，用戶須負賠償責任。停止供水原因消滅，用戶申請復水時，應先繳付應繳各項費用，始予復水。第三十四條用戶有下列行為之一，即為竊水： 一、未經本處許可，在本處供水管線上取水者。 二、繞越所裝水表私接水管者。 三、毀損或改變水表之構造或用其他方式致水表失效或不準確者。 四、未經本處許可，擅自開啟公用救火栓取用自來水者。但因消防需要而開啟，不在此限。 對於竊水用戶，本處除得依其所裝之用水設備、供水時間及當地供水狀況，追償三個月以上一年以下之水費及請求損害賠償外，並得停止供水，送請法辦。第八章 附屬事業之經營管理第三十五條本處得經營下列附屬事業： 一、有關自來水事業服務用戶所必需之事業。 二、有關增益自來水事業發展所必需之房地開發或管理事業。 三、包裝飲用水事業。 四、其他附屬事業。第三十六條本處得依下列方式經營附屬事業： 一、自行經營。 二、出租或提供使用。 三、委託經營。 四、其他適當經營方式。第九章 附則第三十七條 本處為永續經營與兼顧用戶權益，得為下列之行為： 一、促進安全用水及用戶服務事項。 二、節約用水與環境教育相關事項。 三、受政府委請辦理與聯繫之事務。 四、與其他自來水事業或法人間有關服務用戶所需之事務。 五、推動其他與自來水事業營運之相關事項。第三十八條本章程報奉臺北市政府核准後公告實施。
- - 臺北自來水事業處消費性用水服務契約(105年12月20日臺北市政府府授水企字第10532554400號函核定，105年12月28日起實施)
  - 臺北自來水事業處消費性用水服務契約本契約審閱期間 3日，於___年___月___日由申請用水人攜回審閱。申請用水人簽名：__________立契約書人申請用水人（以下簡稱甲方）自來水事業名稱（以下簡稱乙方）茲因自來水消費性供用事宜，雙方同意訂立本契約書，以資共同遵守：第一條（供水義務）乙方除有正當理由外，應依法經常供水。第二條（申請用水地址）甲方申請用水地址：____________________________。第三條（因災害、緊急措施或工程施工之停止供水程序）乙方如因災害、緊急措施或工程施工而停止全部或一部供水時，應將停水區域及時間事先通告周知，並呈報所在地主管機關核備；但停止供水事故係臨時發生者，得於事後補報。其有特殊情形必須連續停水達十二小時以上或定時供水者，應先申請所在地主管機關核准，並公告周知。甲方對於前項停止供水不得要求任何損失賠償。第四條（用水及異動申請）甲方申請新設、改裝、中止、復水、廢止或其他用水異動事項，應填具申請書及檢附必備文件，向所在地乙方所屬營業處所申辦，經審查符合規定並繳付應繳各項費用後，由乙方依申請事項辦理。（應備文件如附表一）前項新設、改裝工程費用，乙方得按甲方用水設備狀況，依主管機關核定之標準，向甲方收取。甲方如中途撤回申請，所繳各項費用，除接水費及用水設備工程尚未施工部分之工料費可退還外，已施作之工料費用及路權單位不予退還之路面修復費概不退還。第五條（間接加壓用水設備）甲方申請供水之處所，若非乙方水壓可正常供水者，甲方於申請前條新設供水時，應自行付費安裝及管理維護間接加壓用水設備。第六條（用水人名義變更）申請變更用水人名義（過戶）為甲方時，應先經前用戶簽章同意，並繳清用水期間應繳各項費用。甲方如無法取得前用戶簽章時，得單獨申請變更用水人名義（過戶），並應繳清前用戶之欠費。但前用戶於六個月內提異議時，乙方得取消甲方之變更，本契約自動終止，變更後終止前已發生之欠費，甲方應予清繳。 甲方不願依前二項方式辦理者，得核計費用並另訂用水服務契約。第七條（停用或中止及恢復用水程序）甲方如不需用水時，得申辦中止，中止期間免計基本費，申請復水時，按用水設備口徑，繳納復水費及申請中止時當期未結算繳納之費用。甲方因本契約第三十一條第一項第四款規定欠費，受乙方依約停水二年以下，申請復水時，除應繳納復水費及前積欠費用外，並應按用水設備口徑，繳納停水期間二分之一基本費。中止或欠費停水逾二年未復用、用戶新設外線工程竣工逾二年未啟用者，本契約自動終止，甲方如再申請用水時，應核計費用並另訂用水服務契約。第八條（用水設備使用他人產權之處理方式）甲方申請新設用水設備如須使用或通過他人之土地、建築物或接用他人所有水管，應事先取得所有權人或管理人之同意書。如在施工期間或日後發生糾紛，由甲方自行負責。前項通過之土地，為既成道路者，如甲方書面承諾該土地之使用發生爭執時願自行負責處理者，得免提同意書。第九條（用水設備外線、內線之定義及裝設主體）甲方用水設備分外線及內線二部分。外線指配水管至水表（或稱量水器、水量計；若設有總水表者，以總水表為內外線分界）間之設備，由甲方向所在地乙方所屬營業處所申請並繳付應繳各項費用後，由乙方裝設；內線指水表後至水栓間之設備，由甲方委託合格自來水管承裝商裝設。前項之外線如以加大口徑辦理，並由乙方負擔加大部分之差額者，甲方不得反對乙方駁接他人使用。第十條（ 用戶用水設備內線及表位審查）甲方用水設備內線工程，其設計圖應先送乙方審定始得施工。工程完竣後，經乙方或由乙方委託相關專業團體代為檢驗合格，始得供水。前項審查及檢驗費用，乙方得依主管機關核定之收費標準向甲方收取。甲方私自變更用水設備及表位，造成乙方損害者，應負賠償責任；其因而致乙方應對第三人負損害賠償責任者，亦同。第十一條（用戶用水設備外線移改）因配水管之遷移或其他事由而有移改甲方用水設備外線之必要時，甲方不得拒絕乙方辦理，乙方不得向甲方收取費用。第十二條（用戶用水設備之維修權責）甲方用水設備發生漏水時，其外線部分由乙方負擔費用代為修理，惟於施工必要範圍內，必須挖掘甲方地面或拆損其構造物時，除漏水係可歸責於乙方之事由外，僅由乙方回復至原有使用功能。前項情形，其內線部分由甲方自行雇用合格自來水管承裝商辦理。乙方因處理違反本契約第三十一條用水案件而須拆除管線，或停水所必需之措施，比照第一項辦理。第十三條（用戶申請廢止用水之義務）建築物拆除或重建時，甲方應申請廢止用水，繳清應繳水費及裝置拆除費，由乙方代為拆除其原有外線用水設備。前項情形，甲方如未申請廢止，乙方得逕行拆除，並得向甲方請求應繳水費及拆除費用。拆除前，應以書面通知甲方，但經乙方多方查詢而無法通知者，不在此限。拆除後，其原有外線用水設備，視為廢棄物。第十四條（用水設備之檢查）乙方員工或委外承攬人員檢查甲方用水設備，或執行抄表、裝表、拆表、換表、封印等事項，應穿著制服並配戴識別證，甲方非有正當理由不得拒絕。第十五條（水表之保管責任）設置間接加壓設備用水之共同用戶，應裝置總水表，並分戶裝置水表。水表由乙方提供，甲方應妥善保管。除天災、事變或其他不可歸責於甲方之事由外，水表如有毀損或遺失，甲方應按乙方所訂價格給付乙方。第十六條（水表之裝置、遷移及變更）水表裝置位置及適用口徑由甲方依乙方之表位設置原則及用戶用水設備標準設計，並經乙方審定。前項情形如因環境或用水情況改變，乙方認有必要時，得遷移或變更之，其費用由乙方負擔。但需遷移或變更事由係甲方造成時，乙方應先以書面通知限期改善，如甲方逾期仍未改善或無法改善者，乙方得代為改善，其費用由甲方負擔。如因甲方之事由致乙方代為改善有困難且甲方仍不自行改善者，乙方得停止供水。因甲方不改善而致乙方受損害者，乙方並得就其損害要求損害賠償。如因而致乙方需對第三人負損害賠償責任者，亦同。第十七條（水表計量失準之處理方式）乙方應確保水表之正確計量。如甲方對正確計量提出疑義，乙方應派員至現場複查。複查後，甲方如仍認為所裝水表失效或不準確時，得依「糾紛度量衡器鑑定辦法」，向度量衡專責機關申請水表鑑定；其鑑定結果若合於標準，由甲方負擔鑑定費及勘拆費用；若不合標準，該費用由乙方負擔；如屬快轉，並應按比例核減水費，核減應自水費突增之月份起算。第十八條（一度水之定義）甲方用水量以度數計算，每立方公尺水量為一度。第十九條（收取水費之週期）乙方每月或隔月抄表收費一次，必要時得調整之，但應事前以書面通知甲方。第二十條（無法抄錄水表度數之處理方式）因甲方之事由，致不能抄表時，該期用水量暫照上期用水度數計算，於下期抄表時結算之。如連續二次無法抄表，乙方得以書面或電話通知約期候抄，仍無法抄表時，得按水表口徑流量推計，並於抄見時結算。第二十一條（水表故障時水費之推計）水表發生故障或其他原因，致不能正確表示實用度數時，乙方得按甲方前二期正常用水平均度數或新表實用度數推計水費。但甲方用水有季節性變化者，乙方得按其前一年度同期用水度數推計。前項水費之推計，應採合理且有利於甲方之方式為之。第二十二條（收費標準）乙方應收之水費（包括基本費及依用水量計算之用水費）及其他各項費用，均依報經主管機關核定之標準計收。乙方依法隨水費附徵或代收之費用如附表二。第二十三條（水表總、分表差額水量之處理）甲方用水係通過總表者，總表示度超過各用戶水表示度之和時，差額水量由各戶平均分擔，但各用戶間另有書面約定，並告知乙方者，依其約定。第二十四條（不足月基本費之計收）甲方用水日數不足一個月或水表口徑如有變動，當月份基本費按使用日數比例計收。第二十五條（因不可抗力事由停水之補償）乙方因不可抗力之事由致停止供水連續超過二十四小時者，當月基本費按停水日數比例扣減。第二十六條（水費遲繳之加收） 甲方應繳水費，經乙方通知後，應於通知之收費日起二十一日內之繳費期限繳付。前項水費，甲方可自行至乙方所屬營業處所或其他代收水費單位繳付。逾繳費期限七日內繳費者，免計遲延違約金；自逾繳費期限第八日起至第十四日繳費者，按應繳水費百分之一加收違約金；逾繳費期限第十五日起繳費者，按應繳水費百分之二加收違約金。但違約金未滿新臺幣五元者，以新臺幣五元計。前項違約金得併入下期水費中收取。第二十七條（水費短計或溢收之補正）乙方向甲方收取之水費，如有短計或溢收，得於以後月份補正，多退少補。甲方接到乙方收費通知後，如有疑問，得向所在地乙方所屬營業處所申請複查，複查結果，須更正水費時，未繳者換單，已繳者差額退還或併入下期水費內計算。第二十八條（用戶變更用水用途應經申請）甲方私自變更用水用途，如其費率高於原來者，乙方除通知其補辦手續外，並得視情節追收水費差額，但最高以六個月為限。第二十九條（申請或取消臨時用水）甲方申請臨時用水，應繳付水費保證金。前項保證金，甲方於廢止用水後，憑收據向乙方申請退費。如收據遺失者，以其他證明文件代之。第三十條（竊水處理）甲方有下列行為之一，即為竊水：一、未經乙方許可，在乙方供水管線上取水者。二、繞越所裝水表私接水管者。三、毀損或改變水表之構造或用其他方式致水表失效或不準確者。四、未經乙方許可，擅自開啟公用救火栓取用自來水者。但因消防需要而開啟，不在此限。對於竊水用戶，乙方除得依其所裝之用水設備、供水時間及當地供水狀況，追償三個月以上一年以下之水費及請求損害賠償外，並得停止供水，送請法辦。第三十一條（停止供水之事由）甲方有下列情形之一，乙方得予停止供水：一、有竊水行為，證據確實者。二、用水設備維護不當，或其裝置方式經檢驗不合規定，經限期通知改善，逾期仍不改善者。三、無正當理由拒絕乙方檢查其用水設備或用水情形者。四、欠繳應付各項費用逾期二個月，經限期催繳仍不清付者。五、拒絕裝設或換裝水表者。六、擅自將其他管線與自來水管線相連接，經通知改正，在指定期間未改正者。七、擅自拆遷、移動或更換甲方保管之水表者。八、違建、設置障礙物或無正當理由妨礙乙方執行正常抄錄或換裝水表工作者。前項停止供水原因招致乙方損失時，甲方須負賠償責任。停止供水原因消滅，甲方申請復水時，應先繳付應繳各項費用，始予復水。第三十二條（乙方得為之行為）為永續經營與兼顧用戶權益，乙方得為下列之行為：一、促進安全用水及用戶服務事項。二、節約用水與環境教育相關事項。三、受政府委請辦理與聯繫之事務。四、與其他自來水事業或法人間有關服務用戶所需之事務。五、推動其他與自來水事業營運之相關事項。第三十三條（契約終止）甲方如欲終止本契約，應向乙方辦理廢止用水手續，並繳付應繳各項費用。如有第六條第二項但書或第七條第三項情形之一者，本契約自動終止。乙方應將終止事實通知甲方，甲方如有欠費，乙方應通知甲方一併繳納。第三十四條（契約條款變更後之適用）本契約條款如有任何增修刪等變更，經乙方主管機關核准並公告後，視為契約之一部分。乙方應將變更後之重要條款內容以書面通知甲方。第三十五條（申訴管道）甲方不滿意乙方提供之服務，除依法申訴外，可透過以下途徑申訴：一、 逕向當地乙方營業處所申訴。二、 撥打乙方之服務電話申訴。三、 於乙方網站之便民信箱申訴。四、 其他方式申訴，如郵寄申訴書。對於前項申訴，乙方應視實際情形，依相關法令規定處理。第三十六條（管轄法院）因本契約涉訟時，雙方合意以用水所在地地方法院為第一審管轄法院。但不得排除消費者保護法第四十七條或民事訴訟法第四百三十六條之九有關小額訴訟管轄法院之適用。第三十七條（未盡事宜之處理）本契約之約定事項如有未盡事宜，應依相關法令及誠實信用原則公平辦理之。甲方：_______（申請用水人）身分證字號\統一編號：_____通訊地址：_____________聯絡電話：_____________乙方： 臺北自來水事業處營利事業統一編號： 03774909 代表人： 陳錦祥 地址： 臺北市長興街131號 網址：http：//www.water.gov.taipei服務電話： (02)8733-5678 中華民國 年 月 日
- - 例假日，一定要使勞工出勤時，加班費如何計算?
  - 1.事業單位如非因同法第四十條所列天災、事變或突發事件等法定原因，縱使勞工同意，亦不得使勞工在例假日工作。2.事業單位違反上開法令規定，除應依法處理並督責改進外，如勞工已有於例假日出勤之事實已屬違法，惟其當日出勤之工資，仍應加倍發給。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 有關檢舉違反水污染防治法案件獎勵辦法，民眾如何檢舉水污染環境行為?檢舉資料應寄送到何處?
  - 若您於本市發現違反水污染防治法之行為，請以書面或市政信箱向本局檢舉。市政信箱：http：//contact.taipei.gov.tw/CCLM/CLM/ASPX/CLM00100E.ASPX）檢舉時請檢附違規證物（載有日期時間之影片、照片）及詳載人（如可供查詢之居所、電話等）、事（如違反事實及當時情形描述）、時（年、月、日、時、分）、地（如門牌號碼、地標）、物（如水質、繞流排放、未申報等違規項目），並提供個人基本資料（含真實姓名、身分證號、住址、聯絡電話等），本局即會依法進行後續查證作業。
- - 106年國定假日遇假日如何補休？
  - 國定假日遇休息日、例假日雇主應予勞工補休一日，勞資得自行協商補休日期。聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 休息日第9至第12小時加班費計算方式？
  - 1.依勞動基準法第24條規定，勞工於法定休息日出勤工作時，工作時間在2小時以內者，其工資按平日每小時工資額另再加給1又1/3以上，工作2小時再繼續工作者，按平日每小時工資額另再加給1又2/3以上。2.休息日的工資計算，4小時以內者，以4小時計；逾4小時至8小時以內者，以8小時計；逾8小時至12小時以內者，以12小時計。3.以勞工月薪36,000元，推算每日工資1,200元，平日每小時工資額為150元為例：（1）休息日工作1小時，以半日4小時計，應另再加給900元（計算方式：150x1又1/3x2+150x1又2/3x2=900），當月工資合計36,900元。)     （2）休息日工作6小時，以8小時計，應另再加給1,900元（計算方式：150x1又1/3x2+150x1又2/3x6=1,900）當月工資合計37,900元。)(3）休息日工作10小時，以12小時計，應另再加給3,500元（計算方式：150x1又1/3x2+150x1又2/3x6+150x2又2/3x4=3,500）當月工資合計39,500元。)聯絡科室：勞動基準科(含勞動條件檢查組)承辦人 聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7019、3325、3327、3349；02-23026355轉9
- - 低收在什麼情況下會停止低收入戶租金補貼？
  -  如有低收入戶資格喪失、戶籍遷出本市、家庭成員擁有自有住宅、租賃契約解除、終止或於本辦法施行前承租非合法住宅而接受政府租金補貼者但已無租賃同一建物事實，自事實發生日起停止補貼，並應按該月之日數比率繳回溢領款項。
- - 如何得知中山堂的展覽資訊？
  - 本所展覽資訊可由網站「展覽活動」、「中山堂APP」及節目手冊取得。
- - 請問臺北書院的課程如何報名？
  - 您可由本所網站「臺北書院」專區進入臺北書院網站 (http：//tplecturehall.wordpress.com/)。或於每日13：00至21：00電洽(02)2311-2348辦理。
- - 請問中山堂有無招募志工？
  - 本所不定期辦理新進志工人員招募。如您有意擔任本所志工，可於本所公告志工報名截止日前，依招募簡章說明填具報名表格，郵寄、傳真或E-mail至本所以完成報名程序。經本所甄選通過者，即通知其參加志工基礎培訓課程。相關辦法請見本所網站「志工專區」，謝謝。
- - 我想了解關於黃土水「水牛群像」這件作品。
  - 黃土水先生係艋舺人，1895∼1930留日學習雕塑，1920年以「山童吹笛」入選日本第二屆帝展，為臺灣首位得獎人，「水牛群像」原名「南國」為其生平最後遺作。本浮雕長555公分，高250公分，屬罕見大尺寸創作。作品以熱帶植栽香蕉樹、臺灣水牛、戴斗笠裸身牧童，形成南國風情。黃氏逝世後，其夫人黃氏廖秋桂女士將之遺贈中山堂，嵌置於中山堂光復廳前壁，永久留存，並已列為國寶等級，相關資料可見雄獅美術專書。
- - 臺北市有線電視何時實施分組付費？
  - 一、國家通訊傳播委員會已研擬實施「分組付費」，並於105年6月提案送請立法院審議，目前尚未通過審議，俟通過審議後本市將配合辦理。二、因實施「分組付費」的條件之一為有線電視完成數位化，即每1臺收視有線電視的電視機均裝設數位機上盒，家中電視尚未裝設機上盒，請速洽業者裝設。
- - 家中有線電視原本與業者簽訂一定期間的優惠專案，如提前解約費用如何計算？
  - 一、依國家通訊傳播委員會公告「有線廣播電視系統經營者╱有線播送系統定型化契約應記載及不得記載事項」第16條規定業者不得收取違約金。二、惟近來有線電視業者皆推出收視優惠方案供用戶選擇，並要求用戶須收視1年(或半年)，若收視未滿1年(或半年)須依原價補繳差額，針對此一情形，國家通訊傳播委員會解釋說明，此為「附條件契約」，若民眾終止契約，則應返還當初獲得的優惠，業者並無違法。提醒民眾選擇優惠方案前應確認提前終止契約時的處理方式。
- - 什麼是自然人憑證？如何申請？是否一定要本人親自申請?
  - ◎什麼是自然人憑證：就是給自己一個網路身分證，您可透過網路申辦多項政府提供的服務，目前自然人憑證可使用的網路應用服務包括網路報稅、勞保年資及個人退休金專戶查詢、個人限制入出境查詢、健保個人資料及欠費查詢、電子公路監理、電子戶籍謄本、身分證掛失及地政e網通等多項便民服務(請參照內政部憑證中心網站http：//moica.nat.gov.tw/link_1.html)。◎如何申請自然人憑證：1.年滿18歲就可辦理，必須本人親自辦理（不可委託辦理喔！即便當事人如果在國外的話，也不可授權辦理）。2.應備證件：(1)身分證正本。(2)E-mail信箱。(3)規費250元。3.您可至全國任一戶政事務所辦理。4.於上班時間申請或補領自然人憑證可當場領取IC卡。
- - 自然人憑證到期，要如何辦理展期？
  - ◎憑證有效期：目前自然人憑證使用期限為5年可辦理展延3年，年限總計8年。◎憑證展期：1.憑證到期前60天至到期後3年內，皆可辦理展期。2.展期方式：可線上申請或親至戶政事務所臨櫃辦理憑證展期。(1)線上展期：用戶可直接在內政部憑證中心網站辦理線上展期，網址http：//moica.nat.gov.tw/。(2)臨櫃展期：A.請本人攜帶國民身分證及自然人憑證IC卡，親至任一戶政事務所辦理憑證展期。B.或是委託他人代為辦理自然人憑證展期：委託人及受委託人應先行填妥並確認自然人憑證代辦事項委託書之內容正確性並親筆簽名或用印，由受委託人攜帶該委託書、委託人之IC卡、雙方之國民身分證正本至任一戶政事務所辦理。C.符合展期條件的憑證不論何時進行展期，皆自憑證有效期到期日起算展期3年。
- - 自然人憑證忘記密碼或卡片被鎖住，鎖卡解碼該如何處理?
  - ◎為安全起見，IC卡會在您輸入3次錯誤的PIN碼時，即被鎖住而無法使用。◎鎖卡解碼：1.線上辦理：請至內政部憑證中心網站（網址：http：//moica.nat.gov.tw/）辦理線上鎖卡解碼（憑證作業╱忘記PIN碼/鎖卡解碼），輸入正確的用戶代碼就可解開並恢復IC卡之使用。2.如仍不會恢復，仍記得用戶代碼，可撥打內政部憑證中心客服專線：0800-080-117，由客服人員通知卡管中心解除卡片鎖定的狀態。3.忘記用戶代碼：(1)請攜帶身分證正本及自然人憑證IC卡，親自至任一戶政事務所重設用戶代碼，重設後系統也會同時將卡片的PIN碼變更為預設值，也就是憑證用戶的出生年月日共6碼，卡片就能繼續使用了。(2)重設用戶代碼得委託他人至任一戶政事務所代為辦理，委託人及受委託人應先行填妥並確認自然人憑證代辦事項委託書之內容正確性並親筆簽名或用印，由受委託人攜帶該委託書、委託人之IC卡、雙方之國民身分證正本至任一戶政事務所辦理。
- - 何謂高噪車輛照相系統？
  - 環保局研發「高噪車輛照相系統」，整套系統主要包含噪音計、可換鏡頭數位相機、紅外線光遮斷器及系統本身，透過該系統，只要有車輛經過偵測地點且產生的音量經噪音計量測超出系統所設定的分貝值時，一但該車行駛通過前方紅外線光遮斷器所發出的紅外線，系統即會自動拍照及同步紀錄車輛所產生之分貝數，以科學量測作為認定擾民之依據，強化執法公信力及提升採證效能。
- - （機關、團體、動物醫院）民眾發現有人除了虐待動物之外，也疑似有虐待兒童，民眾要通報
  - 若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供諮詢服務。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。
- - （一般民眾）我發現有人虐待動物，我可以怎麼做？
  - 一、可於上班時間直接撥打臺北市動物保護處動物救援專線(02)8791-3064、(02)8791-3065，由專人提供服務。二、倘有發現除虐待動物外，可以再多留意是否有家庭成員也受波及或虐待的情形，若有發現有家庭成員受暴或虐待，亦要撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供諮詢服務。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。
- - 中低收入戶身心障礙者生活補助內容？
  - 中低收入戶身心障礙者生活補助(106年起為中度以上為每月4,872元；輕度為3,628元)。
- - 中低收入戶是否有生活扶助？
  - 本市列冊中低收入戶之身心障礙者，領有中低收入戶身心障礙者生活補助(106年起為中度以上為每月4,872元；輕度為3,628元)，其餘中低收入戶成員無生活費補助，僅有學雜費和健保自付額之部分額度補助。
- - 中低收入戶之申請單位、應備文件及標準為何？
  - 1.申請單位：戶籍所在地區公所社會課。2.應備文件：(1)申請表1份（可自本局網站下載，下載路徑為本局首頁/相關服務-社會救助/生活經濟輔助/中低收入戶服務）。(2)新式戶口名簿(含詳細記事)影本1份。(3)戶長郵局或市庫指定銀行(現為台北富邦銀行)存摺封面影本1份。(4)其他相關證明文件1份（如：身心障礙手冊或證明、診斷證明書、學生證、薪資證明、房屋所有權狀影本等）。3.申請資格：設籍並實際居住本市、最近1年出境累計未超過183日，且同時符合以下條件者：(1)家庭總收入平均分配全家人口，每人每月金額符合規定者（本市106年度為22,207元）。(2)全家人口之存款（含股票投資）平均每人不超過新臺幣15萬元。(3)全家人口之土地及房屋價值不超過新臺幣876萬元。
- - 申請低收入戶之洽辦單位、應備文件及資格為何？
  - 1.洽辦單位：戶籍所在地區公所社會課。2.應備文件：(1)申請表1份（可自本局網站下載，www.dosw.taipei.gov.tw，下載路徑為本局首頁/相關服務-社會救助/生活經濟輔助/低收入戶生活補助）。(2)新式戶口名簿(含詳細記事)影本1份。(3)戶長郵局或市庫指定銀行(現為台北富邦銀行)存摺封面影本1份。(4)其他相關證明文件1份（如：身心障礙手冊或證明、診斷證明書、學生證、薪資證明、房屋所有權狀影本等）。3.資格：設籍並實際居住本市、最近1年出境累計未超過183日，且同時符合以下條件者：1、家庭總收入平均分配全家人口，每人每月在最低生活費標準（本市106年度為15,544元）。2、全家人口之存款（含股票投資）平均每人不超過新臺幣15萬元。3、全家人口之土地及房屋價值不超過新臺幣740萬元。
- - 申請中低收入老人生活津貼資格？
  - 設籍並實際居住本市，且符合以下條件者：1、年滿65歲，且最近1年居住國內超過183日。2、未經政府公費收容安置。3、家庭總收入平均分配全家人口，每人每月符合規定者（106年度為30,631元）。4、全家人口之存款（含股票投資）之合計限額：單一人口家庭為新台幣250萬元，每增加一口，得增加新台幣25萬元。5、全家人口之土地及房屋價值合計不超過新台幣876萬元。6、未入獄服刑、因案羈押或依法拘禁。
- - 中低收入老人生活津貼之申辦單位、應備文件及補助內容為何？
  - 1.申辦單位：戶籍所在地區公所社會課2.應備文件：(1)申請書1份。(2)新式戶口名簿(含詳細記事)1份（含出嫁女兒家戶資料）。(3)申請人本人之郵局或台北富邦銀行存摺封面影本1份。(4)其他相關證明文件（如：身心障礙手冊或證明、診斷證明書、學生證、薪資證明、房屋所有權狀影本等）。3.申請資格：設籍並實際居住本市、最近一年居住國內超過183日，且符合以下條件者：(1)年滿65歲。(2)未經政府公費收容安置。(3)家庭總收入平均分配全家人口，每人每月金額符合規定者（106年度為30,631元）。 (4)全家人口之存款（含股票投資）之合計限額：單一人口家庭為新臺幣250萬元，每增加一口，得增加新臺幣25萬元。(5)全家人口之土地及房屋價值合計不超過新臺幣876萬元。(6)未入獄服刑、因案羈押或依法拘禁。4.補助內容(106年)：(1)全戶平均每人每月收入在22,207元以下者，每月發給7,463元。達22,208元以上，但未超過30,631元者，每月發給3,731元。 (2)津貼請領人領有榮民院外就養金者，如具本市低收入戶資格，仍得領取本津貼，但每人每月合計領取金額不得超過當年度政府公告之金額(106年度為21,009元)。津貼請領人領有榮民院外就養金者，如未具本市低收入戶資格，仍得領取本津貼，106年度領有院外就養金之榮民如符合中低收入老人生活津貼資格，每月發給2,290元。
- - 中低老人假牙補助的臺北市牙醫師公會所屬醫療院所是指哪些?
