- - 目前臺北市是否有辦理105年「職類別薪資調查」、「受僱員工薪資調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「職類別薪資調查」、「受僱員工薪資調查」係分別由勞動部統計處及行政院主計總處主辦，各縣市政府為協辦機關，負責辦理各該轄區之調查業務。二、職類別薪資調查之調查期間自105年8月1日起至8月31日止，受僱員工薪資調查之調查期間自105年8月至106年7月按月填報。凡從事礦業及土石採取業、製造業、電力及燃氣供應業、用水供應及汙染整治業、營造業、批發及零售業、運輸及倉儲業、住宿及餐飲業、資訊及通訊傳播業、金融及保險業、不動產業、專業科學及技術服務業、支援服務業、補習教育業、醫療保健服務業、藝術娛樂及休閒服務業、其他服務業等之公、民營事業場所單位均為調查對象。三、職類別薪資調查之目的為蒐集各行業及職類別受僱員工人數、薪資水準、廠商規定工作時間、初任人員經常性薪資給付等資料，供為政府修訂法規、釐訂施政計畫及業者訂定員工薪資、增進員工福祉等參據。受僱員工薪資調查之目的為了解臺灣地區受僱員工人數、薪資、工時、員工進退情形，供為研訂經建計畫及產業政策之參據。旨揭調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請受訪廠商支持合作，提供正確詳實資料。四、職類別薪資調查結果請逕至勞動部網站（http：//www.mol.gov.tw）「勞動統計專網/統計資料庫查詢」項下查詢。受僱員工薪資調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw） 「政府統計 / 主計總處統計專區 / 薪資及生產力統計 / 統計表 / 受僱員工薪資調查統計」項下查詢。
- - 「2016臺灣烘焙美食展」主辦單位、時間、地點？
  - 主辦單位：台北市糕餅商業同業公會時間：105年7月29日（五）至7月31日（日）每日10：00至18：00地點：台北花博公園爭艷館 (臺北市中山區玉門街1號 ) 參觀資訊：免費入場參觀交通資訊：建議搭乘捷運淡水線至捷運圓山站，下車後從1號出口出站，步行約5分鐘即可到達會場。
- - 「2016臺灣烘焙美食展」活動概述？
  - 活動內容包含2大主題競賽，包括「鳳梨酥大賽」以及「台北甜心繽紛賽」，而每日更安排鳳梨酥、台北甜心等親子DIY體驗活動，說明如下：(一)鳳梨酥大賽：邀請民眾見證冠軍名店，比賽分為「傳統組」及「創意組」，比賽時間為7月29日（五）08：30－12：00，頒獎時間為同日14：00－15：00。（民眾進場參觀時間：10：00－18：00）(二)台北甜心繽紛賽：邀請民眾見證冠軍名店，比賽分為「脆皮餅皮組」、「馬卡龍餅皮組」及「傳統牛軋糖組」，比賽時間為7月29日（五）08：30－12：00，頒獎時間為同日14：00－15：00。（民眾進場參觀時間：10：00－18：00）(三)台北甜心主題館：展示本次2大主題賽優勝作品外，還能欣賞到由知名糕餅店家特別製作的「超巨型台北甜心」，及各式台北甜心產品與積木混搭打造出的童趣版「迷你台北甜心館」糖果點心屋。(四)展示本次「鳳梨酥大賽」、「台北甜心繽紛賽」各前3名作品。(五)全臺烘焙美食名店展售會：邀請維格餅家股份有限公司、湯米烘焙有限公司、法蘭司蛋糕、順成蛋糕、喜之坊、郭元益、丹麥之屋等全臺人氣烘焙美食店家參與。(六)DIY體驗：開放民眾DIY動手做鳳梨酥、台北甜心，體驗時間為7月29日（五）至7月31日（日）10：00－17：00，報名方式及費用請參照第4題。(七)每日來展禮：每日前500名進場參觀者，免費獲得鳳梨酥或台北甜心1顆（隨機發送），發送地點為大展入口處。
- - 「2016臺灣烘焙美食展」各項比賽如何報名？
  - 比賽僅開放參展廠商報名參加，且報名時間已截止，如有疑問請洽台北市糕餅商業同業公會02-2882-5741。
- - 「2016臺灣烘焙美食展」如何查詢相關訊息及索取活動DM
  - (一)活動訊息可至官網（http：//www.fonglisu.tw/）查詢，或電洽台北市糕餅商業同業公會02-2882-5741。(二)活動DM僅限展期現場索取導覽手冊（內含平面圖、主題活動及廠商優惠訊息）。
- - 保母人員為何要辦理登記？那些人需要登記？
  - 1.依兒童及少年福利與權益保障法第26條第1項規定，提供居家式托育服務者，應向直轄市、縣（市）主管機關辦理登記後，始得為之。2.依兒童及少年福利與權益保障法第25條規定，所稱居家式托育服務，指兒童由其三親等內親屬以外之人員，於居家環境中提供收費之托育服務。
- - 保母人員自何時開始要辦理登記？
  - 依兒童及少年福利與權益保障法規定，自103年12月1日起施行辦理執業登記，可檢具相關申請文件向居家托育服務中心申請登記，相關資訊請上社會局網站（網址：http：//www.dosw.tcg.gov.tw /首頁 > 嬰幼兒照顧服務 > 居家式托育服務）查詢。
- - 保母人員於103年12月以後未辦理登記即收托幼兒會有處罰嗎？
  - 依兒童及少年福利與權益保障法第90條規定，如未辦理登記即收托，處新臺幣六千元以上三萬元以下罰鍰，並命其限期改善，屆期仍未改善者，得按次處罰。
- - 那些人可以辦理居家式托育服務者（保母）登記？資格為何？
  - 居家式托育服務者（保母）應年滿20歲並有下列資格之一：1.取得保母人員技術士證。2.高級中等以上學校幼兒保育、家政、護理相關學程、科、系、所畢業。3.修畢保母專業訓練課程，並領有結業證書。
- - 親屬保母可以申請就業者家庭部分托育費用補助(保母補助)嗎？
  - 可以申請，但必須取得托育人員資格並加入居家托育服務中心(原社區保母系統)。
- - 已申請育兒津貼，要如何知道辦理進度?
  - 育兒津貼受理審查單位為兒童戶籍所在地區公所社會課，可電各區公所社會課育兒津貼承辦人查詢。
- - 每一位托育人員(保母)可收托幾名幼兒？
  - 依居家式托育服務提供者登記及管理辦法第7條規定：托育人員收托人數應符合下列規定之一：1.每一托育人員照顧半日、日間、延長或臨時托育兒童至多四人，其中未滿二歲兒童至多二人。2.每一托育人員照顧全日或夜間托育兒童至多二人。3.每一托育人員照顧全日或夜間托育兒童一人者，得增加收托半日、日間、延長或臨時托育之兒童至多二人，其中未滿二歲兒童至多二人。4.每一托育人員照顧夜間托育二歲以上兒童二人者，得增加收托半日、日間、延長或臨時托育之兒童至多一人。5.二名以上托育人員於同一處所共同照顧兒童至多四人，其中全日或夜間托育兒童至多二人。前項兒童人數，應以托育人員托育服務時間實際照顧兒童數計算，並包括其六歲以下之子女、受其監護及三親等內兒童。二名以上托育人員之托育服務，應就收托之兒童分配主要照顧人。
- - 什麼是居家式托育服務？
  - 居家式托育服務類型分為：1、在宅托育服務：托育人員受兒童之父母、監護人或其他實際照顧之人委託，在托育人員提供托育服務登記處所提供之托育服務。2、到宅托育服務：托育人員受兒童之父母、監護人或其他實際照顧之人委託，至兒童住所或其他指定處所提供之托育服務。
- - 親屬保母托育需要辦理登記嗎？
  - 若親屬保母只托育三等親內的兒童，親屬照顧是不需要辦理申請「居家式托育服務登記證書」的，但仍需至托育所在地區的居家托育服務中心辦理「加入」作業，以申請托育費用補助。若保母欲收托三親等外兒童，成為職業保母，則必須至居家托育服務中心申請「居家式托育服務登記證書」，取得執業登記。
- - 105年儲備駕駛錄取人員名單？
  - 公告於本局網站首頁 > 公告資訊 > 最新消息 > 105年儲備駕駛專區
- - 居家式托育服務登記需要提出申請嗎？何時開始受理？去哪裡申請？
  - 1、居家式托育服務登記採申請制，需要提出申請。2、申請窗口為各行政區承辦的居家托育服務中心，托育人員應向托育地點所在地之居家托育服務中心辦理登記事宜。
- - 居家式托育服務登記書需要檢附什麼資料？
  - 一、提供在宅托育服務應檢附下列文件： 1、居家式托育服務提供者登記申請書。2、最近3個月內健康檢查合格證明正本1份（含結核病胸部X光檢查、A型肝炎抗體(含IgMAnti-HAV及IgG Anti-HAV)檢驗、傷寒檢查）。3、最近3個月內2吋正面脫帽半身照片2張。4、身分證明文件影本。5、保母人員技術士證，高級中等以上學校幼兒保育、家政、護理相關學程、科、系、所畢業證書，或托育人員專業訓練課程結業證書等資格證明文件影本。6、最近3個月內之警察刑事紀錄證明正本1份。7、自我評量後之托育服務環境安全檢核表正本。8、居家式托育服務登記切結書及申請調閱警察刑事紀錄同意書正本。9、服務登記處所共同居住成員之名冊。二、提供到宅托育服務應檢附下列文件：1、居家式托育服務提供者登記申請書。2、最近3個月內健康檢查合格證明正本1份（含結核病胸部X光檢查、A型肝炎抗體(含IgMAnti-HAV及IgG Anti-HAV)檢驗、傷寒檢查）。3、最近3個月內2吋正面脫帽半身照片2張。4、身分證明文件影本。5、保母人員技術士證，高級中等以上學校幼兒保育、家政、護理相關學程、科、系、所畢業證書，或托育人員專業訓練課程結業證書等資格證明文件影本。6、最近3個月內之警察刑事紀錄證明正本1份。
- - 居家式托育服務登記相關書表文件可在那裡索取？
  - 居家式托育服務登記相關書表文件可以向本市各居家托育服務中心(原社區保母系統)索取或至社會局網站（網址：http：//www.dosw.tcg.gov.tw╱首頁 > 嬰幼兒照顧服務 > 居家式托育服務下載相關書表文件。
- - 如何申請察刑事紀錄證明書(良民證) ？
  - 警察刑事紀錄證書申請方式：警察刑事紀錄證書可各直轄市、縣（市）警察局外事科（課）申請，不受戶籍限制。臺北市申請地點：臺北市中正區延平南路96號。電話：(02)2331-3561轉2238或2381-7494、傳真：2387-7487。警察刑事紀錄證明服務時間為週一至週五上午8時30分至下午5時，每週三延長至晚上8時。辦理方式如下：1、郵寄辦理：應檢附文件如下：(1)身分證正本，正本驗畢歸還。(2)申請書1份。(3)100元申請費：可報值郵寄至警察局，或至郵局購買匯票，戶名為臺北市政府警察局。(4)貼有掛號郵資之回郵信封。2、親自辦理：(1)申請書1份。(2)100元申請費(3)應備證明文件：本國人：新式國民身分證正本或戶口名簿正本(持戶口名簿辦理者須另出示有相片之證件)。大陸港澳地區居民：中華民國臺灣地區居留證或內政部入出國及移民署核發之其他相關證件正本。外國人：護照或外僑居留證正本各1份。正本驗畢歸還，需加註英文姓名者，請另檢附護照基本資料頁正本或影本。3、可傳真申辦及網路申請辦理，惟核准後皆須至現場領件。
- - 如果警察刑事紀錄證明書(良民證)載有前科紀錄，可以辦理登記事宜嗎？
  - 依居家式托育服務提供者登記及管理辦法第9條規定，有下列情事之一者，不得擔任居家托育服務人員：1、曾有性侵害、性騷擾行為，經有罪判決確定。2、曾犯毒品危害防制條例之罪，經有罪判決確定。3、有兒童及少年福利與權益保障法第四十九條各款所定行為之一，經有關機關查證屬實。4、行為違法或不當，其情節影響收托兒童權益重大，經主管機關查證屬實。5、罹患精神疾病或身心狀況違常，經直轄市、縣(市)主管機關委請相關專科醫師二人以上諮詢後，認定不能執行業務。依此，如果警察刑事紀錄證明書(良民證)載有前科紀錄，托育人員可檢具相關判決資料及填具個案審查紀錄表送社會局個案審查。
- - 居家式托育服務登記書有期限嗎？多久要換證？換證程序為何？
  - 1.依居家式托育服務提供者登記及管理辦法第14條規定，服務登記證書有效期間為六年。2.於居家登記證書有效期間屆滿前三個月內，向居家托育服務中心(原社區保母系統)申請換證。3.在宅托育人員應檢具下列文件申請換證事宜：(1)居家式托育服務提供者登記申請書。(2)最近3個月內健康檢查合格證明正本1份（含結核病胸部X光檢查、A型肝炎抗體(含IgMAnti-HAV及IgG Anti-HAV)檢驗、傷寒檢查）。(3)最近3個月內2吋正面脫帽半身照片2張。(4)身分證明文件影本。(5)保母人員技術士證，高級中等以上學校幼兒保育、家政、護理相關學程、科、系、　所畢業證書，或托育人員專業訓練課程結業證書等資格證明文件影本。(6)最近3個月內之警察刑事紀錄證明正本1份。(7)自我評量後之托育服務環境安全檢核表正本。(8)居家式托育服務登記切結書及申請調閱警察刑事紀錄同意書正本。(9)服務登記處所共同居住成員之名冊4.到宅托育人員應檢具下列文件申請換證事宜：(1)居家式托育服務提供者登記申請書。(2)最近3個月內健康檢查合格證明正本1份（含結核病胸部X光檢查、A型肝炎抗體(含IgMAnti-HAV及IgG Anti-HAV)檢驗、傷寒檢查）。(3)最近3個月內2吋正面脫帽半身照片2張。(4)身分證明文件影本。(5)保母人員技術士證，高級中等以上學校幼兒保育、家政、護理相關學程、科、系、　所畢業證書，或托育人員專業訓練課程結業證書等資格證明文件影本。(6)最近3個月內之警察刑事紀錄證明正本1份。5.托育人員除檢附以上申請文件外，需再應檢具有效期間內完成每年至少接受18小時之在職訓練(每2年應包括8小時以上之基本救命術)，6年共計108小時在職教育訓練證明。
- - 如何選擇好保母?
  - 一、「動腦」擬定送托計畫：建議在幼兒送托前兩三個月，即開始找尋保母，並針對送托時段、距離、預算上限、對保母的期待、希望保母的收托人數上限等，與其他家人溝通。二、「動口」進行電話溝通：　選擇幾位符合需求的保母，進行電話溝通，確認保母收托人數、收費、時段配合等。三、「用眼」仔細觀察：針對2至3位條件最接近期待的保母進一步約定面訪時間，實地了解保母居家環境、保母本身條件、家庭概況、保母托育狀況等。四、「動手」擬定書面合約：決定送托保母後，是家長與保母分工合作的開始，記得將彼此權利義務經過雙方確實的討論後，具體記錄下來，並簽訂書面契約。五、家長如有托育需求可至衛生福利部社會及家庭署托育人員登記管理資訊系統(http：//cwisweb.sfaa.gov.tw/)或本局網站(http：//www.dosw.gov.taipei/)查詢相關托育資訊。
- - 如何考保母人員技術士證？洽辦單位為何？
  - 一、取得保母人員技術士證的方式如下：1.需檢視學歷是否符合報考保母人員技術士證，如符合即可購買簡章報考。2.如學歷不符報考資格，即應參加社政主管機關核可辦理之126小時托育(保母)人員專業課程，結業後即可報考。3.托育(保母)人員專業課程，各縣市政府每年度委託或經勞動部勞動力發展署核定開課之大專院校或團體辦理。二、保母人員技術士證考係為國家考試、主辦單位為勞動部，請洽勞動部勞動力發展署技能檢定中心，連絡電話：04-22595700。
