- - 請問我怎麼知道停靠車站在哪裡？要等多久才有車？
  - 1.可藉由臺北市5284網頁選取「台北觀光巴士紅線」、「台北觀光巴士藍線」，網址2.http：//5284.taipei.gov.tw/Dybus.aspx#或下載「臺北好行」APP得知車輛所在位子。3.官網www.taipeisightseeing.com.tw，手機APP（Google Play或Apple Store搜尋〝饗樂趣台北〞）查詢確認。  
- - 「臺北市雙層觀光巴士」座位分配表
  - 上層有47個座位、下層則有9個座位及1個無障礙輪椅停靠區
- - 雙層觀光巴士客滿了，可否像公車一樣有站位?
  - 雙層觀光巴士不設站位，行進中嚴禁站立，並請坐妥繫上安全帶。
- - 通車期間有何優惠？何時截止？每一種票都有優惠嗎？
  - 即日起至小年夜(1月26日)止，在台北車站(忠孝)站上車者，可享「二人同行一人免費」優惠。各類票（4小時票300元、日間票500元、夜間票400元、單日票700元、兩日票1,200元）均可享
- - 優惠名額是否有限制？只限制在台北車站上車嗎？
  - 每日優惠666組、如當日尚有餘額將移到隔天。只限制在臺北車站起站點上車。
- - 搭乘雙層觀光巴士上下車如何驗票？
  - 1.上車購票後，車服人員將交付二張實體票。2.乘客於前門上車將實體票上之條碼（QR Code）對準條碼掃描機，刷過後上車就位，下車時於後門將實體票上之條碼（QR Code）對準條碼掃描機，刷過後下車。3.在各線沿途站點下車後，於所購票別時限內如要再上車，仍需刷實體票上之條碼（QR Code）驗票。
- - 「臺北市雙層觀光巴士」優惠折扣
  - 相關優惠折扣詳如官網及觀光傳播局新聞稿
- - 「臺北市雙層觀光巴士」雨天備案為何?
  - 車上除備有雨衣發放給乘客，更裝設活動式遮雨棚可因應雨天氣候，乘客亦可於下雨時移動至室內空間(上層10位、下層9位)。
- - 請問AQI代表什麼意義呢？
  - AQI(Air Quality Index)「空氣品質指標」就是整合過去空氣污染指標(PSI)及細懸浮微粒(PM2.5)指標。為使民眾易於掌握空氣品質狀況，並暸解其對健康之影響程度，由空氣品質監測站之空氣污染物濃度監測結果換算而得AQI值。 AQI值0-50代表空氣品質良好(綠色)、51-100為普通(黃色)、101-150為對敏感族群不良(橘色)、151-200為對所有族群不良(紅色)、201-300為非常不良(紫色)、301-500為有害(褐紅)。
- - 當年度職工福利金使用如未達經常性收入60％，是否即需課稅？有無例外情形可免稅？
  - 職福金如有特定用途及計畫需長期累積者，致使當年度支出未達經常性收入百分之60，應於事前擬具運用結餘經費具體計畫書及年度經費收支決算表，提委員會議通過後送勞動局審核，並轉財政部同意在案，嗣後並應於計畫年度內逐年於年度結束後檢附證明文件及申明理由，由本局核定後轉財政部同意，方可免受「教育、文化、公益、慈善機關或團體免納所得稅適用標準」第二條第一項第八款之限制。聯絡科室：勞資關係科 陳瑟瑩聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7010、7011
- - 職工福利金得否以工作年資作為職工福利措施之發放標準？
  - 職工福利委員會瓣理各項福利措施，應本公平、普及原則辦理，不得以年資作為發放資格之條件。聯絡科室：勞資關係科 陳瑟瑩聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7010、7011
- - 職工福利委員會旅遊福利措施疑義？
  - 職工福利委員會補助旅遊經費，仍以團體為準，不得個別補助。至於事業單位為免影響公司正常營業運作，而以分梯次、部門（廠場）或職工自行組團方式辦理者，其最低組團人數及補助經費得由職工福利委員會衡酌全體職工實際需要及經費狀況自行決定。聯絡科室：勞資關係科 陳瑟瑩聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7010、7011
- - 尾牙聚餐費用可動支職工福利金嗎？
  - 事業單位歲末尾牙宴請全體員工聚餐，係屬事業主慰勞員工ㄧ年來之辛勞所舉辦之活動，非ㄧ般由職工福利委員會主辦之聚餐活動，故尾牙聚餐費用自不宜動支職工福利金。聯絡科室：勞資關係科 陳瑟瑩聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7010、7011
- - 事業單位若欲訂定工作規則，勞動局是否有提供相關範例供參？
  - 在本局的網站上提供有工作規則範例供事業單位參考，事業單位可自行下載使用，請上網連結至本局網頁http：//bola.gov.taipei/業務服務╱企業服務╱工作規則╱申辦服務╱工作規則申報╱檔案下載╱工作規則參考手冊。聯絡科室：勞資關係科工作規則承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7013、7031、7033
- - 事業單位欲報備勞資會議勞資代表，勞動局是否有相關表單可供使用？
  - 本局的網站上提供事業單位報備勞資會議勞資代表相關表單(含申請函)，事業單位可自行下載使用，請上網連結至本局網頁http：//bola.gov.taipei/業務服務/企業服務/勞資會議/申辦服務/勞資會議代表申報/檔案下載/書證表單。聯絡科室：勞資關係科勞資會議承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7013、7031、7033
- - 如何變更勞工退休準備金監督委員會雇主、主任委員、副主任委員、勞資雙方委員、地址、單位名稱、提撥率，或欲申請暫停提撥、修訂優惠退休辦法、增訂通訊地址等？
  - 若事業單位勞工退休準備金監督委員會有變更雇主、主任委員、副主任委員、勞資雙方委員、地址、單位名稱、提撥率，或欲申請暫停提撥、修訂優惠退休辦法、增訂通訊地址等者，均需報請本局核備。申請流程及表格文件，請上網連結至臺北市民e點通╲勞工類╲勞動局╲企業服務╲勞工退休準備金報備變更事項。聯絡科室：勞資關係科 陳怡潔、洪錦雀、徐英傑、侯又甄聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉3296、3307、3331、3354、6048
- - 時薪制人員於春節期間出勤工作，工資應如何發給？
  - 時薪制人員自106年1月1日起基本工資已調漲為時薪133元，所以時薪人員如於春節期間（農曆除夕至正月初三）出勤，雇主應加倍發給工資，即時薪至少為266元（133元×2）以上，方符合規定。聯絡科室：勞動基準科承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7015-7018、3325、3327
- - 申請兒童臨時托育補助之資格
  - 設籍本市0-12歲之兒童，且符合以下資格之ㄧ者：一、本市列冊低收入戶。二、本市列冊中低收入戶。三、父母一方為原住民。四、父母一方為中度以上身心障礙者。五、家中同住兄弟姊妹之一持有本市身心障礙手冊或申請日起一年內之醫院發展遲緩證明。六、符合特殊境遇家庭扶助條例第四條第一項第一款至第三款、第五款及第六款規定者，其未滿6歲之子女或孫子女（簡稱特境家庭子女）。七、單親家庭。八、雙（多）胞胎。九、父母一方因非自願性失業且須謀職者。十、其他經臺北市家庭暴力暨性侵害防治中心、本局社會福利服務中心、婦女福利服務中心或接受本局委託辦理之福利機構、方案之單位轉介有臨托補助需求之家庭，並經本局核定身分者。
- - 我要索取家暴或性侵害宣導品或宣導影片
  - 若有需索取家暴或性侵害宣導品或宣導影片，可撥打本中心電話(02)2361-5295，請您聽到總機語音後，轉撥(按)分機6808，將由陳小姐為您服務。
- - 請問家庭暴力防治法第63條之1增訂後，對一般民眾的影響為何？
  - 家庭暴力防治法第63條之1於104年增訂後，於105年2月4日正式施行，有關16歲以上未同居之親密關係暴力將亦得準用保護令相關保護措施。此次修正，對一般大眾影響在於，使得未有同居關係者，亦即一般情侶無論異性或同性之間，只要雙方是以情感或性行為為基礎，發展親密之社會互動關係，於遭到對方不法侵害時，就可以依家庭暴力防治法向法院聲請保護令。若有需聲請保護令可直接撥打113、110或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。亦可於上班時間直接到地方法院家暴及家事聯合服務中心聲請保護令。
- - 若遭受配偶、同居人暴力，該怎麼辦？
  - 若遭受配偶、同居人暴力，可撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。本中心亦有結合民間社福團體資源，提供設籍或居住本市遭受親密關係暴力被害人及其子女或家人服務，以協助降低受暴危機，提昇家庭功能。承辦單位：1.台北基督教女青年會（中正區、萬華區、松山區）連絡電話：(02)7734-0001 。2.台北市婦女救援社會福利事業基金會（士林區、北投區）連絡電話：(02)2555-5595 。3.台北市現代婦女基金會（大安區、文山區）連絡電話：(02)2391-7133 。4.中華民國新女性聯合會（大同區、中山區、內湖區、南港區）連絡電話：(02)2377-3621 。
- - 如未成年之兒童、少年、身心障礙少年或無父母、父母失聯之兒童少年(含迷童棄嬰、父母死亡、入獄等無依兒童少年)需收容安置者，請問如何處理？
  - 若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。
- - 保母或安置機構照顧之兒童少年發生意外傷害或死亡事件，請問該如何處理？
  - 若有需通報或諮詢服務，可直接撥打113或本中心24小時服務電話(02)2361-5295轉分機226，由專人提供協助。同時，亦可透過衛生福利部設置「關懷e起來」網站http：//ecare.mohw.gov.tw/進行通報。若遇到危及人身安全緊急事件，可撥打110報案專線，由警方立即前往救援。
- - 臺北市政府婦女中途之家(原稱慧心家園)住戶於假日發生緊急安全事故、肢體暴力、自殺、須緊急送醫
  - 住戶於假日發生緊急安全事故、肢體暴力請聯繫110或113，自殺、須緊急送醫情形請聯繫119。若有其他疑問可於家園內向住戶自治委員會主任委員、副主任委員反應，或婦女中途之家社工人員，洽詢電話：2701-1828。
- - 公部門之工友(含技工、駕駛)特別休假天數如何計算？
  - 依行政院105年12月30日院授人綜字第1060034202號函規定以，有關工友休假日數之計算，連續服務6個月以上未滿1年者，給休假3日；2年以上未滿3年者，給休假10日；5年以上未滿6年者，給休假15日。其餘核給休假日數及其計算方式，比照公務人員請假規則第7條及其相關規定辦理。(權責機關本府勞動局及人事處)
- - 我在國外遭受動物咬傷後，但未能完成所有疫苗接種流程，要如何在回國後再成接種？
  - 持國外遭動物咬傷就醫之診斷證明書、狂犬病疫苗接種紀錄及護照，至狂犬病疫苗儲備醫院就醫(狂犬病疫苗儲備醫院名單如附件)，經醫師評估後，免費提供再預防接種之需。(狂犬病疫苗儲備醫院名單資訊請至疾病管制署全球資訊網http：//www.cdc.gov.tw/；首頁>傳染病介紹> 傳染病介紹，下載瀏覽)
- - 申請居家服務資格條件為何?
  - 居住於本市之「65歲以上老人」、「50歲以上失智者」或「50歲以上(含)之身心障礙者」，經本市照顧管理中心評估可獲得居家服務補助者。  
- - 居家服務申請窗口為何?
  - 電洽臺北市照顧管理中心(02-27208889轉5880)及4區服務站申請。1、北區服務站(士林、北投)：02-289747962、東/南區服務站(松山、大安、文山、南港、內湖、信義)：02-270491143、中區服務站(中山、大同)：02-255279454、西區服務站(中正、萬華)：02-23753323 
- - 居家服務申請補助標準
  - 經照顧管理中心評估核定，每月最高補助輕度25小時、中度50小時、重度90小時，於補助時數內本市居家服務補助標準為：1.低收入戶、中低收入戶、領取中低老人生活津貼7,463元者：政府每小時補助250元，民眾免部分負擔。2.領取中低收入老人生活津貼3,731元者、領取非列冊低收入身心障礙者生活補助者：政府每小時補助230元，民眾部分負擔20元。3.一般戶：政府每小時補助190元，民眾部分負擔60元。
- - 申請長者預防走失手鍊需檢附的資料？
  - 1. 智能障礙、精神障礙、自閉症或失智症之身心障礙手冊(證明)、醫師診斷證明書或失蹤查尋人口登記聯單2. 申請書
- - 長者預防走失手鍊向哪個單位申請？
  - 請備齊下述應備文件寄至中華民國老人福利推動聯盟(地址：臺北市民權西路79號3樓之2)。(1)身心障礙手冊(證明)、醫師診斷證明書或失蹤查尋人口登記聯單(2) 申請書
- - 長者預防走失手鍊補助標準為何？
  - 符合申請資格者，由政府全額補助手鍊製作工本費200元及檔案管理費每年500元。
- - 申請長者預防走失手鍊服務資格
  - 年滿65歲有走失之虞 (註)，設籍並實際居住於本市之長者。註：走失之虞係指領有智能障礙、精神障礙、自閉症、失智症之身心障礙證明、手冊、醫師診斷證明書或曾失蹤有查尋人口登記聯單者
- - 老人日間照顧服務要怎麼申請?
  - 電洽或親至臺北市照顧管理中心(02-27208889轉5880)及4區服務站申請。1、北區服務站(士林、北投)：02-289747962、東/南區服務站(松山、大安、文山、南港、內湖、信義)：02-270491143、中區服務站(中山、大同)：02-255279454、西區服務站(中正、萬華)：02-23753323
- - 申請中度、重度失能長者交通接送服務資格為何？
  - 服務對象為設籍並實際居住本市，依本市照顧管理中心各區服務站照顧管理專員到宅評估為中度、重度失能者：一、65歲以上老人。二、50歲至64歲之身心障礙者。
- - 禁菸範圍不清楚，沒劃線，如有爭議之認定?
  - 如有執法取締爭議，將請臺北市公車亭主管機關臺北市公共運輸處釐清禁菸範圍，以作為本局裁處之參考依據。
- - 中度、重度失能長者交通接送服務申請方式為何？
  - 申請者逕向臺北市長期照顧管理中心各區服務站辦理，經照顧管理專員評估後符合中度、重度失能者，由照顧管理中心發核定函表。
- - 長者預防走失手鍊服務內容
  - 提供長者一條記載個案編號及24小時監控中心聯絡電話之防鏽金屬材質手鍊，該監控中心可透過手鍊上所載之編號確認走失市民身分，並協助其聯繫家屬。
- - 失能老人營養餐飲服務可洽辦單位為何?
  - 有需求者請洽本市照顧管理中心申請，經照顧管理專員評估有失能且有送餐需求之長者，由照顧管理中心轉介送餐服務單位提供送餐到宅服務（市民熱線電話1999轉5880)。
- - 請問承租的辦公室若是與他人分租，這樣的地點還可以申請租金補貼嗎?
  - 若同一門牌號碼有兩家公司登記在內的話，該門牌號碼是不可以分請租金補貼的喔!
- - 臺北市105年12月26日起新增公告多少學校周邊無菸人行道?違規吸菸者罰鍰？
  - 為維護校園師生、家長及民眾健康權益，建構戶外無菸環境，本局依據菸害防制法第15條第1項第13款規定，新增公告臺北市政府教育局所轄31所私立高級中等學校以下學校周邊人行道，自105年12月26日起為全面禁止吸菸場所。違規吸菸民眾，依該法第31條第1項規定，處新臺幣2,000元至1萬元罰鍰。禁菸公告詳細資訊可至臺北市政府衛生局外網(http：//health.gov.taipei/)或「無菸健康網」(http：//subweb.health.gov.tw/Nosmoking/)查詢。
- - 臺北市公車候車亭何時開始禁菸？違規吸菸者罰鍰？
  - 為維護民眾健康權益，建構戶外無菸環境，本局依菸害防制法第15條第1項第13款規定，新增公告臺北市932個公車站之1,150座公車候車亭，自106年1月1日起為全面禁止菸吸場所，106年1月至2月為宣導期，自106年3月1日開始稽查取締。違規吸菸民眾，依該法第31條第1項規定，處新臺幣2,000元至1萬元罰鍰。禁菸公告詳細資訊可至臺北市政府衛生局外網(http：//health.gov.taipei/)或「無菸健康網」(http：//subweb.health.gov.tw /Nosmoking/)查詢。
- - 公車候車亭禁菸的範圍為何？
  - 公車候車亭禁菸範圍為候車亭之垂直投影面積。
- - 「臺北市補助工商團體及廠商海外參展計畫」之目的為何？
  - 為鼓勵臺北市廠商積極參與國際展售活動，本局自102年起補助本市工商團體及廠商海外參展費用，協助廠商拓展對外貿易商機，爭取海外訂單。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」之申請資格為何？
  - 一、依工業團體法、商業團體法及其他相關法令登記於本市之工商團體；工商團體組團參展，參展廠商須至少三家為依公司法或商業登記法於本市完成登記之公司或商業。二、依公司法或商業登記法於本市完成登記之公司或商業。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」之可補助金額？
  - 一、工商團體組團參展，每年度以申請二項展覽為限；單一展覽每一本市參展廠商最高補助新臺幣八萬元，最高總補助金額新臺幣八十萬元。二、個別廠商參展，每年度以申請一項展覽為限；單一展覽每一廠商最高補助新臺幣六萬元。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，受補助單位如參加本局優予補助之重要國展覽，其獎勵方式為何？
  - 一、為推動本市產業發展，參與國際重要展覽(依本局公告)可優予補助。二、本局公告之重要國際展覽，包括2017世界行動通訊展、嵌入式電子與工業電腦應用展、2017德國漢諾威數位科技展、2017柏林消費性電子展、GITEX杜拜電子展、德國杜塞道夫醫療展、北美生技展、2017日本製藥原料展、2017德國漢諾威生物科技暨前瞻實驗室設備展、2017日本國際醫藥原料展、法國坎城影視節目展、美國影音設備展、美國拉斯維加斯授權展、日本東京國際動漫展、遊戲開發者大會2017、2017國際綠色能源展覽會、2017年美國太陽光電展、2017年德國太陽光電展、歐洲光伏太陽能能源會議和展覽、米蘭國際家具展、巴黎家具傢飾展、東京設計師週、柏林國際工藝展、歐洲國際工業自動化暨工具展覽會、美國最大工業組裝暨工具展、2017德國漢諾威工具機展、2017日本機器人展等27個展覽。三、工商團體組團參展，單一展覽每一本市參展廠商最高補助新臺幣十萬元，最高總補助金額新臺幣一百萬元。四、個別廠商參展，單一展覽每一廠商最高補助新臺幣八萬元。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，針對受貿易自由化影響產業之輔導措施為何？
  - 一、為協助受貿易自由化影響產業擴大海外市場，依規定申請之工商團體，組團參展廠商須至少二家為本市中小企業，其參展產品或服務屬經濟部審議認定受貿易自由化影響之產業，經審查通過者，依核予補助之金額加碼百分之十。但不得超過最高補助金額上限。依規定申請之中小企業(個別廠商參展)，其參展產品或服務屬經濟部審議認定受貿易自由化影響之產業，經審查通過者，依核予補助之金額加碼百分之十。但不得超過最高補助金額上限。二、經經濟部審議認定受貿易自由化影響之產業，適用對象：1.製造業：成衣、內衣、毛衣、泳裝、毛巾、寢具、織襪、鞋類、袋包箱、家電、石材、陶瓷、木竹製品、布窗簾、農藥、環境用藥、動物用藥、紡織帽、圍巾、傘類、紡織手套、紡織護具。以上產業之申請單位需設立工廠，惟工廠登記地點不限於本市。2.服務業：包括印刷、中藥批發、美容美髮、洗衣。3.上述適用對象得視貿易自由化推動進度或經濟部公告，及本市產業發展需求隨時調整。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」之補助款如何分配？
  - 工商團體組團參展者，應將五成以上補助款用於本市參展廠商，核銷時應檢附本市廠商獲補助款之領據或收據憑核。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」之可申請補助項目為何？
  - 本計畫補助款經費限用於場地租金、場地佈置費、文宣廣告費及運費等支出項目。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」之受理申請期間？
  - 本計畫受理申請期間為106年2月17日至3月17日止。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」之可補助展覽期間？
  - 本計畫可申請補助之展覽期間為106年2月18日至12月31日。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，受補助單位如須辦理計畫變更，應檢附文件為何？
  - (一) 經本局審查核定之參展計畫，如發生展覽期間變動、展覽取消、參展名稱或地點變更、改參加其他展覽等事項，受補助之工商團體及個別廠商應於參展十五日前，檢附下列文件報請本局同意：1.變更申請書。2.變更計畫書對照表。3.變更參展經費預算表。(二) 前項文件請依順序排列，並於計畫書左側以上下裝訂兩針。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，可否重複向其他機關申請補助參展經費？
  - 一、工商團體組團參展，其帶領之廠商，不得再以個別廠商參展資格申請同一展覽之補助。二、同一展覽項目已獲其他政府機關補助者，不得重複申請補助。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，受理申請應備文件為何？
  - 一、申請單位應於受理申請期間內，檢附下列文件各一份，向本局提出申請：1.申請書。2.計畫書(含組團參展廠商名冊)。3.經費預算表(僅限定填列本計畫補助核銷之經費項目)。4.申請單位如欲申請因應貿易自由化加碼補助方案，應檢附「因應推動貿易自由化加碼10%補助」專案申請書（含生產或銷售相關產品或服務證明文件）。 二、工商團體組團參展，須檢附主管機關許可設立證明影本。三、個別廠商參展，免附組團參展廠商名冊。四、文件請依順序排列，並於申請書等資料左側以上下裝訂兩針。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，核銷撥款應備文件為何？
  - 一、受補助單位應於參展活動結束後二個月內(若於本局核定補助前即已參展者，應於核准函送達日起二個月內)，檢附下列文件各一份，向本局辦理核銷，屆期未辦理核銷者，不予撥款。1.請領申請書。2.成果報告書（含活動內容與過程紀錄、呈現整體參展形象照片或圖示、參展活動照片、組團參展廠商名冊）及電子檔。3.經費支出明細表。4.支出原始憑證（含填寫支出憑證清冊、黏貼憑證表及支出機關分攤表；單據抬頭之名稱需與受補助單位名稱相同）。5.領據。6.撥入帳戶之存摺影本。二、 前項領據及撥入帳戶之存摺影本，依受補助對象應檢附資料分述如下：1.工商團體組團參展，應檢附工商團體之領據、本市參展廠商獲補助款之領據或收據及工商團體撥入帳戶之存摺影本。2.個別廠商參展，應檢附個別廠商獲補助款之領據及個別廠商撥入帳戶之存摺影本。三、 受補助單位參加之展覽係於當年度11月5日以後結束者，最遲應於年度終了後五日內向本局辦理核銷，屆期未辦理核銷者，不予撥款。四、參展活動照片請提供電子檔光碟1份；文件請依順序排列，並於請領申請書等資料左側以上下裝訂兩針。五、個別廠商參展者，免附呈現整體參展形象及組團參展廠商名冊。六、以上文件如為影本，需加蓋申請單位及負責人章，並註明「與正本相符」。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，核銷撥款經費結算若須換算匯率但無銀行水單證明，該如何處理？
  - 受補助項目之經費結算若需換算匯率無銀行水單證明者，則依展覽活動前一日（如逢假日往前順推）臺灣銀行即期賣出參考匯率為依據辦理報支。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，受補助單位海外參展時，本府識別標誌應如何揭示？
  - 工商團體組團參展，其帶領之本市廠商，及個別廠商赴國外參加展覽時，應於攤位明顯處揭示本府識別標誌，並拍照以供核銷。標誌大小至少須A4尺寸以上，需固定於明顯位置(請勿浮貼或由人員手執)，並注意美觀。另拍照時，需包含展場活動現況、本市廠商攤位招牌(含本府識別標誌、廠商中文或英文名稱)及呈現攤位使用情況之照片。產業發展局聯絡人：陳小姐、鄭先生；電話：1999(外縣市02-27208889)轉1429、6576委託執行單位財團法人關懷中小企業基金會：文小姐、鄭小姐；電話：(02)2365-7095
- - 「臺北市補助工商團體及廠商海外參展計畫」，受補助單位如未於展場揭示本府識別標誌，該如何處理？
