  - 基於支持青少年多元發展，本處提供以下場地租借優惠：8樓小型練習室(鼓房1、鼓房2、綜合練習1、綜合練習2)、綜合教室(1、2)：1、優惠對象：12歲至24歲之青少年。2、預約前請先電洽詢問場地租借情況，或至本處網站「青少年免費場地預約」專區預約，經本處 同意得免徵場地使用費及保證金。3、使用當日需攜帶學生證或身分證等相關證明文件，至本處1樓服務臺填寫申請表辦理報到及查驗證件。(單位：場館營運課、聯絡人：莊珮嘉、連絡電話：2351-4078分機1113)
- - 106年度淘汰二行程機車換購及新購電動二輪車補助作業 Q&A
  - Q1：請問淘汰二行程機車換購電動二輪車補助金額為多少？A1：目前臺北市政府環境保護局（以下簡稱本局）針對該計畫補助電動二輪車補助方式如下：一、淘汰二行程機車換購電動二輪車(750個名額)1.電動機車重型每輛補助1萬7,000元（環保署補助7,000元，本局補助10,000元）。2.電動機車輕型、小型輕型每輛補助1萬3,000元（環保署補助5,000元，本局補助8,000元）3.電動自行車每輛補助補助1萬元（環保署補助5,000元，本局補助5,000元）4.電動輔助自行車每輛補助補助1萬元（環保署補助5,000元，本局補助5,000元）二、新購電動二輪車(2,250個名額)1.電動機車重型每輛補助6,000元（環保署補助4,000元，本局補助2,000元）。2.電動機車輕型、小型輕型每輛補助4,000元（環保署補助2,000元，本局補助2,000元）3.電動自行車每輛補助補助4,000（環保署補助2,000元，本局補助2,000元）4.電動輔助自行車每輛補助補助4,000（環保署補助2,000元，本局補助2,000元）Q2：二行程機車汰舊換新購電動二輪車申請資格為何?A2：一、補助對象以臺北市民或設立於臺北市之公司行號，且應符合下列各款條件者：（一）二行程機車於92年12月31日（含）以前出廠並於106年1月1日起至106年12月31日前完成報廢或回收，且車籍登記於臺北市需達6個月(含)以上（以報廢或回收日回溯起算）者。（二）於106年1月1日至106年12月31日（含）前由認可的機動車輛回收商回收車體或向監理單位完成二行程機車報廢手續，且新購電動機車、並完成車籍登記者，該二行程機車及電動機車的車籍皆必須登記於臺北市。（三）二行程機車於辦理報廢或回收之當年度或前二年度須有機車排氣檢驗紀錄（檢驗不合格亦可辦理）。（四）本計畫補助購買之電動機車係指已通過經濟部工業局認證補助之電動機車。二、汰舊二行程機車車主與新購入可掛牌之電動機車車主不為同一人亦可，但汰舊1車則以補助1車為限，每人僅限補助1輛，另如以前年度曾經獲得環保署補助或本局補助之個人，即無法再於今年度提出補助申請。；法人亦以汰舊1車則補助1車為限，但如有汰舊兩車以上並購買兩台電動機車（含）以上之需求，應先以書面向本局說明所購車輛用途，並經核准後，再行申請補助。三、公務機關、公立學校及公營事業等公務單位則不列入補助對象，惟在前述單位服務任職之員工，仍得以個人名義申請補助，另公務人員使用國民旅遊卡購買電動二輪車並申請本補助者，應簽署切結並未重複申請休假補助。Q3：何種電動二輪車可領取補助？如何辨別？A3：本計畫補助購買之電動二輪車係指已通過經濟部工業局認證之電動機車、環保署認可之電動自行車及電動輔助自行車，查詢網址：http：//www.lev.org.tw/subsidy/subsidyCar.aspx以及http：//mobile.epa.gov.tw/LowPoll/index.aspx。Q4：申請補助期限為何?A4：申請補助者應於107年1月10日（含）以前提出申請（以郵戳日期為準），並需於106年12月31日（含）前完成新車購入，如購買電動機車(非指電動自行車、電動輔助自行車)者，須於106年12月31日（含）前完成登記掛牌手續(以監理單位登記日期為準)，逾期或額滿即不予受理。Q5：申請表單及相關補助規定可於何處下載？A5：可上本局專屬網頁下載，網址為：http：//www.dep-mobile.gov.taipei/Q6：審核結果如何通知申請人？申請文件正本是否退還申請人？A6：申請人欲查詢補助進度或任何補助事項，可撥打諮詢專線電話：(02)27208889轉7246或7247。審核通過者會另函通知，但申請資料不予退還。審核未通過者，本局也會發函通知申請人，並將申請資料退還。Q7：哪些人不能申請補助款?A7：公務機關、公立學校及公營事業等公務單位及非本國人者，不列入補助對象，惟在前述單位服務任職之員工，仍得以個人名義申請補助。
