  - 新接水用戶，依本處新設規定辦理。惟用戶用水設備內線工程設計圖應納入智慧水表設計，前述設計圖新建物請洽本處辦理，既有建物請洽本處所屬營業處所辦理。原用戶(已有水表)，請攜帶水費單與身分證向所在地本處所屬營業處所申辦，經審查符合規定並繳付應繳費用後，辦理安裝智慧水表。
- - 特殊境遇家庭扶助之扶助對象中，何謂「祖父母扶養18歲以下父母無力扶養之孫子女」？
  - 「祖父母扶養18歲以下父母無力扶養之孫子女」，所稱父母無力扶養，係指父母均因死亡、非自願失業且未領失業給付、重大傷病、服刑或失蹤等，致無力扶養子女。
