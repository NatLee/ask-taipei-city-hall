- - 至現場需注意之事項
  - 1.進場前先尋找現場配置圖，留意散場動線，了解晚會現場各項設施相對位置。-散場公車路線有3條：往「捷運臺北車站」、往「捷運公館站」及往「木柵、景美地區」。-捷運24小時不收班。2.先與朋友會合後再前往現場，進場前先講好散場或萬一走散時的集合時間與地點。3.搭乘大眾交通工具前往與離開。4.捷運市政府站、台北101/世貿站與國父紀念館站在散場時人潮擁擠，走到較遠距離的捷運站或公車轉運站能較快搭上車。5.穿著輕便保暖的衣物。6.吃飽再到現場。7.因人潮眾多，晚上10點以後手機很難撥通。8.注意隨身物品。9.活動由市府主辦，民眾可免費前往參加。10.在活動現場若遇有緊急狀況，可以到就近的服務台、醫護站、或是請跨年活動的現場工作人員協助與幫忙。醫護站上方有大型空飄氣球，有十字圖樣，緊急時請抬頭尋找，並可利用廣場中央佈設的安全通道抵達最近的醫護站。                                                                  11.不一定要到舞台前人擠人，可在市府東側廣場、國父紀念館噴水池西側廣場、市府東南街舞廣場、信義威秀徒步區等觀賞大螢幕，與現場一樣High。12.活動其他相關資訊大家可以上活動官網(http：//2017.newyear.taipei/)、臺北旅遊網(http：//www.travel.taipei/)及臉書(https：//www.facebook.com/taipeitravel/)洽詢!
