- - 2016台北河岸音樂季-「8/6大稻埕情人日」現場有什麼趣味活動與節目?
  - (一)從下午3點開始在大稻埕碼頭延平河濱公園3-5號水門間有舒喜巷與在地商家的文創市集、輕食攤位，歡迎民眾可以順遊大稻埕後，來河岸欣賞風光逛市集。(二)預計於晚間8點進行煙火施放，以水上煙火將大稻埕佈置成水天一色的美景，還有特別製作別具浪漫元素的花朵造型煙火，伴隨著耳熟能詳的經典情歌，如：「似曾相似」、「愛神」、「熱情的沙漠」、「月亮代表我的心」、「追追追」、「一支小雨傘」與「你是我的花朵」等，以搖滾與電子元素串連起舞曲節奏，讓民眾觀賞絢爛煙火同時可以一起舞動身體，共度過一個浪漫的夏夜。(三)3號與5號水門15時起就有輕食攤位、大稻埕在地商家攤位及公益攤位，4號水門服務台將於15時及17時兩個時段，限量發送瓶中信紙LED燈(每人限領1份，數量有限，送完為止)，請民眾自行攜帶空寶特瓶排隊領取自行DIY。(四)舞台部分下午4點起由DJ Reggae熱鬧開場，接著由董事長樂團，搖滾你的耳朵，再來由陳昇帶來一系列「昇式」情歌，成熟嗓音搭配耳熟能詳的歌曲，讓身體隨夏夜晚風搖擺，接著重頭戲就是民眾最引頸期待的炫爛煙火，將於晚間8點時進行施放(總長約10分鐘)，除了特色煙火要給大家驚喜外，今年也由本活動音樂總監趙家駒及音樂協會理事長朱劍輝共同策劃煙火音樂，讓民眾感受不一樣的情人煙火，民眾可在延平河濱公園及大稻埕碼頭周邊(亦稱延平河濱公園淡水河3-5號水門；3號水門外為市民大道，5號水門外為民生西路)，都可以觀賞浪漫的煙火秀，最後由熱愛大自然與土地的「環保音樂家」馬修•連恩帶來輕柔的音樂展現對這片土地的關愛，也呼籲民眾親近河岸、愛護這片得來不易的美麗。相關活動訊息，歡迎有興趣的民眾至臺北旅遊網查詢(http：//www.travel.taipei/)。
