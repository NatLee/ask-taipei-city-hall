- - 常見的資訊安全攻擊手法有哪些？該如何防範？
  - (一) 根據TWCERT/ CC (Taiwan Computer Emergency Response Team / Coordination Center，台灣電腦網路危機處理暨協調中心)長期追蹤統計，目前網路與電腦系統的攻擊數量與日俱增，且手法亦愈漸複雜，可能形成的危害不容小覷。以下列舉常見的資訊安全攻擊手法：1、惡意程式攻擊泛指利用不懷好意的程式，例如電腦病毒、蠕蟲、特洛伊木馬或垃圾郵件等，透過網路等媒介進行傳遞、感染，以達到資料竊取或破壞個人電腦等目的。2、利用漏洞入侵所謂「漏洞」是指軟體開發者在撰寫程式或進行系統設計時，因規劃或設定不當，所形成的資訊安全風險，使得攻擊者得藉以利用其從事惡意行為。3、社交工程(Social Engineering)所謂社交工程，是利用人性方面的各項特性如好奇心、同情心等心理狀態，並利用各種手段讓使用者「信任」來進行一種類似「詐欺」的攻擊行為，凡是有牽扯到人類因素的任何攻擊行為，都可稱為社交工程。(二) 為有效防範資訊安全攻擊行為，使用者應養成良好電腦使用習慣，下述幾項供參：1、安裝防毒軟體於個人電腦安裝防毒軟體，並定期進行完整掃描，可有效防範電腦遭受惡意程式入侵或機敏資料遭有心人士竊取等風險。2、更新作業系統及軟體當作業系統及軟體業者針對已知漏洞發布更新時，使用者應即時下載並更新以修補漏洞，避免遭受攻擊者利用漏洞進行攻擊。3、避免開啟來路不明之電子郵件使用電子信箱時，務必隨時提高警覺，看清楚寄件來源及標題，切勿任意開啟來路不明的電子郵件，以防止社交工程攻擊，而開啟惡意程式或點擊不明連結。
- - 員警取締酒後駕車，經移置之汽車當事人如何辦理領回?
  - (一)領車時需有1人領有適當駕照者前來，駕駛領回之汽車離開保管場。(因當事人違反道路交通處罰條例規定遭吊扣駕照，不得駕駛任何車輛)。(二)車主領車時應攜帶下列證(文)件之正本： 1、身分證(需出示正本)。 2、車輛行照。 3、繳納罰款收據(依公共危險罪移送法院者-免付)：其分期繳納案件，應全部繳完始可領車，惟初犯者於繳納第一期款項後即可領回。 4、應繳納之移置費及保管費。 5、繳回「移置保管車輛通知單」第一聯(收執聯)。(三)車主若委託他人代領時，代理人除應攜帶上列證(文)件外，應並附下列證(文)件： 1、酒後駕車代保管車輛領回授權委託書1份(車主應親自簽名及蓋指印、私章)。 2、車主身分證(需出示正本)。 3、受委託人(即領車人)之身分證明文件正本。 4、車主如為公司、行、商號，應附該行商號之營利事業登記證正本，委託書應加蓋公司大、小章。
- - 承租人（即房客）因其承租之房屋為違建，而應拆除時，救濟途徑有哪些？
  - 承租人之救濟途徑有三：一、向本市各區公所之調解委員會聲請調解。二、向地方法院民事庭提起民事訴訟。三、向本府消費者服務中心提起消費申訴。承租人得以下列方式之一辦理申訴：  至申訴網址：http：//www.cpc.ey.gov.tw/，於上方點選「線上申訴調解」之「線上申請」，並瀏覽相關說明後，採線上申訴方式辦理。  下載表格填妥後傳真或郵寄至臺北市政府消費者服務中心。親洽臺北市政府消費者服務中心辦理。
- - 承租人（即房客）因其承租之房屋為違建，而應拆除時，得否終止租約？終止租約時，承租人得請求出租人（即房東）返還之金額應如何計算？
  -   承租人承租之房屋既經確認為應拆除之違建，該房屋即不能達租賃之目的，承租人自得終止租約。  因承租房屋經確認為應拆除之違建，並非可歸責於承租人，故承租人終止租約時，自得請求出租人返還全部之押金；承租人如已給付該月份之租金，得請求出租人返還自其終止租約之日後，該月剩餘之日與全月全部日數比例之租金。
- - 承租人（即房客）因其承租之房屋為違建，而應拆除時，就相關之消費糾紛，得撥打哪支專線求助？
  - 承租人如有相關消費糾紛，可電話直撥「1950」或02-27256169消費者服務專線，洽詢服務人員。
- - 欲擔任營造業職業安全衛生業務主管須具備何種資格？
  - 一、於98年1月8日前具有1年以上從事營造業工作經歷（須提出工作證明），並取得下列資格： (一)勞工安全管理師。 (二)勞工衛生管理師。 (三)勞工安全衛生管理員。 (四)經勞工安全管理師、勞工衛生管理師、勞工安全衛生管理員、勞工安全衛生業務主管訓練合格領有結業證書者。二、於98年1月8日至103年7月2日期間內接受營造業勞工安全衛生業務主管訓練，並取得結業證書。三、於103年7月3日以後接受營造業職業安全衛生業務主管訓練，並取得結業證書。 聯絡科室：職業安全衛生科承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7021、7022、7506、7507
- - 學生悠遊卡適用對象
  - 1.本市公車學生票使用對象相關規定如下：「具有教育部認可學校之正式學籍（含空中大學），並持有學生證（或國際學生證）之學生。」2.教育部認可學校名單如下：(1)教育部統計處網站各級學校名錄資料(2)大陸地區大學及高等教育機構認可名冊(3)香港澳門學歷檢覈及採認辦法(含認可名冊)(4)教育部外國大學參考名冊查詢系統
- - 北投區泡腳池園區是否開放相關問題？
  - 有關北投區泡腳池園區是否開放、水溫及失物招領等相關問題，請洽詢0979-185-878詢問。
- - 我使用中興保全緊急救援系統，已經外出但忘記告知中興保全，請問該怎麼辦？
  - 請直接撥打中興保全守護中心總部，電話2557-5060，告知值班人員即可。
- - 國民住宅條例廢止，有關產權移轉等事項，該如何辦理?
  - 總統府104年1月7日華總一字第10300201421號令廢止「國民住宅條例」在案，有關國宅產權移轉等事項，請逕向轄區地政事務所辦理。
- - 申請敬老、愛心及愛心陪伴悠遊卡應備文件為何？
  - 申請人應備下列文件至任一區公所提出申請：1、敬老卡：國民身分證正本、2吋彩色照片1張。(如委任他人代辦，需再檢附委任書及代辦人身分證)：2、愛心卡：國民身分證正本、身心障礙手冊正本或證明、2吋彩色照片1張。(如委任他人代辦，需再檢附委任書及代辦人身分證)： 3、愛心陪伴卡：身心障礙者申請愛心卡時，於同1張申請書上勾選。（每位身心障礙者只限申請1張愛心陪伴卡）：
- - 持敬老或愛心悠遊卡者已往生，家人要如何辦理註銷？
  - 敬老或愛心悠遊卡之持卡人若往生，家屬或受委託人得至本市各區公所社會課辦理退卡事宜。需攜帶持卡人之票卡、死亡證明文件及受委託人之身分證明文件。退卡如需辦理加值退費者，其退費金額僅限於自行加值可用餘額，不包括公車免費補助及製卡費。後續由製卡公司寄發退費通知單，憑退費通知單及受委託人身分證件至各捷運站領取退費。
- - 全國老人或身障者搭乘捷運如何享有半價優待？
  - 至臺北、高雄捷運站窗口臨櫃購買優待票時，老人須持身分證正本、身心障礙者及其必要陪伴者須持身心障礙者身分證及身心障礙手冊正本，經捷運站務人員驗證優待身分無誤後，即可購買該捷運公司提供優惠折數後之半價優待票。設籍臺北市之長者或身心障礙市民，可申請本市核發之敬老、愛心悠遊卡，持卡加值後即可搭乘臺北、高雄捷運享有該捷運公司提供優惠折數後之半價優待，方便長者不需每次購買優待票皆需至捷運站窗口排隊購票。
- - 我可以到哪裡瞭解有關創傷後壓力症候群相關資源?
  - 民眾可以依下列路徑找尋相關資料：臺北市政府衛生局社區心理衛生中心網頁（http：//mental.health.gov.tw/）-->專題文章-->創傷與復原)
- - 「台北探索館」地點/交通/開館時間/洽詢電話?
  - 台北探索館地址：臺北市信義區市府路1號；市政大樓面向仁愛路大門(西大門)-入口右側。交通工具：搭乘捷運於市政府站下車後，往市府路方向步行約10分鐘即可抵達。開館時間：週二至週日上午9時至下午5時(週一及國定假日休館)洽詢電話：(02)2725-8630
- - 台北探索館3樓「臺北大街風情」展區規劃與更新的特色?
  - 「臺北大街風情」新展區透過圖文、高科技互動裝置及多層次的複合媒材，以動靜穿插、虛實對比的手法呈現六條貫穿臺北市核心的大道、臺北親山步道與臺北古蹟，其分別為：                                                                            【中山北路】：中山北路巨微模型整體呈現出中山北路的精彩歷史空間及建築之美，兩側更特別製作手控式37張中山北路亮點明信片、「圓山遺址貝塚模型」及「芝山岩植物-八芝蘭竹模型」介紹了臺灣最珍貴的稀有植物及考古遺址。                                                                                                   【忠孝東路】：忠孝東路由藝人黃子佼多重配音，以《烏龍院》漫畫家敖幼祥所繪製的五位漫畫角色，五種身分，帶領觀眾悠遊忠孝東路五種不同面貌的旅遊特色。                                                                                    【敦化南北路】：營造出小綠人帶您遊街的情境，在趣味中了解敦化南北路的特色與發展。                                                          【中華路】：以模擬乘坐遨遊天際熱氣球的方式，透過藝術家潘羽祐所繪製的中華路投影鳥瞰圖，鳥瞰過去西城風華之美，彷彿從空中視野深入觀察中華路的繁華。                                                                                    【新生南路】：以六座教堂做為介紹，透過展臺上的造型抽版與觸控故事盒，即會看見相關建築的影片介紹與新生南路動畫故事。                                                                                                                                 【凱達格蘭大道】：以觀眾肢體動作為感應操做，如同進入螢幕之中，帶領大家虛擬實境般，行走在凱達格蘭大道。                                                                                                                                                 【生態園區與親山步道】：展區搭配佈景影像，實體欄杆，形成親山步道虛實相映的效果。透過佈告欄的觸控螢幕，觀眾可點選十大親山步道的簡介影片來觀賞。                                                                                      【看見臺北古蹟】：挑選臺北市具特色的東西方型態的古蹟建築，營造古蹟貼近的氛圍並由多媒體展示展現古蹟建築的立體影像及古今變化的窗框造型。
- - 台北探索館為慶祝3樓「臺北大街風情」開幕，有舉辦哪些活動？
  - 開幕活動時    間：2015年2月10日~3月31日(休館日、假日除外)活動內容：1.歡迎團體30人以上預約自由參觀。2.團體(每30人)贈送台北探索館敖幼祥設計公仔紀念磁鐵一組(5枚) ，60人贈送兩組，以此類推。3.每日限量發放20組磁鐵。預約專線：(02)2725-8630
- - 有老人遭子女遺棄該如何通報?
  - 1.為落實通報機制及後續服務，知悉老人有老人福利法第41條情事者，請於「關懷e起來」網路通報系統進行通報；若狀況緊急，責任通報人員得先以言詞、電話通報，並於24小時內填通報表。2.通報電話：臺北市家庭暴力暨性侵害防治中心「02-2361-5295轉226」或臺北市政府社會局老人福利科「1999轉6966」。
- - 單獨使用愛心陪伴卡有優待嗎？
  - 愛心陪伴卡需緊接在愛心卡之後使用方享有半價優待，單獨使用以全票計費。
- - 敬老、愛心悠遊卡上車不能刷怎麼辦？
  - 敬老、愛心悠遊卡使用時發生問題，請持卡至區公所檢查，票卡將後送製卡公司修復。票卡送修期間：1.若屬敬老(一)、愛心(一)悠遊卡可先發與替代卡使用。2.若屬敬老(二)、愛心(二)悠遊卡，則可憑身分證(愛心卡另攜帶身心障礙手冊)於搭乘公車時投放優待票價之現金，搭乘捷運則至詢問窗口購買優待票。
- - 「節約用水優惠獎勵措施」實施期間為何？
  - 擴大實施期間為自104年月4月水費單起至旱象結束(鄰近地區解除限水)。
- - 敬老、愛心悠遊卡可以免費搭乘捷運嗎？
  - 捷運不提供免費次數，但有4折優待，需自行加值使用。
- - 敬老、愛心悠遊卡公車免費次數用完怎麼辦？
  - 若當月份公車免費次數用完，可選擇至捷運站自行加值，或至悠遊卡特約便利超商請服務人員幫忙加值，每次加值金額為100元的倍數。
- - 104年度「榮濱年貨大街」活動內容、日期及時間？
  - 本活動由本府輔導榮濱商店街觀光協會結合臺北年貨大街活動，於104年2月11日至2月18日假本市民族東路410全巷及410巷2弄舉辦，活動期間每日營業時間為上午6時至下午5時，並於周圍地區配套進行交通管制及搭設臨時棚架；另104年2月8日至2月10日配合活動搭設棚架及會場佈置。本活動有別於迪化街年貨大街專賣南北乾貨與零嘴餅乾，主攻生鮮蔬果、魚貨、肉品，是本市主打生鮮食材的年貨街區，並販售乾貨，讓民眾可以一次買齊所有需要的年貨，詳情可查詢「2015來臺北過好年」官網(http：//www.2015taipeinewyear.com.tw/)與臺北市市場處網站(http：//www.tcma.gov.tw/)。
- - 104年度「榮濱年貨大街」活動是否實施交通管制？
  - 是，管制日期為104年2月11日至2月18日，汽、機車管制時間分別於上午7時至下午5時、上午8時至下午4時，禁止進入管制區域；另詳細交通管制資料如下：一、民族東路410巷前段(民族東路口至同巷2弄間)及同巷2弄部分：1.以路中分隔線為界，民族東路410巷前段西側及同巷2弄北側(靠近第二果菜市場)部分作為車輛通行之用，並於活動期間改為單向通車，行車方向在民族東路410巷為由北向南行駛，至民族東路410巷2弄口時轉東向西行駛，即沿第2果菜市場繞行。2.民族東路410巷前段東側及同巷2弄南側(靠近兩側商家)部分作為封街營業範圍，禁止車輛通行。3.龍江路394巷、412巷與民族東路410巷交叉口、第二果菜市場面對之公寓式地下停車場(民族東路410巷3號至5號間)改為禁止右轉。4.民族東路410巷23弄與民族東路410巷交叉口，於活動期間改為禁止左、右轉，只能直行。二、民族東路410巷中、後段部分(即同巷2弄口至五常街間)：1.民族東部410巷中、後段部分作為封街營業範圍，原則上禁止車輛南北向通行。2.龍江路342巷、356巷、370巷及建國北路三段81巷與民族東路410巷交叉口，改為禁止左、右轉，只能直行。3.龍江路318巷、328巷與民族東路410巷交叉口，改為禁止右轉。4.建國北路三段75巷與民族東路410巷交叉口、位於龍江路318巷對面之公寓停車場，改為禁止左轉。
- - 如聘僱之外籍看護工休假而有喘息照顧之需求，臺北市有無提供相關服務？
  - 設籍且實際居住於之雇主，如因外籍看護工休假等情事，而有喘息照顧之需求，本市衛生局長期照顧管理中心提供「機構式喘息服務」及「居家式喘息服務」，民眾可以電話申請((02)2720-8889轉5880或1999轉5880)或親自前往臺北市照護管理中(信義區市府路1號B1中央區)或4區服務站任一服務窗口申請。【各區服務站地址及連絡電話】１.西區服務站：臺北市中正區中華路2段33號A棟5樓(臺北市立聯合醫院和平婦幼院區） (02)2375-3323 2. 東區、南區服務站：臺北市大安區仁愛路4段10號5樓（臺北市立聯合醫院仁愛院區） (02)2704-91143. 北區服務站：臺北市北投區中和街2號3樓（臺北市北投觀光醫療暨健康保健中心） (02)2897-47964. 中區服務站：臺北市大同區鄭州路145號6樓（臺北市立聯合醫院中興院區） (02)2552-7945聯絡課室：臺北市勞動力重建運用處外勞諮詢課外勞諮詢中心聯絡電話：(02)2338-1600   菲律賓籍分機：4205、4207；印尼籍分機：4206、4208、4215、4217-18；越南籍分機：4213、4214；泰國籍分機：4216
- - 請問和興炭坑要如何前往?
  - 地址為信義路五段150巷471弄底，可參考北市政府工務局大地工程處網站之交通方式前往：    1. 騎乘U-BIKE：自捷運臺北101站或象山站租借U-BIKE沿松仁路騎至吳興街，左轉後沿信義路五段150巷401弄騎至聯勤學校技術訓練中心後左轉至信義路五段150巷471弄底。2. 自行開車前往：沿松仁路至吳興街，左轉沿信義路五段150巷401弄至聯勤學校技術訓練中心後左轉至信義路五段150巷471弄底。3. 搭乘公車前往：自捷運臺北101站步行至松勤路與莊敬路交叉口附近，搭乘往吳興街公車總站方向大都會客運藍5公車至聯勤學校技術訓練中心站下車後左轉至信義路五段150巷471弄底。
- - 民眾如何向警察機關辦理失蹤人口緊急查尋及受理   應注意事項?
  - （一）失蹤人有下列情形之ㄧ，得報案實施緊急查尋：   1、罹患重病者（以全民健康保險法所定之重大傷病為範圍）。   2、有自殺之虞者。   3、有被誘拐脅迫之虞者。   4、未滿七歲者（家屬擅自帶離除外）。   5、其他重大急迫情事，有緊急查尋之必要者。 (二) 警察機關受理報案，於製作報案筆錄應載明緊急查尋情狀，並詳細調查失蹤人之身分背景、交往對象及可能去向；必要時，得將筆錄連同查詢電信資料申請表，報請調閱失蹤人及特定對象通聯紀錄，以利查尋。並視個案情形，立即通報轄內、他轄線上警力緊急查尋，或洽請大眾媒體報導協尋。失蹤人若未滿七歲者於緊急查尋二十四小時後仍未尋獲，且經查疑涉刑事案件時，比照重大刑案列管偵辦。
- - 電子遊戲機如何分類?電子遊戲場業得提供獎品每次       兌換或取得獎品之價值規定為何?便利商店或雜貨店  擺設電子遊戲機是否違法?
  - （一）電子遊戲機如何分類：      依電子遊戲場業管理條例第4條規定：稱電子遊戲機，指利用電、電子、電腦、機械或其他類似方式操縱，以產生或顯示聲光影像、圖案、動作之遊樂機具，或利用上述方式操縱鋼珠或鋼片發射之遊樂機具。但未具影像、圖案，僅供兒童騎乘者，不包括在內。      前項電子遊戲機不得有賭博或妨害風化之設計及裝置，其分為益智類、鋼珠類及娛樂類。（二）電子遊戲場業得提供獎品每次兌換或取得獎品之價值規定為何：      依電子遊戲場業管理條例第14條規定：電子遊戲場業得提供獎品，供人兌換或直接操作取得；限制級電子遊戲場每次兌換或取得獎品之價值不得超過新臺幣二千元；普通級電子遊戲場每次兌換或取得獎品之價值不得超過新臺幣一千元。電子遊戲場業之兌換，不得有下列各款之行為：   1、提供現金、有價證券或其他通貨為獎品。   2、買回提供給客人之獎品。      違反規定者，另依電子遊戲場業管理條例第27條規定處負責人新臺幣二十萬元以上一百萬元以下罰鍰；其涉有賭博嫌疑者，移送司法機關依法辦理。 (三)便利商店或雜貨店擺設電子遊戲機是否違法：   1、依電子遊戲場業管理條例第15條規定： 未依規定領有電子遊戲場業營業級別證者，不得經營電子遊戲場業。違反規定者，處行為人一年以下有期徒刑、拘役或科或併科新臺幣五十萬元以上二百五十萬元以下罰金。   2、另依電子遊戲場業管理條例第16條規定：非電子遊戲場業之其他營利事業，不得就其營業場所，供他人設置電子遊戲機營業。違反規定者，處行為人新臺幣十萬元以上五十萬元以下罰鍰，並限期令其改善；屆期仍未改善者，按次連續處罰至其改善為止。   3、因此便利商店或是雜貨店未依規定領有電子遊戲場業營業級別證者，不得經營電子遊戲場業或供他人設置電子遊戲機營業。
- - 交通事故後可申請到那些資料？可以在臺北市申請到其他縣市的交通事故資料嗎？
  - （一）依「道路交通事故處理辦法」第13條規定，道路交通事故案件當事人或利害關係人，得於下列期間向警察機關申請閱覽或提供相關資料：   1、於事故現場得申請提供道路交通事故當事人登記聯單。   2、於事故七日後得申請閱覽或提供現場圖、現場照片。   3、於事故三十日後得申請提供道路交通事故初步分析研判表。（二）為便利民眾申請交通事故資料，目前內政部警政署已推動單一窗口線上申辦機制（僅限申辦A1及A2類交通事故案件，單純財損之A3類交通事故尚未納入單一窗口申辦項目），您僅需至內政部警政署網頁（http：//www.npa.gov.tw）-線上申辦-交通事故資料申請及申辦案件進度查詢-交通事故資料申請頁面，輸入當事人姓名、身分證號等資訊後，並點選領件單位，就能由處理單位將申請資料寄送至指定之領件單位，待您接獲通知後，即可持證件就近取件，減少舟車往返之不便。
- - 處理家庭暴力防治工作之標準作業流程?
  - （一）針對現行發生之家庭暴力案件，警察機關受理後應立即派員至現場處理，如發現傷患，即刻送醫救治，並以適當方式保護被害人及其家庭成員安全，倘有違法情事，依法逕行逮捕、拘提；另針對現場處理情形及個案狀況，均縝密蒐證並製作「家庭暴力事件通報表」，於線上傳送通報至本市家庭暴力暨性侵害防治中心進行後續處遇工作，以提供加害人、被害人妥適的協助與醫療服務。 (二) 如遇民眾親至警察機關報案或非現行發生之案件，應就個案狀況，提供被害人權益、救濟及書面服務資料，並予說明；另亦需線上填報「家庭暴力事件通報表」，傳送至本市家庭暴力暨性侵害防治中心進行後續處遇工作。(三) 警察機關受(處)理家庭暴力案件，當事人關係如係現有或曾有婚姻/同居關係，受理員警於線上通報時同時填寫臺灣親密關係危險暴力評估表(TIPVDA)，並針對填寫分數大於8分者，列為家庭暴力高危機個案予以控管，加強被害人保護並對加害人實施約制訪查，以防止重大家暴事件發生。
- - 深夜0-6時可否於紅線路段停車？
  - (一) 依據「道路交通管理處罰條例」第56條第1項規定規定：「汽車駕駛人停車時，有下列情形之一者，處新臺幣六百元以上一千二百元以下罰鍰：一、在禁止臨時停車處所停車。」。(二)惟依據「違反道路交通管理事件統一裁罰基準及處理細則」第12條第1項規定，略以：行為人有下列情形之一，而未嚴重危害交通安全、秩序，且情節輕微，以不舉發為適當者，交通勤務警察或依法令執行交通稽查任務人員得對其施以勸導，免予舉發……六、深夜時段（零至六時）停車，有本條例（道路交通管理處罰條例）第五十六條第一項之情形；但併排停車、於身心障礙專用停車位違規停車或停車顯有妨礙消防安全之虞，或妨礙其他人車通行經人檢舉者，不在此限。
- - 想參加托育(保母)訓練應如何報名?
  - 每逢單月15日公告下2個月報名班次於社會局網站www. bosa. tcg. gov.tw(托育服務/訓練及公告訊息)，報名請逕洽訓練單位。
- - 參加托育(保母)人員專業訓練資格為何？
  - 年滿20歲，設籍並實際居住本市之本國國民(包含大陸地區配偶取得長期居留證、依親居留證者及合法取得外僑居留證之外籍人士)，另控留15％名額予外縣市民眾參訓。
- - 哪裡可以取得托育(保母)人員專業訓練上課訊息？
  - 社會局於網站公告訓練消息,本局網站(http：//www.dosw.tcg.gov.tw/)，路徑：嬰幼兒照顧服務\兒童方案補助及訓練公告\托育(保母)人員專業訓練課程。
- - 托育(保母)人員訓練費用?
  - 1.訓練費用每人至多8,000元，實際費用請洽詢各訓練單位。2.失業者參加訓練可申請訓練費用補助，依據勞動部勞動力發展署北基宜花金馬分署頒訂「辦理照顧服務職類職業訓練補助要點」，參訓學員如為年滿二十歲以上失業者、初次就業待業者及具勞工保險、農民保險被保險人身分之在職勞工，可檢具相關證明文件，由訓練單位依身分別向勞動部勞動力發展署北基宜花金馬分署申請全額或部分補助(身分認定以開訓日當日為基準）。3.學員須於開課前先行繳納訓練費用，結訓後透過訓練單位代為申請，補助款核發後再辦理退費作業。
- - 臺北市動物保護處寵物登記清查郵件通知回復FAQ
  - 一、這個通知是真的嗎？還是詐騙集團？是真的，臺北市政府所屬臺北市動物保護處關心您家中寶貝的健康，目前動保處正在全面性的普查，為能提供您更好的服務，今年特別委託廠商辦理。二、寵物都已死亡、遺失或送人，要怎麼辦？1.請持本通知單及飼主身分證，到住家就近有臺北市政府所屬動保處簽約的寵物登記站直接請他們幫你辦理除戶、遺失、轉讓登記。2.上網查詢 http：//www.pet.gov.taipei/AppPublic/PetInventory.aspx 登錄寵物資訊。3.可電洽：豐田生技公司清查專線02-23830398。4.於寵物清查通知書勾選寵物狀況欄位，傳真至02-23111169。5.使用3G手機掃寵物清查通知書二維條碼，直接點選狀態選項回報。三、登記站在哪裡？怎麼查？http：//www.pet.gov.tw/webClientMain.aspx 各縣市登記站查詢四、都那麼久了，沒去辦會怎樣？依據動物保護法第 31 條第1項第7款，飼主違反有關辦理寵物之出生、取得、轉讓、遺失或死亡登記期限之規定，經勸導拒不改善，處新臺幣三千元以上一萬五千元以下罰鍰。＊飼主應於寵物出生日起4個月內為寵物辦理登記。＊飼主應在已登記寵物取得、轉讓、住所異動後1個月內辦理異動申請。＊飼主應於寵物走失發生後5天內，申報寵物遺失協尋。＊寵物死亡日起1個月內，飼主應辦理註銷登記。
- - 為什麼要推動直飲？
  - 自來水是否可以直飲，是衡量一個城市現代化進步的指標。推動自來水直飲，是本處責無旁貸的使命，不僅是對市民的承諾，更讓大家用得方便，喝的安心，使臺北市成為國際一流的城市。推動自來水直飲將先從公共場所開始著手，除於捷運車站、機關、學校、公園及運動場所等地點設置直飲台供民眾使用外，並將針對觀光飯店、2016年設計之都及2017年世大運場館等指標地點進行輔導與推廣；後續再推廣到一般用戶，循序漸進而全面展開。
- - 自來水直飲的好處？
  - 自來水直飲，安全又方便，可以節省民眾用以煮沸的能源、裝設淨（濾）水器、耗材、維護及購買瓶裝水的費用。學校實施直飲，將可免除學童自家裡攜帶水壺或購買礦泉水的負擔，亦節省學校每年維護飲水機設備的龐大經費；公共場所自來水可直飲，提供民眾更輕鬆、方便、零負擔的飲水服務，故實施自來水直飲是安全衛生、方便、經濟又環保的。
- - 北水處如何確保直飲品質？
  - 臺北地區擁有水質優良的新店溪水源，自原水取水、整個淨水流程，到輸配水管網的水質，均以水質電腦監視系統24小時連續嚴密監測，隨時掌握水質狀況，提供民眾安全穩定、衛生可口、適合直飲的自來水。另為確保直飲安全與品質，本處定期對水源、淨水場、供水區管網代表點、直飲場所等水質進行採樣檢驗，檢驗結果除不含病菌外，民眾所關心的農藥、重金屬、三鹵甲烷、環境賀爾蒙及塑化劑等項目，檢測結果均為檢測不出或遠低於飲用水水質標準限值，完全符合我國及世界各先進國家及組織飲用水水質標準，水質純淨而優良。
- - 直飲水安全嗎？不用再煮沸嗎？
  - 臺北的自來水供水水質已達世界一流水準，完全符合我國、先進國家及世界衛生組織之飲用水水質標準。除不含病菌外，水中幾乎不含農藥、重金屬、三鹵甲烷等化學物質，水質相當安全衛生而健康，民眾煮沸作用一般只在於殺死細菌，對水質優良的台北好水是不必要的。
- - 在直飲台喝水衛生嗎？
  - 直飲台水質安全衛生，不會是細菌及病毒傳染的溫床。為確保直飲台飲水品質，管理單位每日落實自主維護管理作業，另本處定期進行水質檢驗(檢項包括濁度、餘氯、pH、總溶解固體量及大腸桿菌群)，地方環保主管機關也不定期進行水質抽驗。歷年來檢驗結果，水質均符合飲用水水質標準，安全無虞，可安心飲用。
- - 直飲水的標準？
  - 直飲水的標準即是我國「飲用水水質標準」，符合「飲用水水質標準」的水即可直接飲用。
- - 消防栓的水可以直飲嗎？
  - 消防栓的水即是供水管網的水，管網的水質，本處均以水質電腦監視系統24小時連續嚴密監測，隨時掌握水質狀況，因此，消防栓的水也可以直飲。
- - 我家有水池水塔可以直飲嗎？
  - 根據本處歷年水質檢驗結果顯示，供水水質100％符合飲用水水質標準；至於一般用戶，符合飲用水水質標準者也高達99.95％，不合格者大多為自來水滯留或用戶用水設備維護不當所致，只要民眾用水設備完善，建議每年委託本處推薦之優良水池水塔清洗業者清洗維護水池水塔（廠商資訊可上本處網站搜尋），即可放心直接飲用自來水。
- - 自來水中所含氯及三鹵甲烷，直飲是否會影響健康？
  - 在自來水處理過程中會加氯消毒，並於自來水中維持適量的餘氯量，目的是為了確保在輸送過程中的水質安全，不會滋生病菌。自來水中添加之氯量極低，只在0.4~0.6 ppm 左右，對人體是無害的，水中的氯容易揮發及為光所分解，於照光或未加蓋情況下，很快即可消散。水源若遭污染，原水於淨水處理加氯消毒過程，會生成副產物─三鹵甲烷，三鹵甲烷才是致癌性的，本處對此一問題相當重視，早已持續進行檢驗監測，歷年來檢驗結果顯示，本處供應的自來水三鹵甲烷含量均小於10ppb，遠低於歐、美、日等先進國家及我國飲用水水質標準限值(80ppb)，對健康影響微乎其微，民眾不必驚慌，可安心直接飲用。
- - 臺北自來水事業處提供的取水點位置?回收水可在何處取用?
  - (一)本處提供取水點位置為    長興淨水場客服中心前零售水專用給水栓，提供水車業者現場排隊取水，提供24小時全年無休服務，其他以消防栓取水之載水點採預約制並以週為單位填寫預約單。地點及收費方式詳本處網站「抗旱專區」。(二)臺北市工務局衛生下水道工程處提供回收水有2處，迪化廠地址：臺北市大同區酒泉街235號，內湖廠地址：台北市內湖區舊宗路2段2號。詳情參見衛工處網站首頁「常見問答」或「省水大作戰 - 回收水補給站」專區。
- - 104年台北供水區節水計畫為何?
  - 詳細計畫內容請點選(104年台北供水區節水計畫連結)(docx檔案)主要項目為：(一)加強節流與調度 全力支援新北市限水地區用水(二)擴大節水優惠 獎勵節水民眾(三)呼籲用戶自律節水 共度缺水難關
- - 「節約用水優惠獎勵措施」水費優惠折扣為多少？折扣金額如何計算？
  - (一)水費優惠折扣：實施期間符合優惠對象之自來水用戶，其本期用水量比去年同期負成長時，「用水費」金額依下列節水季費率之級距，給予不同之水費折扣： 節水率級距 原水費折扣(2-3月) 新的水費折扣(4月起至旱象結束) 10％ ≦ X  95折 9折 20％ ≦ X  9折 8折 30％ ≦ X  85折 7折 40％ ≦ X  85折 6折 50％ ≦ X 85折 5折(二)水費折扣金額 ＝ 本期用水費 × (1-用水費折扣)。
- - 那些情況下不適用「節約用水優惠獎勵折扣」？
  - 為提供公平的計算基礎，實施期間(或上一年同期)如有中斷用水情形（如新接水用戶、中止用水、欠費被停水及空屋空地等），或用戶因素致無法實際抄見用水量，且未自報度數致以推定計量者，基於公平原則，不適用優惠獎勵。同時為了讓資源更有效利用，本優惠措施也不適用每期5度(每月用水量2.5度)以下之低量空屋戶。
- - 什麼是生態防蚊？
  - 以專業診斷蚊蟲孳生源，判定蚊蟲種類，以生態防治方式，調整減少社區室內殺蟲劑使用，提升更健康環保安全的居住品質。
- - 申請「生態防蚊診所」的條件
  - 本局目前開放有需求的「社區管理委員會」、「機關」及「學校」掛號申請。
- - 如何申請「生態防蚊診所」服務
  - 欲申請「生態防蚊診所」服務，可至本局網頁首頁最新消息之「臺北市環保局首創全國「生態防蚊診所」「開診」內下載申請表(網址： http：//www.dep.gov.taipei/ct.asp?xItem=100429586&ctNode=39251&mp=110001)，填妥後以電子郵件、傳真或郵寄方式寄至臺北市環保局，即可完成申請服務。
- - 「市民童樂會」及「改變ING音樂會」在何處舉行?由誰主辦?
  - 為慶祝兒童節，本市9家有線電視業者於4月3日(五)下午1時至6時30分於市民廣場前聯合舉辦「市民童樂會-寶貝婦幼暨數位有線電視推廣嘉年華」(凱擘股份股限公司，聯絡人：曾子庭小姐，電話：(02)55825180轉186)，當日晚間7時30分至9時，由本府觀光傳播局(聯絡人：游旻寧小姐，1999(外縣市02-27208889)轉7576)接續於府前廣場舉辦「改變ING音樂會」，歡迎民眾踴躍前往。
- - 「市民童樂會」的活動內容為何?有何藝人表演?
  - 園遊會從下午1時登場，現場有許多有趣互動的攤位等著小朋友們去探險，還有4座免費的大型氣墊城堡，讓孩子們可以盡情玩樂。此外還有市政宣導攤位，讓民眾對市政有更深入的瞭解。緊接著市民演唱會將在下午4時熱情開唱，由柯市長分身郭子乾擔任主持人。首先九天民俗技藝團和知名藝人瑪利亞帶來氣勢磅礡的震撼演出，接著還有超萌雙胞胎左左右右、momo家族、郭靜和偶像團體SpeXial及知名搖滾天團MP魔幻力量接力開唱。
- - 「改變ING音樂會」內容為何?
  - 晚上7時30分開始的「改變ING音樂會」由音樂總監張正傑與臺北市立交響樂團附設管樂團、附設室內樂團合作演出知名古典樂曲如Wagner紐倫堡的名歌手、La gazza ladra羅西尼鵲賊、聖桑動物狂歡節 獅子大遊行、仲夏夜之夢、Radetzky Marsch拉德斯基、大黃蜂的飛行、莫爾道河…等，現場將結合100天來市政紀錄影音，帶給市民一場兼具視覺與聽覺的音樂饗宴。柯文哲市長也會現身跟現場民眾互動，並感謝所有市府員工與市民一起為改變臺北所做的努力。
- - 配合「市民童樂會」及「改變ING音樂會」舞臺搭設、拆除及活動辦理，周邊交通管制內容?
  - 104年3月31日0時至4月2日20時，市府路(松壽、松高路區間)東側五車道封閉；4月2日20時至4月4日24時，市府路(松壽、松高路區間)及新仁愛路全線封閉。
- - 配合「市民童樂會」及「改變ING音樂會」交通管制，公車改道情形?
  - 配合「市民童樂會」及「改變ING音樂會」交通管制，自4月2日20時至4月4日24時止，配合改道之公車路線如下：28、202、245、651、939、261、311、263、270(含區)、281、537、612(含區)、621、665、678、912、935、647、915、棕6、棕7、棕18、棕21、綠1、1211(林口-市政府)、1551(基隆-新店)、1960(臺北-桃園機場)、2025(臺北-瑞芳)、9001(臺北-中壢)、9009(桃園-臺北)、1612(臺北-臺南)、9012(臺北-臺中)。
- - 配合「市民童樂會」及「改變ING音樂會」交通管制，公車停靠站取消情形?
  - 配合「市民童樂會」及「改變ING音樂會」交通管制，自4月2日20時至4月4日24時止，配合取消站位如下：一、僅取消「市政府(市府)」站位：28、245、651、939、261、311、263、270、281、537、647、915、棕6、棕7、棕18、棕21、綠1。二、僅取消「市政府(松壽)」站位：621、665。三、取消「市政府(市府)」及「市政府(松壽)」站位：202、266(含區)、270區間車、612(含區)、912四、取消「市政府(市府)」及「市政府(松高)」站位：935五、取消「市政府(市府)」、「市政府(松壽)」及「市政府(松智)」等站位：678六、245、261、263、270、311、651及939例假日皆不停靠市政府（市府）站；270區間車、621、665、678及棕21例假日停駛。
- - 104年「設計角落」的輔導區域或產業為何?
  - 今年輔導對象預定自擇定之產業群聚聚落、具轉型價值之傳統產業或本市特色產業，公開徵求具高度輔導意願之業者，並邀集具經驗的服務設計輔導顧問及具創意巧思之設計團隊，完成軟硬體之創新創意設計導入。(洽詢電話：1999外縣市(02)27208889轉4543)
- - 無法至活動現場參與活動的民眾，可以透過哪些管道觀賞精彩表演?
  - 「市民童樂會」及「改變ING音樂會」除透過公用頻道CH3轉播外，也將透過網路Youtube轉播。
- - 104年「設計角落」的何時開始輔導?
  - 目前仍在籌備階段，預定於6月開始展開相關輔導作業(洽詢電話：1999外縣市(02)27208889轉4543)
- - 叫不到復康巴士?
  - 因本市小型復康巴士車輛及預算資源有限，故優先提供重障輪椅(特A等級)及重度視障(A1等級)民眾使用，且以優先滿足日間上下午尖峰(上下班(課)、往返醫院)搭乘需求為主，如您非特A及A1等級，或需使用夜間及凌晨趟次，將可能有訂不到車情形，建議您可調整用車時間，以提升訂車成功機率。另請您提供訂車編號(身障手冊後5碼)、姓名及訂不到趟次的資訊，以作為後續改進參考：1：訂不到預約車(3天後的車)，__時__分的車。2：訂不到臨時車(2天內的車)，__時__分的車。3：都訂不到。
- - 愛心悠遊卡每月免費點數或票卡內自行加值之金額該如何查詢(含欲查詢是否有扣款錯誤之情形) ？
  - 1.持卡至臺北捷運各站詢問處旁的自動查詢機或於本市12區公所之悠遊卡展期機可查詢該票卡最後6筆刷卡(含加值)紀錄。2.持卡至7-11免費查詢該票卡最後6筆刷卡(含加值)紀錄，如需查詢較早(最後6筆)以前的刷卡(及交易)紀錄需列印查詢並負擔列印費用；或致電悠遊卡股份有限公司客服專線查詢；電話(市話直撥)412-8880(手機及金馬地區請加02)。
- - 「2015設計獎」將於何時開始徵件?
  - 本年度設計獎相關活動現正籌備中，預定於5月開始展開徵件作業，詳細訊息歡迎參閱本局網站或設計獎網站(網址：http：//www.taipeidaward.taipei/Index.aspx)。(洽詢電話：1999外縣市(02)27208889轉4542)
- - 目前臺北市是否有辦理「汽車貨運調查」？其調查期間、對象及目的為何？
  - 一、「汽車貨運調查」係由交通部主辦，各縣市政府為協辦機關，負責辦理轄區內之調查業務，為定期按半年辦理之實地訪問調查。二、資料調查期間為104年4月16日至4月22日，以登記於臺北市之自用與營業用貨車為訪查對象。三、該調查主要目的係為蒐集臺灣地區自用與營業貨車之貨運流向及流量等動態資料，以供編製全國性及地區間產業關聯表及交通部研擬汽車貨運管理相關措施之參據。四、本調查之資料經彙總統計後，將刊載於交通部編印之「汽車貨運調查報告」內，有關重要統計結果亦將登載於交通部網站（網址：http：//www.motc.gov.tw/ch/home.jsp?id=56&parentpath=0,6）以供各界參考。
- - 有關臺北市社區推廣課程：打造田園城市─社區園圃種子師資培訓內容為何?
  - 面對現今農安與食安的議題，並結合實現深耕地方、由下而上的社區發展理念，產業局將於4月21日至8月18日開設「社區園圃種子師資培訓」課程，進行種子教師培力，成為推動田園城市夢想的最佳助力。課程內容從都市園圃觀念價值介紹、都市農耕技術教學到建置園圃的實務操作，一條龍式的教學希望能更快的累積社區動能，歡迎對田園城市有興趣的您共襄盛舉。    產業局委託臺北市社團法人社區大學全國促進會開設之「社區園圃種子師資培訓」課程，以透過社區培力方式，提升公共空間社區自主管理與參與意願。種子師資為社區營造重要的一環，負有推廣議題、聯絡社會團體資源、找尋可利用田園基地、號召及組織社區民眾參與等功能，在實習課程時需參與農園基地的建置，並在課程結束後把技能與網絡帶回社區，建立自己的社區園圃。  此課程免費，上課日期從4月21日至8月18日，共18週，每週兩次，上課時間為每星期二與四下午2點至5點，地點在圓山花博農學講堂〈臺北市中山區玉門街1號〉。招生簡章與課程內容可於http：//goo.gl/e8UFY2下載，一律採線上報名，報名截止日期為4月3號，限額60名，報名網址http：//goo.gl/forms/oGFQEkPMca，如有問題或需協助可洽02-2874-1852或寄電子郵件至tpecityfarm@gmail.com。課程相關訊息可至產發局網站(http：//www.doed.gov.taipei)查詢或撥打市民熱線1999轉分機6676洽詢。 熱烈招生中，名額有限，4月3日截止報名！
- - 「就要來花博瘋音樂、哈日本、品文創、宅動漫,」活動內容為何?
  - 花博公園精彩多元的展覽活動熱鬧不斷，緊接著3、4、5月份即將登場的『T&nbsp; Fest明日音樂祭』、『日本觀光與文化暨商品展』、『臺灣國際文化創意產業博覽會』、『亞洲動漫創作展』及『動漫之力&nbsp; II』，將會掀起一股朝聖熱潮，歡迎前來花博公園共襄盛舉喔！相關售票及開放時間，請至http：//www.expopark.taipei/hinformation.aspx?uid=93&amp;pid=7349查詢。                      活動         日期         主辦單位         備註                     T Fest 明日音樂祭         104/03/27-03/29        這牆音樂藝文展演空間股份有限公司         02-2351-0228 #221                    Thank You, Taiwan 第1屆         日本觀光與文化暨商品展Touch The Japan        104/04/17-04/20        台灣東販股份有限公司         02-2577-8878 #183                    臺灣國際文化創意產業博覽會         104/04/29-05/04        財團法人台灣創意設計中心         02-2745-8199 #582                    Petit Fancy亞洲動漫創作展         104/05/09        開拓動漫事業有限公司         02-2703-7312                    In Comic Energy ICE 動漫之力 II        104/05/31        星石工作室         02-2684-2577            &nbsp;
- - 申請失能者生活輔助器具及居家無障礙環境改善補助應備文件為何？
  - 一、申請書正本。二、衛生局所發之核定函表影本乙份。三、評估建議書影本。四、住宅證明(申請居家無障礙環境改善者)。五、發票或收據正本且註明申請人姓名、地址。(若為臺、澎、金、馬以外地區開立，並應符合以下規定：1.擇要譯註本國文；2.支出憑證列有其他貨幣數額者，應註明折合率及檢附兌換水單或其他匯率證明；3.依社會局要求提出相關憑證。)六、申請人之郵局或台北富邦銀行存摺影本。(須有戶名及帳號)七、領據、印章。八、施工後相片(申請居家無障礙環境改善者始須檢附)。五、其他應附文件。(依失能者生活輔助器具及居家無障礙環境改善補助計畫附表之規定而定)
- - 如果刷卡發現扣款異常等情形該怎麼辦？
  - 請記錄您搭乘之時間、公車路線及車牌號碼，向該公車路線業者服務電話或電子票證公司(悠遊卡公司客服電話02-412-8880、一卡通公司客服電話07-793-3000、遠鑫電子票證公司客服電話02-7727-8988及愛金卡公司客服電話0800-233888)反映後，由該公車業者或電子票證公司協助辦理查詢及後續退款事宜。
- - 愛心悠遊卡上車不能刷怎麼辦？
  - 若愛心悠遊卡使用時發生問題，請持卡至區公所檢查，送修期間可先發與替代卡，票卡將後送製卡公司修復。
- - 愛心陪伴卡單獨使用有優待嗎 ?
  - 愛心陪伴卡需緊接在愛心卡之後使用方享有半價優待，單獨使用以全票計費。
- - 愛心悠遊卡可以免費搭乘捷運嗎？
  - 捷運不提供免費次數，但有4折優待，需自行加值使用。
- - 愛心悠遊卡每月免費點數可以累計嗎？
  - 1.每月公車免費優待60段次（每段次等於車資8元），每月免費段次不累計至次月，每月均重新起算。2.每月免費段次用畢欲再使用之公車段次及捷運一律自行加值後半價優待。
- - 愛心悠遊卡有使用期限嗎 ?
  - 1.使用期限為半年(6個月)。2.每半年（6個月）必須展期一次（帶身分證件、身心障礙手冊及悠遊卡）可至區公所、臺北捷運全線各站查詢機或有儲值之便利商店皆可展期。3.若逾半年未展期，即鎖卡，可至臺北捷運全線各站查詢機辦理自動逾期展期作業。
- - 外縣市身心障礙者享有愛心、愛心陪伴悠遊卡補貼優惠嗎?
  - 本市愛心、愛心陪伴悠遊卡補貼優惠係本府與悠遊卡公司合作辦理，針對設籍本市之身心障礙者提供補貼優惠，設籍外縣市民眾，所享補貼優惠請逕洽貴轄主管機關。
- - 愛心悠遊卡，遺失或損壞應備何文件重新辦理？
  - 1.申請補發票卡，得由持卡本人或授權委託他人，備妥代理人之身分證、印章及申請人之身分證(愛心卡者需另備身心障礙手冊或證明，55歲以上原住民者需另備原住民身分證明文件) 、兩吋彩色照片1張、印章與製卡費用100元(如補發愛心悠遊卡及愛心陪伴卡需200元)，至臺北市各區公所提出申請。2.票卡故障者需將票卡繳回，若屬自行損壞需另備製卡費用100元。
- - 愛心悠遊卡遺失怎麼辦？
  - 1.請先打電話至412-8880轉7(手機或金馬地區請撥：02-412-8880轉7)辦理掛失，一旦掛失則無法取消。2.欲續辦補發者，請自備製卡費用100元及攜帶相關證件(身分證、身心障礙手冊或證明)、兩吋彩色照片1張與印章至區公所申請補發。
- - 愛心悠遊卡借人使用或被冒用遭查獲會處罰嗎？
  - 1.非本人使用第一類票卡者經查獲收回其票卡並停止免費補助一年，第二次查獲者，收回其票卡並停止免費補助三年；查獲第三次以上者，收回其票卡並停止免費補助五年。2.非本人使用第二類票卡者，收回其票卡。3.前二項情形因票卡遺失，於查獲前已依規定辦理掛失者，不在此限。4.冒用者，依大眾捷運法第49條，除補繳票價外，並支付票價50倍之違約金。前項應補繳票價及支付之違約金，如旅客不能證明其起站地點者，以營運機構公告之單程票最高票價計算。
- - 外縣市身心障礙者搭乘公車、捷運可以購買愛心、愛心陪伴悠遊卡使用嗎 ?
  - 1.可至貼有「悠遊卡」標誌之特約便利超商(7-11、全家、萊爾富、OK)購買優待卡使用，享有公車半價、捷運8折優惠。2.搭乘捷運可至臺北捷運各站詢問處憑身心障礙手冊(正、影本)購買4折單程票，俾利捷運公司據以向民眾居住縣市請領票價優惠補助款。3.搭乘公車，出示身心障礙手冊(正、影本)投現，可享半價優惠。
- - 愛心悠遊卡可以借人使用嗎？
  - 愛心悠遊卡採記名方式，僅限本人使用。使用時應隨身攜帶國民身分證、身心障礙手冊或證明文件供查核。
- - 愛心、愛心陪伴悠遊卡如何申辦 ?
  - 1.地點請至臺北市各區公所。2.資格愛心一卡：設籍且實際居住臺北市，且領有身心障礙手冊或證明之身心障礙者。 （自103年12月23日起，取消設籍年限限制）愛心二卡：因非本人使用票卡，致票卡遭收回之身心障礙者。3.申請文件愛心卡：國民身分證正本、身心障礙手冊正本、印章、兩吋彩色照片一式1張。愛心陪伴卡：身心障礙者申請愛心卡時，同時申請，每位身心障礙者只限申請1張愛心陪伴卡。
- - 「臺北鐵枝路」特展地點/交通/展覽時間/洽詢電話?
  - 展覽地點：台北探索館2樓特展廳，台北探索館地址：臺北市信義區市府路1號；市政大樓面向仁愛路大門(西大門)-入口右側。交通工具：搭乘5號捷運板南線於市政府站下車後，往市府路方向步行約10分鐘即可抵達。展覽時間：104年4月10日-104年8月2日，週二至週日上午9時至下午5時(週一及國定假日休館)洽詢電話：(02)2725-8630
- - 本市有哪些老人日間照顧中心(只收失智失能長者，週一至周五白天送至中心照顧)
  - 1.臺北市萬華龍山老人服務中心附設日間照顧--10853臺北市萬華區梧州街36號3樓  02-233618802.臺北市信義老人服務中心附設日間照顧--11070臺北市信義區松隆路36號4樓  02-878703003.臺北市士林老人服務中心附設日間照顧--11148臺北市士林區忠誠路2段53巷7號6樓  02-28381571轉2124.臺北市南港老人服務中心附設日間照顧--11573臺北市南港區重陽路187巷5號2樓  02-26535311轉115.臺北市大同老人日間照顧中心--10361臺北市大同區昌吉街52號9-10樓  02-259887106.臺北市松山老人日間照顧中心--10564臺北市松山區南京東路5段251巷46弄5號1-3樓  02-276163007.臺北市文山老人養護中心附設日間照顧--11687臺北市興隆路2段95巷8號3樓  02-89313190轉138.財團法人天主教失智老人社會福利基金會附設臺北市私立聖若瑟失智老人養護中心--10868臺北市萬華區德昌街125巷11號  02-23046716轉1079.臺北市兆如老人養護中心附設日間照顧--11656臺北市文山區政大二街-129號  02-86616365轉310510.臺北市立聯合醫院仁愛院區仁鶴軒失智日間病房--10629臺北市仁愛路四段10號5樓東側 02-27093600轉315911.臺北市西湖老人日間照顧中心--11444臺北市內湖路1段285號6樓 02-2656170012.臺北市中山老人住宅暨服務中心附設日間照顧--10459臺北市中山區新生北路2段101巷2號2樓 02-25420006轉20013.臺北市立聯合醫院陽明院區得意齋失智失能日間照顧中心-臺北市士林區雨聲街105號健檢大樓3樓 02-28353456轉517814.臺北市大安區老人日間照顧服務-臺北市大安區新生南路3段52-5號5樓 02-2366132115.臺北市內湖區老人日間照顧服務-臺北市內湖區康樂街136巷15弄5號 02-2630753816.臺北市北投區老人日間照顧服務-臺北市北投區裕民6路120號3樓 02-28218267轉10317.臺北市中正區多元照顧中心-臺北市中正區羅斯福路2段5號2樓 02-2351000518.臺北市中正老人服務暨日間照顧中心-臺北市中正區貴陽街1段60號 02-2383-1958轉301或308
- - 身心障礙者日間照顧及住宿式照顧費用補助申請流程
  - 持應備文件至社會局提出申請→經受理並審核→完成核定並公文通知→按月由提供服務機構或服務單位掣據請款→撥款。
- - 「2015臺北傳統市場節」舉辦日期、地點。
  - 臺北市市場處從3/18(三)起-6/30(二)止，舉辦「2015臺北傳統市場節」系列行銷活動，並於4/25(六)-4/26(日)在花博公園圓山廣場舉辦兩天的主場活動，活動詳情請洽2015臺北傳統市場節活動官網：http：//www.festival.market.taipei/或洽詢肯果行銷有限公司(電話：82572525轉235或245)將有專人為您服務。(一)2015臺北傳統市場節-行銷系列活動序號時間地點13/22(日)松江市場23/29(日)西寧市場34/11(六)士林市場44/18(六)北投市場54/19(日)大直市場65/3(日)成功市場75/9(六)光復市場85/10(日)中崙市場95/16(六)水源市場105/24(日)永吉市場115/30(六)東門市場126/6(六)永樂市場136/7(日)木柵市場146/13(六)興隆市場156/27(六)成德市場(二)2015臺北傳統市場節-主場活動時間：4/25(六)-4/26(日)地點：花博公園圓山廣場
- - 辦理質借時，需帶什麼證件?
  - 只要親持有效之國民身分證、駕駛執照、護照或居留證等證件，連同質借物品即可辦理質借放款，相關問題可洽本市動產質借處，聯絡電話：02-25629862。
- - 臺北市動物保護處收容野生動物後續如何處理？
  - 有關本處收容本市無主或流蕩之野生動物處理方式，一般類或保育類野生動物經獸醫師檢查後，經獸醫師評估如狀況良好，適合野放即進行野放作業，如不適合野放得送往其他收容中心，即依本處野生動物救傷收容及野放作業流程（附件）辦理。若為受傷之動物除本處治療外，如有重症無法救傷動物多後送至就近之動物醫院或臺北市動物園進行即時救傷、診療照護、暫時收容，俟動物體能恢復良好者，如為鳥類則請台北市野鳥學會依動物生活習性於棲息地野放；若動物為兩棲爬蟲類，請臺北市立動物園收容，而其他動物或外來種動物則請新竹市立動物園、屏東科技大學保育類野生動物收容中心、國立宜蘭大學動物科技學系、中興大學獸醫教學醫院協助收容；另如本土種，考量避免傷及民眾暨動物之生活習性與棲息地，多數於人煙稀少之郊區野放。一般中小型哺乳動物、人為飼養寵物或動物係由本處暫時收容，依據動物保護法及畜犬管理辦法之相關規定，將收容動物資料及後續作為依程序公告於網站，讓原飼主或有意願認養飼主可以依規定辦理收容動物之後續認領、認養。
- - 申請低收入戶學雜費減免資格？
  - 本市列冊低收入戶及其子女，就讀公立或立案之私立學校具有學籍、在法定修業年限內者。1、符合減免學雜費之學生（家長），應於每學期註冊時填具申請表，檢附證明文件向就讀學校申請，由學校審查符合規定後逕予減免。2、就讀私立學校者依前揭方式辦理，並由就讀學校於開學後兩個月內檢附申請表（含證明文件）、申請名冊及學校領據，函報本府教育局補助。
- - 申請低收入戶資格作業時間需要幾個工作天，才知道符不符合資格？
  - 申請低收入戶所需時間，自申請日、里幹事訪視、區公所建檔、查調財稅、初步審核、函送本局複核（指初審不通過之個案）至審核結果確定，依本府人民申請案件規定期限最長為60日。惟如審核符合資格，將追溯至申請月份發給生活扶助。
- - 農地遭法院查封或假扣押，地主可否申請設置休閒農場？
  - 不可以，已查封或假扣押之不動產，債務人無法自由處分該不動產，所以農地遭法院查封或假扣押，地主不可提出休閒農場設置之申請。
- - 如何得知促進民間參與公共建設資訊？
  - 可至本局(財政局)促進民間參與公共建設專區查詢相關資訊。
- - 興辦事業計畫核准前，水土保持設施是否可以施工？
  - 不行。水土保持計畫乃是配合興辦事業計畫，興辦事業計畫未核准前，水土保持設施不准動工。但水土保持計畫的審查與核可則是在興辦事業計畫前，待興辦事業計畫核准後由目的事業主管機關核發水保施工證明，完工後核發水土保持完工證明。
- - 各機關學校如何設置專戶或更換戶名？
  - 各機關學校設置專戶，應敘明理由並檢附相關文件，函報市庫主管機關財政局同意後辦理；更換戶名，亦同。另各機關應於財政局核准開戶或更換戶名日起三十日內完成相關手續，並至財政局財務管理系統之「專戶管理系統」子系統，執行新增或更改之異動申請及列印「臺北市政府所屬機關學校專戶異動備查表」，陳核後免備文送財政局備查。相關規定請參閱「臺北市政府所屬各機關學校專戶及保管品管理要點」，或洽詢財政局財務管理科，分機 1165。
- - 如何得知臺北市債務資訊?
  - 可至臺北市政府網站/資訊公開/最新債務訊息(http：//www.gov.taipei/ct.asp?xItem=23798064&CtNode=52633&mp=100001)查詢1年以上債務未償餘額、短期債務未償餘額、平均每人負擔債務金額及自償性債務未償餘額等債務資訊。
- - 遇有新進同仁需使用集中支付作業系統，應如何辦理？
  - 遇有新進同仁需使用集中支付作業系統時，請各支用機關管理者登入作業系統後，點選「權限管理」的「使用者維護」畫面新增帳號，再到「群組權限維護」選取該帳號所需要的功能項目，就可以使用該新增帳號登入支付系統了。
- - 與市政府往來之廠商，有時因為案件多，常常無法知道款項是否已經匯入帳戶，也分不清是哪個機關給的款項，請問該如何作才可以明確快速知道相關訊息?
  - 1.您可以向往來的機關學校申請「電連存帳入戶通知」服務，或至本局網頁下載申請書填妥後傳真或郵寄給我們，申請這項服務後，以後如有款項匯入您指定之金融機構帳戶，您就可收到加註「費款匯入帳戶日期」及「匯款機關」的入戶通知單，方便您對帳。2.另外本局網頁/入戶通知查詢作業，提供您以工商憑證或自然人憑證，查詢對帳資料。
- - 請問電子簽章簽證人員有無人數的限制?
  - 有。電子簽章簽證人員機關首長及其授權代簽人最多3人、主辦會計及其授權代簽人最多也是3人。
- - 臺北市政府財政局經管之市有非公用土地如何參與都市更新？
  - 本局經管之市有非公用土地倘位於擬實施都市更新範圍內，除另有開發使用計畫外，依都市更新條例第27條規定一律參與更新，並以權利變換方式參與權益分配。惟若市有土地面積逾500平方公尺且占都市更新單元面積50％以上，得由本府主導，並評選出實施者辦理都市更新。
- - 市有土地參與都市更新是否可讓售實施者?
  - 市有不動產依都市更新條例第25條規定以協議合建方式參與都市更新事業者，市有土地面積在150平方公尺以下，得依都市更新事業計畫讓售與實施者。
- - 如何得知已簽約之臺北市政府財政局主導辦理都市更新案件進度?
  - 本局網站首頁已建置土地開發專區，專區內有財政局主導辦理更新案件，本局已定期更新進度，民眾可逕行上網查詢。
- - 哪裡可以查到市有土地參與都市更新的資料？
  - 本局已在本府資料放平台內提供市有土地參與都市更新案件的資料，並定期更新相關資料，民眾可自行上網查詢。(本府資料開放平台)
- - 臺北市政府是富邦大股東，是否可以對台北富邦銀行進行業務督導？
  - 查本市為管理富邦金控之公股股權，訂定「臺北市政府投資富邦金融控股股份有限公司公股股權管理作業要點」，本府派兼之3位富邦金控公股代表董事，均依規定行使其職權，以維護本府及市民權益；另台北富邦銀行為富邦金控之子公司，其辦理銀行業之監督管理等之業務主管機關為金融監督管理委員會銀行局，故本府並無相關權責。
- - 財政局經管哪些地下街？
  - 臺北車站K區地下街(地址：臺北市忠孝西路一段47號地下1、2層)中山地下街(地址：臺北市大同區長安西路52之1號及民生西路47號地下一層)東區地下街(地址：臺北市大安區大安路1段77號地下1層)西門地下街(地址：臺北市中正區中華路1段51之1號地下一層)
- - 臺北車站K區地下街目前是由誰經營管理及聯絡方式？
  - 臺北車站K區地下街目前係由誠品生活股份有限公司經營管理，聯絡電話：02-66328168。
- - 捷運中山、東區地下街目前是由誰經營管理及聯絡方式？
  - 中山、東區及西門地下街目前係由臺北大眾捷運股份有限公司經營管理。聯絡電話：東區地下街02-25505600(分機：3202)         中山地下街02-25505600(分機：3224)
- - 我收到房屋稅稅單覺得有疑問，想請教相關問題？
  - 臺北市稅捐稽徵處負責本市地方稅相關業務，因為實際課稅資料都在稅捐處，所以請向房屋所在地稅捐分處洽詢(可至稅捐處網站查詢)。相關反映意見亦可電洽總處，聯絡電話：02-23949211。
- - 申報個人綜合所得稅有疑義?
  - 綜合所得稅是國稅，非本府財政局及本市稅捐處業務權責，請洽財政部臺北國稅局，聯絡電話：02-23113711。
- - 代辦工程臺北市和平國小暨籃球運動館新建工程案完成後之效益為何？
  -   籃球運動館：為一多目標的場館，可提供7,000觀眾席座位。本場館為107年8月份2017年世界大學運動會之比賽場地，賽後可做排球、羽球、乒乓球等比賽場地。   教學暨行政大樓：提供1~6年級(共12班)及幼兒園2班之教學及行政空間。   活動中心(兼暖身館)：提供學生活動及800人觀眾席。 
