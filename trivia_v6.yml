- - 綠美化基地於施工期間，其施工圍籬進行綠美化施作，以及未依規定之作業方式。
  - 無標題文件Q30：綠美化基地於施工期間，其施工圍籬進行綠美化施作，以及未依規定之作業方式。A30：基地刻處於既有地上建物拆除或綠美化工程階段，施作期間有關施工圍籬美化施作方式，應依下列規定辦理之。1.施工圍籬規範設計施作，規格以高：240cm、寬：360cm為1單元。2.綠美化方式，以彩繪、帆布、貼紙（以設置臺北好好看logo為原則）或設置綠化植栽（扣除施工大門面積後，1/2以上圍籬面積採植栽綠化）等方式施作。3.綠美化設施設置期間，採彩繪、帆布、貼紙方式者，必須固定牢固且避免污損，採綠化植栽方式者，則須避免任其枯萎、雜亂。4.倘申請人未依前開規定施作施工圍籬綠美化及維護管理，經本府考評、例行、不定期檢查或經1999專線投訴不合規定，經累計2次限期通知改善仍未改善者，將列為竣工查核會勘之缺失事項。如為98年度申辦案件，後續將納入竣工後維護管理期間之容積獎勵考評參考依據，作為本市都市設計及土地使用開發許可審議委員會審議扣減該建築用地容積獎勵額度參考。99年度申辦案件，則經本府核定後，逕扣減該建築用地容積獎勵額度百分之零點五，並得連續扣減之，但最高不得連續扣減超過容積獎勵額度百分之二。
