- - 市府生活廣場活動式臨時攤位FAQ
  - (一)請問市府生活廣場「活動式臨時攤位」如何申請？ 答：市政大樓地下2樓「活動式臨時攤位」之公開招商作業，以每6個月為1展期，每年2月及8月受理廠商參展申請。廠商資格審查及受理抽籤登記日期、各類別廠商之展售位置、攤數分配，均公告於公管中心網站及地下2樓市府生活廣場佈告欄，不另行通知。相關申請資料可於公告後於本中心網站下載，或至公管中心服務臺領取，如有相關疑問，請洽電話：1999（外縣市：02-2720-8889）轉8619。(二)金融、保險、投資、信託業者應如何申請市府生活廣場「活動式臨時攤位」？ 答：請備商業登記或公司設立核准公文及總公司之推薦函。                              (三)市府生活廣場「活動式臨時攤位」之場地使用費及展售時間？ 答：場地使用費1天新臺幣650元，展售時間配合市府上班時間：上午9點至下午5點。(四)弱勢族群身心障礙者及原住民身分如何申請市府生活廣場「活動式臨時攤位」？  答：展售人應附具本人、配偶或直系親屬一親等之身心障礙手冊影本及領有身心障礙手冊者一個月內現戶戶籍謄本或原住民族籍證明書影本之證明文件，可參加公益、福利團體、弱勢族群類別申請，我們保留每日7個攤位提供使用，但仍須受第(五)項資格限制。(五)申請市府生活廣場「活動式臨時攤位」的資格限制？答：一般廠商：需有商業登記或公司設立核准公文。(六)販售食品類需如何申請市府生活廣場「活動式臨時攤位」？答：除須具備第(五)項之資格外，食品類產品須檢附最近一年經衛生主管機關核發之符合衛生規定證明文件，及產品責任險有效期間一年內之證明文件。另配合本府環保政策，不得使用塑膠袋盛裝飯菜、麵食、熱湯及飲料等食物。
