- - 有關民眾因不知道駕駛行為有違規情事，於事後密集收到多張罰單造成民怨，警察局有無因應作為?
  - 為避免民眾有多次違規遭舉發情形，臺北市政府警察局訂有2項措施，提前通知違規民眾，分別為「遭多次檢舉違規停車案件於7日內以電話、書面或到址通知」及「登錄遭逕行舉發交通違規簡訊系統通知」：(一) 針對遭民眾檢舉違規停車案件，自105年11月1日對於同一車輛於同一地點被多次檢舉違規停車（7日內被檢舉4次以上）者，將由轄區分局於7日內以電話、書面或到址(擇一方式)通知車主有連續違規情形。惟同一車輛經通知後，如再接獲同一地點相同之違規案件，不再予重複通知。(二) 針對遭逕行舉發交通違規案件，臺北市政府警察局訂有「交通違規簡訊通知服務措施」，舉凡員警經由科學儀器採證逕行舉發交通違規之案件(含民眾檢舉)，只要經過申請，均會以簡訊通知車主，俾利車主提前知道自己交通違規外，亦可避免在同一危險路段多次重複違規，以有效降低行車危害，您得自臺北市政府警察局交通警察大隊首頁http：//td.police.taipei/，申辦服務或熱門服務項下點選交通違規簡訊服務，進行申辦程序。
