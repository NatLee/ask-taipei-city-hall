- - 外捐
  - Q1： 受理捐贈的部門為何？非上班時間可否捐贈？A.外界捐贈之財物統一由社工組受理，非上班時間，則由總值人員代為處理後轉交社工組處理後續事宜。Q2： 捐贈的範圍為何？A.捐贈範圍包含現金（包括現款或支票）、食品、物品（以適合老人使用為主，如尿布、輪椅，但衣物除外）。Q3： 如何捐贈？A.捐款可以親自面交或透過郵政劃撥，本院外捐劃撥帳號為19167140，捐物前為使您的愛心有效使用，請先來電詢問需求性。 Q4： 捐贈款項時可以指定用途嗎？A.本院外捐款項用途目前分為：一、福利服務金二、醫療服務金三、加菜金四、慰問金五、設施設備費六、節慶祭祀專款※如捐款未指定用途，則用於本院院民福利相關事務、捐款人亦得自行指定捐款用途。
