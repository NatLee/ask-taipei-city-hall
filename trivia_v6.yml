- - 花博公園配合市府政策，推動花博公園成為臺北市創新中心，作為創新產業交流新據點
  - 花博公園持續活化展館使用，藉由民間企業團體之創新與創意，持續營造優質參觀環境、引進優質的會展活動，提高會展產業產值，促進相關產業發展，並積極轉型為臺北會展中心，作為市府推動會展產業的政策及場館資源媒合執行單位，營造規劃本市創新創業基地。花博會館設定為臺北市創新創業基地對外公開招租，已由第二計劃有限公司得標經營，於105年12月8日對外以台北創新中心（Center of Innovation Taipei，簡稱CIT）開幕啟用。台北創新中心提供新形態辦公空間，透過誘發每一位參與者好奇心的機制，讓各產業的單位、各領域的新創公司、自由工作者，在衝突性交流下找到永續發展的空間。現已有42個單位橫跨各領域的新創單位進駐，國、內外單位比例各佔一半，期待聚集更多活躍於不同領域的單位，為臺北市經濟注入新動能，帶動國內產業升級。
- - 追蹤檢疫期間如果搬家，我可以帶寵物去其他縣市哪些醫院完成檢疫？
  - 請將您異動後的連絡方式(寵物飼養地)：1.連絡人、飼養管理人2.連絡電話3.異動後地址4.異動時間等資訊告知本處，我們會發公文移轉至異動後所屬轄區之防疫單位，由該防疫單位另行通知您檢疫方式和日期。
- - 追蹤檢疫通知書函上安排的檢疫日期，如果當天剛好有事，可以改時間嗎？
  - 我們安排的檢疫日期可以前後彈性做調整，如果因故無法如期帶寵物去醫院檢疫，可提前或延後檢疫日期，以不超過一週為原則。（追蹤檢疫應自放行日起3個月內完成。）
- - 申請公司或商業登記收到補正通知時，如何辦理補正？
  - 可前往「全國商工行政服務入口網」/「公司與商業及有限合夥一站式線上申請作業」系統、臨櫃、郵寄 (地址：臺北市信義區市府路1號北區1樓，臺北市商業處)或以電子郵件傳送(電子信箱：cx_tcooc2@mail.taipei.gov.tw，限得以影本檢送之文件)辦理。
- - 動物保護法所規範的寵物食品是指那些種類？
  - 依據動物保護法第3條第6款規定：寵物食品：指為供應經中央主管機關指定之寵物均衡營養之食料及其他物質。行政院農業委員會業以104年6月3日農牧字第1040042773A號函公告，預告訂定「寵物食品之寵物種類為犬、貓」。故除了犬、貓外其他種類飼料或食品皆非屬動物保護法所規範之寵物食品之範疇。
- - 請問動物用藥品要如何取得？
  - 動物用藥品僅可由經許可的動物用藥品販賣業者販售，或獸醫師診療時調劑提供。另外依據獸醫師（佐）處方藥品販賣及使用管理辦法規定，處方藥品未經獸醫師（佐）處方不得為買賣行為。所以如果要到附近的動物用藥品販賣業者購買動物用處方藥的時候，請記得向獸醫師索取處方箋才能購買。
- - 請問動物用處方藥品有哪些？
  - 基本上動物用藥品皆屬獸醫師處方藥品。但下列劑型除外：1.抗感染藥：含藥飼料添加物劑型及專供觀賞魚用非注射劑型。2.抗寄生蟲藥：外用液劑、外用散劑、條帶劑、噴霧劑及含藥飼料添加物等劑型及專供觀賞魚用非注射劑型。以上劑型並非獸醫師處方用藥，購買時不需獸醫師處方箋。除了以上兩類別中所提到的劑型之外的藥品，例如給動物洗細菌性或黴菌性皮膚病的洗劑、和一切內服、注射用的各種藥品，均屬獸醫師處方用藥範疇，如欲購買上列處方藥品，於就醫時跟獸醫師索取處方箋，方能憑處方箋至動物用藥品販賣業者處購買，於購藥時交付動物用藥品販賣業者存查。
- - 颱風受災戶，有什麼地方稅可以減免？
  - 一、房屋稅房屋遭受水災，以實際淹水日為準，每30日停徵1個月房屋稅，不足30日以30日計算。如因豪大雨或土石流衝擊，房屋毀損面積占整棟面積5成以上必需修復始能使用，免徵房屋稅，毀損面積占整棟面積3成以上不及5成，房屋稅減半徵收，請於災害發生之日起30日內，檢附相關證明文件向房屋所在本處所屬分處提出申請，如接獲相關機關之通報，本處會主動辦理減免房屋稅。二、地價稅土地如因山崩、地陷、流失、沙壓等環境限制及技術上無法使用時，可檢附相關證明文件於地價稅開徵40日(9月22日)前向土地所在本處所屬分處提出申請免徵，特殊個案依財政部函示辦理，如接獲相關機關之通報，本處亦會主動辦理減免地價稅。三、使用牌照稅汽車及151cc以上機車如因災害受損不堪使用或暫停使用，應向監理機關辦理報廢、繳銷、停駛、註銷登記手續，使用牌照稅計徵至災害發生前1日。如受損須修復，但未向監理機關辦理停止使用者，可在災害發生日起1個月內，檢附里長或警察機關出具之災害證明以及修車廠開立之發票或收據，申請修復期間減免使用牌照稅。四、娛樂稅查定課徵之娛樂稅代徵人，因災害而遭受損害者，可在災害發生日起1個月內提出申請，由分處派員實地勘查，依勘查結果，扣除其未營業之天數，以實際營業天數計算查定銷售額，辦理減徵娛樂稅。
- - 如何查詢公司登記案件辦理進度？
  - 案件處理時限如收據正面所示，如欲查詢案件處理情形或逾承辦期限未收到簡訊回覆結果，可依下列方式查詢：1.全國商工行政服務入口網〈http：//gcis.nat.gov.tw/mainNew/〉點選「商工查詢服務」→「公司登記查詢」→「公司登記案件進度查詢」(或上臺北市商業處網站點選「公司及商業登記」→「案件進度查詢」)，點選申登機關及輸入收文號(前9碼)或公司統一編號。2.電腦語音查詢專線：412-11663.公司登記諮詢專線：1999(外縣市02-27208889)轉6485或6491洽詢4.以手機或行動上網裝置掃描繳費單收文聯上的〝QR CODE〞。5.收文收據載列有案號、承辦人姓名及其連絡電話。如仍有疑問可於上班時間：上午8時30分至下午5時30分（中午不休息）利用臺北市商業處為民服務電話：1999(外縣市02-27208889)轉6485或6491洽詢。
- - 亞洲城市特展之活動時間及地點？有哪些亞洲城市展出？
  - 活動日期：104年8月14日（五）至16日（日），每天16：00-21：00。活動地點：信義區香堤大道廣場（信義新天地）展出城市：曼谷、德里、河內、雅加達、吉隆坡、馬尼拉、首爾、臺北、東京及托木斯克等10個城市。
- - 亞洲城市特展有什麼活動？如何拿到集點卡？有什麼獎品呢？
  - 本次特展設置10個具有亞洲城市異國特色之攤位，可索取當地觀光文宣並體驗該城市特色活動，如：德里攤位的印度式手部彩繪、首爾攤位的韓國傳統服務體驗…等，只要到亞洲城市特展的服務台，就可以領取1張集點卡(每人每次1張)，完成體驗活動後，即可獲得1個印章認證，集滿3點可兌換護照套或面膜1個(擇1)，集滿5點可兌換鑰匙圈1個，集滿10點則可兌換野餐墊或微型積木1個(擇1)，各獎項每日限量，換完為止，點數不可累計重覆?換，另?換獎項時需將集點卡繳回；此外，集滿10點者，還可以參加抽獎，每日下午8時將抽出得獎者，有機會獲得台北101觀景臺門票1張或小籠包造型調味組1組。
- - 亞洲城市特展有哪些活動可以體驗？該如何集點？
  - 完成各個攤位體驗活動即可獲得該攤位的印章認證，各攤位的體驗活動如下：曼谷：頭戴泰式傳統頭飾後擺出圖面(活動現場製作之泰式傳統服飾之人型背板)指定手勢拍照後即可獲得一點。德里：體驗印度式手部彩繪及介紹後，即可獲得一點。河內：穿著越南傳統服飾照相，即可獲得一點。 雅加達：穿著印尼傳統服飾照相，即可獲得一點。吉隆坡：景點拼圖，以吉隆坡雙子星大樓為圖片，完成拼圖即可獲得一點。馬尼拉：製作菲律賓地圖，放上菲律賓主要城市，只要玩套圈圈套到馬尼拉，即可獲得一點。首爾：穿著韓國傳統服飾照相，即可獲得一點。臺北：至臺北旅遊網粉絲團按讚分享，即可獲得一點東京：至日本攤位聽取完旅遊宣傳介紹後，即可獲得一點托木斯克：俄羅斯傳統套娃，將套娃完整收入者，即可獲得一點。
- - 亞洲旅遊推廣會議是什麼？
  - 亞洲旅遊推廣會議（Council for Promotion of Tourism in Asia, CPTA）主要是透過會員城市合作形成交流網絡，共同對外推廣亞洲城市，吸引歐美、大洋洲、亞洲其他地區旅客，促進亞洲觀光旅遊繁榮發展。每年由各會員城市爭取舉辦，以增進會員城市間的交流互動。2015年第14屆亞洲旅遊推廣會議由臺北市主辦，是臺北睽違10年第2次舉辦，相關活動包含開幕式、會員城市代表會議、國際觀光研討會及亞洲城市特展等。
