- - 臺北市劃設消防通道Q&A
  - 一、問：何謂「消防通道」？ 答：消防通道係指通往火災搶救困難地區救災必經之道路或本市現有道路寬度未滿7.5公尺，距離有人居住或使用之建築物在140公尺以上之道路（囊底路道路長度在140公尺以上，雙向連通道路長度在280公尺以上）劃設消防通道。二、 問：何謂「火災搶救困難地區」？答：火災搶救困難地區係指具有容易擴大延燒、水源缺乏、避難逃生困難、收留弱勢人員、存放大量易燃物或危險物品等因素，有造成重大人命傷亡之虞之場所或地區，因該場所（地區）一旦發生緊急事故，消防人員若無法立即趕到現場搶救，極可能造成重大人員傷亡及財產損失，認定項目如下：(一)連棟式磚、木造建築物達50戶以上。(二)建築物密集且水源缺乏地區。(三)甲類地下室營業面積在5000平方公尺以上之場所。(四)20層以上高層建築物。(五)身心障礙福利機構、收容人數在20床以上之老人養護機構及住院病床在100床以上之醫院。(六)捷運地下車站及捷運地下商店街。(七)機械式密閉停車塔。(八)總樓地板面積3000平方公尺以上之百貨公司及大型賣場。(九)其他經認定具有容易擴大延燒、有造成重大人命傷亡之虞或避難逃生困難等場所。三、問：為什麼要劃設消防通道?答：為確保地震、水災、火災等都市災害發生時，救援車輛（包括消防車、工程救險車、警備車等）及時前往災害現場，本府針對通往臺北市火災搶救困難地區救災必經之道路及臺北市既有道路寬度7.5公尺以下者，直接連接有人居住或使用之建築物之道路，其中救援車輛（消防車、工程救險車及警備車等）能順利抵達之區域（如巷口），距離有人居住或使用之建築物在140公尺以上之道路劃設消防通道實施禁停管制措施。因上述地區一旦發生意外事故，救援車輛若無法立即趕抵現場搶救，消防人員必需花很多時間忙於部署消防水線、攜帶救災裝備或運用移動式消防幫浦入內救災，將影響救災時效，並使災情擴大，極可能發生重大傷害。四、問：為何防火間隔(巷)不能劃設為消防通道? 答： 有關防火間隔(巷)規定於建築技術規則第110條、110-1條，係屬本市建築管理處權責事項，又防火間隔(巷)功能主要為確保鄰棟建築物或基地於火災發生時，火源不致蔓延至他處，非消防車輛通行主要道路。五、問：不符合消防通道劃設要件，是否可以申請劃設消防通道或禁停紅線? 答：不符合劃設消防通道之要件，但是仍有二種方式可以達到您建議的需求：(一)透過里鄰以社區民意調查方式劃設消通道：只要取得道路兩側住戶同意劃設為消防通道之比例超過兩側住戶總戶數百分之五十，即可由里長透過區公所向本局申請，劃設為消防通道。(二)逕向本市交通管制工程處申請劃設禁停紅線方式：請將資料寄至臺北市信義區松德路300號7樓；傳真方式電話為：2759-9724，另申請時請註明欲申請巷道名稱、申請原因及註明聯絡方式。六、問：發現消防通道違規停車，應向哪一單位反映處理？ 答：「消防通道」至少需保持3.5公尺以上淨寬，警察機關取締違規停車係以禁止紅線為執法要件，路面消防通道標字僅以告示用路人巷道歸屬類別，不具執法要件，消防通道劃設禁停紅線路段全天24小時禁止停車，並優先執行拖吊及告發，以利災害發生時供消防車輛第一時間接近執行救災任務，爭取救災時效。您如果發現違規停車請踴躍通報警察局：110。 七、問：劃設消防通道之依據規定為何? 答：本市劃設消防通道係依據「行政執行法」、「停車場法」、「道路交通管理處罰條例」、「道路交通安全規則」、內政部訂定「劃設消防車輛救災活動空間指導原則」及「臺北市消防通道劃設及管理作業程序」辦理。八、問：如何申請劃設消防通道之問題，可以至何處查詢或向哪一單位詢問？ 答：如果您有任何申請消防通道之問題，歡迎以下列方式查詢或聯絡詢問。（一）臺北市政府消防局網站http：//www.tfd.gov.tw（二）臺北市政府消防局災害搶救科1. 地址：臺北市信義區松仁路1號2. 電話：（02）2729-7668轉6314。3. 傳真：（02）2758-7579。4. 電子信箱E-Mail：tfd@tfd.gov.tw。九、問：何謂甲類場所? 答：甲類場所係指依據「各類場所消防安全設備設置標準」第12條第1款第1目所列用途之場所，包括戲院、電影院、歌廳、舞廳、夜總會、俱樂部、理容院、視聽歌唱場所、酒家（店）、保齡球館、集會堂、飯店、商場、醫院、三溫暖等場所。十、問：如何申請劃設（或塗銷）消防通道? 答：民眾可以書信郵寄至臺北市政府消防局(臺北市松仁路1號8樓)或傳真(02-27587579)至臺北市政府消防局，說明地點、檢附簡圖及留下聯絡方式，本府消防局將依據相關規定評估辦理。十一、 問：消防通道劃設禁停紅線原則為何? 答：消防通道未滿5.5公尺者，雙邊劃設禁止臨時停車紅線或標線型人行道；消防通道5.5公尺以上、未滿7.5公尺，單邊劃設禁止臨時停車紅線或標線型人行道；消防通道交岔路口10公尺範圍內及消防栓5公尺範圍內禁止停車，並劃設禁止臨時停車紅線或標線型人行道。十二、 問：為何消防通道寬度未滿5.5公尺雙邊禁止停車? 答：為利救援車輛執行防災救災任務，消防通道應保持3.5公尺以上淨寬，考量道路路邊停車所需寬度為2公尺，故未滿5.5公尺之道路若停車，道路淨寬將不足3.5公尺，影響消防車輛通行救災，所以應雙邊劃設禁止臨時停車紅線或標線型人行道。十三、 問：為何消防通道寬度5.5公尺以上，未滿7.5公尺，單邊禁止停車? 答：為利救援車輛執行防災救災任務，消防通道應保持3.5公尺以上淨寬，考量道路路邊停車所需寬度為2公尺，故5.5公尺以上，未滿7.5公尺之道路若雙邊停車，道路淨寬將不足3.5公尺，影響消防車輛通行救災，所以應單邊劃設禁止臨時停車紅線或標線型人行道。十四、問：消防通道為何要執行拖吊？ 答：為避免路邊違規停車影響救援車輛通行，妨礙救災任務執行，本府警察局對於消防局公告列管影響通往火災搶救困難地區巷弄道路(即「消防通道」)，於本市交通管制工程處繪設合法禁停標線後，即依法全日24小時嚴格執行取締告發、拖吊移置，以確保本市消防通道淨空，俾利救災車輛通行順暢。十五、問：為何21時後仍執行拖吊？答：依道路交通標誌標線號誌規則第169條規定，禁止臨時停車紅線禁止停車時間為全日24小時，另依管理違規停放車輛拖吊及保管作業規定，為確保本市消防通道淨空，本府依法全日24小時執行取締告發、拖吊移置，俾防患於未然。十六、問：請問如何查詢臺北市轄內消防通道地點、劃設範圍以及搶救困難地區？ 答：有關本市劃設消防通道之列管清冊，以及搶救困難地區均公告於消防局網站(網址為http：//www.119.gov.taipei，路徑：首頁>消防通道與火災搶救困難地區查詢)，並定期更新，歡迎您隨時上網查閱。十七、問：消防通道內紅線的禁止停車時間為何？（交通工程處提供）答：依道路交通標誌標線號誌設置規則169條規定，紅線禁止停車時間為全日24小時，如有縮短之必要時，應以標誌及附牌標示之。因此，除現場另有標誌及附牌標示外，紅線全日禁止停車。十八、問：巷道內禁停紅線劃設前是否有先告知？（交通工程處提供）答：為提前告知民眾該巷道已規劃為消防通道，本府消防局將於規劃完成先行公告周知2週並透過里鄰系統協助宣導。另本府交通工程處於施工劃設前將於巷道內張貼施工通知單，以告知民眾施工日期。十九、問：為配合執行消防通道禁停措施，有關停車供給有何因應措施？答：政府僅提供公共停車空間，住戶本身長時間之停車需要應自行提供，惟考量禁停管制措施實施後，私有停車需求短時間無法即予滿足，故本市停車管理處逐一檢討各消防通道周邊之公有路外立體、地下、平面、廣場及橋下等停車場之停車費率，除督促委外經營廠商推行夜間優惠月票或開放夜間免費停車外，本市停車管理處管轄之公有停車場亦實施新增出售夜間月票場數、調降夜間停車費率或夜間月票金額等措施，以優惠當地住戶，提供民眾夜間停車。另有關各行政區停車場資訊(含停車場地址、車位數、電話及費率等)，請上本市停車管理處網站(http：//www.pma.taipei.gov.tw/)查詢，市民可多加利用。二十、問：可否以制定發放停車證的方式，供特定住戶停放車輛?答：依交通部函示，現行禁止停車措施僅有禁停時段及路段之規定，並無授權得就社區居民及非社區居民有不同之管制規定。意即巷道停車空間係開放供公眾使用，社區居民不得專用，亦不得限制外來車輛停放。若制定發放停車證供特定住戶停車，而排除其他住戶或外來車輛，將產生公平性疑義。而社區停車證之制定發放亦須配合證件查核及冒用取締等管制措施，在現行法令條件未明之情形下，後續管理與執法於實務上有困難。因此制定發放停車證供特定住戶停放車輛暫不可行。二十一、問：可否提供本市公有路外公共停車場之相關資訊，供民眾查詢住家附近可利用之公有路外公共停車場?答：本市停車管理處提供最新「臺北市公有路外公共停車場一覽表」(含立體、地下、平面、廣場及橋下停車場)資料如附件，亦可至本市停車管理處網站(http：//www.pma.taipei.gov.tw)利用停車設施連結停車地理資訊查詢系統查詢相關停車場資訊。二十二、問：若巷子太窄消防車無法進入，如何搶救？答：倘若該巷道發生緊急事故，消防局將調派適當之消防救災車輛前往救援，現場道路寬度若足夠供消防救災車輛通行及操作，則將消防救援車輛直接駛入現場執行搶救任務，若因路邊停車致道路寬度不足供消防救援車輛通行及操作，消防救援車輛將停於附近適當交叉路口，再由消防人員部署消防水線進入搶救，以維護該區域民眾生命財產安全。
- - 如果學生接種當天身體不適沒有接種，還可以補打疫苗嗎?要收費嗎?
  - 可以，只需要攜帶『學生流感疫苗接種後注意事項』通知單（小叮嚀），至臺北市12區健康服務中心之院外門診部補接種(不需付費)，若前往本市其他流感合約院所接種則需付掛號費及診察費。如為國小一至六年級學生另需攜帶兒童健康手冊。
- - 具本國籍但不具本國學籍之學生，可以接種政府公費疫苗嗎？
  - 不行，須自費接種流感疫苗。
- - 哪裡可以買到平價保險套?保險套的價格為多少?
  - 由社區藥局延續臺北市健康服務中心提供販售平價保險套服務，售價為每打25元，詳細藥局名單可至臺北市政府衛生局網站上查詢。
