- - 交通維持捷運萬大線南昌路人行道削減作業，發現水溝壁體為台北城牆石組成，後續處理方式為何？
  - 立即停工並通報文化局辦理現場會勘，諮詢專家學者擬定處理原則如下：   開挖範圍外水溝城牆石測繪後現地保留不擾動。   開挖範圍內水溝城牆石配合工程需要挖掘保存，後續的石材再利用或展示，配合復舊時程另案提送台北市文資審議委員會專案討論後再據以執行。 
