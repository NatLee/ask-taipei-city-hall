- - 哪裡可以接種幼兒常規疫苗？
  - 1.臺北市預防接種合約醫療院所可至衛生局網站  (http：//health.gov.taipei/default.aspx/主題專區/疾病防治/預防注射）查詢2.或臺北市立聯合醫院附設12區院外門診部。
- - 自國外帶寵物回國，後續追蹤檢疫工作可以在那些獸醫診療機構進行?
  - 本市現合作辦理輸入犬貓追蹤檢疫之獸醫診療機構，分佈於12行政區，名冊請參查：本處網站╱業務資訊╱統計資料╱105年起臺北市委辦輸入犬貓追蹤檢疫獸醫診療機構分區名冊。飼主可選擇方便帶去的動物醫院完成後續追蹤檢疫工作。
- - 請問本公司要辦理動物用藥品販賣業許可證，需要填寫哪些文件？
  - 一、申辦動物用藥品販賣業許可證資格如下（需設立於本市）：1.獸醫診療機構2.農會、漁會、農業合作社3.一般公司行號（製造業、輸出入業及批發零售業）二、如您具備以上任一資格，請準備以下資料：分為基本附件及業別附件。1.基本附件：(1)申請書1份。(2)身分證影本2份。(3)藥品管理技術人員專門職業證書正本（於蓋章後發還）及影本(正反面)各1份。一般為獸醫師證書或藥劑師證書。(4)販賣營業場所設置平面圖1份，形式不拘，惟請明確劃分藥品放置及存放處及住家、不清潔處（所）（如浴廁、廚房、廚餘桶、堆肥場、溝渠、垃圾場、污水處理槽等）等區域，請以中文正楷書寫區域標示，以備本處派員現場稽查勘驗使用。2.業別附件，請依()內申請資格選擇：(1)獸醫診療機構開業執照及獸醫師(佐)執業執照影本1份（獸醫診療機構）。(2)藥品管理技術人員在職證明正本及專任聘用切結書正本各1份（農會、漁會、農業合作社、製造業、輸出入業、批發零售業）。(3)農會、漁會、農業合作社證明文件影本1份（農會、漁會、農業合作社）。(4) 工廠登記相關證明文件影本1份（製造業）。(5)商業登記文件（例如：商業登記資料查詢下載之公示資料）影本1份（製造業、輸出入業、批發零售業）。(6)公司登記文件〔例如：公司設立（變更）登記表〕影本1份（輸出入業）。(7)進出口貿易商許可證（國貿局廠商基本資料）影本1份（輸出入業）。影本請蓋用公司大小章以便核對。三、請填妥申請表格後，將應備附件郵寄或親送至臺北市動物保護處（臺北市信義區吳興街600巷109號）。受理申請期間為六個日曆天。核准後將發函通知至本處領證，並繳交證書費用新臺幣1,000元。相關文件格式，請至臺北市民e點通下載，網址：http：//www.e-services.taipei.gov.tw/hypage.exe?HYPAGE=form.htm&s_uid=011042
- - 辦理同性伴侶註記之後，其他縣市戶政人員能查詢到嗎？
  - 全國任一戶政事務所的戶政人員都能查詢到該註記。
- - 寵物食品包裝標示不清或不完整有法可管嗎?
  - 有的，為保護寵物之生命健康及維護寵物飼主之權益，104年2月4日動物保護法已將寵物食品衛生管理規範納入其中，依據動物保護法第22-5條：寵物食品應以中文及通用符號於容器、包裝或說明書之上顯著標示規定應標示事項及內容。如有違反第22-5條第1項有關標示規定，即限期令其改善，屆期未改善者處新臺幣3萬元以上15萬元以下罰鍰。
- - 辦理何項業務時可同時於戶政事務所申辦健保卡？
  - 104年7月1日起，正式啟動「戶政事務所跨機關通報健保卡資訊平台」，民眾至戶政事務所辦理以下事項時，可同時申請健保卡初、換、補發服務，健保署將於7個工作日內寄送健保卡至指定地址：1.新生兒出生登記：可同時申辦新生兒「依附投保」及「製作無照片健保卡」服務。2.身分資料變更登記：於戶政事務所辦理姓名、出生年月日及國民身分證統一編號變更時，可同時申辦「換發健保卡」服務。3.國民身分證及健保卡同時遺失：於戶政事務所辦理補發國民身分證時，可同時申辦「補發健保卡」服務。※換、補發健保卡申請須繳納工本費200元，請記得持繳款單至ATM轉帳或向金融機構、4大便利商店臨櫃繳納。
- - 如何申請同性伴侶註記？
  - 凡年滿20歲單身且其中一方在國內現有戶籍，並有同性伴侶註記需求的民眾，雙方親自攜帶身分證明文件、印章（或簽名）及符合國民身分證規格之最近二年內所攝正面半身彩色相片電子檔到臺北市任一戶政事務所辦理。當事人一方非本國人者，另應查驗取用中文姓名聲明書及經駐外館處驗證之婚姻狀況證明文件（含中文譯本，並應由駐外館處驗證或國內公證人認證之）。
- - 辦理同性伴侶註記之後，該註記內容會在國民身分證、戶口名簿及戶籍謄本上顯示嗎？
  - 於同性婚姻法制化前，戶政機關尚無法律依據予以登記，所以該註記內容均不會在國民身分證、戶口名簿及戶籍謄本上顯示。
- - 辦理同性伴侶註記之後，戶政事務所會提供證明文件嗎？
  - 同性伴侶如有申請曾到戶所註記紀錄的需求，當事人一方可親自攜帶身分證明文件及印章（或簽名）向臺北市任一戶政事務所申請，戶政事務所會以公文方式回復。另臺北市任一戶政事所自105年12月26日起核發「同性伴侶證」給申辦註記的同性伴侶，方便同性伴侶對外證明其關係及各機關查證註記之事實。
- - 辦理同性伴侶註記之後，其他機關能查詢到嗎？
  - 因該註記於同性婚姻法制化前，尚不屬於戶籍登記，所以其他機關是無法查詢到的。但是當事人可另外填寫「個人資料查詢同意書」，同意於必要時由其所指定之機關，例如醫療院所、社會福利機構、警察單位或其他等，得向臺北市任一戶政事務所查詢此註記內容，保障個人權益及避免個資外洩。
- - 辦理同性伴侶註記之後，當事人一方能申請他方的戶籍謄本嗎？
  - 由戶政機關就個案情形依戶籍法第65條及申請戶籍謄本及閱覽戶籍登記資料處理原則第2點規定，本於權責自行審認之。
- - 辦理同性伴侶註記之後，該註記內容會永久有效嗎？
  - 該註記內容原則上永久有效，但如有單方親自向臺北市任一戶政事務所申請刪除或當事人嗣後已結婚、死亡該註記內容就會刪除。
- - 如何刪除同性伴侶註記？
  - 當事人一方親自攜帶身分證明文件、印章（或簽名）及同性伴侶證到臺北市任一戶政事務所辦理，再由該戶政事務所以公文通知他方知悉。
- - 農業主管機關受理申請容許使用證明文件和核發許可登記證的收費標準為何？
  - 依據「農業主管機關受理申請許可案件及核發證明文件收費標準」規定，申請農業設施之容許使用者，每項設施收取新臺幣200元；申請核發或換發簡易型（或體驗型）休閒農場許可登記證者，每件收取新臺幣5,000元；申請核發或換發設置住宿、餐飲、自產農產品加工（釀造）廠、農產品與農村文物展示（售）及教育解說中心等相關設施之休閒農場許可登記證者，每件收取新臺幣10,000元。
- - ●大陸就學：「我國男子出境至大陸地區就學，要符合的學歷及年齡條件？」
  - (一)必須是就讀學士、碩士或博士學位(專科及高中以下學歷皆不符規定)。(二)不具備臺商(或臺商員工）之子身分者：應就讀中華民國教育部所採認之大陸地區大學校院正式學歷學校及科系，且須於99年9月3日學歷採認生效後入學就讀。(三)具備臺商(或臺商員工）之子身分者：就讀上述學校或大陸地區教育主管機關立案之學歷學校皆可(即非就讀我教育部學歷採認生效之校系亦可)。(四)大學至24歲、研究所碩士班至27歲，博士班至30歲。但大學學制超過4年者，每增加1年，得延長就學最高年齡1歲，畢業後接續就讀碩士班、博士班者，均得順延就學最高年齡，其順延博士班就讀最高年齡，以33歲為限。以上均計算至當年12月31日止。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●役男出境：「除已履行兵役義務之役男外，已被核定免役、禁役或已完成補充兵訓練，領有免役、禁役或補充兵證明書之役男，與一般役男申請出境，有何不同？」
  - 除已履行兵役義務之役男外，經核定免役、禁役或已完成補充兵訓練，領有免役、禁役或補充兵證明書之役男，不受役男出境處理辦法的限制，出境時不需辦理核准手續。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●役男出境：「國內大學(含)以上在學役男，可否出國修讀「雙聯學位」？如何申請？如果超過期限返國，會受到什麼樣的處罰？」
  - (一)國內大學在學役男修讀與國外大學合作授予學士、碩士或博士學位之課程申請出境者，最長1次不得超過2年；其申請核准出境就學，依國內學士、碩士或博士學程分別為之，且返國期限截止日，不可以超過國內在學緩徵年限(即國內就讀學校畢業後即不可再修讀雙聯學位)。(二)以上情形由在學役男國內就讀之學校以公函造冊並檢附相關證明文件，向戶籍地直轄市、縣（市）政府提出申請，經核准後，役男(或委託親友)應於出境前1個月內持核准函及護照正本，到戶籍地區公所兵役課或全國各直轄市、縣(市)政府、鄉(鎮、市、區)公所役政單位加蓋出國核准章，憑以出境。(三)役男出境逾規定期限返國者，依規定「不予受理返國當年及次年出境之申請」。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●役男出境：「國內大學(含)以上在學役男，可否經由學校奉派或推薦以研究、進修、表演……等名義申請出境？如何申請？如果超過期限返國，會受到什麼樣的處罰？」
  - (一)國內在學役男因就讀學校奉派或推薦出國研究、進修、表演、比賽、訪問受訓或實習等原因申請出境者，最長1次不得超過1年；以研究、進修之原因申請出境者，學士、碩士或博士各學程以2次為限；其申請核准出境就學，依國內學士、碩士或博士學程分別為之，且返國期限截止日，不可以超過國內在學緩徵年限(即國內就讀學校畢業後即不可再奉派或推薦出國)。(二)以上情形由在學役男國內就讀之學校以公函造冊並檢附相關證明文件，向戶籍地直轄市、縣（市）政府提出申請，經核准後，役男(或委託親友)應於出境前1個月內持核准函及護照正本，到戶籍地區公所兵役課或全國各直轄市、縣(市)政府、鄉(鎮、市、區)公所役政單位加蓋出國核准章，憑以出境。(三)役男出境逾規定期限返國者，依規定「不予受理返國當年及次年出境之申請」。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●國外就學：「我國男子出境國外（含香港、澳門）就學，要符合的學歷及年齡條件？」
  - 高中以上大學以下學歷（含語文學校）者至24歲、研究所碩士班至27歲，博士班至30歲；但大學學制超過4年者，每增加1年，得延長就學最高年齡1歲，畢業後接續就讀碩士班、博士班者，均得順延就學最高年齡，其順延博士班就讀最高年齡，以33歲為限。以上均計算至當年12月31日止。(例：80年次王男就讀美國某大學建築系學制5年，則其大學可以就讀至25歲，研究所至28歲，博士班至31歲，以此類推。惟請注意，只有大學學制延長才可以往後順延喔！)如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - 今年度大稻埕音樂情人節何時舉辦?
  - 2015臺北大稻埕音樂情人節活動時間為8月15日星期六15時至21時30分，並於晚間20時30分進行煙火施放(總長約10分鐘)。
- - ●國外就學：「兵役法施行法第48條第1項第5款所指的國外學校，是否包括語文學校、先修班或社區學院的語言班？」
  - 「國外學校」係指當地國教育主管機關立案之高中以上學歷學校(含語文學校）或國外的大學、專科的學校或獨立學院(含語言班、先修班)。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●國外就學：「原在國內學校就學之役男，於19歲(含)以後第1次申請出境國外就學，應準備哪些證明文件？向哪個機關申請？應填申請書表格式？處理時限？」
  - (一)檢附赴國外就讀經當地國教育主管機關立案之高中以上學歷學校(含語文學校)出具之入學許可(如非英文請加附中文譯本，皆可免驗證)及護照正本；高中以上大學以下學歷者(含語文學校)至24歲、研究所碩士班至27歲，博士班至30歲。(其餘學歷及年齡順延規定請參考前述)(二)於開學前3個月內向移民署各縣市服務站提出申請。(臺北市服務站：臺北市廣州街15號)(三)臨櫃填寫役男出國申請書。(四)上班時間內「隨到隨辦」。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●國外就學：「役男出境國外就學，如因入學許可尚未備妥，該如何處理出境事宜？順利出境後應如何處理兵役問題？」
  - (一)先依據「役男出境處理辦法」第4條第1項第7款規定，逕至臺北市政府兵役局網站（http：//docms.gov.taipei/）線上申請出境，或至戶籍地區公所臨櫃辦理，經獲准後持憑印出之核准通知單及護照出境。(二)待返回國外就讀學校，取得已在國外學校就讀且符合就讀學歷及年齡規定之「在學證明」，經我國駐外館處驗證後，儘速寄回臺灣。(三)由在臺之成年親友檢附上述經驗證之在學證明(含中文譯本、可免驗證)、代理人身分證、印章等向戶籍地鄉（鎮、市、區）公所兵役單位申請「變更出境身分及事由」。(四)申請變更出境身分及事由獲准後，始得回復國外就學身分，繼續在國外就讀並完成學業；若經申請後無法獲准，則須依規定返國履行兵役義務。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●國外就學：「出境國外就學役男返國探親或度假可停留多久？期限屆滿後可否延期？」
  - (一)返國期限每次不得逾3個月。(二)停留期限屆滿，須延期出境者，依下列規定向移民署各縣市服務站辦理，最長不得逾3個月：1.因重病、意外災難或其他不可抗力之特殊事故，檢附就醫醫院診斷證明書及相關證明，申請延期出國。2.因就讀學校尚在連續假期間，應檢附經驗證之就讀學校所開具之假期期間證明(請學校寫明開學日)，申請延期出國。3.在國內停留期間最長自入國之翌日起不得逾6個月；逾6個月者移民署不受理申請。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●國外就學：「開立在學證明應注意事項」
  - (一)在學證明內容應包括：1.學生姓名英文拼音應與護照上姓名拼音相同。2.學生出生年月日。3.何時入學或正式上課日期。4.修習高中以上正式學歷課程內容。5.修業年限或何時畢業。(二)在學證明未註明就學年限之役男，須檢附入國之日起算前3個月內，經駐外館驗證之在學證明正本（限單次使用），送由移民署各縣市服務站收繳。(三)在學證明已註明就學年限之役男，除檢附經外館驗證之在學證明正本（於就學期間內可多次使用），須另檢附同一學校之下列文件之一（均不必再驗證）：1.上學期成績單。（指學期結束返國時之前一學期，而非甫結束之學期）。2.尚未逾繳費截止日期之繳費通知單。（指尚未開學，且正要開學的那一學期）。3.逾繳費截止日期之當（下）學期（年）繳費通知單及匯款單。4.回國前確曾在同一學校就學之證明。（如學分證明、入國之日起算前三個月內由就謮學校開立之在學證明、新的學生簽證）。(四)移民署出境就學諮詢專線有關役齡男子出境國外(或大陸地區）就學規定疑義，內政部移民署設有諮詢專線，電話為886-2-23883929；傳真號碼為886-2-23899036。出境就學役男，可先將在學證明等相關資料，利用時間先行傳真移民署，俟國內上班時間再以電話專線聯繫。倘告知符合規定後，再將文件送轄區我駐外館處驗證，以節省信件往返時間及減少返國後無法再出國的困擾。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●大陸就學：「原在國內學校就學之役男，於19歲(含)以後第1次申請出境至大陸地區就學，應準備哪些證明文件？向哪個機關申請？應填申請書表格式？處理時限？」
  - (一)應備證明文件(具下列條件之一)：  1.就讀我教育部所採認之大陸地區大學校院正式學歷學校及科系者：檢附入學許可(可免驗證)  2.以臺商(或臺商員工）之子身分就學者：    (1)我經濟部投資審查委員會核准赴大陸地區投資的證明(經濟部投審會核准函正本，驗畢歸還)及父或母在臺商公司之任職證明(任職證明需經大陸公證處公證及臺灣海基會驗證)。    (2)就讀大陸地區教育主管機關立案之學歷學校入學許可(可免驗證)。(二)於開學前3個月內向移民署各縣市服務站提出申請。(三)臨櫃填寫役男出國申請書。(四)上班時間內「隨到隨辦」。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●大陸就學：「役男出境大陸地區就學，如因入學許可尚未備妥，該如何處理出境事宜？出境後又應如何變更為出境就學身分，俾在大陸地區順利就學？」
  - (一)先依據「役男出境處理辦法」第4條第1項第7款規定，逕至臺北市政府兵役局網站(http：//docms.gov.taipei/）線上申請出境，或至戶籍地區公所臨櫃辦理，經獲准後持憑印出之核准通知單及護照出境。(二)待返回大陸地區就讀學校，取得符合大陸地區就學規定之在學證明(以臺商或臺商員工之子身分就學者，應附之證明文件請參閱上述Q2)，經大陸地區當地公證處公證後寄回臺灣親友，再由臺灣親友持往海基會再驗證1次。(三)由在臺之成年親友檢附上述證明文件及代理人身分證、印章向戶籍地鄉(鎮、市、區)公所兵役單位申請「變更出境身分及事由」。(四)申請變更出境身分及事由獲准後，始得回復大陸地區就學役男身分，繼續在大陸地區就讀並完成學業；若經申請後無法獲准，則須依規定返國履行兵役義務。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●大陸就學：「就讀我教育部所採認大陸地區大學校院正式學歷學校及科系之役男，返臺後應如何辦理再出境？向哪個機關申請？應填申請書表格式？處理時限？」
  - (一)應提憑在大陸修習學士、碩士或博士學位之在學證明(在學證明須經大陸公證處公證、臺灣海基會驗證)(二)向移民署各縣市服務站申請。(三)臨櫃填寫役男出國申請書。(四)上班時間內「隨到隨辦」。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●大陸就學：「出境大陸地區就學役男返國探親或度假可停留多久？期限屆滿後可否延期？」
  - (一)返國期限每次不得逾3個月。(二)停留期限屆滿，須延期出境者，依下列規定向移民署各縣市服務站辦理，最長不得逾3個月：1.因重病、意外災難或其他不可抗力之特殊事故，檢附就醫醫院診斷證明書及相關證明，申請延期出國。2.因就讀學校尚在連續假期間(未開學)，應檢附經驗證之就讀學校所開具之假期期間證明，申請延期出國。3.在國內停留期間最長自入國之翌日起不得逾6個月；逾6個月者移民署不受理申請。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●大陸就學：「就讀大陸地區臺商學校之役男，在該等學校就學期間，返臺後可否申請再出境前往大陸地區完成學業？」
  - 就讀大陸地區經我教育部備案設立之臺商學校（華東、東莞、上海等3所臺商高中）之役齡男子，於該等學校就學期間，返臺後准予檢具由就讀學校出具之在學證明(由就讀學校核蓋業經驗證章)及護照正本，直接向移民署各縣市服務站申請再出境，前往大陸地區繼續完成學業；惟就讀臺商學校畢業後之入出境，應依兵役法施行法第48條第3項及役男出境處理辦法第5條第4項之規定辦理(請參閱上述出境大陸地區或國外就學規定)。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - ●出境就學：「未免除兵役義務之役男出境就學後，是否仍要返國履行兵役義務？役政單位如何處理其後續兵役問題？」
  - (一)兵役法並未規定役男出國後未返國就不必履行兵役義務，放寬出境就學並不代表役男因此不用返國履行兵役義務，且立法院外交及國防委員會103年3月31日第8屆第5會期第7次全體委員會議之臨時提案決議，有關役男赴國外或大陸地區就讀大學、研究所碩士班、博士班之人數應確實掌握。(二)役男出境就學後，役政單位會依其就讀學程(學士、碩士、博士)，通知其繳交在學證明文件，如其就學不符合就讀學歷及就學最高年齡限制規定者，役政單位將依「役男出境處理辦法」第13條規定，催告渠等於6個月內返國，如仍未返國接受徵兵處理者，將檢具相關證明文件，依妨害兵役治罪條例規定，移送法辦，以維護兵役制度之公平。如有任何疑問，請洽兵調體檢科，聯絡人：呂霈霖，聯絡電話：23654361分機112，臺北市民當家熱線：1999。
- - 目前臺北市是否有辦理104年「職類別薪資調查」、「受僱員工薪資調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「職類別薪資調查」、「受僱員工薪資調查」係分別由勞動部統計處及行政院主計總處主辦，各縣市政府為協辦機關，負責辦理各該轄區之調查業務。二、職類別薪資調查之調查期間自104年8月1日起至8月31日止，受僱員工薪資調查之調查期間自104年8月至105年7月按月填報。凡從事礦業及土石採取業、製造業、電力及燃氣供應業、用水供應及汙染整治業、營造業、批發及零售業、運輸及倉儲業、住宿及餐飲業、資訊及通訊傳播業、金融及保險業、不動產業、專業科學及技術服務業、支援服務業、補習教育業、醫療保健服務業、藝術娛樂及休閒服務業、其他服務業等之公、民營事業場所單位均為調查對象。三、職類別薪資調查之目的為蒐集各行業及職類別受僱員工人數、薪資水準、廠商規定工作時間、初任人員經常性薪資給付等資料，供為政府修訂法規、釐訂施政計畫及業者訂定員工薪資、增進員工福祉等參據。受僱員工薪資調查之目的為了解臺灣地區受僱員工人數、薪資、工時、員工進退情形，供為研訂經建計畫及產業政策之參據。旨揭調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請受訪廠商支持合作，提供正確詳實資料。四、職類別薪資調查結果請逕至勞動部網站（http：//www.mol.gov.tw）「勞動統計專網/統計資料庫查詢」項下查詢。受僱員工薪資調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw） 「政府統計 / 主計總處統計專區 / 薪資及生產力統計 / 統計表 / 受僱員工薪資調查統計」項下查詢。
- - 臺北大稻埕音樂情人節當日周邊交通管制情形為何?
  - (一)活動周邊道路交通管制1.第一階段：8月15日18時30分至23時，管制範圍北至涼州街（不含涼州街）、東至延平北路-塔城街-西寧南路(不含延平北路、塔城街、西寧南路)、 西到環河南、北路（含道路）以東、南起開封街(不含開封街)，禁止車輛通行。2.第二階段：8月15日20時至21時30分，管制如下：(1)忠孝橋雙向車道管制。(2)重慶南路及西寧北路上忠孝橋處封閉。(3)市民高架橋道路，東往西車輛一律下建國北路匝道(4)臺北轉運站匯入匝道配合封閉。(5)忠孝西路於重慶南路口、中華路口、塔城街口全面管制車輛往西行駛，西寧南路口全面管制車輛往西及往北行駛。(6)承德路民生西路口設置管制點（20時50分至22時，以利人潮疏散），禁止車輛往西行駛。(二)忠孝橋交通管制為確保安全，8月15日當日20時至21時30分忠孝橋淨空。1.人行道：(1)北側人行道因煙火施作，自8月13日8時起至8月16日12時管制行人通行，行人改走南側上橋。(2)8月15日20時至21時30分煙火施放時忠孝橋全部淨空，南側人行道並禁止行人上橋。2.機慢車：8月15日20時至21時30分管制機、慢車上橋，導引改行中興大橋。(三)水門管制措施1.車輛管制：8月15日6時起3-5號水門管制，車輛只出不進；淡1、淡3、淡5號水門17時30分起至23時，車輛皆不能進出。4號水門為緊急應變通道，17時至23時封閉。2.自行車管制：8月15日14時至23時1-6號水門、臺北大橋由新北市引入之自行車道斜坡入口及社子島入口自行車道處管制進入通行。3.行人管制：8月15日18時30分至23時，迪化污水處理場大地重現人行天橋淨空。(四)停車管制措施1.3號至5號水門間堤外停車場8月15日6時至23時淨空。堤外道路停車格8月15日6時至23時取消。2.民生西路（延平北路至重慶北路段）路邊停車格8月15日12時至23時取消及禁止臨時停車。3.民生西路（環河北路至重慶北路）、延平北路（民權西路至忠孝西路）8月15日12時至23時取消假日黃線停車，禁停黃線路段及法定禁止臨時停車處延長違規停車拖吊時間至當日23時止。4.活動期間忠孝大橋、臺北大橋、環河快速道路及周邊道路加強違規停車取締，對緩行逗留車輛會管制驅離。5.西寧南路(忠孝西路至開封街)及開封街(環河南路至中華路段) 8月15日12時至23時路邊停車格取消。6.鄭州路北側(西寧北路-塔城街)、勞動部(延平北路2段83號)及民生西路(3巷至45巷)，8月15日12時至23時取消機車停車格(人行道上及騎樓機慢車停放區)。(五)船班管制：8月15日當日15時藍色水路船班駛離大稻埕碼頭，至23時始得停泊。
- - 臺北大稻埕音樂情人節是否有接駁公車可供民眾搭乘?
