- - 可由何處查詢臺北市殯葬管理處服務項目及申請書表？
  - 臺北市殯葬管理處受理人民申請計「訂租治喪禮堂」、「接運遺體」、「火化爐」、「靈柩寄存」、「低收入戶(無親屬)喪葬補貼」、「靈骨(灰)寄存」、「使用墓地」、「修墳、遷葬」、「埋（火）葬許可證」等項目，相關申請書表可由本處網頁的「我們的服務與設施」- 「各式申請表單下載(點此可直接連結)」-> 「臺北市民e點通 - 殯葬服務項目」 網頁中查詢。
- - 先人參加環保葬後，請問是否有對亡者追思之紀念方式？
  - 臺北市殯葬管理處設有生命追思紀念網：http：//w6.mso.taipei.gov.tw （亦可由本處網站首頁連結至生命追思紀念網），使用者於紀念網頁填妥基本資料，再至註冊信箱點選登入網頁完成新帳號申請，即可於個人追思紀念網頁六大區包括：「個網公告」、「個人檔案」、「生平事蹟」、「生活相簿」、「無盡的思念」、「追思留言」建置資料，線上追思逝者。
- - 大巨蛋公安相關議題
  - Q1：停工—為什麼要遠雄停工？A：(1)依據建築法第58條︰建築物在施工中，主管建築機關認有必要時，得隨時加以勘驗，發現主要構造或位置或高度或面積與核定工程圖樣及說明書不符者，應以書面通知承造人或起造人或監造人，勒令停工或修改。(2)2015年5月14日，現場勘驗過後發現有高達三分之二樓層的主要構造未按圖施工。(3)2015年5月20日，市政府負起監督責任，勒令停工。Q2：公安—大巨蛋停工後的公安問題，由誰負責？A：(1)依據建築法第63條，公安問題由承造人遠雄營造及監造人羅興華建築師負起工地安全維護之責任。(2)停工後，遠雄和羅興華建築師已申請先行報備施工，並且在2015年8月完成大底工程，經過土木技師公會、結構技師公會、大地技師公會及建築師公會等單位，判讀遠雄所提供資料，認為基地暫無上浮力問題。(3)基於工地安全，於2016年4月26日再度邀集專家研討，並要求遠雄提供監測資料，確保無公安問題。Q3：7項公安基準—市府為何針對大巨蛋提出7項公安基準？A：(1)大巨蛋園區量體龐大，超出現行法令規定，市府有必要提出7項公安基準降低災害風險。(2)市府成立安檢小組，考量國際安全標準及案例，歸納出這7項公安基準。(3)7項公安基準中，3項由營建署授權臺灣建築中心性能評定審查，4項由臺北市政府依都市計畫定期通盤檢討實施辦法第9條，及開發行為環境影響評估作業準則第26條審查。(4)大巨蛋是有史以來規模最大的複合式商業園區，市府有責任保障每位市民的安全。Q4：鏽蝕—大巨蛋是否有鏽蝕？誰的問題？A：(1)依據建築法第63條，公安問題由承造人遠雄營造及監造人羅興華建築師負起工地安全維護之責任。(2)大巨蛋鋼構架如有鏽蝕問題，是承造人遠雄和監造人羅興華建築師應該負起的公安責任。(3)遠雄營造和羅興華建築師應持續進行維護安全、防範危險的措施，避免發生公安問題。(4)遠雄應依法維護工地安全，不應推卸責任，市府將持續監督。
- - 1999市民熱線回復方式
  - 1999市民熱線案件，成案後會提供案件編號與密碼（民眾可手寫下來或請話務人員簡訊傳送），案件回復方式有以下3種：一、系統回復：權責機關將辦理情形回復於臺北市政府單一陳情系統（網址：https：//hello.gov.taipei），操作說明請參考：https：//goo.gl/QAOAe5。 二、電子郵件回復：請民眾提供e-mail給話務人員。三、書面回復：請民眾提供地址給話務人員。一般為系統回復，如需電子郵件回復或書面回復可再告知話務人員。民眾如選擇電子郵件、書面回復，仍可至臺北市政府單一陳情系統（網址：https：//hello.gov.taipei），查詢辦理情形。
- - 如何前往松山文創園區
  - 捷運搭乘捷運至板南線國父紀念館站5號出口出站，沿光復南路步行約550公尺，抵達菸廠路入口。公車可搭乘212、212夜、212直、232、232副、232快、240直、263、270、299、忠孝新幹線至聯合報站下車，沿553巷步行至園區。或搭乘204、212、212夜、212直、232、232副、232快、240直、240、254、266、266區、278、278區、282、288、288區、299、672、忠孝新幹線至捷運國父紀念館站下車沿光復南路步行至園區。自行開車由市民大道於光復南路閘道口下，往菸廠路駛入。惟因周遭停車較為困難，建議多多搭乘大眾運輸系統前往。
- - 目前臺北市是否有辦理「人力運用調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「人力運用調查」係由行政院主計總處主辦，委由各縣市政府主計處執行訪查作業。二、「人力運用調查」調查期間為105年5月22日至5月31日，調查資料標準時間為105年5月15日起至5月21日止，調查對象為資料標準時間內居住於臺灣地區之普通住戶與共同事業戶，其戶內年滿15 歲，自由從事經濟活動之本國籍民間人口為主。三、該調查主要目的係為配合臺灣地區社會經濟發展需要，蒐集勞動力運用、移轉及就業、失業狀況等短期變動資料，供為訂定人力政策、推動職業訓練、性別平權與改善企業經營等決策之參據。依統計法第45條規定，調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作，據實回答。四、該調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw/）「政府統計」項下之「主計總處統計專區」項下之「其他專案調查」項下之「人力運用調查」項下之「統計分析」查詢。
- - 如何申請建國假日藝文特區攤位？
  - 有關建國假日藝文特區申請設攤事宜，依「臺北市建國假日藝文特區輔導管理辦法 」第六條規定，申請藝文特區攤位展售許可，應檢具申請書、身心障礙手冊或證明影本、國民身分證影本及市場處規定之其他文件向市場處申請，商品展售項目須與藝文相關且不得為飲食類亦不得使用明火。（如果還有其他任何相關問題，請來電洽詢臺北市市場處攤販科，聯絡電話：（02）2341-5241分機2407）
- - 請問參加海葬需要繳交費用嗎？
  - 海葬過程含骨灰再研磨、骨灰暫厝30天、莊嚴追思儀式、家屬搭車及搭船、茶水點心、保險及安全等服務，以上均全程免費。
- - 請問海葬實施程序為何？
  - (1)追思儀式：假第一殯儀館景行廳舉辦隆重莊嚴的追思儀式，(2)搭車至碼頭：追思儀式完成後，再搭乘巴士至海岸碼頭。(3)安檢：配合海岸巡防總局於出海碼頭完成安檢程序。(4)搭船出海：完成安檢程序後搭乘載客船隻出海，行駛至港口防波堤最外端向外延伸6,000公尺之海域。(5)海葬實施：由家屬先對先行者告別祈福，再由家屬將「安息盒」（骨灰以易自然分解且不含毒性成份之環保棉紙袋包裹盛裝後，置放於安息盒中）伴隨鮮花及花瓣拋灑入海，於眾人默禱下，目送骨灰沉入海中。
- - 請問亡者戶籍是外縣市民眾，可以報名參加聯合海葬嗎？
  - 參加聯合海葬不限國籍及戶籍均可報名。
- - 請問受葬者之戶籍在臺北市，但火化非在本火化場火化，是否要檢附骨灰處理文件?
  - 戶籍在臺北市，但骨灰火化在其他縣市完成的，為確定受葬者的身分，仍請申請人提出亡者之火化許可證明及骨灰經再處理相關證明文件影本供本處備查。如骨灰未經再處理者，可至臺北市第一、二殯儀館協助再處理。
- - 臺北市立陽明教養院接送交通車
  - 【住宿】本院自101年2月起針對住宿院生實施全日型服務，並於105年3月15日起，執行通勤轉住宿推行親情關懷措施，鼓勵家屬來院探視、定時接返院生，以維繫院生與家屬之親情，共享天倫之樂。【返家定點接駁服務】本院至捷運圓山站線(含西門站)、劍南路站線(含港墘站)交通車，每週五、週六下午由本院發車返家，週一上午發車返院。社工課連絡方式：(02)2861-1380 轉分機109 劉社工員
- - 如欲參加聯合奠祭是否有戶籍限制？外國人可否參加？
  - 本處聯合奠祭自103年1月1日起無設籍限制，也沒有國籍限制，自死亡日或遺體具領日起15日內申請登記參加最近一場次聯合奠祭者，其費用均僅須支付「火化許可費用」新臺幣50元即可；其餘費用全免（惟外縣市不含遺體接運費）。
- - 請問遺體火化至撿骨需要多久時間？
  - 火化時間約需90分鐘,依大體實際情形略有增減,冷卻及整理約需15分鐘。
- - 火葬時間可否使用電子儀器顯示預定時間？
  - Q：火葬時間可否使用電子儀器顯示預定時間？A：本處業已自98年7月份起於火葬場設立電子顯示火化爐使用情形。
- - 公墓區遼闊如何找到正確墓區？
  - 殯葬處已於墓區規劃施作全區導覽牌與區排號標示牌，提供民眾辨識。
- - 遺體可否土葬？要如何辦理？
  - 本市全面禁止土葬，除死亡者為本市市民外，得申請使用富德公墓墓基埋葬遺體（墓基使用年限為7年，另陽明山第一公墓僅限民國72年以前申請預留有案壽穴始得使用）。申請應檢附下列文件，至富德公墓辦公室（電話：27887513，傳真：27882421）；陽明山第一公墓辦公室（電話：28912083，傳真：28950531）辦理，約需2天工作日：   1. 墓地使用申請書。   2. 死亡證明書或相驗屍體證明書2份。   3. 申請人身分證（正本驗退、影本留存）、私章。   4. 委託申辦者，需附業者公會識別證影本及委託書1份。備註：   1. 受理郵寄申請案件經審核必備文件無誤後，聯繫申請人勘定墓位，並依規定繳費。   2. 陽明山第一公墓僅限預留有案壽穴始得申請使用。   3. 委託申辦者，請親自簽名。
- - 臺北市目前有幾處私立靈骨樓（塔）？位置各在哪裡？
  - 臺北市目前僅有1處私立合法納骨設施，慈恩園誠業股份有限公司所有之慈恩園寶塔。其塔址為：台北市和平東路三段631巷49號、電話：（02）2378-3345。
- - 臺北市立陽明教養院篩檢吞嚥困難院生及提高用餐安全的方式為何?
  - 可透過下列所列7項主要/次要觀察指標及搭配4項其他相關徵兆，作為篩檢吞嚥困難之依據，詳細內容如下：一、主要觀察指標：1.吞後食物仍會殘留在口腔內，無法吞乾淨2.食物容易卡在喉嚨，甚至異物梗塞，或很難或無法吞下3.每口食物需分多次才能吞乾淨(重複或多次的吞嚥動作)4.進食期間或進食完不久出現咳嗽或嗆咳5.進食中、進食完(包括喝水、吃東西)，發聲會有混濁的咕嚕聲二、次要觀察指標：1.食物時常含在口腔內過長時間，而不易吞下2.口腔閉合度不佳導致食物易隨口水或舌頭動作流出口腔外三、其他相關徵兆：1.癲癇發作頻繁(一天兩到三次)2.頻繁不明原因發燒(尤其是低溫發燒，如：37.2∼37.5度)3.反覆性的肺炎4.體重急遽減輕(如：一個月內減輕百分之五)並藉由「安全進食有撇步，2不1要『腸』健康」，提高用餐安全1.專心吃飯，「不」看電視。2.安靜吃飯，「不」說話。3.湯泡飯「要」瀝乾。　保健課聯絡方式：(02)2861-1380分機302 謝職能治療師
