- - 105年3月1日以前水費應繳總金額如何計算?
  - 105年3月1日以前水費應繳總金額如何計算?應繳總金額＝基本費＋用水費＋代徵一般廢棄物清除處理費（本處轄區用戶已停徵）＋代徵污水下水道使用費（接用污水下水道系統用戶）＋水源保育與回饋費＋加壓設備維護管理費（本處接管集合社區及配合市辦山坡地重劃之自來水用戶）。茲以現行水費價格表為依據，舉例試算用戶水費應繳總金額如下：設臺北市一般用戶之水表口徑為20mm，已納入污水下水道處理系統，某月用水量為25立方公尺(度)，當月份之水費應繳總金額計算方式為：1. 用水費(含營業稅)：5.2元【21-60度單價】＊25度- 4元【累進差額】=126元2. 基本費(含營業稅)：68元3. 水源保育與回饋費=未稅用水費＊附徵百分比=126/1.05＊10%=12元4. 代徵下水道費=5元＊25度=125元當月份之水費應繳總金額=126+68+12+125=331元☉查詢最近12期水費資料請按此 ◇ 水 費 查 詢 ◇☉用水量級別及累進計費價格表(每戶每月)用水量級別基本費使 用 水 量 及 累 進 單 價水量及水價一二三四五用水量(立方公尺)照下表計算1∼2021∼6061∼200201∼1,0001,001以上每立方公尺單價(元)5.005.205.706.507.60累進差額(元)－4.0034.00194.001,294.00說明：一、市政用水照5折計收。二、臨時用水加50%計收。三、表內單價依照加值型及非加值型營業水法之規定內含5%營業稅。四、水費金額計算至元為止，元以下按四捨五入計算。☉基本水費表（每戶每月）水表口徑(mm,毫米)132025405075100150200250300以上基本費(元/月)17681263746801,8363,63810,09820,06035,42855,590※層奉內政部83.2.25台(83)內營字第8301667號暨台北市政府83.2.26府水財字第83012260號函核定，自83年3月1日起實施。※本處現行除大用水戶每月收費一次外，餘均採二個月收費一次，基本費亦採二個月計收。☉清除處理費清除處理費費率表代徵地區臺北市新北市中和區、永和區、新店區、三重區及蘆洲區汐止區代徵費用(元/度)89年7月1日起垃圾費隨袋徵收，詳說明(3) 3.73.7備註　1、88年7月份起2、永和區98年7月1日起改採隨袋徵收。3、中和區及三重區99年7月1日起改採隨袋徵收。4.新店區及蘆洲區自99年12月1日起改採隨袋徵收。1、90年12月份起2、汐止區自99年12月1日起改採隨袋徵收。說明：(1)意義說明：政府基於使用者或污染者付費原則，為有效清除、處理廢棄物，改善環境衛生，依廢棄物清理法規定，應向指定清除地區內居民徵收費用。(2)新北市實施清除處理費隨水徵收：A.本處依據「一般廢棄物清除處理費徵收辦法」第11條規定，接受新北市政府委託，代徵清除處理費，並依同法第3條規定向自來水供水區內用戶代徵清除處理費，依其實際用水度數計算之。代徵費用係由行政院環保署視實際清除、處理成本變動情形公告調整之。※ 清除處理費=實際用水度數＊3.7元B.永和區自98年7月1日起實施家戶垃圾隨袋徵收，同步停止隨水費附徵。C.中和區及三重區自99年7月1日起實施家戶垃圾隨袋徵收，同步停止隨水費附徵。D.新店區及蘆洲、汐止區自99年12月1日起實施家戶垃圾隨袋徵收，同步停止隨水費附 徵。(3)臺北市實施垃圾費隨袋徵收 ：自89年7月1日起，為配合臺北市政府環境保護局推動垃圾費隨袋徵收政策，原來隨自來水費附徵之垃圾費同時停徵。(4)軍眷用戶清除處理費按普通(一般)用戶計費標準以實際用水度數計算徵收之。※若有疑義請洽新北市請洽新北市政府環境保護局。電話：29558191☉ 水源保育與回饋費 = 用水費 ( 不含營業稅 ) ＊附徵百分比 (%) ( 水源保育與回饋費自 95 年 1 月 1 日起實施， 開徵至今附徵百分比皆為 10%)☉分段加壓維護管理費收費標準：※本處接管集合社區及配合市辦山坡地重劃區之自來水用戶應繳自來水加壓設備管理維護費，收費敘述如下：臺北市：一段加壓每度2.5元，每增一段加收3元。(本項自104年1月1日起施行)新北市：一段加壓每度3.5元，每增一段加收3元。(本項自94年1月1日起施行)※備註：以下各項自104年1月1日起施行1.臺北市中低收入戶免收分段加壓維護管理費。2.臺北市內湖區西康里高地社區用戶位於山坡地保護區且為非營業用戶免收分段加壓維護管理費。
- - 梅庭「聽音樂會送納涼竹扇」活動辦法？
  - 5/14起活動表演當天推出「聽音樂會送納涼竹扇」活動，參加民眾於每週六的音樂會開始前３０分鐘索取號碼牌，活動結束後憑號碼牌領取納涼竹扇1支，每場數量有限，送完為止。
- - 梅庭「打卡贈送限量紀念明信片」活動辦法？
  - 5/14至7/16展覽期間，到梅庭參加「打卡贈送限量紀念明信片」活動，憑打卡紀錄即可向梅庭遊客中心櫃台索取紀念明信片1張，每天限量50份，送完為止。
- - 邱素貞瑜伽天地無預警停業案問答集
  - Q1.邱素貞瑜伽天地班系於臺北市之9家補習班復業及開課情形？A1：目前邱素貞瑜伽天地班系於臺北市轄內之9家補習班均已被撤銷立案。Q2.資融公司是否會催繳帳款？A2：邱素貞瑜伽天地班系合作辦理分期付款之資融公司，僅仲信資融公司，該公司在本局要求下，同意於105年7月31日前暫時停止催繳帳款。Q3.我是使用信用卡刷卡付費，是否須辦理爭議帳款或信用卡賠付程序，辦理時間為何？A3：（1）依據國際信用卡組織的規定，由業者無法提供服務之日起回溯540 天內之交易始可列為爭議帳款。如果學員當初購買課程係以信用卡付款交易，而尚未繳納款項者，學員得向發卡銀行主張列為爭議款項，暫時停止對銀行支付該筆款項。學員如就刷卡金額已繳納款項者，可循信用卡賠付程序（charge back）要求發卡銀行按未上課比例退還款項。（2）依據國際信用卡組織的規定，爭議帳款請求時間為業者停止服務日後120天內須向發卡銀行提出，就須申請爭議帳款之學員，應把握上述期間向發卡銀行提出申請列為爭議帳款。Q4.如果我想退費，我能拿回多少金額及要等多久才能拿回?A4：（1）參照短期補習班補習服務契約書應記載及不得記載事項第14點規定，應按賸餘課程時數比例退還當期開班已繳費用。以購買福氣卡（5年不計堂）之學員為例，若該學員係於103年1月1日開始上課，以6個月為1期計算，共計10期，該學員至104年12月31日已上完4期，就此4期已無法退費，就第5期部分，因歇業補習班於歇業前就第5期實際開課期間為105年1月1日至4月27日，故該期應按賸餘課程時數比例退還當期已繳費用。就未開課之第6至10期，補習班應全額退費。（2）目前臺北地檢署已就邱素貞瑜伽天地相關班系之負責人陳玉芬之財產禁止處分，須待臺北地檢署撤銷禁止處分，且不動產部分尚須出售，該負責人始有現金予以退費。Q5.邱素貞瑜伽團體訴訟受理時間及相關表格?A5：（1）台灣消費者保護協會預訂自105年7月6日起至105年8月31日止受理消費者申請參加邱素貞瑜伽團體訴訟，惟八德店於近日始被本府教育局撤銷立案，因八德店撤銷立案受影響之學員，本府消費者服務中心收件截止日期延至105年9月19日。（2）本案團體訴訟相關表格請至台灣消費者保護協會（網址：http：//www.cpat.org.tw/main/modules/MySpace/index.php?sn=cpat&pg=ZC829522）下載。
- - 網路瘋傳近日市府將以飛機灑藥治白蛾
  - 本局進行環境消毒係由消毒班人力徒步逐巷逐弄針對居家週邊環境實施噴藥消毒，未採行使用飛機進行大面積噴灑藥物之消毒方案，故近日網路上之傳言實屬謠言，請民眾勿再聽信及轉傳。
- - 公車票價調漲？
  - 本市聯營公車票價自86年起即維持全票15元、學生軍警票12元、年長身障兒童8元；現行運價自105年4月起調整為每段次18.0993元，運價與票價的差額由雙北市政府編列預算補貼給搭乘的乘客，另基於公車運價調漲未達1元，爰目前仍維持既有票價每段次15元收費。
- - 臺中市區公車持電子票證前10公里免費搭乘？
  - 查臺中市區公車持電子票證前10公里免費搭乘，次查臺中市（含原臺中縣）市區公車計207條路線，每日約34萬人次搭乘；考量本市聯營公車（未含新北市）共285條路線且班次密集，每日近130萬人次搭乘，規模遠超過其他縣市，若採免費乘車之補助，將造成市府龐大財政負擔，為避免排擠其他社會福利預算及推動市政建設的支出，仍以維持使用者付費為宜。
- - 馬上關懷急難救助的服務對象?
  - 一、政策背景本項措施係為落實總統扶窮濟急減少家庭不幸政策主張，運用村（里）在地化通報系統，及早發現遭逢急迫性變故致生活陷於困境之民眾，提供及時經濟紓困。二、服務對象1.負擔家庭主要生計責任者死亡、失蹤或罹患重傷病、失業或因其他原因無法工作，致家庭生活陷於困境。2.其他因遭逢變故，致家庭生活陷於困境。三、服務內容    由本市各相關局處、學校、醫療院所、警察單位、民間社福團體等針對近期生活陷困有救助需求者透過書面方式進行通報，各區公所受理申請案件後，召集訪視小組成員於24小時內進行訪視，訪視完成後即送交區公所進行核定，核予補助者及核發1至3萬元救助金。
- - 事故發生後何時可以申請「馬上關懷急難救助」？
  - 「馬上關懷」的急難事由以最近3個月內發生者，且同一事由以申請1次為限。但經救助後生活仍陷於困境，經訪視評估，認定確有再予救助之需要者，最多得再予一次之救助。
- - 想參加托育(保母)訓練應如何報名?
  - 每逢1月15日及5月15日公告半年期間報名班次於社會局網站www.dosw.taipei.gov.tw(首頁/嬰幼兒照顧服務/托育專業人員相關訓練公告/106年托育(保母)人員訓練)，報名請逕洽訓練單位。
- - 目前臺北市是否有辦理「營造業經濟概況調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「營造業經濟概況調查」係由內政部營建署統籌規劃設計，各縣市政府為協辦機關，負責辦理各該轄區之調查業務。二、調查期間自105年6月1日起至30日止。凡從事營造業經主管機關核准登記有案者，且於104年底仍繼續營業之綜合營造業、土木包工業及專業營造業，均為調查對象。三、該調查主要目的係蒐集營造業最近一年廠商營運遭遇困難、需政府協助事項以及營業收支、完成工程總值、耗用材料總值、固定資產及存貨變動等資料，以了解營造業營運情形及變動趨勢，供為政府釐訂營造業政策及相關服務措施參考。調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請受訪廠商支持合作，提供正確詳實資料。四、該調查結果請逕至內政部營建署網站（http：//www.cpami.gov.tw/）「政府資訊公開 / 主動公開資訊 / 施政計畫業務統計及研究報告 / 營建統計資訊」項下之「營造業經濟概況」查詢。
- - 台北探索館小館長培訓營活動報名方式？
  - 採用線上個人報名哦！網址：http：//goo.gl/forms/g8BlDLGKhqJh1i1k1
- - 台北探索館小館長培訓營報名費用多少呢？
  - 全程免費，不需要報名費用
- - 台北探索館小館長培訓營每梯次錄取名額及備取名額分別是多少人呢？
  - 根據報名時間順序取每梯次前35名為正取35名，第36名至40名為備取5名。
- - 台北探索館小館長培訓營可以團體報名嗎？
  - 報名方式一律只採「個人網路報名」，團體可以一起上網登記報名。
- - 台北探索館小館長培訓營活動內容是?
  - 每一梯次為兩天課程加一天成果發表會，上課標準時間為12小時，第一天以台北探索館為主；第二天則透過主題性展館體驗行程，由各場館解說老師進行導覽實務示範，再由各展館館長與學員分享展館營運經驗，教導小朋友觀看透過實際示範後嘗試進行解說實習；第三天則是在台北探索館進行成果發表以及頒授結業證書。
- - 台北探索館小館長培訓營活動梯次與時間?
  - 無標題文件            梯次    日期    第一天上課地點    第二天上課地點    8/2成果發表會        第一梯次    7/14-7/15     台北探索館     臺北市立美術館      台北光點     台北探索館         第二梯次    7/19-7/20    台北探索館     北投溫泉博物館      梅庭     台北探索館         第三梯次    7/21-7/22    台北探索館     客家文化主題公園      自來水博物館     台北探索館         第四梯次    7/26-7/27    台北探索館     國立歷史博物館      台北228紀念館     台北探索館         第五梯次    7/28-7/29    台北探索館     國立歷史博物館      台北228紀念館     台北探索館   每日早上8點半報到，活動到下午4點結束 
- - 台北探索館小館長培訓營怎麼知道我錄取了呢？
  - 錄取名單將於台北探索館官網進行公告，並且將同步發送EMAIL與簡訊進行錄取通知。若各梯次正取名單於通知錄取回覆時間內未回覆，則通知備取。
- - 台北探索館小館長培訓營一定要出席成果發表會嗎？
  - 凡報名參與之學員皆需完整參與兩天課程及成果發表會，並於各梯次第二天課程結束後三日內至網路填寫活動參與心得及填答活動問卷。活動三日確實出席，且完成指定作業者，於成果發表會當日頒發結業證書，若無故缺席者將不予以頒發結業證書。
- - 台北探索館小館長培訓營要怎麼拿到結業證書呢?
  - 本計畫之參與學員應達到下列項目，方才獲得結訓資格：1.每天需完成簽到與簽退。2.必須於訓練結束後三日內上網填寫200字心得報告表單及滿意度問卷。3.需以個人帳號打卡「台北探索館」，並且分享一張以上之參與活動之照片。4.須參加成果發表會完成上述四點者，將於成果發表會頒發結業證書。
- - 「臺北市補助創業團隊出國參與創業計畫」之目的為何？
  - 為鼓勵本市新創團隊積極拓展國際視野，並透過跨國多元創意交流，建立國際資源網絡，臺北市政府產業發展局訂定「臺北市補助創業團隊出國參與創業計畫申請須知」，協助本市具潛力之新創團隊進駐國外加速器、參與國際創業活動或育成中心培訓計畫，以與國際接軌，開拓國際市場，同時激勵本市國際創新創業風潮。產業發展局聯絡人：鍾文賓；電話：1999(外縣市02-27208889)轉4542臺北市創業服務辦公室電話：1999(外縣市02-27208889)轉6498、1431
