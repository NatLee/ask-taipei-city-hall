  - 請至臺北市殯葬管理處網站(http：//mso.gov.taipei/)/主選單/申辦案件/臺北市民e點通/殯葬服務服務列表選取第2頁/殯葬服務業申請跨直轄市、縣（市）營業備查/下載相關表格。表格與應附繳文件皆需2份。
- - 如何申請多元環保葬鼓勵金？
  - ◆申請對象及方式：   自本處經管之骨灰（骸）存放設施領回寄存之骨灰（骸）者，於領回之次日起2個月內，於環保葬區域完成多元環保葬，得申請多元環保葬鼓勵金。     ※環保葬鼓勵金之申請人原則上為骨（灰）骸存放設施寄存遷出證明所示之原申請人；但骨灰（骸）由代理人代為遷出者，則鼓勵金之申請人應為晉塔之原申請人。    申請本鼓勵金者，應於完成多元環保葬之次日起1個月內填具申請書，並檢附下列文件至本處第一、二殯儀館服務中心、陽明山臻善園或富德靈骨樓辦公室提出申請；由代理人代理申請，另應檢附代理人之身分證明文件及委託書。     如申請文件不足本處將通知申請人限期補正，逾期未補正者，即無法受理。  ◆ 應備文件：     申請書及領據。    環保葬主辦機關（構）開具之完成環保葬證明文件。     骨（灰）骸存放設施寄存遷出證明影本（骨灰（骸）由代理人代為遷出者，另應檢附原申請人出具之遷出委託書影本）。     申請人身分證明文件（影本乙份留存，正本核對後發還）；由代理人代理申請，另應檢附委託書（含代理人之身分證明文件）。     申請人金融機構帳戶影本。 
- - 如欲查詢相關殯葬之制度管理及設施管理等資料管道為何？
  - Q：如欲查詢相關殯葬之制度管理及設施管理等資料管道為何？A：如對本處或第一、第二殯儀館服務有任何疑問或建言，可利用以下地址、電話或電子信箱與我們聯繫：              本處殯儀管理課及第二殯儀館：臺北市辛亥路三段330號。          電話：殯儀管理課：87329720，第二殯儀館：87329792。        第一殯儀館：台北市民權東路二段145號電話：25131057        本處電子信箱 fbm_master@mail.taipei.gov.tw並經由本處網頁www.mso.taipei.gov.tw與我們聯絡。              
- - 請問探視大體的時間為何？非親屬可前往探視嗎？
  - 申請人及親友探視遺體時段由上午8點至晚間10點止，每次探視時間以5分鐘為原則，探視大體以申請人及親友為限。
- - 生前欲指定朋友辦理身後事之手續？
  - 依臺北市市立殯葬設施使用管理辦法第5條之規定：「申請使用殯儀館、禮廳或火化場者，應符合下列條件之一：一、死亡者之親屬或生前以遺囑指定為其辦理喪葬事宜之人。……。」故若欲將後事交由無親屬關係者辦理，建請亡者於生前預立遺囑指定身故後之喪葬事宜辦理人，並建議將遺囑交由法院公證。如未預立遺囑，尚需經本處函詢戶政及警政機關確認無親屬，或雖有親屬而不願為亡者辦理喪葬事宜時，始得辦理。
- - 一櫃多罐收費基準為何？
  - 第一罐依「臺北市市立殯葬設施及服務收費基準表」收費，使用第二罐以上，每增加一罐以第一罐四分之一計收使用費。申請人應於申請許可後3日內繳納使用費，逾期未繳納者，許可處分失其效力。繳納使用費後應於3個月內存放骨灰，逾期未存放者，得廢止其許可處分，並就已繳納之使用費扣除10分之1後退還。
- - 一櫃多罐有無相關規定或限制？
  - 因櫃位空間有限，使用骨罐應以質輕且不易碎裂材質為主。骨灰(包含首位存放之骨灰)須經本處代為研磨處理後放置於特定規格之骨罐內。(一)採一櫃兩罐者，規格為高25cm、直徑13.5cm以下，重量：空罐4kg以下。(二)採一櫃四罐者，規格為高25cm、直徑12cm以下，重量：空罐2kg以下。(三)採一櫃多罐者，規格不限，惟骨罐(含骨灰)總重量不得高於18kg。
- - 一櫃多罐使用年限為多久？
  - 櫃位使用年限為50年，首位骨灰存放終止時，其後增加存放之骨灰存放期限併同終止。首位骨灰領回時，其他骨灰應一併領回，櫃位由本處無償收回。
- - 臻愛樓實施一櫃多罐不再受理一櫃一罐嗎？
  - 為解決家屬需求增加一櫃可寄存多罐措施，並無排除一櫃一罐之寄存使用。
- - 如何取得一櫃多罐資訊？
  - 本措施預定實施時間為「台北市殯葬設施使用管理辦法」修正案通過並公告後三日生效實施，相關資訊屆時公告於本處網站（http：//mso.gov.tw/）。如有任何疑問請逕電殯葬處墓政管理課洽詢。(電話：(02)8732-9708∼15八線)
- - 為何要辦理ㄧ櫃多罐？
  - 為保障本市往生市民權益，陽明山臻愛樓寄存限制為本市往生市民，惟為紓解本市櫃位不足的壓力，也回應民眾想把不同居住地除籍之父母、親友骨灰放在一起的期待，研擬開放ㄧ櫃多罐新措施。
- - 本市富德靈骨樓及陽明山靈骨塔也可適用ㄧ櫃多罐？
  - 使用ㄧ櫃多罐措施必增加建物及骨櫃存載負荷，富德靈骨樓及陽明山靈骨塔均屬老舊建物且已滿櫃，為安全性考量，不適宜實施ㄧ櫃多罐措施。
- - 一櫃多罐如何申請？
  - 須為亡者之配偶或三等親屬、不限除籍地、惟仍須獲原申請人同意。(一)臻愛樓已寄存骨罐者，另有使用一櫃多罐需求，應備亡者除戶資料(不限本市籍，但須為亡者三等親屬)、原申請人同意書，向臻愛樓提出申請。(二)新申請者有一位須為本市籍，其餘需與前亡者有三等親關係，應備文件同上。
- - 《續修臺北市志》纂修之起迄年代為何？內容包含有幾志？
  - 1.本續修市志以民國71年1月為上限，下迄民國100年12月底，並兼採「詳今略古」原則，民國71年以前之記敘僅適當略述不逾百分之十。2.全志除卷首及卷尾、卷一大事紀外，共有八志（志各一卷），合計11卷33篇（大事紀視同一篇）。八志依序為《土地志》、《政事志》、《經濟志》、《交通志》、《社會志》、《教育志》、《文化志》、《人物志》。
- - 我想要捐贈金錢或物資給育幼院，請問可以捐給哪些單位？
  - 本市7家立案育幼院，可依您所在地域方便性或去電瞭解其需求後選擇捐贈：1、財團法人中華文化社會福利事業基金會台北兒童福利中心3765-2575。2、財團法人臺北市私立華興育幼院2833-0150。3、財團法人臺北市私立義光育幼院2304-5561。4、財團法人臺北市私立體惠育幼院2871-5276。5、財團法人臺北市私立伯大尼兒少家園2939-6396。6、財團法人基督教聖道兒少福利基金會附屬台北市私立聖道兒童之家2820-0002。7、財團法人忠義基金會附設臺北市私立忠義育幼院2930-9581。
- - 發現有兒童及少年(含發展遲緩或身心障礙者)無父母或父母失聯，需緊急送醫者。
  - 立即撥打119，並聯繫本市家防中心(23961996分機226至228)處理。
- - 2017世界大學運動會開閉幕活動QA
  - 2017世界大學運動會開閉幕活動QA一、開幕活動時間、地點？入場時間？A：活動時間：8/19 18：00-21：45地點：臺北田徑場觀眾入場時間：16：30進入田徑場民眾皆需經過安全檢查，敬請於活動開始前提早入場。二、開、閉幕禁止攜帶物品A：舉例如下，詳細請參看附件違禁品清單。 禁止攜帶瓶裝液體。入場後將提供瓶裝水1瓶，現場並有飲水機及輕食飲料販售，可多加利用。禁止攜帶超過505050㎝之提包及腳架(含自拍棒)。攜入旗幟長不得超過2公尺、寬不得超過1公尺。禁止攜帶哨子、氣笛(含氣瓶加油喇叭)、雷射筆等妨害他人觀賞之物品。禁止攜帶爆裂物、化學危險物品、易燃、易爆物、尖銳物等。三、場內有販賣食物嗎？有飲水機嗎？A：場內設有觀眾餐飲販售處，並有飲水設備。四、可以帶食物進去嗎？A：可攜帶食物，但由於要進行安全檢查，請盡量避免攜帶過多物品進場。五、開、閉幕周邊交通管制措施A：當天下午3點開始，田徑場周邊八德路、敦化南、北路、南京東路、北寧路、長安東路實施交通管制，一般車輛無法進入，敬請參與民眾搭乘大眾交通工具，由捷運小巨蛋站出站，依循指引人員指示抵達會場。交通管制至當晚12點止。六、我的票座位區是E開頭，從哪個捷運站較近？A： 座位區E請走捷運小巨蛋站3號出口七、我的票座位區是N開頭，從哪個捷運站較近？A： 座位區N請走捷運小巨蛋站2號出口八、我的票座位區是W開頭，從哪個捷運站較近？A： 座位區W請走捷運小巨蛋站2號出口九、閉幕活動時間、地點？入場時間？A：活動時間：8/30 18：30-21：30 地點：臺北田徑場 觀眾入場時間：17：00
