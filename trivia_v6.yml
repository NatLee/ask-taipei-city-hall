- - 社會局受理捐款的流程為何?
  - ※感謝您對弱勢者的關心與支持，本局接受民間捐款之郵政帳劃撥帳號為18898514，戶名為「臺北市政府社會局」,接受民間捐款項目均依捐款人指定用途專用，您可於劃撥時註明捐款用途，如：急難救助、社會救助、身心障礙福利、老人福利、婦女福利、兒童福利或少年福利等，以便本局辦理。欲詢問有關捐款事宜請直撥市話1999(外縣市02-27208889)轉分機1647或6994。※捐款人至郵局填寫郵政劃撥儲金存單，註明姓名、地址、金額及捐款用途後辦理匯款作業，俟郵局將劃撥儲金存單影本寄交本局後，本局於6個工作日內將捐款收據函寄捐款人收執。匯款時無需再支付任何手續費用，惟郵局需視捐款人捐款額度後，再由郵局將該筆劃撥帳戶中扣除（1000元以下扣手續費15元，逾1000元扣手續費20元）手續費。※有關殯葬、捐棺等捐款事項請逕洽臺北市殯葬管理處02-87329686，該處郵政劃撥帳號為：14874689，戶名為：臺北市殯葬管理處。
- - 民眾如發現野生動物該如何處置？
  - 確保本市野生動物多樣性　保障市民與野生動物共生權力對於部分人來說，臺北市是座「水泥森林」；事實上臺北市的野生動物種類豐富，包括超過86種鳥禽類、19種哺乳類動物、55種兩棲爬蟲類動物品種，足可滿足富研究精神的自然學家。動保處從101年至103年底總共收容9,469頭野生動物，其中約60%動物經檢視正常或經療養康復後，放歸自然，重過野外生活。在接獲「野生動物受傷」通報時，動保處動物救援隊往往是第一時間到達現場的人；處理時以減少動物不必要的痛苦為最大準則，並為牠們提供棲息處和照料。這些野生動物遇上的麻煩通常為：如被車撞到、飛撞玻璃窗、被困於人造建築物，有些則是在遷徙時因氣候而被迫降落，或因本身無法在物競天擇的環境下生存。動保處在捕獲野生動物後，先進行評估，如是受到重大創傷，要防止牠們再次受傷和受苦；如有康復的可能，就近送去合約獸醫診療機構接受治療；另如有重症的保育類野生動物，多後送臺北市動物園進行即時救傷、診療照護、暫時收容。待等動物體能恢復，如為鳥類，則請社團法人台北市野鳥學會依其生活習性於相似棲息地野放；若為兩棲爬蟲類，則請臺北市立動物園收容；而其他動物或外來種動物則請新竹市立動物園、屏東科技大學保育類野生動物收容中心、國立宜蘭大學動物科技學系、中興大學獸醫教學醫院等協助收容。自101年至103年，動保處總計轉交1,742頭野生動物至後續收容中心等協助收容照護，包括射紋陸龜、澤巨蜥、吸蜜鸚鵡等。從101年至103年底，動保處收容的5,724頭的野生動物成功返回大自然，當中包括猛禽類動物如遊隼、鳳頭蒼鷹，也有一些哺乳類動物如白鼻心、穿山甲。這些成功案例表示，收容的野生動物中大部分都能回歸自然，動保處在協助臺北市野生動物重獲自由方面，擔當重要角色。野生動物是大自然生態系的一員，也是其中食物鏈的一環。如在自然狀況遭遇其他動物獵食，請不要干涉。一般幼弱的動物有成年動物伴同，故發現時不要馬上出手撿拾，可在附近稍做觀察，正在休息的動物也不要打擾牠。如果排除上述狀況，而動物確實有明顯不適，歡迎市民撥打87913064或87913065由臺北市動物保護處動物救援隊來提供救援服務。另外動保處呼籲民眾，野生動物是大自然的一員，不要私自以飼養目的捕捉回家，以”不捉、不摸、不餵”為原則，保障市民與野生動物共生權力。
