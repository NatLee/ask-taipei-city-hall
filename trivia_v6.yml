- - 商家遇到自稱是商業處人員前往稽查時該如何辨別真偽？這項稽查會事先通知嗎?如果負責人不在可拒絕受檢嗎?
  - 依據商業登記法第9條第2項規定：「前項及其他依本法規定應登記事項，商業所在地主管機關得隨時派員抽查；商業負責人及其從業人員，不得規避、妨礙或拒絕。」第34條規定：「商業負責人或其從業人員違反第9條第2項規定，規避、妨礙或拒絕商業所在地主管機關人員抽查者，其商業負責人處新臺幣6,000元以上3萬元以下罰鍰。」，商業處稽查人員依照這兩項規定執行稽查，不會發公文通知業者，但是稽查時會主動出示識別證表明身份並說明來意，稽查後會現場製作稽查紀錄表，等業者或現場管理人閱覽並簽名後將紀錄表1份交給業者留存。
- - 如民眾反映新北市所轄的公車路線應如何處理?
  - 本處如接獲民眾反映新北市轄公車違規，均會函轉交由該主管機關(新北市政府交通局)查處，惟因公文函轉時間恐未能及時保留公車行車影像記錄，並延長辦理時效及結案日期，致影響民眾權益，建議話務人員可透過5284我愛巴士（http：//www.5284.com.tw/Dybus.aspx）、本處公車動態資訊系統（http：//www.e-bus.taipei.gov.tw/index_6_1.html）及新北市政府公車動態資訊系統（http：//e-bus.ntpc.gov.tw/）等網頁查詢，另國道公路客運路線號碼皆為四碼，可透過公路客運乘車資訊查詢系統 (http：//taiwanbus.tw/Default.aspx)查詢；倘為本市聯營公車則依程序錄案辦理，若為新北市轄公車，盡可能建議民眾可直接向新北市政府交通局(聯繫電話02-2960-3456)反映；若為國道客運，建議直接向公路總局 (聯繫電話0800-231-035) 反映，使民眾能快速得到答覆，造成不便，敬請見諒。
