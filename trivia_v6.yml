- - 「日本松山市撞轎祈福活動」今年的特色有哪些？
  - 此次活動由松山市道後八町「道後村大神轎會」、「持田連合大神轎會」、「小唐人大神轎」及「北小唐人大神轎連合會」等4支隊伍帶來4頂大神轎及400位轎手與工作人員，每頂轎重達600~700公斤，造價約日幣600~700萬。撞轎祈福活動將在臺北原汁原味呈現，民眾可欣賞神轎指揮者精彩生動的姿態，並感受扛轎者充滿男子氣概的活力，一窺代表松山市充滿生命力的獨特祭典。在撞轎祈福前，會先進行踩街，踩街過程中，扛轎者會上下左右用力搖動神轎的靈魂，以祈求五穀豐收、生意興隆。到了定點後，各隊會扛著神轎進行數次激烈的撞轎儀式，撞轎時兩方人馬互不相讓的畫面令人熱血沸騰、印象深刻！
- - 為什麼日本松山市撞轎祈福活動會來臺舉辦？
  - 臺北市松山區與日本愛媛縣松山市有同名之緣，96年起開始交流，103年10月雙方簽訂友好交流協議，松山市為慶祝與臺北市友好交流協議滿1周年，且應臺北市政府觀光傳播局邀請，「松山市大神轎－道後八町撞轎祈福活動」將再次在臺北演出。另外，松山慈祐宮99年起已與松山市友好交流，101年松山慈祐宮等單位對東日本大震災受災地支援的義援金（約2,800萬日元）交由松山市代轉，102年松山慈祐宮與日本松山市共同出資製作「松山-道後溫泉祈福機械鐘」贈予臺北市，現設置於松山慈祐宮前與松山國小前的廣場，102年臺北松山車站與日本松山車站簽署姐妹車站。臺北市新北投溫泉與松山市道後溫泉於100年簽署姐妹溫泉，「松山市大神轎－道後八町撞轎祈福活動」並於同年首度在新北投演出。
