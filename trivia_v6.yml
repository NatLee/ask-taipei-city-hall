- - 交通違規罰鍰是否可以分期繳納？應備文件？
  - 1.交通違規罰鍰如無法一次繳清，可辦理分期繳納，惟未滿20歲者，須由法定代理人代為辦理。   2.辦理分期繳納相關規定：   　(1)分期繳納每期以1個月計算，且總分期數不得逾18期，每期繳納罰鍰金額(除最後1期外)，不得低於新臺幣500元。核准後應即  　　繳納第1期罰鍰金額。   　(2)分期繳納罰鍰期間因故無法按期繳納者，得於當期屆滿前，向本所申請延期繳納剩餘期數之罰鍰；申請延期繳納以1次為限，  　　延期繳納期間並不得超過1個月。   　(3)如為酒後駕車應繳清後始得憑收據領回車輛，但初次違反規定且未發生交通事故者，於申請分期繳納第1期罰鍰金額後，得檢  　　附繳納罰鍰收據領回車輛。   　(4)分期繳納期間，汽車所有人或駕駛人於繳納第1期罰鍰金額後，公路監理機關得先註記其申請除車輛過戶外之車輛停駛、復  　　駛、繳交牌照、註銷牌照、換發牌照或駕駛執照。   　(5)受處分人經核准辦理分期，如有1期未按時繳納，或逾繳款截止日未全數繳清，視同全部到期，其尚未繳納之罰鍰，則依規定  　　移送強制執行。   3.應備文件：   　(1)列管於個人車籍或駕籍違規案件：   　　本人請備身分證明文件及印章。   　　受任人須附委任書、雙方身分證明文件及印章；法定代理人須附委任書、雙方身分證明文件及印章。   　　受處分人未滿20歲且法定代理人無法親自至本所辦理者，受託人須附委任書以及受處分人、法定代理人與受任人本人身分證  　　明文件及印章。   　(2)列管於公司車籍違規案件：   　　請備身分證明文件   　　負責人（備身分證明文件）公司大小章。 　　受任人（備身分證明文件）須附委任書及公司大小章。
