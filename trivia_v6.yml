- - 「自己的旅遊城市自己拍」影片及照片徵選活動網站的網址為何？
  - 可上網搜尋「自己的旅遊城市自己拍」影片及照片徵選活動，都能夠連結到活動網址。                          活動網址：http：//tourcity.travel.taipei/
- - 「自己的旅遊城市自己拍」影片及照片徵選活動如果我想問活動相關事宜怎麼聯絡徵件小組？
  - 電話：(02)2913-5533#603 自己的旅遊城市自己拍 徵件小組(服務時間：上班日週一至週五 上午十時至下午六時來電)
- - 「自己的旅遊城市自己拍」影片及照片徵選活動在哪邊能夠獲得活動辦法詳細規範的資訊呢？
  - 活動辦法可以自活動網站(http：//tourcity.travel.taipei/)上方選單選取平面攝影、影片報名後點選子選單的活動辦法，就能看見詳細規範。
- - 民眾沒有在期限內繳納地價稅會有甚麼後果？
  - 依稅法規定，納稅義務人未於稅單所載限繳日期內繳清應納稅款者，每逾2日按滯納數額加徵1%滯納金，逾30日仍未繳納者，除加徵15%滯納金外，會依法移送強制執行。
- - 如何搭乘臺北市敬老愛心車隊之計程車？
  - 撥打臺北市敬老愛心車隊智慧型叫車轉接系統免付費專線0800-055850或手機直撥55850。搭乘本車隊計程車欲享有政府提供優惠，需確認敬老(一)或愛心(一)悠遊卡內尚有免費段次，且記得在票卡內加值足夠支付該趟車資之金額。加值方式與一般悠遊卡相同，可選擇至捷運站自行加值（不限金額），或至便利超商請店員幫忙加值（7-11、全家、OK、萊爾富每次加值金額均為100元的倍數）。
- - 地上權住戶與房客，要如何減輕地價稅負擔？
  - 依稅法規定，地價稅之納稅義務人為土地所有權人。是地價稅係向土地所有權人發單課徵，與地上權住戶或房客無涉。
- - 土地被他人占用，自己並沒有使用，為什麼還要繳地價稅？
  - 依稅法規定，地價稅的納稅義務人為土地所有權人。土地如有被占用情事，土地所有權人可向稽徵機關申請由占有人代繳地價稅，申請時應檢附占有人姓名、住址、土地坐落及占有面積等有關資料，惟如占有人有異議時，在相關資料未能確定前，仍應向土地所有權人發單課徵。
- - 土地是我的，蓋房子為什麼還要繳地價稅？或土地沒有使用，為什麼還要繳地價稅？
  - 依土地稅法規定，已規定地價的土地，除依規定課徵田賦者(目前停徵)外，應課徵地價稅，所以本市土地除符合課徵田賦外，都要課徵地價稅。又本市稅收是全數用於各項公共建設，包含環境與居住品質、健康與醫療保健、教育與文化休閒、民政與社會福利、交通與基礎建設、就業與經濟發展等方面，以提供更完善的公共設施及福利制度。
- - 房屋都已經沒有營業了，為什麼沒有按自用住宅用地稅率課徵，還一直課一般稅率？
  - 適用自用住宅用地稅率課徵地價稅的規定是以申請為要件，所以原供營業使用的土地，在?有營業時，如果已辦竣戶籍登記，且其他要件也符合自用住宅用地規定，仍必須重新申請並經核准，才能再適用自用住宅用地稅率課徵地價稅。
- - 如何減輕地價稅負擔？
  - (一)土地稅法所稱自用住宅用地係指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。自用住宅用地稅率為2?，相較於一般土地按10?至55?累進稅率課徵，稅額至少相差4倍以上。另供工業、加油站、停車場等直接使用之土地，則按10?稅率課徵地價稅。(二)納稅義務人所有房地如適用特別稅率課徵地價稅，應於地價稅開徵40日前(9月22日以前)向本處及所屬各分處提出申請，經核准後，當年度開徵之地價稅，即可適用優惠稅率課徵。
- - 地方政府是否為籌編預算收入調高地價稅？
  - 地方稅為地方政府重要的建設經費，多用於推動地方福利、公共事務等施政措施。近年都會區房價高漲，各界多歸責於土地稅基「偏低」問題，地價稅適度調整，將有助於抑制土地投機，促進土地有效利用，並增進土地持有賦稅公平。本市於查估地價時已充分考量當年公告土地現值、前次公告地價、地方財政需要、社會經濟狀況及民眾地價稅負擔能力等原則據以辦理，以適度合理反映市場交易價格變動情形。
- - 我的房屋是自用住宅，今(105)年的地價稅會增加多少？
  - 自用住宅用地按2?固定稅率計徵地價稅，本市105年公告地價平均調漲30.38％，如果持分土地不變，會較去年增加3成左右負擔，經查本市104年自用住宅平均每戶地價稅稅額約3,800元，因公告地價調漲，增加稅額約1,100餘元。
- - 105年至107年累進起點地價4,170萬9,000元是如何計算的？
  - 依平均地權條例第14條及第18條規定，土地公告地價每3年重新規定一次，累進起點地價是以每一直轄市或縣(市)土地7公畝的平均地價為基準，但不包括工業用地、礦業用地、農業用地及免稅土地在內。
- - 本市105年公告地價調幅30.38%，為什麼我增加的地價稅幅度遠大於30.38%？
  - 本市12個行政區調整的幅度不一，經濟繁榮程度及公共建設愈完備的地區，公告地價調整的幅度愈高，因此如果持有的土地是在較繁榮的區域，地價稅上漲的幅度會較高。臺北市12個行政區公告地價調幅表  行政區  地價調幅  行政區  地價調幅  松山區  35.02%   中山區  31.37%  信義區  34.11%  內湖區  29.97%  大安區  36.19%  南港區  31.44%  中正區(古亭區)  29.98%  文山區(木柵區)  22.38%  萬華區(雙園區)  23.11%  士林區  27.80%  大同區  26.60%  北投區  22.86%資料來源：臺北市政府地政局
- - 公告地價調整與地價稅關聯為何？
  -     (一)        依平均地權條例規定，公告地價係由直轄市、縣(市)政府依平均地權條例、地價調查估計規則等相關規定辦理地價調查估計及評議，調查情形衡量各項影響地價因素，查估結果應核實反映市場地價動態，評議時已綜合考量地方財政需要、民眾地價稅負擔及社會經濟狀況等因素，以適度反映市場交易價格變動，並達成地利共享之目標。    (二)        地價稅的計徵是依申報地價x課稅面積x適用稅率，而申報地價原則上是公告地價8成，所以公告地價是地價稅核課的基礎。    (三)        另地價稅按每一土地所有權人在每一直轄市或縣(市)轄區內所有之土地合併計算地價總額計徵，土地愈多或土地價值高，負擔的稅額也愈高。
- - 請問臺北市老人健保費補助需要申請嗎?
  - 針對年滿70歲以上長者、55歲以上原住民及104年12月31日(含)前年滿65歲以上長者或設籍本市滿1年之當月社會局會主動比對符合資格者，直接將符合補助之名單送給健保局辦理減免。您可於其次月10日以後致電本局老人福利科查詢補助與否。若是因稅率或是居住國內天數條件未符合補助標準，則需另檢附相關證明文件提出申請，經審核通過後於申請當月恢復補助。詳細內容可洽本局局網銀髮族項下/老人健保補助Q&A查詢。
- - 請問如何申請團體參訪(交流)活動?是否接受臨時申請?
  - 團體欲申請本處參訪(交流)活動，以行文方式辦理，文中請敘明參訪(交流)目的、時間及活動聯絡人，經審核其目的及性質與本處成立宗旨相符者，將有專人安排相關行程。未事先申請臨時前來的團體，仍可自由參觀1樓交流角落、5樓青少年藝文沙龍，亦可至B1直排輪場、9樓為攀岩館，購票入場體驗。(單位：交流服務課、承辦人：龔?琁，連絡電話：2351-4078分機1763)
- - 北水處有水車送水服務﹖需要收費嗎﹖
  -     本處水車資源有限，主要以因本處緊急搶修等突發性致用戶無預警停水造成不便而提供免費送水服務之用；一般民眾若因個人因素需由本處水車送水，基於使用者付費原則收取水車送水費(零售水費用另計)。    民眾或單位需要本處提供水車送水服務，請逕向轄區分處修漏股聯繫，申請人需告知無水原因、水量（噸數）、送水時間、地點及申請人(或現場聯絡人)姓名、聯絡電話等，修漏股人員俟確認送水需求後，向本處客服中心通報成案；客服中心人員受理並核算應收費用後，再致電向申請人確認應繳金額、現場現金繳付(水車司機收取現金無法找零，請備妥繳付金額)人員姓名及聯絡方式及預訂送達時間等，確認無誤後派車。    水車司機抵達現場後，與申請人(或現場聯絡人)核實送水資料、簽單及收取費用完妥後，將水注入指定蓄水設備。惟為確保水質如水車留有存水時，本處將逕行放流，民眾不得要求(零售水)核減退費。  收費標準如下：          需求時間項目   費用(元)平日(周一至周五上午8時30分至下午5時30分)下班時間或例假日水車送水費(5噸)3,400 元3,900 元零售水水費依實際取用噸數計收(目前零售水水費每度31元+0.5元水源保育回饋費)備註：一、水車送水為單趟計算標準，連續送水之第2趟以取水點至送水點里程數每公里146元計收，每次出車最高以送水2趟為原則，超過2趟以重新出車收費。二、另需加收零售水水費。三、平日與非上班時間之收費標準，以權責單位通報時間為準。
- - 臺北市老人健保自付額補助資格為何？
  - 一、65-69歲之中低收入老人。二、其他符合下列各項規定之老人：（一）年滿70歲之老人、年滿55歲之原住民或104年12月31日(含)前年滿65歲之老人，且設籍並實際居住本市滿1年者(最近1年居住國內天數需達183天)。（二）老人經稅捐稽徵機關核定之最近1年綜合所得總額合計未達申報標準或綜合所得稅稅率未達20%者。老人由納稅義務人申報為受扶養人而有上開情事者，亦同。（三）未獲政府機關健保自付額之全額補助者。
- - 替代役退役證明遺失如何辦理補發？
  - 替代役退役證明遺失可攜帶身份證至全國各鄉(鎮市區)公所役政單位申請補發，若由家屬代辦，家屬須年滿20歲，並攜帶役男身分證、印章及代辦人身分證。服勤役別如為「已訓警察人員」，需自行向內政部役政署申請補發。
- - 辦理資遣通報方式為何？
  - 目前本局資遣通報可分為2種方式，請擇一辦理即可，說明如下：1.書面申辦：資遣通報表格，請至「本局網站（http：//www.bola.taipei.gov.tw/）首頁\申請案件\臺北市民e點通\勞動服務\資遣通報」後，請點選檔案下載，於跳出視窗頁面下載「資遣員工通報名冊」檔案即可，共有EXCEL、PDF及ODF共3種格式檔案，擇一下載即可。下載後，請參考背面代碼確實依照範例詳填「資遣員工通報名冊」，並請加蓋公司大小章，請準備1式3份，其中，1份自行留存、1份以掛號方式郵寄至本局（地址：臺北市信義區市府路1號5樓北區，臺北市政府勞動局收）、1份以掛號方式郵寄至本市就業服務處（地址：臺北市萬華區艋舺大道101號8樓，臺北市就業服務處收），寄出郵戳日期即為通報日。2.線上申辦：請至本局網站首頁\便民服務\線上申辦，申請加入網站會員，待資訊人員審核後，將回復帳號及密碼，事業單位即可使用線上申辦系統辦理資遣通報，當日凌晨12時以前完成送出通報資料成功，即完成通報程序線上或書面申辦擇一即可，若以採用線上申辦，則無須另外郵寄紙本。聯絡科室：就業安全科承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7030
- - 書面資遣通報名冊要到哪裡下載？
  - 書面辦理資遣通報之表格，請至「本局網站（http：//www.bola.taipei.gov.tw/）首頁\申請案件\臺北市民e點通\勞動服務\資遣通報」後，請點選檔案下載，於跳出視窗頁面下載「資遣員工通報名冊」檔案即可，共有EXCEL、PDF及ODF共3種格式檔案，擇一下載即可。線上或書面申辦擇一即可，若以採用線上申辦，則無須另外郵寄紙本。聯絡科室：就業安全科承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7030
- - 已經寄出或辦理完成資遣通報，要如何進行更正、變更或撤銷？可以直接重新通報嗎？當初通報若是採線上通報可以直接線上辦理更正、變更或撤銷嗎？
  - 事業單位辦理完成資遣通報後，無論原先資遣通報為線上或書面方式辦理，若需要進行通報內容資料變更、更正或撤銷，事業單位均需要以書面方式辦理，請事業單位製作一份簡要說明函，說明事業單位通報情形及通報被資遣員工基本資料（包含姓名、身分證統一編號及出生年月日等基本資料），並註明需變更或更正事項原由，且加蓋公司大小章，共計製作2份，其中，1份掛號郵寄至本局（地址：臺北市信義區市府路1號5樓北區，臺北市政府勞動局收），1份掛號郵寄至本市就業服務處（地址：臺北市萬華區艋舺大道101號8樓，臺北市就業服務處收），切勿重新進行資遣通報。聯絡科室：就業安全科承辦人聯絡電話：1999「限臺北巿境內直撥，外縣巿請撥02-27208889」轉7030
- - 人民團體成立後申請社會局補助應如何辦理?
  - 社會局受理補助申請，係以辦理社會福利事業、委託辦理福利服務及公設民營機構為限，並無補助團體會務之費用。
- - 若敬老（一）或愛心（一）悠遊卡片儲值金額不足，搭乘敬老愛心車隊可以享有市政府補貼優惠嗎？
  - 若敬老（一）或愛心（一）悠遊卡片儲值金額不足以支付享有補貼後之剩餘車資時，將無法使用悠遊卡，因此就無法享有乘車市政府補貼之優惠，而須以現金支付車資。
- - 目前臺北市是否有辦理「汽車貨運調查」？其調查期間、對象及目的為何？
  - 一、「汽車貨運調查」係由交通部主辦，各縣市政府為協辦機關，負責辦理轄區內之調查業務，為定期按半年辦理之實地訪問調查。二、資料調查期間為105年10月16日至10月22日，以登記於臺北市之自用與營業用貨車為訪查對象。三、該調查主要目的係為蒐集臺灣地區自用與營業貨車之貨運流向及流量等動態資料，以供編製全國性及地區間產業關聯表及交通部研擬汽車貨運管理相關措施之參據。四、本調查之資料經彙總統計後，將刊載於交通部編印之「汽車貨運調查報告」內，有關重要統計結果亦將登載於交通部網站（網址：http：//www.motc.gov.tw/ch/home.jsp?id=56&parentpath=0,6）以供各界參考。
- - 香堤廣場禁菸區何時開始禁菸？禁菸的範圍為何？違規吸菸者罰鍰？
  - 為維護民眾健康權益，建構戶外無菸環境，本局依菸害防制法第16條第1項第4款規定公告臺北市信義區「香堤廣場」周邊戶外區域，自105年10月1日起為除吸菸區外全面禁止吸菸場所。禁菸範圍，係位於松高路、松智路、松壽路及松高路20巷間之區域，包括香堤大道、香堤大道廣場、松壽廣場、新光三越百貨台北信義新天地A8館、A9館、A11館之1樓騎樓及地下1樓出入口周邊、微風松高之1樓騎樓及面松高路門口之前方廣場、寒舍艾麗酒店面松高路門口之前方廣場、及實施禁菸措施區域內之周邊人行道（不含松高路20巷之人行道）。違規吸菸民眾，依菸害防制法第31條第1項規定，處新臺幣2,000元至1萬元罰鍰。禁菸公告詳細資訊可至臺北市政府衛生局「無菸健康網」(http：//subweb.health.gov.tw /Nosmoking/)查詢。
- - 目前臺北市是否有辦理「105年婦女婚育與就業調查」？其調查期間、對象及目的為何？如何取得調查結果？
  - 一、「105年婦女婚育與就業調查」係由行政院主計總處主辦，委由各直轄市及縣市政府主計處執行訪查作業。二、「105年婦女婚育與就業調查」調查期間為105年10月16日至25日，調查資料標準時間為105年10月9日起至15日止，調查對象為資料標準時間內居住於臺灣地區之普通住戶與共同事業戶，戶內年滿15歲，自由從事經濟活動之本國籍民間女性人口為對象(不包括武裝勞動力及監管人口)。三、該調查主要目的係為明瞭婦女結婚、生育與家庭組成方面的資料及其參與勞動之情形，俾供政府作為開發女性勞動力、性別工作平權，以及制定人口政策之參考。依統計法第45條規定，調查所獲之個別資料絕對保密，除供整體統計分析用外，不作其他用途，請惠予合作，據實回答。四、該調查結果請逕至行政院主計總處網站（http：//www.dgbas.gov.tw/）「政府統計」項下之「主計總處統計專區」項下之「其他專案調查」項下之「婦女婚育與就業調查」項下之「統計分析」查詢。
