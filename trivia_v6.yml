- - 送交動物之家收容之流浪犬貓是否皆有確實作晶片掃描與通知主人？另未植入晶片之犬貓，飼主要如何查詢是否已遭安樂死處理？
  - 送交動物之家收容之流浪犬貓，皆經獸醫師進行點交、拍照公告、掃描晶片、為評估後分籠飼養，對於查有晶片之犬隻，會透過全國寵物登記管理系統查詢飼主資料，並以電話及郵寄送達方式確實通知飼主前來認領，另就未植入晶片犬隻，因工作人員從電話中描述實無所辨識，仍建議民眾假日抽空前往動物之家查詢，動物之家亦會提供相關資料或紀錄協助查詢民眾愛犬下落或後續處置情形。
- - 為什麼會收到「限期接管通知書」及「施工同意書」？
  - (1)緣起：為加速推動污水下水道建設，衛工處開始分階段執行污水下水道公告可使用地區內之未接管戶裁罰，通知公告地區未接管戶給予6個月期限主動向市府申請接管，未依期限寄回申請書或仍不配合施工規定拒絕接管者，依情節輕重處以新台幣3千元至3萬元之罰鍰。(2)辦理方式：衛工處先函寄接管通知及空白申請接管及施工同意書(採雙掛號，寄至房屋所有權人戶籍所在地)後，再依民眾寄回之已簽具申請接管及施工同意書，由衛工處受理後依序辦理交辦管線會勘、協調施工等相關作業程序，並同時對未寄回申請接管及施工同意書者之住戶，超過6個月期限將依法裁罰並連續加重處分至完成接管為止，至於自費申請接管則須於6個月期限內施工完成並報請衛工處竣工查驗，否則依法裁罰。(3)如有其他問題請電洽2597-3183分機101~106
