version: '2'
services:
    chatbot:
        build: .
        container_name: chatbot_server
        command: python -u mainLocal.py
        ports:
            - "5000:5000"
        volumes:
           - "./src:/chatbot"
        links:
            - db
        networks:
            net:
                ipv4_address: 10.5.0.5
    db:
        image: mongo
        container_name: chatbot_db
        ports:
            - "27017:27017"
        #volumes:
        #    - "./data:/data/db"
        networks:
            net:
                ipv4_address: 10.5.0.6
networks:
    net:
        driver: bridge
        ipam:
            config:
                - subnet: 10.5.0.0/16
                  gateway: 10.5.0.1
