name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pull requests are checked through the pull_request event; plain pushes only
    # matter on the default branch (its name comes from the repository, not this file).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      # The live sources change on the city's side, so check them on every run.
      # A cached copy from an earlier run covers a short outage (see scripts/data/build.ts).
      - uses: actions/cache@v6
        with:
          path: .cache/raw
          key: open-data-${{ github.run_id }}
          restore-keys: open-data-
      - name: Build the FAQ dataset from the live open data
        run: npm run data:build
      - name: Build the site
        run: npm run build
