[loggers]
keys=root, line, fb

[handlers]
keys=defaultHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=DEBUG
handlers=defaultHandler
qualname=root

[logger_line]
level=DEBUG
handlers=defaultHandler
qualname=

[logger_fb]
level=DEBUG
handlers=defaultHandler
qualname=

[handler_defaultHandler]
class=FileHandler
formatter=defaultFormatter
args=('userdata.log', 'a')

[formatter_defaultFormatter]
format=%(levelname)s %(asctime)s %(name)s %(message)s
datefmt=%Y-%m-%d %H:%M:%S
