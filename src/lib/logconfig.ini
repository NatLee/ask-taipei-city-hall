[loggers]
keys=root, line, fb

[handlers]
keys=defaultHandler, console

[formatters]
keys=defaultFormatter

[logger_root]
level=DEBUG
handlers=defaultHandler, console
qualname=root

[logger_line]
level=DEBUG
handlers=defaultHandler, console
qualname=

[logger_fb]
level=DEBUG
handlers=defaultHandler, console
qualname=

[handler_defaultHandler]
class=FileHandler
formatter=defaultFormatter
args=('userdata.log', 'a')

[handler_console]
class=logging.StreamHandler
formatter=defaultFormatter
args=''

[formatter_defaultFormatter]
format=%(levelname)s %(asctime)s %(name)s %(message)s
datefmt=%Y-%m-%d %H:%M:%S
